name: TMP alpha SSOT rootcause 20260813

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/_tmp-alpha-ssot-rootcause-20260813.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only exact canary and executable-path audit
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          LEDGER=/home/z/z/ledger
          cd "$ROOT"
          PYTHONPATH="$ROOT" python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          ledger=Path('/home/z/z/ledger')
          state_path=ledger/'production_family_paper_canary_runner_state_v1.json'
          state=json.loads(state_path.read_text()) if state_path.is_file() else {}
          print('CANARY_TOP',json.dumps({k:state.get(k) for k in (
              'state','runner_version','active_count','pass_count','reject_count','runtime_symbol_precedence','updated_at_ms')},sort_keys=True))
          canaries=state.get('canaries') if isinstance(state.get('canaries'),dict) else {}
          for key,meta in sorted(canaries.items()):
              if not isinstance(meta,dict): continue
              print('CANARY',json.dumps({
                  'canary_key':key,
                  'family_id':meta.get('family_id'),
                  'strategy_id':meta.get('strategy_id'),
                  'alpha_id':meta.get('alpha_id'),
                  'contract_id':meta.get('contract_id'),
                  'status':meta.get('status'),
                  'observation_count':meta.get('observation_count'),
                  'trade_count':meta.get('trade_count'),
                  'symbol_trade_counts':meta.get('symbol_trade_counts'),
                  'runtime_symbol':meta.get('runtime_symbol'),
                  'published':meta.get('published'),
                  'consumed':meta.get('consumed'),
                  'first_not_before_ms':meta.get('first_not_before_ms'),
                  'updated_at_ms':meta.get('updated_at_ms'),
              },sort_keys=True))

          hist=ledger/'production_family_paper_canary_history_v1'
          if hist.is_dir():
              for p in sorted(hist.iterdir()):
                  if not p.is_file(): continue
                  try:
                      if p.suffix in {'.jsonl','.ndjson'}:
                          rows=[json.loads(x) for x in p.read_text(errors='ignore').splitlines() if x.strip()]
                      else:
                          d=json.loads(p.read_text())
                          if isinstance(d,list): rows=d
                          elif isinstance(d,dict):
                              rows=next((d[k] for k in ('observations','history','rows') if isinstance(d.get(k),list)),[])
                          else: rows=[]
                  except Exception: continue
                  symbols={}
                  for r in rows:
                      if isinstance(r,dict):
                          s=str(r.get('symbol') or 'MISSING'); symbols[s]=symbols.get(s,0)+1
                  print('HISTORY',json.dumps({'file':p.name,'rows':len(rows),'symbol_observations':symbols},sort_keys=True))

          required=(
            'ZEL_DATA_STALE_MS','ZEL_ACCOUNT_STALE_MS','ZEL_MAX_DD_DAY_PCT','ZEL_MAX_DD_TOTAL_PCT',
            'ZEL_ALPHA_SIGNAL_STALE_MS','ZEL_PAPER_INITIAL_EQUITY_USDT','ZEL_RISK_DAY_TZ',
            'ZEL_IMPROVE_MIN_TRADES','ZEL_IMPROVE_MIN_EXPECTANCY','ZEL_IMPROVE_MIN_PF',
            'ZEL_IMPROVE_MIN_NET_PNL','ZEL_IMPROVE_MAX_DD_PCT','ZEL_IMPROVE_MIN_SCORE_GAIN',
            'ZEL_IMPROVE_MAX_DD_REGRESSION_PCT','ZEL_IMPROVE_ERROR_BUDGET')
          env={}
          p=Path('/etc/zel/production-paper-loop.env')
          if p.is_file():
              for raw in p.read_text(errors='ignore').splitlines():
                  s=raw.strip()
                  if s and not s.startswith('#') and '=' in s:
                      k,v=s.split('=',1); env[k.strip().removeprefix('export ').strip()]=v.strip()
          core=('ZEL_DATA_STALE_MS','ZEL_ACCOUNT_STALE_MS','ZEL_MAX_DD_DAY_PCT','ZEL_MAX_DD_TOTAL_PCT','ZEL_ALPHA_SIGNAL_STALE_MS','ZEL_PAPER_INITIAL_EQUITY_USDT','ZEL_RISK_DAY_TZ')
          improve=tuple(k for k in required if k not in core)
          print('ENV_GATE',json.dumps({
              'present':sum(k in env for k in required),
              'nonempty':sum(bool(env.get(k,'')) for k in required),
              'core_execution_nonempty':sum(bool(env.get(k,'')) for k in core),
              'core_execution_required':len(core),
              'improvement_nonempty':sum(bool(env.get(k,'')) for k in improve),
              'improvement_required':len(improve),
          },sort_keys=True))

          def cmd(*a):
              try:return subprocess.check_output(a,text=True,stderr=subprocess.DEVNULL).strip()
              except Exception:return ''
          print('SERVICE',json.dumps({
              'active':cmd('systemctl','is-active','zel-production-paper-loop-v1.service'),
              'enabled':cmd('systemctl','is-enabled','zel-production-paper-loop-v1.service'),
              'restarts':cmd('systemctl','show','-p','NRestarts','--value','zel-production-paper-loop-v1.service'),
              'release':str(Path('/home/z/zel-production-current').resolve()),
          },sort_keys=True))
          PY
          REMOTE
