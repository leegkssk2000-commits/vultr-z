name: TMP post729 registry self clean

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/_tmp-post729-registry-self-clean.yml'

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  self-clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELF_PATH: .github/workflows/_tmp-post729-registry-self-clean.yml
      SELF_BRANCH: tmp-post729-registry-clean-20260813
    steps:
      - name: Disable prior temp ghost and this workflow then delete branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          self_path=os.environ['SELF_PATH']; self_branch=os.environ['SELF_BRANCH']
          headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
          }
          def req(url, method='GET'):
              r=urllib.request.Request(url,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      return x.status,x.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()

          # The previous ephemeral verifier deleted its branch but necessarily
          # left one workflow-registry row. It is proven absent from master.
          targets={333174028:'.github/workflows/_tmp-post729-final-verify.yml'}

          self_id=None
          page=1
          while page<=10 and self_id is None:
              status,body=req(f'https://api.github.com/repos/{repo}/actions/workflows?per_page=100&page={page}')
              assert status==200
              payload=json.loads(body)
              for wf in payload.get('workflows',[]):
                  if wf.get('path')==self_path:
                      self_id=int(wf['id']); break
              if len(payload.get('workflows',[]))<100: break
              page+=1
          assert self_id is not None, 'SELF_WORKFLOW_ID_NOT_FOUND'
          targets[self_id]=self_path

          for wid,path in targets.items():
              q=urllib.parse.quote(path,safe='/')
              status,_=req(f'https://api.github.com/repos/{repo}/contents/{q}?ref=master')
              assert status==404,(wid,path,status,'REFUSE_DISABLE_FILE_STILL_EXISTS')
              status,_=req(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/disable',method='PUT')
              assert status==204,(wid,path,status)
              status,body=req(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}')
              assert status==200
              state=json.loads(body)['state']
              assert state=='disabled_manually',(wid,state)
              print(f'DISABLED_TEMP_GHOST workflow_id={wid} path={path}')

          quoted=urllib.parse.quote('heads/'+self_branch,safe='/')
          status,_=req(f'https://api.github.com/repos/{repo}/git/refs/{quoted}',method='DELETE')
          assert status==204,(self_branch,status)
          print(f'BRANCH_DELETE_REQUEST branch={self_branch} status={status}')
          PY
