name: TMP Pre-Survivor First Generation Smoke 20260813

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/_tmp-pre-survivor-first-generation-smoke-20260813.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPECTED_MASTER_SHA: 3c27ee83b1ae1aa94cdb371ff52a4354ae9f70f4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Require one materializable research generation
        run: |
          set -euo pipefail
          KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "KEY_B64='$KEY_B64' EXPECTED_MASTER_SHA='$EXPECTED_MASTER_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          test "$(basename "$(readlink -f "$ROOT")")" = "$EXPECTED_MASTER_SHA"
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          export GEMINI_API_KEY="$(printf '%s' "$KEY_B64" | base64 -d)"
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path

          active=[
              Path('/home/z/z/ledger/production_ai_admission_contracts_v1.json'),
              Path('/home/z/z/ledger/production_ai_admission_observations_v1.ndjson'),
              Path('/home/z/z/ledger/production_ai_admission_economic_v1.json'),
          ]
          def digests():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None for p in active}
          def run_json(args):
              return json.loads(subprocess.check_output(args,text=True).strip().splitlines()[-1])

          before=digests()
          prep=run_json(['python3','-m','backend.production.zel_production_pre_survivor_research_controller_v1','--policy','config/zel_production_pre_survivor_research_controller_v1.json','--phase','prepare'])
          nxt=run_json(['python3','-m','backend.production.zel_production_ai_pre_survivor_next_hypothesis_v1','--policy','config/zel_production_ai_pre_survivor_research_next_hypothesis_v1.json'])
          comp_cli=run_json(['python3','-m','backend.production.zel_production_pre_survivor_research_comparator_v1','--policy','config/zel_production_pre_survivor_research_comparator_v1.json'])
          upd=run_json(['python3','-m','backend.production.zel_production_pre_survivor_research_controller_v1','--policy','config/zel_production_pre_survivor_research_controller_v1.json','--phase','update'])
          after=digests()
          assert before==after, {'before':before,'after':after}

          def load(path): return json.loads(Path(path).read_text())
          reference=load('/home/z/z/ledger/production_pre_survivor_research_reference_feedback_v1.json')
          nextrow=load('/home/z/z/ledger/production_ai_pre_survivor_next_hypotheses_v1.json')
          evidence=load('/home/z/z/ledger/production_pre_survivor_challenger_evidence_v1.json')
          comparison=load('/home/z/z/ledger/production_pre_survivor_research_comparison_v1.json')
          incp=Path('/home/z/z/ledger/production_pre_survivor_research_incumbent_v1.json')
          incumbent=load(incp) if incp.is_file() else None

          for row in (reference,nextrow,evidence,comparison):
              assert row['selection_authority'] is False
              assert row['promotion_authority'] is False
              assert row['execution_authority']=='NONE'
              assert row['order_authority']=='BLOCKED'
              assert row['live_trade_authority']=='BLOCKED'
              assert row['exchange_order_submitted'] is False
          if isinstance(incumbent,dict):
              assert incumbent['research_incumbent_only'] is True
              assert incumbent['production_promotion_applied'] is False
              assert incumbent['selection_authority'] is False
              assert incumbent['promotion_authority'] is False
              assert incumbent['execution_authority']=='NONE'
              assert incumbent['order_authority']=='BLOCKED'
              assert incumbent['live_trade_authority']=='BLOCKED'
              assert incumbent['exchange_order_submitted'] is False

          assert nextrow['state']=='PASS_PRE_SURVIVOR_NEXT_HYPOTHESIS_SOURCE_READY', nextrow
          assert int(nextrow.get('source_ready_count') or 0)>=1, nextrow
          assert int(nextrow.get('template_ready_count') or 0)>=1, nextrow
          assert all(p.get('template_ready') is True and p.get('template_id') for p in nextrow.get('proposals') or []), nextrow
          assert evidence.get('materializer_state')=='PASS_AI_ADMISSION_CONTRACTS_FROZEN', evidence
          assert evidence.get('state')!='HOLD_PRE_SURVIVOR_CHALLENGER_NO_FROZEN_TEMPLATE', evidence
          assert int(evidence.get('challenger_count') or 0)>=1, evidence
          assert comparison.get('state')=='PASS_PRE_SURVIVOR_RESEARCH_COMPARISON_CAPTURED', comparison
          assert int(comparison.get('comparison_count') or 0)>=1, comparison

          print(json.dumps({
              'prep':prep,
              'next_cli':nxt,
              'comparison_cli':comp_cli,
              'update':upd,
              'reference_family_id':reference.get('family_id'),
              'reference_trade_count':reference.get('trade_count'),
              'reference_win_rate_pct':reference.get('win_rate_pct'),
              'reference_net_pnl':reference.get('net_pnl'),
              'reference_net_expectancy':reference.get('net_expectancy'),
              'reference_profit_factor':reference.get('profit_factor'),
              'reference_max_dd_pct':reference.get('max_dd_pct'),
              'next_state':nextrow.get('state'),
              'next_proposal_count':int(nextrow.get('proposal_count') or 0),
              'next_source_ready_count':int(nextrow.get('source_ready_count') or 0),
              'next_template_ready_count':int(nextrow.get('template_ready_count') or 0),
              'next_proposals':nextrow.get('proposals') or [],
              'challenger_state':evidence.get('state'),
              'challenger_count':int(evidence.get('challenger_count') or 0),
              'history_appended':int(evidence.get('history_appended') or 0),
              'challengers':evidence.get('challengers') or [],
              'materializer_state':evidence.get('materializer_state'),
              'comparison_state':comparison.get('state'),
              'comparison_count':int(comparison.get('comparison_count') or 0),
              'research_preference':comparison.get('research_preference'),
              'preferred_challenger_family_ids':comparison.get('preferred_challenger_family_ids') or [],
              'incumbent_family_id':incumbent.get('family_id') if isinstance(incumbent,dict) else None,
              'incumbent_generation':int(incumbent.get('generation') or 0) if isinstance(incumbent,dict) else 0,
              'active_ledger_unchanged':True,
          },sort_keys=True))
          PY
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
