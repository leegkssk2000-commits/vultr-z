name: TMP SSOT binding audit 20260813

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/_tmp-ssot-binding-audit-20260813.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Audit SSOT provenance without values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          paths=[
            'config/zel_production_risk_sizing_v1.json',
            'config/zel_production_paper_account_v1.json',
            'config/zel_production_active_alpha_v1.json',
            'config/zel_production_improvement_v1.json',
          ]
          wanted={
            'market_data_stale_ms','account_state_stale_ms','max_dd_day_pct','max_dd_total_pct',
            'signal_stale_ms','initial_equity_usdt','risk_day_timezone','min_trades','min_expectancy',
            'min_profit_factor','min_net_pnl','max_dd_pct','min_score_gain','max_dd_regression_pct','error_budget'}
          def walk(x,p=''):
            if isinstance(x,dict):
              for k,v in x.items():
                q=f'{p}.{k}' if p else k
                if k in wanted and v is not None: yield q
                yield from walk(v,q)
            elif isinstance(x,list):
              for i,v in enumerate(x): yield from walk(v,f'{p}[{i}]')
          print('=== REPO_NON_NULL_HISTORY_PROVENANCE ===')
          for path in paths:
            shas=subprocess.check_output(['git','log','--format=%H','--',path],text=True).splitlines()[:80]
            seen=set()
            for sha in shas:
              try: raw=subprocess.check_output(['git','show',f'{sha}:{path}'],stderr=subprocess.DEVNULL,text=True)
              except subprocess.CalledProcessError: continue
              try: d=json.loads(raw)
              except Exception: continue
              fields=tuple(sorted(set(walk(d))))
              if fields and fields not in seen:
                seen.add(fields)
                print('SNAPSHOT',path,sha,'FIELDS='+','.join(fields))
          PY

          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os

          keys=[
            'ZEL_DATA_STALE_MS','ZEL_ACCOUNT_STALE_MS','ZEL_MAX_DD_DAY_PCT','ZEL_MAX_DD_TOTAL_PCT',
            'ZEL_ALPHA_SIGNAL_STALE_MS','ZEL_PAPER_INITIAL_EQUITY_USDT','ZEL_RISK_DAY_TZ',
            'ZEL_IMPROVE_MIN_TRADES','ZEL_IMPROVE_MIN_EXPECTANCY','ZEL_IMPROVE_MIN_PF',
            'ZEL_IMPROVE_MIN_NET_PNL','ZEL_IMPROVE_MAX_DD_PCT','ZEL_IMPROVE_MIN_SCORE_GAIN',
            'ZEL_IMPROVE_MAX_DD_REGRESSION_PCT','ZEL_IMPROVE_ERROR_BUDGET']
          fields={
            'market_data_stale_ms','account_state_stale_ms','max_dd_day_pct','max_dd_total_pct',
            'signal_stale_ms','initial_equity_usdt','risk_day_timezone','min_trades','min_expectancy',
            'min_profit_factor','min_net_pnl','max_dd_pct','min_score_gain','max_dd_regression_pct','error_budget'}

          env_names=set()
          envfile=Path('/etc/zel/production-paper-loop.env')
          if envfile.is_file():
            for line in envfile.read_text(errors='ignore').splitlines():
              s=line.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              name=s.split('=',1)[0].strip().removeprefix('export ').strip()
              if name in keys: env_names.add(name)

          service_names=set()
          try:
            import subprocess
            pid=subprocess.check_output(['systemctl','show','-p','MainPID','--value','zel-production-paper-loop-v1.service'],text=True).strip()
            p=Path('/proc')/pid/'environ'
            if pid not in ('','0') and p.is_file():
              for item in p.read_bytes().split(b'\0'):
                name=item.split(b'=',1)[0].decode(errors='ignore')
                if name in keys: service_names.add(name)
          except Exception:
            pass

          occ={k:[] for k in keys}
          roots=[Path('/etc/zel'),Path('/home/z/zel-production-current'),Path('/home/z/z'),Path('/home/z/zel-production-releases')]
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              try:
                if not p.is_file() or p.stat().st_size>2_000_000: continue
                if any(x in {'.git','node_modules','__pycache__'} for x in p.parts): continue
                lines=p.read_text(errors='ignore').splitlines()
              except Exception: continue
              for i,line in enumerate(lines,1):
                for k in keys:
                  if k in line:
                    occ[k].append(f'{p}:{i}')

          semantic=[]
          json_roots=[Path('/home/z/zel-production-current/config'),Path('/home/z/zel-production-releases'),Path('/home/z/z')]
          def walk(x,p=''):
            if isinstance(x,dict):
              for k,v in x.items():
                q=f'{p}.{k}' if p else k
                if k in fields and v is not None: yield q
                yield from walk(v,q)
            elif isinstance(x,list):
              for i,v in enumerate(x): yield from walk(v,f'{p}[{i}]')
          for root in json_roots:
            if not root.exists(): continue
            for p in root.rglob('*.json'):
              try:
                if p.stat().st_size>2_000_000: continue
                d=json.loads(p.read_text())
                found=sorted(set(walk(d)))
              except Exception: continue
              if found: semantic.append((str(p),found))

          print('=== VPS_KEY_PROVENANCE_MATRIX ===')
          for k in keys:
            print(f'KEY {k} ENVFILE={int(k in env_names)} SERVICE={int(k in service_names)} OCCURRENCES={len(occ[k])}')
            for loc in sorted(set(occ[k]))[:8]: print('  OCC',loc)
          print('=== VPS_SEMANTIC_NON_NULL_FILES ===')
          for p,found in semantic[:500]: print('JSON',p,'FIELDS='+','.join(found))
          print(f'=== SUMMARY ENVFILE={len(env_names)}/15 SERVICE={len(service_names)}/15 ===')
          PY
          REMOTE
