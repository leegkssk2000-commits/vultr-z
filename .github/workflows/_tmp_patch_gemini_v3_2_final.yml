name: TMP Patch Gemini V3.2 Final

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/_tmp_patch_gemini_v3_2_final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-gemini-v3-2-multimodal
          persist-credentials: true
      - name: Patch final workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/r7a4d-strategy11-gemini-v3-2-final.yml')
          text=path.read_text()
          text=text.replace(
              '            backend/tools/strategy11_gemini_v3_2_cohort.py \\\n            backend/tools/strategy11_gemini_v3_2_ai_filter.py',
              '            backend/tools/strategy11_gemini_v3_2_cohort.py \\\n            backend/tools/strategy11_gemini_v3_2_cohort_final.py \\\n            backend/tools/strategy11_gemini_v3_2_ai_filter.py',
          )
          text=text.replace(
              '          python backend/tools/strategy11_gemini_v3_2_cohort.py \\\n',
              '          python backend/tools/strategy11_gemini_v3_2_cohort_final.py \\\n',
          )
          old="""          summary=json.loads(Path('out/gemini/summary.json').read_text())
          plan=json.loads(Path('out/gemini/plan.json').read_text())
          assert summary['promotion_authority'] is False and summary['execution_allowed'] is False
"""
          new="""          summary=json.loads(Path('out/gemini/summary.json').read_text())
          plan_path=Path('out/gemini/plan.json')
          if not plan_path.exists():
              assert summary['state']=='HOLD', summary
              plan={
                  'schema_version':'3.2','state':'HOLD_GEMINI_V3_2_PREFLIGHT',
                  'strategy_count_total':25,'active_strategy_count':0,
                  'active_strategy_ids':[],'candidate_count':0,'rows':[],
                  'research_only':True,'promotion_authority':False,
                  'protected_mutations':0,'execution_allowed':False,
                  'execution_authority':'NONE','runtime_bound':False,
                  'order_authority':'BLOCKED',
              }
              plan_path.write_text(json.dumps(plan,indent=2,sort_keys=True)+'\\n')
          else:
              plan=json.loads(plan_path.read_text())
          assert summary['promotion_authority'] is False and summary['execution_allowed'] is False
"""
          assert old in text
          text=text.replace(old,new)
          path.write_text(text)
          PY
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/r7a4d-strategy11-gemini-v3-2-final.yml').read_text())
          print('PASS_FINAL_WORKFLOW_PATCH')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/r7a4d-strategy11-gemini-v3-2-final.yml
          git commit -m 'Fail closed Gemini V3.2 cohort and preflight holds'
          git push origin HEAD:strategy11-gemini-v3-2-multimodal
