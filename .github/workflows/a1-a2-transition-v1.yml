name: A1 to A2 Transition V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/zel_survivor_tiering_policy_v3.json'
      - 'backend/tools/zel_survivor_tiering_gate_v3.py'
      - 'backend/research/rebuild/a1_trend_rider_v3_transition_v1.py'
      - 'backend/research/rebuild/diagnostics/trend_rider_hardening_latest.json'
      - 'backend/research/rebuild/a1_exact25_disposition_ledger_v1.json'
      - 'backend/research/prep/a2_cost_turnover_ssot_v1.json'
      - 'backend/research/prep/a2_cost_turnover_actual_v1.py'
      - '.github/workflows/a1-a2-transition-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: a1-to-a2-transition-v1
  cancel-in-progress: false
jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate transition code
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_survivor_tiering_gate_v3.py \
            backend/research/rebuild/a1_trend_rider_v3_transition_v1.py \
            backend/research/prep/a2_cost_turnover_actual_v1.py
          python -m backend.tools.zel_survivor_tiering_gate_v3 --self-test
      - name: Derive A1 causal-ready receipt
        id: a1
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_v3_transition_v1 --output out/a1_trend_rider_v3_transition_v1.json
      - name: Execute A2 actual cost turnover evaluation
        if: ${{ steps.a1.outcome == 'success' }}
        run: |
          set +e
          python -m backend.research.prep.a2_cost_turnover_actual_v1 \
            --transition out/a1_trend_rider_v3_transition_v1.json \
            --output out/a2_cost_turnover_actual_v1.json
          RC=$?
          if [ ! -f out/a2_cost_turnover_actual_v1.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('out/a2_cost_turnover_actual_v1.json').write_text(json.dumps({
            'schema_version':'zel.a2.cost_turnover_actual.v1',
            'state':'HOLD_A2_RUNTIME_FAILURE',
            'stage':'A2',
            'candidate_id':'trend_rider',
            'selection_authority':False,'promotion_authority':False,
            'execution_authority':'NONE','order_authority':'BLOCKED','live_trade_authority':'BLOCKED',
            'protected_mutations':0
          },sort_keys=True,indent=2)+'\n')
          PY
          fi
          echo "a2_rc=$RC" >> "$GITHUB_ENV"
          exit 0
      - name: Publish A1 to A2 receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          def load(path):
              try:return json.loads(Path(path).read_text())
              except Exception:return None
          a1=load('out/a1_trend_rider_v3_transition_v1.json')
          a2=load('out/a2_cost_turnover_actual_v1.json')
          marker='<!-- A1_A2_TRANSITION_V1 -->'
          lines=[marker,'## A1 → A2 Transition V1',f"run={os.environ['RUN_ID']}|head={os.environ['HEAD_SHA']}"]
          if a1:
              t=a1.get('tiering') or {}
              lines.append(f"A1_state={a1.get('state')}|tier={t.get('a1_tier')}|a2_entry={t.get('a2_entry_allowed')}|activation={(t.get('activation') or {}).get('mode')}|receipt={a1.get('receipt_sha256')}")
              lines.append('A1_hard_controls='+json.dumps(t.get('hard_control_states') or {},sort_keys=True))
              ev=a1.get('evidence') or {}; lines.append('A1_OOS='+json.dumps((ev.get('activation') or {}),sort_keys=True))
          else:
              lines.append('A1_state=HOLD_TRANSITION_RUNTIME_NO_RECEIPT')
          if a2:
              lines.append(f"A2_state={a2.get('state')}|stage={a2.get('stage')}|receipt={a2.get('receipt_sha256')}")
              lines.append('A2_stress='+json.dumps(a2.get('stress') or {},sort_keys=True))
              lines.append('A2_cost='+json.dumps(a2.get('cost_authority') or {},sort_keys=True))
              lines.append('A2_execution_observation='+json.dumps(a2.get('execution_observation') or {},sort_keys=True))
              lines.append(f"next={a2.get('next_stage_if_pass')}")
          else:
              lines.append('A2_state=NOT_RUN_OR_NO_RECEIPT')
          lines.append('selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0')
          body='\n'.join(lines)
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as response: comments=json.load(response)
          existing=next((x for x in comments if marker in str(x.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          method='PATCH' if existing else 'POST'
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method=method)): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-a2-transition-${{ github.run_id }}
          path: out
          retention-days: 90
