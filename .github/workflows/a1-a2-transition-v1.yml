name: A1 to A3 Transition V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/zel_survivor_tiering_policy_v3.json'
      - 'backend/tools/zel_survivor_tiering_gate_v3.py'
      - 'backend/research/rebuild/a1_trend_rider_v3_transition_v1.py'
      - 'backend/research/rebuild/diagnostics/trend_rider_hardening_latest.json'
      - 'backend/research/rebuild/a1_exact25_disposition_ledger_v1.json'
      - 'backend/research/prep/a2_cost_turnover_ssot_v1.json'
      - 'backend/research/prep/a2_cost_turnover_actual_v1.py'
      - 'backend/research/prep/a3_regime_taxonomy_v1.json'
      - 'backend/research/prep/a3_actual_regime_durability_v1.py'
      - '.github/workflows/a1-a2-transition-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: a1-to-a3-transition-v1
  cancel-in-progress: false
jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate transition code
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_survivor_tiering_gate_v3.py backend/research/rebuild/a1_trend_rider_v3_transition_v1.py backend/research/prep/a2_cost_turnover_actual_v1.py backend/research/prep/a3_actual_regime_durability_v1.py
          python -m backend.tools.zel_survivor_tiering_gate_v3 --self-test
      - name: Derive A1 causal-ready receipt
        run: |
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_v3_transition_v1 --output out/a1.json
      - name: Execute A2 actual
        run: |
          python -m backend.research.prep.a2_cost_turnover_actual_v1 --transition out/a1.json --output out/a2.json
      - name: Enter A3 actual regime durability
        run: |
          python -m backend.research.prep.a3_actual_regime_durability_v1 --a2 out/a2.json --output out/a3.json
      - name: Publish A1 A2 A3 receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          def load(p):
              try:return json.loads(Path(p).read_text())
              except Exception:return {}
          a1,a2,a3=load('out/a1.json'),load('out/a2.json'),load('out/a3.json')
          marker='<!-- A1_A2_A3_TRANSITION_V1 -->'
          t=a1.get('tiering') or {}
          lines=[marker,'## A1 → A2 → A3 Transition V1',f"run={os.environ['RUN_ID']}|head={os.environ['HEAD_SHA']}",f"A1={a1.get('state')}|tier={t.get('a1_tier')}|receipt={a1.get('receipt_sha256')}",f"A2={a2.get('state')}|receipt={a2.get('receipt_sha256')}",f"A3={a3.get('state')}|receipt={a3.get('receipt_sha256')}",'A3_missing='+json.dumps(a3.get('missing_entry_time_fields') or [],sort_keys=True),'A3_H5_diagnostic='+json.dumps(a3.get('existing_h5_diagnostics') or {},sort_keys=True),f"next={a3.get('next_required_action')}",'other_A1_GEN2_candidates=PARALLEL_UNCHANGED','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines)
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as r: cs=json.load(r)
          ex=next((x for x in cs if marker in str(x.get('body') or '')),None)
          url=ex.get('url') if ex else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if ex else 'POST')): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-a2-a3-transition-${{ github.run_id }}
          path: out
          retention-days: 90
