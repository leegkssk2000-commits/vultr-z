name: A1 A4 Distinct Child Repair Batch V3

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v1.py'
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v2.py'
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v3.py'
      - 'backend/research/rebuild/a1_a4_production_candidate_policy_v1.json'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/zel_economic_hardening_policy_v1.json'
      - '.github/workflows/a1-a4-distinct-child-repair-batch-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v1.py'
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v2.py'
      - 'backend/research/rebuild/a1_a4_distinct_child_repair_batch_v3.py'
      - 'backend/research/rebuild/a1_a4_production_candidate_policy_v1.json'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/zel_economic_hardening_policy_v1.json'
      - '.github/workflows/a1-a4-distinct-child-repair-batch-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen-Main production gate
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_a4_distinct_child_repair_batch_v1.py
          python -m py_compile backend/research/rebuild/a1_a4_distinct_child_repair_batch_v2.py
          python -m py_compile backend/research/rebuild/a1_a4_distinct_child_repair_batch_v3.py
          python -m backend.research.rebuild.a1_a4_distinct_child_repair_batch_v1 --self-test
          python -m backend.research.rebuild.a1_a4_distinct_child_repair_batch_v2 --self-test
          python -m backend.research.rebuild.a1_a4_distinct_child_repair_batch_v3 --self-test

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild candidate-generation parents
        run: |
          set -euo pipefail
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          for SID in break_and_continue supertrend_pullback keltner_trend trend_ma_macd; do
            python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 \
              --terminal-replay --strategy-id "$SID" --symbols "$SYMBOLS" \
              --out "out/${SID}_exact_parent.json"
          done
      - name: Evaluate challengers against frozen Break Main
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_a4_distinct_child_repair_batch_v3 \
            --break-parent out/break_and_continue_exact_parent.json \
            --supertrend-parent out/supertrend_pullback_exact_parent.json \
            --keltner-parent out/keltner_trend_exact_parent.json \
            --macd-parent out/trend_ma_macd_exact_parent.json \
            --out out/a1_a4_distinct_child_repair_batch_v3.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a4_distinct_child_repair_batch_v3.json'))
          assert r['schema_version']=='zel.a1.a4.distinct_child_repair_batch.v3'
          assert r['break_main_preserved'] is True
          assert r['break_weak_challenger_cannot_replace_main'] is True
          bm=r['break_main']['metrics']
          assert bm['trades']==9
          assert abs(bm['win_rate']-5/9)<1e-12
          assert bm['net_pnl_bps']>9000 and bm['profit_factor']>16
          assert r['policy']['win_rate_non_decrease_required'] is True
          assert r['policy']['drawdown_non_increase_required'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          for x in r['strategies']['break_and_continue']['candidates']:
              m=x.get('metrics') or {}
              if float(m.get('win_rate') or 0)<bm['win_rate']:
                  assert x['development_candidate_ready'] is False
                  assert 'WIN_RATE_BELOW_FROZEN_MAIN' in x['production_gate']['blockers']
              if x['development_candidate_ready']:
                  assert int(m['trades'])>=bm['trades']
                  assert float(m['win_rate'])>=bm['win_rate']
                  assert float(m['net_pnl_bps'])>=bm['net_pnl_bps']
                  assert float(m['net_expectancy_bps'])>=bm['net_expectancy_bps']
                  assert float(m['profit_factor'])>=bm['profit_factor']
                  assert float(m['drawdown_bps'])<=bm['drawdown_bps']
          print(json.dumps({'state':r['state'],'ready':r['development_ready_count'],'break_main':bm,'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist frozen-Main distinct-child receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_a4_distinct_child_repair_latest.json
          cp out/a1_a4_distinct_child_repair_batch_v3.json "$target"
          git config user.name 'a1-a4-distinct-child-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 A4: persist frozen-Main distinct-child receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish distinct-child state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_a4_distinct_child_repair_batch_v3.json'))
          marker='<!-- A1_A4_DISTINCT_CHILD_REPAIR_BATCH_V3 -->'
          bm=r['break_main']['metrics']
          lines=[marker,'## A1 A4 Distinct Child Repair Batch V3',f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}|ready={r['development_ready_count']}",f"break_MAIN:trades={bm['trades']}|wr={bm['win_rate']}|pnl={bm['net_pnl_bps']}|exp={bm['net_expectancy_bps']}|pf={bm['profit_factor']}|dd={bm['drawdown_bps']}|preserved=true"]
          for sid,row in r['strategies'].items():
              p=row.get('production_main') or {'metrics':row.get('parent_metrics') or {}}
              pm=p.get('metrics') or {}
              lines.append(f"{sid}:reference_trades={pm.get('trades')}|wr={pm.get('win_rate')}|pnl={pm.get('net_pnl_bps')}|exp={pm.get('net_expectancy_bps')}|pf={pm.get('profit_factor')}|dd={pm.get('drawdown_bps')}|ready={row['development_ready_count']}")
              for x in row['candidates']:
                  m=x['metrics']; pg=x.get('production_gate') or {}; lines.append(f"  {x['changed_axis']}/{x['changed_variant']}:trades={m['trades']}|wr={m['win_rate']}|pnl={m['net_pnl_bps']}|exp={m['net_expectancy_bps']}|pf={m['profit_factor']}|dd={m['drawdown_bps']}|prod={pg.get('passed')}|disposition={x.get('disposition')}|blockers={','.join(pg.get('blockers') or [])}|ready={x['development_candidate_ready']}")
          lines += ['Break Main is frozen; weak challengers are REJECT/PARTS_ONLY and cannot replace Main.','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_A4_DISTINCT_CHILD_REPAIR_V3_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-a4-distinct-child-repair-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_a4_distinct_child_repair_batch_v3.json
            out/*_exact_parent.json
          if-no-files-found: error
          retention-days: 90
