name: A1 A5 Economic Improvement V4

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v1.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v2.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v3.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v4.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_online_expansion_v1.json'
      - '.github/workflows/a1-a5-economic-improvement-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v1.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v2.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v3.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v4.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_online_expansion_v1.json'
      - '.github/workflows/a1-a5-economic-improvement-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-a5-economic-improvement-v4
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test original-fresh aware A5 economic engine
        run: |
          set -euo pipefail
          for v in 1 2 3 4; do
            python -m py_compile backend/research/architecture_factory/a1_a5_economic_improvement_v${v}.py
            python -m backend.research.architecture_factory.a1_a5_economic_improvement_v${v} --self-test
          done
          python - <<'PY'
          import json
          c=json.load(open('backend/research/contracts/a1_trend_rider_online_expansion_v1.json'))
          assert c['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          a=c['acceptance_contract']
          assert a['same_original_fresh_baseline_required'] is True
          assert a['a1_a2_a3_gate_order_preserved'] is True
          assert a['numeric_threshold_sweep'] is False
          assert a['best_horizon_selection'] is False
          assert a['post_outcome_trade_deletion'] is False
          print('PASS_TREND_RIDER_ORIGINAL_FRESH_59PCT_ACCEPTANCE_CONTRACT')
          PY

  improve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original-fresh aware A5 economic cascade
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v4 --output out/a1_a5_economic_improvement_v4.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_economic_improvement_v4.json'))
          expected=['trend_rider','break_and_continue','supertrend_pullback','keltner_trend','trend_ma_macd']
          assert r['a5_order']==expected
          assert int(r['paid_request_count']) <= 3
          p=r['policy']; tr=r['trend_rider_original_fresh_online_expansion']
          assert tr['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          assert tr['same_original_fresh_baseline_required'] is True
          assert tr['consumer_connected'] is True
          assert tr['economic_consumer_axis_count'] >= 5
          assert tr['numeric_improvement_vs_59pct_baseline_claim_allowed'] is False
          assert tr['next_required_proof']=='DIRECT_SAME_ORIGINAL_FRESH_W123_PARENT_CHILD_AB_RECEIPT'
          assert p['trend_rider_original_fresh_online_expansion_consumed'] is True
          assert p['same_original_fresh_baseline_required_for_59pct_improvement_claim'] is True
          assert p['delayed_fill_or_long_only_cannot_substitute_for_original_fresh_baseline'] is True
          assert p['a1_a2_a3_gate_order_preserved'] is True
          assert p['fresh_validation_wait_does_not_block_development_research'] is True
          assert p['strict_full_candidate_count_schema'] is True
          assert p['executable_dsl_v1_grammar_enforced_in_prompt'] is True
          assert p['spec_repair_semantics_frozen'] is True
          assert p['technical_spec_reject_does_not_consume_axis'] is True
          assert p['economic_terminal_state_required_to_consume_axis'] is True
          assert p['previously_economically_tested_axis_reuse_forbidden'] is True
          assert p['second_step_must_use_distinct_axis'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          print(json.dumps({'state':r['state'],'development_pass':r['development_economic_pass_count'],'paid':r['paid_request_count'],'active':r['active_strategy_ids'],'trend_rider_original_fresh':tr,'by_strategy':r['by_strategy'],'providers':r['providers'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist A5 economic improvement V4 receipt
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          cp out/a1_a5_economic_improvement_v4.json "$target"
          git config user.name 'a1-a5-economic-improvement'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 A5: persist original-fresh aware economic V4 receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish A5 economic state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_a5_economic_improvement_v4.json')); tr=r['trend_rider_original_fresh_online_expansion']
          marker='<!-- A1_A5_ECONOMIC_IMPROVEMENT_V4 -->'
          rows=[]
          for sid in r['a5_order']:
              x=r['by_strategy'][sid]
              rows.append(f"{sid}:candidates={x['candidate_count']},dev_pass={x['development_economic_pass_count']},technical_reject={','.join(x['technical_rejected_axes'])},economic_axes={','.join(x['economic_attempted_axes'])},remaining={x['remaining_axis_count']},next={x['next']}")
          lines=[marker,'## A1 A5 Economic Improvement V4',f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",f"development_economic_pass={r['development_economic_pass_count']}|paid_requests={r['paid_request_count']}/{r['paid_request_cap']}|active={','.join(r['active_strategy_ids'])}",f"trend_rider_baseline={tr['baseline_identity']}|consumer_connected={str(tr['consumer_connected']).lower()}|online_axes={tr['economic_consumer_axis_count']}|same_baseline_ab={str(tr['direct_same_baseline_ab_receipt_present']).lower()}",*rows,'59pct numeric improvement is forbidden until direct same-original-fresh W123 parent/child A/B receipt exists','NO_IDLE=technical DSL rejects are repaired or retried and do not consume an economic axis','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_A5_ECONOMIC_IMPROVEMENT_V4_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-a5-economic-improvement-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_a5_economic_improvement_v4.json
          if-no-files-found: error
          retention-days: 90
