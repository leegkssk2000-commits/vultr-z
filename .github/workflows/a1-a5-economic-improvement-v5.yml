name: A1 Top5 Economic Improvement V10 Manual-Cost

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v8.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v2.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_frozen24_source_v1.json'
      - 'backend/research/contracts/g5_entry_fusion_rescue_v1.json'
      - '.github/workflows/a1-a5-economic-improvement-v5.yml'
  workflow_dispatch:
    inputs:
      paid_gemini:
        description: 'Allow one blocker-scoped Gemini transport rescue in this manual run'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: read

concurrency:
  group: a1-top5-economic-improvement-v10-manual-cost
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test without paid AI
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_a5_economic_improvement_v8.py
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v8 --self-test
          python -m py_compile backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v2.py
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v2.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('backend/research/contracts/g5_entry_fusion_rescue_v1.json').read_text())
          assert c['trend_rider']['historical_union_allowed'] is False
          assert c['trend_rider']['historical_metrics_formal_credit'] == 0
          assert c['trend_rider']['rr_exit_mutation_allowed'] is False
          assert c['trend_rider']['new_fresh_boundary_required'] is True
          p=c['paid_ai_policy']
          assert p['automatic_paid_schedule_allowed'] is False
          assert p['manual_blocker_scoped_only'] is True
          assert p['max_paid_requests_per_manual_invocation'] == 1
          assert p['paid_ai_output_is_formal_credit'] is False
          assert c['authorities']['order_authority']=='BLOCKED'
          assert c['authorities']['live_trade_authority']=='BLOCKED'
          print('G5_ENTRY_FUSION_RESCUE_CONTRACT=PASS')
          PY
      - name: Run immutable frozen24 dynamic HTF rescue
        run: |
          set -euo pipefail
          mkdir -p out
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v2.py \
            --out out/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json'))
          assert r['authority_match'] is True, r
          assert r['historical_union_allowed'] is False, r
          assert r['g5_formal_credit_before_fresh'] == 0, r
          assert r['rr_exit_mutated'] is False, r
          assert r['selection_authority'] is False and r['promotion_authority'] is False, r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED', r
          print('TREND_RIDER_FROZEN24_RESCUE_STATE='+str(r['state']))
          print('STRICT='+str(r.get('strict_candidate_count')))
          print('RECOMMENDED='+json.dumps(r.get('recommended_discovery_child'),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-entry-fusion-rescue-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json
          if-no-files-found: error
          retention-days: 30

  manual-research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GEMINI_API_KEY: ${{ inputs.paid_gemini && (secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY) || '' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic TrendRider rescue first
        run: |
          set -euo pipefail
          mkdir -p out
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v2.py \
            --out out/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json
      - name: Run Top5 AI builder only when explicitly paid-enabled
        if: inputs.paid_gemini == true
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v8 \
            --output out/a1_a5_economic_improvement_v8.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_economic_improvement_v8.json'))
          p=r.get('providers') or {}
          gem=p.get('gemini_transport_rescue') or {}
          # OpenAI is deliberately uncredentialed. At most the single Gemini transport-rescue call can be billable.
          assert not bool((p.get('openai_initial') or {}).get('successful')), p
          assert int(gem.get('request_count') or 0) <= 1, gem
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print('BLOCKER_SCOPED_GEMINI_REQUESTS='+str(gem.get('request_count',0)))
          PY
      - name: Persist deterministic rescue receipt
        run: |
          set -euo pipefail
          cp out/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json \
            backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json
          if [ -f out/a1_a5_economic_improvement_v8.json ]; then
            cp out/a1_a5_economic_improvement_v8.json \
              backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          fi
          git config user.name 'a1-top5-economic-improvement-v10-manual-cost'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_v2_latest.json
          if [ -f out/a1_a5_economic_improvement_v8.json ]; then
            git add backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'G5 rescue: persist manual-cost entry research [skip ci]'
          git pull --rebase --depth=20 origin master
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-economic-improvement-v10-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
