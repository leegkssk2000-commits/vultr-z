name: A1 A5 Economic Improvement V5

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v1.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v2.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v3.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v4.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v5.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_online_expansion_v1.json'
      - '.github/workflows/a1-a5-economic-improvement-v5.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v1.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v2.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v3.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v4.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v5.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_online_expansion_v1.json'
      - '.github/workflows/a1-a5-economic-improvement-v5.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-a5-economic-improvement-v5
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test original-fresh priority engine
        run: |
          set -euo pipefail
          for v in 1 2 3 4 5; do
            python -m py_compile backend/research/architecture_factory/a1_a5_economic_improvement_v${v}.py
            python -m backend.research.architecture_factory.a1_a5_economic_improvement_v${v} --self-test
          done
          python - <<'PY'
          import json
          c=json.load(open('backend/research/contracts/a1_trend_rider_online_expansion_v1.json'))
          assert c['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          a=c['acceptance_contract']
          assert a['same_original_fresh_baseline_required'] is True
          assert a['a1_a2_a3_gate_order_preserved'] is True
          assert a['numeric_threshold_sweep'] is False
          assert a['best_horizon_selection'] is False
          assert a['post_outcome_trade_deletion'] is False
          print('PASS_TREND_RIDER_ORIGINAL_FRESH_59PCT_ACCEPTANCE_CONTRACT')
          PY

  improve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original-fresh priority-enforced A5 economic cascade
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v5 --output out/a1_a5_economic_improvement_v5.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_economic_improvement_v5.json'))
          expected=['trend_rider','break_and_continue','supertrend_pullback','keltner_trend','trend_ma_macd']
          assert r['a5_order']==expected
          assert int(r['paid_request_count']) <= 3
          p=r['policy']; tr=r['trend_rider_original_fresh_online_expansion']
          assert tr['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          assert tr['same_original_fresh_baseline_required'] is True
          assert tr['consumer_connected'] is True
          assert tr['priority_selection_enforced'] is True
          assert tr['long_short_capital_axis_route']=='DEDICATED_EVALUATOR_REQUIRED_NOT_GENERIC_DSL'
          assert tr['numeric_improvement_vs_59pct_baseline_claim_allowed'] is False
          assert p['trend_rider_original_fresh_online_expansion_consumed'] is True
          assert p['trend_rider_original_fresh_generic_axis_priority_enforced'] is True
          assert p['trend_rider_long_short_capital_axis_requires_dedicated_evaluator'] is True
          assert p['same_original_fresh_baseline_required_for_59pct_improvement_claim'] is True
          assert p['delayed_fill_or_long_only_cannot_substitute_for_original_fresh_baseline'] is True
          assert p['a1_a2_a3_gate_order_preserved'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          e=tr.get('generic_dsl_expected_axis_this_run'); obs=tr.get('generic_dsl_candidate_axes_this_run') or []
          if e and obs:
              assert all(x==e for x in obs), (e,obs)
          print(json.dumps({'state':r['state'],'development_pass':r['development_economic_pass_count'],'paid':r['paid_request_count'],'expected_axis':e,'observed_axes':obs,'next_axis':tr.get('generic_dsl_next_axis'),'by_strategy':r['by_strategy'],'providers':r['providers'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist A5 economic improvement V5 receipt
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          cp out/a1_a5_economic_improvement_v5.json "$target"
          git config user.name 'a1-a5-economic-improvement'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 A5: persist original-fresh priority V5 receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish A5 economic state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_a5_economic_improvement_v5.json')); tr=r['trend_rider_original_fresh_online_expansion']
          marker='<!-- A1_A5_ECONOMIC_IMPROVEMENT_V5 -->'
          rows=[]
          for sid in r['a5_order']:
              x=r['by_strategy'][sid]
              rows.append(f"{sid}:candidates={x['candidate_count']},dev_pass={x['development_economic_pass_count']},economic_axes={','.join(x['economic_attempted_axes'])},remaining={x['remaining_axis_count']},next={x['next']}")
          lines=[marker,'## A1 A5 Economic Improvement V5',f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",f"development_economic_pass={r['development_economic_pass_count']}|paid_requests={r['paid_request_count']}/{r['paid_request_cap']}",f"trend_rider_baseline={tr['baseline_identity']}|expected_axis={tr.get('generic_dsl_expected_axis_this_run')}|observed={','.join(tr.get('generic_dsl_candidate_axes_this_run') or [])}|next={tr.get('generic_dsl_next_axis')}|dedicated={','.join(tr.get('dedicated_evaluator_pending_axes') or [])}",*rows,'59pct numeric improvement remains forbidden until a development PASS is followed by direct same-original-fresh W123 parent/child A/B receipt','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_A5_ECONOMIC_IMPROVEMENT_V5_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-a5-economic-improvement-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_a5_economic_improvement_v5.json
          if-no-files-found: error
          retention-days: 90
