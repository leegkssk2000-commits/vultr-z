name: A1 Top5 Economic Improvement V9

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v1.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v2.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v3.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v4.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v5.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v6.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v7.py'
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v8.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_latest.json'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/rebuild/a1_strategy25_improvement_league_latest.json'
      - '.github/workflows/a1-a5-economic-improvement-v5.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_economic_improvement_v8.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_latest.json'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/rebuild/a1_strategy25_improvement_league_latest.json'
      - '.github/workflows/a1-a5-economic-improvement-v5.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-top5-economic-improvement-v9
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test V8 plus WR81 dynamic HTF
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_a5_economic_improvement_v8.py
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v8 --self-test
          python -m py_compile backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py --self-test

  improve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Top5 V8 plus exact WR81 dynamic trendline HTF attribution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_a5_economic_improvement_v8 --output out/a1_a5_economic_improvement_v8.json
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py --out out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_economic_improvement_v8.json'))
          d=json.load(open('out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json'))
          league=json.load(open('backend/research/rebuild/a1_strategy25_improvement_league_latest.json'))
          b=r['named_channel_executable_bridge']
          risk=r['named_channel_risk_sizing_evaluator']
          assert r['performance_focus_order']==league['active_top5'], (r['performance_focus_order'],league['active_top5'])
          assert len(r['performance_focus_order'])==5 and len(set(r['performance_focus_order']))==5
          assert r['direct_improvement_scope']=='PERFORMANCE_TOP5_ONLY_IN_CURRENT_ORDER'
          assert r['non_top5_direct_repair_enabled'] is False
          assert r['policy']['performance_top5_only_direct_improvement'] is True
          assert r['policy']['non_top5_direct_repair_forbidden'] is True
          assert r['policy']['named_channel_mechanisms_must_enter_top5_economic_replay'] is True
          assert r['policy']['named_channel_account_equity_risk_pipe_opened'] is True
          assert b['state']=='PASS_NAMED_CHANNEL_TO_TOP5_ECONOMIC_REPLAY_BOUND'
          assert int(b['eligible_axis_count']) > 0
          assert b['creator_numeric_threshold_imported'] is False
          assert b['creator_performance_claim_imported'] is False
          assert risk['state']=='PASS_RISK_SIZING_EVALUATOR_EXECUTED', risk
          assert int(risk['hypothesis_count']) > 0 and int(risk['evaluated_count']) > 0
          assert risk['creator_numeric_threshold_imported'] is False
          assert risk['creator_performance_claim_imported'] is False
          assert risk['risk_fraction_absolute_value_imported'] is False
          assert risk['same_signal_and_exit_events_required'] is True
          assert risk['no_outcome_threshold_sweep'] is True
          assert d['authority_match'] is True, d
          assert d['canonical_head']=='trend_rider_wr80_us_chase_cooling_v1'
          assert d['base_wr8125']['trades']==16 and d['base_wr8125']['wins']==13
          assert abs(d['base_wr8125']['win_rate']-0.8125) < 1e-12
          assert d['numeric_threshold_sweep'] is False
          assert d['creator_numeric_threshold_imported'] is False
          assert d['outcome_used_at_runtime'] is False
          assert set((r.get('by_strategy') or {}).keys()).issubset(set(r['performance_focus_order']))
          assert int(r['paid_request_count']) <= 3
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED' and d['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          print(json.dumps({
            'state':r.get('state'),'focus':r['performance_focus_order'],
            'development_pass':r.get('development_economic_pass_count'),
            'yt_eligible':b.get('eligible_axis_count'),'yt_attempted':b.get('attempted_named_axis_count'),
            'risk_hypotheses':risk.get('hypothesis_count'),'risk_evaluated':risk.get('evaluated_count'),
            'risk_pass':risk.get('economic_pass_count'),'risk_control_improved':risk.get('risk_control_improvement_count'),
            'wr8125_dynamic_state':d.get('state'),'wr8125_dynamic_strict':d.get('strict_candidate_count'),
            'wr8125_dynamic_recommended':d.get('recommended_discovery_child'),
            'paid':r.get('paid_request_count'),'receipt':r.get('receipt_sha256')
          },sort_keys=True))
          PY
      - name: Persist focused economic and WR81 dynamic HTF receipts
        run: |
          set -euo pipefail
          cp out/a1_a5_economic_improvement_v8.json backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          cp out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          git config user.name 'a1-top5-economic-improvement-v9'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/architecture_factory/a1_a5_economic_improvement_latest.json backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 A5: persist V9 WR81 dynamic HTF receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish focus state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_a5_economic_improvement_v8.json'))
          d=json.load(open('out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json'))
          b=r['named_channel_executable_bridge']
          risk=r['named_channel_risk_sizing_evaluator']
          marker='<!-- A1_TOP5_ECONOMIC_IMPROVEMENT_V9 -->'
          rows=[]
          for sid in r['performance_focus_order']:
              x=(r.get('by_strategy') or {}).get(sid,{})
              yt=','.join((b.get('attempted_named_axes_by_strategy') or {}).get(sid,[])) or '-'
              rows.append(f"{sid}:attempts={x.get('attempt_count',0)},dev_pass={x.get('development_economic_pass_count',0)},yt={yt},next={x.get('next')}")
          lines=[
            marker,'## A1 Top5 Economic Improvement V9',
            f"run={os.environ['RUN_ID']}|state={r.get('state')}|receipt={r.get('receipt_sha256')}",
            'focus_order='+','.join(r['performance_focus_order']),
            f"development_pass={r.get('development_economic_pass_count')}|paid={r.get('paid_request_count')}/{r.get('paid_request_cap')}",
            f"named_channel_eligible_axes={b.get('eligible_axis_count')}|attempted={b.get('attempted_named_axis_count')}|evidence={b.get('eligible_evidence_count')}",
            f"risk_hypotheses={risk.get('hypothesis_count')}|evaluated={risk.get('evaluated_count')}|economic_pass={risk.get('economic_pass_count')}|risk_control_improved={risk.get('risk_control_improvement_count')}",
            f"wr8125_dynamic_htf_state={d.get('state')}|strict={d.get('strict_candidate_count')}|canonical={d.get('canonical_head')}",
            *rows,
            'POLICY=WR81.25 canonical Trend Rider is the only Trend Rider host for dynamic trendline/HTF restoration; creator thresholds/performance claims are not imported; fresh/OOS required before promotion',
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0'
          ]
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_TOP5_ECONOMIC_IMPROVEMENT_V9_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-economic-improvement-v9-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_a5_economic_improvement_v8.json
            out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          if-no-files-found: error
          retention-days: 30