name: A1 Named Channel Conversion V10

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_a5_named_channel_conversion_v9.py'
      - '.github/workflows/a1-a5-named-channel-conversion-v10.yml'
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: a1-a5-named-channel-conversion-v10
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test strict named-channel conversion
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_a5_named_channel_conversion_v9.py
          python -m backend.research.architecture_factory.a1_a5_named_channel_conversion_v9 --self-test
      - name: Force eligible named-channel mechanisms into economic replay
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_a5_named_channel_conversion_v9 --output out/a1_a5_named_channel_conversion_v9.json
          if ! python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_named_channel_conversion_v9.json'))
          b=r['named_channel_executable_bridge']
          raise SystemExit(0 if int(b.get('attempted_named_axis_count') or 0) > 0 else 1)
          PY
          then
            echo 'No named-channel attempt after first provider cycle; retrying the identical frozen research request once.'
            python -m backend.research.architecture_factory.a1_a5_named_channel_conversion_v9 --output out/a1_a5_named_channel_conversion_v9.json
          fi
          python - <<'PY'
          import json
          r=json.load(open('out/a1_a5_named_channel_conversion_v9.json'))
          b=r['named_channel_executable_bridge']
          g=r['named_channel_conversion_guard']
          assert int(b['eligible_axis_count']) > 0, b
          assert int(g['nontrend_eligible_axis_count']) > 0, g
          assert int(b['attempted_named_axis_count']) > 0, (b,g)
          assert g['state']=='PASS_NAMED_CHANNEL_CONVERSION_NONZERO', g
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':r.get('state'),
            'guard':g.get('state'),
            'eligible':b.get('eligible_axis_count'),
            'attempted':b.get('attempted_named_axis_count'),
            'by_strategy':b.get('attempted_named_axes_by_strategy'),
            'development_pass':r.get('development_economic_pass_count'),
            'risk_pass':(r.get('named_channel_risk_sizing_evaluator') or {}).get('economic_pass_count'),
            'receipt':r.get('receipt_sha256'),
          },sort_keys=True))
          PY
      - name: Persist strict conversion receipt and canonical economic receipt
        run: |
          set -euo pipefail
          cp out/a1_a5_named_channel_conversion_v9.json backend/research/architecture_factory/a1_a5_named_channel_conversion_latest.json
          cp out/a1_a5_named_channel_conversion_v9.json backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          git config user.name 'a1-named-channel-conversion-v10'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/architecture_factory/a1_a5_named_channel_conversion_latest.json backend/research/architecture_factory/a1_a5_economic_improvement_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist strict named-channel economic conversion receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-named-channel-conversion-v10-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_a5_named_channel_conversion_v9.json
          if-no-files-found: error
          retention-days: 30
