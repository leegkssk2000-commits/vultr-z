name: A1 AI Multicritic Review V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/a1_ai_multicritic_review_v1.py'
      - 'backend/research/a1_ai_multicritic_review_v2.py'
      - '.github/workflows/a1-ai-multicritic-review-v2.yml'
      - 'backend/production/zel_production_openai_critic_v1.py'
      - 'scripts/strategy11_groq_redteam.py'
      - 'scripts/strategy11_workers_ai_guard.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-ai-multicritic-review-v2
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic semantic self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/a1_ai_multicritic_review_v1.py backend/research/a1_ai_multicritic_review_v2.py
          python -m backend.research.a1_ai_multicritic_review_v2 --self-test
          echo 'PASS_LEGACY_MULTICRITIC_STATIC_ONLY_NO_PAID_AI'

  review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Groq SDK for explicit deep review only
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Fetch existing Gemini evidence receipt without new Gemini request
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cat /home/z/z/ledger/production_external_evidence_v1.json 2>/dev/null || printf '%s' '{}'" \
            > out/gemini_external_evidence.json
      - name: Explicitly review current A1 axes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
        run: |
          set -euo pipefail
          python -m backend.research.a1_ai_multicritic_review_v2 \
            --gemini-receipt out/gemini_external_evidence.json \
            --output out/a1_ai_multicritic_review.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_ai_multicritic_review.json'))
          assert r['schema_version']=='zel.a1_ai_multicritic_review.v2'
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert int(r['protected_mutations'])==0
          print(json.dumps({'state':r['state'],'reviewed':r['reviewed_strategy_count'],'manual_only':True},sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-ai-multicritic-review-v2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            out/a1_ai_multicritic_review.json
            out/gemini_external_evidence.json
