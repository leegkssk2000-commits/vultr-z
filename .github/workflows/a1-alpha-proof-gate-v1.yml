name: A1 Alpha Proof Gate V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/alpha_proof/**'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v2.py'
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v3.py'
      - '.github/workflows/a1-alpha-proof-gate-v1.yml'
      - '.github/workflows/a1-strategy-architecture-factory-v1.yml'
      - '.github/workflows/a1-terminal-repair-swarm-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/alpha_proof/**'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v2.py'
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v3.py'
      - '.github/workflows/a1-alpha-proof-gate-v1.yml'
  workflow_dispatch:
    inputs:
      bundle_path:
        description: 'Repo-relative candidate Alpha Proof bundle JSON path'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-alpha-proof-gate-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/alpha_proof/a1_alpha_proof_gate_v1.py
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 --self-test
          python -m py_compile backend/research/architecture_factory/a1_strategy_architecture_factory_v2.py
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v2 --self-test
          python -m py_compile backend/research/architecture_factory/a1_terminal_repair_swarm_v3.py
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v3 --self-test

  evaluate-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed Alpha Proof evaluation
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          mkdir -p out
          set +e
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 \
            --bundle "$BUNDLE_PATH" \
            --output out/a1_alpha_proof_gate_v1.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          r=json.load(open('out/a1_alpha_proof_gate_v1.json'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert int(r['protected_mutations'])==0
          assert r['heavy_launch_allowed'] is False
          print(json.dumps({
            'state':r['state'],
            'candidate_id':r.get('candidate_id'),
            'candidate_sha256':r.get('candidate_sha256'),
            'failed_gates':[g['gate'] for g in r['gates'] if not g['passed']],
            'receipt_sha256':r['receipt_sha256'],
          },sort_keys=True))
          PY
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-alpha-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 180
          if-no-files-found: error
          path: out/a1_alpha_proof_gate_v1.json
      - name: Publish Alpha Proof pointer to issue 566
        if: always() && hashFiles('out/a1_alpha_proof_gate_v1.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_alpha_proof_gate_v1.json'))
          marker='<!-- A1_ALPHA_PROOF_GATE_V1 -->'
          failed=','.join(g['gate'] for g in r['gates'] if not g['passed']) or 'NONE'
          body='\n'.join([
            marker,
            '## A1 Alpha Proof Gate V1',
            f"run={os.environ['RUN_ID']}",
            f"candidate_id={r.get('candidate_id')}",
            f"candidate_sha256={r.get('candidate_sha256')}",
            f"state={r.get('state')}",
            f"failed_gates={failed}",
            f"receipt_sha256={r.get('receipt_sha256')}",
            'fresh_prospective_required=true',
            'heavy_launch_allowed=false|selection=false|promotion=false|execution=NONE|order/live=BLOCKED',
          ])
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if existing else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_ALPHA_PROOF_POINTER_PUBLISHED')
          PY
