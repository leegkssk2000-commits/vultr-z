name: A1 Break Side Long Boundary Diagnostic V1

on:
  push:
    branches: [a1-break-side-long-fresh-child-v1]
    paths:
      - 'backend/research/rebuild/a1_break_side_long_fresh_prereg_v1.json'
      - '.github/workflows/a1-break-side-long-boundary-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source parity, boundary, freshness and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src=json.loads(Path('backend/research/rebuild/a1_recent_loss_cluster_actionable_latest.json').read_text())
          reg=json.loads(Path('backend/research/rebuild/a1_break_side_long_fresh_prereg_v1.json').read_text())
          rows=[x for x in src.get('targets',[]) if x.get('strategy_id')=='break_and_continue']
          assert len(rows)==1, f'BREAK_TARGET_COUNT={len(rows)}'
          x=rows[0]
          root=x.get('actionable_root_cause') or {}
          losses=x.get('loss_streak_trades') or []
          assert len(losses)==5
          last=max(losses,key=lambda t:int(t.get('exit_ts') or 0))

          assert reg['strategy_id']=='break_and_continue'
          assert reg['changed_axis']=='SIDE' and reg['changed_value']=='long'
          assert reg['changed_axis_count']==1 and reg['axis_only'] is True
          assert root.get('axis')=='SIDE' and str(root.get('value','')).lower()=='long'
          assert x.get('fresh_child_boundary_required') is True
          assert x.get('recommended_route')=='PREREGISTER_PREENTRY_CONTEXT_CHILD:SIDE:long:ONE_AXIS_ONLY'
          assert reg['registration']['source_receipt_sha256']==src.get('receipt_sha256')
          assert reg['registration']['target_receipt_sha256']==x.get('receipt_sha256')
          assert reg['registration']['completed_trades_at_registration']==x.get('completed_trades')==11
          assert reg['registration']['current_loss_streak_at_registration']==x.get('current_loss_streak')==5
          assert reg['causal_evidence']['diagnostic_score']==root.get('diagnostic_score')
          assert reg['causal_evidence']['delta_share']==root.get('delta_share')
          assert reg['boundary']['fresh_boundary_exit_ts_ms']==int(last['exit_ts'])==1787925600000
          assert reg['boundary']['last_closed_record']['signal_ts_ms']==int(last['signal_ts'])
          assert reg['boundary']['last_closed_record']['entry_ts_ms']==int(last['entry_ts'])
          assert reg['boundary']['last_closed_record']['symbol']==last['symbol']=='ETH-USDT'
          assert reg['boundary']['freshness_rule']=='SIGNAL_TS_STRICTLY_AFTER_BOUNDARY_EXIT_TS'
          assert reg['boundary']['retrospective_append_forbidden'] is True
          c=reg['strict_success_contract']
          assert c['minimum_fresh_long_trades']==25 and c['minimum_distinct_symbols']==3
          assert c['preboundary_outcomes_counted'] is False
          assert c['retrospective_append_forbidden'] is True
          assert c['numeric_threshold_sweep'] is False and c['post_outcome_threshold_fitting'] is False
          assert reg['current_state']['fresh_accepted_T']==0 and reg['current_state']['sample_gap_to_25']==25
          g=reg['governance']
          assert g['research_only'] is True and g['production_strategy_change'] is False
          assert g['selection_authority'] is False and g['promotion_authority'] is False
          assert g['execution_authority']=='NONE' and g['order_authority']=='BLOCKED' and g['live_trade_authority']=='BLOCKED'
          assert g['protected_mutations']==0 and g['exchange_order_submitted'] is False
          print(json.dumps({
            'state':reg['state'],
            'strategy_id':reg['strategy_id'],
            'axis':reg['changed_axis'],
            'value':reg['changed_value'],
            'boundary_exit_ts_ms':reg['boundary']['fresh_boundary_exit_ts_ms'],
            'historical_T':reg['registration']['completed_trades_at_registration'],
            'fresh_T':reg['current_state']['fresh_accepted_T'],
            'target_fresh_T':c['minimum_fresh_long_trades'],
            'source_parity':'PASS',
            'authority':'BLOCKED'
          },sort_keys=True))
          PY
