name: A1 Break Side Long Boundary Diagnostic V1

on:
  push:
    branches: [a1-break-side-long-fresh-child-v1]
    paths:
      - '.github/workflows/a1-break-side-long-boundary-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract authoritative Break target shape and boundary inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('backend/research/rebuild/a1_recent_loss_cluster_actionable_latest.json')
          r=json.loads(p.read_text())
          rows=[x for x in r.get('targets',[]) if x.get('strategy_id')=='break_and_continue']
          assert len(rows)==1, f'BREAK_TARGET_COUNT={len(rows)}'
          x=rows[0]
          root=x.get('actionable_root_cause') or {}
          assert root.get('axis')=='SIDE' and str(root.get('value','')).lower()=='long', root
          assert x.get('fresh_child_boundary_required') is True
          assert x.get('recommended_route')=='PREREGISTER_PREENTRY_CONTEXT_CHILD:SIDE:long:ONE_AXIS_ONLY', x.get('recommended_route')
          assert x.get('execution_authority')=='NONE'
          assert x.get('order_authority')=='BLOCKED'
          assert x.get('live_trade_authority')=='BLOCKED'

          print('BREAK_KEYS='+json.dumps(sorted(x.keys())))
          shapes={}
          for k,v in x.items():
              if isinstance(v,list): shapes[k]={'type':'list','len':len(v)}
              elif isinstance(v,dict): shapes[k]={'type':'dict','keys':sorted(v.keys())}
          print('BREAK_SHAPES='+json.dumps(shapes,sort_keys=True,separators=(',',':')))

          scalars={}
          for k,v in x.items():
              if isinstance(v,(str,int,float,bool)) or v is None:
                  scalars[k]=v
          scalars['source_receipt_sha256']=r.get('receipt_sha256')
          scalars['root']=root
          print('BREAK_SCALARS='+json.dumps(scalars,sort_keys=True,separators=(',',':')))

          for k,v in x.items():
              if not isinstance(v,list) or not v:
                  continue
              if all(isinstance(t,dict) for t in v):
                  ts=[]
                  for t in v:
                      ts.append({q:t.get(q) for q in ('signal_ts','entry_ts','exit_ts','side','symbol','net_bps') if q in t})
                  if any(t for t in ts):
                      print('BREAK_LIST_'+k+'='+json.dumps(ts,sort_keys=True,separators=(',',':')))
          PY
