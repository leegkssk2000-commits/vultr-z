name: A1 BU-RC-002 Evidence Hardener V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/alpha_proof/a1_bu_rc_002_evidence_hardener_v1.py'
      - 'backend/research/alpha_proof/evidence/a1_bu_rc_002_parameter_provenance_v1.json'
      - '.github/workflows/a1-bu-rc-002-evidence-hardener-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify Alpha Proof gate
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/alpha_proof/a1_bu_rc_002_evidence_hardener_v1.py \
            backend/research/alpha_proof/a1_alpha_proof_gate_v2.py
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v2 --self-test
      - name: Refresh candidate-matched P2 and P6 evidence
        run: |
          set -euo pipefail
          python -m backend.research.alpha_proof.a1_bu_rc_002_evidence_hardener_v1 \
            --out-dir out/bu_rc_002_evidence_v2
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('out/bu_rc_002_evidence_v2')
          src=json.loads((d/'a1_bu_rc_002_p2_p6_receipt.json').read_text())
          alpha=json.loads((d/'a1_alpha_proof_bu_rc_002_v2_receipt.json').read_text())
          assert src['candidate_sha256']=='98dd313e8241fcb80bf5ee04c7ef4ea2577228694b9a427da1210a26fe560e59'
          assert src['p2_passed'] is True and src['p6_passed'] is True
          assert src['development_history_claimed'] is False and src['alpha_claimed'] is False
          assert alpha['state']=='HOLD_ALPHA_PROOF'
          assert alpha['heavy_launch_allowed'] is False
          assert alpha['selection_authority'] is False and alpha['promotion_authority'] is False
          assert alpha['execution_authority']=='NONE' and alpha['order_authority']=='BLOCKED' and alpha['live_trade_authority']=='BLOCKED'
          remaining={g['gate'] for g in alpha['gates'] if not g['passed']}
          assert remaining=={'P3_EMPIRICAL_MOVE_VS_COST','P4_NEGATIVE_CONTROLS_ABLATION','P5_MULTI_AI_ADVERSARIAL_REVIEW'}, remaining
          print(json.dumps({'state':alpha['state'],'remaining_failed_gates':sorted(remaining),'source_receipt':src['receipt_sha256'],'alpha_receipt':alpha['receipt_sha256']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-bu-rc-002-evidence-v2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 180
          if-no-files-found: error
          path: out/bu_rc_002_evidence_v2/*.json
