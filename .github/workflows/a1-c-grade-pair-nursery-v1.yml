name: A1 C-Grade Pair Nursery V1 (Deprecated Verify Only)

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py'
      - '.github/workflows/a1-c-grade-pair-nursery-v1.yml'
      - '.github/workflows/a1-c-grade-pair-nursery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deprecated V1 library contract only
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py
          python -m backend.research.architecture_factory.a1_c_grade_pair_nursery_v1 --self-test
