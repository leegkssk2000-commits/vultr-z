name: A1 C-Grade Pair Nursery V1 (Deprecated Verify Only)

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py'
      - '.github/workflows/a1-c-grade-pair-nursery-v1.yml'
      - '.github/workflows/a1-c-grade-pair-nursery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deprecated V1 library contract only
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py
          python -m backend.research.architecture_factory.a1_c_grade_pair_nursery_v1 --self-test
      - name: Assert V1 workflow has no operational write authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/a1-c-grade-pair-nursery-v1.yml').read_text()
          forbidden=(
              "contents: write",
              "git push",
              "schedule:",
              "Run one-call executable CxC nursery",
              "Persist nursery memory and grade-up receipt",
          )
          hits=[x for x in forbidden if x in text]
          assert not hits, f'V1_WRITER_AUTHORITY_PRESENT:{hits}'
          print('PASS_V1_DEPRECATED_NO_WRITER_AUTHORITY')
          PY
