name: A1 C-Grade Pair Nursery V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py'
      - '.github/workflows/a1-c-grade-pair-nursery-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify CxC nursery contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_c_grade_pair_nursery_v1.py
          python -m backend.research.architecture_factory.a1_c_grade_pair_nursery_v1 --self-test

  nursery:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run legacy paid CxC nursery manually only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_c_grade_pair_nursery_v1 --out out/a1_c_grade_pair_nursery_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_c_grade_pair_nursery_v1.json'))
          assert r['max_pairs_per_run']==3
          assert r['max_paid_requests_per_run']==1
          assert r['pair_policy']['distinct_family_required'] is True
          assert r['pair_policy']['one_donor_gene_only'] is True
          assert r['pair_policy']['donor_numeric_threshold_copy'] is False
          assert r['grade_upgrade_gate']['minimum_trades']==12
          assert r['production_mutated'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'c':r['eligible_c_material_count'],'pairs':r['pair_count_this_run'],'upgrades':r['c_to_b_upgrade_count'],'provider':r['provider'],'next':r['next'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-c-grade-pair-nursery-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_c_grade_pair_nursery_v1.json
          if-no-files-found: error
          retention-days: 30
