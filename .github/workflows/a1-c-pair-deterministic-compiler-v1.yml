name: A1 C-Pair Deterministic Compiler V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_c_pair_deterministic_compiler_v1.py'
      - '.github/workflows/a1-c-pair-deterministic-compiler-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_c_pair_deterministic_compiler_v1.py'
      - 'backend/research/prep/strategy_synthesis_material_ssot_v1.json'
      - 'backend/research/rebuild/a1_exact25_disposition_ledger_v1.json'
      - '.github/workflows/a1-c-pair-deterministic-compiler-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_c_pair_deterministic_compiler_v1.py
          python -m backend.research.architecture_factory.a1_c_pair_deterministic_compiler_v1 --self-test
      - name: Evaluate deterministic CxC child
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_c_pair_deterministic_compiler_v1 --out out/cpair.json
          python - <<'PY'
          import json
          r=json.load(open('out/cpair.json'))
          assert r['provider_request_count']==0
          assert r['donor_numeric_threshold_copy'] is False
          assert r['production_mutated'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'pair':r['pair_id'],'child':r['child_material_id'],'metrics':r.get('metrics',{}),'upgrade':r['c_to_b_upgrade_pass'],'next':r['next'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist deterministic child receipt
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_c_pair_deterministic_compiler_latest.json
          cp out/cpair.json "$target"
          git config user.name a1-c-pair-deterministic-compiler
          git config user.email actions@users.noreply.github.com
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 synthesis: persist deterministic C-pair receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-c-pair-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cpair.json
          if-no-files-found: error
          retention-days: 90
