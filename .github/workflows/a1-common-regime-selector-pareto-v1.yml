name: A1 Common Regime Selector Pareto V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py'
      - '.github/workflows/a1-common-regime-selector-pareto-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py'
      - '.github/workflows/a1-common-regime-selector-pareto-v1.yml'
  schedule:
    - cron: '59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-common-regime-selector-pareto-v1
  cancel-in-progress: false

jobs:
  normalize-route-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test common selector
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py
          python -m backend.research.rebuild.a1_common_regime_selector_pareto_router_v1 --self-test
      - name: Normalize strategy-specific evidence into BAD NEUTRAL GOOD Pareto routes
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_common_regime_selector_pareto_router_v1 \
            --out out/a1_common_regime_selector_pareto_rolling_latest.json
          cat out/a1_common_regime_selector_pareto_rolling_latest.json
      - name: Verify research-only rolling selector contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_common_regime_selector_pareto_rolling_latest.json'))
          assert r['state']=='PASS_COMMON_REGIME_SELECTOR_RESEARCH_ACTIVE',r
          assert r['cross_strategy_filter_copy_forbidden'] is True,r
          assert r['post_outcome_threshold_fitting_forbidden'] is True,r
          assert r['fresh_oos_required'] is True and r['identity_h4_h5_required'] is True,r
          assert r['strategy_parameters_changed'] is False and r['numeric_threshold_sweep'] is False,r
          assert r['canonical_ledger_mutation'] is False and r['canonical_inventory_mutation'] is False,r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          assert len(r['strategies'])==6,r
          for x in r['strategies']:
              assert x['strategy_parameters_changed'] is False,x
              assert x['numeric_threshold_sweep'] is False,x
              assert x['post_outcome_runtime_feature_use'] is False,x
              assert x['bad_runtime_block_enabled'] is False,x
              assert x['good_runtime_boost_enabled'] is False,x
              assert x['execution_authority']=='NONE' and x['order_authority']=='BLOCKED',x
          print(json.dumps({
              'writer_role':'ROLLING_DIAGNOSTIC_ONLY',
              'canonical_writer':'VALIDATED_V2_ONLY',
              'routes':{x['strategy_id']:x['route'] for x in r['strategies']},
              'available_evidence':r['available_evidence'],
          },sort_keys=True))
          PY
      - name: Persist rolling receipt without overwriting validated canonical
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_common_regime_selector_pareto_rolling_latest.json
          cp out/a1_common_regime_selector_pareto_rolling_latest.json "$target"
          git config user.name 'a1-common-regime-selector-pareto-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist rolling common regime selector routes [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-common-regime-selector-pareto-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_common_regime_selector_pareto_rolling_latest.json
          if-no-files-found: warn
          retention-days: 30
