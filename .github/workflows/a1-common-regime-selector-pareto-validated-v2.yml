name: A1 Common Regime Selector Pareto Validated V2

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py'
      - 'backend/research/rebuild/a1_common_regime_selector_validated_evidence_v1.json'
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_validated_v2.py'
      - '.github/workflows/a1-common-regime-selector-pareto-validated-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py'
      - 'backend/research/rebuild/a1_common_regime_selector_validated_evidence_v1.json'
      - 'backend/research/rebuild/a1_common_regime_selector_pareto_validated_v2.py'
      - '.github/workflows/a1-common-regime-selector-pareto-validated-v2.yml'
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-common-regime-selector-pareto-validated-v2
  cancel-in-progress: false

jobs:
  validated-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/a1_common_regime_selector_pareto_router_v1.py \
            backend/research/rebuild/a1_common_regime_selector_pareto_validated_v2.py
          python -m backend.research.rebuild.a1_common_regime_selector_pareto_router_v1 --self-test
          python -m backend.research.rebuild.a1_common_regime_selector_pareto_validated_v2 --self-test
      - name: Build validated selector receipt
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_common_regime_selector_pareto_validated_v2 \
            --out out/a1_common_regime_selector_pareto_validated_latest.json
          cat out/a1_common_regime_selector_pareto_validated_latest.json
      - name: Verify validated findings override stale rolling routes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_common_regime_selector_pareto_validated_latest.json'))
          assert r['state']=='PASS_COMMON_REGIME_SELECTOR_VALIDATED_EVIDENCE_ACTIVE',r
          assert r['stale_rolling_evidence_cannot_override_validated_finding'] is True,r
          assert r['break_partial_success_preserved'] is True,r
          assert r['supertrend_liquid6_economic_upgrade_claim'] is False,r
          assert r['trendma_liquid6_economic_upgrade_claim'] is False,r
          assert r['naive_overlap_block_promotion_forbidden'] is True,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          m={x['strategy_id']:x for x in r['strategies']}
          b=m['break_and_continue']
          assert b['pareto']['relation']=='PARTIAL_SUCCESS_PRESERVE_AND_EXTEND',b
          assert set(b['pareto']['improved_metrics']) >= {'win_rate','net_pnl_bps','net_expectancy_bps'},b
          assert 'realized_exit_bucket_max_drawdown_bps' in b['pareto']['worsened_metrics'],b
          assert b['good_regime_candidate']['runtime_enabled'] is False,b
          for sid in ('supertrend_pullback','trend_ma_macd'):
              x=m[sid]
              assert 'EXIT_CLOSURE_LAG' not in x['trigger_classes'],x
              assert x['stale_trigger_superseded']['trigger']=='EXIT_CLOSURE_LAG',x
              assert x['breadth_discovery_candidate']['economic_upgrade_claim'] is False,x
              assert x['common_mode_risk_context']['conclusion']=='COMMON_MODE_STACKING_CONFIRMED_BUT_NAIVE_BLOCK_NOT_ECONOMIC_UPGRADE',x
              assert x['breadth_candidate_preserved'] is True,x
          print(json.dumps({
              'routes':{sid:m[sid]['route'] for sid in m},
              'break_relation':b['pareto']['relation'],
              'break_improved':b['pareto']['improved_metrics'],
              'break_worsened':b['pareto']['worsened_metrics'],
              'supertrend_trigger_classes':m['supertrend_pullback']['trigger_classes'],
              'trendma_trigger_classes':m['trend_ma_macd']['trigger_classes'],
          },sort_keys=True))
          PY
      - name: Persist validated selector after rolling selector
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          validated=backend/research/rebuild/a1_common_regime_selector_pareto_validated_latest.json
          canonical=backend/research/rebuild/a1_common_regime_selector_pareto_latest.json
          cp out/a1_common_regime_selector_pareto_validated_latest.json "$validated"
          cp out/a1_common_regime_selector_pareto_validated_latest.json "$canonical"
          git config user.name 'a1-common-regime-selector-pareto-validated-v2'
          git config user.email 'actions@users.noreply.github.com'
          git add "$validated" "$canonical"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist validated common regime selector routes [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-common-regime-selector-pareto-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_common_regime_selector_pareto_validated_latest.json
          if-no-files-found: warn
          retention-days: 30
