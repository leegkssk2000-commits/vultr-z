name: A1 Experimental Scalp Exhaustion Contract V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_policy_v1.json'
      - 'backend/research/rebuild/test_a1_experimental_scalp_snap_order_flow_exhaustion_v1.py'
      - '.github/workflows/a1-experimental-scalp-exhaustion-contract-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_policy_v1.json'
      - 'backend/research/rebuild/test_a1_experimental_scalp_snap_order_flow_exhaustion_v1.py'
      - '.github/workflows/a1-experimental-scalp-exhaustion-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and deterministic contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py
          python -m unittest backend.research.rebuild.test_a1_experimental_scalp_snap_order_flow_exhaustion_v1
      - name: Verify research-only authority and no fresh boundary yet
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for path in [
              'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_v1.json',
              'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json',
              'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_policy_v1.json',
          ]:
              d=json.load(open(path))
              a=d.get('authority', d)
              assert a.get('selection_authority') is False
              assert a.get('promotion_authority') is False
              assert a.get('execution_authority') == 'NONE'
              assert a.get('order_authority') == 'BLOCKED'
              assert a.get('live_trade_authority') == 'BLOCKED'
              assert int(a.get('protected_mutations',0)) == 0
          cfg=json.load(open('backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json'))
          assert cfg['verified_pretrade_cost_bps_reference']==14.0
          assert cfg['fresh_prospective_boundary_utc'] is None
          assert cfg['baseline_clock_reset'] is False
          print('PASS_SCALP_EXHAUSTION_EXPERIMENTAL_CONTRACT')
          PY
