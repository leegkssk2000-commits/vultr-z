name: A1 Experimental Scalp Exhaustion Economics V1

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/a1-experimental-scalp-exhaustion-economics-v1.yml'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_policy_v1.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-experimental-scalp-exhaustion-economics-v1.yml'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json'
      - 'backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_policy_v1.json'
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen experiment contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py
          python -m unittest backend.research.rebuild.test_a1_experimental_scalp_snap_order_flow_exhaustion_v1
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          cfg=json.loads(Path('backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json').read_text())
          reg=json.loads(Path('backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_v1.json').read_text())
          assert cfg['fresh_prospective_boundary_utc']=='2026-08-17T23:15:00Z'
          assert datetime.fromisoformat(cfg['fresh_prospective_boundary_utc'].replace('Z','+00:00')) > datetime.fromisoformat('2026-08-17T23:07:06+00:00')
          assert reg['experimental_not_baseline'] is True and reg['baseline_mutated'] is False
          assert cfg['baseline_clock_reset'] is False
          assert cfg['parameter_search'] is False and cfg['best_horizon_selection'] is False and cfg['threshold_tuning'] is False
          assert float(cfg['verified_pretrade_cost_bps_reference']) == 14.0
          print('PASS_SCALP_EXHAUSTION_ECONOMICS_RUNNER_CONTRACT')
          PY

  gen1-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json').read_text())
          generation=int(d.get('generation') or 0); done=int(d.get('done_count') or 0)
          allowed=(generation == 1 and done == 25)
          print('allowed=' + ('true' if allowed else 'false'))
          print(f'GEN1_GATE generation={generation} done={done}/25 allowed={allowed}')
          PY

  evaluate:
    needs: gen1-gate
    if: needs.gen1-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify GEN1 complete and experiment boundary
        id: boundary
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1.py
          python -m unittest backend.research.rebuild.test_a1_experimental_scalp_snap_order_flow_exhaustion_v1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json').read_text())
          assert int(d.get('done_count') or 0) == 25
          cfg=json.loads(Path('backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_config_v1.json').read_text())
          reg=json.loads(Path('backend/research/rebuild/a1_experimental_scalp_snap_order_flow_exhaustion_v1.json').read_text())
          boundary=cfg.get('fresh_prospective_boundary_utc')
          assert boundary == '2026-08-17T23:15:00Z'
          assert reg.get('experimental_not_baseline') is True and reg.get('baseline_mutated') is False
          print('boundary=' + boundary)
          PY
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Fetch prospective microstructure evidence read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BOUNDARY: ${{ steps.boundary.outputs.boundary }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          BOUNDARY_MS="$(python - <<'PY'
          import os
          from datetime import datetime
          print(int(datetime.fromisoformat(os.environ['BOUNDARY'].replace('Z','+00:00')).timestamp()*1000))
          PY
          )"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "BOUNDARY_MS='$BOUNDARY_MS' bash -se" > out/microstructure.jsonl <<'REMOTE'
          set -euo pipefail
          export BOUNDARY_MS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/home/z/z/ledger/production_bingx_ws_microstructure_v2.jsonl')
          if not p.is_file(): raise SystemExit('MICRO_HISTORY_MISSING')
          floor=int(os.environ['BOUNDARY_MS'])-600000; kept=0
          for line in p.read_text(errors='strict').splitlines():
              if not line.strip(): continue
              row=json.loads(line)
              if int(row.get('bucket_end_ms') or 0) >= floor:
                  print(json.dumps(row,sort_keys=True,separators=(',',':'))); kept+=1
          if kept < 2: raise SystemExit('MICRO_HISTORY_INSUFFICIENT_AFTER_BOUNDARY')
          PY
          REMOTE
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "cat /home/z/z/ledger/production_bingx_ws_microstructure_heartbeat_v2.json" > out/microstructure_heartbeat.json
      - name: Evaluate frozen scalp exhaustion experiment
        env:
          BOUNDARY: ${{ steps.boundary.outputs.boundary }}
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_experimental_scalp_snap_order_flow_exhaustion_evaluator_v1 --boundary "$BOUNDARY" --history out/microstructure.jsonl --symbols BTC-USDT,ETH-USDT --out out/scalp_exhaustion_economics.json
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-scalp-exhaustion-economics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            out/scalp_exhaustion_economics.json
            out/microstructure_heartbeat.json
