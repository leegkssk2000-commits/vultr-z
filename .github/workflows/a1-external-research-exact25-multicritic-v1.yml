name: A1 External Research Exact25 Multicritic V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_external_research_exact25_map_v1.json'
      - 'backend/research/architecture_factory/a1_external_research_exact25_router_v1.py'
      - 'backend/research/architecture_factory/a1_external_research_exact8_spec_v1.json'
      - 'backend/research/architecture_factory/a1_external_research_exact8_spec_v1.py'
      - 'backend/research/a1_ai_multicritic_review_v2.py'
      - '.github/workflows/a1-external-research-exact25-multicritic-v1.yml'

permissions:
  contents: read

concurrency:
  group: a1-external-research-exact25-multicritic-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate outcome-blind Exact25 router and review semantics
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_external_research_exact25_router_v1.py
          python -m py_compile backend/research/architecture_factory/a1_external_research_exact8_spec_v1.py
          python -m json.tool backend/research/architecture_factory/a1_external_research_exact25_map_v1.json >/dev/null
          python -m json.tool backend/research/architecture_factory/a1_external_research_exact8_spec_v1.json >/dev/null
          python -m backend.research.architecture_factory.a1_external_research_exact25_router_v1 --self-test
          python -m backend.research.architecture_factory.a1_external_research_exact8_spec_v1
          python -m backend.research.a1_ai_multicritic_review_v2 --self-test
          echo 'PASS_EXACT25_MULTICRITIC_STATIC_ONLY_NO_PAID_AI'

  review:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Groq SDK for explicit Exact25 review only
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Generate preregistered Exact25 shard
        run: |
          set -euo pipefail
          mkdir -p out/prep
          python -m backend.research.architecture_factory.a1_external_research_exact25_router_v1 \
            --shard-count 5 \
            --shard-index '${{ matrix.shard }}' \
            --output-dir out/prep \
            --receipt 'out/router_shard_${{ matrix.shard }}.json'
          test "$(find out/prep -maxdepth 1 -name '*.json' | wc -l)" -eq 5
      - name: Read existing Gemini receipt without new Gemini quota
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh out
          printf '%s' '{}' > out/gemini_external_evidence.json
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
            chmod 600 ~/.ssh/vps_key
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
              "cat /home/z/z/ledger/production_external_evidence_v1.json 2>/dev/null || printf '%s' '{}'" \
              > out/gemini_external_evidence.tmp || true
            python -m json.tool out/gemini_external_evidence.tmp >/dev/null 2>&1 && mv out/gemini_external_evidence.tmp out/gemini_external_evidence.json || true
          fi
          rm -f out/gemini_external_evidence.tmp
      - name: Run explicit independent critics on five axes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
        run: |
          set -euo pipefail
          python -m backend.research.a1_ai_multicritic_review_v2 \
            --prep-dir out/prep \
            --gemini-receipt out/gemini_external_evidence.json \
            --output 'out/review_shard_${{ matrix.shard }}.json'
          python - <<'PY'
          import json
          d=json.load(open("out/review_shard_${{ matrix.shard }}.json"))
          assert d['reviewed_strategy_count']==5,d
          assert d['selection_authority'] is False and d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-external-research-exact25-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            out/router_shard_${{ matrix.shard }}.json
            out/review_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: github.event_name == 'workflow_dispatch' && always()
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: a1-external-research-exact25-shard-*-${{ github.run_id }}
          path: out
          merge-multiple: true
      - name: Aggregate explicit fail-closed Exact25 review receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          reviews=[]; providers={'gemini':0,'openai':0,'groq':0,'workers_ai':0}; blockers=[]
          paths=sorted(Path('out').glob('review_shard_*.json'))
          for p in paths:
              d=json.loads(p.read_text()); reviews.extend(d.get('reviews') or [])
              for k in providers: providers[k]+=int((d.get('provider_successful_strategy_counts') or {}).get(k) or 0)
              blockers.extend(d.get('bottlenecks') or [])
          ids=[str(x.get('strategy_id') or '') for x in reviews]
          out={'schema_version':'zel.a1_external_research_exact25_multicritic.v1','state':'PASS_EXPLICIT_EXACT25_MULTICRITIC_COMPLETE' if len(paths)==5 and len(ids)==25 and len(set(ids))==25 else 'HOLD_EXPLICIT_EXACT25_MULTICRITIC_GAPS','reviewed_strategy_count':len(ids),'unique_strategy_count':len(set(ids)),'provider_successful_strategy_counts':providers,'bottlenecks':sorted(set(blockers)),'reviews':reviews,'automatic_schedule':False,'paid_review_requires_explicit_dispatch':True,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','live_trade_authority':'BLOCKED','protected_mutations':0,'action':'hold'}
          out['receipt_sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('out/a1_external_research_exact25_multicritic_v1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'state':out['state'],'reviewed':len(ids),'providers':providers,'manual_only':True},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-external-research-exact25-multicritic-v1-${{ github.run_id }}
          path: out/a1_external_research_exact25_multicritic_v1.json
          if-no-files-found: error
          retention-days: 90
