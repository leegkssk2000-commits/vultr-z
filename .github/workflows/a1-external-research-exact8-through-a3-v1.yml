name: A1 External Research Exact8 Through A3 V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_external_research_exact8_boundary_v1.json'
      - 'backend/research/architecture_factory/a1_external_research_exact8_through_a3_v1.py'
      - 'backend/research/architecture_factory/a1_external_research_exact8_through_a3_runner_v1.py'
      - 'backend/research/architecture_factory/a1_external_research_exact8_spec_v1.json'
      - 'backend/research/architecture_factory/a1_exact8_*_adapter_v1.py'
      - 'backend/research/prep/a3_exact25_forward_durability_v3.py'
      - '.github/workflows/a1-external-research-exact8-through-a3-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_external_research_exact8_boundary_v1.json'
      - 'backend/research/architecture_factory/a1_external_research_exact8_through_a3_v1.py'
      - 'backend/research/architecture_factory/a1_external_research_exact8_through_a3_runner_v1.py'
      - '.github/workflows/a1-external-research-exact8-through-a3-v1.yml'
  schedule:
    - cron: '55 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Exact8 through-A3 contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/architecture_factory/a1_external_research_exact8_through_a3_v1.py \
            backend/research/architecture_factory/a1_external_research_exact8_through_a3_runner_v1.py \
            backend/research/prep/a3_exact25_forward_durability_v3.py
          python -m json.tool backend/research/architecture_factory/a1_external_research_exact8_boundary_v1.json >/dev/null
          python -m backend.research.architecture_factory.a1_external_research_exact8_through_a3_runner_v1 --self-test
          python -m unittest backend.research.architecture_factory.test_a1_external_research_exact8_adapters_v1
          python -m backend.research.architecture_factory.a1_external_research_exact8_source_audit_v1 \
            --self-test --output out/a1_external_research_exact8_source_audit_self_test_v1.json
          python -m backend.research.prep.a3_exact25_forward_durability_v3 --self-test

  live-forward:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect append-only fresh evidence and route through A3
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_external_research_exact8_through_a3_runner_v1 \
            --collect-live \
            --state backend/research/prep/a1_external_research_exact8_forward_state_v1.json \
            --output out/a1_external_research_exact8_through_a3_v1.json
      - name: Verify fail-closed authority and fresh-only identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/a1_external_research_exact8_through_a3_v1.json').read_text())
          s=json.loads(Path('backend/research/prep/a1_external_research_exact8_forward_state_v1.json').read_text())
          b=json.loads(Path('backend/research/architecture_factory/a1_external_research_exact8_boundary_v1.json').read_text())
          assert r['boundary_utc']==b['boundary_utc']==s['boundary_utc'],(r.get('boundary_utc'),s.get('boundary_utc'),b.get('boundary_utc'))
          assert r['threshold_search'] is False and r['holdout_outcomes_accessed'] is False,r
          assert r['synthetic_market_evidence_used'] is False and r['parent_pass_inherited'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          assert int(r['protected_mutations'])==0 and r['exchange_order_submitted'] is False,r
          assert len(r['rows'])==6,r
          for row in r['rows']:
              for stage in ('a1','a2','a3'):
                  x=row[stage]
                  assert x.get('execution_authority')=='NONE' and x.get('order_authority')=='BLOCKED', (row['child_id'],stage,x)
          print('PASS_EXACT8_THROUGH_A3_FAIL_CLOSED')
          PY
      - name: Persist append-only forward source state
        run: |
          set -euo pipefail
          git config user.name 'exact8-forward-collector'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/prep/a1_external_research_exact8_forward_state_v1.json
          if git diff --cached --quiet; then
            echo 'NO_STATE_DELTA'
          else
            git commit -m 'Exact8: persist fresh forward evidence [skip ci]'
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: a1-exact8-through-a3-v1
          path: |
            out/a1_external_research_exact8_through_a3_v1.json
            backend/research/prep/a1_external_research_exact8_forward_state_v1.json
      - name: Upsert compact status on issue 566
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          marker='<!-- A1_EXTERNAL_RESEARCH_EXACT8_THROUGH_A3_V1 -->'
          try:
              r=json.loads(Path('out/a1_external_research_exact8_through_a3_v1.json').read_text())
              lines=[marker,'## Exact8 fresh → A3',f"run={os.environ.get('RUN_ID')}|state={r.get('state')}|boundary={r.get('boundary_utc')}",f"A1={r.get('a1_pass_count',0)}/6|A2={r.get('a2_pass_count',0)}/6|A3={r.get('a3_pass_count',0)}/6|effect_verified={r.get('effect_verified_count',0)}"]
              for x in r.get('rows') or []:
                  lines.append(f"{x.get('parent_id')}->{x.get('child_id')}|trades={x.get('completed_child_trades',0)}|A1={x.get('a1_state')}|A2={x.get('a2_state')}|A3={x.get('a3_state')}")
              lines.append('authority=NONE/BLOCKED/BLOCKED|action=hold')
              body='\n'.join(lines)
          except Exception as exc:
              body='\n'.join([marker,'## Exact8 fresh → A3',f"run={os.environ.get('RUN_ID')}|state=HOLD_WORKFLOW_NO_RECEIPT|error={type(exc).__name__}",'authority=NONE/BLOCKED/BLOCKED|action=hold'])
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; base=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          req=urllib.request.Request(f'{base}/issues/566/comments?per_page=100',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as response: comments=json.loads(response.read().decode())
          target=next((x for x in comments if marker in str(x.get('body') or '')),None)
          payload=json.dumps({'body':body}).encode()
          url=f"{base}/issues/comments/{target['id']}" if target else f'{base}/issues/566/comments'
          request=urllib.request.Request(url,data=payload,headers=headers,method='PATCH' if target else 'POST')
          with urllib.request.urlopen(request,timeout=30) as response: print(response.status)
          PY
