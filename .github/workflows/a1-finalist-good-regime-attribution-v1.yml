name: A1 Finalist GOOD Regime Attribution V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_finalist_good_regime_attribution_v1.py'
      - '.github/workflows/a1-finalist-good-regime-attribution-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  good-regime-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      FROZEN_ARTIFACT_ID: '9495054717'
      FROZEN_ST_RECEIPT_SHA256: '5be1986bba47492333e6df1daaf735538ee73694d99da68332344d7215344eec'
      FROZEN_TM_RECEIPT_SHA256: 'de18e7f12e851a1912b225a0dc9943b590c25f772b93be2f7f353bfb2f364f53'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_finalist_good_regime_attribution_v1.py
          python -m backend.research.rebuild.a1_finalist_good_regime_attribution_v1 --self-test
      - name: Download and verify frozen PR990 Liquid6 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen out
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            -o frozen/pr990.zip
          unzip -q frozen/pr990.zip -d frozen/pr990
          ST=$(find frozen/pr990 -type f -name 'supertrend_liquid6.json' | head -1)
          TM=$(find frozen/pr990 -type f -name 'trendma_liquid6.json' | head -1)
          test -n "$ST" -a -n "$TM"
          cp "$ST" frozen/supertrend_liquid6.json
          cp "$TM" frozen/trendma_liquid6.json
          python - <<'PY'
          import json, os
          st=json.load(open('frozen/supertrend_liquid6.json'))
          tm=json.load(open('frozen/trendma_liquid6.json'))
          assert st['strategy_id']=='supertrend_pullback' and int(st['completed_trades'])==47,st.get('completed_trades')
          assert tm['strategy_id']=='trend_ma_macd' and int(tm['completed_trades'])==18,tm.get('completed_trades')
          assert st.get('receipt_sha256')==os.environ['FROZEN_ST_RECEIPT_SHA256'],st.get('receipt_sha256')
          assert tm.get('receipt_sha256')==os.environ['FROZEN_TM_RECEIPT_SHA256'],tm.get('receipt_sha256')
          assert (st.get('source_quality_gate') or {}).get('state')=='PASS',st.get('source_quality_gate')
          assert (tm.get('source_quality_gate') or {}).get('state')=='PASS',tm.get('source_quality_gate')
          assert not (st.get('integrity_defects') or []) and not (tm.get('integrity_defects') or [])
          assert int(st.get('leakage_lookahead') or 0)==0 and int(tm.get('leakage_lookahead') or 0)==0
          print('PASS_FROZEN_PR990_LIQUID6_INNER_RECEIPT_AUTHORITY')
          PY
      - name: Attribute strategy-specific GOOD pre-entry regimes
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_finalist_good_regime_attribution_v1 \
            --strategy-id supertrend_pullback \
            --receipt frozen/supertrend_liquid6.json \
            --out out/supertrend_good_regime.json
          python -m backend.research.rebuild.a1_finalist_good_regime_attribution_v1 \
            --strategy-id trend_ma_macd \
            --receipt frozen/trendma_liquid6.json \
            --out out/trendma_good_regime.json
      - name: Verify discovery-only contract and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          result={}
          for sid,name in [('supertrend_pullback','supertrend_good_regime.json'),('trend_ma_macd','trendma_good_regime.json')]:
              r=json.load(open('out/'+name))
              assert r['strategy_id']==sid and r['authority_match'] is True,r
              assert r['discovery_only'] is True and r['fresh_oos_required'] is True and r['identity_h4_h5_required'] is True,r
              assert r['numeric_threshold_sweep'] is False and r['post_outcome_runtime_feature_use'] is False,r
              assert r['strategy_parameters_changed'] is False and r['runtime_selector_enabled'] is False,r
              assert r['selection_authority'] is False and r['promotion_authority'] is False,r
              assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
              rec=r.get('recommended_discovery_candidate')
              if rec:
                  assert rec['preentry_only'] is True and rec['numeric_threshold_fitted'] is False and rec['runtime_enabled'] is False,rec
              result[sid]={
                  'state':r['state'],
                  'parent':r['parent'],
                  'candidate_count':r['candidate_count'],
                  'recommended':rec,
              }
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-finalist-good-regime-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
          if-no-files-found: warn
          retention-days: 30
