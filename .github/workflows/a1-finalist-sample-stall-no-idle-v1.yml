name: A1 Finalist Sample-Stall No-Idle V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/trend_ma_macd_reaccel_child_policy_v1.py'
      - 'backend/research/rebuild/supertrend_pullback_touch_reclaim_child_policy_v1.py'
      - 'backend/research/rebuild/break_and_continue_box_break_child_policy_v1.py'
      - 'backend/research/rebuild/a1_finalist_sample_stall_no_idle_router_v1.py'
      - 'backend/research/rebuild/a1_finalist_no_idle_action_executor_v1.py'
      - '.github/workflows/a1-finalist-sample-stall-no-idle-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/trend_ma_macd_reaccel_child_policy_v1.py'
      - 'backend/research/rebuild/supertrend_pullback_touch_reclaim_child_policy_v1.py'
      - 'backend/research/rebuild/break_and_continue_box_break_child_policy_v1.py'
      - 'backend/research/rebuild/a1_finalist_sample_stall_no_idle_router_v1.py'
      - 'backend/research/rebuild/a1_finalist_no_idle_action_executor_v1.py'
      - '.github/workflows/a1-finalist-sample-stall-no-idle-v1.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-finalist-sample-stall-no-idle-v1
  cancel-in-progress: false

jobs:
  diagnose-repair-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test no-idle lane
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/trend_ma_macd_reaccel_child_policy_v1.py \
            backend/research/rebuild/supertrend_pullback_touch_reclaim_child_policy_v1.py \
            backend/research/rebuild/break_and_continue_box_break_child_policy_v1.py \
            backend/research/rebuild/a1_finalist_sample_stall_no_idle_router_v1.py \
            backend/research/rebuild/a1_finalist_no_idle_action_executor_v1.py
          python -m backend.research.rebuild.trend_ma_macd_reaccel_child_policy_v1
          python -m backend.research.rebuild.supertrend_pullback_touch_reclaim_child_policy_v1
          python -m backend.research.rebuild.break_and_continue_box_break_child_policy_v1
          python -m backend.research.rebuild.a1_finalist_sample_stall_no_idle_router_v1 --self-test
          python -m backend.research.rebuild.a1_finalist_no_idle_action_executor_v1 --self-test
      - name: Diagnose sample scarcity and route repairs immediately
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_finalist_sample_stall_no_idle_router_v1 \
            --out out/a1_finalist_sample_stall_no_idle_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_finalist_sample_stall_no_idle_latest.json'))
          assert r['state']=='PASS_NO_IDLE_RESEARCH_ACTIVE',r
          assert r['strategy_parameters_changed'] is False and r['thresholds_changed'] is False,r
          assert r['canonical_ledger_mutation'] is False and r['canonical_inventory_mutation'] is False,r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          for x in r['targets']:
              assert x['incumbent_mutated'] is False and x['numeric_threshold_sweep'] is False,x
              assert x['execution_authority']=='NONE' and x['order_authority']=='BLOCKED',x
              d=x.get('parent_diagnostic') or {}
              if d:
                  assert d['monitor_thresholds_are_research_sla_not_strategy_parameters'] is True,d
          print(json.dumps({
              'frozen_child_count':r['frozen_child_count'],
              'fresh25_ready_count':r['fresh25_ready_count'],
              'routes':{x['strategy_id']:x['state'] for x in r['targets']},
              'bottlenecks':{x['strategy_id']:(x.get('parent_diagnostic') or {}).get('feature_funnel',{}).get('largest_sequential_drop_stage') for x in r['targets']},
          },sort_keys=True))
          PY
      - name: Execute routed diagnostics and exact-parent repair comparisons
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_finalist_no_idle_action_executor_v1 \
            --routes out/a1_finalist_sample_stall_no_idle_latest.json \
            --out out/a1_finalist_no_idle_action_executor_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_finalist_no_idle_action_executor_latest.json'))
          assert r['state']=='PASS_NO_IDLE_ACTION_EXECUTOR_ACTIVE',r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          assert r['canonical_ledger_mutation'] is False and r['canonical_inventory_mutation'] is False,r
          assert r['strategy_parameters_changed'] is False and r['protected_mutations']==0,r
          for x in r['actions']:
              assert x['incumbent_mutated'] is False and x['restart_from_zero'] is False,x
          print(json.dumps({
              'actionable_count':r['actionable_count'],
              'repair_ready_count':r['repair_ready_count'],
              'integrity_hold_count':r['integrity_hold_count'],
              'actions':{x['strategy_id']:x['action_type'] for x in r['actions']},
          },sort_keys=True))
          PY
      - name: Persist no-idle router and action-executor receipts on master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          router_target=backend/research/rebuild/a1_finalist_sample_stall_no_idle_latest.json
          executor_target=backend/research/rebuild/a1_finalist_no_idle_action_executor_latest.json
          cp out/a1_finalist_sample_stall_no_idle_latest.json "$router_target"
          cp out/a1_finalist_no_idle_action_executor_latest.json "$executor_target"
          git config user.name 'a1-finalist-sample-stall-no-idle-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$router_target" "$executor_target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 finalists: persist no-idle routed repair execution [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-finalist-sample-stall-no-idle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_finalist_sample_stall_no_idle_latest.json
            out/a1_finalist_no_idle_action_executor_latest.json
          if-no-files-found: warn
          retention-days: 30
