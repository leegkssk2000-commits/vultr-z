name: A1 G4 Symbol Acceleration Audit V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_g4_symbol_acceleration_audit_v1.py'
      - '.github/workflows/a1-g4-symbol-acceleration-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_g4_symbol_acceleration_audit_v1.py
          python -m backend.research.rebuild.a1_g4_symbol_acceleration_audit_v1 --self-test
      - name: Audit eligible operational symbols without outcomes
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_g4_symbol_acceleration_audit_v1 \
            --output out/a1_g4_symbol_acceleration_audit_latest.json
      - name: Verify fail-closed semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_g4_symbol_acceleration_audit_latest.json'))
          assert r['schema_version']=='zel.a1.g4.symbol_acceleration_audit.v1'
          assert r['current_child_total_closed_T']==0
          assert r['eligibility']['uses_trade_pnl'] is False
          assert r['eligibility']['uses_post_boundary_outcomes'] is False
          assert r['arrival_rate_rule']['preboundary_only'] is True
          assert r['arrival_rate_rule']['outcome_blind'] is True
          assert r['g5_broad_population_change_allowed'] is False
          assert r['paid_provider_calls']==0
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'eligible':r['eligible_symbols'],'extra':r['extra_eligible_symbols'],'rates':r['arrival_rate_rule']['lanes']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-g4-symbol-acceleration-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_g4_symbol_acceleration_audit_latest.json
          if-no-files-found: error
          retention-days: 90
