name: A1 G4 Trend Rider Prospective Observer V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_g4_trend_rider_prospective_observer_v1.py'
      - 'backend/research/rebuild/a1_pre_shadow_qualification_latest.json'
      - 'backend/research/rebuild/a1_trend_rider_delayed_fill_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_long_only_exact_parent_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - 'backend/research/contracts/a1_trend_rider_long_only_exact_parent_v1.json'
      - '.github/workflows/a1-g4-trend-rider-prospective-observer-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_g4_trend_rider_prospective_observer_v1.py'
      - 'backend/research/rebuild/a1_pre_shadow_qualification_latest.json'
      - 'backend/research/rebuild/a1_trend_rider_delayed_fill_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_long_only_exact_parent_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - 'backend/research/contracts/a1_trend_rider_long_only_exact_parent_v1.json'
      - '.github/workflows/a1-g4-trend-rider-prospective-observer-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2,6,10,14,18,22 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-g4-trend-rider-prospective-observer-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify G4 observer is stage-safe and read-only
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_g4_trend_rider_prospective_observer_v1.py
          python -m backend.research.rebuild.a1_g4_trend_rider_prospective_observer_v1 --self-test

  observe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild frozen prospective exact parent and long-only child
        run: |
          set -euo pipefail
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          DELAYED='backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
          LONG='backend/research/contracts/a1_trend_rider_long_only_exact_parent_v1.json'
          BOUNDARY="$(python -c "import json;print(json.load(open('$DELAYED'))['frozen_at_utc'])")"
          python -m backend.research.rebuild.a1_trend_rider_delayed_fill_evaluator_v1 \
            --symbols "$SYMBOLS" --mode prospective --boundary-utc "$BOUNDARY" --contract "$DELAYED" \
            --out out/delayed_prospective.json
          python -m backend.research.rebuild.a1_trend_rider_long_only_exact_parent_evaluator_v1 \
            --parent out/delayed_prospective.json --contract "$LONG" --mode prospective \
            --out out/long_only_prospective.json
      - name: Run full H4/H5 only when the fresh sample is mature
        run: |
          set -euo pipefail
          MATURE="$(python - <<'PY'
          import json
          r=json.load(open('out/long_only_prospective.json'))
          symbols={str(x['symbol']) for x in r.get('trades') or [] if x.get('symbol')}
          ok=int(r.get('completed_trades') or 0)>=25 and len(symbols)>=2 and (r.get('source_quality_gate') or {}).get('state')=='PASS'
          print('true' if ok else 'false')
          PY
          )"
          if [ "$MATURE" = "true" ]; then
            python -m backend.research.rebuild.a1_trend_rider_h4_h5_hardening_v1 \
              --receipt out/long_only_prospective.json \
              --out out/long_only_prospective_hardening.json
          fi
      - name: Produce G4 read-only prospective observer receipt
        run: |
          set -euo pipefail
          HARDENING_ARGS=()
          if [ -f out/long_only_prospective_hardening.json ]; then
            HARDENING_ARGS=(--hardening out/long_only_prospective_hardening.json)
          fi
          python -m backend.research.rebuild.a1_g4_trend_rider_prospective_observer_v1 \
            --legacy-pre-shadow backend/research/rebuild/a1_pre_shadow_qualification_latest.json \
            --fresh out/long_only_prospective.json \
            "${HARDENING_ARGS[@]}" \
            --out out/a1_g4_trend_rider_prospective_observer_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_g4_trend_rider_prospective_observer_v1.json'))
          assert r['current_fsm_stage']=='G4', r
          assert r['canonical_shadow_stage']=='G12', r
          assert r['observer_mode']=='READ_ONLY_RESEARCH_FORWARD_OBSERVER', r
          assert r['legacy_name_does_not_grant_g12_shadow'] is True, r
          assert r['canonical_shadow_entry_granted'] is False and r['canonical_shadow_mutation'] is False, r
          assert r['paper_entry_granted'] is False and r['full_survivor_seal_granted'] is False, r
          assert r['selection_authority'] is False and r['promotion_authority'] is False, r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED', r
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0, r
          print(json.dumps({
              'state':r['state'],
              'fresh_trades':r['fresh_trade_count'],
              'fresh_symbols':r['fresh_symbol_count'],
              'source_quality':r['fresh_source_quality_state'],
              'h4':r['h4_state'],
              'h5':r['h5_state'],
              'g12_shadow_entry':r['canonical_shadow_entry_granted'],
              'receipt':r['receipt_sha256'],
          },sort_keys=True))
          PY
      - name: Persist latest G4 observer receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_g4_trend_rider_prospective_observer_latest.json
          cp out/a1_g4_trend_rider_prospective_observer_v1.json "$target"
          git config user.name 'a1-g4-trend-rider-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 G4: persist trend_rider prospective observer [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish G4 observer state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_g4_trend_rider_prospective_observer_v1.json'))
          marker='<!-- A1_G4_TREND_RIDER_PROSPECTIVE_OBSERVER_V1 -->'
          body='\n'.join([
              marker,
              '## A1 G4 trend_rider prospective observer',
              f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",
              f"stage={r['current_fsm_stage']}|canonical_shadow={r['canonical_shadow_stage']}|shadow_entry={str(r['canonical_shadow_entry_granted']).lower()}|shadow_mutation={str(r['canonical_shadow_mutation']).lower()}",
              f"fresh_trades={r['fresh_trade_count']}|fresh_symbols={r['fresh_symbol_count']}|source={r['fresh_source_quality_state']}|h4={r['h4_state']}|h5={r['h5_state']}",
              'legacy pre-shadow naming is readiness metadata only and does not grant G12 Shadow',
              'research continues in parallel; selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0'])
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((x for x in comments if marker in str(x.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_G4_TREND_RIDER_PROSPECTIVE_OBSERVER_V1_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-g4-trend-rider-prospective-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
