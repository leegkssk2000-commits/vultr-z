name: A1 GEN2 1H Reversal Replacement Dev V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_gen2_1h_reversal_replacement_dev_v1.py'
      - '.github/workflows/a1-gen2-1h-reversal-replacement-dev-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_gen2_1h_reversal_replacement_dev_v1.py
          python -m backend.research.architecture_factory.a1_gen2_1h_reversal_replacement_dev_v1 --self-test
      - name: Run development economics
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_gen2_1h_reversal_replacement_dev_v1 --out out/a1_gen2_1h_reversal_replacement_dev_v1.json
          cat out/a1_gen2_1h_reversal_replacement_dev_v1.json
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_gen2_1h_reversal_replacement_dev_v1.json'))
          marker='<!-- A1_GEN2_1H_REVERSAL_REPLACEMENT_DEV_V1 -->'
          body='\n'.join([marker,'## A1 GEN2 1H Reversal Replacement Dev V1',f"run_id={os.environ['RUN_ID']}",f"candidate_id={r['candidate_id']}",f"boundary={r['boundary']}",'metrics='+json.dumps(r['metrics'],sort_keys=True),f"economic_candidate={str(r['economic_candidate']).lower()}",f"receipt_sha256={r['receipt_sha256']}",'development_only=true|prospective=false|selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as q: cs=json.load(q)
          old=next((c for c in cs if marker in str(c.get('body') or '')),None)
          url=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-1h-reversal-replacement-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: out/a1_gen2_1h_reversal_replacement_dev_v1.json
