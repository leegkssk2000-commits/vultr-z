name: A1 GEN2 4H EMA State Dev V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_gen2_4h_ema_state_dev_v1.py'
      - '.github/workflows/a1-gen2-4h-ema-state-dev-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify EMA contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_gen2_4h_ema_state_dev_v1.py
      - name: Run EMA development economics
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_gen2_4h_ema_state_dev_v1
          cat out/a1_gen2_4h_ema_state_dev_v1.json
      - name: Publish EMA receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_gen2_4h_ema_state_dev_v1.json'))
          marker='<!-- A1_GEN2_4H_EMA_STATE_DEV_V1 -->'
          rows=[]
          for cid,c in r['candidates'].items():
            rows.append(cid+'='+json.dumps(c['metrics'],sort_keys=True))
            rows.append(cid+'_costs='+json.dumps(c['cost_stress'],sort_keys=True))
            rows.append(cid+'_by_symbol='+json.dumps(c['by_symbol'],sort_keys=True))
            rows.append(cid+'_by_side='+json.dumps(c['by_side'],sort_keys=True))
          body='\n'.join([marker,'## A1 GEN2 4H EMA State Dev V1',f"run_id={os.environ['RUN_ID']}",*rows,f"receipt_sha256={r['receipt_sha256']}",'development_only=true|prospective=false|selection=false|promotion=false|execution=NONE|order/live=BLOCKED'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as q: cs=json.load(q)
          old=next((c for c in cs if marker in str(c.get('body') or '')),None)
          url=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-4h-ema-state-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: out/a1_gen2_4h_ema_state_dev_v1.json
