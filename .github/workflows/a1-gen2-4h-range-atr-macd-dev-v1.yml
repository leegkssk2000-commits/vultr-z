name: A1 GEN2 4H Range ATR MACD Dev V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_gen2_4h_range_atr_macd_dev_v1.py'
      - '.github/workflows/a1-gen2-4h-range-atr-macd-dev-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run economics
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_gen2_4h_range_atr_macd_dev_v1.py
          mkdir -p out
          python -m backend.research.architecture_factory.a1_gen2_4h_range_atr_macd_dev_v1
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_gen2_4h_range_atr_macd_dev_v1.json'));marker='<!-- A1_GEN2_4H_RANGE_ATR_MACD_DEV_V1 -->'
          body='\n'.join([marker,'## A1 GEN2 4H Range ATR MACD Dev V1',f"run_id={os.environ['RUN_ID']}",'metrics='+json.dumps(r['metrics'],sort_keys=True),'costs='+json.dumps(r['cost_stress'],sort_keys=True),'by_symbol='+json.dumps(r['by_symbol'],sort_keys=True),'by_side='+json.dumps(r['by_side'],sort_keys=True),f"receipt_sha256={r['receipt_sha256']}",'development_only=true|prospective=false|selection=false|promotion=false|execution=NONE|order/live=BLOCKED'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'};base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as q:cs=json.load(q)
          old=next((c for c in cs if marker in str(c.get('body') or '')),None);url=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if old else 'POST')):pass
          PY
