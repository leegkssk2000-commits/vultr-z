# wake 2026-08-20 dev-econ
name: A1 GEN2 Dev Economics Weekly Sweep V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_gen2_dev_econ_weekly_sweep_v1.py'
      - '.github/workflows/a1-gen2-dev-econ-weekly-sweep-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-gen2-dev-econ-weekly-sweep-v1
  cancel-in-progress: false

jobs:
  dev-econ:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run development-only economics
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_gen2_dev_econ_weekly_sweep_v1.py
          python -m backend.research.architecture_factory.a1_gen2_dev_econ_weekly_sweep_v1 --out out.json
          python - <<'PY'
          import json
          r=json.load(open('out.json'))
          assert r['development_only'] is True
          assert r['uses_data_strictly_before_gen1_boundary'] is True
          assert r['fresh_prospective_boundary_created'] is False
          assert r['heavy_gen2_launch_started'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          print(json.dumps({'candidate':r['candidate_id'],'old':r['old'],'new':r['new'],'economic_pass':r['economic_pass'],'cost':r['cost_model']},sort_keys=True))
          PY
      - name: Publish economic receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out.json')); n=r['new']; o=r['old']
          marker='<!-- A1_GEN2_DEV_ECON_WEEKLY_SWEEP_V1 -->'
          body='\n'.join([marker,'## A1 GEN2 Development Economics — Weekly Sweep',f"run={os.environ['RUN_ID']}",
            f"candidate={r['candidate_id']}|development_only=true|prospective=false|heavy=false",
            f"old_trades={o['trades']}|old_net={o['net_pnl_bps']}bps|old_status={o['status']}",
            f"new_trades={n['trades']}|gross_exp={n['gross_expectancy_bps']}bps|net_exp={n['net_expectancy_bps']}bps|net_pnl={n['net_pnl_bps']}bps|PF={n['profit_factor']}|payoff={n['payoff']}|WR={n['win_rate']}|DD={n['drawdown_bps']}bps",
            f"economic_pass={str(r['economic_pass']).lower()}|receipt={r['receipt_sha256']}",
            f"cost_model={r['cost_model']}",
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|exchange_order=false|protected_mutations=0'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if existing else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-gen2-dev-econ-weekly-sweep-${{ github.run_id }}
          retention-days: 90
          path: out.json
