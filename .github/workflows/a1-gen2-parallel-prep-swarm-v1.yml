name: A1 GEN2 Parallel PREP Swarm V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py'
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v5.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v2.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v3.py'
      - 'backend/research/architecture_factory/a1_sync_external_evidence_v1.py'
      - 'backend/research/architecture_factory/a1_youtube_evidence_latest.json'
      - 'backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py'
      - 'backend/research/architecture_factory/test_a1_gen2_expanded_dsl_v1.py'
      - 'backend/research/architecture_factory/a1_failure_economics_v1.py'
      - 'backend/research/architecture_factory/gemini_provider_v1.py'
      - 'backend/research/architecture_factory/a1_free_evidence_sweep_v1.json'
      - 'backend/research/contracts/p3_carry_flow_prospective_native_v1.json'
      - 'backend/research/contracts/a1_basis_funding_oi_subaxis_replay_v1.json'
      - 'backend/research/architecture_factory/a1_p3_history_readiness_latest.json'
      - '.github/workflows/a1-gen2-parallel-prep-swarm-v1.yml'
  workflow_run:
    workflows: ['A1 Exact25 Rebuilt Controller V1']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: a1-gen2-parallel-prep-swarm-v1
  cancel-in-progress: false
jobs:
  prep:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install provider dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Synchronize verified evidence in working copy
        run: |
          set -euo pipefail
          python -m backend.research.architecture_factory.a1_sync_external_evidence_v1 --write backend/research/architecture_factory/a1_free_evidence_sweep_v1.json
      - name: Verify quota-safe builder and economics contract
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v5.py \
            backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py \
            backend/research/architecture_factory/a1_gen2_generic_dev_econ_v2.py \
            backend/research/architecture_factory/a1_gen2_generic_dev_econ_v3.py \
            backend/research/architecture_factory/a1_sync_external_evidence_v1.py \
            backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py \
            backend/research/architecture_factory/a1_failure_economics_v1.py \
            backend/research/architecture_factory/gemini_provider_v1.py
          python -m unittest backend.research.architecture_factory.test_a1_gen2_expanded_dsl_v1
          python -m backend.research.architecture_factory.a1_gen2_generic_dev_econ_v3
          python -m backend.research.architecture_factory.a1_failure_economics_v1
          python -m backend.research.architecture_factory.gemini_provider_v1
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v5 --self-test
      - name: Generate and auto-replay primitive-grounded PREP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v5 --output out/a1_terminal_repair_swarm_v5.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_terminal_repair_swarm_v5.json')); p=r['alpha_primitive_mining']; h=r['source_history_readiness']; fp=r['funding_axis_probe']; fix=r['source_gate_fix']
          assert r['ledger_done_count'] < 25 and r['prep_only'] is True
          assert r['launch']['state']=='BLOCKED_GEN1_INCOMPLETE'
          assert r['api_economics_policy']['all_pre_economics_critics']=='DISABLED'
          assert r['api_economics_policy']['development_economics']=='AUTOMATIC_SAME_RUN'
          assert r['api_economics_policy']['failure_economics']=='MANDATORY_BEFORE_REPAIR_API'
          assert p['threshold_sweep'] is False and p['development_only'] is True
          assert h['funding']['ready'] is True
          assert fix['basis_oi_gate_lowered'] is False and fix['basis_oi_backfill_fabricated'] is False
          assert fix['historical_coverage_claim_required_for_subaxis'] is False
          assert fix['basis_funding_oi_subaxis_flow_required'] is False
          assert fix['full_carry_flow_contract_unchanged'] is True
          assert fix['basis_oi_prospective_replay_supported_after_gate'] is True
          assert r['evidence_summary']['youtube_preferred_100k_plus'] >= 1
          print(json.dumps({'done':r['ledger_done_count'],'terminal':r['terminal_count'],'primitive_usable':p['economically_usable_count'],'primitive_top':p['usable'][:5],'machine':r['machine_replayable_count'],'dev_pass':r['development_economic_pass_count'],'funding_probe':fp,'source_history':h,'source_gate_fix':fix,'failure_economics':r['failure_economics'],'causal_repair_dev':r['causal_repair_development_economics'],'gemini_batch':r['gemini_batch'],'evidence':r['evidence_summary']},sort_keys=True))
          PY
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_terminal_repair_swarm_v5.json')); d=r.get('development_economics') or {}; f=r.get('failure_economics') or {}; rd=r.get('causal_repair_development_economics') or {}; p=r.get('alpha_primitive_mining') or {}; h=r.get('source_history_readiness') or {}; fp=r.get('funding_axis_probe') or {}; fix=r.get('source_gate_fix') or {}; marker='<!-- A1_GEN2_PARALLEL_PREP_SWARM_V1 -->'
          providers={}
          for sid,row in (r.get('provider_state') or {}).items():
            for name,v in (row or {}).items():
              x=providers.setdefault(name,{'success':0,'fail':0,'skipped':0,'candidates':0,'machine':0})
              if v.get('skipped'): x['skipped']+=1
              elif v.get('successful'):
                x['success']+=1; x['candidates']+=int(v.get('candidate_count') or 0); x['machine']+=int(v.get('machine_replayable_count') or 0)
              else: x['fail']+=1
          basis=h.get('basis') or {}; funding=h.get('funding') or {}; oi=h.get('open_interest') or {}
          body='\n'.join([
            marker,'## A1 GEN2 Parallel PREP Swarm V1',f"run={os.environ['RUN_ID']}",
            f"done_count={r['ledger_done_count']}/25|terminal_count={r['terminal_count']}|prep_only=true",
            f"primitive_usable={p.get('economically_usable_count',0)}|primitive_total={p.get('primitive_count',0)}|primitive_threshold_sweep=false",
            'primitive_top='+json.dumps((p.get('usable') or [])[:5],sort_keys=True),
            f"machine_replayable={r['machine_replayable_count']}|repairs={r['queued_repair_count']}|new_arch={r['queued_new_arch_count']}",
            f"dev_econ_pass={d.get('economic_pass_count',0)}|dev_econ_fail={d.get('economic_fail_count',0)}|insufficient_events={d.get('insufficient_event_count',0)}|source_skip={d.get('source_skip_count',0)}|spec_reject={d.get('spec_reject_count',0)}",
            f"source_ready=funding:{funding.get('ready')}|basis:{basis.get('ready')}|oi:{oi.get('ready')}|basis_oi_progress={basis.get('coverage_progress_ratio')}|basis_oi_remaining_days={basis.get('remaining_days')}",
            'source_gate_fix='+json.dumps(fix,sort_keys=True),
            'funding_probe='+json.dumps(fp,sort_keys=True),
            f"failure_econ_no_gross={f.get('no_gross_edge_count',0)}|cost_dominated={f.get('cost_dominated_count',0)}|tail_payoff={f.get('tail_or_payoff_failure_count',0)}|single_repair_selected={len(f.get('selected_for_single_repair') or [])}",
            'single_repair_targets='+json.dumps(f.get('selected_for_single_repair') or [],sort_keys=True),
            f"single_repair_pass={rd.get('economic_pass_count',0)}|single_repair_fail={rd.get('economic_fail_count',0)}|single_repair_spec_reject={rd.get('spec_reject_count',0)}",
            'single_repair_passes='+json.dumps(rd.get('passes') or [],sort_keys=True),
            'dev_passes='+json.dumps(d.get('passes') or [],sort_keys=True),
            'providers='+json.dumps(providers,sort_keys=True),
            'gemini_batch='+json.dumps(r.get('gemini_batch'),sort_keys=True),
            'evidence='+json.dumps(r.get('evidence_summary'),sort_keys=True),
            'policy='+json.dumps(r.get('api_economics_policy'),sort_keys=True),
            f"receipt={r['receipt_sha256']}",
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|exchange_order=false|protected_mutations=0'])
          hds={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=hds)) as q: cs=json.load(q)
          e=next((c for c in cs if marker in str(c.get('body') or '')),None)
          url=e.get('url') if e else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=hds,method='PATCH' if e else 'POST')): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-parallel-prep-swarm-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: out/a1_terminal_repair_swarm_v5.json
