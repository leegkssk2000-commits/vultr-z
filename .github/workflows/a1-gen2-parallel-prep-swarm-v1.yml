name: A1 GEN2 Parallel PREP Swarm V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py'
      - 'backend/research/architecture_factory/a1_free_evidence_sweep_v1.json'
      - '.github/workflows/a1-gen2-parallel-prep-swarm-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: a1-gen2-parallel-prep-swarm-v1
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install provider dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Verify
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --self-test
      - name: Generate quota-safe evidence-grounded PREP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --output out/a1_terminal_repair_swarm_v4.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_terminal_repair_swarm_v4.json'))
          assert r['ledger_done_count'] < 25 and r['prep_only'] is True
          assert r['launch']['state']=='BLOCKED_GEN1_INCOMPLETE'
          print(json.dumps({'done':r['ledger_done_count'],'terminal':r['terminal_count'],'machine':r['machine_replayable_count'],'gemini_batch':r['gemini_batch'],'policy':r['api_economics_policy']},sort_keys=True))
          PY
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_terminal_repair_swarm_v4.json')); marker='<!-- A1_GEN2_PARALLEL_PREP_SWARM_V1 -->'
          providers={}
          for sid,row in (r.get('provider_state') or {}).items():
            for name,p in (row or {}).items():
              x=providers.setdefault(name,{'success':0,'fail':0,'skipped':0,'candidates':0})
              if p.get('skipped'): x['skipped']+=1
              elif p.get('successful'): x['success']+=1; x['candidates']+=int(p.get('candidate_count') or 0)
              else: x['fail']+=1
          body='\n'.join([marker,'## A1 GEN2 Parallel PREP Swarm V1',f"run={os.environ['RUN_ID']}",f"done_count={r['ledger_done_count']}/25|terminal_count={r['terminal_count']}|prep_only=true",f"machine_replayable={r['machine_replayable_count']}|repairs={r['queued_repair_count']}|new_arch={r['queued_new_arch_count']}|alpha_proof_ready={r['alpha_proof_ready_count']}",'providers='+json.dumps(providers,sort_keys=True),'gemini_batch='+json.dumps(r.get('gemini_batch'),sort_keys=True),f"receipt={r['receipt_sha256']}",'selection=false|promotion=false|execution=NONE|order/live=BLOCKED'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}; base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as q: cs=json.load(q)
          e=next((c for c in cs if marker in str(c.get('body') or '')),None); url=e.get('url') if e else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if e else 'POST')): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-parallel-prep-swarm-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: out/a1_terminal_repair_swarm_v4.json
