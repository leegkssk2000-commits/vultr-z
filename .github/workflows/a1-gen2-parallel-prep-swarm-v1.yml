name: A1 GEN2 Parallel PREP Swarm V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v2.py'
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py'
      - 'backend/research/architecture_factory/gemini_provider_v1.py'
      - '.github/workflows/a1-gen2-parallel-prep-swarm-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-gen2-parallel-prep-swarm-v1
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight provider dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Verify PREP-only profit-first swarm contract
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v2.py \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py \
            backend/research/architecture_factory/gemini_provider_v1.py
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json').read_text())
          assert int(d['generation']) == 1 and int(d['done_count']) < 25, d
          print(f"GEN1_PREP_ONLY done={d['done_count']}/25")
          PY
      - name: Generate machine-replayable terminal repair/replacement PREP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --output out/a1_terminal_repair_swarm_v4.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_terminal_repair_swarm_v4.json'))
          assert r['ledger_done_count'] < 25 and r['prep_only'] is True
          assert r['launch']['state'] == 'BLOCKED_GEN1_INCOMPLETE' and r['eligible_count'] == 0
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority'] == 'NONE' and r['order_authority'] == 'BLOCKED' and r['live_trade_authority'] == 'BLOCKED'
          print(json.dumps({'done_count':r['ledger_done_count'],'terminal_count':r['terminal_count'],'machine_replayable_count':r['machine_replayable_count'],'queued_repair_count':r['queued_repair_count'],'queued_new_arch_count':r['queued_new_arch_count'],'alpha_proof_ready_count':r['alpha_proof_ready_count']},sort_keys=True))
          PY
      - name: Publish PREP runtime receipt to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_terminal_repair_swarm_v4.json'))
          marker='<!-- A1_GEN2_PARALLEL_PREP_SWARM_V1 -->'
          providers={}
          for sid,row in (r.get('provider_state') or {}).items():
              for name,p in (row or {}).items():
                  x=providers.setdefault(name,{'success':0,'fail':0,'candidates':0,'machine':0})
                  if p.get('successful'):
                      x['success']+=1; x['candidates']+=int(p.get('candidate_count') or 0); x['machine']+=int(p.get('machine_replayable_count') or 0)
                  else: x['fail']+=1
          body='\n'.join([marker,'## A1 GEN2 Parallel PREP Swarm V1',f"run={os.environ['RUN_ID']}",f"done_count={r['ledger_done_count']}/25|terminal_count={r['terminal_count']}|prep_only=true",f"machine_replayable={r['machine_replayable_count']}|repairs={r['queued_repair_count']}|new_arch={r['queued_new_arch_count']}|alpha_proof_ready={r['alpha_proof_ready_count']}|eligible=0",'providers='+json.dumps(providers,sort_keys=True),f"receipt={r['receipt_sha256']}",'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|exchange_order=false|protected_mutations=0'])
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if existing else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-parallel-prep-swarm-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: out/a1_terminal_repair_swarm_v4.json

# wake: profit-first machine-replayable builder 2026-08-20
