name: A1 GEN2 PASS Robustness Audit V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_gen2_pass_robustness_audit_v1.py'
      - 'backend/research/architecture_factory/a1_gen2_incumbent_hardening_v1.py'
      - '.github/workflows/a1-gen2-pass-robustness-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: a1-gen2-pass-robustness-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run research quietly
        continue-on-error: true
        run: |
          mkdir -p out
          python -m py_compile backend/research/architecture_factory/a1_gen2_pass_robustness_audit_v1.py backend/research/architecture_factory/a1_gen2_incumbent_hardening_v1.py
          python -m backend.research.architecture_factory.a1_gen2_pass_robustness_audit_v1
          python -m backend.research.architecture_factory.a1_gen2_incumbent_hardening_v1
      - name: Economic milestone alert only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          p=pathlib.Path('out/a1_gen2_incumbent_hardening_v1.json')
          if not p.exists():
              raise SystemExit(0)
          x=json.load(open(p))
          axis=x.get('axis',{})
          if not bool(axis.get('accepted_pareto')):
              raise SystemExit(0)
          m=axis.get('new_metrics') or {}
          signature=json.dumps({k:m.get(k) for k in ('trades','net_pnl_bps','net_expectancy_bps','profit_factor','drawdown_bps')},sort_keys=True)
          sig=hashlib.sha256(signature.encode()).hexdigest()[:16]
          marker=f'<!-- A1_ECONOMIC_MILESTONE_{sig} -->'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=h)) as q: cs=json.load(q)
          if any(marker in str(c.get('body') or '') for c in cs):
              raise SystemExit(0)
          body='\n'.join([marker,'## ZEL ECONOMIC MILESTONE','state=PASS_PARETO_IMPROVEMENT','schema='+str(x.get('schema_version')),'metrics='+signature,'single_alert=true|fail_alert=false|repeat_alert=false'])
          post=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(post,data=json.dumps({'body':body}).encode(),headers=h,method='POST')): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-gen2-quiet-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            out/a1_gen2_pass_robustness_audit_v1.json
            out/a1_gen2_incumbent_hardening_v1.json
          if-no-files-found: ignore
