name: A1 Improvement Session Bias V2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-improvement-session-bias-v2.yml'
      - 'backend/research/rebuild/session_bias_intraday_momentum_v2.py'
      - 'backend/research/rebuild/a1_improvement_session_bias_v2_evaluator.py'
      - 'backend/research/rebuild/a1_improvement_session_bias_v2_ledger.json'
      - 'backend/research/rebuild/a1_improvement_session_bias_v2_inventory.json'
      - 'backend/research/rebuild/early_ai_prep/session_bias_v1.json'
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      done_count: ${{ steps.gate.outputs.done_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json').read_text())
          done=int(d.get('done_count') or 0)
          generation=int(d.get('generation') or 0)
          allowed=(generation == 1 and done == 25)
          print('allowed=' + ('true' if allowed else 'false'))
          print('done_count=' + str(done))
          print(f'GEN1_GATE generation={generation} done={done}/25 allowed={allowed}')
          PY

  session-bias-v2:
    needs: gen1-gate
    if: needs.gen1-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate terminal authority immutable baseline and heavy lease
        id: guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          base=json.loads(Path('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json').read_text())
          clock=json.loads(Path('backend/research/rebuild/a1_exact25_parallel_evidence_clock_v1.json').read_text())
          prep=json.loads(Path('backend/research/rebuild/early_ai_prep/session_bias_v1.json').read_text())
          imp=json.loads(Path('backend/research/rebuild/a1_improvement_session_bias_v2_ledger.json').read_text())
          assert int(base.get('done_count') or 0) == 25, base.get('done_count')
          b=base['strategies']['session_bias']
          assert b['status'] in ('A1_SPARSE_EVENT_FUTILITY','A1_ECONOMIC_FAIL'), b['status']
          assert b['receipt_sha'] == imp['strategies']['session_bias']['baseline_receipt_sha']
          assert prep['strategy_id'] == 'session_bias'
          assert prep['baseline_mutated'] is False
          assert prep['terminal_required_for_execution'] is True
          assert imp['baseline_mutated'] is False
          assert imp['selected_axis'] == 'LNY_FIRST_TO_LAST_HALF_HOUR_MOMENTUM_ENTRY'
          heavy=int(clock['heavy_active_count'])
          print('heavy_available=' + ('true' if heavy == 0 else 'false'))
          print('baseline_status=' + b['status'])
          PY

      - name: Compile isolated v2 policy
        if: steps.guard.outputs.heavy_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/session_bias_intraday_momentum_v2.py \
            backend/research/rebuild/a1_improvement_session_bias_v2_evaluator.py

      - name: Evaluate fresh prospective v2 only
        if: steps.guard.outputs.heavy_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_improvement_session_bias_v2_evaluator \
            --strategy-id session_bias \
            --out a1_improvement_session_bias_v2_receipt.json

      - name: Validate research-only authority
        if: steps.guard.outputs.heavy_available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('a1_improvement_session_bias_v2_receipt.json').read_text())
          assert x.get('selection_authority') is False
          assert x.get('promotion_authority') is False
          assert x.get('execution_authority') == 'NONE'
          assert x.get('order_authority') == 'BLOCKED'
          assert x.get('live_trade_authority') == 'BLOCKED'
          assert int(x.get('protected_mutations',0)) == 0
          assert x.get('strategy_id') == 'session_bias'
          print('PASS_A1_IMPROVEMENT_RESEARCH_ONLY')
          PY

      - name: Upload immutable improvement evidence
        if: steps.guard.outputs.heavy_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a1-improvement-session-bias-v2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            a1_improvement_session_bias_v2_receipt.json
            backend/research/rebuild/a1_improvement_session_bias_v2_ledger.json
            backend/research/rebuild/a1_improvement_session_bias_v2_inventory.json
            backend/research/rebuild/early_ai_prep/session_bias_v1.json
