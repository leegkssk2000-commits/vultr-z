name: A1 Keltner 58pct Add Only Continuation V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_keltner_58pct_research_incumbent_v1.json'
      - 'backend/research/rebuild/a1_keltner_58pct_add_only_continuation_v1.py'
      - 'backend/research/rebuild/a1_top5_additive_entry_union_v1.py'
      - 'backend/research/rebuild/a1_keltner_add_only_quality_anchor_v1.json'
      - '.github/workflows/a1-keltner-58pct-add-only-continuation-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_keltner_58pct_research_incumbent_v1.json'
      - 'backend/research/rebuild/a1_keltner_58pct_add_only_continuation_v1.py'
      - 'backend/research/rebuild/a1_top5_additive_entry_union_v1.py'
      - 'backend/research/rebuild/a1_keltner_add_only_quality_anchor_v1.json'
      - '.github/workflows/a1-keltner-58pct-add-only-continuation-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 4,10,16,22 * * *'

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 58pct incumbent continuation contract
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/a1_top5_additive_entry_union_v1.py \
            backend/research/rebuild/a1_keltner_58pct_add_only_continuation_v1.py
          python -m backend.research.rebuild.a1_keltner_58pct_add_only_continuation_v1 --self-test

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen 58pct incumbent
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/a1_top5_additive_entry_union_v1.py \
            backend/research/rebuild/a1_keltner_58pct_add_only_continuation_v1.py
          python -m backend.research.rebuild.a1_keltner_58pct_add_only_continuation_v1 --self-test
      - name: Rebuild current Keltner broad parent
        run: |
          set -euo pipefail
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 \
            --terminal-replay \
            --strategy-id keltner_trend \
            --symbols "$SYMBOLS" \
            --out out/keltner_trend_current_parent.json
      - name: Continue only from 12T 58pct research incumbent
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_keltner_58pct_add_only_continuation_v1 \
            --current-parent out/keltner_trend_current_parent.json \
            --out out/a1_keltner_58pct_add_only_continuation_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_keltner_58pct_add_only_continuation_v1.json'))
          p=r['research_incumbent_metrics']; a=r['additive_receipt']
          assert p['trades']==12 and abs(p['win_rate']-7/12)<1e-12
          assert abs(p['net_pnl_bps']-16213.02695520102)<1e-9
          assert abs(p['profit_factor']-31.35081608201582)<1e-9
          assert abs(p['drawdown_bps']-212.6882556068265)<1e-9
          assert a['parent_match_pct']==100.0
          assert r['policy']['parent_trade_delete_forbidden'] is True
          assert r['policy']['parent_trade_rewrite_forbidden'] is True
          assert r['policy']['production_ssot_unchanged'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],
            'parent_T':p['trades'],
            'parent_WR':p['win_rate'],
            'fresh_all_T':r['fresh_all_T'],
            'fresh_accepted_T':r['fresh_accepted_T'],
            'combined_T':a['combined_trade_count'],
            'combined_metrics':a['combined_metrics'],
            'payoff':r['payoff'],
            'blockers':r['promotion_blockers'],
            'receipt':r['receipt_sha256'],
          },sort_keys=True))
          PY
      - name: Persist 58pct continuation receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_keltner_58pct_add_only_continuation_latest.json
          cp out/a1_keltner_58pct_add_only_continuation_v1.json "$target"
          git config user.name 'a1-keltner-58pct-add-only'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 Keltner: persist 58pct ADD_ONLY continuation [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-keltner-58pct-add-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_keltner_58pct_add_only_continuation_v1.json
          if-no-files-found: error
          retention-days: 90
