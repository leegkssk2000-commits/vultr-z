name: A1 Keltner Parent Hardening V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_keltner_parent_hardening_router_v1.py'
      - '.github/workflows/a1-keltner-parent-hardening-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_keltner_parent_hardening_router_v1.py'
      - '.github/workflows/a1-keltner-parent-hardening-v1.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parent-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile backend/research/rebuild/a1_keltner_parent_hardening_router_v1.py
      - name: Self test
        run: python backend/research/rebuild/a1_keltner_parent_hardening_router_v1.py --self-test
      - name: Run real Keltner parent H4/H5
        run: |
          mkdir -p out
          python backend/research/rebuild/a1_keltner_parent_hardening_router_v1.py --out out/a1_keltner_parent_hardening_latest.json
          cat out/a1_keltner_parent_hardening_latest.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: a1-keltner-parent-hardening-${{ github.run_id }}
          path: out/a1_keltner_parent_hardening_latest.json
      - name: Persist latest hardening on master
        if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'push')
        run: |
          cp out/a1_keltner_parent_hardening_latest.json backend/research/rebuild/a1_keltner_parent_hardening_latest.json
          if git diff --quiet -- backend/research/rebuild/a1_keltner_parent_hardening_latest.json; then
            exit 0
          fi
          git config user.name 'a1-keltner-parent-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_keltner_parent_hardening_latest.json
          git commit -m 'A1 keltner: persist parent H4/H5 hardening [skip ci]'
          git push
