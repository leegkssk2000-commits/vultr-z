name: A1 Keltner Parent Reclaim Sleeve V1
on:
  push:
    branches: [research/keltner-parent-reclaim-sleeve-v1]
    paths:
      - 'backend/research/contracts/a1_keltner_parent_reclaim_sleeve_freeze_v1.json'
      - 'backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_fresh_v1.py'
      - 'backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_bind_v1.py'
      - '.github/workflows/a1-keltner-parent-reclaim-sleeve-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/keltner-parent-reclaim-sleeve-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_fresh_v1.py backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_bind_v1.py
      - name: Collect fresh sleeve
        run: python -m backend.research.rebuild.a1_keltner_parent_reclaim_sleeve_fresh_v1 --out out/a1_keltner_parent_reclaim_sleeve_fresh_latest.json
      - name: Guard parent-preserving semantics
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/a1_keltner_parent_reclaim_sleeve_fresh_latest.json'))
          assert x['historical_credit_T']==0 and x['donor_development_credit_T']==0
          assert x['parent_entry_mutation_count']==0 and x['parent_exit_mutation_count']==0
          assert x['cost_rededuction_count']==0 and x['new_trade_admission_count']==0
          assert x['execution_authority']=='NONE' and x['order_authority']=='BLOCKED'
          print('PASS_KELTNER_PARENT_RECLAIM_SLEEVE_GUARDS')
          PY
      - name: Bind sleeve to Top5 SSOT snapshot
        run: |
          cp out/a1_keltner_parent_reclaim_sleeve_fresh_latest.json backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_fresh_latest.json
          python -m backend.research.rebuild.a1_keltner_parent_reclaim_sleeve_bind_v1 --out out/a1_top5_latest_only_ssot_v1.json
          cp out/a1_top5_latest_only_ssot_v1.json backend/research/rebuild/a1_top5_latest_only_ssot_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: a1-keltner-parent-reclaim-sleeve-v1
          path: |
            backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_fresh_latest.json
            backend/research/rebuild/a1_top5_latest_only_ssot_v1.json
      - name: Persist branch snapshot
        run: |
          git config user.name 'a1-keltner-parent-reclaim-sleeve-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_keltner_parent_reclaim_sleeve_fresh_latest.json backend/research/rebuild/a1_top5_latest_only_ssot_v1.json
          git diff --cached --quiet || (git commit -m 'A1 Keltner: bind parent reclaim sleeve [skip ci]' && git push origin HEAD:research/keltner-parent-reclaim-sleeve-v1)
