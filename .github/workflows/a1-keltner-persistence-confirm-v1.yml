name: A1 Keltner Persistence Confirmation V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/keltner_trend_persistence_confirmation_child_policy_v1.py'
      - 'backend/research/rebuild/a1_keltner_persistence_confirmation_eval_v1.py'
      - '.github/workflows/a1-keltner-persistence-confirm-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: |
          python -m py_compile backend/research/rebuild/keltner_trend_persistence_confirmation_child_policy_v1.py
          python -m py_compile backend/research/rebuild/a1_keltner_persistence_confirmation_eval_v1.py
      - name: Policy invariant self test
        run: python backend/research/rebuild/keltner_trend_persistence_confirmation_child_policy_v1.py
      - name: Eval self test
        run: python backend/research/rebuild/a1_keltner_persistence_confirmation_eval_v1.py --self-test
      - name: Parent versus persistence child
        run: |
          mkdir -p out
          python backend/research/rebuild/a1_keltner_persistence_confirmation_eval_v1.py --out out/a1_keltner_persistence_confirmation_eval_latest.json
          cat out/a1_keltner_persistence_confirmation_eval_latest.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: a1-keltner-persistence-${{ github.run_id }}
          path: out/a1_keltner_persistence_confirmation_eval_latest.json
