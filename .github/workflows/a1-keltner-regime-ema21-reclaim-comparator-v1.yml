name: A1 Keltner Regime EMA21 Reclaim Comparator V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/keltner_regime_ema21_reclaim_comparator_policy_v1.py'
      - 'backend/research/rebuild/a1_keltner_regime_ema21_reclaim_comparator_eval_v1.py'
      - '.github/workflows/a1-keltner-regime-ema21-reclaim-comparator-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ema21-reclaim-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: |
          python -m py_compile backend/research/rebuild/keltner_regime_ema21_reclaim_comparator_policy_v1.py
          python -m py_compile backend/research/rebuild/a1_keltner_regime_ema21_reclaim_comparator_eval_v1.py
      - name: Comparator invariant self test
        run: python backend/research/rebuild/keltner_regime_ema21_reclaim_comparator_policy_v1.py
      - name: Eval self test
        run: python backend/research/rebuild/a1_keltner_regime_ema21_reclaim_comparator_eval_v1.py --self-test
      - name: Compare VOL_HIGH EMA21 reclaim timing
        run: |
          mkdir -p out
          python backend/research/rebuild/a1_keltner_regime_ema21_reclaim_comparator_eval_v1.py --out out/a1_keltner_regime_ema21_reclaim_comparator_latest.json
          cat out/a1_keltner_regime_ema21_reclaim_comparator_latest.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: a1-keltner-ema21-reclaim-${{ github.run_id }}
          path: out/a1_keltner_regime_ema21_reclaim_comparator_latest.json
