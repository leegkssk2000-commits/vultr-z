name: A1 Named Channel Gemini Sweep V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/a1_iterative_repair_named_channel_gemini_v1.json'
      - 'backend/research/contracts/a1_strategy25_triage_external_evidence_v1.json'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v1.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v2.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v3.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v4.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v5.py'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v6.py'
      - 'backend/research/architecture_factory/a1_research_factory_named_channel_bridge_v1.py'
      - '.github/workflows/a1-named-channel-gemini-sweep-v1.yml'
  workflow_dispatch:
    inputs:
      blocker:
        description: 'Named current strategy blocker to solve; generic Gemini mining is forbidden'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: a1-named-channel-gemini-sweep-v1
  cancel-in-progress: false

jobs:
  mine-named-channels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      A1_NAMED_CHANNEL_SEARCHES_PER_RUN: '3'
      A1_NAMED_CHANNEL_VIDEO_REVIEWS_PER_RUN: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce blocker-scoped paid-AI run
        env:
          BLOCKER_CONTEXT: ${{ inputs.blocker }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          blocker=(os.environ.get('BLOCKER_CONTEXT') or '').strip()
          assert blocker, 'NAMED_CURRENT_STRATEGY_BLOCKER_REQUIRED'
          assert int(os.environ['A1_NAMED_CHANNEL_SEARCHES_PER_RUN']) <= 3
          assert int(os.environ['A1_NAMED_CHANNEL_VIDEO_REVIEWS_PER_RUN']) <= 3
          print('PASS_BLOCKER_SCOPED_GEMINI_BUDGET')
          PY
      - name: Install multi-route YouTube evidence dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'youtube-transcript-api>=1.0,<2' 'yt-dlp>=2025.1,<2027'
      - name: Verify named-channel miner and V6 Research Factory bridge
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v1.py
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v2.py
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v3.py
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v4.py
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v5.py
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v6.py
          python -m py_compile backend/research/architecture_factory/a1_research_factory_named_channel_bridge_v1.py
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v1 --self-test
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v2 --self-test
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v3 --self-test
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v4 --self-test
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v5 --self-test
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v6 --self-test
          python -m backend.research.architecture_factory.a1_research_factory_named_channel_bridge_v1 --self-test
      - name: Deep-discover and analyze blocker-relevant videos with bounded Gemini budget
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v6 \
            --output out/a1_named_channel_gemini_latest.json \
            --existing backend/research/architecture_factory/a1_named_channel_gemini_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_named_channel_gemini_latest.json',encoding='utf-8'))
          assert r['schema_version']=='zel.a1.named_channel_gemini_sweep.v6'
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['protected_mutations']==0
          assert r['url_integrity_policy']=='ONLY_CANONICAL_11_CHAR_YOUTUBE_VIDEO_IDS_ACCEPTED'
          assert r['review_rotation_policy']=='LEAST_REVIEWED_CHANNEL_FIRST_THEN_TRUE_ROUND_ROBIN'
          assert r['discovery_policy']=='ALL_9_CHANNELS_ROUND_ROBIN__MOST_VIEWED_NEWEST_ARCHIVE_MECHANISM_DENSE'
          assert r['normalization_integrity']['v2_v4_recursion_guard'] is True
          assert r['metrics']['configured_channel_count']==9
          assert int(r['metrics'].get('reviewed_now') or 0) <= 3
          p=r['video_evidence_recovery_policy']
          assert p['oembed_prevalidation_enabled'] is True
          assert p['youtube_transcript_api_enabled'] is True
          assert p['yt_dlp_caption_fallback_enabled'] is True
          assert p['search_grounded_textual_fallback_enabled'] is True
          assert p['title_thumbnail_rule_inference_forbidden'] is True
          assert r['channel_utilization_controls']['creator_threshold_import_forbidden'] is True
          print(json.dumps({'state':r['state'], **r['metrics'], 'channel_utilization':r['channel_utilization'], 'errors':r['provider']['errors'][:6]},ensure_ascii=False,sort_keys=True))
          PY
      - name: Build deterministic V5 named-channel bridge preview without paid secondary AI
        run: |
          set -euo pipefail
          python -m backend.research.architecture_factory.a1_research_factory_named_channel_bridge_v1 \
            --named out/a1_named_channel_gemini_latest.json \
            --no-network \
            --no-ai \
            --ai-strategy-limit 0 \
            --output out/a1_research_factory_named_channel_bridge_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_research_factory_named_channel_bridge_latest.json',encoding='utf-8'))
          b=r['named_channel_gemini_bridge']
          assert r['schema_version']=='zel.a1_research_factory.v5',r
          assert b['factory_schema']=='zel.a1_research_factory.v5',b
          assert b['creator_threshold_imported'] is False
          assert b['local_replay_required'] is True and b['fresh_oos_required'] is True
          assert b['selection_authority'] is False and b['promotion_authority'] is False
          print(json.dumps({'factory_state':r.get('state'),'bridge':b,'queue':r.get('experiment_queue_count')},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist named-channel evidence and lane-scoped V5 bridge only
        run: |
          set -euo pipefail
          named_target=backend/research/architecture_factory/a1_named_channel_gemini_latest.json
          bridge_target=backend/research/architecture_factory/a1_research_factory_named_channel_bridge_latest.json
          cp out/a1_named_channel_gemini_latest.json "$named_target"
          cp out/a1_research_factory_named_channel_bridge_latest.json "$bridge_target"
          git config user.name 'a1-named-channel-gemini-sweep-v6'
          git config user.email 'actions@users.noreply.github.com'
          git add "$named_target" "$bridge_target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 Gemini: persist blocker-scoped named-channel evidence and V5 bridge [skip ci]'
          for n in 1 2 3 4; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 4
          done
          exit 1
      - name: Assert blocker-scoped sweep has no canonical Research Factory write target
        run: |
          set -euo pipefail
          test ! -e out/a1_research_factory_latest.json
          echo 'PASS_NAMED_SWEEP_BLOCKER_SCOPED_NO_CANONICAL_OWNER'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-named-channel-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_named_channel_gemini_latest.json
            out/a1_research_factory_named_channel_bridge_latest.json
          if-no-files-found: warn
          retention-days: 30
