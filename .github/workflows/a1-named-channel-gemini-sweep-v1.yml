name: A1 Named Channel Gemini Sweep V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/a1_iterative_repair_named_channel_gemini_v1.json'
      - 'backend/research/contracts/a1_strategy25_triage_external_evidence_v1.json'
      - 'backend/research/architecture_factory/a1_named_channel_gemini_sweep_v1.py'
      - '.github/workflows/a1-named-channel-gemini-sweep-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: write

concurrency:
  group: a1-named-channel-gemini-sweep-v1
  cancel-in-progress: false

jobs:
  mine-named-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      A1_NAMED_CHANNEL_SEARCHES_PER_RUN: '3'
      A1_NAMED_CHANNEL_VIDEO_REVIEWS_PER_RUN: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify named-channel miner
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_named_channel_gemini_sweep_v1.py
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v1 --self-test
      - name: Discover and analyze next channel videos
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_named_channel_gemini_sweep_v1 \
            --output out/a1_named_channel_gemini_latest.json \
            --existing backend/research/architecture_factory/a1_named_channel_gemini_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_named_channel_gemini_latest.json',encoding='utf-8'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['protected_mutations']==0
          print(json.dumps({'state':r['state'], **r['metrics'], 'errors':r['provider']['errors'][:3]},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist summaries and strategy hypothesis queue
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_named_channel_gemini_latest.json
          cp out/a1_named_channel_gemini_latest.json "$target"
          git config user.name 'a1-named-channel-gemini-sweep-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 Gemini: persist named-channel video summaries and strategy mappings [skip ci]'
          for n in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-named-channel-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_named_channel_gemini_latest.json
          if-no-files-found: warn
          retention-days: 30
