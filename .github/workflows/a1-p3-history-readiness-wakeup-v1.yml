name: A1 P3 History Readiness Wakeup V1

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-p3-history-readiness-wakeup-v1
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish one-shot READY marker only after frozen gate passes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: backend/research/architecture_factory/a1_p3_history_readiness_latest.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.parse, urllib.request

          coverage_url = (
              'https://raw.githubusercontent.com/' + os.environ['REPO'] +
              '/zel-p3-prospective-data/research/data/p3_prospective/latest_coverage.json'
          )
          with urllib.request.urlopen(coverage_url, timeout=20) as resp:
              cov = json.load(resp)

          ready = bool(cov.get('basis_oi_duration_gate_pass')) and bool(cov.get('historical_coverage_claim'))
          print(json.dumps({
              'state': cov.get('state'),
              'ready': ready,
              'progress': cov.get('minimum_coverage_progress_ratio'),
              'receipt': cov.get('receipt_sha256'),
          }, sort_keys=True))
          if not ready:
              print('HOLD_P3_BASIS_OI_HISTORY_NOT_READY_NO_MASTER_WRITE')
              raise SystemExit(0)

          token = os.environ['GH_TOKEN']; repo = os.environ['REPO']; target = os.environ['TARGET']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          url = f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target, safe="/")}?ref=master'
          old = {}; sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as resp:
                  meta = json.load(resp)
              sha = meta.get('sha')
              old = json.loads(base64.b64decode(meta.get('content', '')).decode('utf-8'))
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          if old.get('basis_oi_history_ready') is True:
              print('P3_BASIS_OI_READY_MARKER_ALREADY_PUBLISHED')
              raise SystemExit(0)

          marker = {
              'schema_version': 'zel.a1_p3_history_readiness_wakeup.v1',
              'state': 'P3_BASIS_OI_HISTORY_READY',
              'basis_oi_history_ready': True,
              'basis_oi_duration_gate_pass': True,
              'historical_coverage_claim': True,
              'source_branch': 'zel-p3-prospective-data',
              'coverage_receipt': cov.get('receipt_sha256'),
              'coverage_progress_ratio': cov.get('minimum_coverage_progress_ratio'),
              'published_at_utc': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'selection_authority': False,
              'promotion_authority': False,
              'execution_authority': 'NONE',
              'order_authority': 'BLOCKED',
              'live_trade_authority': 'BLOCKED',
          }
          payload = {
              'message': 'A1 P3: publish frozen history readiness wakeup',
              'content': base64.b64encode((json.dumps(marker, sort_keys=True, indent=2) + '\n').encode()).decode(),
              'branch': 'master',
          }
          if sha:
              payload['sha'] = sha
          put = f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target, safe="/")}'
          with urllib.request.urlopen(urllib.request.Request(put, data=json.dumps(payload).encode(), headers=headers, method='PUT'), timeout=30) as resp:
              result = json.load(resp)
          print('PUBLISHED_P3_BASIS_OI_READY_WAKEUP', result.get('commit', {}).get('sha'))
          PY
