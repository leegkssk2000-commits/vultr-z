name: A1 Production High-WR Rolling CLOSED V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v1.py'
      - 'backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v2.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_exact_parent_v1.json'
      - 'backend/research/architecture_factory/a1_trendrider_lane_historical_bind_v1.py'
      - '.github/workflows/a1-production-highwr-rolling-closed-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v1.py'
      - 'backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v2.py'
      - 'backend/research/rebuild/a1_production_highwr_top5_ssot_v1.json'
      - 'backend/research/rebuild/a1_break_and_continue_production_main_v1.json'
      - 'backend/research/rebuild/a1_a4_exact_parent_repair_latest.json'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_exact_parent_v1.json'
      - 'backend/research/architecture_factory/a1_trendrider_lane_historical_bind_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_wr8125_upstream_source_receipt_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_broad_wr7000_upstream_source_receipt_v1.json'
      - '.github/workflows/a1-production-highwr-rolling-closed-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test collector
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v1.py
          python -m py_compile backend/research/rebuild/a1_production_highwr_rolling_closed_collector_v2.py
          python -m backend.research.rebuild.a1_production_highwr_rolling_closed_collector_v2 --self-test

  collect:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare durable historical source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=/tmp/a1-highwr-historical
          primary_repo=backend/research/rebuild/a1_trend_rider_wr8125_upstream_source_receipt_v1.json
          broad_repo=backend/research/rebuild/a1_trend_rider_broad_wr7000_upstream_source_receipt_v1.json
          mkdir -p "$work/broad"

          if [[ -f "$primary_repo" ]]; then
            cp "$primary_repo" "$work/primary.json"
            echo PRIMARY_SOURCE=REPO_DURABLE
          else
            gh api --allow-escape-sequences "/repos/${GITHUB_REPOSITORY}/actions/jobs/97195981802/logs" > "$work/primary.log"
            python - <<'PY'
          import json,re
          from pathlib import Path
          raw=Path('/tmp/a1-highwr-historical/primary.log').read_text(encoding='utf-8',errors='replace')
          cleaned='\n'.join(re.sub(r'^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z\s*','',line) for line in raw.splitlines())
          decoder=json.JSONDecoder(); matches=[]
          for m in re.finditer(r'\{',cleaned):
              try: obj,_=decoder.raw_decode(cleaned[m.start():])
              except json.JSONDecodeError: continue
              if not isinstance(obj,dict): continue
              if str(obj.get('strategy_id'))!='trend_rider': continue
              if int(obj.get('completed_trades') or 0)!=25: continue
              if not isinstance(obj.get('trades'),list) or len(obj['trades'])!=25: continue
              if str(obj.get('policy_path'))!='backend/research/rebuild/trend_rider_transition_freshness_child_policy_v1.py': continue
              if str(obj.get('receipt_sha256') or '')!='b064d6ee58c158cdb1169b79d93d1df46ea020d0dde3762703a577f9a3068103': continue
              matches.append(obj)
          if len(matches)!=1: raise SystemExit(f'PRIMARY_HISTORICAL_25T_RECEIPT_REQUIRED:{len(matches)}')
          Path('/tmp/a1-highwr-historical/primary.json').write_text(json.dumps(matches[0],sort_keys=True,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          PY
            echo PRIMARY_SOURCE=BOOTSTRAP_JOB_LOG
          fi

          if [[ -f "$broad_repo" ]]; then
            cp "$broad_repo" "$work/broad/receipt.json"
            echo BROAD_SOURCE=REPO_DURABLE
          else
            mkdir -p "$work/broad-bootstrap"
            gh run download 32482936710 -n a1-exact25-32482936710 -D "$work/broad-bootstrap"
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/a1-highwr-historical/broad-bootstrap')
          matches=[]
          def walk(x):
              if isinstance(x,dict):
                  if str(x.get('receipt_sha256') or '')=='b9a7cc4c930952e9fae3a4b65012ceb393f0e084ee3c9decbd2854858a4fedd9' and int(x.get('completed_trades') or 0)==30:
                      matches.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          for path in root.rglob('*.json'):
              try: walk(json.loads(path.read_text(encoding='utf-8')))
              except Exception: pass
          unique={json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False):x for x in matches}
          if len(unique)!=1: raise SystemExit(f'BROAD_HISTORICAL_30T_RECEIPT_REQUIRED:{len(unique)}')
          receipt=next(iter(unique.values()))
          Path('/tmp/a1-highwr-historical/broad/receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          PY
            echo BROAD_SOURCE=BOOTSTRAP_EXACT25_ARTIFACT
          fi

          python - <<'PY'
          import json
          primary=json.load(open('/tmp/a1-highwr-historical/primary.json'))
          broad=json.load(open('/tmp/a1-highwr-historical/broad/receipt.json'))
          checks={
              'primary_sha':str(primary.get('receipt_sha256') or '')=='b064d6ee58c158cdb1169b79d93d1df46ea020d0dde3762703a577f9a3068103',
              'primary_t':int(primary.get('completed_trades') or 0)==25 and len(primary.get('trades') or [])==25,
              'primary_policy':str(primary.get('policy_path') or '')=='backend/research/rebuild/trend_rider_transition_freshness_child_policy_v1.py',
              'broad_sha':str(broad.get('receipt_sha256') or '')=='b9a7cc4c930952e9fae3a4b65012ceb393f0e084ee3c9decbd2854858a4fedd9',
              'broad_t':int(broad.get('completed_trades') or 0)==30 and len(broad.get('trades') or [])==30,
              'broad_policy':str(broad.get('policy_path') or '')=='backend/research/rebuild/trend_policy_batch_v1.py',
          }
          for prefix,obj in [('primary',primary),('broad',broad)]:
              checks[prefix+'_lookahead']=int(obj.get('leakage_lookahead') or 0)==0
              checks[prefix+'_duplicates']=int(obj.get('duplicate_count') or 0)==0
              checks[prefix+'_execution']=str(obj.get('execution_authority'))=='NONE'
              checks[prefix+'_order']=str(obj.get('order_authority'))=='BLOCKED'
              checks[prefix+'_live']=str(obj.get('live_trade_authority'))=='BLOCKED'
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('HISTORICAL_SOURCE_INTEGRITY:'+','.join(failed))
          print(json.dumps({'primary_sha':primary['receipt_sha256'],'primary_T':primary['completed_trades'],'broad_sha':broad['receipt_sha256'],'broad_T':broad['completed_trades']},sort_keys=True))
          PY

      - name: Persist durable historical source receipts on master
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          primary=backend/research/rebuild/a1_trend_rider_wr8125_upstream_source_receipt_v1.json
          broad=backend/research/rebuild/a1_trend_rider_broad_wr7000_upstream_source_receipt_v1.json
          changed=0
          if [[ ! -f "$primary" ]]; then cp /tmp/a1-highwr-historical/primary.json "$primary"; changed=1; fi
          if [[ ! -f "$broad" ]]; then cp /tmp/a1-highwr-historical/broad/receipt.json "$broad"; changed=1; fi
          if [[ "$changed" != 1 ]]; then echo HISTORICAL_SOURCES_ALREADY_DURABLE; exit 0; fi
          git config user.name 'a1-highwr-rolling-closed-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$primary" "$broad"
          git commit -m 'A1: persist immutable historical source receipts [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1

      - name: Collect lane-aware rolling CLOSED receipts
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_production_highwr_rolling_closed_collector_v2 \
            --primary-seed /tmp/a1-highwr-historical/primary.json \
            --broad-artifact-dir /tmp/a1-highwr-historical/broad \
            --previous backend/research/rebuild/a1_production_highwr_rolling_closed_latest.json \
            --out out/a1_production_highwr_rolling_closed_latest.json

      - name: Verify append-only and blocked-authority contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_production_highwr_rolling_closed_latest.json'))
          assert r['state']=='PASS_HIGHWR_ROLLING_CLOSED_ACTIVE',r
          assert r['schema_version']=='zel.a1.production_highwr.rolling_closed.v2'
          assert r['primary_seed_authority']=='EXACT_PARENT_DESCRIPTOR_PLUS_IMMUTABLE_TRADE_IDENTITY'
          assert r['primary_frozen_membership_uses_current_feature_recomputation'] is False
          assert r['selection_unit']=='lane_id'
          assert r['source_kind']=='PROSPECTIVE_POLICY_REPLAY_CLOSED'
          assert r['economic_value_semantics']=='FIRST_OBSERVED_REPLAY_VALUE_SEALED'
          assert r['append_only'] is True and r['stable_identity_dedup'] is True
          assert r['headline_ssot_mutated'] is False and r['rolling_receipt_grants_promotion'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          expected=['trend_rider_primary_wr8125','trend_rider_broad_wr7000','break_and_continue_main','keltner_trend_main','supertrend_pullback_main']
          assert list(r['lanes'])==expected
          for lane_id,x in r['lanes'].items():
              assert x['lane_id']==lane_id
              assert int(x['rolling_completed_trades']) >= int(x['seed_completed_trades'])
              ids=[t['closed_trade_id'] for t in x['closed_trades']]
              assert len(ids)==len(set(ids))
              assert int(x['delta_t'])==len(x['new_closed_trade_ids'])
              assert x['selection_authority'] is False and x['promotion_authority'] is False
              assert x['execution_authority']=='NONE' and x['order_authority']=='BLOCKED' and x['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'deltaT':r['total_delta_t'],'T':{k:v['rolling_completed_trades'] for k,v in r['lanes'].items()}},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-highwr-rolling-closed-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_production_highwr_rolling_closed_latest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest append-only receipt on master
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_production_highwr_rolling_closed_latest.json
          rm -f /tmp/a1-highwr-persist-required
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path('backend/research/rebuild/a1_production_highwr_rolling_closed_latest.json')
          current=json.load(open('out/a1_production_highwr_rolling_closed_latest.json'))
          if (not target.is_file()) or int(current.get('total_delta_t') or 0) > 0:
              Path('/tmp/a1-highwr-persist-required').write_text('1\n')
          else:
              print('NO_DELTA_NO_MASTER_COMMIT')
          PY
          if [[ ! -f /tmp/a1-highwr-persist-required ]]; then exit 0; fi
          cp out/a1_production_highwr_rolling_closed_latest.json "$target"
          git config user.name 'a1-highwr-rolling-closed-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist high-WR rolling CLOSED receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1