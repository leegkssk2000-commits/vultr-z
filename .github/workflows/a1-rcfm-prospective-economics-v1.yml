name: A1 RCFM Terminal Guard V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_rcfm_causal_terminal_v1.json'
      - 'backend/research/architecture_factory/a1_rcfm_v3_causal_controls_v1.py'
      - '.github/workflows/a1-rcfm-prospective-economics-v1.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_rcfm_causal_terminal_v1.json'
      - 'backend/research/architecture_factory/a1_rcfm_v3_causal_controls_v1.py'
      - '.github/workflows/a1-rcfm-prospective-economics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify immutable RCFM terminal disposition
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_rcfm_v3_causal_controls_v1.py
          python -m backend.research.architecture_factory.a1_rcfm_v3_causal_controls_v1 --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/research/architecture_factory/a1_rcfm_causal_terminal_v1.json')
          d=json.loads(p.read_text())
          assert d['terminal'] is True
          assert d['candidate_id']=='NEW_RCFM_001'
          assert d['state']=='FAIL_RCFM_V3_CAUSAL_CONTROLS'
          assert d['disposition']=='TERMINAL_CAUSAL_FAIL_SAME_IDENTITY_RETEST_FORBIDDEN'
          assert d['same_identity_retest_forbidden'] is True
          assert d['threshold_rescue_forbidden'] is True
          assert d['later_sample_rescue_forbidden'] is True
          assert d['hard_control_states']=={
            'same_count_random_entry':'FAIL',
            'direction_inversion':'FAIL',
            'micro_sign_permutation':'FAIL',
          }
          assert d['next_route']=='WRSR_NEW_002_NEW_ARCHITECTURE_FRESH_PREREG_AND_BOUNDARY'
          assert d['selection_authority'] is False and d['promotion_authority'] is False
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED' and d['live_trade_authority']=='BLOCKED'
          assert int(d['protected_mutations'])==0
          print('PASS_RCFM_TERMINAL_GUARD_HEAVY_EVALUATOR_RETIRED')
          PY
