name: A1 Research Factory V5

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_research_factory_v1.py'
      - 'backend/research/architecture_factory/a1_research_factory_v2.py'
      - 'backend/research/architecture_factory/a1_research_factory_v3.py'
      - 'backend/research/architecture_factory/a1_research_factory_v4.py'
      - 'backend/research/architecture_factory/a1_research_factory_v5.py'
      - '.github/workflows/a1-research-factory-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_research_factory_v1.py'
      - 'backend/research/architecture_factory/a1_research_factory_v2.py'
      - 'backend/research/architecture_factory/a1_research_factory_v3.py'
      - 'backend/research/architecture_factory/a1_research_factory_v4.py'
      - 'backend/research/architecture_factory/a1_research_factory_v5.py'
      - '.github/workflows/a1-research-factory-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-research-factory-v5
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          for v in 1 2 3 4 5; do
            python -m py_compile backend/research/architecture_factory/a1_research_factory_v${v}.py
            python -m backend.research.architecture_factory.a1_research_factory_v${v} --self-test
          done
          mkdir -p out
          python -m backend.research.architecture_factory.a1_research_factory_v5 --no-network --no-ai --output out/a1_research_factory_v5.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_research_factory_v5.json'))
          assert r['state'] in {'PASS_RESEARCH_FACTORY_V5_REVIEWED_REPAIR_READY','HOLD_RESEARCH_FACTORY_V5_NO_ELIGIBLE_REPAIR'}, r
          assert r['exact25_strategy_count']==25 and len(r['strategy_backlogs'])==25, r
          assert r['dedup_cosine_threshold']==0.85 and r['backlog_top_k']==5, r
          assert r['queue_bridge']['ready_common_first'] is True
          assert r['queue_bridge']['deterministic_identity_lock_before_validator'] is True
          assert r['queue_bridge']['pre_replay_review_contract_aligned'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and r['protected_mutations']==0
          print('PASS_A1_RESEARCH_FACTORY_V5_STATIC_CONTRACT')
          PY

  factory:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cost gate — do not buy more hypotheses while one is in fresh-sample evaluation
        id: cost_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('backend/research/architecture_factory/a1_research_factory_exact8_alpha_bridge_latest.json')
          active=False; state='MISSING'; candidate=None; trades=None
          if p.is_file():
              try:
                  r=json.loads(p.read_text())
                  state=str(r.get('a1_state') or '')
                  candidate=r.get('candidate_id')
                  trades=(r.get('bounded_replay') or {}).get('completed_child_trades')
                  active=state.startswith('WAIT_')
              except Exception:
                  state='UNREADABLE_FAIL_CLOSED'; active=True
          force=os.environ.get('EVENT_NAME')=='workflow_dispatch'
          run_paid=force or not active
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run_paid={'true' if run_paid else 'false'}\n")
              f.write(f"bridge_state={state}\n")
          print(json.dumps({'run_paid':run_paid,'forced':force,'bridge_state':state,'candidate':candidate,'trades':trades},sort_keys=True))
          PY
      - name: Skip paid Research Factory while current repair is still gathering fresh evidence
        if: steps.cost_gate.outputs.run_paid != 'true'
        run: echo "PASS_API_COST_GATE_ACTIVE_EXPERIMENT_NO_PAID_AI bridge_state=${{ steps.cost_gate.outputs.bridge_state }}"
      - name: Install Groq SDK
        if: steps.cost_gate.outputs.run_paid == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Discover evidence and review READY_COMMON repairs
        if: steps.cost_gate.outputs.run_paid == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_REVIEW_MODEL: ${{ vars.GROQ_REVIEW_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_research_factory_v5 --ai-strategy-limit 3 --output out/a1_research_factory_v5.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_research_factory_v5.json'))
          assert r['exact25_strategy_count']==25 and len(r['strategy_backlogs'])==25
          assert r['dedup_cosine_threshold']==0.85 and r['backlog_top_k']==5
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'sources':r['external_source_count'],'new':r['new_discovered_source_count'],'queue':r['experiment_queue_count'],'ready':r['ready_common_queue_count'],'reviewed':r['reviewed_ready_common_count'],'next':r['next_experiment_candidate']},sort_keys=True))
          PY
      - name: Persist latest immutable Research Factory receipt
        if: steps.cost_gate.outputs.run_paid == 'true'
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_research_factory_latest.json
          cp out/a1_research_factory_v5.json "$target"
          git config user.name 'a1-research-factory'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 Research Factory V5: persist latest review receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish Research Factory status to issue 566
        if: steps.cost_gate.outputs.run_paid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_research_factory_v5.json')); marker='<!-- A1_RESEARCH_FACTORY_V5 -->'; nxt=r.get('next_experiment_candidate') or {}; flow=r.get('candidate_flow_counts') or {}
          lines=[marker,'## A1 Research Factory V5',f"state={r['state']}|run={os.environ['RUN_ID']}",f"sources={r['external_source_count']}|new={r['new_discovered_source_count']}|queue={r['experiment_queue_count']}|ready_common={r['ready_common_queue_count']}|reviewed={r['reviewed_ready_common_count']}",f"flow_raw={flow.get('raw_generated')}|flow_reviewed={flow.get('reviewed')}|flow_eligible={flow.get('eligible')}",f"next={nxt.get('strategy_id')}|candidate={nxt.get('candidate_id')}|axis={nxt.get('changed_axis')}|score={nxt.get('score')}",'COST_POLICY=daily max + zero paid AI while current repair is WAIT fresh sample','selection=false|promotion=false|execution=NONE|order/live=BLOCKED']
          body='\n'.join(lines); headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}; url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None); target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"; req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_RESEARCH_FACTORY_V5_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.cost_gate.outputs.run_paid == 'true'
        with:
          name: a1-research-factory-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_research_factory_v5.json
          if-no-files-found: error
          retention-days: 90
