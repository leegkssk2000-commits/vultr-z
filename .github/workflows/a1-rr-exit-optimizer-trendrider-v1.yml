name: A1 RR Exit Optimizer TrendRider V1 - RETIRED ARCHIVE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-legacy-rr-geometry-archive-v1
  cancel-in-progress: true

jobs:
  archive-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert legacy family is non-authoritative and cannot write
        run: |
          set -euo pipefail
          test -z "$GEMINI_API_KEY"; test -z "$GOOGLE_API_KEY"; test -z "$OPENAI_API_KEY"; test -z "$OPENROUTER_API_KEY"; test -z "$GROQ_API_KEY"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/research/prep/rr_exit_optimizer_latest.json')
          r=json.loads(p.read_text()) if p.exists() else {}
          c=json.load(open('backend/research/contracts/g5_exit_research_contract_v1.json'))
          assert c['search_rules']['legacy_rr_geometry_family_rejected'] is True
          assert c['stage_boundary']['g5_exit_formal_credit']==0
          assert c['invariants']['execution_authority']=='NONE'
          assert c['invariants']['order_authority']=='BLOCKED'
          assert c['invariants']['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':'RETIRED_ARCHIVE_ONLY',
            'legacy_receipt_state':r.get('state'),
            'automatic_trigger':False,
            'write_authority':False,
            'replacement':'.github/workflows/g5-exit-research-lab-v1.yml',
          },sort_keys=True))
          PY
