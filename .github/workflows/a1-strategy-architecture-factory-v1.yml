name: A1 Strategy Architecture Factory V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v*.py'
      - 'backend/research/architecture_factory/gemini_provider_v1.py'
      - '.github/workflows/a1-strategy-architecture-factory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-strategy-architecture-factory-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/gemini_provider_v1.py
          python -m backend.research.architecture_factory.gemini_provider_v1
          python -m py_compile backend/research/architecture_factory/a1_youtube_evidence_sweep_v1.py
          python -m backend.research.architecture_factory.a1_youtube_evidence_sweep_v1 --self-test
          python -m py_compile backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v1 --self-test
          python -m py_compile backend/research/architecture_factory/a1_strategy_architecture_factory_v2.py
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v2 --self-test
          python -m py_compile backend/research/architecture_factory/a1_strategy_architecture_factory_v3.py
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v3 --self-test
          python -m py_compile backend/research/architecture_factory/a1_strategy_architecture_factory_v4.py
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v4 --self-test
          python - <<'PY'
          import json
          r=json.load(open('backend/research/architecture_factory/a1_free_evidence_sweep_v1.json'))
          assert r['state'] in {'EVIDENCE_SWEEP_READY','EVIDENCE_SWEEP_SYNCED'}
          assert r['research_only'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and int(r['protected_mutations'])==0
          print('PASS_A1_ARCHITECTURE_FACTORY_STATIC_ONLY_NO_PAID_AI')
          PY

  factory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Groq SDK for explicit deep review only
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Run explicitly requested deep architecture cross-review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
          GEMINI_ECONOMIC_REBUILD_ENABLED: 'true'
          G2_PARALLEL_RESEARCH_ENABLED: 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_strategy_architecture_factory_v4 --output out/a1_strategy_architecture_factory_v4.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_strategy_architecture_factory_v4.json'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert int(r['protected_mutations'])==0
          assert float(r['dedup_cosine_threshold'])==0.85
          assert r['alpha_proof_required'] is True
          assert r['preregistration_blocked_without_receipt'] is True
          assert int(r['eligible_for_preregistration_count'])==0
          print(json.dumps({'state':r['state'],'generated':r['generated_after_dedup'],'alpha_proof_ready':r['alpha_proof_ready_count'],'manual_deep_review':True},sort_keys=True))
          PY
      - name: Publish explicit deep-review receipt to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_strategy_architecture_factory_v4.json'))
          marker='<!-- A1_STRATEGY_ARCHITECTURE_FACTORY_V4 -->'
          lines=[marker,'## A1 Strategy Architecture Factory V4 — explicit deep review',f"run={os.environ['RUN_ID']}",f"state={r['state']}",f"generated={r['generated_after_dedup']}|alpha_proof_ready={r['alpha_proof_ready_count']}|prereg_eligible=0",'automatic_schedule=DISABLED|automatic_push_paid_run=DISABLED','purpose=expensive multi-provider deep review only after explicit request','selection=false|promotion=false|execution=NONE|order/live=BLOCKED']
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if existing else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_ARCHITECTURE_FACTORY_V4_MANUAL_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-strategy-architecture-factory-v4-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: out/a1_strategy_architecture_factory_v4.json
