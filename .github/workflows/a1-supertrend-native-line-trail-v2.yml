name: A1 Supertrend Native Line Trail V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_supertrend_native_line_trail_v2.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/zel_economic_hardening_policy_v1.json'
      - '.github/workflows/a1-supertrend-native-line-trail-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_supertrend_native_line_trail_v2.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/zel_economic_hardening_policy_v1.json'
      - '.github/workflows/a1-supertrend-native-line-trail-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify second-generation exit axis
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_supertrend_native_line_trail_v2.py
          python -m backend.research.rebuild.a1_supertrend_native_line_trail_v2 --self-test

  evaluate:
    if: github.event_name != 'pull_request'
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild frozen supertrend parent
        run: |
          set -euo pipefail
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 \
            --terminal-replay --strategy-id supertrend_pullback --symbols "$SYMBOLS" \
            --out out/supertrend_pullback_exact_parent.json
      - name: Evaluate native supertrend prior-bar trailing
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_supertrend_native_line_trail_v2 \
            --parent out/supertrend_pullback_exact_parent.json \
            --out out/a1_supertrend_native_line_trail_v2.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_supertrend_native_line_trail_v2.json'))
          c=r['candidate']
          assert c['generation_index_within_axis_data_sha']==2
          assert c['h1_maximum_generations_per_axis_data_sha']>=2
          assert c['entry_identity_preserved'] is True
          assert c['initial_stop_geometry_preserved'] is True
          assert c['timeout_preserved'] is True
          assert c['cost_model_preserved'] is True
          assert c['prior_completed_bar_only'] is True
          assert c['numeric_threshold_sweep'] is False and c['post_outcome_threshold_rescue'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and r['protected_mutations']==0
          print(json.dumps({'state':r['state'],'parent':r['parent_metrics'],'parent_h5':r['parent_concentration']['blockers'],'candidate':c,'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist native-line-trail receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_supertrend_native_line_trail_latest.json
          cp out/a1_supertrend_native_line_trail_v2.json "$target"
          git config user.name 'a1-supertrend-native-line-trail'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 supertrend: persist native-line-trail V2 receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish native-line-trail state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_supertrend_native_line_trail_v2.json')); c=r['candidate']; p=r['parent_metrics']; m=c['metrics']
          marker='<!-- A1_SUPERTREND_NATIVE_LINE_TRAIL_V2 -->'
          body='\n'.join([marker,'## A1 supertrend Native Line Trail V2',f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",f"parent:trades={p['trades']}|net_exp={p['net_expectancy_bps']}|pf={p['profit_factor']}|payoff={p['payoff']}|wr={p['win_rate']}|dd={p['drawdown_bps']}|h5={','.join(r['parent_concentration']['blockers'])}",f"child:changed_exits={c['changed_exit_count']}|trades={m['trades']}|ret={c['trade_retention_pct']:.2f}|net_exp={m['net_expectancy_bps']}|pf={m['profit_factor']}|payoff={m['payoff']}|wr={m['win_rate']}|dd={m['drawdown_bps']}|h5={','.join(c['concentration']['blockers'])}|econ={c['economic_gate_pass']}|ready={c['development_candidate_ready']}",'EXIT_TRAILING generation=2/2; native Supertrend prior-completed-bar line; parent entry/initial-SL/timeout/cost frozen','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0'])
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}; url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((x for x in comments if marker in str(x.get('body') or '')),None); target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"; req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_SUPERTREND_NATIVE_LINE_TRAIL_V2_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-supertrend-native-line-trail-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_supertrend_native_line_trail_v2.json
            out/supertrend_pullback_exact_parent.json
          if-no-files-found: error
          retention-days: 90
