name: A1 Terminal Repair Swarm V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/**'
      - 'backend/research/alpha_proof/**'
      - '.github/workflows/a1-terminal-repair-swarm-v1.yml'
      - '.github/workflows/a1-alpha-proof-gate-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/**'
      - 'backend/research/alpha_proof/**'
      - '.github/workflows/a1-terminal-repair-swarm-v1.yml'
      - '.github/workflows/a1-alpha-proof-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-terminal-repair-swarm-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic API ROI guard tests
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/gemini_provider_v1.py
          python -m backend.research.architecture_factory.gemini_provider_v1
          python -m py_compile backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --self-test
          python -m py_compile backend/research/architecture_factory/a1_terminal_repair_swarm_v5.py
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v5 --self-test
          python -m py_compile backend/research/alpha_proof/a1_alpha_proof_gate_v1.py
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 --self-test
          python - <<'PY'
          import json
          p=json.load(open('backend/research/rebuild/a1_exact25_disposition_ledger_v1.json'))
          terminal={'A1_ECONOMIC_FAIL','A1_COST_FUTILITY','A1_CAUSAL_CONTROL_FAIL','A1_SPARSE_EVENT_FUTILITY'}
          xs=[k for k,v in p['strategies'].items() if v.get('status') in terminal]
          assert p['done_count']>=10, p['done_count']
          assert len(xs)>=10, xs
          assert p['survivor_count']==0
          assert p['one_heavy_evaluator_at_a_time'] is True
          print('PASS_A1_TERMINAL_LEDGER_GUARD done=',p['done_count'],'terminal=',len(xs))
          PY

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run API-ROI guarded economic builder
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
          GEMINI_ECONOMIC_REBUILD_ENABLED: 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v5 --output out/a1_terminal_repair_swarm_v5.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_terminal_repair_swarm_v5.json'))
          roi=r.get('api_roi') or {}
          calls=roi.get('request_counts') or {}
          assert r['research_only'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert int(r['protected_mutations'])==0
          assert float(r['dedup_cosine_threshold'])==0.85
          assert r['terminal_count']>=10
          assert r['alpha_proof_required'] is True
          assert r['preregistration_blocked_without_receipt'] is True
          assert int(r['eligible_count'])==0
          assert r['launch']['state']=='BLOCKED_UNTIL_PASS_ALPHA_PROOF_RECEIPT'
          assert int(roi.get('paid_request_count') or 0) <= 3, roi
          assert int(calls.get('openai_batch') or 0) <= 1, calls
          assert int(calls.get('gemini_rescue_batch') or 0) <= 1, calls
          assert int(calls.get('openai_repair_batch') or 0) <= 1, calls
          if roi.get('cache_hit') is True:
              assert int(roi.get('paid_request_count') or 0)==0, roi
          policy=r.get('api_economics_policy') or {}
          assert policy.get('all_pre_economics_critics')=='DISABLED', policy
          print(json.dumps({
            'run_mode':r.get('run_mode'),
            'cache_hit':roi.get('cache_hit'),
            'paid_requests':roi.get('paid_request_count'),
            'calls':calls,
            'machine':r['machine_replayable_count'],
            'economic_pass':r['development_economic_pass_count'],
            'alpha_intake':(r.get('post_econ_alpha_intake') or {}).get('state'),
          },ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist identical-input cache receipt
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_terminal_repair_swarm_v5_latest.json
          cp out/a1_terminal_repair_swarm_v5.json "$target"
          git config user.name 'a1-api-roi-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 terminal swarm: persist API ROI cache [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish API ROI state pointer to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_terminal_repair_swarm_v5.json')); roi=r.get('api_roi') or {}; calls=roi.get('request_counts') or {}
          marker='<!-- A1_TERMINAL_REPAIR_SWARM_V5_API_ROI -->'
          lines=[marker,'## A1 Terminal Repair Swarm V5 — API ROI',f"run={os.environ['RUN_ID']}",f"receipt={r['receipt_sha256']}",f"mode={r.get('run_mode')}|cache_hit={roi.get('cache_hit')}|paid_requests={roi.get('paid_request_count')}/3",f"calls=openai_batch:{calls.get('openai_batch',0)},gemini_rescue:{calls.get('gemini_rescue_batch',0)},openai_repair_batch:{calls.get('openai_repair_batch',0)}",f"done={r['ledger_done_count']}/25|terminal={r['terminal_count']}|machine={r['machine_replayable_count']}|development_economic_pass={r['development_economic_pass_count']}",f"alpha_intake={(r.get('post_econ_alpha_intake') or {}).get('state')}|alpha_proof_ready={r['alpha_proof_ready_count']}|prereg_eligible=0",'policy=deterministic economics before Gemini rescue; no pre-economics critics; identical input signature => zero paid AI','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if existing else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_TERMINAL_REPAIR_SWARM_V5_API_ROI_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-terminal-repair-swarm-v5-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: out/a1_terminal_repair_swarm_v5.json
