name: A1 Terminal Repair Swarm V4

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py'
      - 'backend/research/architecture_factory/gemini_provider_v1.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py'
      - 'backend/research/architecture_factory/a1_failure_economics_v1.py'
      - 'backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py'
      - '.github/workflows/a1-terminal-repair-swarm-v4.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py'
      - 'backend/research/architecture_factory/gemini_provider_v1.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py'
      - 'backend/research/architecture_factory/a1_failure_economics_v1.py'
      - 'backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py'
      - '.github/workflows/a1-terminal-repair-swarm-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and deterministic self-test only
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py \
            backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py \
            backend/research/architecture_factory/gemini_provider_v1.py \
            backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py \
            backend/research/architecture_factory/a1_failure_economics_v1.py \
            backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py
          env -u OPENAI_API_KEY -u GEMINI_API_KEY \
            python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --self-test

  economic-rebuild:
    # Legacy repair is explicit-only under the G5A/G5B paid-call policy.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_ECONOMIC_REBUILD_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fail fast unless primary paid builder is available
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          echo PASS_OPENAI_PRIMARY_BUILDER_AVAILABLE
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            echo PASS_GEMINI_RESCUE_AVAILABLE
          else
            echo GEMINI_RESCUE_KEY_MISSING_OPENAI_ONLY
          fi

      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/architecture_factory/a1_terminal_repair_swarm_v4.py \
            backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py \
            backend/research/architecture_factory/gemini_provider_v1.py \
            backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py \
            backend/research/architecture_factory/a1_failure_economics_v1.py \
            backend/research/architecture_factory/a1_alpha_primitive_miner_v1.py
          env -u OPENAI_API_KEY -u GEMINI_API_KEY \
            python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 --self-test

      - name: Run paid AI economic repair swarm
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v4 \
            --output out/a1_terminal_repair_swarm_v4_latest.json

      - name: Verify real economic replay and hard safety boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_terminal_repair_swarm_v4_latest.json'))
          assert r['schema_version']=='zel.a1_terminal_repair_swarm.v4'
          assert int(r['api_roi']['paid_request_count']) >= 1
          assert int(r['api_roi']['paid_request_count']) <= int(r['api_roi']['max_paid_requests']) == 3
          assert r['api_economics_policy']['objective']=='validated_net_improvement_per_api_cost'
          assert r['api_economics_policy']['development_economics']=='AUTOMATIC_BEFORE_SECOND_BUILDER'
          assert int(r['development_economic_pass_count']) == int(r['api_roi']['economic_pass_count'])
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          d=r['development_economics']
          c=r['causal_repair_development_economics']
          print(json.dumps({
            'terminal_count':r['terminal_count'],
            'machine_replayable_count':r['machine_replayable_count'],
            'economic_pass_count':r['development_economic_pass_count'],
            'first_pass_count':d.get('economic_pass_count',0),
            'repair_pass_count':c.get('economic_pass_count',0),
            'paid_requests':r['api_roi']['paid_request_count'],
            'request_counts':r['api_roi']['request_counts'],
            'gemini':r['gemini_batch'],
            'launch':r['launch'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-terminal-repair-swarm-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_terminal_repair_swarm_v4_latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist newest economic receipt without master regression
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_terminal_repair_swarm_v4_latest.json
          generated=/tmp/a1_terminal_repair_swarm_v4_generated.json
          cp out/a1_terminal_repair_swarm_v4_latest.json "$generated"
          git config user.name 'a1-terminal-repair-swarm-v4'
          git config user.email 'actions@users.noreply.github.com'

          for n in 1 2 3; do
            echo "PERSIST_ATTEMPT=$n"
            git fetch origin master
            git reset --hard origin/master
            cp "$generated" "$target"
            git add "$target"
            if git diff --cached --quiet; then
              echo NO_ECONOMIC_RECEIPT_DELTA
              exit 0
            fi
            git commit -m 'A1 economics: persist terminal repair swarm V4 receipt [skip ci]'
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "PUSH_RACE_RETRY=$n"
            sleep 3
          done
          echo PERSIST_RETRY_EXHAUSTED
          exit 1
