name: A1 Top3 Profitability Survivor V1

on:
  pull_request:
    paths:
      - 'backend/research/prep/a2_forward_cost_turnover_v1.py'
      - 'backend/research/prep/a3_forward_context_collector_v1.py'
      - 'backend/research/prep/a3_forward_context_collector_v2.py'
      - 'backend/research/prep/a3_exact25_forward_durability_v3.py'
      - 'backend/research/rebuild/a1_top3_profitability_survivor_router_v1.py'
      - '.github/workflows/a1-top3-profitability-survivor-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/prep/a2_forward_cost_turnover_v1.py'
      - 'backend/research/prep/a3_forward_context_collector_v1.py'
      - 'backend/research/prep/a3_forward_context_collector_v2.py'
      - 'backend/research/prep/a3_exact25_forward_durability_v3.py'
      - 'backend/research/rebuild/a1_top3_profitability_survivor_router_v1.py'
      - '.github/workflows/a1-top3-profitability-survivor-v1.yml'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-top3-profitability-survivor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  top3-profitability:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and contract self-tests
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/a2_forward_cost_turnover_v1.py \
            backend/research/prep/a3_forward_context_collector_v1.py \
            backend/research/prep/a3_forward_context_collector_v2.py \
            backend/research/prep/a3_exact25_forward_durability_v3.py \
            backend/research/rebuild/a1_top3_profitability_survivor_router_v1.py
          python -m backend.research.prep.a2_forward_cost_turnover_v1 --self-test
          python -m backend.research.prep.a3_forward_context_collector_v2 --self-test
          python -m backend.research.prep.a3_exact25_forward_durability_v3 --self-test
          python -m backend.research.rebuild.a1_top3_profitability_survivor_router_v1 --self-test
          python - <<'PY'
          from backend.research.prep import a3_forward_context_collector_v1 as c
          assert tuple(c.SYMBOLS) == ('BTC-USDT','ETH-USDT','SOL-USDT','XRP-USDT','LINK-USDT','DOGE-USDT'), c.SYMBOLS
          print('PASS_A3_TOP3_SIX_SYMBOL_CONTEXT_COVERAGE')
          PY
      - name: Execute Top3 profitability route with bounded transport retry
        run: |
          set -uo pipefail
          mkdir -p out
          rc=1
          for n in 1 2 3; do
            python -m backend.research.rebuild.a1_top3_profitability_survivor_router_v1 \
              --out out/a1_top3_profitability_survivor_latest.json
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            echo "top3 attempt ${n} failed rc=${rc}" >&2
            sleep $((n * 5))
          done
          exit "$rc"
      - name: Verify profitability-only survivor contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_top3_profitability_survivor_latest.json'))
          assert r['profitability_first'] is True and r['top3_only'] is True,r
          assert r['new_strategy_generation_enabled'] is False,r
          assert r['new_filter_generation_enabled'] is False,r
          assert len(r['top3_identities'])==3 and len(r['candidates'])==3,r
          assert r['infrastructure_pass_never_counts_as_survivor'] is True,r
          assert r['retrospective_discovery_never_counts_as_survivor'] is True,r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          for x in r['candidates']:
              expected=(x['a1']['pass'] is True and x['a2_state']=='PASS_A2_COST_TURNOVER' and x['a3_state']=='PASS_A3_GLOBAL_DURABILITY')
              assert x['economic_survivor'] is expected,x
              if x['economic_survivor']:
                  m=x['a1']['metrics']
                  assert int(m['completed_trades'])>=25 and float(m['net_pnl_bps'])>0 and float(m['net_expectancy_bps'])>0 and float(m['profit_factor'])>=1,x
          assert r['economic_survivor_count']==sum(bool(x['economic_survivor']) for x in r['candidates']),r
          print(json.dumps({
              'A1':r['a1_pass_count'],'A2':r['a2_pass_count'],'A3':r['a3_pass_count'],'survivors':r['economic_survivor_count'],
              'rows':[{'id':x['identity'],'metrics':x['a1']['metrics'],'A1':x['a1']['state'],'A2':x['a2_state'],'A3':x['a3_state'],'blockers':x['blockers'][:6]} for x in r['candidates']]
          },sort_keys=True))
          PY
      - name: Persist one canonical Top3 profitability receipt
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_top3_profitability_survivor_latest.json
          cp out/a1_top3_profitability_survivor_latest.json "$target"
          git config user.name 'a1-top3-profitability-survivor-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist Top3 profitability survivor state [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top3-profitability-survivor-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_top3_profitability_survivor_latest.json
          if-no-files-found: warn
          retention-days: 30
