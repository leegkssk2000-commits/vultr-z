name: A1 Top5 Entry Transplant Terminal V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_top5_entry_transplant_terminal_v1.py'
      - '.github/workflows/a1-top5-entry-transplant-terminal-v1.yml'
      - 'backend/research/rebuild/a1_top5_entry_transplant_replay_latest.json'
      - 'backend/research/contracts/a1_top5_entry_transplant_replay_v1.json'
      - 'backend/research/rebuild/a1_top5_latest_only_ssot_v1.json'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_top5_entry_transplant_terminal_v1.py'
      - '.github/workflows/a1-top5-entry-transplant-terminal-v1.yml'
      - 'backend/research/rebuild/a1_top5_entry_transplant_replay_latest.json'
      - 'backend/research/contracts/a1_top5_entry_transplant_replay_v1.json'

permissions:
  contents: write

concurrency:
  group: a1-top5-entry-transplant-terminal-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self test
        run: python backend/research/rebuild/a1_top5_entry_transplant_terminal_v1.py --self-test
      - name: Verify current no-winner terminal derivation
        run: python backend/research/rebuild/a1_top5_entry_transplant_terminal_v1.py --dry-run

  persist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical terminal receipt and sync Top5 SSOT
        run: python backend/research/rebuild/a1_top5_entry_transplant_terminal_v1.py
      - name: Persist terminal receipt
        run: |
          if git diff --quiet -- backend/research/rebuild/a1_top5_entry_transplant_terminal_latest.json backend/research/rebuild/a1_top5_latest_only_ssot_v1.json; then
            echo 'No terminal persistence diff.'
            exit 0
          fi
          git config user.name 'a1-top5-entry-transplant-terminal'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_top5_entry_transplant_terminal_latest.json backend/research/rebuild/a1_top5_latest_only_ssot_v1.json
          git commit -m 'A1 Top5: persist no-winner transplant terminal [skip ci]'
          git push origin HEAD:master
