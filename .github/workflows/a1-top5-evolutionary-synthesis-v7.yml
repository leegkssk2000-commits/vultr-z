name: A1 Top5 Evolutionary Synthesis Guarded V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/production_economic_guard_v1.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_1.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_2.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_guarded_v1.py'
      - 'backend/research/rebuild/a1_strategy25_improvement_league_latest.json'
      - '.github/workflows/a1-top5-evolutionary-synthesis-v7.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/production_economic_guard_v1.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_1.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_2.py'
      - 'backend/research/architecture_factory/a1_top5_evolutionary_synthesis_guarded_v1.py'
      - '.github/workflows/a1-top5-evolutionary-synthesis-v7.yml'
  workflow_dispatch:
  schedule:
    - cron: '57 * * * *'

permissions:
  contents: write

concurrency:
  group: a1-top5-evolutionary-synthesis-v7
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test guarded evolutionary synthesis
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/production_economic_guard_v1.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_1.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_2.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_guarded_v1.py
          python -m backend.research.production_economic_guard_v1
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7_1 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7_2 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_guarded_v1 --self-test

  synthesize:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test guarded evolutionary synthesis
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/production_economic_guard_v1.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_1.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_v7_2.py \
            backend/research/architecture_factory/a1_top5_evolutionary_synthesis_guarded_v1.py
          python -m backend.research.production_economic_guard_v1
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7_1 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_v7_2 --self-test
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_guarded_v1 --self-test
      - name: Run guarded Top5 donor nursery and contribution attribution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_top5_evolutionary_synthesis_guarded_v1 \
            --output out/a1_top5_evolutionary_synthesis_guarded_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_top5_evolutionary_synthesis_guarded_v1.json'))
          assert 1 <= len(r['performance_top5_hosts']) <= 5,r
          assert r['production_economic_guard_enabled'] is True,r
          assert r['incumbent_collectors_continue_on_candidate_reject'] is True,r
          assert r['fresh25_reset_on_candidate_reject'] is False,r
          assert r['direct_improvement_scope']=='CURRENT_PERFORMANCE_TOP5_HOSTS_ONLY',r
          assert r['full_strategy_merge_allowed'] is False,r
          assert r['one_gene_per_host_per_attempt'] is True,r
          assert r['donor_numeric_threshold_copy_allowed'] is False,r
          assert r['failed_gene_pair_retest_same_axis_allowed'] is False,r
          assert r['synthesis_acceptance_gate']['drawdown_nonworse'] is True,r
          assert r['donor_nursery_enabled'] is True,r
          assert r['donor_contribution_attribution_enabled'] is True,r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0,r
          for block_name in ('initial_development_economics','second_step_development_economics'):
              for row in (r.get(block_name) or {}).get('rows') or []:
                  g=row.get('production_economic_guard') or {}
                  if g.get('hard_fail'):
                      assert row.get('economic_pass') is False,row
                      assert row.get('incumbent_state_action')=='PRESERVE_UNCHANGED',row
                      assert row.get('fresh25_state_action')=='PRESERVE_UNCHANGED',row
          print(json.dumps({
            'state':r.get('state'),
            'hosts':r.get('performance_top5_hosts'),
            'development_pass':r.get('development_economic_pass_count'),
            'guarded':r.get('production_economic_guarded_candidate_count'),
            'guard_fail':r.get('production_economic_guard_fail_count'),
            'failed_ids':r.get('production_economic_guard_failed_candidate_ids'),
            'donor_nursery':r.get('donor_nursery_strategy_count'),
            'receipt':r.get('receipt_sha256')
          },sort_keys=True))
          PY
      - name: Persist guarded evolutionary synthesis receipt
        run: |
          set -euo pipefail
          target=backend/research/architecture_factory/a1_top5_evolutionary_synthesis_latest.json
          cp out/a1_top5_evolutionary_synthesis_guarded_v1.json "$target"
          git config user.name 'a1-top5-evolutionary-synthesis-guarded-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist guarded Top5 evolutionary synthesis receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-evolutionary-synthesis-guarded-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_top5_evolutionary_synthesis_guarded_v1.json
          if-no-files-found: error
          retention-days: 30
