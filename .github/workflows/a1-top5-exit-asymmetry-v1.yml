name: A1 Top5 Exit Asymmetry V2

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_top5_exit_asymmetry_optimizer_v1.py'
      - 'backend/research/rebuild/a1_top5_exit_asymmetry_optimizer_v2.py'
      - '.github/workflows/a1-top5-exit-asymmetry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-asymmetry:
    strategy:
      fail-fast: false
      matrix:
        strategy_id:
          - trend_rider
          - keltner_trend
          - break_and_continue
          - supertrend_pullback
          - trend_ma_macd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/a1_top5_exit_asymmetry_optimizer_v1.py \
            backend/research/rebuild/a1_top5_exit_asymmetry_optimizer_v2.py
          python -m backend.research.rebuild.a1_top5_exit_asymmetry_optimizer_v1 --self-test
          python -m backend.research.rebuild.a1_top5_exit_asymmetry_optimizer_v2 --self-test
      - name: Optimize executable exit asymmetry
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_top5_exit_asymmetry_optimizer_v2 \
            --strategy-id '${{ matrix.strategy_id }}' \
            --out 'out/a1_top5_exit_${{ matrix.strategy_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: top5-exit-${{ matrix.strategy_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_top5_exit_${{ matrix.strategy_id }}.json
          retention-days: 30
