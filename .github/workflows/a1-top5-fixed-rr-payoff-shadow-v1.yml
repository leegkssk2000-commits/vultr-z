name: A1 Top5 Fixed RR Payoff Shadow V1
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_top5_fixed_rr_payoff_shadow_v1.py'
      - '.github/workflows/a1-top5-fixed-rr-payoff-shadow-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: a1-top5-fixed-rr-manual-audit-v1
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env: {PYTHONPATH: ., GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_top5_fixed_rr_payoff_shadow_v1.py
          python -m backend.research.rebuild.a1_top5_fixed_rr_payoff_shadow_v1 --self-test
      - name: Download frozen Top5 sources
        run: |
          set -euo pipefail
          mkdir -p out/trend70 out/a4 out/break
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9446790894/zip > out/trend70.zip
          unzip -q out/trend70.zip -d out/trend70
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9614562185/zip > out/a4.zip
          unzip -q out/a4.zip -d out/a4
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9603011773/zip > out/break.zip
          unzip -q out/break.zip -d out/break
      - name: Reproduce exhausted fixed RR cells for audit only
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_top5_fixed_rr_payoff_shadow_v1 --trend70-source out/trend70/a1_exact25_drain_6_receipt.json --a4-source-dir out/a4 --break-source-dir out/break --out out/top5_rr.json
          python - <<'PY'
          import json
          r=json.load(open('out/top5_rr.json'))
          assert r['cells']==[[2.5,0.75],[2.0,0.75],[1.5,0.45]]
          assert r['cell_policy']=='USER_FIXED_ONLY_NO_SWEEP' and len(r['lanes'])==5
          assert sum(int(x['pass_count']) for x in r['lanes'])==0
          assert r['shadow_only'] is True and r['trend_rider_broad_g5_reference_mutated'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'strict_pass_total':sum(int(x['pass_count']) for x in r['lanes'])},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-fixed-rr-manual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/top5_rr.json
          retention-days: 30
