name: A1 Top5 G4 Extended Historical Fasttrack V1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-top5-g4-extended-historical-fasttrack-v1.yml'
      - 'backend/research/contracts/a1_top5_g4_extended_historical_fasttrack_v1.json'
      - 'backend/research/rebuild/a1_top5_g4_extended_historical_fasttrack_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-top5-g4-extended-historical-fasttrack-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert preregistration and no paid AI
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          python -m py_compile backend/research/rebuild/a1_top5_g4_extended_historical_fasttrack_v1.py
          python -m backend.research.rebuild.a1_top5_g4_extended_historical_fasttrack_v1 --self-test
          python - <<'PY'
          import json
          p='backend/research/contracts/a1_top5_g4_extended_historical_fasttrack_v1.json'
          c=json.load(open(p))
          assert c['state']=='PREREGISTERED_BEFORE_RECENT_HISTORICAL_RESULTS'
          assert len(c['historical_windows'])==6
          assert c['historical_windows'][0]['start_utc']=='2026-02-15T00:00:00Z'
          assert c['historical_windows'][-1]['end_utc']=='2026-08-15T00:00:00Z'
          assert c['fasttrack_policy']['recent_3m']['start_utc']=='2026-05-15T00:00:00Z'
          assert c['fasttrack_policy']['recent_6m']['start_utc']=='2026-02-15T00:00:00Z'
          assert c['fasttrack_policy']['no_post_result_threshold_change'] is True
          assert c['evidence_semantics']['historical_trade_credit_to_fresh_g4_T']==0
          assert c['evidence_semantics']['historical_trade_credit_to_g5_T']==0
          assert c['fresh_authority_guards']['break_salvage_minimum_fresh_T']==6
          print('PASS_TOP5_G4_EXTENDED_FASTTRACK_PREREGISTRATION')
          PY
      - name: Run six-month replay and derive three-month fasttrack
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_top5_g4_extended_historical_fasttrack_v1 \
            --base-out out/a1_top5_g4_extended_historical_base_v1.json \
            --base-escrow out/a1_top5_g4_extended_historical_base_escrow_v1.json \
            --out out/a1_top5_g4_extended_historical_fasttrack_v1.json \
            --prep-out out/a1_top5_g5_fasttrack_prep_v1.json
      - name: Verify fasttrack isolation and print economics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_top5_g4_extended_historical_fasttrack_v1.json'))
          p=json.load(open('out/a1_top5_g5_fasttrack_prep_v1.json'))
          assert r['state']=='PASS_G4_EXTENDED_3M_6M_FASTTRACK_COMPLETE'
          assert r['lane_count']==4
          assert r['fresh_authority_unchanged'] is True
          assert r['fasttrack_semantics']['legacy_fresh_g4_pass_not_claimed'] is True
          assert r['fasttrack_semantics']['historical_credit_to_fresh_g4_T']==0
          assert r['fasttrack_semantics']['historical_credit_to_g5_T']==0
          assert r['break_salvage_fresh6']['minimum_fresh_T_before_gate']==6
          assert r['paid_provider_calls']==0 and r['openai_calls']==0 and r['gemini_calls']==0
          print(json.dumps({
            'historical_survivors':r['historical_survivor_lane_ids'],
            'mixed_donors':r['mixed_donor_lane_ids'],
            'architecture_replacement':r['architecture_replacement_lane_ids'],
            'transplant_candidates':r['transplant_candidates'],
            'lane_summary':{k:{'state':v['fasttrack_state'],'m3':v['recent_3m'],'m6':v['recent_6m']} for k,v in r['lanes'].items()},
            'prep_state':p['state'],
            'prep_entries':sorted(p['entries'])
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-g4-extended-historical-fasttrack-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_top5_g4_extended_historical_base_v1.json
            out/a1_top5_g4_extended_historical_base_escrow_v1.json
            out/a1_top5_g4_extended_historical_fasttrack_v1.json
            out/a1_top5_g5_fasttrack_prep_v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist fasttrack and donor shortlist
        run: |
          set -euo pipefail
          cp out/a1_top5_g4_extended_historical_fasttrack_v1.json backend/research/rebuild/a1_top5_g4_extended_historical_fasttrack_latest.json
          mkdir -p backend/research/prep
          cp out/a1_top5_g5_fasttrack_prep_v1.json backend/research/prep/a1_top5_g5_fasttrack_prep_latest.json
          git config user.name 'a1-top5-g4-extended-historical-fasttrack'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_top5_g4_extended_historical_fasttrack_latest.json backend/research/prep/a1_top5_g5_fasttrack_prep_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist Top5 G4 3M/6M fasttrack [skip ci]'
          for n in 1 2 3; do git pull --rebase origin master && git push origin HEAD:master && exit 0; sleep 3; done
          exit 1
