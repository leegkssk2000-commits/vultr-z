name: A1 Top5 Matched Exit Attribution V1
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_top5_matched_exit_attribution_v1.py'
      - '.github/workflows/a1-top5-matched-exit-attribution-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_top5_matched_exit_attribution_v1.py'
      - '.github/workflows/a1-top5-matched-exit-attribution-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: a1-top5-matched-exit-attribution-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env: {PYTHONPATH: ., GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and self-test
        run: |
          python -m py_compile backend/research/rebuild/a1_top5_matched_exit_attribution_v1.py
          python -m backend.research.rebuild.a1_top5_matched_exit_attribution_v1 --self-test
      - name: Download frozen Top5 sources
        run: |
          mkdir -p out/trend70 out/a4 out/break
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9446790894/zip > out/trend70.zip
          unzip -q out/trend70.zip -d out/trend70
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9614562185/zip > out/a4.zip
          unzip -q out/a4.zip -d out/a4
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9603011773/zip > out/break.zip
          unzip -q out/break.zip -d out/break
      - name: Attribute matched native exits
        run: |
          python -m backend.research.rebuild.a1_top5_matched_exit_attribution_v1 \
            --trend70-source out/trend70/a1_exact25_drain_6_receipt.json \
            --a4-source-dir out/a4 \
            --break-source-dir out/break \
            --out out/matched_exit.json
          python - <<'PY'
          import json
          r=json.load(open('out/matched_exit.json'))
          assert r['state']=='PASS_TOP5_MATCHED_EXIT_ATTRIBUTION_COMPLETE'
          assert len(r['lanes'])==5
          assert r['same_sample_selection_or_adoption_forbidden'] is True
          assert r['trend_rider_broad_g5_reference_mutated'] is False
          print(json.dumps({'state':r['state'],'lanes':[{'lane':x['lane'],'T':x['T'],'next':x['next_single_axis']} for x in r['lanes']]},sort_keys=True))
          PY
      - name: Persist latest on master
        if: github.event_name != 'pull_request'
        run: |
          cp out/matched_exit.json backend/research/rebuild/a1_top5_matched_exit_attribution_latest.json
          git config user.name a1-top5-matched-exit-attribution
          git config user.email actions@users.noreply.github.com
          git add backend/research/rebuild/a1_top5_matched_exit_attribution_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 Top5: persist matched exit attribution [skip ci]'
          git pull --rebase origin master && git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-matched-exit-attribution-${{ github.run_id }}
          path: out/matched_exit.json
          retention-days: 90
