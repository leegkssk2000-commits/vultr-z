name: A1 Top5 Parallel Prospective V1 Retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert V2 fresh-evidence owner exists
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          v1=json.load(open('backend/research/rebuild/a1_top5_parallel_prospective_latest.json'))
          v2=json.load(open('backend/research/rebuild/a1_top5_replacement_child_prospective_v2_latest.json'))
          assert v1['schema_version']=='zel.a1.top5.parallel_prospective.receipt.v1'
          assert v2['schema_version']=='zel.a1.top5.replacement_child.prospective.receipt.v2'
          assert v2['state']=='PASS_PROSPECTIVE_V2_CHILD_COLLECTION_ACTIVE'
          assert v2['predecessor_v1_retired'] is True
          assert int(v2['predecessor_v1_total_closed_T'])==0
          print('PASS_V1_TOP5_PARALLEL_WRITER_RETIRED_V2_OWNER_READY')
          PY
