name: A1 Top5 Parent Preserving Transplant V1

on:
  push:
    branches: [research/top5-parent-preserving-transplant-v1]
    paths:
      - 'backend/research/contracts/a1_top5_parent_preserving_component_transplant_v1.json'
      - 'backend/research/rebuild/a1_top5_parent_preserving_component_transplant_v1.py'
      - '.github/workflows/a1-top5-parent-preserving-transplant-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top5-parent-preserving-transplant-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile backend/research/rebuild/a1_top5_parent_preserving_component_transplant_v1.py
      - name: Evaluate original-parent component transplants
        run: python -m backend.research.rebuild.a1_top5_parent_preserving_component_transplant_v1 --out out/a1_top5_parent_preserving_component_transplant_latest.json
      - name: Verify no authority escalation
        run: |
          python - <<'PY'
          import json
          p='out/a1_top5_parent_preserving_component_transplant_latest.json'
          x=json.load(open(p))
          assert x['whole_replacement_population_consumed'] is False
          assert x['post_result_retune'] is False
          assert x['threshold_sweep'] is False
          assert x['cost_rededuction_count'] == 0
          assert x['parent_exit_mutation_count'] == 0
          assert x['execution_authority'] == 'NONE'
          assert x['order_authority'] == 'BLOCKED'
          for lane in x['lanes'].values():
              assert lane['original_parent_preserved'] is True
              assert lane['formal_g4_credit_T'] == 0
              assert lane['formal_g5_credit_T'] == 0
          print('PASS_PARENT_PRESERVING_AUTHORITY_GUARDS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-top5-parent-preserving-transplant-v1
          path: out/a1_top5_parent_preserving_component_transplant_latest.json
      - name: Persist receipt on research branch
        run: |
          cp out/a1_top5_parent_preserving_component_transplant_latest.json backend/research/rebuild/a1_top5_parent_preserving_component_transplant_latest.json
          git config user.name 'a1-top5-parent-preserving-transplant-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_top5_parent_preserving_component_transplant_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist parent-preserving transplant replay [skip ci]'
          git push origin HEAD:research/top5-parent-preserving-transplant-v1
