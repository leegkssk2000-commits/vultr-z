name: A1 Top5 Replacement Child Prospective V1 Retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert V1 retired with zero consumed evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          old=json.load(open('backend/research/rebuild/a1_top5_replacement_child_prospective_latest.json'))
          new=json.load(open('backend/research/contracts/a1_top5_replacement_child_freeze_v2.json'))
          assert old['schema_version']=='zel.a1.top5.replacement_child.prospective.receipt.v1'
          assert int(old['total_closed_T'])==0
          assert old['receipt_sha256']=='0159e1d1c86bb4dc1ce0a557310459b6d0c0ea5baa9a00c9eda7529de81d6ef3'
          assert new['v1_retirement']['state']=='RETIRED_ZERO_EVIDENCE_SUPERSEDED_BY_V2'
          assert int(new['v1_retirement']['total_consumed_T'])==0
          assert new['v1_retirement']['economic_evidence_lost'] is False
          print('PASS_V1_RETIRED_ZERO_EVIDENCE_NO_SCHEDULE_NO_PERSIST_WRITER')
          PY
