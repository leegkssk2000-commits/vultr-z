name: A1 Top5 Replacement Child V2 Arrival Telemetry V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_v1.py'
      - '.github/workflows/a1-top5-replacement-child-v2-arrival-telemetry-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/a1_top5_replacement_child_freeze_v2.json'
      - 'backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_v1.py'
      - '.github/workflows/a1-top5-replacement-child-v2-arrival-telemetry-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: a1-top5-replacement-child-v2-arrival-telemetry-v1
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert zero paid-provider credentials
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          echo PASS_NO_PAID_PROVIDER_CREDENTIALS

      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_v1.py
          python -m backend.research.rebuild.a1_top5_replacement_child_v2_arrival_telemetry_v1 --self-test

      - name: Observe post-boundary signal arrival without changing economics
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_top5_replacement_child_v2_arrival_telemetry_v1 \
            --out out/a1_top5_replacement_child_v2_arrival_telemetry_latest.json

      - name: Verify observer-only invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_top5_replacement_child_v2_arrival_telemetry_latest.json'))
          assert r['schema_version']=='zel.a1.top5.replacement_child.v2.arrival_telemetry.v1'
          assert r['state']=='PASS_OBSERVER_ONLY_G4_V2_ARRIVAL_TELEMETRY'
          assert r['boundary_utc']=='2026-08-30T00:00:00Z'
          assert len(r['frozen_symbol_universe'])==7
          assert r['economic_pass_credit'] is False
          assert r['alpha_mutated'] is False and r['threshold_mutated'] is False and r['cost_model_mutated'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE'
          assert r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert int(r['paid_provider_calls'])==0
          for x in r['lanes'].values():
              assert x['hold_bars'] in (6,12)
              assert x['bar_interval']=='4h'
          print(json.dumps({
              'raw':r['total_raw_signal_count'],
              'actionable':r['total_actionable_signal_count'],
              'maturing':r['total_maturing_count'],
              'closed_candidates':r['total_closed_candidate_count']
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-top5-replacement-child-v2-arrival-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_top5_replacement_child_v2_arrival_telemetry_latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist semantic delta on master
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_latest.json
          cp out/a1_top5_replacement_child_v2_arrival_telemetry_latest.json "$target.new"
          python - <<'PY'
          import json
          from pathlib import Path
          old=Path('backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_latest.json')
          new=Path('backend/research/rebuild/a1_top5_replacement_child_v2_arrival_telemetry_latest.json.new')
          a=json.loads(old.read_text()) if old.exists() else None
          b=json.loads(new.read_text())
          def sem(x):
              if x is None:return None
              y=dict(x); y.pop('observed_at_utc',None); return y
          if sem(a)==sem(b):
              print('NO_SEMANTIC_DELTA')
              new.unlink()
              raise SystemExit(0)
          new.replace(old)
          Path('/tmp/persist-g4-v2-arrival').write_text('1\n')
          PY
          if [[ ! -f /tmp/persist-g4-v2-arrival ]]; then exit 0; fi
          git config user.name 'a1-top5-replacement-child-v2-arrival-telemetry'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          git commit -m 'A1: persist G4 V2 arrival telemetry [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
