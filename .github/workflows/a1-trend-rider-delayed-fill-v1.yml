name: A1 Trend Rider Delayed Fill V1
on:
  pull_request:
    paths:
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_delayed_fill_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_side_timing_attribution_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_survivor_seal_v1.py'
      - '.github/workflows/a1-trend-rider-delayed-fill-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_delayed_fill_evaluator_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_side_timing_attribution_v1.py'
      - '.github/workflows/a1-trend-rider-delayed-fill-v1.yml'
  schedule:
    - cron: '53 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
# Side timing attribution shares the serialized heavy evaluator lane.
concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false
jobs:
  delayed-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Evaluate frozen development and prospective child
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_trend_rider_delayed_fill_evaluator_v1.py backend/research/rebuild/a1_trend_rider_side_timing_attribution_v1.py
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          CONTRACT='backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
          python -m backend.research.rebuild.a1_trend_rider_delayed_fill_evaluator_v1 \
            --symbols "$SYMBOLS" --mode development --contract "$CONTRACT" \
            --out out/trend_rider_delayed_fill_development.json
          python -m backend.research.rebuild.a1_trend_rider_h4_h5_hardening_v1 \
            --receipt out/trend_rider_delayed_fill_development.json \
            --out out/trend_rider_delayed_fill_development_hardening.json
          python -m backend.research.rebuild.a1_trend_rider_side_timing_attribution_v1 \
            --receipt out/trend_rider_delayed_fill_development.json \
            --out out/trend_rider_delayed_fill_side_timing_attribution.json
          BOUNDARY="$(python -c "import json;print(json.load(open('$CONTRACT'))['frozen_at_utc'])")"
          python -m backend.research.rebuild.a1_trend_rider_delayed_fill_evaluator_v1 \
            --symbols "$SYMBOLS" --mode prospective --boundary-utc "$BOUNDARY" --contract "$CONTRACT" \
            --out out/trend_rider_delayed_fill_prospective.json
      - name: Harden mature fresh sample and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          fresh=json.load(open('out/trend_rider_delayed_fill_prospective.json'))
          if int(fresh.get('completed_trades') or 0)>=25 and len({x['symbol'] for x in fresh.get('trades') or []})>=2:
              subprocess.run([
                  'python','-m','backend.research.rebuild.a1_trend_rider_h4_h5_hardening_v1',
                  '--receipt','out/trend_rider_delayed_fill_prospective.json',
                  '--out','out/trend_rider_delayed_fill_prospective_hardening.json'],check=True)
          PY
          python - <<'PY'
          import hashlib,json,os
          def load(path):
              try:return json.load(open(path))
              except Exception:return {'state':'WAIT_FRESH_SAMPLE'}
          dev=load('out/trend_rider_delayed_fill_development.json')
          dh=load('out/trend_rider_delayed_fill_development_hardening.json')
          side_timing=load('out/trend_rider_delayed_fill_side_timing_attribution.json')
          fresh=load('out/trend_rider_delayed_fill_prospective.json')
          fh=load('out/trend_rider_delayed_fill_prospective_hardening.json')
          symbols=sorted({x['symbol'] for x in fresh.get('trades') or []})
          mature=int(fresh.get('completed_trades') or 0)>=25 and len(symbols)>=2
          ready=(
              mature
              and fh.get('state')=='PASS_HARDENING_EVIDENCE'
              and (fh.get('candidate_integrity') or {}).get('state')=='PASS')
          summary={
              'schema_version':'zel.a1.trend_rider.delayed_fill_summary.v1',
              'challenger_id':'trend_rider_one_bar_delayed_fill_v1',
              'development_metrics':dev.get('metrics'),
              'development_h4_state':(dh.get('h4_receipt') or {}).get('state'),
              'development_h4_passed':(dh.get('h4_receipt') or {}).get('passed_control_count'),
              'development_h4_results':(dh.get('h4_receipt') or {}).get('control_results'),
              'development_h5_state':(dh.get('h5_receipt') or {}).get('state'),
              'development_h5_blockers':(dh.get('h5_receipt') or {}).get('blockers'),
              'development_h5_dimensions':(dh.get('h5_receipt') or {}).get('dimensions'),
              'development_h5_leave_one_group_out':(dh.get('h5_receipt') or {}).get('leave_one_group_out'),
              'development_side_timing_attribution':side_timing,
              'development_hardening_advisory_only':True,
              'fresh_boundary':fresh.get('prospective_boundary_utc'),
              'fresh_trade_count':fresh.get('completed_trades'),
              'fresh_symbols':symbols,
              'fresh_metrics':fresh.get('metrics'),
              'fresh_hardening_state':fh.get('state'),
              'survivor_ready':ready,
              'parameter_sweep':False,
              'thresholds_changed':False,
              'selection_authority':False,
              'promotion_authority':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'live_trade_authority':'BLOCKED'}
          summary['state']='READY_TO_SEAL' if ready else ('WAIT_FRESH_SAMPLE' if not mature else 'HOLD_HARDENING')
          summary['receipt_sha256']=hashlib.sha256(json.dumps(summary,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('out/trend_rider_delayed_fill_summary.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('A1_TREND_RIDER_DELAYED_FILL='+json.dumps(summary,sort_keys=True))
          PY
      - name: Seal verified Survivor
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          READY="$(python -c "import json;print(str(json.load(open('out/trend_rider_delayed_fill_summary.json'))['survivor_ready']).lower())")"
          if [ "$READY" != "true" ]; then exit 0; fi
          python -m backend.research.rebuild.a1_trend_rider_survivor_seal_v1 \
            --receipt out/trend_rider_delayed_fill_prospective.json \
            --evidence out/trend_rider_delayed_fill_prospective_hardening.json
          git config user.name 'a1-trend-rider-delayed-fill'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/a1_exact25_disposition_ledger_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'A1 trend_rider: seal verified delayed-fill Survivor [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Publish latest receipt
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/trend_rider_delayed_fill_summary.json'))
          marker='<!-- A1_TREND_RIDER_DELAYED_FILL_V1 -->'
          body='\n'.join([marker,'## A1 trend_rider delayed-fill challenger',f"run={os.environ['RUN_ID']}",json.dumps(r,sort_keys=True)])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as response: comments=json.load(response)
          existing=next((x for x in comments if marker in str(x.get('body') or '')),None)
          url=existing.get('url') if existing else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if existing else 'POST')): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-delayed-fill-${{ github.run_id }}
          path: out
          retention-days: 90
