name: A1 Trend Rider Exact Parent Repair Batch V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_exact_parent_repair_batch_v1.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - '.github/workflows/a1-trend-rider-exact-parent-repair-batch-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_exact_parent_repair_batch_v1.py'
      - 'backend/research/contracts/a1_a5_no_idle_research_v1.json'
      - 'backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
      - '.github/workflows/a1-trend-rider-exact-parent-repair-batch-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 1,7,13,19 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact-parent identity contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_trend_rider_exact_parent_repair_batch_v1.py
          python -m backend.research.rebuild.a1_trend_rider_exact_parent_repair_batch_v1 --self-test

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild exact delayed-fill incumbent and test post-sealed one-axis repairs
        run: |
          set -euo pipefail
          mkdir -p out
          SYMBOLS='BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,1INCH-USDT,ETHFI-USDT,HYPE-USDT,BCH-USDT,APE-USDT,1000PEPE-USDT,DOGE-USDT,LINK-USDT'
          CONTRACT='backend/research/contracts/a1_trend_rider_delayed_fill_v1.json'
          python -m backend.research.rebuild.a1_trend_rider_delayed_fill_evaluator_v1 \
            --symbols "$SYMBOLS" --mode development --contract "$CONTRACT" \
            --out out/trend_rider_delayed_fill_development.json
          python -m backend.research.rebuild.a1_trend_rider_exact_parent_repair_batch_v1 \
            --parent out/trend_rider_delayed_fill_development.json \
            --out out/a1_trend_rider_exact_parent_repair_batch_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_exact_parent_repair_batch_v1.json'))
          assert r['strategy_id']=='trend_rider'
          assert r['incumbent']=='trend_rider_one_bar_delayed_fill_v1'
          assert r['policy']['exact_parent_trade_identity_required'] is True
          assert r['policy']['parent_entry_signal_geometry_frozen'] is True
          assert r['policy']['parent_stop_timeout_cost_frozen'] is True
          assert r['policy']['one_axis_only'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and r['protected_mutations']==0
          print(json.dumps({'state':r['state'],'parent':r['parent_metrics'],'parent_h5':r['parent_concentration']['blockers'],'tested':r['tested_axes'],'ready':r['development_ready_count'],'next':r['next_exact_parent_candidate'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist exact-parent repair receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_trend_rider_exact_parent_repair_latest.json
          cp out/a1_trend_rider_exact_parent_repair_batch_v1.json "$target"
          git config user.name 'a1-trend-rider-exact-parent-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 trend_rider: persist exact-parent repair receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish exact-parent repair state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_trend_rider_exact_parent_repair_batch_v1.json'))
          marker='<!-- A1_TREND_RIDER_EXACT_PARENT_REPAIR_BATCH_V1 -->'
          p=r['parent_metrics']; lines=[marker,'## A1 trend_rider Exact Parent Repair Batch V1',f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",f"parent=trend_rider_one_bar_delayed_fill_v1|trades={p['trades']}|net_exp_bps={p['net_expectancy_bps']}|pf={p['profit_factor']}|payoff={p['payoff']}|wr={p['win_rate']}|dd_bps={p['drawdown_bps']}",'parent_h5='+','.join(r['parent_concentration']['blockers'])]
          for x in r['candidates']:
              m=x['metrics']; lines.append(f"{x['changed_axis']}:trades={m['trades']}|ret={x['trade_retention_pct']:.2f}|net_exp={m['net_expectancy_bps']}|pf={m['profit_factor']}|payoff={m['payoff']}|wr={m['win_rate']}|dd={m['drawdown_bps']}|h5={','.join(x['concentration']['blockers'])}|econ={x['economic_gate_pass']}|ready={x['development_candidate_ready']}")
          n=r.get('next_exact_parent_candidate') or {}; lines += [f"next={n.get('candidate_id')}|axis={n.get('changed_axis')}|ready_count={r['development_ready_count']}",'EXACT_PARENT=parent signal/SL/timeout/cost frozen; only one listed ownership axis changes','selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0']
          body='\n'.join(lines); headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}; url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((c for c in comments if marker in str(c.get('body') or '')),None); target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"; req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_TREND_RIDER_EXACT_PARENT_REPAIR_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-exact-parent-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_exact_parent_repair_batch_v1.json
          if-no-files-found: error
          retention-days: 90
