name: A1 Trend Rider H4 H5 V1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-trend-rider-h4-h5-v1.yml'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_survivor_seal_v1.py'
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild full frozen prospective receipt
        run: |
          mkdir -p out
          python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 --strategy-id trend_rider --out out/trend_rider_candidate.json
          python - <<'PY'
          import json
          r=json.load(open('out/trend_rider_candidate.json'))
          assert r['strategy_id']=='trend_rider'
          assert int(r['completed_trades'])>=25,r['completed_trades']
          assert not r.get('integrity_defects') and int(r.get('leakage_lookahead') or 0)==0
          print('PASS_TREND_RIDER_TIER_A_INPUT',r['completed_trades'])
          PY
      - name: Run H4 and H5 on all accumulated frozen prospective trades
        run: python -m backend.research.rebuild.a1_trend_rider_h4_h5_hardening_v1 --receipt out/trend_rider_candidate.json --out out/trend_rider_hardening_evidence.json
      - name: Diagnose Liquid6 universe without changing official gate
        run: |
          set -uo pipefail
          mkdir -p out
          LOG=out/trend_rider_liquid6_run.log
          : > "$LOG"
          set +e
          python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 \
            --strategy-id trend_rider \
            --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,LINK-USDT,DOGE-USDT \
            --out out/trend_rider_liquid6_candidate.json >> "$LOG" 2>&1
          EVAL_RC=$?
          HARD_RC=99
          if [ "$EVAL_RC" -eq 0 ]; then
            python -m backend.research.rebuild.a1_trend_rider_h4_h5_hardening_v1 \
              --receipt out/trend_rider_liquid6_candidate.json \
              --out out/trend_rider_liquid6_hardening.json >> "$LOG" 2>&1
            HARD_RC=$?
          fi
          set -e
          EVAL_RC="$EVAL_RC" HARD_RC="$HARD_RC" python - <<'PY'
          import hashlib,json,os
          erc=int(os.environ['EVAL_RC']); hrc=int(os.environ['HARD_RC'])
          base={
            'schema_version':'zel.a1_trend_rider_liquid6_rescue.v1',
            'strategy_id':'trend_rider',
            'symbol_universe':['BTC-USDT','ETH-USDT','SOL-USDT','XRP-USDT','LINK-USDT','DOGE-USDT'],
            'parameter_sweep':False,
            'policy_changed':False,
            'thresholds_changed':False,
            'selection_authority':False,
            'promotion_authority':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'protected_mutations':0,
          }
          if erc==0 and hrc==0:
            c=json.load(open('out/trend_rider_liquid6_candidate.json'))
            e=json.load(open('out/trend_rider_liquid6_hardening.json'))
            h4=e['h4_receipt']; h5=e['h5_receipt']
            base.update({
              'state':'PASS_DIAGNOSTIC_EXECUTION',
              'candidate_trade_count':c['completed_trades'],
              'metrics':c['metrics'],
              'retention_pct':e['retention_pct'],
              'oos':e['oos'],
              'h4_state':h4['state'],
              'h4_passed':h4['passed_control_count'],
              'h4_results':h4['control_results'],
              'h5_state':h5['state'],
              'h5_blockers':h5['blockers'],
              'h5_max_shares':h5['maximum_profit_share_by_dimension'],
              'top10_trade_profit_share':h5['top10_trade_profit_share'],
              'survivor_ready':e['state']=='PASS_HARDENING_EVIDENCE',
            })
          else:
            lines=open('out/trend_rider_liquid6_run.log',errors='replace').read().splitlines()
            base.update({
              'state':'HOLD_DIAGNOSTIC_EXECUTION',
              'failed_stage':'evaluator' if erc else 'hardening',
              'evaluator_rc':erc,
              'hardening_rc':hrc,
              'error_tail':lines[-20:],
              'survivor_ready':False,
            })
          base['receipt_sha256']=hashlib.sha256(json.dumps(base,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('out/trend_rider_liquid6_summary.json','w').write(json.dumps(base,indent=2,sort_keys=True)+'\n')
          print('A1_TREND_RIDER_LIQUID6_RESCUE='+json.dumps(base,sort_keys=True))
          PY
          cat "$LOG"
      - name: Read hardening gate
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          e=json.load(open('out/trend_rider_hardening_evidence.json'))
          print('state='+e['state'])
          print('h4='+e['h4_receipt']['state'])
          print('h5='+e['h5_receipt']['state'])
          print('trades='+str(e['candidate_trade_count']))
          print('retention='+str(e['retention_pct']))
          print('oos_net='+str(e['oos']['net_pnl_bps']))
          PY
      - name: Persist silent latest diagnostic
        run: |
          mkdir -p backend/research/rebuild/diagnostics
          cp out/trend_rider_hardening_evidence.json backend/research/rebuild/diagnostics/trend_rider_hardening_latest.json
          git config user.name 'a1-hardening'; git config user.email 'actions@users.noreply.github.com'
          git add backend/research/rebuild/diagnostics/trend_rider_hardening_latest.json
          if test -f out/trend_rider_liquid6_summary.json; then
            cp out/trend_rider_liquid6_summary.json backend/research/rebuild/diagnostics/trend_rider_liquid6_latest.json
            git add backend/research/rebuild/diagnostics/trend_rider_liquid6_latest.json
          fi
          if ! git diff --cached --quiet; then git commit -m 'A1 trend_rider: refresh hardening diagnostics [skip ci]'; fi
      - name: Persist PASS evidence only
        if: steps.gate.outputs.state == 'PASS_HARDENING_EVIDENCE'
        run: |
          mkdir -p backend/research/rebuild/hardening_evidence
          cp out/trend_rider_hardening_evidence.json backend/research/rebuild/hardening_evidence/trend_rider_hardening_evidence_v1.json
          git add backend/research/rebuild/hardening_evidence/trend_rider_hardening_evidence_v1.json
          if ! git diff --cached --quiet; then git commit -m 'A1 trend_rider: persist verified H4 H5 evidence [skip ci]'; fi
      - name: Verify official survivor gate
        if: steps.gate.outputs.state == 'PASS_HARDENING_EVIDENCE'
        env:
          A1_HARDENING_RECEIPT_PATH: out/trend_rider_hardening_evidence.json
        run: |
          python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 --strategy-id trend_rider --out out/trend_rider_hardened.json
          python - <<'PY'
          import json
          r=json.load(open('out/trend_rider_hardened.json'))
          print('SURVIVOR_GATE',json.dumps(r['survivor_gate'],sort_keys=True))
          assert r['survivor_gate']['state']=='PASS' and r['survivor_gate']['passed'] is True,r['survivor_gate']
          PY
      - name: Seal A1 Survivor in official ledger
        if: steps.gate.outputs.state == 'PASS_HARDENING_EVIDENCE'
        run: python -m backend.research.rebuild.a1_trend_rider_survivor_seal_v1 --receipt out/trend_rider_candidate.json --evidence out/trend_rider_hardening_evidence.json
      - name: Persist Survivor seal atomically
        if: steps.gate.outputs.state == 'PASS_HARDENING_EVIDENCE'
        run: |
          git add backend/research/rebuild/a1_exact25_disposition_ledger_v1.json backend/research/rebuild/hardening_evidence/trend_rider_hardening_evidence_v1.json backend/research/rebuild/diagnostics/trend_rider_hardening_latest.json
          if ! git diff --cached --quiet; then git commit -m 'A1 trend_rider: seal Survivor [skip ci]'; fi
          git push origin HEAD:master
      - name: Push diagnostic when not yet Survivor
        if: steps.gate.outputs.state != 'PASS_HARDENING_EVIDENCE'
        run: git push origin HEAD:master
      - name: Report Survivor once
        if: steps.gate.outputs.state == 'PASS_HARDENING_EVIDENCE'
        uses: actions/github-script@v7
        env:
          TRADES: ${{ steps.gate.outputs.trades }}
          RET: ${{ steps.gate.outputs.retention }}
          OOS: ${{ steps.gate.outputs.oos_net }}
        with:
          script: |
            const fs=require('fs'); const e=JSON.parse(fs.readFileSync('out/trend_rider_hardening_evidence.json','utf8'));
            const r=JSON.parse(fs.readFileSync('out/trend_rider_candidate.json','utf8'));
            const m=r.metrics;
            const b=`A1:trend_rider|SURVIVOR|trades=${process.env.TRADES}|WR=${(100*m.win_rate).toFixed(2)}%|Net=${m.net_pnl_bps.toFixed(2)}bps|Exp=${m.net_expectancy_bps.toFixed(2)}bps/trade|PF=${m.net_profit_factor.toFixed(3)}|Payoff=${m.net_payoff.toFixed(3)}|DD=${m.max_drawdown_bps.toFixed(2)}bps|retention=${process.env.RET}%|OOS=${process.env.OOS}bps|H4=5/5|H5=PASS|receipt=${e.receipt_sha256}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:566,body:b});
      - uses: actions/upload-artifact@v4
        with:
          name: a1-trend-rider-h4-h5-${{ github.run_id }}
          path: out
          retention-days: 90
