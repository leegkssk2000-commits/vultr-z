name: A1 Trend Rider Liquid6 Risk Budget V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/trend_rider_first_confirmation_long_only_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_prereg_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_losing_basket_guard_prereg_v1.json'
      - 'backend/research/rebuild/a1_top3_profitability_two_lane_router_v4.py'
      - 'backend/research/rebuild/a1_exact25_generic_evaluator_v1.py'
      - 'backend/research/prep/a2_forward_cost_turnover_v1.py'
      - '.github/workflows/a1-trend-rider-liquid6-risk-budget-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/trend_rider_first_confirmation_long_only_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_prereg_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_liquid6_losing_basket_guard_prereg_v1.json'
      - 'backend/research/rebuild/a1_top3_profitability_two_lane_router_v4.py'
      - 'backend/research/rebuild/a1_exact25_generic_evaluator_v1.py'
      - 'backend/research/prep/a2_forward_cost_turnover_v1.py'
      - '.github/workflows/a1-trend-rider-liquid6-risk-budget-v1.yml'
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-trend-rider-liquid6-risk-budget-${{ github.ref }}${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '-code-ci' || '' }}
  cancel-in-progress: true

jobs:
  liquid6-risk-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      BOUNDARY_UTC: '2026-08-24T15:00:00Z'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/trend_rider_first_confirmation_long_only_policy_v1.py \
            backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_v1.py \
            backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_v1.py
          python -m backend.research.rebuild.a1_trend_rider_liquid6_risk_budget_child_v1 --self-test
          python -m backend.research.rebuild.a1_trend_rider_liquid6_risk_budget_two_lane_v1 --self-test
          python -m backend.research.prep.a2_forward_cost_turnover_v1 --self-test
      - name: Verify and stage saved Liquid6 receipts on code-change CI
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          out = Path('out')
          out.mkdir(exist_ok=True)
          sources = {
              'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_latest.json': (
                  'child.json', 'zel.a1.trend_rider.liquid6_losing_basket_guard_child.v1',
              ),
              'backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_latest.json': (
                  'two_lane.json', 'zel.a1.trend_rider.liquid6_losing_basket_guard_two_lane.v1',
              ),
          }
          saved = {}
          verified = []
          for source, (target, schema) in sources.items():
              raw = Path(source).read_bytes()
              receipt = json.loads(raw)
              assert receipt['schema_version'] == schema, source
              unsigned = {k: v for k, v in receipt.items() if k != 'receipt_sha256'}
              actual = hashlib.sha256(json.dumps(unsigned, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()
              assert receipt['receipt_sha256'] == actual, source
              assert receipt['execution_authority'] == 'NONE', source
              assert receipt['order_authority'] == receipt['live_trade_authority'] == 'BLOCKED', source
              saved[target] = receipt
              (out / target).write_bytes(raw)
              verified.append({'path': source, 'file_sha256': hashlib.sha256(raw).hexdigest(), 'receipt_sha256': actual})
          child, route = saved['child.json'], saved['two_lane.json']
          assert child['selection_authority'] is False and child['promotion_authority'] is False, child
          assert child['evaluation_mode'] == 'prospective', child
          assert route['candidate']['identity'] == child['candidate_id'], route
          assert route['candidate']['candidate_receipt_sha256'] == child['receipt_sha256'], route
          assert route['candidate']['selection_authority'] is False and route['candidate']['promotion_authority'] is False, route
          result = {
              'state': 'PASS_SAVED_RECEIPT_INTEGRITY_ONLY',
              'event_scope': 'code_change_ci',
              'economic_execution_performed': False,
              'new_fresh_evidence': False,
              'new_performance_credit': 0,
              'promotion_credit': 0,
              'sources': verified,
          }
          (out / 'code_change_saved_receipt_verification.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Evaluate same-window parent and Liquid6 child
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_challenger_evaluator_v1 \
            --symbols BTC-USDT,ETH-USDT --mode prospective --boundary-utc "$BOUNDARY_UTC" --out out/parent.json
          python -m backend.research.rebuild.a1_trend_rider_liquid6_risk_budget_child_v1 \
            --mode prospective --boundary-utc "$BOUNDARY_UTC" --parent-receipt out/parent.json --out out/child.json
          python -m backend.research.rebuild.a1_trend_rider_liquid6_risk_budget_two_lane_v1 \
            --receipt out/child.json --out out/two_lane.json
      - name: Verify economic comparison and authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          child=json.load(open('out/child.json'))
          route=json.load(open('out/two_lane.json'))
          assert child['portfolio_risk_budget']['outcome_fitted'] is False,child
          assert child['portfolio_risk_budget']['maximum_gross_risk_units']==2.0,child
          assert child['portfolio_risk_budget']['position_risk_scale']==(1.0/3.0),child
          assert child['portfolio_admission_guard']['axis']=='ACTIVE_SAME_SIDE_BASKET_MTM_SIGN',child
          assert child['portfolio_admission_guard']['threshold_bps']==0.0,child
          assert child['portfolio_admission_guard']['threshold_sweep'] is False,child
          assert child['portfolio_admission_guard']['outcome_fields_used'] is False,child
          assert child['symbols']==['BTC-USDT','ETH-USDT','SOL-USDT','XRP-USDT','LINK-USDT','DOGE-USDT'],child
          assert child['order_authority']=='BLOCKED' and child['live_trade_authority']=='BLOCKED',child
          assert route['strict_global_gate_mutation'] is False,route
          assert route['candidate']['identity']==child['candidate_id'],route
          if child['evaluation_mode']=='development':
              assert child['development_comparison']['pareto_pass'] is True,child
          print(json.dumps({
              'mode':child['evaluation_mode'],'trades':child['completed_trades'],
              'metrics':child['metrics'],'comparison':child['development_comparison'],
              'profit':route['candidate']['profit_lane']['state'],
              'cert':route['candidate']['certification_pilot']['state'],
              'a2':route['candidate']['a2_pilot']['state'],
              'a3':route['candidate']['a3_pilot']['state'],
          },sort_keys=True))
          PY
      - name: Persist prospective child and two-lane checkpoint
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          cp out/child.json backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_latest.json
          cp out/two_lane.json backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_latest.json
          git config user.name 'a1-trend-rider-liquid6-risk-budget-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_child_latest.json \
            backend/research/rebuild/a1_trend_rider_liquid6_risk_budget_two_lane_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 trend_rider: persist Liquid6 risk-budget checkpoint [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-liquid6-risk-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
