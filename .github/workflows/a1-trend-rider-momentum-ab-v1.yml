name: A1 Trend Rider Momentum Direct AB V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/trend_rider_momentum_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py'
      - '.github/workflows/a1-trend-rider-momentum-ab-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/trend_rider_momentum_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py'
      - '.github/workflows/a1-trend-rider-momentum-ab-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-trend-rider-momentum-direct-ab-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test momentum-only direct A/B
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/trend_rider_momentum_child_policy_v1.py
          python -m py_compile backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py
          python -m backend.research.rebuild.trend_rider_momentum_child_policy_v1
          python -m backend.research.rebuild.a1_trend_rider_momentum_ab_v1 --self-test

  direct-ab:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parent and momentum child on identical frozen W123 window
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_momentum_ab_v1 --out out/a1_trend_rider_momentum_ab_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_momentum_ab_v1.json'))
          assert r['strategy_id']=='trend_rider'
          assert r['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          assert r['changed_axis']=='MOMENTUM_CONFIRMATION_OWNER_ONLY'
          assert r['direct_same_original_fresh_w123_parent_child_ab_receipt_present'] is True, r['direct_integrity']
          assert r['direct_integrity']['same_boundary'] is True
          assert r['direct_integrity']['same_config_sha'] is True
          assert r['direct_integrity']['same_source'] is True
          assert r['direct_integrity']['same_execution_snapshots'] is True
          assert r['direct_integrity']['same_cost_authority_sha256'] is True
          assert r['direct_integrity']['parent_anchor_22_trades_59_09pct'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          print(json.dumps({'state':r['state'],'parent':r['parent_w123']['aggregate'],'child':r['child_w123']['aggregate'],'deltas':r['metric_deltas'],'retention':r['trade_retention_pct'],'screen':r['development_screen'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist immutable momentum A/B receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_trend_rider_momentum_ab_latest.json
          cp out/a1_trend_rider_momentum_ab_v1.json "$target"
          git config user.name 'a1-trend-rider-momentum-ab'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 trend_rider: persist momentum direct A/B receipt [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish momentum direct A/B to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_trend_rider_momentum_ab_v1.json'))
          p=r['parent_w123']['aggregate']; c=r['child_w123']['aggregate']; d=r['metric_deltas']; s=r['development_screen']
          marker='<!-- A1_TREND_RIDER_MOMENTUM_DIRECT_AB_V1 -->'
          lines=[
            marker,
            '## A1 Trend Rider Momentum Direct A/B V1',
            f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",
            f"baseline={r['baseline_identity']}|axis={r['changed_axis']}|direct_ab={str(r['direct_same_original_fresh_w123_parent_child_ab_receipt_present']).lower()}",
            f"parent: trades={p['trades']}|WR={p['win_rate']:.12f}|net_exp_bps={p['net_expectancy_bps']:.6f}|net_pnl_bps={p['net_pnl_bps']:.6f}|PF={p['profit_factor']:.6f}|payoff={p['payoff']:.6f}|DD_bps={p['drawdown_bps']:.6f}",
            f"child: trades={c['trades']}|WR={c['win_rate']:.12f}|net_exp_bps={c['net_expectancy_bps']:.6f}|net_pnl_bps={c['net_pnl_bps']:.6f}|PF={c['profit_factor']:.6f}|payoff={c['payoff']:.6f}|DD_bps={c['drawdown_bps']:.6f}",
            f"delta: WR={d['win_rate']['delta_child_minus_parent']:.12f}|net_exp_bps={d['net_expectancy_bps']['delta_child_minus_parent']:.6f}|net_pnl_bps={d['net_pnl_bps']['delta_child_minus_parent']:.6f}|PF={d['profit_factor']['delta_child_minus_parent']:.6f}|payoff={d['payoff']['delta_child_minus_parent']:.6f}|DD_improvement_bps={d['drawdown_bps']['improvement']:.6f}|retention={r['trade_retention_pct']:.2f}%",
            f"screen_pass={str(s['pass']).lower()}|expectancy_improved={str(s['net_expectancy_improved']).lower()}|robustness_improved={str(s['robustness_improved_pf_or_payoff_or_drawdown']).lower()}|W123_econ={str(s['child_w123_economics_gate_pass']).lower()}",
            'transform=MACD histogram first-difference sign; existing frozen 12/26/9 project transform; zero threshold; no sweep',
            f"next={r['next_if_pass'] if s['pass'] else r['next_if_fail']}",
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0'
          ]
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: comments=json.load(resp)
          old=next((x for x in comments if marker in str(x.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_TREND_RIDER_MOMENTUM_DIRECT_AB_V1_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-momentum-direct-ab-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/a1_trend_rider_momentum_ab_v1.json
            out/trend_rider_parent_exact_receipt.json
            out/trend_rider_momentum_child_exact_receipt.json
          if-no-files-found: error
          retention-days: 90
