name: A1 Trend Rider Original Fresh Direct AB V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py'
      - 'backend/research/rebuild/trend_rider_momentum_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_fresh_w123_audit_v1.py'
      - '.github/workflows/a1-trend-rider-original-fresh-direct-ab-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py'
      - 'backend/research/rebuild/trend_rider_momentum_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_fresh_w123_audit_v1.py'
      - '.github/workflows/a1-trend-rider-original-fresh-direct-ab-v1.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-trend-rider-original-fresh-direct-ab-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical direct A/B contract
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/a1_trend_rider_momentum_ab_v1.py \
            backend/research/rebuild/trend_rider_momentum_child_policy_v1.py \
            backend/research/rebuild/a1_trend_rider_fresh_w123_audit_v1.py
          python -m backend.research.rebuild.a1_trend_rider_momentum_ab_v1 --self-test

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run same-original-fresh W123 parent child A/B
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_momentum_ab_v1 \
            --out out/a1_trend_rider_momentum_ab_latest.json
          python - <<'PY'
          import json, math
          p='out/a1_trend_rider_momentum_ab_latest.json'
          r=json.load(open(p))
          parent=r['parent_w123']['aggregate']
          assert r['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          assert int(parent['trades'])==22, parent
          assert math.isclose(float(parent['win_rate']),13/22,rel_tol=0,abs_tol=1e-12), parent
          assert r['direct_same_original_fresh_w123_parent_child_ab_receipt_present'] is True, r['direct_integrity']
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          print(json.dumps({
            'state':r['state'],
            'parent':parent,
            'child':r['child_w123']['aggregate'],
            'deltas':r['metric_deltas'],
            'retention_pct':r['trade_retention_pct'],
            'screen_pass':r['development_screen']['pass'],
            'next_if_pass':r['next_if_pass'],
            'next_if_fail':r['next_if_fail'],
            'receipt':r['receipt_sha256'],
          },sort_keys=True))
          PY
      - name: Persist canonical direct A/B receipt
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_trend_rider_momentum_ab_latest.json
          cp out/a1_trend_rider_momentum_ab_latest.json "$target"
          git config user.name 'a1-trend-rider-direct-ab'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 trend_rider: persist original-fresh direct A/B [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - name: Publish direct A/B state to issue 566
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('out/a1_trend_rider_momentum_ab_latest.json'))
          p=r['parent_w123']['aggregate']; c=r['child_w123']['aggregate']
          marker='<!-- A1_TREND_RIDER_ORIGINAL_FRESH_DIRECT_AB_V1 -->'
          def f(v):
              return 'NA' if v is None else f'{float(v):.6f}'
          lines=[
            marker,
            '## A1 Trend Rider Original Fresh Direct A/B V1',
            f"run={os.environ['RUN_ID']}|state={r['state']}|receipt={r['receipt_sha256']}",
            f"baseline={r['baseline_identity']}|axis={r['changed_axis']}|direct_ab={str(r['direct_same_original_fresh_w123_parent_child_ab_receipt_present']).lower()}",
            f"parent trades={p['trades']}|WR={f(p['win_rate'])}|Net={f(p['net_pnl_bps'])}bps|Exp={f(p['net_expectancy_bps'])}bps|PF={f(p['profit_factor'])}|payoff={f(p['payoff'])}|DD={f(p['drawdown_bps'])}bps",
            f"child trades={c['trades']}|WR={f(c['win_rate'])}|Net={f(c['net_pnl_bps'])}bps|Exp={f(c['net_expectancy_bps'])}bps|PF={f(c['profit_factor'])}|payoff={f(c['payoff'])}|DD={f(c['drawdown_bps'])}bps|retention={f(r['trade_retention_pct'])}%",
            f"development_screen_pass={str(r['development_screen']['pass']).lower()}|next_if_pass={r['next_if_pass']}|next_if_fail={r['next_if_fail']}",
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|protected_mutations=0',
          ]
          body='\n'.join(lines)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp:
              comments=json.load(resp)
          old=next((x for x in comments if marker in str(x.get('body') or '')),None)
          target=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          req=urllib.request.Request(target,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if old else 'POST')
          with urllib.request.urlopen(req,timeout=20): pass
          print('PASS_A1_TREND_RIDER_ORIGINAL_FRESH_DIRECT_AB_V1_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-original-fresh-direct-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_momentum_ab_latest.json
          if-no-files-found: error
          retention-days: 90
