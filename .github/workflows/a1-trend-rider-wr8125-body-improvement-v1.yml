name: A1 Trend Rider WR8125 Body Improvement V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py'
      - '.github/workflows/a1-trend-rider-wr8125-body-improvement-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: a1-trend-rider-wr8125-body-improvement-v1
  cancel-in-progress: true

jobs:
  targeted-body-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'master' }}
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify WR81.25 canonical owner
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py --self-test
      - name: Run one-axis targeted body improvement discovery
        run: |
          set -euo pipefail
          mkdir -p out
          python backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_attribution_v1.py \
            --out out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json'))
          assert r['authority_match'] is True, r
          assert r['canonical_head']=='trend_rider_wr80_us_chase_cooling_v1'
          assert r['base_wr8125']['trades']==16
          assert r['base_wr8125']['wins']==13
          assert abs(r['base_wr8125']['win_rate']-0.8125) < 1e-12
          assert r['numeric_threshold_sweep'] is False
          assert r['parent_incumbent_mutated'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],
            'base':r['base_wr8125'],
            'strict_candidate_count':r['strict_candidate_count'],
            'recommended':r.get('recommended_discovery_child'),
            'next':r['next'],
            'receipt':r['receipt_sha256'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-wr8125-body-improvement-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist targeted WR81.25 receipt on master
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json
          cp out/a1_trend_rider_wr8125_dynamic_trendline_htf_latest.json "$target"
          git config user.name 'a1-trend-rider-wr8125-body-improvement'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1 trend_rider: persist targeted WR81.25 body improvement [skip ci]'
          for n in 1 2 3; do
            git pull --rebase --depth=10 origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
