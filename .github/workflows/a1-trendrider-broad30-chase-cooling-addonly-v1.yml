name: A1 TrendRider Broad30 Chase Cooling AddOnly V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trendrider_broad30_chase_cooling_addonly_v1.py'
      - '.github/workflows/a1-trendrider-broad30-chase-cooling-addonly-v1.yml'
      - 'backend/research/rebuild/a1_top5_structure_authority_lock_v1.json'
      - 'backend/research/rebuild/trend_rider_transition_freshness_child_policy_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a1-trendrider-broad30-chase-cooling-addonly-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile evaluator
        run: |
          set -euo pipefail
          python -m py_compile backend/research/rebuild/a1_trendrider_broad30_chase_cooling_addonly_v1.py
          python -m backend.research.rebuild.trend_rider_transition_freshness_child_policy_v1
      - name: Download immutable broad30 authority
        run: |
          set -euo pipefail
          mkdir -p out/trend70
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9446790894/zip > out/trend70.zip
          unzip -q out/trend70.zip -d out/trend70
          test -f out/trend70/a1_exact25_drain_6_receipt.json
      - name: Evaluate chase cooling gate against locked broad30
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.a1_trendrider_broad30_chase_cooling_addonly_v1 \
            --broad-source out/trend70/a1_exact25_drain_6_receipt.json \
            --out out/a1_trendrider_broad30_chase_cooling_addonly_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trendrider_broad30_chase_cooling_addonly_v1.json'))
          p=r['locked_parent']
          assert p['T']==30 and abs(p['metrics']['win_rate']-0.70)<1e-12
          assert abs(p['metrics']['net_pnl_bps']-34960.57723836853)<0.1
          assert abs(p['metrics']['net_expectancy_bps']-1165.3525746122843)<0.1
          assert abs(p['metrics']['profit_factor']-60.814848013018874)<0.1
          assert abs(p['payoff']-26.063506291293802)<0.1
          assert abs(p['metrics']['drawdown_bps']-413.7929696059291)<0.1
          assert p['mutated'] is False
          a=r['axis']
          assert a['id']=='CHASE_COOLING_OR_FLAT_ONLY'
          assert a['all_sessions_same_rule'] is True
          assert a['numeric_threshold_sweep'] is False and a['alternative_rule_sweep'] is False
          assert a['uses_post_outcome_data'] is False
          assert r['partial_current_source']['complete_base_broad_coverage'] is False
          assert r['partial_current_source']['append_authority'] is False
          assert r['parent_trade_deletion']==0 and r['parent_trade_rewrite']==0
          assert r['automatic_prelock_union'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],
            'historical_profile':r['historical_profile'],
            'quarantined_prelock_partial_validation':r['quarantined_prelock_partial_validation'],
            'postlock_partial_validation':r['postlock_partial_validation'],
            'next':r['next'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trendrider-broad30-chase-cooling-addonly-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trendrider_broad30_chase_cooling_addonly_v1.json
          if-no-files-found: error
          retention-days: 90
