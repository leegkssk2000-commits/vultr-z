name: A1 Verified Video Gemini Bridge V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_verified_video_gemini_bridge_v1.py'
      - 'backend/research/zel_manual_video_registry_v1.json'
      - 'backend/production/zel_production_external_research_observer_v1.py'
      - 'config/zel_production_external_research_observer_v1.json'
      - '.github/workflows/a1-verified-video-gemini-bridge-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/architecture_factory/a1_verified_video_gemini_bridge_v1.py'
      - 'backend/research/zel_manual_video_registry_v1.json'
      - 'backend/production/zel_production_external_research_observer_v1.py'
      - 'config/zel_production_external_research_observer_v1.json'
      - '.github/workflows/a1-verified-video-gemini-bridge-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 3 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: a1-verified-video-gemini-bridge-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_verified_video_gemini_bridge_v1.py
          python -m backend.research.architecture_factory.a1_verified_video_gemini_bridge_v1 --self-test

  bridge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze verified high-view registry videos directly with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_verified_video_gemini_bridge_v1 \
            --existing backend/research/architecture_factory/a1_youtube_evidence_latest.json \
            --output out/a1_youtube_evidence_direct_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_youtube_evidence_direct_v1.json'))
          assert r['research_only'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and int(r['protected_mutations'])==0
          assert r['heavy_slot_consumed'] is False and r['gen1_boundary_mutated'] is False
          assert r['sealed_holdout_outcomes_exposed'] is False and r['factory_blocking'] is False
          assert all(int(x['view_count_snapshot']) >= 30000 for x in r.get('sources') or [])
          assert all(x['view_snapshot_verified'] is True and x['accepted_for_hypothesis_only'] is True for x in r.get('sources') or [])
          print(json.dumps({'state':r['state'],'accepted':r['accepted_count'],'preferred100k':r['preferred_100k_count'],'fallback30k':r['fallback_30k_count'],'discovery':r['discovery']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist direct-video evidence if accepted content changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: backend/research/architecture_factory/a1_youtube_evidence_latest.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request
          new=json.load(open('out/a1_youtube_evidence_direct_v1.json'))
          repo=os.environ['REPO']; target=os.environ['TARGET']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target,safe="/")}?ref=master'
          old={}; sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp: meta=json.load(resp)
              sha=meta.get('sha'); old=json.loads(base64.b64decode(meta.get('content','')).decode('utf-8'))
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          def stable(x):
              return {k:x.get(k) for k in ('state','policy','sources','reviews','accepted_count','preferred_100k_count','fallback_30k_count')}
          if stable(old)==stable(new):
              print('NO_DIRECT_VIDEO_LEDGER_CHANGE'); raise SystemExit(0)
          payload={'message':'A1 YouTube evidence: add verified direct Gemini analyses','content':base64.b64encode((json.dumps(new,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()).decode(),'branch':'master'}
          if sha: payload['sha']=sha
          put=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target,safe="/")}'
          with urllib.request.urlopen(urllib.request.Request(put,data=json.dumps(payload).encode(),headers=headers,method='PUT'),timeout=30) as resp: result=json.load(resp)
          print('PERSISTED_DIRECT_VIDEO_LEDGER',result.get('commit',{}).get('sha'))
          PY
      - name: Publish direct-video status to issue 566
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          p=pathlib.Path('out/a1_youtube_evidence_direct_v1.json'); marker='<!-- A1_VERIFIED_VIDEO_GEMINI_BRIDGE_V1 -->'
          if p.exists():
              r=json.load(open(p)); d=r.get('discovery') or {}
              lines=[marker,'## A1 Verified Video Gemini Bridge V1',f"state={r.get('state')}|run={os.environ['RUN_ID']}",f"accepted={r.get('accepted_count')}|preferred100k={r.get('preferred_100k_count')}|fallback30k={r.get('fallback_30k_count')}",f"eligible_verified={d.get('eligible_unique')}|reviewed_now={d.get('reviewed_now')}|blockers={len(d.get('blockers') or [])}",f"source_ids={','.join(str(x.get('id') or '') for x in r.get('sources') or [])}",'MODE=Gemini file_data direct public YouTube|verified registry views','ROLE=hypothesis_only|NON_BLOCKING=Gen1|factory|heavy_slot','selection=false|promotion=false|execution=NONE|order/live=BLOCKED']
          else:
              lines=[marker,'## A1 Verified Video Gemini Bridge V1',f"state=WORKFLOW_FAILED_BEFORE_RECEIPT|run={os.environ['RUN_ID']}",'NON_BLOCKING=Gen1|factory|heavy_slot']
          body='\n'.join(lines); token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          base=f'https://api.github.com/repos/{repo}/issues/566/comments?per_page=100'
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as resp: comments=json.load(resp)
          existing=next((c for c in comments if marker in str(c.get('body') or '')),None); url=existing.get('url') if existing else f'https://api.github.com/repos/{repo}/issues/566/comments'
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method='PATCH' if existing else 'POST'),timeout=20): pass
          print('PASS_DIRECT_VIDEO_STATUS_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-verified-video-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: out/a1_youtube_evidence_direct_v1.json
