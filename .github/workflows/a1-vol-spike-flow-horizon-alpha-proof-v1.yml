name: A1 Vol Spike Flow Horizon Alpha Proof V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/alpha_proof/bundles/a1_alpha_proof_vol_spike_flow_horizon_v1.json'
      - '.github/workflows/a1-vol-spike-flow-horizon-alpha-proof-v1.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate exact candidate-matched Alpha Proof V2
        run: |
          set -euo pipefail
          mkdir -p out
          set +e
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v2 \
            --bundle backend/research/alpha_proof/bundles/a1_alpha_proof_vol_spike_flow_horizon_v1.json \
            --output out/a1_alpha_proof_vol_spike_flow_horizon_v1_receipt.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          r=json.load(open('out/a1_alpha_proof_vol_spike_flow_horizon_v1_receipt.json'))
          assert r['candidate_sha256']=='2bc6f543ab09fd1f1aaee0257b926dc8463a6aa4afc7bf4a9ab89fde88ec6e56'
          assert r['candidate_identity_sha256']==r['candidate_sha256']
          assert r['state']=='HOLD_ALPHA_PROOF'
          assert r['heavy_launch_allowed'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          states={g['gate']:g['passed'] for g in r['gates']}
          assert states['P0_PRIMARY_EVIDENCE'] is True
          assert states['P1_FEATURE_CAUSAL_MAP'] is True
          assert all(states[x] is False for x in ['P2_NUMERIC_PARAMETER_PROVENANCE','P3_EMPIRICAL_MOVE_VS_COST','P4_NEGATIVE_CONTROLS_ABLATION','P5_MULTI_AI_ADVERSARIAL_REVIEW','P6_SOURCE_IMPLEMENTATION_REALITY'])
          print(json.dumps({'state':r['state'],'failed_gates':[g['gate'] for g in r['gates'] if not g['passed']],'receipt_sha':r['receipt_sha256']},sort_keys=True))
          PY
          test "$rc" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: a1-vol-spike-flow-horizon-alpha-proof-v1-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: out/a1_alpha_proof_vol_spike_flow_horizon_v1_receipt.json
