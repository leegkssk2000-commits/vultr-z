name: A1 YouTube Diversity Bootstrap V1

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/a1-youtube-diversity-bootstrap-v1.yml'
      - 'backend/research/architecture_factory/a1_youtube_diversity_scout_v1.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-youtube-diversity-bootstrap-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a1-youtube-diversity-bootstrap-v1
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_youtube_diversity_scout_v1.py
          python -m backend.research.architecture_factory.a1_youtube_diversity_scout_v1 --self-test

  bootstrap:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only live 15-bucket Gemini diversity bootstrap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          A1_YOUTUBE_GEMINI_MODELS: 'models/gemini-3.6-flash,models/gemini-3.1-pro-preview'
          YOUTUBE_DIVERSITY_SEARCH_GROUP_SIZE: '5'
          YOUTUBE_DIVERSITY_MAX_VIDEO_REVIEWS: '6'
          YOUTUBE_DIVERSITY_MAX_POOL: '60'
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_youtube_diversity_scout_v1 \
            --existing backend/research/architecture_factory/a1_youtube_diversity_latest.json \
            --registry backend/research/zel_manual_video_registry_v1.json \
            --output out/a1_youtube_diversity_scout_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_youtube_diversity_scout_v1.json'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert len(r['buckets'])==15 and int(r['metrics']['candidate_pool_count'])<=60
          print(json.dumps({'state':r['state'],**r['metrics']},sort_keys=True))
          PY
      - name: Assert bootstrap cannot overwrite canonical diversity state
        run: |
          set -euo pipefail
          git diff --exit-code -- backend/research/architecture_factory/a1_youtube_diversity_latest.json
          echo 'PASS_BOOTSTRAP_READ_ONLY_CANONICAL_OWNER_SCOUT_ONLY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-youtube-diversity-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_youtube_diversity_scout_v1.json
          if-no-files-found: warn
          retention-days: 30
