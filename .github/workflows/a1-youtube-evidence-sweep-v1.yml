name: A1 YouTube Paid-AI Cost Lock V1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/a1-youtube-evidence-sweep-v1.yml'
      - 'backend/research/architecture_factory/a1_youtube_evidence_sweep_v1.py'

permissions:
  contents: read

concurrency:
  group: a1-youtube-paid-ai-cost-lock-v1
  cancel-in-progress: false

jobs:
  paid-ai-cost-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
      YOUTUBE_MAX_GEMINI_REVIEWS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Assert A1 YouTube paid AI disabled
        run: |
          set -euo pipefail
          test -z "$GEMINI_API_KEY"
          test -z "$GOOGLE_API_KEY"
          test -z "$OPENAI_API_KEY"
          test -z "$OPENROUTER_API_KEY"
          test -z "$GROQ_API_KEY"
          test "$YOUTUBE_MAX_GEMINI_REVIEWS" = '0'
          echo A1_YOUTUBE_PAID_AI_COST_LOCK=PASS

      - name: Assert legacy automatic paid sweep cannot execute
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/a1-youtube-evidence-sweep-v1.yml').read_text(encoding='utf-8')
          trigger_block = text.split('permissions:', 1)[0]
          assert ('sched' + 'ule:') not in trigger_block
          assert ('secrets.' + 'GEMINI_API_KEY') not in text
          assert ('secrets.' + 'GOOGLE_API_KEY') not in text
          assert ("YOUTUBE_MAX_GEMINI_REVIEWS: '" + '3' + "'") not in text
          assert ('summarize technical evidence with ' + 'Gemini') not in text
          assert ('python -m backend.research.architecture_factory.' + 'a1_youtube_evidence_sweep_v1') not in text
          print('A1_YOUTUBE_AUTOMATIC_PAID_SWEEP=BLOCKED')
          PY
