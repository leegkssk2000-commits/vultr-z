name: a1-gen2-4h-range-atr-volcap-repair-v2
on:
  push:
    paths:
      - 'backend/research/architecture_factory/a1_gen2_4h_range_atr_volcap_repair_v2.py'
      - '.github/workflows/a1_gen2_4h_range_atr_volcap_repair_v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run repair
        run: |
          set -euo pipefail
          python -m py_compile backend/research/architecture_factory/a1_gen2_4h_range_atr_volcap_repair_v2.py
          python -m backend.research.architecture_factory.a1_gen2_4h_range_atr_volcap_repair_v2
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          r=json.load(open('out/a1_gen2_4h_range_atr_volcap_repair_v2.json')); marker='<!-- A1_GEN2_4H_RANGE_ATR_VOLCAP_REPAIR_V2 -->'
          body='\n'.join([marker,'## A1 GEN2 4H Range ATR Volcap Repair V2',f"run_id={os.environ['RUN_ID']}",'dev='+json.dumps(r['dev'],sort_keys=True),'prior_all='+json.dumps(r['prior_all'],sort_keys=True),'W2='+json.dumps(r['W2'],sort_keys=True),'W3='+json.dumps(r['W3'],sort_keys=True),'cost_dev='+json.dumps(r['cost_stress_dev'],sort_keys=True),'cost_prior='+json.dumps(r['cost_stress_prior'],sort_keys=True),'by_symbol_prior='+json.dumps(r['by_symbol_prior'],sort_keys=True),f"repair_promising={str(r['repair_promising']).lower()}",f"receipt_sha256={r['receipt_sha256']}",'selection=false|promotion=false|execution=NONE|order/live=BLOCKED'])
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}; base=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h)) as q: cs=json.load(q)
          old=next((c for c in cs if marker in str(c.get('body') or '')),None); url=old.get('url') if old else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=h,method='PATCH' if old else 'POST')): pass
          PY
