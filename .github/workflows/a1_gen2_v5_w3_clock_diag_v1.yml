name: A1 GEN2 V5 W3 Clock Diagnostic V1
on:
  push:
    paths:
      - 'backend/research/architecture_factory/a1_gen2_v5_w3_clock_diag_v1.py'
      - '.github/workflows/a1_gen2_v5_w3_clock_diag_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m backend.research.architecture_factory.a1_gen2_v5_w3_clock_diag_v1
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/body.md
          import json,os
          r=json.load(open('out/a1_gen2_v5_w3_clock_diag_v1.json'))
          print('<!-- A1_GEN2_V5_W3_CLOCK_DIAG_V1 -->')
          print('run_id='+os.environ['RUN_ID'])
          for k in ('W2','W3','W2_by_hour','W3_by_hour','W3_by_hour_side'): print(k+'='+json.dumps(r[k],sort_keys=True))
          print('receipt_sha256='+r['receipt_sha256'])
          PY
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
