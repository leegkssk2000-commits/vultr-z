name: A1 Recent Loss Cluster Diagnostic V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_recent_loss_cluster_diagnostic_v1.py'
      - '.github/workflows/a1_recent_loss_cluster_diagnostic_v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_recent_loss_cluster_diagnostic_v1.py'
      - '.github/workflows/a1_recent_loss_cluster_diagnostic_v1.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a1-recent-loss-cluster-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self test
        run: python -m backend.research.rebuild.a1_recent_loss_cluster_diagnostic_v1 --self-test
      - name: Diagnose fresh loss clusters and route one-axis repairs
        run: python -m backend.research.rebuild.a1_recent_loss_cluster_diagnostic_v1 --out out/a1_recent_loss_cluster_diagnostic_latest.json
      - name: Verify fail-closed authority and no incumbent mutation
        run: |
          python - <<'PY'
          import json
          r=json.load(open('out/a1_recent_loss_cluster_diagnostic_latest.json'))
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          for x in r['targets']:
              assert x['incumbent_mutated'] is False
              assert x['post_outcome_threshold_sweep'] is False
              assert x['execution_authority']=='NONE' and x['order_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'triggered':r['triggered_strategy_ids'],'routes':{x['strategy_id']:x['recommended_route'] for x in r['targets']}},sort_keys=True))
          PY
      - name: Persist latest diagnostic
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          target=backend/research/rebuild/a1_recent_loss_cluster_diagnostic_latest.json
          cp out/a1_recent_loss_cluster_diagnostic_latest.json "$target"
          git config user.name 'a1-loss-cluster-diagnostic-v1'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A1: persist recent loss-cluster diagnostic [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-recent-loss-cluster-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_recent_loss_cluster_diagnostic_latest.json
