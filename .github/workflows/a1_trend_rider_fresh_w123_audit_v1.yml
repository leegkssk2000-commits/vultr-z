name: A1 Trend Rider Fresh W123 Audit V1
on:
  push:
    paths:
      - 'backend/research/rebuild/a1_trend_rider_fresh_w123_audit_v1.py'
      - '.github/workflows/a1_trend_rider_fresh_w123_audit_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m backend.research.rebuild.a1_exact25_generic_evaluator_v2 --strategy-id trend_rider --out trend_rider_receipt.json
      - run: python -m backend.research.rebuild.a1_trend_rider_fresh_w123_audit_v1 --receipt trend_rider_receipt.json
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/body.md
          import json,os
          r=json.load(open('out/a1_trend_rider_fresh_w123_audit_v1.json'))
          print('<!-- A1_TREND_RIDER_FRESH_W123_AUDIT_V1 -->')
          print('run_id='+os.environ['RUN_ID'])
          for k in ('W1','W2','W3','aggregate'): print(k+'='+json.dumps(r[k],sort_keys=True))
          print('economics_gate_pass='+str(r['economics_gate_pass']).lower())
          print('receipt_sha256='+r['receipt_sha256'])
          PY
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
