name: A1 Trend Rider Transition Freshness H4 H5 Dev V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_trend_rider_transition_freshness_h4_h5_dev_v1.py'
      - '.github/workflows/a1_trend_rider_transition_freshness_h4_h5_dev_v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transition freshness development H4 H5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile backend/research/rebuild/a1_trend_rider_transition_freshness_h4_h5_dev_v1.py
          python -m backend.research.rebuild.a1_trend_rider_transition_freshness_h4_h5_dev_v1 --self-test
          python -m backend.research.rebuild.a1_trend_rider_transition_freshness_h4_h5_dev_v1 \
            --out out/a1_trend_rider_transition_freshness_h4_h5_dev_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_transition_freshness_h4_h5_dev_latest.json'))
          assert r['baseline_identity']=='ORIGINAL_TREND_RIDER_FRESH_W1_W2_W3'
          assert r['candidate_axis']=='TRANSITION_FRESHNESS_REENTRY_SUPPRESSION_ONLY'
          assert r['development_trade_count']==14
          assert r['mature_minimum_trade_count']==25
          assert r['diagnostic_only'] is True
          assert r['survivor_improvement_claim_allowed'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],'trades':r['development_trade_count'],
            'H4':r['h4'].get('state'),'H5':r['h5'].get('state'),
            'top10':r['top10_trade_profit_share'],
            'mature_budget_ready':r['mature_budget_ready'],
            'receipt':r['receipt_sha256']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-trend-rider-transition-hardening-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_transition_freshness_h4_h5_dev_latest.json
          retention-days: 30
