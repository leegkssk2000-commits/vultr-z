name: A1 Trend Rider Transition Freshness Hardening Router V1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/a1_trend_rider_transition_freshness_hardening_router_v1.py'
      - '.github/workflows/a1_trend_rider_transition_freshness_hardening_router_v1.yml'
      - 'backend/research/rebuild/trend_rider_transition_freshness_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
  push:
    branches:
      - master
    paths:
      - 'backend/research/rebuild/a1_trend_rider_transition_freshness_hardening_router_v1.py'
      - '.github/workflows/a1_trend_rider_transition_freshness_hardening_router_v1.yml'
      - 'backend/research/rebuild/trend_rider_transition_freshness_child_policy_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route transition child to H4/H5 when sample is sufficient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile \
            backend/research/rebuild/a1_trend_rider_transition_freshness_hardening_router_v1.py \
            backend/research/rebuild/a1_trend_rider_h4_h5_hardening_v1.py
          python -m backend.research.rebuild.a1_trend_rider_transition_freshness_hardening_router_v1 --self-test
          python -m backend.research.rebuild.a1_trend_rider_transition_freshness_hardening_router_v1 \
            --out out/a1_trend_rider_transition_freshness_hardening_router_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_transition_freshness_hardening_router_latest.json'))
          assert r['changed_axis']=='TRANSITION_FRESHNESS_REENTRY_SUPPRESSION_ONLY'
          assert r['minimum_hardening_trades']==25
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({k:r.get(k) for k in ['state','completed_trades','minimum_hardening_trades','sample_gap','h4_state','h5_state','next']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-trend-rider-transition-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_trend_rider_transition_freshness_hardening_router_latest.json
          retention-days: 30
