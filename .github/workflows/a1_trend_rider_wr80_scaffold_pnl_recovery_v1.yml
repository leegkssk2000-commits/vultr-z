name: A1 Trend Rider WR80 Scaffold PnL Recovery V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/trend_rider_transition_freshness_non_us_chase_cooling_reentry_child_policy_v1.py'
      - 'backend/research/rebuild/a1_loss_streak_pareto_scaffold_policy_v1.py'
      - 'backend/research/rebuild/trend_rider_trigger32623644328_incumbent_context_v1.json'
      - 'backend/research/rebuild/a1_trend_rider_wr80_scaffold_chase_recovery_v1.py'
      - 'backend/research/rebuild/a1_trend_rider_wr80_scaffold_recovery_decision_ledger_v1.json'
      - '.github/workflows/a1_trend_rider_wr80_scaffold_pnl_recovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a1-trend-rider-wr80-scaffold-pnl-recovery-v1-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test chase-cooling recovery
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/trend_rider_transition_freshness_non_us_chase_cooling_reentry_child_policy_v1.py \
            backend/research/rebuild/a1_loss_streak_pareto_scaffold_policy_v1.py \
            backend/research/rebuild/a1_trend_rider_wr80_scaffold_chase_recovery_v1.py
          python -m backend.research.rebuild.trend_rider_transition_freshness_non_us_chase_cooling_reentry_child_policy_v1
          python -m backend.research.rebuild.a1_loss_streak_pareto_scaffold_policy_v1
          python -m backend.research.rebuild.a1_trend_rider_wr80_scaffold_chase_recovery_v1 --self-test
      - name: Targeted replay of immutable 24-trade context
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_wr80_scaffold_chase_recovery_v1 \
            --out out/a1_trend_rider_wr80_scaffold_chase_recovery_latest.json | tee out/stdout.txt
      - name: Verify constrained Pareto semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_wr80_scaffold_chase_recovery_latest.json'))
          assert not r['integrity_defects']
          assert r['generation']==2
          assert r['changed_axis']=='NON_US_SCAFFOLD_PLUS_US_CHASE_ATR_COOLING_REENTRY'
          assert r['method']=='IMMUTABLE_24_TRADE_OVERLAY_PREENTRY_TARGETED_REPLAY_LINEAR_CHASE_PARITY'
          assert r['parked_wr80_scaffold']['trades']==15
          assert r['parked_wr80_scaffold']['win_rate']==0.8
          assert abs(r['parked_wr80_scaffold']['net_pnl_bps']-21196.60152461874)<1e-6
          assert r['historical_regression_is_promotion_evidence'] is False
          assert r['scaffold_must_not_be_discarded_if_this_axis_fails'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          if r['state']=='PASS_WR_SCAFFOLD_PNL_RECOVERY':
              assert r['recovery_candidate']['win_rate']>=0.8
              assert r['recovery_candidate']['net_pnl_bps']>r['parked_wr80_scaffold']['net_pnl_bps']
          print(json.dumps({
              'state':r['state'],
              'scaffold':r['parked_wr80_scaffold'],
              'recovery':r['recovery_candidate'],
              'delta':r['deltas_vs_scaffold'],
              'pnl_gap_to_parent_bps':r['pnl_gap_to_parent_bps'],
              're_admitted_us':r['re_admitted_us'],
              'next':r['next']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-wr80-scaffold-pnl-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 30
