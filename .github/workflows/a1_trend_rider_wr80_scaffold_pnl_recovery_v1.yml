name: A1 Trend Rider WR80 Scaffold PnL Recovery V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_trend_rider_wr80_scaffold_pnl_recovery_v1.py'
      - 'backend/research/rebuild/trend_rider_transition_freshness_non_us_strength_reentry_child_policy_v1.py'
      - 'backend/research/rebuild/a1_loss_streak_pareto_scaffold_policy_v1.py'
      - '.github/workflows/a1_trend_rider_wr80_scaffold_pnl_recovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a1-trend-rider-wr80-scaffold-pnl-recovery-v1-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test scaffold recovery
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/trend_rider_transition_freshness_non_us_strength_reentry_child_policy_v1.py \
            backend/research/rebuild/a1_trend_rider_wr80_scaffold_pnl_recovery_v1.py \
            backend/research/rebuild/a1_loss_streak_pareto_scaffold_policy_v1.py
          python -m backend.research.rebuild.trend_rider_transition_freshness_non_us_strength_reentry_child_policy_v1
          python -m backend.research.rebuild.a1_trend_rider_wr80_scaffold_pnl_recovery_v1 --self-test
          python -m backend.research.rebuild.a1_loss_streak_pareto_scaffold_policy_v1
      - name: Re-run immutable context from WR80 scaffold toward PnL recovery
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.rebuild.a1_trend_rider_wr80_scaffold_pnl_recovery_v1 \
            --out out/a1_trend_rider_wr80_scaffold_pnl_recovery_latest.json | tee out/stdout.txt
      - name: Verify constrained Pareto semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_trend_rider_wr80_scaffold_pnl_recovery_latest.json'))
          assert r['authority']['match'] is True
          assert r['optimization_mode']=='SEQUENTIAL_CONSTRAINED_PARETO_RECOVERY'
          assert r['parked_scaffold']['win_rate']==0.8
          assert r['parked_scaffold']['net_pnl_bps']>0
          assert r['historical_regression_is_promotion_evidence'] is False
          assert r['scaffold_must_not_be_discarded_if_this_axis_fails'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0
          if r['state']=='PASS_WR_SCAFFOLD_PNL_RECOVERY':
              assert r['constraints']['win_rate_floor_kept'] is True
              assert r['constraints']['net_pnl_recovered'] is True
          print(json.dumps({
              'state':r['state'],
              'scaffold':r['parked_scaffold'],
              'recovery':r['recovery_candidate'],
              'delta':r['deltas_vs_scaffold'],
              'pnl_gap_to_parent_bps':r['pnl_gap_to_parent_bps'],
              'next':r['next']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-trend-rider-wr80-scaffold-pnl-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 30
