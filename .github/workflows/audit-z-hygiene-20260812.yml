name: cleanup Z dead s4f18c side-effect 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Remove only dead s4f18c start side-effect
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /home/z/zel-production-current)"
          test "$CURRENT" = /home/z/zel-production-releases/373ea890530a46d0b04da6414462e6c3873e5498
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active

          SCRIPT=/usr/local/bin/zel_s4g8r7f5k_clean_upstream_price_close_bind.py
          TIMER=zel-s4g8r7f5k-clean-upstream-price-close-bind.timer
          DEAD_UNIT=zel-s4f18c-shadow-close-writer.service
          DEAD_EXEC=/usr/local/bin/zel_s4f18c_shadow_tp_sl_close_writer.py
          OLD='os.system("systemctl start zel-s4f18c-shadow-close-writer.service >/dev/null 2>&1 || true")'
          NEW='# CLEANUP_20260812: retired missing s4f18c writer; h2e9 close engine remains canonical fallback'

          test -f "$SCRIPT"
          test ! -e "$DEAD_EXEC"
          test "$(systemctl show "$DEAD_UNIT" -p ActiveState --value)" = failed
          test "$(grep -Fxc "$OLD" "$SCRIPT")" = 1
          test "$(grep -RslF 's4f18c_shadow_tp_sl_close_writer_latest' /home/z/zel-production-current/backend /home/z/zel-production-current/config 2>/dev/null | wc -l)" = 0

          mkdir -p /home/z/z/rollback/hygiene-20260812
          cp -a "$SCRIPT" /home/z/z/rollback/hygiene-20260812/zel_s4g8r7f5k_clean_upstream_price_close_bind.py.pre_s4f18c_cleanup
          PRE_SHA="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          PRE_MTIME="$(stat -c %Y /var/www/z-os-alimi/api/s4g8r7f5k_clean_upstream_price_close_bind_latest.json)"

          systemctl stop "$TIMER"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/usr/local/bin/zel_s4g8r7f5k_clean_upstream_price_close_bind.py')
          old='os.system("systemctl start zel-s4f18c-shadow-close-writer.service >/dev/null 2>&1 || true")'
          new='# CLEANUP_20260812: retired missing s4f18c writer; h2e9 close engine remains canonical fallback'
          text=p.read_text()
          if text.count(old) != 1:
              raise SystemExit('EXACT_DEAD_CALL_COUNT_MISMATCH')
          p.write_text(text.replace(old,new,1))
          PY
          python3 -m py_compile "$SCRIPT"
          test "$(grep -Fxc "$OLD" "$SCRIPT" || true)" = 0
          test "$(grep -Fxc "$NEW" "$SCRIPT")" = 1
          systemctl reset-failed "$DEAD_UNIT" || true
          systemctl start "$TIMER"
          test "$(systemctl is-active "$TIMER")" = active

          ok=0
          for _ in $(seq 1 12); do
            sleep 2
            POST_MTIME="$(stat -c %Y /var/www/z-os-alimi/api/s4g8r7f5k_clean_upstream_price_close_bind_latest.json)"
            if [ "$POST_MTIME" -gt "$PRE_MTIME" ]; then ok=1; break; fi
          done
          test "$ok" = 1
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active
          test "$(systemctl show "$DEAD_UNIT" -p ActiveState --value)" != failed
          POST_SHA="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          printf 'PASS_DEAD_S4F18C_SIDE_EFFECT_REMOVED pre_sha=%s post_sha=%s\n' "$PRE_SHA" "$POST_SHA"
          systemctl show "$TIMER" -p ActiveState -p UnitFileState -p LastTriggerUSec --no-pager
          stat -c '%y %s %n' /var/www/z-os-alimi/api/s4g8r7f5k_clean_upstream_price_close_bind_latest.json
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
