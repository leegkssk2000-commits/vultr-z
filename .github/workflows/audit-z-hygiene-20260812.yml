name: trace Z 5s legacy invoker 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Trace dynamic legacy invoker read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          echo '=== ACTIVE ZEL TIMERS ==='
          systemctl list-timers --all --no-pager --no-legend 2>/dev/null | grep -Ei 'zel|q4r3|s4f|s4g8|paper' | head -n 320 || true

          echo '=== ACTIVE ZEL SERVICES / EXECSTART ==='
          while read -r u _; do
            [ -n "$u" ] || continue
            echo "--- $u ---"
            systemctl show "$u" -p ActiveState -p SubState -p MainPID -p ExecStart --no-pager 2>/dev/null || true
          done < <(systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei 'zel|q4r3|s4f|s4g8|paper' | head -n 180)

          echo '=== GENERIC DYNAMIC SYSTEMCTL CALLERS ==='
          grep -RsnE 'systemctl[[:space:]]+(start|restart|try-restart)|subprocess\.(run|call|Popen).*systemctl|os\.system\(.*systemctl' \
            /usr/local/bin /home/z/zel-production-current/backend /home/z/z 2>/dev/null \
            | grep -Ei 'zel|service|unit|timer|start' | head -n 520 || true

          echo '=== LEGACY NAME FRAGMENTS ANYWHERE ==='
          grep -RsnEi 's4f18c|s4g8r4|shadow.?close.?writer|zero.?epoch.?q4|projection.?single.?writer' \
            /usr/local/bin /home/z/zel-production-current/backend /home/z/z /etc/systemd/system 2>/dev/null | head -n 520 || true

          echo '=== SAMPLE 22 SECONDS OF TARGET STARTS ==='
          before="$(date --iso-8601=seconds)"
          sleep 22
          after="$(date --iso-8601=seconds)"
          echo "window=$before..$after"
          journalctl --since "$before" --until "$after" --no-pager -o short-iso 2>/dev/null \
            | grep -E 'Starting ZEL S4F18C|Starting ZEL S4G8R4|s4f18c-shadow-close-writer|s4g8r4-zero-epoch-q4-display-mirror|Failed to start|can.t open file' \
            | tail -n 260 || true

          echo '=== SAME WINDOW SYSTEMD START/FINISH NEIGHBORS ==='
          journalctl --since "$before" --until "$after" --no-pager -o short-iso 2>/dev/null \
            | grep -E 'systemd\[1\]: (Starting|Started|Finished|Failed).*ZEL|systemd\[1\]: (Starting|Started|Finished|Failed).*zel' \
            | tail -n 520 || true

          echo '=== TARGET SHOW AFTER SAMPLE ==='
          for u in zel-s4f18c-shadow-close-writer.service zel-s4g8r4-zero-epoch-q4-display-mirror.service; do
            systemctl show "$u" -p ActiveEnterTimestamp -p InactiveEnterTimestamp -p InvocationID -p Result -p ExecMainCode -p ExecMainStatus --no-pager 2>/dev/null || true
          done
          echo 'PASS_5S_LEGACY_INVOKER_TRACE_READ_ONLY'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
