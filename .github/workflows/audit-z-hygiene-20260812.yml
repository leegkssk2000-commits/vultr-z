name: cleanup Z orphan timers 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Disable only proven orphan failing timers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          EXPECTED=/home/z/zel-production-releases/373ea890530a46d0b04da6414462e6c3873e5498
          CURRENT="$(readlink -f /home/z/zel-production-current)"
          test "$CURRENT" = "$EXPECTED"
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active

          cleanup_one() {
            svc="$1"; timer="$2"; script="$3"
            echo "=== PRE $svc ==="
            systemctl is-active "$svc" || true
            systemctl is-active "$timer" || true
            systemctl is-enabled "$timer" || true
            test ! -e "$script"
            systemctl cat "$svc" | grep -Fq "$script"
            req="$(systemctl show "$svc" -p RequiredBy --value || true)"
            want="$(systemctl show "$svc" -p WantedBy --value || true)"
            test -z "$req"
            test -z "$want"
            systemctl disable --now "$timer"
            systemctl reset-failed "$svc" || true
            echo "=== POST $svc ==="
            test "$(systemctl is-active "$timer" || true)" = inactive
            test "$(systemctl is-enabled "$timer" || true)" = disabled
            post="$(systemctl is-active "$svc" || true)"
            test "$post" != failed
            printf 'service=%s timer=%s state=%s\n' "$svc" "$timer" "$post"
          }

          cleanup_one \
            zel-q4r3-candidate-skill-annotator.service \
            zel-q4r3-candidate-skill-annotator.timer \
            /usr/local/bin/zel_q4r3_candidate_skill_annotator.py
          cleanup_one \
            zel-q4r3-chart-current-binder.service \
            zel-q4r3-chart-current-binder.timer \
            /usr/local/bin/zel_q4r3_chart_current_binder.py

          sleep 12
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active
          echo '=== REMAINING FAILED ZEL ==='
          systemctl --failed --no-pager --no-legend | grep -E '^.?[[:space:]]*zel-' || true
          echo 'PASS_ORPHAN_FAILING_TIMERS_DISABLED'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
