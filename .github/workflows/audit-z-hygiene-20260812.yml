name: map Z legacy caller owners 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Map active caller scripts to unit owners read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          scripts=(
            zel_s4g8r7f5j_direct_tv_price_to_close_feed.py
            zel_s4g8r7f5l_shadow_auto_close_fallback.py
            zel_s4g8r7f5k_clean_upstream_price_close_bind.py
            zel_s4g8r7f5h_auto_close_price_feed_bind.py
            zel_s4g8r7f3a_state_aware_shadow_wakeup_router.py
          )
          for s in "${scripts[@]}"; do
            echo "=== SCRIPT $s ==="
            grep -RslF "/usr/local/bin/$s" /etc/systemd/system /usr/lib/systemd/system 2>/dev/null | sort || true
            echo '-- call-site context --'
            grep -nE 'systemctl (start|restart)|subprocess\.run|os\.system|DISPLAY_UNIT|CLOSE=' "/usr/local/bin/$s" 2>/dev/null | tail -n 40 || true
          done

          echo '=== MATCHED UNIT STATES ==='
          units="$(grep -RslE 'zel_s4g8r7f5(j_direct_tv_price_to_close_feed|l_shadow_auto_close_fallback|k_clean_upstream_price_close_bind|h_auto_close_price_feed_bind)|zel_s4g8r7f3a_state_aware_shadow_wakeup_router' /etc/systemd/system /usr/lib/systemd/system 2>/dev/null | sed -E 's#.*/##' | sort -u || true)"
          for u in $units; do
            echo "--- $u ---"
            systemctl show "$u" -p ActiveState -p SubState -p UnitFileState -p TriggeredBy -p Triggers -p ExecStart --no-pager 2>/dev/null || true
            b="${u%.service}"
            systemctl show "$b.timer" -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSec --no-pager 2>/dev/null || true
          done

          echo '=== RECENT CALLER JOURNALS ==='
          for pat in s4g8r7f5j s4g8r7f5l s4g8r7f5k s4g8r7f5h s4g8r7f3a; do
            journalctl --since '-4 min' --no-pager -o short-iso 2>/dev/null | grep -i "$pat" | tail -n 100 || true
          done

          echo '=== OUTPUT FRESHNESS ==='
          find /var/www/z-os-alimi/api -maxdepth 1 -type f \( \
            -name '*s4g8r7f5j*' -o -name '*s4g8r7f5l*' -o -name '*s4g8r7f5k*' -o -name '*s4g8r7f5h*' -o -name '*s4g8r7f3a*' -o -name 's4f18c_shadow_tp_sl_close_writer_latest.json' \
          \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %f\n' 2>/dev/null | sort || true
          echo 'PASS_LEGACY_CALLER_OWNER_MAP_READ_ONLY'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
