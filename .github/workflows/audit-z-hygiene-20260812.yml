name: cleanup Z dead display restart 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Remove only proven dead display restart side-effect
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          EXPECT=/home/z/zel-production-releases/373ea890530a46d0b04da6414462e6c3873e5498
          CURRENT="$(readlink -f /home/z/zel-production-current)"
          test "$CURRENT" = "$EXPECT"
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active

          SCRIPT=/usr/local/bin/zel_s4g8r7f3a_state_aware_shadow_wakeup_router.py
          TIMER=zel-s4g8r7f3a-state-aware-shadow-wakeup-router.timer
          DEAD_SERVICE=zel-s4g8r4-zero-epoch-q4-display-mirror.service
          DEAD_TIMER=zel-s4g8r4-zero-epoch-q4-display-mirror.timer
          OLD='DISPLAY_UNIT="zel-s4g8r4-zero-epoch-q4-display-mirror.service"'
          NEW='DISPLAY_UNIT=""  # CLEANUP_20260812: retired dead display side-effect; production display projection is no longer owned here'

          test -f "$SCRIPT"
          test "$(grep -Fxc "$OLD" "$SCRIPT")" = 1
          test "$(systemctl is-active "$DEAD_TIMER" || true)" = inactive
          test "$(systemctl is-enabled "$DEAD_TIMER" || true)" = disabled
          test "$(grep -RsnE 'zel-s4g8r4-zero-epoch-q4-display-mirror|s4g8r4_zero_epoch_q4_display_mirror|s4g8r7d8_display_active_open_priority_mirror|s4g8r7f5p5_canonical_projection_single_writer' /home/z/zel-production-current 2>/dev/null | wc -l)" = 0
          test ! -e /usr/local/bin/zel_s4g8r7d8_display_active_open_priority_mirror.py
          test ! -e /usr/local/bin/zel_s4g8r7f5p5_canonical_projection_single_writer.py

          mkdir -p /home/z/z/rollback/hygiene-20260812
          cp -a "$SCRIPT" /home/z/z/rollback/hygiene-20260812/zel_s4g8r7f3a_state_aware_shadow_wakeup_router.py.pre_display_cleanup
          PRE_SHA="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          PRE_MTIME="$(stat -c %Y /var/www/z-os-alimi/api/s4g8r7f3a_state_aware_shadow_wakeup_router_latest.json)"
          PRE_FAILS="$(journalctl -u "$DEAD_SERVICE" --since '-60 min' --no-pager 2>/dev/null | grep -c 'Failed to start' || true)"

          systemctl stop "$TIMER"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/usr/local/bin/zel_s4g8r7f3a_state_aware_shadow_wakeup_router.py')
          old='DISPLAY_UNIT="zel-s4g8r4-zero-epoch-q4-display-mirror.service"'
          new='DISPLAY_UNIT=""  # CLEANUP_20260812: retired dead display side-effect; production display projection is no longer owned here'
          text=p.read_text()
          if text.count(old) != 1:
              raise SystemExit('EXACT_DISPLAY_UNIT_COUNT_MISMATCH')
          p.write_text(text.replace(old,new,1))
          PY
          python3 -m py_compile "$SCRIPT"
          test "$(grep -Fxc "$OLD" "$SCRIPT" || true)" = 0
          test "$(grep -Fxc "$NEW" "$SCRIPT")" = 1
          systemctl reset-failed "$DEAD_SERVICE" || true
          systemctl start "$TIMER"
          test "$(systemctl is-active "$TIMER")" = active

          ok=0
          for _ in $(seq 1 15); do
            sleep 2
            POST_MTIME="$(stat -c %Y /var/www/z-os-alimi/api/s4g8r7f3a_state_aware_shadow_wakeup_router_latest.json)"
            if [ "$POST_MTIME" -gt "$PRE_MTIME" ]; then ok=1; break; fi
          done
          test "$ok" = 1
          sleep 12
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active
          test "$(systemctl is-active "$DEAD_TIMER" || true)" = inactive
          test "$(systemctl is-enabled "$DEAD_TIMER" || true)" = disabled
          POST_FAILS="$(journalctl -u "$DEAD_SERVICE" --since '-60 min' --no-pager 2>/dev/null | grep -c 'Failed to start' || true)"
          test "$POST_FAILS" = "$PRE_FAILS"
          POST_SHA="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          printf 'PASS_DEAD_DISPLAY_RESTART_REMOVED pre_sha=%s post_sha=%s fail_count=%s\n' "$PRE_SHA" "$POST_SHA" "$POST_FAILS"
          systemctl show "$TIMER" -p ActiveState -p UnitFileState -p LastTriggerUSec --no-pager
          systemctl show "$DEAD_SERVICE" -p ActiveState -p SubState -p Result --no-pager
          stat -c '%y %s %n' /var/www/z-os-alimi/api/s4g8r7f3a_state_aware_shadow_wakeup_router_latest.json
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
