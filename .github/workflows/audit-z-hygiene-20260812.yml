name: audit Z display consumers 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prove display path consumers read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          U=zel-s4g8r4-zero-epoch-q4-display-mirror.service
          T=zel-s4g8r4-zero-epoch-q4-display-mirror.timer
          echo '=== BASELINE ==='
          readlink -f /home/z/zel-production-current
          systemctl is-active zel-production-paper-loop-v1.service
          echo '=== TIMER ==='
          systemctl cat "$T" 2>/dev/null || true
          systemctl show "$T" -p ActiveState -p UnitFileState -p LastTriggerUSec -p NextElapseUSecRealtime -p Triggers --no-pager 2>/dev/null || true
          echo '=== ACTIVE CALLERS EXACT ==='
          grep -RsnF "$U" /etc/systemd/system /usr/lib/systemd/system /usr/local/bin 2>/dev/null | grep -vE '\.DEAD_|\.bak\.' || true
          echo '=== FULL PRODUCTION REFERENCES ==='
          grep -RsnE 'zel-s4g8r4-zero-epoch-q4-display-mirror|s4g8r4_zero_epoch_q4_display_mirror|s4g8r7d8_display_active_open_priority_mirror|s4g8r7f5p5_canonical_projection_single_writer|s4g8r7f5p5_d8_canonical_projection_wrapper' /home/z/zel-production-current 2>/dev/null | head -n 300 || true
          echo '=== WEB/API REFERENCES ==='
          grep -RsnE 's4g8r4_zero_epoch_q4_display_mirror|s4g8r7d8_display_active_open_priority_mirror|s4g8r7f5p5_canonical_projection_single_writer' /var/www/z-os-alimi --exclude='*.jsonl' --exclude='*.bak*' --exclude='*.tmp*' 2>/dev/null | head -n 300 || true
          echo '=== MISSING CHILDREN ==='
          for p in /usr/local/bin/zel_s4g8r7d8_display_active_open_priority_mirror.py /usr/local/bin/zel_s4g8r7f5p5_canonical_projection_single_writer.py; do
            if [ -e "$p" ]; then echo EXISTS:$p; else echo MISSING:$p; fi
          done
          echo '=== RECENT FAIL COUNT ==='
          journalctl -u "$U" --since '-60 min' --no-pager 2>/dev/null | grep -c 'Failed to start' || true
          echo PASS_DISPLAY_CONSUMER_PROOF_READ_ONLY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
