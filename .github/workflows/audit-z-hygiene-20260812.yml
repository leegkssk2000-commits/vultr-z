name: audit Z dead side-effects 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prove dead side-effect targets and current consumers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== MASTER/PAPER BASELINE ==='
          readlink -f /home/z/zel-production-current
          systemctl is-active zel-production-paper-loop-v1.service

          echo '=== DEAD TARGET DEFINITIONS ==='
          for u in zel-s4f18c-shadow-close-writer.service zel-s4g8r4-zero-epoch-q4-display-mirror.service zel-h2e9s4f2-shadow-close-engine.service; do
            echo "--- $u ---"
            systemctl cat "$u" 2>/dev/null || true
            systemctl show "$u" -p ActiveState -p SubState -p Result -p UnitFileState -p TriggeredBy -p RequiredBy -p WantedBy --no-pager 2>/dev/null || true
          done

          echo '=== TARGET EXECSTART FILE EXISTENCE ==='
          python3 - <<'PY'
          import shlex,subprocess,json
          from pathlib import Path
          units=['zel-s4f18c-shadow-close-writer.service','zel-s4g8r4-zero-epoch-q4-display-mirror.service','zel-h2e9s4f2-shadow-close-engine.service']
          rows=[]
          for u in units:
              cp=subprocess.run(['systemctl','show',u,'-p','ExecStart','--value'],capture_output=True,text=True)
              text=cp.stdout.strip()
              paths=[]
              for token in text.replace('{',' ').replace('}',' ').replace(';',' ').split():
                  if token.startswith('/'):
                      token=token.rstrip(';')
                      paths.append({'path':token,'exists':Path(token).exists()})
              rows.append({'unit':u,'execstart':text,'paths':paths})
          print(json.dumps(rows,sort_keys=True))
          PY

          echo '=== CURRENT PRODUCTION CONSUMERS BY UNIT NAME ==='
          grep -RsnE 'zel-s4f18c-shadow-close-writer|zel-s4g8r4-zero-epoch-q4-display-mirror|zel-h2e9s4f2-shadow-close-engine' \
            /home/z/zel-production-current/backend /home/z/zel-production-current/config 2>/dev/null || true

          echo '=== CURRENT PRODUCTION CONSUMERS BY OUTPUT FILE ==='
          grep -RsnE 's4f18c_shadow_tp_sl_close_writer_latest|zero_epoch_q4|display_mirror|h2e9s4f2' \
            /home/z/zel-production-current/backend /home/z/zel-production-current/config 2>/dev/null || true

          echo '=== ACTIVE CALLER SNIPPETS ==='
          nl -ba /usr/local/bin/zel_s4g8r7f5k_clean_upstream_price_close_bind.py | sed -n '400,435p'
          nl -ba /usr/local/bin/zel_s4g8r7f3a_state_aware_shadow_wakeup_router.py | sed -n '1,35p;105,130p;235,270p'

          echo '=== ACTIVE CALLER UNIT/TIMER ==='
          for t in zel-s4g8r7f5k-clean-upstream-price-close-bind.timer zel-s4g8r7f3a-state-aware-shadow-wakeup-router.timer; do
            systemctl show "$t" -p ActiveState -p UnitFileState -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager
          done

          echo '=== OUTPUT FRESHNESS ==='
          stat -c '%y %s %n' \
            /var/www/z-os-alimi/api/s4g8r7f5k_clean_upstream_price_close_bind_latest.json \
            /var/www/z-os-alimi/api/s4g8r7f3a_state_aware_shadow_wakeup_router_latest.json \
            /var/www/z-os-alimi/api/s4f18c_shadow_tp_sl_close_writer_latest.json 2>/dev/null || true
          echo 'PASS_DEAD_SIDE_EFFECT_AUDIT_READ_ONLY'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
