name: audit Z hygiene 20260812

on:
  push:
    branches: [zel-hygiene-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zel-hygiene-audit-20260812
          persist-credentials: false
          fetch-depth: 1

      - name: Classify scheduled workflows and AI providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          out=[]
          for p in sorted(Path('.github/workflows').glob('*.y*ml')):
              t=p.read_text(errors='replace')
              if not re.search(r'(?m)^\s*schedule\s*:',t):
                  continue
              low=t.lower()
              flags={
                'ssh_vps': ('vps_host' in low or 'ssh -' in low),
                'gemini': ('gemini_api_key' in low or 'generativelanguage.googleapis.com' in low),
                'openai': ('openai_api_key' in low or 'api.openai.com' in low),
                'contents_write': bool(re.search(r'contents\s*:\s*write',low)),
                'git_push': ('git push' in low),
                'systemctl': ('systemctl' in low),
                'home_z_write_surface': ('/home/z/' in low),
              }
              crons=re.findall(r"cron\s*:\s*['\"]?([^'\"\n]+)",t)
              out.append({'path':str(p),'cron':crons,**flags})
          print('SCHEDULE_RISK='+json.dumps(out,sort_keys=True))
          refs={'gemini':[],'openai':[],'codex':[]}
          for p in list(Path('backend').rglob('*'))+list(Path('config').rglob('*'))+list(Path('.github/workflows').rglob('*')):
              if not p.is_file(): continue
              try: low=p.read_text(errors='replace').lower()
              except Exception: continue
              if 'gemini_api_key' in low or 'generativelanguage.googleapis.com' in low: refs['gemini'].append(str(p))
              if 'openai_api_key' in low or 'api.openai.com' in low: refs['openai'].append(str(p))
              if 'codex' in low: refs['codex'].append(str(p))
          print('AI_PROVIDER_REFS='+json.dumps({k:sorted(set(v)) for k,v in refs.items()},sort_keys=True))
          PY
          echo '=== CANONICAL PRODUCTION AI CALLS ==='
          grep -RsnE 'GEMINI_API_KEY|OPENAI_API_KEY|generativelanguage\.googleapis\.com|api\.openai\.com' backend/production config/zel_production* .github/workflows/zel-production-* 2>/dev/null | head -n 220 || true

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect failed unit dependency safety
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          units=(
            zel-q4r3-candidate-skill-annotator.service
            zel-q4r3-chart-current-binder.service
            zel-q4r3-recent-trace-unifier.service
            zel-s4f18c-shadow-close-writer.service
            zel-s4g8r4-zero-epoch-q4-display-mirror.service
          )
          for u in "${units[@]}"; do
            b="${u%.service}"
            echo "=== UNIT $u ==="
            printf 'service_active='; systemctl is-active "$u" 2>/dev/null || true
            printf 'service_enabled='; systemctl is-enabled "$u" 2>/dev/null || true
            printf 'timer_active='; systemctl is-active "$b.timer" 2>/dev/null || true
            printf 'timer_enabled='; systemctl is-enabled "$b.timer" 2>/dev/null || true
            echo '-- service definition --'
            systemctl cat "$u" 2>/dev/null || true
            echo '-- timer definition --'
            systemctl cat "$b.timer" 2>/dev/null || true
            echo '-- reverse dependencies --'
            systemctl list-dependencies --reverse --all "$u" 2>/dev/null | head -n 80 || true
            echo '-- recent journal --'
            journalctl -u "$u" -n 18 --no-pager -o short-iso 2>/dev/null || true
          done
          echo '=== REPO/RUNTIME REFERENCES TO FAILED OWNERS ==='
          grep -RsnE 'candidate-skill-annotator|chart-current-binder|recent-trace-unifier|s4f18c-shadow-close-writer|zero-epoch-q4-display-mirror' \
            /home/z/zel-production-current /etc/systemd/system 2>/dev/null | head -n 260 || true
          echo '=== PRODUCTION CURRENT IDENTITY ==='
          readlink -f /home/z/zel-production-current 2>/dev/null || true
          ls -ld /home/z/zel-production-current 2>/dev/null || true
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
