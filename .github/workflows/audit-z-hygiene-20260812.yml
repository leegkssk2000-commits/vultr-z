name: wire OpenAI critic 20260812

on:
  push:
    branches:
      - zel-hygiene-audit-20260812
    paths:
      - .github/workflows/audit-z-hygiene-20260812.yml
      - tools/wire_openai_critic_20260812.py
      - backend/production/zel_production_openai_critic_v1.py
      - config/zel_production_ai_proposal_layer_v1.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@v4
        with:
          ref: zel-hygiene-audit-20260812
          fetch-depth: 0

      - name: Wire critic into Gemini proposal path
        run: |
          set -euo pipefail
          python3 tools/wire_openai_critic_20260812.py

      - name: Compile and local fail-closed contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            backend/production/zel_production_openai_critic_v1.py \
            backend/production/zel_production_ai_proposal_layer_v1.py \
            tools/wire_openai_critic_20260812.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from backend.production.zel_production_openai_critic_v1 import (
              SCHEMA,
              fail_closed_receipt,
              review_or_hold,
              validate_critic_config,
              validate_receipt,
          )

          cfg = validate_critic_config({
              "enabled": True,
              "required": True,
              "model_env": "OPENAI_MODEL",
              "default_model": "gpt-5-mini",
              "timeout_sec": 60,
              "max_output_tokens": 1200,
              "allowed_decisions": ["PASS", "HOLD", "REJECT"],
          })
          assert cfg["required"] is True
          policy = json.loads(Path("config/zel_production_ai_proposal_layer_v1.json").read_text())
          assert policy["openai_critic"]["enabled"] is True
          assert policy["openai_critic"]["required"] is False
          receipt = validate_receipt({
              "schema_version": SCHEMA,
              "decision": "PASS",
              "causal_critique": "No material internal causal contradiction found in the bounded proposal.",
              "falsification_test": "Reject if deterministic out-of-sample evidence contradicts the proposed mechanism.",
              "blocker_codes": [],
          })
          assert receipt["decision"] == "PASS"
          _, hold = review_or_hold("", "gpt-5-mini", {"status": "PASS", "proposals": [{"family_id": "x"}]})
          assert hold["decision"] == "HOLD"
          assert fail_closed_receipt("OPENAI_API_KEY_MISSING")["decision"] == "HOLD"
          print("PASS_OPENAI_CRITIC_LOCAL_FAIL_CLOSED_OPTIONAL_POLICY")
          PY
          grep -F 'critic_provider' backend/production/zel_production_ai_proposal_layer_v1.py
          grep -F 'OPENAI_API_KEY' backend/production/zel_production_ai_proposal_layer_v1.py

      - name: Commit bounded integration
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/production/zel_production_ai_proposal_layer_v1.py; then
            echo OPENAI_CRITIC_ALREADY_WIRED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/production/zel_production_ai_proposal_layer_v1.py
          git commit -m 'feat: wire OpenAI critic into Gemini proposal path [openai-critic-wired]'
          git push origin HEAD:zel-hygiene-audit-20260812

      - name: Authenticated OpenAI critic smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          python3 - <<'PY'
          import os
          from backend.production.zel_production_openai_critic_v1 import call_openai_critic

          model = os.environ.get("OPENAI_MODEL", "").strip() or "gpt-5-mini"
          try:
              used_model, receipt = call_openai_critic(
                  os.environ["OPENAI_API_KEY"],
                  model,
                  {
                      "status": "PASS",
                      "proposals": [
                          {
                              "proposal_type": "NEW_ECONOMIC_FAMILY",
                              "family_id": "synthetic_auth_smoke",
                              "economic_mechanism": "A bounded synthetic hypothesis used only to verify critic authentication and schema transport.",
                              "required_sources": ["funding"],
                              "causal_reason": "Transport-only smoke; no profitability claim is made.",
                              "falsification_test": "Reject the synthetic hypothesis if its stated causal relation is absent in deterministic held-out evidence.",
                              "expected_horizon": "natural market horizon",
                          }
                      ],
                  },
                  timeout_sec=60,
                  max_output_tokens=1200,
              )
          except RuntimeError as exc:
              msg = str(exc)
              quota = (
                  "OPENAI_CRITIC_HTTP_429" in msg
                  and ("insufficient_quota" in msg or "credit_balance_exhausted" in msg or "no credits remaining" in msg.lower())
              )
              if quota:
                  print("HOLD_OPENAI_QUOTA_UNAVAILABLE critic_optional=true")
                  raise SystemExit(0)
              raise
          assert receipt["decision"] in {"PASS", "HOLD", "REJECT"}
          print(f"PASS_OPENAI_AUTHENTICATED_SMOKE model={used_model} decision={receipt['decision']}")
          PY
