name: C63 Daily EMA21 Public Tip V1
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/*c63_daily_ema21*.py'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-daily-ema21-tip-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*c63_daily_ema21*.py'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-daily-ema21-tip-v1.yml'
permissions:
  contents: read
jobs:
  verify-saved-daily-tip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical full-checkout validation
        run: npm run --prefix frontend/z-os-app-source validate
      - name: Artificial causality and parent regressions
        run: python3 -B -m unittest backend.research.rebuild.test_c63_daily_ema21_entry_v1 backend.research.rebuild.test_m1_er_range_rescue_v1 backend.research.rebuild.test_m1_er14_entry_v1 backend.research.rebuild.test_chart_mechanism_execution_v1 -v
      - name: Immutable source-bound saved economics and counterexamples
        working-directory: research/development_evidence/C63_DAILY_EMA21_HORTON_TIP_AFTER_PR1241_V1
        run: |
          python3 -B verify_saved.py --full-repository --derived-sha256 e271f2bf7b0e72e9a6e779e789f9ce839b6412038c27af7b5d696c2658a6ef3b
          python3 -B -m unittest test_saved -v
          git diff --exit-code
