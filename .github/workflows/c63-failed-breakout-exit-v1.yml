name: C63 failed breakout exit finite comparison
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/*c63_failed_breakout*.py'
      - 'research/development_evidence/C63_FAILED_BREAKOUT_EXIT_AFTER_PR1233_V1/**'
      - '.github/workflows/c63-failed-breakout-exit-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c63-failed-breakout-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  finite-four:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      B: research/development_evidence/C63_FAILED_BREAKOUT_EXIT_AFTER_PR1233_V1
      BRANCH: research/c63-failed-breakout-exit-after-pr1233-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Exact one-owner new-scope dispatch
        id: scope
        env:
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" = 1 ] && [ "$HEAD_REF" = "$BRANCH" ] && [ "$(git log -1 --format=%s)" = 'RUN_C63_EXIT_FIXED_FULL_FOUR_20260909' ] && [ ! -f "$B/SPEC.json" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Full-checkout canonical and artificial preflight
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          mkdir -p out/c63-exit
          python -B -m unittest backend.research.rebuild.test_c63_failed_breakout_exit_v1 backend.research.rebuild.test_m1_er_range_rescue_v1 backend.research.rebuild.test_chart_mechanism_execution_v1 -v > out/c63-exit/SYNTHETIC_QA.log 2>&1
          cat out/c63-exit/SYNTHETIC_QA.log
          python -m py_compile backend/research/rebuild/c63_failed_breakout_study_v1.py
      - uses: actions/download-artifact@v4
        if: steps.scope.outputs.execute == 'true'
        with:
          name: kr3-profit-zone-34282003231
          run-id: 34282003231
          github-token: ${{ github.token }}
          path: out/parent51
      - name: Freeze then remote claim before four first applications
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name c63-failed-breakout-evaluator
          git config user.email actions@users.noreply.github.com
          persist() {
            git add "$B"
            python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not p.startswith(os.environ['B']+'/') for p in names):raise SystemExit('UNSCOPED_WRITE')
          PY
            git diff --cached --quiet || git commit -m "$1 [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          }
          python -m backend.research.rebuild.c63_failed_breakout_study_v1 freeze --inputs out/parent51/inputs
          persist 'research: freeze C63 failed-breakout exit before outcomes'
          for per in DEV2025 SEEN2026; do
            for view in FIXED FULL; do
              python -m backend.research.rebuild.c63_failed_breakout_study_v1 reserve --period "$per" --view "$view"
              persist "research: reserve C63 exit $per $view before execution"
              remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
              test "$remote" = "$(git rev-parse HEAD)"
              timeout 180 python -u -m backend.research.rebuild.c63_failed_breakout_study_v1 execute --inputs out/parent51/inputs --period "$per" --view "$view" --remote-sha "$remote"
              persist "research: preserve C63 exit $per $view result"
            done
          done
          python -m backend.research.rebuild.c63_failed_breakout_study_v1 summarize
          persist 'research: summarize C63 direct and chronological exit effects'
      - name: Preserve finite checkpoint without retry
        if: always() && steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name c63-failed-breakout-evaluator
          git config user.email actions@users.noreply.github.com
          git add "$B"
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve C63 exit checkpoint without retry [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p out/c63-exit
          git archive HEAD "$B" backend/research/rebuild/c63_failed_breakout_exit_v1.py backend/research/rebuild/test_c63_failed_breakout_exit_v1.py backend/research/rebuild/c63_failed_breakout_study_v1.py .github/workflows/c63-failed-breakout-exit-v1.yml > out/c63-exit/code-results.tar
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.execute == 'true'
        with:
          name: c63-failed-breakout-${{ github.run_id }}
          path: out/c63-exit
          retention-days: 90
