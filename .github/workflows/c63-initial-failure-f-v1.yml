name: C63 initial failure F
on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-initial-failure-f-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-initial-failure-f-v1.yml'
permissions:
  contents: read
jobs:
  verify-saved-f:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Canonical and focused synthetic verification
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.rebuild.test_c63_initial_failure_f_v1 backend.research.rebuild.test_c63_initial_failure_f_verify_v1 -v
      - name: Saved raw-to-cost-to-metric and symmetric attribution only
        run: |
          python3 -B -m backend.research.rebuild.c63_initial_failure_f_verify_v1
          git diff --exit-code
