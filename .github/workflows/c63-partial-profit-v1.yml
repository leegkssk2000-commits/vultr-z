name: C63 one-third partial saved comparison
on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-partial-profit-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-partial-profit-v1.yml'
permissions:
  contents: read
jobs:
  verify-saved-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical validation and artificial tests only
        run: |
          set -euo pipefail
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.rebuild.test_c63_partial_profit_v1 backend.research.rebuild.test_m1_er_range_rescue_v1 backend.research.rebuild.test_chart_mechanism_execution_v1 -v
      - name: Immutable completed evidence and parent pins, no market replay
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          b=root/'research/development_evidence/C63_PARTIAL_REALIZATION_AFTER_PR1238_V1'
          parent=root/'research/development_evidence/M1_ER_RANGE_RESCUE_AFTER_PR1232_V1'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(b/'EVIDENCE_HASHES.json')=='b9c5ae90c545c932f7e8f26705af20b8d19f9631537bf1cddc6f3e9ad0b227cf'
          for name,digest in json.loads((b/'EVIDENCE_HASHES.json').read_bytes()).items():
              assert sha(b/name)==digest,name
          spec=json.loads((b/'SPEC.json').read_bytes())
          for per,files in spec['parent_results_sha256'].items():
              for name,digest in files.items():assert sha(parent/per/name)==digest
          for name,digest in spec['source_files_sha256'].items():assert sha(root/name)==digest,name
          budget=json.loads((b/'BUDGET.json').read_bytes())
          assert (budget['cumulative_actual'],budget['cumulative_actual_evaluations'])==(65,112)
          slot=budget['c63_partial_profit_allocation']
          assert slot['started']==slot['completed']==slot['reserved']==2
          assert slot['remaining']==slot['failed']==0
          summary=json.loads((b/'SUMMARY.json').read_bytes())
          assert summary['status']=='REJECT_KEEP_C63' and summary['formal_credit']==0
          print('SAVED_PINS_PASS; TWO_COMPLETED_APPLICATIONS; NO_REPLAY_NO_PROVIDER_NO_DISPATCH')
          PY
          git diff --exit-code
