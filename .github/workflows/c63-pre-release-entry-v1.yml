name: C63 Pre-release Entry Finite Comparison
on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-pre-release-entry-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-pre-release-entry-v1.yml'
permissions:
  contents: read
jobs:
  verify-completed-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical validation
        run: npm run --prefix frontend/z-os-app-source validate
      - name: Artificial entry and lifecycle boundaries
        run: python3 -B -m unittest backend.research.rebuild.test_c63_pre_release_pullback_v1 backend.research.rebuild.test_m1_er_range_rescue_v1 backend.research.rebuild.test_chart_mechanism_execution_v1 -v
      - name: Independent original-source and saved accounting checks
        working-directory: research/development_evidence/C63_PRE_RELEASE_PULLBACK_ENTRY_V1
        run: |
          python3 -B verify_saved.py
          python3 -B -m unittest test_saved -v
          git diff --exit-code
