name: C63 R B20 protection
on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-r-b20-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/c63-r-b20-v1.yml'
permissions:
  contents: read
jobs:
  verify-saved-r-b20:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Canonical full checkout and focused synthetic regression
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.rebuild.test_c63_r_b20_v1 -v
      - name: Saved raw-to-cost-to-metric and attribution checks only
        run: |
          python3 -B -m backend.research.rebuild.c63_r_b20_verify_v1
          git diff --exit-code
