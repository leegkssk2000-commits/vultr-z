name: cleanup all ghost tmp diag workflows 20260813

on:
  push:
    branches:
      - zel-hygiene-audit-20260812
    paths:
      - .github/workflows/cleanup-all-ghost-tmp-diag-20260813.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable every active tmp/diag registration whose file is absent on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zel-all-ghost-tmp-diag-cleanup',
          }
          prefixes = ('.github/workflows/_tmp_', '.github/workflows/diag-')

          def req(url, method='GET'):
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as resp:
                      return resp.status, resp.read().decode('utf-8')
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode('utf-8', errors='replace')

          all_rows = []
          page = 1
          while True:
              status, body = req(f'https://api.github.com/repos/{repo}/actions/workflows?per_page=100&page={page}')
              if status != 200:
                  raise SystemExit(f'LIST_WORKFLOWS_FAILED:http={status}:page={page}')
              payload = json.loads(body)
              rows = payload.get('workflows') or []
              all_rows.extend(rows)
              if len(rows) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit('WORKFLOW_PAGINATION_GUARD')

          candidates = []
          for row in all_rows:
              path = str(row.get('path') or '')
              if not path.startswith(prefixes):
                  continue
              quoted = urllib.parse.quote(path, safe='/')
              status, _ = req(f'https://api.github.com/repos/{repo}/contents/{quoted}?ref=master')
              if status == 404:
                  candidates.append((int(row['id']), path, str(row.get('state') or '')))
              elif status != 200:
                  raise SystemExit(f'MASTER_PATH_CHECK_FAILED:{path}:http={status}')

          results = []
          for workflow_id, path, pre_state in candidates:
              meta_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}'
              status, body = req(meta_url)
              if status != 200:
                  raise SystemExit(f'META_FAILED:{workflow_id}:http={status}')
              meta = json.loads(body)
              if str(meta.get('path') or '') != path:
                  raise SystemExit(f'PATH_MISMATCH:{workflow_id}:{meta.get("path")}:{path}')
              if str(meta.get('state') or '') == 'active':
                  dstatus, _ = req(meta_url + '/disable', method='PUT')
                  if dstatus != 204:
                      raise SystemExit(f'DISABLE_FAILED:{workflow_id}:http={dstatus}')
              vstatus, vbody = req(meta_url)
              if vstatus != 200:
                  raise SystemExit(f'VERIFY_FAILED:{workflow_id}:http={vstatus}')
              post = json.loads(vbody)
              post_state = str(post.get('state') or '')
              if post_state == 'active':
                  raise SystemExit(f'STILL_ACTIVE:{workflow_id}:{path}')
              results.append({'id': workflow_id, 'path': path, 'pre': pre_state, 'post': post_state})

          print(json.dumps({
              'status': 'PASS_ALL_MASTER_MISSING_TMP_DIAG_DISABLED',
              'registry_total': len(all_rows),
              'ghost_candidate_count': len(candidates),
              'results': results,
          }, sort_keys=True))
          PY
