name: Codex Action Read-Only Smoke

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/codex-action-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-action-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-drain-noop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain stale queued smoke run
        run: echo 'QUEUE_DRAIN_NOOP'
