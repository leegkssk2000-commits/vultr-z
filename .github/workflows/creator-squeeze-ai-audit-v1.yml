name: Creator Squeeze Source AI Audit V1
on:
  pull_request:
    paths:
      - 'backend/research/benchmark/*creator_squeeze*'
      - 'research/development_evidence/CREATOR_SQUEEZE_AI_AFTER_PR1234_V1/**'
      - '.github/workflows/creator-squeeze-ai-audit-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/benchmark/*creator_squeeze*'
      - 'research/development_evidence/CREATOR_SQUEEZE_AI_AFTER_PR1234_V1/**'
      - '.github/workflows/creator-squeeze-ai-audit-v1.yml'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical checkout validation
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Offline budget authorization and source conformance
        run: |
          python3 -B -m unittest backend.research.benchmark.test_creator_squeeze_audit_v1 -v
          python3 -B -m backend.research.benchmark.creator_squeeze_audit_v1
          git diff --exit-code
  manual-two:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.id == 232057951 &&
      github.event.sender.id == 232057951 &&
      github.event.comment.body == 'APPROVE_CREATOR_SQUEEZE_AI a28acd21460ab4ebe51cda0005ebb0cc36c8372d0d9a2d21951ff12ce729d831'
    concurrency:
      group: creator-squeeze-ai-one-authorized-scope-v1
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preflight before the authenticated atomic reservation
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.benchmark.test_creator_squeeze_audit_v1 -v
      - name: Two finite source-only provider requests, no trading replay
        run: python3 -B -m backend.research.benchmark.creator_squeeze_audit_v1 --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-squeeze-ai-${{ github.run_id }}
          path: research/development_evidence/CREATOR_SQUEEZE_AI_AFTER_PR1234_V1
          retention-days: 90
