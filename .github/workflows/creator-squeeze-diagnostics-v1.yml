name: Creator Squeeze Failure Diagnostics V1
on:
  pull_request:
    paths:
      - 'backend/research/benchmark/*creator_squeeze*'
      - 'research/development_evidence/CREATOR_SQUEEZE_DIAGNOSTICS_AFTER_PR1236_V1/**'
      - '.github/workflows/creator-squeeze-diagnostics-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/benchmark/*creator_squeeze*'
      - 'research/development_evidence/CREATOR_SQUEEZE_DIAGNOSTICS_AFTER_PR1236_V1/**'
      - '.github/workflows/creator-squeeze-diagnostics-v1.yml'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical full-checkout validation and offline regressions
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.benchmark.test_creator_squeeze_audit_v1 backend.research.benchmark.test_creator_squeeze_reviewed_v1.ReviewTests backend.research.benchmark.test_creator_squeeze_transport_v1 backend.research.benchmark.test_creator_squeeze_diagnostics_v1 -v
          git diff --exit-code
  diagnose-no-network:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.id == 232057951 &&
      github.event.sender.id == 232057951 &&
      github.event.comment.body == 'DIAGNOSE_CREATOR_SQUEEZE_NO_NETWORK 34361265053'
    concurrency:
      group: creator-squeeze-ai-one-authorized-scope-v1
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve exact reviewed diagnostic merge without provider secrets
        id: reviewed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert e['repository']['full_name']=='leegkssk2000-commits/vultr-z'
          assert e['sender']['id']==e['comment']['user']['id']==232057951
          assert e['comment']['author_association']=='OWNER' and e['action']=='created'
          assert e['comment']['body']=='DIAGNOSE_CREATOR_SQUEEZE_NO_NETWORK 34361265053'
          assert e['issue'].get('pull_request')
          base='https://api.github.com/repos/leegkssk2000-commits/vultr-z'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=25) as response:return json.load(response)
          pr=get('/pulls/'+str(e['issue']['number']))
          assert pr['merged'] and pr['head']['ref']=='research/creator-squeeze-diagnostics-after-pr1236-v1'
          assert pr['head']['repo']['full_name']==e['repository']['full_name'] and pr['base']['ref']=='master'
          merge=pr['merge_commit_sha'];assert re.fullmatch('[a-f0-9]{40}',merge)
          path='/contents/.github/workflows/creator-squeeze-diagnostics-v1.yml?ref='
          assert get(path+merge)['sha']==get(path+os.environ['GITHUB_WORKFLOW_SHA'])['sha'],'WORKFLOW_CHANGED_SINCE_REVIEW'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('merge_sha='+merge+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.reviewed.outputs.merge_sha }}
          persist-credentials: false
      - name: Exact-merge preflight without provider secrets
        env:
          APPROVED_MERGE: ${{ steps.reviewed.outputs.merge_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_MERGE"
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.benchmark.test_creator_squeeze_diagnostics_v1 -v
      - uses: actions/checkout@v4
        with:
          ref: '735cdefad4310fc9c1d7923571f1ef3ca9901021'
          path: _prior
          sparse-checkout: research/development_evidence/CREATOR_SQUEEZE_AI_AFTER_PR1234_V1
          persist-credentials: false
      - name: Offline credential shape and pinned historical receipt only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 -B -m backend.research.benchmark.creator_squeeze_diagnostics_v1 --saved-dir _prior/research/development_evidence/CREATOR_SQUEEZE_AI_AFTER_PR1234_V1 --output _diagnostic/DIAGNOSTIC.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-squeeze-diagnostic-${{ github.run_id }}
          path: _diagnostic
          if-no-files-found: warn
          retention-days: 90
