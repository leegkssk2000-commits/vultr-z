name: diag cold state consumers 20260813

on:
  push:
    branches:
      - zel-hygiene-audit-20260812
    paths:
      - .github/workflows/diag-cold-state-consumers-20260813.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only consumer trace
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /home/z/zel-production-current)"
          test -d "$CURRENT"
          test "$(systemctl is-active zel-production-paper-loop-v1.service)" = active
          for name in \
            production_family_paper_evidence_producer_state_v1.json \
            production_family_survivor_verifier_state_v1.json \
            production_survivor_candidates_v1.json \
            production_survivor_pool_v1.json \
            production_survivor_authority_activation_v1.json
          do
            echo "=== $name ==="
            grep -RsnF "$name" "$CURRENT" /etc/systemd/system /usr/local/bin /var/www/z-os-alimi 2>/dev/null \
              | grep -vE '/\.git/|\.bak|rollback|__pycache__' \
              | head -n 80 || true
          done
          echo PASS_READ_ONLY_COLD_STATE_CONSUMER_TRACE
          REMOTE
