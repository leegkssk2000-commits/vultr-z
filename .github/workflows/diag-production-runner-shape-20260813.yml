name: diag production runner shape 20260813

on:
  push:
    branches: [zel-hygiene-audit-20260812]
    paths: ['.github/workflows/diag-production-runner-shape-20260813.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect production runner read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== CURRENT ==='
          readlink -f /home/z/zel-production-current
          echo '=== UNIT ==='
          systemctl cat zel-production-paper-loop-v1.service
          echo '=== STATUS ==='
          systemctl show zel-production-paper-loop-v1.service -p MainPID -p ExecStart -p FragmentPath -p ActiveState -p SubState
          echo '=== PROCESS ==='
          pid="$(systemctl show zel-production-paper-loop-v1.service -p MainPID --value)"
          test "$pid" -gt 0
          tr '\0' ' ' < "/proc/$pid/cmdline"; echo
          echo '=== PROC CWD/EXE ==='
          readlink -f "/proc/$pid/cwd" || true
          readlink -f "/proc/$pid/exe" || true
          echo '=== UNIT OVERRIDES ==='
          systemctl show zel-production-paper-loop-v1.service -p DropInPaths -p Environment
          echo PASS_READ_ONLY_PRODUCTION_RUNNER_SHAPE
          REMOTE
