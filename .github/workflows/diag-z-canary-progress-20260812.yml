name: diag ZEL canary progress 20260812

on:
  push:
    branches: [diag-z-canary-progress-20260812]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Verify PAPER loop ownership
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          echo '=== UNIT_SHOW ==='
          systemctl show zel-production-paper-loop-v1.service \
            -p ActiveState -p SubState -p MainPID -p FragmentPath -p ExecStart --no-pager
          echo '=== UNIT_CAT ==='
          systemctl cat zel-production-paper-loop-v1.service --no-pager
          pid="$(systemctl show zel-production-paper-loop-v1.service -p MainPID --value)"
          echo '=== MAIN_PID_CMDLINE ==='
          if [ -n "$pid" ] && [ "$pid" != "0" ] && [ -r "/proc/$pid/cmdline" ]; then
            tr '\0' ' ' < "/proc/$pid/cmdline"; echo
          else
            echo 'NO_RUNNING_MAINPID'
          fi
          echo '=== TARGET_PATH_REFERENCES ==='
          grep -Rsn --exclude-dir='__pycache__' -E \
            'production_ai_admission_observations_v1\.ndjson|production_family_paper_canary_runner_state_v1\.json|zel_production_ai_admission_executor_v3|zel_production_family_paper_canary_runner_v2' \
            "$ROOT/backend" "$ROOT/config" 2>/dev/null | head -n 160 || true
          echo '=== PAPER_LOOP_FILES ==='
          find "$ROOT" -maxdepth 4 -type f \( -name '*paper*loop*v1*.py' -o -name '*production*loop*.py' \) -print | sort
          echo '=== PAPER_LOOP_SOURCE ==='
          for f in $(find "$ROOT" -maxdepth 4 -type f \( -name '*paper*loop*v1*.py' -o -name '*production*loop*.py' \) -print | sort); do
            echo "--- $f ---"
            sed -n '1,280p' "$f"
          done
          echo '=== CANARY_STATE_COMPACT ==='
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/z/z/ledger/production_family_paper_canary_runner_state_v1.json')
          s=json.loads(p.read_text()) if p.is_file() else {}
          out={'state':s.get('state'),'active_count':s.get('active_count'),'pass_count':s.get('pass_count'),'reject_count':s.get('reject_count'),'canaries':[]}
          for key,m in sorted((s.get('canaries') or {}).items()):
              if not isinstance(m,dict): continue
              out['canaries'].append({'key':key,'family_id':m.get('family_id'),'status':m.get('status'),'observation_count':m.get('observation_count'),'trade_count':m.get('trade_count'),'symbol_trade_counts':m.get('symbol_trade_counts'),'updated_at_ms':m.get('updated_at_ms')})
          print(json.dumps(out,sort_keys=True))
          PY
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
