name: diag ZEL canary progress 20260812

on:
  push:
    branches: [diag-z-canary-progress-20260812]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Locate V3 and canary owners
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== SYSTEMD_EXACT_REFERENCES ==='
          grep -Rsn -E 'zel_production_ai_admission_executor_v3|zel_production_family_paper_canary_runner_v2|production_ai_admission_observations_v1\.ndjson|production_family_paper_canary_runner_state_v1\.json' \
            /etc/systemd/system /usr/lib/systemd/system 2>/dev/null || true
          echo '=== CRON_EXACT_REFERENCES ==='
          grep -Rsn -E 'zel_production_ai_admission_executor_v3|zel_production_family_paper_canary_runner_v2|production_ai_admission_observations_v1\.ndjson|production_family_paper_canary_runner_state_v1\.json' \
            /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/crontab 2>/dev/null || true
          echo '=== LIVE_PROCESS_REFERENCES ==='
          ps -eo pid,ppid,lstart,args --sort=pid | grep -E 'zel_production_ai_admission_executor_v3|zel_production_family_paper_canary_runner_v2|zel_production_paper_runner_v1|zel_production_paper_loop_v1' | grep -v grep || true
          echo '=== PAPER_RUNNER_EXACT_CALLS ==='
          grep -nE 'admission|canary|survivor|paper_loop' /home/z/zel-production-current/backend/production/zel_production_paper_runner_v1.sh || true
          echo '=== JOURNAL_200225_200235_UTC ==='
          journalctl --since '2026-08-12 22:02:20' --until '2026-08-12 22:02:40' --no-pager -o short-iso 2>/dev/null \
            | grep -Ei 'admission|canary|paper|python|zel' | tail -n 160 || true
          echo '=== OBS_HISTORY_STAT ==='
          stat -c 'mtime=%y size=%s inode=%i' /home/z/z/ledger/production_ai_admission_observations_v1.ndjson
          echo '=== CANARY_HISTORY_STAT ==='
          find /home/z/z/ledger/production_family_paper_canary_history_v1 -maxdepth 1 -type f -name '*.ndjson' -printf '%f %TY-%Tm-%Td %TH:%TM:%TS %s\n' | sort
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
