name: diag ZEL canary progress 20260812

on:
  push:
    branches: [diag-z-canary-progress-20260812]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Trace admission writer timestamp
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== TARGET_JOURNAL ==='
          journalctl --since '2026-08-12 22:02:26' --until '2026-08-12 22:02:32' --no-pager -o short-iso 2>/dev/null \
            | grep -Ei 'admission|executor_version|funding_volume|canary|economic_candidate|history_accumulating|history_insufficient' || true
          echo '=== ALL_PROCESS_JOURNAL_WINDOW ==='
          journalctl --since '2026-08-12 22:02:27' --until '2026-08-12 22:02:30' --no-pager -o short-iso 2>/dev/null \
            | grep -E 'bash\[[0-9]+\]|python3?\[[0-9]+\]|sshd\[[0-9]+\]' | head -n 220 || true
          echo '=== FILE_TIMES ==='
          stat -c 'obs mtime=%y ctime=%z size=%s' /home/z/z/ledger/production_ai_admission_observations_v1.ndjson
          stat -c 'canary mtime=%y ctime=%z size=%s' /home/z/z/ledger/production_family_paper_canary_history_v1/47f04711995def01091ea9928f37c81d.ndjson
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
