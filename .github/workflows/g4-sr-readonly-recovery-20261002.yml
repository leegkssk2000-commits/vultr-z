name: G4 SR read-only recovery 20261002
on:
  push:
    branches: [codex/g4-sr-readonly-recovery-20261002]
    paths: [.github/workflows/g4-sr-readonly-recovery-20261002.yml]
permissions:
  contents: read
concurrency:
  group: g4-sr-readonly-recovery-20261002
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read existing VPS runtime without restart or economic execution
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/g4-sr-readonly"
          mkdir -p "$OUT"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo '{"state":"EXISTING_SSH_SECRET_REFERENCE_UNAVAILABLE","remote_command_executed":false}' > "$OUT/status.json"
            exit 1
          fi
          KEY="$RUNNER_TEMP/g4-sr-key"
          KNOWN="$RUNNER_TEMP/g4-sr-known-hosts"
          trap 'rm -f "$KEY" "$KNOWN"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" > "$KNOWN" 2>/dev/null; then
            echo '{"state":"SSH_HOST_KEY_SCAN_FAILED","remote_command_executed":false}' > "$OUT/status.json"
            exit 1
          fi
          cat > "$RUNNER_TEMP/inspect-sr.py" <<'PYREMOTE'
          """Read existing SR runtime only; never imports or starts strategy execution."""
          import datetime, hashlib, json, os, pathlib, re, sqlite3, subprocess, time
          R = pathlib.Path('/home/z/z/runtime/g4_measurement_exact25_closure_after_pr1345_v1/sr_continuous_two_authorized_20261001')
          W = pathlib.Path('/home/z/worktrees/g4-sr-continuous-two-full-20261001')
          report = {'schema': 'g4.sr.readonly-recovery.v1', 'checked_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'mutation_performed': False, 'economic_execution_started': False, 'runtime_exists': R.is_dir(), 'worktree_exists': W.is_dir()}
          def clean(s):
              s = re.sub(r'(?i)(authorization|api[_-]?key|access[_-]?token|auth[_-]?token|password|secret)\s*[:=]\s*[^\s,;]+', r'\1=[REDACTED]', s)
              s = re.sub(r'https?://[^\s\"\']+', '[URL_REDACTED]', s)
              return s
          def run(args):
              try:
                  p = subprocess.run(args, capture_output=True, text=True, timeout=15, env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'})
                  return {'returncode': p.returncode, 'stdout': clean(p.stdout[-16000:]), 'stderr': clean(p.stderr[-1500:])}
              except Exception as e:
                  return {'error': type(e).__name__}
          report['remote_service'] = run(['systemctl', 'show', 'desktop-commander-remote.service', '-p', 'LoadState', '-p', 'ActiveState', '-p', 'SubState', '-p', 'MainPID', '-p', 'KillMode', '-p', 'ControlGroup', '-p', 'Result', '-p', 'ExecMainCode', '-p', 'ExecMainStatus', '-p', 'NRestarts', '-p', 'ActiveEnterTimestamp', '-p', 'InactiveEnterTimestamp'])
          report['system_capacity'] = {'loadavg': pathlib.Path('/proc/loadavg').read_text().strip(), 'memory_kib': {line.split(':')[0]: line.split(':')[1].strip() for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:', 'MemAvailable:', 'SwapTotal:', 'SwapFree:'))}}
          report['processes'] = []
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():
                  continue
              try:
                  cwd = str((p/'cwd').resolve())
                  args = (p/'cmdline').read_bytes().split(b'\0')
                  scoped = cwd == str(W) or any(str(R).encode() in a or str(W).encode() in a for a in args)
                  if not scoped and p.name not in ('162354', '162625'):
                      continue
                  status = (p/'status').read_text().splitlines()
                  report['processes'].append({'pid': int(p.name), 'scoped_match': scoped, 'cwd': cwd, 'comm': (p/'comm').read_text().strip(), 'status': [line for line in status if line.startswith(('Name:', 'State:', 'PPid:', 'VmRSS:'))], 'cgroup': (p/'cgroup').read_text().strip(), 'start_ticks': (p/'stat').read_text().split(') ',1)[1].split()[19]})
              except (OSError, ValueError, IndexError):
                  pass
          report['files'] = []
          for base in (R, R/'results'):
              if not base.is_dir():
                  continue
              for f in sorted(base.iterdir()):
                  if not f.is_file() or f.is_symlink():
                      continue
                  st = f.stat()
                  report['files'].append({'path': str(f.relative_to(R)), 'bytes': st.st_size, 'mtime_utc': datetime.datetime.fromtimestamp(st.st_mtime, datetime.timezone.utc).isoformat()})
          report['small_receipts'] = {}
          for name in ('USER_APPROVAL.json', 'BATCH_STARTED.json', 'RESERVATIONS.json', 'PREFLIGHT.json', 'TERMINAL_RECEIPT.json', 'BATCH_TERMINAL.json', 'RECOVERY_PREEXECUTION.json'):
              p = R/name
              if p.is_file() and not p.is_symlink() and p.stat().st_size <= 150000:
                  try:
                      raw = p.read_bytes()
                      report['small_receipts'][name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'body': json.loads(raw)}
                  except Exception as e:
                      report['small_receipts'][name] = {'error': type(e).__name__}
          p = R/'worker.log'
          if p.is_file() and not p.is_symlink():
              with p.open('rb') as f:
                  f.seek(max(0, p.stat().st_size-12000))
                  report['worker_log_tail'] = clean(f.read().decode('utf-8', errors='replace'))
          p = R/'candidate_registry.sqlite3'
          report['registry'] = {}
          if p.is_file() and not p.is_symlink():
              try:
                  con = sqlite3.connect(p.as_uri()+'?mode=ro', uri=True, timeout=3)
                  con.execute('PRAGMA query_only=ON')
                  con.row_factory = sqlite3.Row
                  tables = [row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")]
                  report['registry']['tables'] = tables
                  for table in ('scopes', 'claims', 'events'):
                      if table not in tables:
                          continue
                      rows = con.execute('SELECT * FROM "'+table+'" LIMIT 200').fetchall()
                      report['registry'][table] = [{k: (v if not isinstance(v, bytes) else {'bytes': len(v)}) for k,v in dict(row).items()} for row in rows]
                  con.close()
              except Exception as e:
                  report['registry']['error'] = type(e).__name__
          if W.is_dir():
              report['worktree_head'] = run(['git', '-C', str(W), 'rev-parse', 'HEAD'])
              report['worktree_status'] = run(['git', '-C', str(W), 'status', '--short', '--untracked-files=normal'])
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYREMOTE
          set +e
          timeout 150 ssh -T -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$VPS_USER@$VPS_HOST" 'PYTHONDONTWRITEBYTECODE=1 python3 -' < "$RUNNER_TEMP/inspect-sr.py" > "$OUT/inspection.json" 2> "$OUT/transport.log"
          RC=$?
          set -e
          printf '{"ssh_exit_code":%s,"new_full_runs":0,"service_restart":false}\n' "$RC" > "$OUT/status.json"
          if [ "$RC" -eq 0 ]; then
            cat "$OUT/inspection.json"
          else
            echo "SSH_READ_ONLY_INSPECTION_FAILED exit=$RC"
          fi
          exit "$RC"
      - name: Preserve read-only observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-sr-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/g4-sr-readonly/
          if-no-files-found: error
          retention-days: 7
