name: G4 SR read-only recovery 20261002
on:
  push:
    branches: [codex/g4-sr-readonly-recovery-20261002]
    paths: [.github/workflows/g4-sr-readonly-recovery-20261002.yml]
permissions:
  contents: read
concurrency:
  group: g4-sr-readonly-recovery-20261002
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect termination evidence and preserve existing checkpoint without replay
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/g4-sr-readonly"
          mkdir -p "$OUT"
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          KEY="$RUNNER_TEMP/g4-sr-key"
          KNOWN="$RUNNER_TEMP/g4-sr-known-hosts"
          trap 'rm -f "$KEY" "$KNOWN"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 10 -H "$VPS_HOST" > "$KNOWN" 2>/dev/null
          cat > "$RUNNER_TEMP/inspect-sr.py" <<'PYREMOTE'
          """Read-only failure diagnosis and recovery-source export; no strategy imports."""
          import ast, datetime, hashlib, json, os, re, subprocess
          from pathlib import Path
          R=Path('/home/z/z/runtime/g4_measurement_exact25_closure_after_pr1345_v1/sr_continuous_two_authorized_20261001')
          W=Path('/home/z/worktrees/g4-sr-continuous-two-full-20261001')
          report={'schema':'g4.sr.readonly-cause.v1','checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'remote_mutation':False,'new_fulls':0}
          def clean(s):
              s=re.sub(r'https?://[^\s\"\']+','[URL_REDACTED]',s)
              s=re.sub(r'(?i)(authorization|api[_-]?key|access[_-]?token|auth[_-]?token|password|secret)\s*[:=]\s*[^\s,;]+',r'\1=[REDACTED]',s)
              return s
          def cmd(args,limit=50000):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=35,env={**os.environ,'GIT_OPTIONAL_LOCKS':'0'})
                  return {'rc':p.returncode,'stdout':clean(p.stdout[-limit:]),'stderr':clean(p.stderr[-1000:]),'output_truncated':len(p.stdout)>limit}
              except Exception as e:
                  return {'error':type(e).__name__}
          report['boot']=[s for s in Path('/proc/stat').read_text().splitlines() if s.startswith('btime ')]
          report['cpu_count']=os.cpu_count()
          report['service_journal']=cmd(['journalctl','--utc','--no-pager','-u','desktop-commander-remote.service','--since','2026-10-01 23:15:00 UTC','--until','2026-10-02 10:15:00 UTC','-o','short-iso-precise','--grep','exit|kill|stop|restart|oom|memory|watchdog','--case-sensitive=no','-n','120'])
          report['kernel_memory_journal']=cmd(['journalctl','--utc','--no-pager','_TRANSPORT=kernel','--since','2026-10-01 23:15:00 UTC','--until','2026-10-02 10:15:00 UTC','-o','short-iso-precise','--grep','oom-kill|Out of memory|Killed process|invoked oom-killer|oom_reaper','--case-sensitive=no','-n','100'])
          report['scoped_lock']={}
          p=R/'execution.lock'
          if p.exists():
              st=p.stat()
              dev=f'{os.major(st.st_dev):02x}:{os.minor(st.st_dev):02x}:{st.st_ino}'
              report['scoped_lock']={'inode_key':dev,'held_entries':[x for x in Path('/proc/locks').read_text().splitlines() if dev in x]}
          report['sources']={}
          files=[R/'worker.py',R/'archive_saved_results.py',W/'scripts/verify_scalp7_sr_continuous_two_arithmetic_v1.py',W/'scripts/verify_scalp7_sr_continuous_two_saved_v1.py',W/'tests/test_scalp7_sr_continuous_two_arithmetic_v1.py']
          files+=sorted((W/'backend/research/rebuild').glob('scalp7_measurement*.py'))
          for p in files:
              if not p.is_file() or p.is_symlink() or p.stat().st_size>180000:
                  continue
              b=p.read_bytes(); s=b.decode('utf-8')
              try:
                  ast.parse(s); syntax='PASS'
              except SyntaxError as e:
                  syntax=f'FAIL:{e.lineno}:{e.msg}'
              report['sources'][str(p)]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'syntax_ast':syntax,'content':s}
          report['checkpoints']=[]
          for p in sorted((R/'results').glob('*')):
              if not p.is_file() or p.is_symlink():
                  continue
              st=p.stat(); h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              after=p.stat()
              report['checkpoints'].append({'name':p.name,'bytes':st.st_size,'sha256':h.hexdigest(),'stable_during_hash':st.st_mtime_ns==after.st_mtime_ns and st.st_size==after.st_size,'mtime_utc':datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat()})
          print(json.dumps(report,ensure_ascii=False))
          PYREMOTE
          OPTS=(-i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")
          timeout 150 ssh -T "${OPTS[@]}" "$VPS_USER@$VPS_HOST" 'PYTHONDONTWRITEBYTECODE=1 python3 -' < "$RUNNER_TEMP/inspect-sr.py" > "$OUT/cause_and_sources.json" 2> "$OUT/transport.log"
          timeout 150 scp -q "${OPTS[@]}" "$VPS_USER@$VPS_HOST:/home/z/z/runtime/g4_measurement_exact25_closure_after_pr1345_v1/sr_continuous_two_authorized_20261001/results/SR_CONTROL.common_contiguous_1.checkpoint.json" "$OUT/"
          python3 - "$OUT" <<'PYLOCAL'
          import hashlib,json,sys
          from pathlib import Path
          out=Path(sys.argv[1]);r=json.loads((out/'cause_and_sources.json').read_text())
          name='SR_CONTROL.common_contiguous_1.checkpoint.json'
          receipt=next(x for x in r['checkpoints'] if x['name']==name)
          got=hashlib.sha256((out/name).read_bytes()).hexdigest()
          assert receipt['stable_during_hash'] and got==receipt['sha256']
          brief={k:r[k] for k in ('checked_utc','remote_mutation','new_fulls','cpu_count','boot','scoped_lock','checkpoints','service_journal','kernel_memory_journal')}
          brief['checkpoint_copy_sha256_verified']=True
          brief['source_files']={k:{kk:vv for kk,vv in v.items() if kk!='content'} for k,v in r['sources'].items()}
          (out/'SUMMARY.json').write_text(json.dumps(brief,indent=2)+'\n')
          print(json.dumps(brief,indent=2))
          PYLOCAL
      - name: Preserve read-only evidence and recovered checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-sr-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/g4-sr-readonly/
          if-no-files-found: error
          retention-days: 14
