name: G5 Clean Runner Shadow V1

on:
  pull_request:
    paths:
      - 'backend/research/contracts/g5_clean_runner_contract_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_v1.py'
      - 'backend/research/rebuild/g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_strategy_freeze_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_state_machine_v1.json'
      - '.github/workflows/g5-clean-runner-shadow-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/g5_clean_runner_contract_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_v1.py'
      - 'backend/research/rebuild/g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_strategy_freeze_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_state_machine_v1.json'
      - '.github/workflows/g5-clean-runner-shadow-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: G5_CLEAN_RUNNER_OWNER_V1
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G5_CLEAN_RUNNER_OWNER_ID: G5_CLEAN_RUNNER_OWNER_V1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert deterministic shadow-only authority
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test "$G5_CLEAN_RUNNER_OWNER_ID" = 'G5_CLEAN_RUNNER_OWNER_V1'
          echo PASS_SHADOW_ONLY_NO_PAID_AI

      - name: Compile, preflight, unit test, and synthetic canary
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile \
            backend/research/rebuild/g5_clean_runner_v1.py \
            backend/research/rebuild/test_g5_clean_runner_v1.py \
            backend/research/rebuild/g5_data_stale_evidence_v1.py \
            backend/research/rebuild/test_g5_data_stale_evidence_v1.py \
            backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py \
            backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py
          python -m unittest \
            backend.research.rebuild.test_g5_clean_runner_v1 \
            backend.research.rebuild.test_g5_data_stale_evidence_v1 \
            backend.research.rebuild.test_g5_data_stale_real_failure_collector_v1 -v
          python -m backend.research.rebuild.g5_clean_runner_v1 \
            --self-test \
            --preflight \
            --canary \
            --artifact-dir out

      - name: Seed append-only state from current master
        run: |
          set -euo pipefail
          state=backend/research/rebuild/g5_clean_runner_state_events_v1.jsonl
          ledger=backend/research/rebuild/g5_clean_runner_economic_ledger_v1.jsonl
          if [[ -f "$state" ]]; then cp "$state" out/g5_clean_runner_state_events_v1.jsonl; else : > out/g5_clean_runner_state_events_v1.jsonl; fi
          if [[ -f "$ledger" ]]; then cp "$ledger" out/g5_clean_runner_economic_ledger_v1.jsonl; else : > out/g5_clean_runner_economic_ledger_v1.jsonl; fi

      - name: Activate genuine SHADOW_NO_CREDIT
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.g5_clean_runner_v1 \
            --shadow \
            --state-log out/g5_clean_runner_state_events_v1.jsonl \
            --economic-ledger out/g5_clean_runner_economic_ledger_v1.jsonl \
            --artifact-dir out

      - name: Verify shadow fail-closed contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('out')
          shadow=json.loads((out/'g5_clean_runner_shadow_v1.json').read_text())
          telemetry=json.loads((out/'g5_clean_runner_telemetry_v1.json').read_text())
          cutover=json.loads((out/'g5_clean_runner_cutover_receipt_v1.json').read_text())
          canary=json.loads((out/'g5_clean_runner_canary_v1.json').read_text())
          exactly=json.loads((out/'g5_clean_runner_exactly_once_test_v1.json').read_text())
          assert shadow['mode']=='SHADOW_NO_CREDIT' and shadow['formal_credit']==0
          assert shadow['state'] in {'CLEAN_RUNNER_SHADOW_ACTIVE','CLEAN_RUNNER_SHADOW_PASS'}
          assert shadow['duplicate']==0 and shadow['lookahead']==0
          assert telemetry['state']=='MEASURE_ALLOWED_FRESH_CREDIT_BLOCKED'
          assert telemetry['missing_tuples']==0
          assert cutover['executed'] is False and cutover['clean_runner_authority'] is False
          assert canary['state']=='CLEAN_RUNNER_CANARY_PASS' and canary['formal_credit']==0
          assert exactly['state']=='CLEAN_RUNNER_EXACTLY_ONCE_PASS' and exactly['duplicate_evaluation']==0
          print(json.dumps({
              'state':shadow['state'],
              'complete_bars':shadow['complete_bar_count'],
              'evaluation_receipts':shadow['evaluation_receipts'],
              'complete_telemetry':telemetry['complete_tuples'],
              'formal_credit':0,
          },sort_keys=True))
          PY

      - name: Collect observed real DATA_STALE failure or stall evidence
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.g5_data_stale_real_failure_collector_v1 \
            --state-log out/g5_clean_runner_state_events_v1.jsonl \
            --output out/g5_data_stale_real_failure_evidence_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('out/g5_data_stale_real_failure_evidence_v1.json').read_text())
          assert evidence['state'] in {
              'REAL_FAILURE_COLLECTION_ACTIVE_NO_EVENTS',
              'REAL_FAILURE_INCIDENT_OBSERVED_NO_THRESHOLD_TELEMETRY',
              'REAL_FAILURE_EVIDENCE_AVAILABLE',
          }
          assert evidence['scope']=='FULL_CLEAN_RUNNER_APPEND_ONLY_STATE_LOG'
          assert evidence['timestamp_integrity']=='PASS'
          assert evidence['authority_value'] is None
          assert evidence['authority_created'] is False
          assert evidence['ssot_mutated'] is False
          assert evidence['contract_mutation'] is False
          assert evidence['strategy_mutation'] is False
          assert evidence['economic_mutation'] is False
          assert evidence['fresh_credit'] == 0
          if evidence['threshold_eligible_failure_N'] > 0:
              assert evidence['state']=='REAL_FAILURE_EVIDENCE_AVAILABLE'
              assert evidence['next']=='COMPUTE_THRESHOLD_SURFACE_FROM_OBSERVED_CLASSES'
          elif evidence['real_failure_N'] > 0:
              assert evidence['state']=='REAL_FAILURE_INCIDENT_OBSERVED_NO_THRESHOLD_TELEMETRY'
              assert evidence['next']=='WAIT_FOR_LATE_EVALUATION_WITH_COMPLETE_TELEMETRY'
          else:
              assert evidence['state']=='REAL_FAILURE_COLLECTION_ACTIVE_NO_EVENTS'
              assert evidence['next']=='WAIT_FOR_OBSERVED_REAL_FAILURE_OR_STALL'
          print(json.dumps({
              'state': evidence['state'],
              'evaluated_N': evidence['evaluated_N'],
              'real_failure_N': evidence['real_failure_N'],
              'threshold_eligible_failure_N': evidence['threshold_eligible_failure_N'],
              'next': evidence['next'],
              'fresh_credit': 0,
          }, sort_keys=True))
          PY

      - name: Classify DATA_STALE evidence without authority mutation
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.g5_data_stale_evidence_v1 \
            --shadow out/g5_clean_runner_shadow_v1.json \
            --state-log out/g5_clean_runner_state_events_v1.jsonl \
            --output out/g5_data_stale_evidence_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('out/g5_data_stale_evidence_v1.json').read_text())
          assert evidence['state']=='AUTHORITY_EVIDENCE_PARTIAL_SYNTHETIC_ONLY'
          assert evidence['normal_N'] >= 63
          assert evidence['real_failure_N'] == 0
          assert evidence['synthetic_failure_N'] == evidence['normal_N']
          assert evidence['timestamp_integrity']=='PASS'
          assert evidence['authority_value'] is None
          assert evidence['authority_created'] is False
          assert evidence['ssot_mutated'] is False
          assert evidence['fresh_credit'] == 0
          assert evidence['threshold_surface_allowed'] is False
          assert evidence['data_stale_authority_allowed'] is False
          assert evidence['first_blocker']=='REAL_LABELED_FAILURE_MISSING'
          print(json.dumps({
              'state': evidence['state'],
              'normal_N': evidence['normal_N'],
              'real_failure_N': evidence['real_failure_N'],
              'first_blocker': evidence['first_blocker'],
              'authority_value': None,
              'fresh_credit': 0,
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-clean-runner-shadow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Persist clean-runner append-only shadow state on master
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          packet=/tmp/g5-clean-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$packet"
          targets=(
            g5_clean_runner_state_events_v1.jsonl
            g5_clean_runner_economic_ledger_v1.jsonl
            g5_clean_runner_shadow_v1.json
            g5_clean_runner_telemetry_v1.json
            g5_clean_runner_cutover_receipt_v1.json
            g5_clean_runner_post_cutover_3bar_v1.json
            g5_clean_runner_run_latest_v1.json
            g5_data_stale_real_failure_evidence_v1.json
            g5_data_stale_evidence_v1.json
          )
          for name in "${targets[@]}"; do cp "out/$name" "$packet/$name"; done
          git config user.name 'g5-clean-runner-shadow-v1'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git switch --detach origin/master
            python - "$packet" "${targets[@]}" <<'PY'
          import json,sys
          from pathlib import Path
          packet=Path(sys.argv[1])
          root=Path('backend/research/rebuild')
          for name in sys.argv[2:]:
              src=packet/name
              dst=root/name
              if name.endswith('.jsonl') and dst.exists():
                  old=dst.read_bytes(); new=src.read_bytes()
                  if not new.startswith(old):
                      raise SystemExit(f'APPEND_ONLY_PREFIX_CONFLICT:{name}')
              elif name=='g5_clean_runner_shadow_v1.json' and dst.exists():
                  old=json.loads(dst.read_text()); new=json.loads(src.read_text())
                  if int(new.get('evaluation_receipts') or 0)<int(old.get('evaluation_receipts') or 0):
                      raise SystemExit('SHADOW_EVALUATION_REGRESSION')
                  if int(new.get('complete_bar_count') or 0)<int(old.get('complete_bar_count') or 0):
                      raise SystemExit('SHADOW_BAR_REGRESSION')
              elif name=='g5_data_stale_real_failure_evidence_v1.json':
                  value=json.loads(src.read_text())
                  if value.get('authority_value') is not None or value.get('authority_created') is not False:
                      raise SystemExit('REAL_FAILURE_COLLECTOR_AUTHORITY_MUTATION_FORBIDDEN')
                  if int(value.get('fresh_credit') or 0) != 0:
                      raise SystemExit('REAL_FAILURE_COLLECTOR_FRESH_CREDIT_FORBIDDEN')
                  if any(event.get('observed_not_synthetic') is not True for event in value.get('events', [])):
                      raise SystemExit('SYNTHETIC_EVENT_FORBIDDEN_IN_REAL_FAILURE_COLLECTOR')
              elif name=='g5_data_stale_evidence_v1.json':
                  value=json.loads(src.read_text())
                  if value.get('authority_value') is not None or value.get('authority_created') is not False:
                      raise SystemExit('DATA_STALE_AUTHORITY_MUTATION_FORBIDDEN')
                  if int(value.get('fresh_credit') or 0) != 0:
                      raise SystemExit('FRESH_CREDIT_FORBIDDEN')
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(src.read_bytes())
          PY
            git add "${targets[@]/#/backend/research/rebuild/}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5: persist clean-runner shadow receipt [skip ci]'
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          exit 1
