name: G5 Clean Runner Shadow V1

on:
  pull_request:
    paths:
      - 'backend/research/contracts/g5_clean_runner_contract_v1.json'
      - 'backend/research/contracts/a1_top5_replacement_child_freeze_v2.json'
      - 'backend/research/rebuild/a1_top5_latest_only_ssot_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_binding_fix_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_binding_fix_v1.py'
      - 'backend/research/rebuild/g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_strategy_freeze_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_state_machine_v1.json'
      - '.github/workflows/g5-clean-runner-shadow-v1.yml'
      - 'backend/research/contracts/g5a_stage_source_cost_contract_v1.json'
      - 'backend/research/rebuild/q0_prospective*_v1.py'
      - 'backend/research/rebuild/test_q0_prospective*_v1.py'
      - 'research/prospective/Q0_FROZEN_20260907_V1/**'
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/g5_clean_runner_contract_v1.json'
      - 'backend/research/contracts/a1_top5_replacement_child_freeze_v2.json'
      - 'backend/research/rebuild/a1_top5_latest_only_ssot_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_binding_fix_v1.py'
      - 'backend/research/rebuild/test_g5_clean_runner_binding_fix_v1.py'
      - 'backend/research/rebuild/g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_evidence_v1.py'
      - 'backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py'
      - 'backend/research/rebuild/g5_clean_runner_strategy_freeze_v1.json'
      - 'backend/research/rebuild/g5_clean_runner_state_machine_v1.json'
      - '.github/workflows/g5-clean-runner-shadow-v1.yml'
      - 'backend/research/contracts/g5a_stage_source_cost_contract_v1.json'
      - 'backend/research/rebuild/q0_prospective*_v1.py'
      - 'backend/research/rebuild/test_q0_prospective*_v1.py'
      - 'research/prospective/Q0_FROZEN_20260907_V1/**'
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'

permissions:
  contents: write

concurrency:
  group: G5_CLEAN_RUNNER_OWNER_V1
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G5_CLEAN_RUNNER_OWNER_ID: G5_CLEAN_RUNNER_OWNER_V1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert deterministic shadow-only authority
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test "$G5_CLEAN_RUNNER_OWNER_ID" = 'G5_CLEAN_RUNNER_OWNER_V1'
          echo PASS_SHADOW_ONLY_NO_PAID_AI

      - name: Compile and verify corrected Keltner V2 binding
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile \
            backend/research/rebuild/g5_clean_runner_v1.py \
            backend/research/rebuild/test_g5_clean_runner_v1.py \
            backend/research/rebuild/g5_clean_runner_binding_fix_v1.py \
            backend/research/rebuild/test_g5_clean_runner_binding_fix_v1.py \
            backend/research/rebuild/g5_data_stale_evidence_v1.py \
            backend/research/rebuild/test_g5_data_stale_evidence_v1.py \
            backend/research/rebuild/g5_data_stale_real_failure_collector_v1.py \
            backend/research/rebuild/test_g5_data_stale_real_failure_collector_v1.py
          python -m unittest \
            backend.research.rebuild.test_g5_clean_runner_v1 \
            backend.research.rebuild.test_g5_clean_runner_binding_fix_v1 \
            backend.research.rebuild.test_g5_data_stale_evidence_v1 \
            backend.research.rebuild.test_g5_data_stale_real_failure_collector_v1 -v
          python -m backend.research.rebuild.g5_clean_runner_binding_fix_v1 \
            --self-test \
            --preflight \
            --canary \
            --artifact-dir out

      - name: Seed append-only state from current master
        run: |
          set -euo pipefail
          state=backend/research/rebuild/g5_clean_runner_state_events_v1.jsonl
          ledger=backend/research/rebuild/g5_clean_runner_economic_ledger_v1.jsonl
          if [[ -f "$state" ]]; then cp "$state" out/g5_clean_runner_state_events_v1.jsonl; else : > out/g5_clean_runner_state_events_v1.jsonl; fi
          if [[ -f "$ledger" ]]; then cp "$ledger" out/g5_clean_runner_economic_ledger_v1.jsonl; else : > out/g5_clean_runner_economic_ledger_v1.jsonl; fi

      - name: Activate genuine corrected SHADOW_NO_CREDIT
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.q0_prospective_capture_v1 \
            --shadow \
            --state-log out/g5_clean_runner_state_events_v1.jsonl \
            --economic-ledger out/g5_clean_runner_economic_ledger_v1.jsonl \
            --artifact-dir out

      - name: Verify binding fix and fail-closed shadow
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('out')
          binding=json.loads((out/'g5_clean_runner_binding_fix_v1.json').read_text())
          effective=json.loads((out/'g5_clean_runner_contract_effective_v1.json').read_text())
          shadow=json.loads((out/'g5_clean_runner_shadow_v1.json').read_text())
          telemetry=json.loads((out/'g5_clean_runner_telemetry_v1.json').read_text())
          cutover=json.loads((out/'g5_clean_runner_cutover_receipt_v1.json').read_text())
          canary=json.loads((out/'g5_clean_runner_canary_v1.json').read_text())
          exactly=json.loads((out/'g5_clean_runner_exactly_once_test_v1.json').read_text())
          run=json.loads((out/'g5_clean_runner_run_latest_v1.json').read_text())
          keltner=next(x for x in effective['active_strategies'] if x['strategy_id']=='keltner_trend')
          assert binding['state']=='FIX_APPLIED_CANONICAL_KELTNER_V2_BINDING'
          assert binding['first_zero_stage']=='RAW_SIGNAL_EMISSION'
          assert binding['previous_keltner_child_id']=='keltner_range_owner_v1'
          assert binding['current_keltner_child_id']=='keltner_replacement_trend_pull_long_4h_h12_v2'
          assert binding['canonical_v2_keltner_closed_T_observed'] >= 5
          assert binding['historical_backfill_performed'] is False
          assert binding['formal_credit']==0
          assert keltner['child_id']=='keltner_replacement_trend_pull_long_4h_h12_v2'
          assert keltner['classifier_rule'] is None
          assert shadow['binding_epoch']=='KELTNER_V2_BINDING_FIX_V1'
          assert shadow['binding_gate_current_child_only'] is True
          assert shadow['prebinding_child_rows_excluded'] is True
          assert shadow['mode']=='SHADOW_NO_CREDIT' and shadow['formal_credit']==0
          assert shadow['state'] in {'CLEAN_RUNNER_SHADOW_ACTIVE','CLEAN_RUNNER_SHADOW_PASS'}
          assert shadow['duplicate']==0 and shadow['lookahead']==0
          assert telemetry['state']=='MEASURE_ALLOWED_FRESH_CREDIT_BLOCKED'
          assert telemetry['missing_tuples']==0
          assert cutover['executed'] is False and cutover['clean_runner_authority'] is False
          assert cutover['binding_epoch']=='KELTNER_V2_BINDING_FIX_V1'
          assert canary['state']=='CLEAN_RUNNER_CANARY_PASS' and canary['formal_credit']==0
          assert exactly['state']=='CLEAN_RUNNER_EXACTLY_ONCE_PASS' and exactly['duplicate_evaluation']==0
          assert run['formal_credit']==0 and run['exchange_order_submitted'] is False
          print(json.dumps({
              'binding_state':binding['state'],
              'canonical_keltner_T':binding['canonical_v2_keltner_closed_T_observed'],
              'new_signal_count':run['evaluation_counts']['signal'],
              'new_opened':run['lifecycle_counts']['opened'],
              'new_closed':run['lifecycle_counts']['closed'],
              'new_ledger_written':run['lifecycle_counts']['ledger_written'],
              'binding_complete_bars':shadow['complete_bar_count'],
              'binding_evaluations':shadow['binding_evaluation_receipts'],
              'formal_credit':0,
          },sort_keys=True))
          PY

      - name: Collect observed real DATA_STALE failure or stall evidence
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.g5_data_stale_real_failure_collector_v1 \
            --state-log out/g5_clean_runner_state_events_v1.jsonl \
            --output out/g5_data_stale_real_failure_evidence_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('out/g5_data_stale_real_failure_evidence_v1.json').read_text())
          assert evidence['state'] in {
              'REAL_FAILURE_COLLECTION_ACTIVE_NO_EVENTS',
              'REAL_FAILURE_INCIDENT_OBSERVED_NO_THRESHOLD_TELEMETRY',
              'REAL_FAILURE_EVIDENCE_AVAILABLE',
          }
          assert evidence['scope']=='FULL_CLEAN_RUNNER_APPEND_ONLY_STATE_LOG'
          assert evidence['timestamp_integrity']=='PASS'
          assert evidence['authority_value'] is None
          assert evidence['authority_created'] is False
          assert evidence['ssot_mutated'] is False
          assert evidence['contract_mutation'] is False
          assert evidence['strategy_mutation'] is False
          assert evidence['economic_mutation'] is False
          assert evidence['fresh_credit'] == 0
          if evidence['threshold_eligible_failure_N'] > 0:
              assert evidence['state']=='REAL_FAILURE_EVIDENCE_AVAILABLE'
              assert evidence['next']=='COMPUTE_THRESHOLD_SURFACE_FROM_OBSERVED_CLASSES'
          elif evidence['real_failure_N'] > 0:
              assert evidence['state']=='REAL_FAILURE_INCIDENT_OBSERVED_NO_THRESHOLD_TELEMETRY'
              assert evidence['next']=='WAIT_FOR_LATE_EVALUATION_WITH_COMPLETE_TELEMETRY'
          else:
              assert evidence['state']=='REAL_FAILURE_COLLECTION_ACTIVE_NO_EVENTS'
              assert evidence['next']=='WAIT_FOR_OBSERVED_REAL_FAILURE_OR_STALL'
          PY

      - name: Classify DATA_STALE only after corrected 3-bar gate
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          shadow=json.loads(Path('out/g5_clean_runner_shadow_v1.json').read_text())
          raise SystemExit(0 if shadow.get('shadow_3bar_pass') is True else 1)
          PY
          then
            python -m backend.research.rebuild.g5_data_stale_evidence_v1 \
              --contract out/g5_clean_runner_contract_effective_v1.json \
              --shadow out/g5_clean_runner_shadow_v1.json \
              --state-log out/g5_clean_runner_state_events_v1.jsonl \
              --output out/g5_data_stale_evidence_v1.json
          else
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('out')
          shadow=json.loads((out/'g5_clean_runner_shadow_v1.json').read_text())
          core={
              'schema_version':'zel.g5.data_stale.evidence.v1',
              'generated_at_utc':shadow.get('generated_at_utc'),
              'state':'WAIT_CLEAN_RUNNER_3BAR',
              'first_blocker':'SHADOW_3BAR_PASS_REQUIRED',
              'binding_epoch':'KELTNER_V2_BINDING_FIX_V1',
              'complete_bar_count':int(shadow.get('complete_bar_count') or 0),
              'shadow_3bar_pass':False,
              'timestamp_integrity':'PASS',
              'authority_value':None,
              'authority_created':False,
              'ssot_mutated':False,
              'fresh_credit':0,
              'formal_credit':0,
              'threshold_surface_allowed':False,
              'data_stale_authority_allowed':False,
              'next':'WAIT_FOR_CORRECTED_CLEAN_RUNNER_3BAR',
          }
          payload=json.dumps(core,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          core['receipt_sha256']=hashlib.sha256(payload).hexdigest()
          (out/'g5_data_stale_evidence_v1.json').write_text(json.dumps(core,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('out/g5_data_stale_evidence_v1.json').read_text())
          assert evidence['timestamp_integrity']=='PASS'
          assert evidence['authority_value'] is None
          assert evidence['authority_created'] is False
          assert evidence['ssot_mutated'] is False
          assert evidence['fresh_credit'] == 0
          assert evidence['data_stale_authority_allowed'] is False
          if evidence['state']=='WAIT_CLEAN_RUNNER_3BAR':
              assert evidence['first_blocker']=='SHADOW_3BAR_PASS_REQUIRED'
              assert evidence['binding_epoch']=='KELTNER_V2_BINDING_FIX_V1'
              assert evidence['shadow_3bar_pass'] is False
              assert evidence['complete_bar_count'] < 3
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-clean-runner-shadow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Retain original Q0 source packet before master checkout
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          source_packet=/tmp/q0-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json
          if [[ -f out/q0_prospective_source_batch_v1.json ]]; then
            cp out/q0_prospective_source_batch_v1.json "$source_packet"
          else
            echo '::warning::Q0_SOURCE_PACKET_MISSING; existing Clean Runner state persistence continues'
          fi

      - name: Persist corrected clean-runner append-only shadow state on master
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          packet=/tmp/g5-clean-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$packet"
          targets=(
            g5_clean_runner_state_events_v1.jsonl
            g5_clean_runner_economic_ledger_v1.jsonl
            g5_clean_runner_shadow_v1.json
            g5_clean_runner_telemetry_v1.json
            g5_clean_runner_cutover_receipt_v1.json
            g5_clean_runner_post_cutover_3bar_v1.json
            g5_clean_runner_run_latest_v1.json
            g5_clean_runner_contract_effective_v1.json
            g5_clean_runner_strategy_freeze_effective_v1.json
            g5_clean_runner_binding_fix_v1.json
            g5_data_stale_real_failure_evidence_v1.json
            g5_data_stale_evidence_v1.json
          )
          for name in "${targets[@]}"; do cp "out/$name" "$packet/$name"; done
          git config user.name 'g5-clean-runner-shadow-v1'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git switch --detach origin/master
            python - "$packet" "${targets[@]}" <<'PY'
          import json,sys
          from pathlib import Path
          packet=Path(sys.argv[1])
          root=Path('backend/research/rebuild')
          epoch='KELTNER_V2_BINDING_FIX_V1'
          for name in sys.argv[2:]:
              src=packet/name
              dst=root/name
              if name.endswith('.jsonl') and dst.exists():
                  old=dst.read_bytes(); new=src.read_bytes()
                  if not new.startswith(old):
                      raise SystemExit(f'APPEND_ONLY_PREFIX_CONFLICT:{name}')
              elif name=='g5_clean_runner_shadow_v1.json' and dst.exists():
                  old=json.loads(dst.read_text()); new=json.loads(src.read_text())
                  old_epoch=old.get('binding_epoch')
                  new_epoch=new.get('binding_epoch')
                  if new_epoch != epoch:
                      raise SystemExit('BINDING_EPOCH_MISSING')
                  if old_epoch == new_epoch:
                      if int(new.get('evaluation_receipts') or 0)<int(old.get('evaluation_receipts') or 0):
                          raise SystemExit('SHADOW_EVALUATION_REGRESSION')
                      if int(new.get('complete_bar_count') or 0)<int(old.get('complete_bar_count') or 0):
                          raise SystemExit('BINDING_SHADOW_BAR_REGRESSION')
                  elif old_epoch is not None:
                      raise SystemExit(f'UNEXPECTED_BINDING_EPOCH_TRANSITION:{old_epoch}->{new_epoch}')
              elif name=='g5_clean_runner_binding_fix_v1.json':
                  value=json.loads(src.read_text())
                  if value.get('binding_epoch') != epoch:
                      raise SystemExit('BINDING_FIX_RECEIPT_EPOCH_DRIFT')
                  if value.get('historical_backfill_performed') is not False:
                      raise SystemExit('HISTORICAL_BACKFILL_FORBIDDEN')
                  if int(value.get('formal_credit') or 0) != 0:
                      raise SystemExit('BINDING_FIX_FORMAL_CREDIT_FORBIDDEN')
              elif name=='g5_data_stale_real_failure_evidence_v1.json':
                  value=json.loads(src.read_text())
                  if value.get('authority_value') is not None or value.get('authority_created') is not False:
                      raise SystemExit('REAL_FAILURE_COLLECTOR_AUTHORITY_MUTATION_FORBIDDEN')
                  if int(value.get('fresh_credit') or 0) != 0:
                      raise SystemExit('REAL_FAILURE_COLLECTOR_FRESH_CREDIT_FORBIDDEN')
                  if any(event.get('observed_not_synthetic') is not True for event in value.get('events', [])):
                      raise SystemExit('SYNTHETIC_EVENT_FORBIDDEN_IN_REAL_FAILURE_COLLECTOR')
              elif name=='g5_data_stale_evidence_v1.json':
                  value=json.loads(src.read_text())
                  if value.get('authority_value') is not None or value.get('authority_created') is not False:
                      raise SystemExit('DATA_STALE_AUTHORITY_MUTATION_FORBIDDEN')
                  if int(value.get('fresh_credit') or 0) != 0:
                      raise SystemExit('FRESH_CREDIT_FORBIDDEN')
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(src.read_bytes())
          PY
            git add "${targets[@]/#/backend/research/rebuild/}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5: persist corrected clean-runner binding receipt [skip ci]'
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Verify frozen Q0 research observer and synthetic lifecycle
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/rebuild/q0_prospective*_v1.py \
            backend/research/rebuild/test_q0_prospective*_v1.py
          python -m unittest -v \
            backend.research.rebuild.test_q0_prospective_archive_v1 \
            backend.research.rebuild.test_q0_prospective_capture_v1 \
            backend.research.rebuild.test_q0_prospective_engine_v1 \
            backend.research.rebuild.test_q0_prospective_weights_v1 \
            backend.research.rebuild.test_q0_prospective_accounting_v1 \
            backend.research.rebuild.test_q0_prospective_observer_v1
          python -m backend.research.rebuild.q0_prospective_observer_v1 \
            --verify --root research/prospective/Q0_FROZEN_20260907_V1

      - name: Consume and persist isolated frozen Q0 research observer on master
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          set -euo pipefail
          observer_root=research/prospective/Q0_FROZEN_20260907_V1
          source_packet=/tmp/q0-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json
          observer_status=out/q0_prospective_observer_status_v1.json
          git config user.name 'q0-frozen-research-observer-v1'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Refresh all current telemetry, then mutate only the Q0 namespace.
            # A rejected push discards no remote source: the next attempt loads
            # its newer CURRENT and consumes this same packet without HTTP.
            git fetch origin master
            git switch --detach origin/master
            python -m backend.research.rebuild.q0_prospective_observer_v1 \
              --verify --root "$observer_root"
            python - "$observer_root" > /tmp/q0-predecessor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])/'archive'/'CURRENT.json'
          print(json.loads(path.read_text())['transaction_sha256'] if path.exists() else '')
          PY
            set +e
            python -m backend.research.rebuild.q0_prospective_observer_v1 \
              --consume "$source_packet" --root "$observer_root" --status "$observer_status"
            consumer_rc=$?
            set -e
            # A failed consumer may append a failure receipt. Persist it too;
            # its failure remains visible separately from operating success.
            python - "$observer_root" /tmp/q0-predecessor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])/'archive'; previous=Path(sys.argv[2]).read_text().strip()
          pointer=root/'CURRENT.json'
          head=json.loads(pointer.read_text())['transaction_sha256'] if pointer.exists() else ''
          while head and head!=previous:
              transaction=json.loads((root/'transactions'/(head+'.json')).read_text())
              head=transaction['previous_sha256'] or ''
          if head!=previous:
              raise SystemExit('Q0_ARCHIVE_PREDECESSOR_CONFLICT')
          PY
            git add -- "$observer_root" \
              ":(exclude)$observer_root/**/.writer.lock" \
              ":(exclude)$observer_root/**/.q0-tmp-*"
            if git diff --cached --quiet; then exit "$consumer_rc"; fi
            python - "$observer_root" <<'PY'
          import subprocess,sys
          prefix=sys.argv[1]+'/'
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if not changed or any(not name.startswith(prefix) for name in changed):
              raise SystemExit('Q0_RESEARCH_WRITE_SCOPE_VIOLATION')
          if any(name.endswith('/.writer.lock') or '/.q0-tmp-' in name for name in changed):
              raise SystemExit('Q0_TRANSIENT_FILE_STAGE_FORBIDDEN')
          PY
            git commit -m 'Q0: persist frozen research source and observer state [skip ci]'
            if git push origin HEAD:master; then exit "$consumer_rc"; fi
            sleep 3
          done
          echo '::warning::Q0_RESEARCH_PERSISTENCE_FAILED_AFTER_3_ATTEMPTS'
          exit 1

      - name: Upload Q0 source and observer status independently of operating outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q0-frozen-observer-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/q0_prospective_source_batch_v1.json
            out/q0_prospective_observer_status_v1.json
          if-no-files-found: warn
          retention-days: 90
