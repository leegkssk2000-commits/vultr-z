name: G5 Exit AI Scoped Pilot
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*lifecycle*_v1.py'
      - 'backend/research/rebuild/g5_exit_ai_pilot_v1.py'
      - 'backend/research/rebuild/trend_primary_protection_v1.py'
      - 'research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204/**'
      - '.github/workflows/g5-exit-ai-research-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*lifecycle*_v1.py'
      - 'backend/research/rebuild/g5_exit_ai_pilot_v1.py'
      - 'backend/research/rebuild/trend_primary_protection_v1.py'
      - 'research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204/**'
      - '.github/workflows/g5-exit-ai-research-v1.yml'
  workflow_dispatch:
    inputs:
      allow_network:
        type: boolean
        default: false
      approval_file:
        type: string
        default: 'research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204/API_APPROVAL.json'
permissions:
  contents: read
concurrency:
  group: top5-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scoped termination and no-charge regression
        run: |
          set -euo pipefail
          python -m unittest backend.research.rebuild.test_lifecycle_task_v1 -v
          python -m backend.research.rebuild.top5_lifecycle_v1 --check-only
          python -m backend.research.rebuild.g5_exit_ai_pilot_v1 --no-network
          npm run --prefix frontend/z-os-app-source validate
      - name: Serial exact reproduction of this scope committed candidate only
        if: hashFiles('research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204/TPP1/receipt.json') != ''
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.top5_lifecycle_v1 --verify-only
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204
            out/top5-ai-pilot.json
          retention-days: 90
  pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.allow_network == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APPROVAL_FILE: ${{ inputs.approval_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact manually approved dossier and reserved one-shot request
        run: python -m backend.research.rebuild.g5_exit_ai_pilot_v1 --approval "$APPROVAL_FILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-lifecycle-pilot-${{ github.run_id }}
          path: |
            out/top5-ai-pilot.json
            research/development_evidence/TOP5_LIFECYCLE_AI_G5_AFTER_PR1204/TASK.json
