name: G5-G14 Governance + Shared Validation CI V2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/research/contracts/g5a_g5b_lane_local_profit_roadmap_v1.json'
      - 'backend/research/rebuild/g5_g14_shared_validation_contract_v1.json'
      - 'backend/research/rebuild/g5_g14_shared_validation_manifest_v1.json'
      - 'backend/research/rebuild/g5_g14_generation_controller_v1.py'
      - 'backend/research/rebuild/g5_g14_governance_contract_v1.json'
      - 'backend/research/rebuild/g5_g14_governance_validator_v1.py'
      - 'backend/research/rebuild/g5_g14_experiment_lineage_v1.jsonl'
      - 'backend/research/rebuild/g5_g14_shared_validation_replay_receipt_v1.json'
      - 'backend/research/rebuild/test_g5_g14_generation_controller_v1.py'
      - 'backend/research/rebuild/test_g5_g14_governance_validator_v1.py'
      - '.github/workflows/g5-g14-shared-validation-replay-v1.yml'
  push:
    branches:
      - master
      - research/g5-g14-roadmap-v2-boundary-seal
      - research/g5-g14-roadmap-hardening-v1
      - g5-g14-shared-validation-lock
    paths:
      - 'backend/research/contracts/g5a_g5b_lane_local_profit_roadmap_v1.json'
      - 'backend/research/rebuild/g5_g14_shared_validation_contract_v1.json'
      - 'backend/research/rebuild/g5_g14_shared_validation_manifest_v1.json'
      - 'backend/research/rebuild/g5_g14_generation_controller_v1.py'
      - 'backend/research/rebuild/g5_g14_governance_contract_v1.json'
      - 'backend/research/rebuild/g5_g14_governance_validator_v1.py'
      - 'backend/research/rebuild/g5_g14_experiment_lineage_v1.jsonl'
      - 'backend/research/rebuild/g5_g14_shared_validation_replay_receipt_v1.json'
      - 'backend/research/rebuild/test_g5_g14_generation_controller_v1.py'
      - 'backend/research/rebuild/test_g5_g14_governance_validator_v1.py'
      - '.github/workflows/g5-g14-shared-validation-replay-v1.yml'

permissions:
  contents: write

concurrency:
  group: g5-g14-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard paid AI off
        run: |
          test -z "$GEMINI_API_KEY"
          test -z "$OPENAI_API_KEY"
          test -z "$OPENROUTER_API_KEY"

      - name: Compile shared control plane
        run: |
          python -m py_compile backend/research/rebuild/g5_g14_generation_controller_v1.py
          python -m py_compile backend/research/rebuild/g5_g14_governance_validator_v1.py
          python -m py_compile backend/research/rebuild/test_g5_g14_generation_controller_v1.py
          python -m py_compile backend/research/rebuild/test_g5_g14_governance_validator_v1.py

      - name: G5 terminal-controller regression tests
        run: python backend/research/rebuild/test_g5_g14_generation_controller_v1.py

      - name: G5-G14 governance tests
        run: python backend/research/rebuild/test_g5_g14_governance_validator_v1.py

      - name: Append-only lineage and governance validation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python backend/research/rebuild/g5_g14_governance_validator_v1.py --base-ref origin/master --write
          else
            python backend/research/rebuild/g5_g14_governance_validator_v1.py --write
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('backend/research/rebuild/g5_g14_governance_validation_receipt_v1.json').read_text())
          assert r['state'] == 'PASS_G5_G14_GOVERNANCE_LOCK', r
          assert r['diagnostic_checkpoint_t'] == 6, r
          assert r['qualification_checkpoint_t'] == 12, r
          assert r['qualification_is_terminal'] is False, r
          assert r['g5_responsibility'] == 'EDGE_QUALIFICATION', r
          assert r['g5_rr_formal_credit'] == 0, r
          assert r['g6_responsibility'] == 'TRADE_METHOD_EXIT_LIFECYCLE_ROBUSTNESS', r
          assert r['g9_pass_x_pass_required'] is True, r
          assert r['g14_auto_live_forbidden'] is True, r
          assert r['order_authority'] == 'BLOCKED', r
          assert r['live_authority'] == 'BLOCKED', r
          print('GOVERNANCE_LOCK=PASS')
          PY

      - name: Derive current G5 snapshot without pinning runtime churn
        run: |
          python backend/research/rebuild/g5_g14_generation_controller_v1.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('backend/research/rebuild/g5_g14_generation_controller_receipt_v1.json').read_text())
          assert not r['state'].startswith('HARD_FAIL'), r
          assert r['fresh_credit_granted'] is False, r
          assert r['authority_created_by_controller'] is False, r
          assert r['g5_rr_formal_credit_allowed'] is False, r
          assert r['g6_fresh_formal_credit_required'] is True, r
          if r['g5_terminal_pass'] is False:
              assert r['g6_allowed'] is False, r
          print(f"CURRENT_G5_STATE={r['state']}")
          PY

      - name: Confirm protected runtime evidence was not mutated
        run: |
          git diff --exit-code -- backend/research/prep/g5_economic_evidence_ledger_v1.jsonl
          git diff --exit-code -- backend/research/rebuild/g5_clean_runner_shadow_v1.json
          git diff --exit-code -- backend/research/rebuild/g5_clean_runner_telemetry_v1.json
          git diff --exit-code -- backend/research/rebuild/g5_data_stale_evidence_v1.json
          git diff --exit-code -- backend/research/rebuild/g5_clean_runner_cutover_receipt_v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: g5-g14-boundary-${{ github.run_id }}
          path: |
            backend/research/rebuild/g5_g14_governance_validation_receipt_v1.json
            backend/research/rebuild/g5_g14_generation_controller_receipt_v1.json
      - name: Persist current governance receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git config user.name 'g5-g14-boundary-seal'
          git config user.email 'actions@users.noreply.github.com'
          for n in 1 2 3; do
            git restore -- backend/research/rebuild/g5_g14_governance_validation_receipt_v1.json 2>/dev/null || true
            git pull --rebase origin master
            python backend/research/rebuild/g5_g14_governance_validator_v1.py --write
            git add -f backend/research/rebuild/g5_g14_governance_validation_receipt_v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5-G14: persist validated boundary contract receipt [skip ci]'
            git push origin HEAD:master && exit 0
          done
          exit 1
