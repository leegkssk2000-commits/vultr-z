name: G5 PREP Validation Harness V1
on:
  pull_request:
    paths:
      - 'backend/research/prep/g5_validation_contract_v1.json'
      - 'backend/research/prep/g5_validation_harness_v1.py'
      - 'backend/research/prep/test_g5_validation_harness_v1.py'
      - '.github/workflows/g5-prep-validation-harness-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest backend.research.prep.test_g5_validation_harness_v1
      - name: Guard contract and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('backend/research/prep/g5_validation_contract_v1.json').read_text())
          g=d['gates']; a=d['authority']
          for k in ['purged_embargo','walk_forward_oos','frozen_w1_w2_w3_manifest','adjacent_parameter_stability','cost_2x','p95_funding','plus_one_bar_execution','stale_gap_duplicate','symbol_regime_side_concentration','independent_metric_recompute','deterministic_ab_parity']:
              assert g[k] is True
          assert a['selection_authority'] is False and a['promotion_authority'] is False
          assert a['execution_authority']=='NONE' and a['order_authority']=='BLOCKED' and a['live_trade_authority']=='BLOCKED'
          assert a['protected_mutations']==0
          print('PASS_G5_PREP_CONTRACT')
          PY
