name: G5A Q0 Convex Channel Breakout 1306

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/q0_prospective_engine_v1.py'
      - 'backend/research/rebuild/q0_convex_intrabar_adapter_v1.py'
      - 'backend/research/rebuild/g5_q0_convex_collector_v1.py'
      - 'backend/research/contracts/q0_convex_g5a_collector_v1.json'
      - '.github/workflows/g5-q0-convex-1306.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/q0_convex_intrabar_adapter_v1.py'
      - 'backend/research/rebuild/g5_q0_convex_collector_v1.py'
      - 'backend/research/contracts/q0_convex_g5a_collector_v1.json'
      - '.github/workflows/g5-q0-convex-1306.yml'
  schedule:
    - cron: '27 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: G5A_Q0_CONVEX_CHANNEL_BREAKOUT_V1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen Q0 state machine and observed intrabar adapter
        run: |
          set -euo pipefail
          python3 -B -m py_compile backend/research/rebuild/q0_prospective_engine_v1.py backend/research/rebuild/q0_convex_intrabar_adapter_v1.py backend/research/rebuild/g5_q0_convex_collector_v1.py
          python3 -B backend/research/rebuild/q0_convex_intrabar_adapter_v1.py
          python3 -B -m backend.research.rebuild.g5_q0_convex_collector_v1 --self-test
          python3 -B -m unittest backend.research.rebuild.test_q0_prospective_engine_v1 -v

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Freeze/read Q0 future source, costs and observed lifecycle
        run: |
          set -euo pipefail
          python3 -B backend/research/rebuild/q0_convex_intrabar_adapter_v1.py
          python3 -B -m backend.research.rebuild.g5_q0_convex_collector_v1 --self-test
          rm -rf out && mkdir -p out
          python3 -B -m backend.research.rebuild.g5_q0_convex_collector_v1 --out-dir out
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out/g5_q0_convex_state_v1.json').read_text())
          assert s['state']=='Q0_CONVEX_CHANNEL_BREAKOUT_G5A_READY_FUTURE_ONLY'
          assert s['boundary_ms']==1789257600000
          assert s['historical_backfill'] is False and s['formal_credit']==0
          assert s['unknown_exit_T']==0
          assert s['order_authority']=='BLOCKED' and s['live_trade_authority']=='BLOCKED'
          assert len(s['cost_models'])==7
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5a-q0-convex-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Append-only persist Q0 state and evidence journal
        run: |
          set -euo pipefail
          git config user.name 'g5a-q0-convex-v1'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git switch --detach origin/master
            python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('backend/research/rebuild');out=Path('out')
          ns=json.loads((out/'g5_q0_convex_state_v1.json').read_text())
          ne=[x for x in (out/'g5_q0_convex_events_v1.jsonl').read_text().splitlines() if x.strip()]
          sp=root/'g5_q0_convex_state_v1.json';ep=root/'g5_q0_convex_events_v1.jsonl'
          if sp.exists():
              old=json.loads(sp.read_text())
              for key in ('boundary_ms','rule_id','cost_models','warmup_sha256','engine_sha256','intrabar_adapter_sha256'):
                  if old.get(key)!=ns.get(key): raise SystemExit('Q0_FROZEN_STATE_CONFLICT:'+key)
          olde=[x for x in ep.read_text().splitlines() if x.strip()] if ep.exists() else []
          if len(ne)<len(olde) or ne[:len(olde)]!=olde: raise SystemExit('Q0_APPEND_ONLY_CONFLICT')
          sp.write_text(json.dumps(ns,sort_keys=True,indent=2)+'\n')
          ep.write_text('\n'.join(ne)+('\n' if ne else ''))
          PY
            git add backend/research/rebuild/g5_q0_convex_state_v1.json backend/research/rebuild/g5_q0_convex_events_v1.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5A: persist Q0 Convex future evidence [skip ci]'
            if git push origin HEAD:master; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
