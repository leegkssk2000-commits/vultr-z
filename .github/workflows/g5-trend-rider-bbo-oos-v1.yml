name: G5 TrendRider BBO OOS V1 — LEGACY VERIFY ONLY

# Historical old-Primary BBO evidence is retained byte-for-byte in the repository,
# but PR #1301 replaced this lane with the exact TrendRider Unified G5A collector.
# Do not schedule or push new old-Primary evidence after the Unified cutover.
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/g5_trend_rider_bbo_oos_collector_v1.py'
      - '.github/workflows/g5-trend-rider-bbo-oos-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: G5_TREND_RIDER_BBO_OOS_OWNER_V1_LEGACY_VERIFY
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preserved legacy collector only
        run: |
          set -euo pipefail
          test -z "$OPENAI_API_KEY" && test -z "$GEMINI_API_KEY" && test -z "$GOOGLE_API_KEY"
          test -z "$OPENROUTER_API_KEY" && test -z "$GROQ_API_KEY"
          python -m py_compile backend/research/rebuild/g5_trend_rider_bbo_oos_collector_v1.py
          python -m backend.research.rebuild.trend_rider_transition_freshness_child_policy_v1
          python -m backend.research.rebuild.trend_rider_wr80_us_chase_cooling_child_policy_v1
          python -m backend.research.rebuild.g5_trend_rider_bbo_oos_collector_v1 --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/research/rebuild/g5_trend_rider_bbo_oos_state_v1.json')
          if p.exists():
              s=json.loads(p.read_text())
              assert s['parent_identity']=='TREND_RIDER_WR8125_CHASE_COOLING_FROZEN_PARENT'
              assert s['formal_credit']==0
              assert s['selection_authority'] is False and s['promotion_authority'] is False
              assert s['execution_authority']=='NONE' and s['order_authority']=='BLOCKED' and s['live_trade_authority']=='BLOCKED'
          print('PASS_LEGACY_PRIMARY_BBO_VERIFY_ONLY_NO_SCHEDULED_WRITER')
          PY
