name: G5 TrendRider Broad30 Product OOS V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_g4_trendrider_broad30_economic_survivor_v1.json'
      - 'backend/research/prep/g5_trendrider_broad30_product_manifest_v1.json'
      - 'backend/research/prep/g5_trendrider_broad30_product_oos_v1.py'
      - 'backend/research/prep/g5_production_economic_contract_v1.json'
      - 'backend/research/prep/g5_production_economic_ssot_v1.py'
      - 'backend/research/prep/g5_product_durable_guard_v2.py'
      - 'backend/research/prep/test_g5_production_economic_ssot_v1.py'
      - 'backend/research/prep/g5_trendrider_broad30_product_latest.json'
      - 'backend/research/prep/g5_economic_evidence_ledger_v1.jsonl'
      - '.github/workflows/g5-trendrider-broad30-product-oos-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/a1_g4_trendrider_broad30_economic_survivor_v1.json'
      - 'backend/research/prep/g5_trendrider_broad30_product_manifest_v1.json'
      - 'backend/research/prep/g5_trendrider_broad30_product_oos_v1.py'
      - 'backend/research/prep/g5_production_economic_contract_v1.json'
      - 'backend/research/prep/g5_production_economic_ssot_v1.py'
      - 'backend/research/prep/g5_product_durable_guard_v2.py'
      - 'backend/research/prep/test_g5_production_economic_ssot_v1.py'
      - 'backend/research/prep/g5_trendrider_broad30_product_latest.json'
      - 'backend/research/prep/g5_economic_evidence_ledger_v1.jsonl'
      - '.github/workflows/g5-trendrider-broad30-product-oos-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 1,5,9,13,17,21 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: g5-trendrider-broad30-product-oos-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test G5 production economic SSOT
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/g5_trendrider_broad30_product_oos_v1.py \
            backend/research/prep/g5_production_economic_ssot_v1.py \
            backend/research/prep/g5_product_durable_guard_v2.py \
            backend/research/prep/test_g5_production_economic_ssot_v1.py
          python -m backend.research.prep.g5_trendrider_broad30_product_oos_v1 --self-test
          python -m backend.research.prep.g5_production_economic_ssot_v1 --self-test
          python -m backend.research.prep.g5_product_durable_guard_v2 --self-test
          python -m unittest backend.research.prep.test_g5_production_economic_ssot_v1 -v

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify G5 production economic contract and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/g5_trendrider_broad30_product_oos_v1.py \
            backend/research/prep/g5_production_economic_ssot_v1.py \
            backend/research/prep/g5_product_durable_guard_v2.py \
            backend/research/prep/test_g5_production_economic_ssot_v1.py
          python -m backend.research.prep.g5_trendrider_broad30_product_oos_v1 --self-test
          python -m backend.research.prep.g5_production_economic_ssot_v1 --self-test
          python -m backend.research.prep.g5_product_durable_guard_v2 --self-test
          python -m unittest backend.research.prep.test_g5_production_economic_ssot_v1 -v

      - name: Run G5 production economic SSOT
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.prep.g5_production_economic_ssot_v1 \
            --out out/g5_trendrider_broad30_product_latest.json \
            --durable-current backend/research/prep/g5_trendrider_broad30_product_latest.json \
            --ledger-current backend/research/prep/g5_economic_evidence_ledger_v1.jsonl \
            --ledger-out out/g5_economic_evidence_ledger_v1.jsonl \
            | tee /tmp/g5_economic_runtime.json
          python - <<'PY'
          import json
          r=json.load(open('out/g5_trendrider_broad30_product_latest.json'))
          e=r['economic_ssot']
          a=r['ai_gate']
          assert r['stage']=='G5'
          assert r['strategy_id']=='trend_rider'
          assert r['lane_id']=='trend_rider_broad_wr7000'
          assert e['schema_version']=='zel.g5.production_economic_ssot.v1'
          assert e['runtime_trade_count']==r['postlock_closed_T']
          assert e['production_grade_T']+e['replay_or_proxy_T']==e['runtime_trade_count']
          assert e['three_provenance_fail_closed']['current_snapshot_historical_replay_blocked'] is True
          assert e['three_provenance_fail_closed']['unsigned_or_absolute_funding_blocked'] is True
          assert e['three_provenance_fail_closed']['ohlc_intrabar_ambiguity_blocked'] is True
          assert a['scope']=='G5_ONLY'
          assert a['proxy_replay_production_pass_forbidden'] is True
          if e['replay_or_proxy_T']:
              assert e['production_grade_ready'] is False
              assert a['production_grade_claim_eligible'] is False
              assert a['g6_promotion_eligible'] is False
          if not e['durable_matches_runtime']:
              assert r['state']=='HOLD_G5_ECONOMIC_SSOT_MISMATCH'
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({
              'state':r['state'],
              'research_state':r['research_state'],
              'runtime_T':e['runtime_trade_count'],
              'durable_T':e['durable_trade_count'],
              'durable_matches_runtime':e['durable_matches_runtime'],
              'production_grade_T':e['production_grade_T'],
              'proxy_T':e['replay_or_proxy_T'],
              'ledger_total':e['ledger']['total_rows'],
              'g6_eligible':a['g6_promotion_eligible'],
              'receipt':r['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Persist hardened G5 receipt and append-only ledger
        run: |
          set -euo pipefail
          product_target=backend/research/prep/g5_trendrider_broad30_product_latest.json
          product_candidate=out/g5_trendrider_broad30_product_latest.json
          ledger_target=backend/research/prep/g5_economic_evidence_ledger_v1.jsonl
          ledger_candidate=out/g5_economic_evidence_ledger_v1.jsonl

          git config user.name 'g5-production-economic-ssot'
          git config user.email 'actions@users.noreply.github.com'

          # Resolve master first. Generated evidence is never replayed blindly over
          # a newer durable receipt.
          git fetch origin master
          git rebase origin/master

          guard_json="$(python -m backend.research.prep.g5_product_durable_guard_v2 \
            --current "$product_target" \
            --candidate "$product_candidate")"
          echo "$guard_json"
          guard_decision="$(GUARD_JSON="$guard_json" python - <<'PY'
          import json, os
          print(json.loads(os.environ['GUARD_JSON'])['decision'])
          PY
          )"

          case "$guard_decision" in
            ALLOW_STRICT_T_ADVANCE|ALLOW_SAME_T_SCHEMA_HARDENING|ALLOW_SAME_T_DURABLE_RECONCILIATION)
              cp "$product_candidate" "$product_target"
              ;;
            NOOP_IDENTICAL|BLOCK_T_REGRESSION|BLOCK_SAME_T_RECEIPT_REWRITE)
              echo "G5_PRODUCT_PERSIST=$guard_decision"
              ;;
            *)
              echo "UNKNOWN_G5_PRODUCT_GUARD_DECISION=$guard_decision" >&2
              exit 1
              ;;
          esac

          LEDGER_TARGET="$ledger_target" LEDGER_CANDIDATE="$ledger_candidate" python - <<'PY'
          import os
          from pathlib import Path
          from backend.research.prep.g5_production_economic_ssot_v1 import merge_ledger, read_ledger
          target=Path(os.environ['LEDGER_TARGET'])
          candidate=Path(os.environ['LEDGER_CANDIDATE'])
          rows=read_ledger(candidate)
          tmp=Path('/tmp/g5_economic_evidence_ledger_merged.jsonl')
          info=merge_ledger(target, rows, tmp)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(tmp.read_text(encoding='utf-8'), encoding='utf-8')
          print(info)
          PY

          git add "$product_target" "$ledger_target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'G5: persist production economic SSOT evidence [skip ci]'

          # One-shot push. If master moved after the guard, fail closed and let the
          # next scheduled run recompute against the new durable state.
          if ! git push origin HEAD:master; then
            echo 'G5_ECONOMIC_PERSIST_SKIPPED_MASTER_MOVED'
            exit 0
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-production-economic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/g5_trendrider_broad30_product_latest.json
            out/g5_economic_evidence_ledger_v1.jsonl
          if-no-files-found: error
          retention-days: 90
