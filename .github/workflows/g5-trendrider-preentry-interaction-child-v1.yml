name: G5 TrendRider Causal Research Loop V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/contracts/g5_trendrider_preentry_interaction_child_v1.json'
      - 'backend/research/prep/g5_trendrider_preentry_interaction_child_v1.py'
      - 'backend/research/prep/g5_trendrider_causal_web_research_v1.py'
      - 'backend/research/prep/g5_trendrider_causal_web_research_v2.py'
      - 'backend/research/prep/g5_trendrider_causal_persist_v2.py'
      - 'backend/research/prep/g5_trendrider_w2_forensic_v1.py'
      - '.github/workflows/g5-trendrider-preentry-interaction-child-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/prep/g5_trendrider_broad30_product_latest.json'
      - 'backend/research/rebuild/a1_top5_latest_only_ssot_v1.json'
      - 'backend/research/prep/g5_trendrider_w2_forensic_v1.py'
      - 'backend/research/prep/g5_trendrider_preentry_interaction_child_v1.py'
      - 'backend/research/prep/g5_trendrider_causal_web_research_v1.py'
      - 'backend/research/prep/g5_trendrider_causal_web_research_v2.py'
      - 'backend/research/prep/g5_trendrider_causal_persist_v2.py'
      - '.github/workflows/g5-trendrider-preentry-interaction-child-v1.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: g5-trendrider-causal-research-loop-v2
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic causal loop and resilience controls
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/g5_trendrider_w2_forensic_v1.py \
            backend/research/prep/g5_trendrider_preentry_interaction_child_v1.py \
            backend/research/prep/g5_trendrider_causal_web_research_v1.py \
            backend/research/prep/g5_trendrider_causal_web_research_v2.py \
            backend/research/prep/g5_trendrider_causal_persist_v2.py
          python -m backend.research.prep.g5_trendrider_w2_forensic_v1 --self-test
          python -m backend.research.prep.g5_trendrider_preentry_interaction_child_v1 --self-test
          python -m backend.research.prep.g5_trendrider_causal_web_research_v1 --self-test
          python -m backend.research.prep.g5_trendrider_causal_web_research_v2 --self-test
          python -m backend.research.prep.g5_trendrider_causal_persist_v2 --self-test

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture run authority base
        run: echo "RUN_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify causal-loop code before any paid network call
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/g5_trendrider_w2_forensic_v1.py \
            backend/research/prep/g5_trendrider_preentry_interaction_child_v1.py \
            backend/research/prep/g5_trendrider_causal_web_research_v1.py \
            backend/research/prep/g5_trendrider_causal_web_research_v2.py \
            backend/research/prep/g5_trendrider_causal_persist_v2.py
          python -m backend.research.prep.g5_trendrider_w2_forensic_v1 --self-test
          python -m backend.research.prep.g5_trendrider_preentry_interaction_child_v1 --self-test
          python -m backend.research.prep.g5_trendrider_causal_web_research_v1 --self-test
          python -m backend.research.prep.g5_trendrider_causal_web_research_v2 --self-test
          python -m backend.research.prep.g5_trendrider_causal_persist_v2 --self-test

      - name: Refresh current W2 forensic and bounded child development screen
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.prep.g5_trendrider_w2_forensic_v1 \
            --out out/g5_trendrider_w2_forensic_latest.json
          python -m backend.research.prep.g5_trendrider_preentry_interaction_child_v1 \
            --out out/g5_trendrider_preentry_interaction_child_latest.json
          python - <<'PY'
          import json
          f=json.load(open('out/g5_trendrider_w2_forensic_latest.json'))
          c=json.load(open('out/g5_trendrider_preentry_interaction_child_latest.json'))
          assert f['w2_observed_T']==c['parent']['current_W2_T']
          assert f['parity']['parent_product_matches_top5'] is True
          assert f['parity']['parent_receipt_matches_top5'] is True
          assert f['parity']['duplicate']==0 and f['parity']['integrity_defects']==[] and f['parity']['leakage_lookahead']==0
          assert c['integrity']['source_integrity_defects']==[] and c['integrity']['leakage_lookahead']==0
          assert c['selection_authority'] is False and c['promotion_authority'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED' and c['live_trade_authority']=='BLOCKED'
          print(json.dumps({'forensic_T':f['w2_observed_T'],'axis':f['selected_causal_axis'],'screen_state':c['state']},sort_keys=True))
          PY

      - name: Run bounded retry Gemini Google-Search research and selected-child collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_WEB_RESEARCH_MODEL: ${{ vars.GEMINI_WEB_RESEARCH_MODEL }}
          GEMINI_WEB_RESEARCH_FALLBACK_MODELS: ${{ vars.GEMINI_WEB_RESEARCH_FALLBACK_MODELS }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
        run: |
          set -euo pipefail
          current=backend/research/prep/g5_trendrider_causal_web_research_latest.json
          python -m backend.research.prep.g5_trendrider_causal_web_research_v2 \
            --forensic out/g5_trendrider_w2_forensic_latest.json \
            --screen out/g5_trendrider_preentry_interaction_child_latest.json \
            --current "$current" \
            --out out/g5_trendrider_causal_web_research_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/g5_trendrider_causal_web_research_latest.json'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          assert r['g6_promotion_eligible'] is False
          assert r.get('numeric_threshold_sweep') is False
          assert r.get('symbol_session_side_sweep') is False
          assert r.get('parent_mutation') is False
          assert r.get('exit_risk_cost_mutation') is False
          assert int(r.get('existing_W2_formal_child_credit') or 0)==0
          selected=r.get('selected_candidate')
          if selected:
              assert selected['historical_or_existing_W2_formal_credit']==0
              assert selected['boundary_rule']=='STRICT_SIGNAL_AND_EXIT_AFTER_BOUNDARY'
              assert selected['development']['development_viable'] is True
          p=r.get('provider') or {}
          if r.get('provider_call_this_run'):
              assert p.get('provider')=='gemini'
              assert int(p.get('request_count') or 0)>=1
          if r.get('source_grounding_pass'):
              assert int(p.get('source_count') or 0) >= int(r['grounding_min_sources_required'])
          if r.get('state')=='HOLD_WEB_RESEARCH_PROVIDER_ERROR' and int(p.get('request_count') or 0)>0:
              assert r.get('transient_retryable') is True
              assert r.get('cache_hit') is False
          print(json.dumps({
            'state':r['state'],
            'provider_call':r.get('provider_call_this_run'),
            'request_count':p.get('request_count'),
            'models_attempted':p.get('models_attempted'),
            'cache_hit':r.get('cache_hit'),
            'queries':len(p.get('web_search_queries') or []),
            'sources':p.get('source_count'),
            'selected':(selected or {}).get('mechanism_id'),
            'fresh_T':(r.get('fresh') or {}).get('child_closed_T'),
            'next':r['next'],
          },sort_keys=True))
          PY

      - name: Persist causal chain with authority-aware master race recovery
        run: |
          set -euo pipefail
          forensic_target=backend/research/prep/g5_trendrider_w2_forensic_latest.json
          screen_target=backend/research/prep/g5_trendrider_preentry_interaction_child_latest.json
          research_target=backend/research/prep/g5_trendrider_causal_web_research_latest.json

          apply_candidates() {
            python -m backend.research.prep.g5_trendrider_causal_persist_v2 \
              --forensic-candidate out/g5_trendrider_w2_forensic_latest.json \
              --forensic-target "$forensic_target" \
              --screen-candidate out/g5_trendrider_preentry_interaction_child_latest.json \
              --screen-target "$screen_target" \
              --research-candidate out/g5_trendrider_causal_web_research_latest.json \
              --research-target "$research_target"
          }

          authority_changed_between() {
            local from="$1" to="$2"
            git diff --name-only "$from" "$to" > /tmp/g5-master-changed.txt
            for p in \
              backend/research/prep/g5_trendrider_broad30_product_latest.json \
              backend/research/prep/g5_trendrider_broad30_product_manifest_v1.json \
              backend/research/rebuild/a1_top5_matched_exit_attribution_latest.json \
              backend/research/rebuild/a1_top5_latest_only_ssot_v1.json \
              backend/research/rebuild/trend_policy_batch_v1.py \
              backend/research/rebuild/a1_exact25_generic_evaluator_v1.py \
              backend/research/prep/g5_trendrider_w2_forensic_v1.py \
              backend/research/prep/g5_trendrider_preentry_interaction_child_v1.py \
              backend/research/prep/g5_trendrider_causal_web_research_v1.py \
              backend/research/prep/g5_trendrider_causal_web_research_v2.py \
              backend/research/prep/g5_trendrider_causal_persist_v2.py \
              backend/research/prep/g5_trendrider_w2_forensic_latest.json \
              backend/research/prep/g5_trendrider_preentry_interaction_child_latest.json \
              backend/research/prep/g5_trendrider_causal_web_research_latest.json; do
              if grep -Fxq "$p" /tmp/g5-master-changed.txt; then
                echo "G5_AUTHORITY_MOVED:$p"
                return 0
              fi
            done
            return 1
          }

          git config user.name 'g5-causal-research-writer-v2'
          git config user.email 'actions@users.noreply.github.com'
          apply_candidates
          git add "$forensic_target" "$screen_target" "$research_target"
          if git diff --cached --quiet; then
            echo 'G5_CAUSAL_CHAIN_NO_SEMANTIC_DELTA'
            exit 0
          fi

          git fetch origin master
          remote=$(git rev-parse origin/master)
          if [ "$remote" != "$RUN_BASE_SHA" ]; then
            if authority_changed_between "$RUN_BASE_SHA" "$remote"; then
              echo 'G5_CAUSAL_CHAIN_STALE_AUTHORITY_RECOMPUTE_NEXT_RUN'
              exit 0
            fi
            echo 'G5_CAUSAL_CHAIN_MASTER_MOVED_UNRELATED_REAPPLY'
            git reset --hard "$remote"
            apply_candidates
            git add "$forensic_target" "$screen_target" "$research_target"
            if git diff --cached --quiet; then
              echo 'G5_CAUSAL_CHAIN_NO_DELTA_AFTER_REAPPLY'
              exit 0
            fi
          fi

          git commit -m 'G5: persist resilient grounded causal chain [skip ci]'
          parent=$(git rev-parse HEAD^)
          if git push origin HEAD:master; then
            echo 'PASS_G5_CAUSAL_CHAIN_PERSIST_V2'
            exit 0
          fi

          echo 'G5_CAUSAL_CHAIN_PUSH_RACE_RETRY_ONCE'
          git fetch origin master
          remote2=$(git rev-parse origin/master)
          if authority_changed_between "$parent" "$remote2"; then
            echo 'G5_CAUSAL_CHAIN_RETRY_ABORT_AUTHORITY_MOVED'
            exit 0
          fi
          git reset --hard "$remote2"
          apply_candidates
          git add "$forensic_target" "$screen_target" "$research_target"
          if git diff --cached --quiet; then
            echo 'G5_CAUSAL_CHAIN_NO_DELTA_AFTER_PUSH_RACE'
            exit 0
          fi
          git commit -m 'G5: persist resilient grounded causal chain retry [skip ci]'
          if git push origin HEAD:master; then
            echo 'PASS_G5_CAUSAL_CHAIN_PERSIST_V2_RETRY'
          else
            echo 'G5_CAUSAL_CHAIN_PERSIST_RETRY_EXHAUSTED_SAFE_SKIP'
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-causal-loop-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/g5_trendrider_w2_forensic_latest.json
            out/g5_trendrider_preentry_interaction_child_latest.json
            out/g5_trendrider_causal_web_research_latest.json
          if-no-files-found: error
          retention-days: 90
