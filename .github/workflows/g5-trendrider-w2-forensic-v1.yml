name: G5 TrendRider W2 Forensic V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/prep/g5_trendrider_w2_forensic_v1.py'
      - '.github/workflows/g5-trendrider-w2-forensic-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/prep/g5_trendrider_w2_forensic_v1.py'
      - '.github/workflows/g5-trendrider-w2-forensic-v1.yml'
  workflow_dispatch:
  # Product OOS runs at :37 on 01/05/09/13/17/21 UTC with a 35m timeout.
  # Run forensic 40m later so each persisted [skip ci] product cycle is consumed.
  schedule:
    - cron: '17 2,6,10,14,18,22 * * *'

permissions:
  contents: write

concurrency:
  group: g5-trendrider-w2-forensic-v1
  cancel-in-progress: true

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/prep/g5_trendrider_w2_forensic_v1.py
          python -m backend.research.prep.g5_trendrider_w2_forensic_v1 --self-test
      - name: Run frozen W2 per-trade forensic
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.prep.g5_trendrider_w2_forensic_v1 --out out/g5_trendrider_w2_forensic_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/g5_trendrider_w2_forensic_v1.json'))
          assert r['parity']['w2_count_matches_product'] is True
          assert r['parity']['duplicate']==0
          assert r['parity']['integrity_defects']==[]
          assert r['parity']['leakage_lookahead']==0
          assert r['causal_policy']['parent_retune_forbidden'] is True
          assert r['causal_policy']['parent_W2_continues_to_12T'] is True
          assert r['causal_policy']['reuse_frozen_preentry_materiality'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'w2_T':r['w2_observed_T'],'status':r['causal_status'],'axis':r['selected_causal_axis'],'route':r['recommended_route'],'top_preentry':(r['preentry_ranked_hypotheses'] or [None])[0],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist latest on master
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          target=backend/research/prep/g5_trendrider_w2_forensic_latest.json
          cp out/g5_trendrider_w2_forensic_v1.json "$target"
          git config user.name 'g5-trendrider-w2-forensic'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'G5 TrendRider: persist W2 forensic receipt [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-trendrider-w2-forensic-${{ github.run_id }}
          path: out/g5_trendrider_w2_forensic_v1.json
          if-no-files-found: error
          retention-days: 90
