name: G5A Alpha Proof Preflight V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/contracts/g5a_g5b_lane_local_profit_roadmap_v1.json'
      - 'backend/research/architecture_factory/g5a_alpha_proof_preflight_v1.py'
      - 'backend/research/architecture_factory/a1_common_source_semantic_guard_v1.py'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py'
      - 'backend/research/architecture_factory/g5a_ma001_alpha_proof_bundle_v1.json'
      - 'backend/research/architecture_factory/g5a_g5b_profit_status_v1.json'
      - 'backend/research/architecture_factory/g5a_g5b_profit_status_v1.py'
      - '.github/workflows/g5a-alpha-proof-preflight-v1.yml'
  push:
    branches: [master, research/g5a-g5b-profit-remote-seal-v1]
    paths:
      - 'backend/research/contracts/g5a_g5b_lane_local_profit_roadmap_v1.json'
      - 'backend/research/architecture_factory/g5a_alpha_proof_preflight_v1.py'
      - 'backend/research/architecture_factory/a1_common_source_semantic_guard_v1.py'
      - 'backend/research/architecture_factory/a1_strategy_architecture_factory_v1.py'
      - 'backend/research/architecture_factory/g5a_ma001_alpha_proof_bundle_v1.json'
      - 'backend/research/architecture_factory/g5a_g5b_profit_status_v1.json'
      - 'backend/research/architecture_factory/g5a_g5b_profit_status_v1.py'
      - '.github/workflows/g5a-alpha-proof-preflight-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g5a-alpha-proof-preflight-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paid research cannot run on push or pull request
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          jobs = {
              'g5a-alpha-factory-lane-local-v1.yml': 'research',
              'a1-a5-no-idle-research-v1.yml': 'research',
              'a1-terminal-repair-swarm-v1.yml': 'sweep',
              'a1-terminal-repair-swarm-v4.yml': 'economic-rebuild',
          }
          for workflow, job in jobs.items():
              text = (Path('.github/workflows') / workflow).read_text()
              block = re.split(r'\n  [\w-]+:\n', text.split('\n  ' + job + ':\n', 1)[1], maxsplit=1)[0]
              lines = [line.strip() for line in block.splitlines() if line.strip() and not line.strip().startswith('#')]
              assert lines[0] == "if: github.event_name == 'workflow_dispatch'", (workflow, lines)
          print('PASS_NO_AUTOMATIC_PAID_RESEARCH_OR_REPLAY')
          PY
      - name: Compile and deterministic self-tests
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/alpha_proof/a1_alpha_proof_gate_v1.py \
            backend/research/architecture_factory/a1_common_source_semantic_guard_v1.py \
            backend/research/architecture_factory/g5a_alpha_proof_preflight_v1.py
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 --self-test
          python -m backend.research.architecture_factory.a1_common_source_semantic_guard_v1 --self-test
          python -m backend.research.architecture_factory.g5a_alpha_proof_preflight_v1 --self-test
      - name: Offline G5 state and ledger integration tests
        run: |
          python -m unittest \
            backend.research.rebuild.test_g5_clean_runner_v1 \
            backend.research.rebuild.test_g5_clean_runner_binding_fix_v1 \
            backend.research.rebuild.test_g5_forward_real_evidence_bridge_v1 \
            backend.research.rebuild.test_g5_forward_real_evidence_bridge_v3 \
            backend.research.rebuild.test_g5_data_stale_evidence_v1 \
            backend.research.prep.test_g5_production_economic_ssot_v1
      - name: Regenerate current status from checked-out sources
        run: |
          python -m backend.research.architecture_factory.g5a_g5b_profit_status_v1 \
            --source-master-sha "$(git rev-parse origin/master)" \
            --output out/g5a_g5b_profit_status_v1.json
      - name: Verify frozen MA001 gap evidence without replay or provider calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.research.alpha_proof import a1_alpha_proof_gate_v1 as alpha
          root=Path('backend/research/architecture_factory')
          bundle=json.loads((root/'g5a_ma001_alpha_proof_bundle_v1.json').read_text())
          status=json.loads(Path('out/g5a_g5b_profit_status_v1.json').read_text())
          assert bundle['bundle_sha256']==alpha.sha({k:v for k,v in bundle.items() if k!='bundle_sha256'})
          assert status['receipt_sha256']==alpha.sha({k:v for k,v in status.items() if k!='receipt_sha256'})
          assert status['bundle_sha256']==bundle['bundle_sha256']
          proof=alpha.evaluate_bundle(bundle)
          assert proof==status['alpha_proof_receipt']
          assert proof['state']=='HOLD_ALPHA_PROOF'
          assert status['generation_complete'] is False
          assert status['G5B_operational_complete'] is False
          assert status['G5B_economic_terminal'] is False
          assert status['order_authority']=='BLOCKED' and status['live_trade_authority']=='BLOCKED'
          assert all(row['supports_mechanism'] is False for row in bundle['primary_evidence']['audited_references'])
          print('PASS_MA001_SOURCE_BOUND_GAP_PACKET_NO_ECONOMIC_CREDIT')
          PY
      - name: Evaluate current canonical G5A candidate fail-closed
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.g5a_alpha_proof_preflight_v1 \
            --input backend/research/architecture_factory/g5a_alpha_factory_latest.json \
            --output out/g5a_alpha_proof_preflight_latest.json
          python - <<'PY'
          import json
          r=json.load(open('out/g5a_alpha_proof_preflight_latest.json'))
          assert r['selection_authority'] is False and r['promotion_authority'] is False, r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED', r
          assert r['exchange_order_submitted'] is False and int(r['protected_mutations'])==0, r
          assert r['g5b_fresh_boundary_created'] is False and r['g5b_entry_authorized'] is False, r
          if r['state']!='PASS_G5A_ALPHA_PROOF_READY_FOR_DETERMINISTIC_REPLAY':
              assert r['deterministic_replay_authorized'] is False, r
              assert r['failed_gates'], r
          print(json.dumps({
            'state':r['state'],
            'candidate':r.get('source_candidate_id'),
            'alpha_proof_state':r.get('alpha_proof_state'),
            'failed_gates':r.get('failed_gates'),
            'replay_authorized':r.get('deterministic_replay_authorized'),
            'g5b_entered':r.get('g5b_entry_authorized'),
            'receipt':r.get('receipt_sha256'),
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5a-alpha-proof-preflight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            out/g5a_alpha_proof_preflight_latest.json
            out/g5a_g5b_profit_status_v1.json
      - name: Persist current G5A alpha-proof boundary receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git config user.name 'g5a-alpha-proof-preflight-v1'
          git config user.email 'actions@users.noreply.github.com'
          for n in 1 2 3; do
            git pull --rebase origin master
            python -m backend.research.architecture_factory.g5a_alpha_proof_preflight_v1 \
              --input backend/research/architecture_factory/g5a_alpha_factory_latest.json \
              --output backend/research/architecture_factory/g5a_alpha_proof_preflight_latest.json
            python -m backend.research.architecture_factory.g5a_g5b_profit_status_v1 \
              --source-master-sha "$(git rev-parse origin/master)" \
              --output backend/research/architecture_factory/g5a_g5b_profit_status_v1.json
            git add backend/research/architecture_factory/g5a_alpha_proof_preflight_latest.json \
              backend/research/architecture_factory/g5a_g5b_profit_status_v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5A: persist current remote-seal boundary receipts [skip ci]'
            git push origin HEAD:master && exit 0
          done
          exit 1
