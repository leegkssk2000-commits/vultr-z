name: G5A Stage Source Cost Development V1

on:
  push:
    branches: [master, research/g5a-stage-source-cost-first-candidate-v1]
    paths:
      - 'backend/research/contracts/g5a_stage_source_cost_contract_v1.json'
      - 'backend/research/contracts/p3_clean_native_epoch_v1.json'
      - 'backend/research/architecture_factory/g5a_development_data_v1.py'
      - 'backend/research/architecture_factory/g5a_stage_*.py'
      - 'backend/research/architecture_factory/test_g5a_stage_*.py'
      - '.github/workflows/g5a-stage-source-cost-v1.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/contracts/g5a_stage_source_cost_contract_v1.json'
      - 'backend/research/contracts/p3_clean_native_epoch_v1.json'
      - 'backend/research/architecture_factory/g5a_development_data_v1.py'
      - 'backend/research/architecture_factory/g5a_stage_*'
      - 'backend/research/architecture_factory/test_g5a_stage_*.py'
      - '.github/workflows/g5a-stage-source-cost-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g5a-stage-source-cost-development-v1
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
      DATA_BRANCH: g5a-stage-development-data-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source-only acquisition
        run: |
          python -m py_compile backend/research/architecture_factory/g5a_development_data_v1.py backend/research/architecture_factory/g5a_stage_admission_v1.py backend/research/architecture_factory/g5a_stage_candidate_v1.py
          python -m unittest backend.research.architecture_factory.test_g5a_stage_admission_v1 -q
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 --self-test
      - name: Restore immutable data if already acquired
        run: |
          set -euo pipefail
          mkdir -p /tmp/g5a-data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch origin "$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git archive "origin/$DATA_BRANCH" research/data/g5a_stage_v1 | tar -x -C /tmp/g5a-data
          fi
      - name: Collect maximum available closed history and native clean epoch without outcomes
        if: github.event_name != 'pull_request'
        run: python -m backend.research.architecture_factory.g5a_development_data_v1 --output /tmp/g5a-data/research/data/g5a_stage_v1
      - name: Verify immutable dataset and split contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from backend.research.architecture_factory.g5a_development_data_v1 import verify_dataset, read, CONTRACT
          r=verify_dataset(Path('/tmp/g5a-data/research/data/g5a_stage_v1'),read(CONTRACT))
          assert r['outcomes_computed'] is False and r['fresh_credit']==0
          print('PASS_IMMUTABLE_DEVELOPMENT_DATA',r['dataset_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5a-stage-development-${{ github.run_id }}
          path: /tmp/g5a-data/research/data/g5a_stage_v1
          if-no-files-found: error
      - name: Persist immutable development data and append-only new epoch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g5a-data-repo
          cd /tmp/g5a-data-repo
          git init
          git config user.name 'g5a-stage-data-owner'
          git config user.email 'actions@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch origin "$DATA_BRANCH"
            git checkout -b "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
          fi
          mkdir -p research/data
          cp -a /tmp/g5a-data/research/data/g5a_stage_v1 research/data/
          git add research/data/g5a_stage_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "G5A: freeze development data and clean native epoch ${GITHUB_RUN_ID} [skip ci]"
          git push origin "$DATA_BRANCH"
      - name: Verify stage admission and the frozen candidate terminal from durable data
        run: |
          set -euo pipefail
          git fetch origin "$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
          mkdir -p /tmp/g5a-durable-input
          git archive "origin/$DATA_BRANCH" research/data/g5a_stage_v1 | tar -x -C /tmp/g5a-durable-input
          python -m backend.research.architecture_factory.g5a_stage_admission_v1 --data-dir /tmp/g5a-durable-input/research/data/g5a_stage_v1 --data-ref "$(git rev-parse origin/$DATA_BRANCH)"
          python -m backend.research.architecture_factory.g5a_stage_candidate_v1
          git diff --exit-code -- backend/research/architecture_factory/g5a_stage_candidate_terminal_v1.json backend/research/architecture_factory/g5a_alpha_factory_latest.json backend/research/architecture_factory/g5a_ma001_alpha_proof_bundle_v1.json backend/research/rebuild/g5_clean_runner_contract_effective_v1.json backend/research/rebuild/g5_forward_real_bridge_state_v1.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: g5a-stage-admission-${{ github.run_id }}
          path: |
            backend/research/architecture_factory/g5a_stage_admission_latest_v1.json
            backend/research/architecture_factory/g5a_stage_candidate_terminal_v1.json
