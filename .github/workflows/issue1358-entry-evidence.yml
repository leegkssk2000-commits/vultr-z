name: Issue1358 saved entry evidence
on:
  push:
    branches: [codex/issue1358-entry-evidence-20261005]
    paths: ['.github/workflows/issue1358-entry-evidence.yml', 'ops/issue1358_entry_evidence_v1.py', 'tests/test_issue1358_entry_evidence_v1.py', 'research/campaigns/scalp7_20261005/entry_edge_pilot_v1/**']
  pull_request:
    branches: [master]
    paths: ['.github/workflows/issue1358-entry-evidence.yml', 'ops/issue1358_entry_evidence_v1.py', 'tests/test_issue1358_entry_evidence_v1.py', 'research/campaigns/scalp7_20261005/entry_edge_pilot_v1/**']
permissions:
  contents: read
concurrency:
  group: issue1358-entry-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  saved-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Canonical precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Deterministic fixtures and saved packet only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/entry-evidence"
          python3 -m unittest discover -s tests -p 'test_issue1358_entry_evidence_v1.py' -v 2>&1 | tee "$RUNNER_TEMP/entry-evidence/tests.log"
          echo 'NEW_ECONOMIC_EXECUTIONS=0; SIGNAL_GENERATION=0; MODEL_PATH_REPLAY=0'
          tar -czf "$RUNNER_TEMP/entry-evidence/source-and-evidence.tar.gz" ops/issue1358_entry_evidence_v1.py tests/test_issue1358_entry_evidence_v1.py research/campaigns/scalp7_20261005/entry_edge_pilot_v1 .github/workflows/issue1358-entry-evidence.yml
      - name: Canonical postcheck
        if: always()
        run: |
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1358-entry-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/entry-evidence/
          if-no-files-found: error
          retention-days: 90
