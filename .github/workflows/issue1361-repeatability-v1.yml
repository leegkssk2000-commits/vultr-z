name: issue1361-repeatability-v1

on:
  pull_request:
    paths:
      - '.github/workflows/issue1361-repeatability-v1.yml'
      - 'ops/issue1361_repeatability_v1.py'
      - 'ops/issue1361_history_v1.py'
      - 'ops/issue1361_history_batch_v1.py'
      - 'tests/test_scalp7_issue1361_repeatability_v1.py'
      - 'tests/test_issue1361_history_v1.py'
      - 'tests/test_issue1361_history_batch_v1.py'
      - 'research/campaigns/scalp7_20261006/issue1361_repeatability_v1/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/issue1361-repeatability-v1.yml'
      - 'ops/issue1361_repeatability_v1.py'
      - 'ops/issue1361_history_v1.py'
      - 'ops/issue1361_history_batch_v1.py'
      - 'tests/test_scalp7_issue1361_repeatability_v1.py'
      - 'tests/test_issue1361_history_v1.py'
      - 'tests/test_issue1361_history_batch_v1.py'
      - 'research/campaigns/scalp7_20261006/issue1361_repeatability_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue1361-repeatability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1 pytest==9.0.2
      - name: Focused chronology and source tests
        run: >-
          python -m pytest -q
          tests/test_scalp7_issue1361_repeatability_v1.py
          tests/test_issue1361_history_v1.py
          tests/test_issue1361_history_batch_v1.py
          tests/test_scalp7_rolling_context_v2.py
          tests/test_scalp7_source_data_v2.py
          tests/test_issue1358_ema21_limit_v1.py
      - name: Metadata-only preflight
        run: >-
          python ops/issue1361_repeatability_v1.py
          --source-root "$RUNNER_TEMP/not-present"
          --output "$RUNNER_TEMP/issue1361-preflight.json"
      - uses: actions/upload-artifact@v4
        with:
          name: issue1361-contract-preflight
          path: ${{ runner.temp }}/issue1361-preflight.json
          if-no-files-found: error

  source-inventory:
    # The exact token is a one-shot recovery for environments whose GitHub
    # connector cannot call workflow_dispatch. It remains bound to a reviewed
    # merge commit on master and does not open the economic jobs.
    if: >-
      github.ref == 'refs/heads/master' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(
            github.event.head_commit.message,
            '[issue1361-source-inventory-once-20261006T0202Z-a90ab50]'
          )
        )
      )
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a114e56b3f5ec50efe3de606684da20b91d5a9a
          persist-credentials: false
      - name: Verify immutable reviewed inventory executable
        run: |
          printf '%s  %s\n' \
            '4dadc6748122038fe2f46c375030ca8622e48555451d06bd6e3fd89b066f532e' \
            'ops/issue1361_repeatability_v1.py' \
            | sha256sum --check --strict
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
      - name: Configure existing SSH credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only canonical archive inventory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            python3 - --source-root /home/z/z/runtime/economic7_campaign_20260915 \
            < ops/issue1361_repeatability_v1.py \
            > "$RUNNER_TEMP/issue1361-source-inventory.json"
      - name: Assert probe made no service or network action
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'issue1361-source-inventory.json'
          row = json.loads(p.read_text())
          inventory = row['inventory']
          assert inventory['network_actions'] == 0
          assert inventory['service_actions'] == 0
          print(inventory['history_input_state'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue1361-canonical-source-inventory
          path: ${{ runner.temp }}/issue1361-source-inventory.json
          if-no-files-found: error

  source-fit-artifact:
    # A reviewed, single-use source-only activation.  The activation commit
    # must add exactly one receipt file on top of the reviewed source commit.
    # This job fits the three past-only contexts but forms no test signal,
    # creates no economic claim, and runs neither execution engine.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      (
      contains(
        github.event.head_commit.message,
        '[issue1361-fit-artifact-once-20261006T1230Z-3f2d71a]'
      ) ||
      contains(
        github.event.head_commit.message,
        '[issue1361-fit-artifact-repair1-once-20261006T1310Z-6d9a1c4]'
      ) ||
      contains(
        github.event.head_commit.message,
        '[issue1361-fit-artifact-repair2-once-20261006T1330Z-c82ef51]'
      ) ||
      contains(
        github.event.head_commit.message,
        '[issue1361-fit-artifact-merge-churn-once-20261006T1345Z-3aa4d8e]'
      )
      )
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source-only activation descendant
        id: activation
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          activation_dir = Path(
              'research/campaigns/scalp7_20261006/issue1361_repeatability_v1'
          )
          tokens = {
              activation_dir / 'FIT_ARTIFACT_ACTIVATION.json':
                  (
                      '[issue1361-fit-artifact-once-20261006T1230Z-3f2d71a]',
                      '7d0f8d5efb6e539ad093e53e019c6d05715f2738',
                  ),
              activation_dir / 'FIT_ARTIFACT_ACTIVATION_REPAIR1.json':
                  (
                      '[issue1361-fit-artifact-repair1-once-20261006T1310Z-6d9a1c4]',
                      '9b6cfb0aa644978fb08e34c37d1d9c23d81b010d',
                  ),
              activation_dir / 'FIT_ARTIFACT_ACTIVATION_REPAIR2.json':
                  (
                      '[issue1361-fit-artifact-repair2-once-20261006T1330Z-c82ef51]',
                      '4165d7b6c1d66696b4cdd627495262876ff6d378',
                  ),
              activation_dir / 'FIT_ARTIFACT_ACTIVATION_MERGE_CHURN.json':
                  (
                      '[issue1361-fit-artifact-merge-churn-once-20261006T1345Z-3aa4d8e]',
                      '13d5a9c1753db9cc899f8d419031d5ddb220fb05',
                  ),
          }
          message = subprocess.check_output(
              ['git', 'log', '-1', '--pretty=%B', 'HEAD'], text=True
          )
          selected = [
              (path, token, approved_source)
              for path, (token, approved_source) in tokens.items()
              if token in message
          ]
          if len(selected) != 1:
              raise SystemExit('FIT_ACTIVATION_TOKEN_AMBIGUOUS_OR_MISSING')
          activation_path, activation_token, approved_source = selected[0]
          activation = json.loads(activation_path.read_bytes())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(
              ['git', 'diff', '--name-status', '--no-renames', parent, head],
              text=True,
          ).splitlines()
          prior = subprocess.check_output(
              ['git', 'rev-list', parent, '--', str(activation_path)],
              text=True,
          ).splitlines()
          required = {
              'schema': 'zel.issue1361.fit_artifact_activation.v1',
              'issue': 1361,
              'source_head': approved_source,
              'mode': 'FIT_ONLY_NO_TEST_SIGNALS_NO_ECONOMIC_CLAIM',
              'token': activation_token,
          }
          if any(activation.get(k) != v for k, v in required.items()):
              raise SystemExit('FIT_ACTIVATION_PROFILE_MISMATCH')
          source_head = approved_source
          if not isinstance(source_head, str) or not re.fullmatch(r'[0-9a-f]{40}', source_head):
              raise SystemExit('FIT_ACTIVATION_SOURCE_HEAD_INVALID')
          if subprocess.run(
              ['git', 'merge-base', '--is-ancestor', source_head, parent],
              check=False,
          ).returncode != 0:
              raise SystemExit('FIT_ACTIVATION_SOURCE_NOT_PARENT_ANCESTOR')
          if activation.get('activation_head') not in (None, head):
              raise SystemExit('FIT_ACTIVATION_HEAD_MISMATCH')
          if changed != ['A\t' + str(activation_path)]:
              raise SystemExit('FIT_ACTIVATION_NOT_NEW_SINGLE_FILE')
          if prior:
              raise SystemExit('FIT_ACTIVATION_PATH_ALREADY_IN_HISTORY')
          if activation.get('H_claimed') != 0 or activation.get('economic_runs') != 0:
              raise SystemExit('FIT_ACTIVATION_ECONOMIC_STATE')
          out = Path(os.environ['RUNNER_TEMP']) / 'FIT_ARTIFACT_ACTIVATION.json'
          out.write_bytes(activation_path.read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f'source_head={source_head}\n')
              handle.write(f'activation_head={head}\n')
          PY
      - name: Checkout exact reviewed source
        run: git checkout --detach '${{ steps.activation.outputs.source_head }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen fit runtime
        run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
      - name: Configure existing SSH credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read canonical archive without remote mutation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            tar -C /home/z/z/runtime/economic7_campaign_20260915 -czf - \
              canonical_12m canonical_gapday_prefix canonical_postgap_20260213 \
            > "$RUNNER_TEMP/issue1361-source.tar.gz"
          test -s "$RUNNER_TEMP/issue1361-source.tar.gz"
      - name: Reject unsafe archive members and extract
        run: |
          stage=/home/z/z/runtime/economic7_campaign_20260915
          test ! -e "$stage"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$stage"
          printf '%s\n' issue1361-ephemeral-source-stage > "$stage/.issue1361-runner-stage"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ['RUNNER_TEMP']) / 'issue1361-source.tar.gz'
          destination = Path('/home/z/z/runtime/economic7_campaign_20260915')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) > 100_000 or sum(item.size for item in members) > 12 * 1024**3:
                  raise SystemExit('SOURCE_ARCHIVE_BOUND_EXCEEDED')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or not (member.isdir() or member.isfile())
                      or not path.parts
                      or path.parts[0] not in {
                          'canonical_12m',
                          'canonical_gapday_prefix',
                          'canonical_postgap_20260213',
                      }
                  ):
                      raise SystemExit('UNSAFE_SOURCE_ARCHIVE_MEMBER:' + member.name)
              handle.extractall(destination, filter='data')
          PY
      - name: Create fit-only manifest under frozen runtime
        run: |
          python -m ops.issue1361_history_v1 prepare \
            --source-root /home/z/z/runtime/economic7_campaign_20260915 \
            --cache-dir "$RUNNER_TEMP/unused-cache" \
            --output "$RUNNER_TEMP/FIT_MANIFEST.json"
      - name: Persist source and fit receipt
        env:
          SOURCE_HEAD: ${{ steps.activation.outputs.source_head }}
          ACTIVATION_HEAD: ${{ steps.activation.outputs.activation_head }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'FIT_MANIFEST.json').read_bytes())
          archive = root / 'issue1361-source.tar.gz'
          archive_digest = hashlib.sha256()
          with archive.open('rb') as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b''):
                  archive_digest.update(block)
          receipt = {
              'schema': 'zel.issue1361.fit_artifact_receipt.v1',
              'issue': 1361,
              'source_head': os.environ['SOURCE_HEAD'],
              'activation_head': os.environ['ACTIVATION_HEAD'],
              'source_inventory_sha256': manifest['source']['full_inventory_sha256'],
              'source_inventory_files': manifest['source']['full_inventory_files'],
              'transfer_archive_sha256': archive_digest.hexdigest(),
              'transfer_archive_bytes': archive.stat().st_size,
              'manifest_sha256': manifest['manifest_sha256'],
              'coverage_sha256': manifest['coverage_sha256'],
              'fit_sha256': {row['id']: row['fit']['sha256'] for row in manifest['fits']},
              'runtime': manifest['runtime'],
              'classification': manifest['classification'],
              'test_period_signal_generation': 0,
              'test_period_model_replays': 0,
              'H_claimed': 0,
              'economic_runs': 0,
              'source_transport': 'EXISTING_SSH_READ_ONLY',
              'market_data_requests': 0,
              'service_actions': 0,
              'order_authority': 'BLOCKED',
          }
          raw = (json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n').encode()
          receipt['receipt_sha256'] = hashlib.sha256(raw).hexdigest()
          (root / 'SOURCE_FIT_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Remove transferred source and credential
        if: always()
        run: |
          rm -f ~/.ssh/vps_key "$RUNNER_TEMP/issue1361-source.tar.gz"
          stage=/home/z/z/runtime/economic7_campaign_20260915
          if [ -f "$stage/.issue1361-runner-stage" ]; then
            sudo rm -rf -- "$stage"
          fi
          sudo rmdir --ignore-fail-on-non-empty /home/z/z/runtime /home/z/z /home/z 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: issue1361-source-fit-manifest
          path: |
            ${{ runner.temp }}/FIT_MANIFEST.json
            ${{ runner.temp }}/SOURCE_FIT_RECEIPT.json
            ${{ runner.temp }}/FIT_ARTIFACT_ACTIVATION.json
          if-no-files-found: error

  history-economic-batch:
    # This is the only H economic activation.  It remains separate from the
    # source-fit job and refuses to form a signal until both immutable external
    # approval and permanent six-instance claim refs validate.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      contains(
        github.event.head_commit.message,
        '[issue1361-history-batch-once-20261006T1420Z-f18d2c7]'
      )
    needs: contract-tests
    runs-on: ubuntu-latest
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one-shot H activation
        id: activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from ops import issue1361_history_batch_v1 as batch

          path = Path('research/campaigns/scalp7_20261006/issue1361_repeatability_v1/HISTORY_BATCH_ACTIVATION.json')
          token = '[issue1361-history-batch-once-20261006T1420Z-f18d2c7]'
          value = json.loads(path.read_bytes())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(
              ['git', 'diff', '--name-status', '--no-renames', parent, head], text=True
          ).splitlines()
          message = subprocess.check_output(['git', 'log', '-1', '--pretty=%B'], text=True)
          required = {
              'schema': 'zel.issue1361.history_batch_activation.v1',
              'issue': 1361,
              'token': token,
              'fit_artifact_id': 11419311671,
              'fit_artifact_digest': 'sha256:a39e65afc4c7557a4864a4a0192b6278cdba51a051969b684f20c97da4f73d1f',
              'manifest_sha256': '21f5a3ddd6cc49faef9d7964879dc6c08b4f6f46141941bcf60130a21791a49f',
              'fit_receipt_sha256': '210251e2e9268877a8463c4a96cc5867df94aaf50dd7d845cf20bf90e869fa1a',
              'fit_source_head': '13d5a9c1753db9cc899f8d419031d5ddb220fb05',
              'approval_ref': 'refs/heads/research-approvals/issue1361-history-20261006-v1',
              'claim_ref': 'refs/heads/research-execution-claims/issue1361-history-20261006-v1',
              'economic_instances': 6,
              'order_authority': 'BLOCKED',
          }
          if token not in message or any(value.get(k) != v for k, v in required.items()):
              raise SystemExit('HISTORY_ACTIVATION_PROFILE_MISMATCH')
          approval = batch.verified_approval()
          if value.get('approval_commit_sha') != approval.get('approval_commit_sha'):
              raise SystemExit('HISTORY_APPROVAL_COMMIT_NOT_PINNED')
          claim = batch.verified_claim()
          if value.get('claim_commit_sha') != claim.get('claim_commit_sha'):
              raise SystemExit('HISTORY_CLAIM_COMMIT_NOT_PINNED')
          source = value.get('reviewed_source_sha')
          if not isinstance(source, str) or not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('HISTORY_REVIEWED_SOURCE_INVALID')
          if source != approval.get('reviewed_source_sha'):
              raise SystemExit('HISTORY_REVIEWED_SOURCE_NOT_APPROVED')
          for key in ('fit_artifact_id', 'fit_artifact_digest', 'fit_receipt_sha256'):
              if value.get(key) != approval.get(key):
                  raise SystemExit('HISTORY_ARTIFACT_NOT_APPROVED:' + key)
          if subprocess.run(['git', 'merge-base', '--is-ancestor', source, parent]).returncode:
              raise SystemExit('HISTORY_REVIEWED_SOURCE_NOT_ANCESTOR')
          expected_changed = [
              'M\t.github/workflows/issue1361-repeatability-v1.yml',
              'A\t' + str(path),
              'M\ttests/test_scalp7_issue1361_repeatability_v1.py',
          ]
          if changed != expected_changed:
              raise SystemExit('HISTORY_ACTIVATION_CHANGED_PATH_PROFILE')
          if subprocess.check_output(['git', 'rev-list', parent, '--', str(path)], text=True).splitlines():
              raise SystemExit('HISTORY_ACTIVATION_PATH_ALREADY_USED')
          out = Path(os.environ['RUNNER_TEMP']) / 'HISTORY_BATCH_ACTIVATION.json'
          out.write_bytes(path.read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f'reviewed_source_sha={source}\n')
          PY
      - name: Checkout exact reviewed H executable
        run: git checkout --detach '${{ steps.activation.outputs.reviewed_source_sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen economic runtime
        run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1
      - name: Download and verify exact fit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts/11419311671 > "$RUNNER_TEMP/artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['RUNNER_TEMP']) / 'artifact.json').read_bytes())
          assert row['id'] == 11419311671
          assert row['name'] == 'issue1361-source-fit-manifest'
          assert row['digest'] == 'sha256:a39e65afc4c7557a4864a4a0192b6278cdba51a051969b684f20c97da4f73d1f'
          assert row['expired'] is False
          assert row['workflow_run']['id'] == 37475710645
          PY
          gh api /repos/${{ github.repository }}/actions/artifacts/11419311671/zip > "$RUNNER_TEMP/fit.zip"
          printf '%s  %s\n' \
            'a39e65afc4c7557a4864a4a0192b6278cdba51a051969b684f20c97da4f73d1f' \
            "$RUNNER_TEMP/fit.zip" | sha256sum --check --strict
          install -d "$RUNNER_TEMP/fit"
          unzip -q "$RUNNER_TEMP/fit.zip" -d "$RUNNER_TEMP/fit"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'fit'
          manifest = json.loads((root / 'FIT_MANIFEST.json').read_bytes())
          receipt = json.loads((root / 'SOURCE_FIT_RECEIPT.json').read_bytes())
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n').encode()
          manifest_hash = manifest.pop('manifest_sha256')
          receipt_hash = receipt.pop('receipt_sha256')
          assert manifest_hash == '21f5a3ddd6cc49faef9d7964879dc6c08b4f6f46141941bcf60130a21791a49f'
          assert hashlib.sha256(canonical(manifest)).hexdigest() == manifest_hash
          assert receipt_hash == '210251e2e9268877a8463c4a96cc5867df94aaf50dd7d845cf20bf90e869fa1a'
          assert hashlib.sha256(canonical(receipt)).hexdigest() == receipt_hash
          assert receipt['source_head'] == '13d5a9c1753db9cc899f8d419031d5ddb220fb05'
          PY
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
      - name: Configure existing SSH credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read canonical archive without remote mutation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            tar -C /home/z/z/runtime/economic7_campaign_20260915 -czf - \
              canonical_12m canonical_gapday_prefix canonical_postgap_20260213 \
            > "$RUNNER_TEMP/issue1361-source.tar.gz"
          test -s "$RUNNER_TEMP/issue1361-source.tar.gz"
      - name: Reject unsafe archive members and stage source
        run: |
          stage=/home/z/z/runtime/economic7_campaign_20260915
          test ! -e "$stage"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$stage"
          printf '%s\n' issue1361-ephemeral-history-stage > "$stage/.issue1361-runner-stage"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'issue1361-source.tar.gz'
          destination = Path('/home/z/z/runtime/economic7_campaign_20260915')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) > 100_000 or sum(row.size for row in members) > 12 * 1024**3:
                  raise SystemExit('SOURCE_ARCHIVE_BOUND_EXCEEDED')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (path.is_absolute() or '..' in path.parts or not (member.isdir() or member.isfile())
                      or not path.parts or path.parts[0] not in {'canonical_12m', 'canonical_gapday_prefix', 'canonical_postgap_20260213'}):
                      raise SystemExit('UNSAFE_SOURCE_ARCHIVE_MEMBER:' + member.name)
              handle.extractall(destination, filter='data')
          PY
      - name: Execute claimed H1 through H3 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ops.issue1361_history_batch_v1 \
            --source-root /home/z/z/runtime/economic7_campaign_20260915 \
            --manifest "$RUNNER_TEMP/fit/FIT_MANIFEST.json" \
            --output "$RUNNER_TEMP/H_RESULTS"
      - name: Remove transferred source and credential
        if: always()
        run: |
          rm -f ~/.ssh/vps_key "$RUNNER_TEMP/issue1361-source.tar.gz" "$RUNNER_TEMP/fit.zip"
          stage=/home/z/z/runtime/economic7_campaign_20260915
          if [ -f "$stage/.issue1361-runner-stage" ]; then
            sudo rm -rf -- "$stage"
          fi
          sudo rmdir --ignore-fail-on-non-empty /home/z/z/runtime /home/z/z /home/z 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1361-history-economic-results
          path: |
            ${{ runner.temp }}/H_RESULTS
            ${{ runner.temp }}/HISTORY_BATCH_ACTIVATION.json
            ${{ runner.temp }}/fit/FIT_MANIFEST.json
            ${{ runner.temp }}/fit/SOURCE_FIT_RECEIPT.json
          if-no-files-found: error
