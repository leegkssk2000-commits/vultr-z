name: issue1377-keltner-orthogonal-v1

on:
  pull_request:
    paths:
      - '.github/workflows/issue1377-keltner-orthogonal-v1.yml'
      - 'backend/research/rebuild/scalp7_mr_formation_v2.py'
      - 'backend/research/rebuild/issue1377_saved_ledger_audit_v1.py'
      - 'backend/research/rebuild/scalp7_source_data_v2.py'
      - 'backend/research/rebuild/scalp7_source_binding_repair_v2.py'
      - 'backend/research/rebuild/scalp7_execution_v2.py'
      - 'backend/research/rebuild/scalp7_metrics_v2.py'
      - 'ops/issue1377_mr_batch_v1.py'
      - 'tests/test_scalp7_mr_formation_v2.py'
      - 'tests/test_issue1377_saved_ledger_audit_v1.py'
      - 'tests/test_issue1377_mr_batch_v1.py'
      - 'research/campaigns/scalp7_20260915/cost_snapshot_v2/SCALP7_CURRENT_REFERENCE_COST_SNAPSHOT_V2.json'
      - 'research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/**'

permissions:
  contents: read

concurrency:
  group: issue1377-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1 pytest==9.0.2
      - name: Saved-ledger and fixture tests
        run: >-
          python -m pytest -q
          tests/test_scalp7_mr_formation_v2.py
          tests/test_issue1377_saved_ledger_audit_v1.py
          tests/test_issue1377_mr_batch_v1.py
      - name: Recompute immutable saved-ledger deliverable
        run: python backend/research/rebuild/issue1377_saved_ledger_audit_v1.py verify
      - name: Syntax and whitespace
        run: |
          python -m py_compile \
            backend/research/rebuild/scalp7_mr_formation_v2.py \
            backend/research/rebuild/issue1377_saved_ledger_audit_v1.py \
            ops/issue1377_mr_batch_v1.py
          git diff --check
