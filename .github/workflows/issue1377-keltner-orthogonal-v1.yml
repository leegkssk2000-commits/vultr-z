name: issue1377-keltner-orthogonal-v1

on:
  pull_request:
    paths:
      - '.github/workflows/issue1377-keltner-orthogonal-v1.yml'
      - 'backend/research/rebuild/scalp7_mr_formation_v2.py'
      - 'backend/research/rebuild/scalp7_mr_cost2_child_v1.py'
      - 'backend/research/rebuild/issue1377_saved_ledger_audit_v1.py'
      - 'backend/research/rebuild/scalp7_source_data_v2.py'
      - 'backend/research/rebuild/scalp7_source_binding_repair_v2.py'
      - 'backend/research/rebuild/scalp7_execution_v2.py'
      - 'backend/research/rebuild/scalp7_metrics_v2.py'
      - 'ops/issue1377_mr_batch_v1.py'
      - 'tests/test_scalp7_mr_formation_v2.py'
      - 'tests/test_scalp7_mr_cost2_child_v1.py'
      - 'tests/fixtures/scalp7_mr_cost2_child_v1/**'
      - 'tests/test_issue1377_saved_ledger_audit_v1.py'
      - 'tests/test_issue1377_mr_batch_v1.py'
      - 'research/campaigns/scalp7_20260915/cost_snapshot_v2/SCALP7_CURRENT_REFERENCE_COST_SNAPSHOT_V2.json'
      - 'research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/issue1377-keltner-orthogonal-v1.yml'
      - 'ops/issue1377_mr_batch_v1.py'
      - 'tests/test_issue1377_mr_batch_v1.py'
      - 'research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_ACTIVATION.json'
      - 'research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_RECOVERY.json'
      - 'research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_IMPLEMENTATION_REPAIR.json'

permissions:
  contents: read

concurrency:
  group: issue1377-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1 pytest==9.0.2
      - name: Saved-ledger and fixture tests
        run: >-
          python -m pytest -q
          tests/test_scalp7_mr_formation_v2.py
          tests/test_scalp7_mr_cost2_child_v1.py
          tests/test_issue1377_saved_ledger_audit_v1.py
          tests/test_issue1377_mr_batch_v1.py
      - name: Recompute immutable saved-ledger deliverable
        run: python backend/research/rebuild/issue1377_saved_ledger_audit_v1.py verify
      - name: Syntax and whitespace
        run: |
          python -m py_compile \
            backend/research/rebuild/scalp7_mr_formation_v2.py \
            backend/research/rebuild/scalp7_mr_cost2_child_v1.py \
            backend/research/rebuild/issue1377_saved_ledger_audit_v1.py \
            ops/issue1377_mr_batch_v1.py
          git diff --check

  economic-v8:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      (
        contains(
          github.event.head_commit.message,
          '[issue1377-mr-v8-once-20261007T0210Z-7631c9a]'
        ) ||
        contains(
          github.event.head_commit.message,
          '[issue1377-mr-v8-prestart-recovery-1-20261007T0220Z-542be1c]'
        ) ||
        contains(
          github.event.head_commit.message,
          '[issue1377-mr-v8-import-repair-1-20261007T0350Z-4c8bd20]'
        )
      )
    needs: exact-source-contract-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed one-shot V8 activation
        id: activation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = '[issue1377-mr-v8-once-20261007T0210Z-7631c9a]'
          recovery_token = '[issue1377-mr-v8-prestart-recovery-1-20261007T0220Z-542be1c]'
          repair_token = '[issue1377-mr-v8-import-repair-1-20261007T0350Z-4c8bd20]'
          primary_path = Path('research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_ACTIVATION.json')
          recovery_path = Path('research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_RECOVERY.json')
          repair_path = Path('research/campaigns/scalp7_20261006/issue1377_keltner_orthogonal_v1/V8_EXECUTION_IMPLEMENTATION_REPAIR.json')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          message = subprocess.check_output(['git', 'log', '-1', '--pretty=%B'], text=True)
          primary = token in message
          recovery = recovery_token in message
          repair = repair_token in message
          if sum((primary, recovery, repair)) != 1:
              raise SystemExit('ISSUE1377_V8_ACTIVATION_TOKEN_PROFILE')
          path = repair_path if repair else (recovery_path if recovery else primary_path)
          value = json.loads(path.read_bytes())
          changed = subprocess.check_output(
              ['git', 'diff', '--name-status', '--no-renames', parent, head], text=True
          ).splitlines()
          required = {
              'schema': 'zel.issue1377.mr_v8_activation.v1',
              'issue': 1377,
              'v8_comment_id': 6029066402,
              'token': token,
              'source_inventory_sha256': '53c64616fa98ddd446533cbc7b8e90eb2866ce9b1b0b3243df4211d59f155ba2',
              'rule_sha256': 'e32154e58d0c04fb77376f0e1e0433bd7c6c6c272fbd1c10d04decaadf70ee7a',
              'cost_sha256': 'cb9c337d95aa9eb65c32776ca68c63390350c501de4df8024b5416ed778dbe73',
              'period_ms': [1768262400000, 1781654400000],
              'instance_ids': ['N_PARENT', 'N_CANDIDATE'],
              'economic_instances': 2,
              'global_heavy_group': 'a1-global-heavy-economic-evaluator-v1',
              'order_authority': 'BLOCKED',
              'promotion': False,
          }
          if any(value.get(key) != expected for key, expected in required.items()):
              raise SystemExit('ISSUE1377_V8_ACTIVATION_PROFILE_MISMATCH')
          source = value.get('reviewed_source_sha')
          if not isinstance(source, str) or not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('ISSUE1377_V8_REVIEWED_SOURCE_INVALID')
          if subprocess.run(['git', 'merge-base', '--is-ancestor', source, parent]).returncode:
              raise SystemExit('ISSUE1377_V8_REVIEWED_SOURCE_NOT_ANCESTOR')
          if changed != ['A\t' + str(path)]:
              raise SystemExit('ISSUE1377_V8_ACTIVATION_CHANGED_PATH_PROFILE')
          if subprocess.check_output(['git', 'rev-list', parent, '--', str(path)], text=True).splitlines():
              raise SystemExit('ISSUE1377_V8_ACTIVATION_PATH_ALREADY_USED')
          if recovery:
              expected_recovery = {
                  'state': 'AUTHORIZED_SAME_WORK_PRESTART_ONLY',
                  'recovery_token': recovery_token,
                  'prior_run_id': 37560101847,
                  'prior_job_id': 112595381946,
                  'prior_job_conclusion': 'cancelled',
                  'prior_job_steps': 0,
                  'prior_execution_ref_state': 'ABSENT_404',
                  'recovery_index': 1,
                  'max_recoveries': 1,
              }
              if value.get('recovery') != expected_recovery:
                  raise SystemExit('ISSUE1377_V8_RECOVERY_PROFILE_MISMATCH')
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
              with urlopen(Request(base + '/actions/jobs/112595381946', headers=headers), timeout=20) as response:
                  prior_job = json.load(response)
              if (
                  prior_job.get('status') != 'completed'
                  or prior_job.get('conclusion') != 'cancelled'
                  or prior_job.get('steps') not in ([], None)
              ):
                  raise SystemExit('ISSUE1377_V8_PRIOR_JOB_NOT_ZERO_STEP_CANCELLED')
              absent_refs = (
                  'research-execution-consumptions/issue1377-mr-v8-20261007-v1',
                  'research-results/issue1377-mr-v8-parent-20261007-v1',
                  'research-results/issue1377-mr-v8-candidate-20261007-v1',
                  'research-results/issue1377-mr-v8-comparison-20261007-v1',
              )
              for ref in absent_refs:
                  try:
                      urlopen(Request(base + '/git/ref/heads/' + ref, headers=headers), timeout=20)
                  except HTTPError as exc:
                      if exc.code != 404:
                          raise
                  else:
                      raise SystemExit('ISSUE1377_V8_RECOVERY_REF_ALREADY_PRESENT:' + ref)
          elif repair:
              expected_repair = {
                  'state': 'AUTHORIZED_IMPLEMENTATION_REPAIR_PRESTART_ONLY',
                  'repair_token': repair_token,
                  'prior_run_id': 37568346931,
                  'prior_job_id': 112621255828,
                  'prior_job_conclusion': 'failure',
                  'prior_failed_step': 'Execute parent and frozen candidate exactly once',
                  'prior_execution_ref_state': 'ABSENT_404',
                  'repair_index': 1,
                  'max_repairs': 1,
              }
              if value.get('implementation_repair') != expected_repair:
                  raise SystemExit('ISSUE1377_V8_IMPLEMENTATION_REPAIR_PROFILE_MISMATCH')
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
              with urlopen(Request(base + '/actions/jobs/112621255828', headers=headers), timeout=20) as response:
                  prior_job = json.load(response)
              failed_steps = [
                  step.get('name') for step in prior_job.get('steps', [])
                  if step.get('conclusion') == 'failure'
              ]
              if (
                  prior_job.get('status') != 'completed'
                  or prior_job.get('conclusion') != 'failure'
                  or failed_steps != ['Execute parent and frozen candidate exactly once']
              ):
                  raise SystemExit('ISSUE1377_V8_PRIOR_IMPLEMENTATION_FAILURE_MISMATCH')
              absent_refs = (
                  'research-execution-consumptions/issue1377-mr-v8-20261007-v1',
                  'research-results/issue1377-mr-v8-parent-20261007-v1',
                  'research-results/issue1377-mr-v8-candidate-20261007-v1',
                  'research-results/issue1377-mr-v8-comparison-20261007-v1',
              )
              for ref in absent_refs:
                  try:
                      urlopen(Request(base + '/git/ref/heads/' + ref, headers=headers), timeout=20)
                  except HTTPError as exc:
                      if exc.code != 404:
                          raise
                  else:
                      raise SystemExit('ISSUE1377_V8_IMPLEMENTATION_REPAIR_REF_ALREADY_PRESENT:' + ref)
          files = value.get('source_files_sha256')
          expected_files = {
              'ops/issue1377_mr_batch_v1.py',
              '.github/workflows/issue1377-keltner-orthogonal-v1.yml',
              'tests/test_issue1377_mr_batch_v1.py',
          }
          if not isinstance(files, dict) or set(files) != expected_files:
              raise SystemExit('ISSUE1377_V8_SOURCE_FILE_SET')
          destination = Path(os.environ['RUNNER_TEMP']) / 'V8_EXECUTION_ACTIVATION.json'
          destination.write_bytes(path.read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f'reviewed_source_sha={source}\n')
          PY
      - name: Checkout exact reviewed V8 executable
        run: git checkout --detach '${{ steps.activation.outputs.reviewed_source_sha }}'
      - name: Verify exact reviewed V8 source files
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'V8_EXECUTION_ACTIVATION.json').read_bytes())
          for name, expected in value['source_files_sha256'].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit('ISSUE1377_V8_SOURCE_FILE_DRIFT:' + name)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen research runtime
        run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
      - name: Configure existing SSH credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read canonical source archive without remote mutation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            tar -C /home/z/z/runtime/economic7_campaign_20260915 -czf - \
              canonical_12m canonical_gapday_prefix canonical_postgap_20260213 \
            > "$RUNNER_TEMP/issue1377-source.tar.gz"
          test -s "$RUNNER_TEMP/issue1377-source.tar.gz"
      - name: Reject unsafe archive members and stage source
        run: |
          stage=/home/z/z/runtime/economic7_campaign_20260915
          test ! -e "$stage"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$stage"
          printf '%s\n' issue1377-ephemeral-v8-stage > "$stage/.issue1377-runner-stage"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'issue1377-source.tar.gz'
          destination = Path('/home/z/z/runtime/economic7_campaign_20260915')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) > 100_000 or sum(row.size for row in members) > 12 * 1024**3:
                  raise SystemExit('SOURCE_ARCHIVE_BOUND_EXCEEDED')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or not (member.isdir() or member.isfile())
                      or not path.parts
                      or path.parts[0] not in {
                          'canonical_12m',
                          'canonical_gapday_prefix',
                          'canonical_postgap_20260213',
                      }
                  ):
                      raise SystemExit('UNSAFE_SOURCE_ARCHIVE_MEMBER:' + member.name)
              handle.extractall(destination, filter='data')
          PY
      - name: Execute parent and frozen candidate exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE1377_GLOBAL_HEAVY_GROUP: a1-global-heavy-economic-evaluator-v1
        run: >-
          python ops/issue1377_mr_batch_v1.py
          --source-root /home/z/z/runtime/economic7_campaign_20260915
          --activation "$RUNNER_TEMP/V8_EXECUTION_ACTIVATION.json"
          --output-dir "$RUNNER_TEMP/issue1377-results"
      - name: Remove transferred source and credential
        if: always()
        run: |
          rm -f ~/.ssh/vps_key "$RUNNER_TEMP/issue1377-source.tar.gz"
          stage=/home/z/z/runtime/economic7_campaign_20260915
          if [ -f "$stage/.issue1377-runner-stage" ]; then
            sudo rm -rf -- "$stage"
          fi
          sudo rmdir --ignore-fail-on-non-empty /home/z/z/runtime /home/z/z /home/z 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1377-mr-v8-economic-results
          path: |
            ${{ runner.temp }}/V8_EXECUTION_ACTIVATION.json
            ${{ runner.temp }}/issue1377-results
          if-no-files-found: error
