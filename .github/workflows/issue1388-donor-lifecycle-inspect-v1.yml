name: Issue1388 external donor exact notebook source-only inspection
on:
  push:
    branches:
      - ci/issue1388-saved-trade-fields-20261009
    paths:
      - '.github/workflows/issue1388-donor-lifecycle-inspect-v1.yml'
      - 'ops/issue1388_external_donor_lifecycle_inspect_v1.py'
permissions:
  contents: read
concurrency:
  group: issue1388-external-source-inspection-only
  cancel-in-progress: true # only replace this same scratch donor audit
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/issue1388-saved-trade-fields-20261009
          persist-credentials: false
      - name: Fetch exact original donor source for static inspection only
        uses: actions/checkout@v4
        with:
          repository: tradingstrategy-ai/getting-started
          ref: 0be3392775ffd2567a617153a3c8d42fb0e57476
          path: donor_src
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pyproject.toml
            notebooks/single-backtest/bitcoin-breakout-atr.ipynb
          sparse-checkout-cone-mode: false
      - name: Extract exact native entry, exit, cost and time rules without executing donor
        run: |
          python ops/issue1388_external_donor_lifecycle_inspect_v1.py --source donor_src --out out/issue1388_donor_notebook_lifecycle.json
      - name: Persist primary-source extraction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1388-primary-donor-original-rule-inspect
          path: out/issue1388_donor_notebook_lifecycle.json
          if-no-files-found: warn
          retention-days: 7
