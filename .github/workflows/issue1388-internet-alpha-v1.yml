  density-preflight-003:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[issue1388-density-preflight-3-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-4-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-5-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-6-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-7-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-9-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-10-v1]') ||
       contains(github.event.head_commit.message, '[issue1388-density-preflight-11-v1]'))
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no-PnL preflight activation
        id: activation
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          message = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())['head_commit']['message']
          number = '011' if '[issue1388-density-preflight-11-v1]' in message else '010' if '[issue1388-density-preflight-10-v1]' in message else '009' if '[issue1388-density-preflight-9-v1]' in message else '007' if '[issue1388-density-preflight-7-v1]' in message else '006' if '[issue1388-density-preflight-6-v1]' in message else '005' if '[issue1388-density-preflight-5-v1]' in message else '004' if '[issue1388-density-preflight-4-v1]' in message else '003'
          candidates = ['E_HANSEN_CANDLE_PATTERN_1H_V1'] if number in {'010','011'} else ['E_FT_OVERSOLD_REVERSION_1H_V1'] if number == '009' else ['R_MOSER_INVERTED_HAMMER_1H_V1'] if number in {'006','007'} else ['E_FT_EMA800_PRICE_THRESHOLD_1H_V1'] if number == '005' else ['R_BTC_NEGATIVE_SHOCK_1H_V1', 'E_FT_BBAND_RSI_1H_V1'] if number == '004' else ['R_PAPER_RSI_W1_30M_V1', 'R_ETH_SESSION_REVERSAL_1H_V1']
          path = Path('research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/PREFLIGHT_' + number + '.json')
          value = json.loads(path.read_bytes())
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git','diff','--name-status','--no-renames',parent,head], text=True).splitlines()
          if changed != ['A\t' + str(path)]:
              raise SystemExit('PREFLIGHT_CHANGED_PATH_PROFILE')
          required = {
              'schema': 'zel.issue1388.signal_density_activation.v1',
              'issue': 1388,
              'token': '[issue1388-density-preflight-' + str(int(number)) + '-v1]',
              'candidate_ids': candidates,
              'source_inventory_sha256': '53c64616fa98ddd446533cbc7b8e90eb2866ce9b1b0b3243df4211d59f155ba2',
              'period_ms': [1768262400000, 1781654400000],
              'economic_screen_consumed': 0,
              'order_authority': 'BLOCKED',
          }
          for key, expected in required.items():
              if value.get(key) != expected:
                  raise SystemExit('PREFLIGHT_BINDING:' + key)
          source = value.get('reviewed_source_sha')
          if not isinstance(source,str) or len(source) != 40 or any(x not in '0123456789abcdef' for x in source):
              raise SystemExit('PREFLIGHT_REVIEWED_SOURCE_SHA_REQUIRED')
          if number == '007':
              previous = json.loads(path.with_name('PREFLIGHT_006.json').read_bytes())
              if previous.get('reviewed_source_sha') is not None or source != '82ed536e8cc292591d93d54bc84c450958575459':
                  raise SystemExit('PREFLIGHT_RECOVERY_SOURCE_PROFILE')
              if value.get('previous_run') != 37709688816 or value.get('previous_job') != 113092602335 or value.get('previous_stage') != 'ACTIVATION_FAILED_BEFORE_SOURCE_INPUT_OR_SIGNAL':
                  raise SystemExit('PREFLIGHT_RECOVERY_EVIDENCE_PROFILE')
          if number in {'010','011'}:
              root = path.parent
              thesis = root / 'HANSEN_PRE_SCREEN_THESIS.json'
              sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
              if value.get('pre_screen_thesis_sha256') != sha(thesis):
                  raise SystemExit('HANSEN_THESIS_BINDING')
              frozen = json.loads(thesis.read_bytes())
              donor = frozen.get('source', {})
              if (frozen.get('status') != 'GO_PENDING_SIGNAL_DENSITY'
                      or donor.get('commit') != 'f80d4d8b77c53435e9c0a9045636f1bfb2b8c539'
                      or donor.get('blob') != '7f84524f6bdda5b01db312a8fc7064cd9e671c19'
                      or donor.get('license_blob') != '261eeb9e9f8b2b4b0d119366dda99c6fd7d35c64'
                      or frozen.get('required_inputs_available') is not True
                      or frozen.get('source_economics', {}).get('reported') is not False):
                  raise SystemExit('HANSEN_SOURCE_THESIS_PROFILE')
              if number == '011':
                  previous = json.loads(path.with_name('PREFLIGHT_010.json').read_bytes())
                  if (value.get('previous_activation_commit') != '861052ac139d4e072787f36c475360a84ac8c0a7'
                          or value.get('previous_stage') != 'WORKFLOW_NOT_DISPATCHED_PATH_FILTER'
                          or value.get('previous_economic_screen_consumed') != 0
                          or previous.get('reviewed_source_sha') != value.get('reviewed_source_sha')):
                      raise SystemExit('HANSEN_RECOVERY_ROUTE_EVIDENCE')
          if number == '009':
              root = path.parent
              review = root / 'OVERSOLD_REVERSION_SOURCE_REVIEW.json'
              thesis = root / 'OVERSOLD_REVERSION_PRE_SCREEN_THESIS.json'
              sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
              if value.get('source_review_sha256') != sha(review) or value.get('pre_screen_thesis_sha256') != sha(thesis):
                  raise SystemExit('OVERSOLD_SOURCE_THESIS_BINDING')
              source_review = json.loads(review.read_bytes())
              frozen = json.loads(thesis.read_bytes())
              if (source_review.get('source_commit') != '26f1ae32fe92e6e0324f985c8ea512ab57f47fc9'
                      or source_review.get('source_code_blob') != '97fd08bb3a3a2e46be388eb920ba54af7f093b3c'
                      or source_review.get('license_blob') != '9cecc1d4669ee8af2ca727a5d8cde10cd8b2d7cc'
                      or source_review.get('economic_screen_ready') is not False
                      or frozen.get('permitted_stage') != 'NO_PNL_SOURCE_EXACT_RAW_SIGNAL_CENSUS_ONLY'
                      or frozen.get('economic_screen_permitted') is not False):
                  raise SystemExit('OVERSOLD_SOURCE_REVIEW_PROFILE')
          if subprocess.run(['git','merge-base','--is-ancestor',source,parent]).returncode:
              raise SystemExit('REVIEWED_SOURCE_NOT_ANCESTOR')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('reviewed_source_sha=' + source + '\n')
              handle.write('candidate_ids=' + ','.join(candidates) + '\n')
              handle.write('number=' + number + '\n')
          PY
      - run: git checkout --detach '${{ steps.activation.outputs.reviewed_source_sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1 TA-Lib==0.6.7
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
