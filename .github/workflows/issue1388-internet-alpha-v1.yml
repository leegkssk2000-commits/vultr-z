name: issue1388-internet-alpha-v1

on:
  pull_request:
    paths:
      - '.github/workflows/issue1388-internet-alpha-v1.yml'
      - 'ops/issue1388_alpha_screen_v1.py'
      - 'tests/test_issue1388_alpha_screen_v1.py'
      - 'research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/**'
  push:
    branches: [master]
    paths:
      - 'research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/ACTIVATION_001.json'
      - 'research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/ACTIVATION_002.json'

permissions:
  contents: read

concurrency:
  group: issue1388-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1 pytest==9.0.2
      - run: python -m pytest -q tests/test_issue1388_alpha_screen_v1.py
      - run: python -m py_compile ops/issue1388_alpha_screen_v1.py && git diff --check

  cheap-screen-001:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[issue1388-alpha-screen-1-20261007T1420Z-8d31b7a]')
    needs: contract-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: a1-global-heavy-economic-evaluator-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one-shot activation commit
        id: activation
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path('research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/ACTIVATION_001.json')
          value = json.loads(path.read_bytes())
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git','diff','--name-status','--no-renames',parent,head], text=True).splitlines()
          if changed != ['A\t' + str(path)]:
              raise SystemExit('ACTIVATION_CHANGED_PATH_PROFILE')
          source = value.get('reviewed_source_sha')
          if subprocess.run(['git','merge-base','--is-ancestor',source,parent]).returncode:
              raise SystemExit('REVIEWED_SOURCE_NOT_ANCESTOR')
          dest = Path(os.environ['RUNNER_TEMP']) / 'ACTIVATION_001.json'
          dest.write_bytes(path.read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('reviewed_source_sha=' + source + '\n')
          PY
      - run: git checkout --detach '${{ steps.activation.outputs.reviewed_source_sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.4.3 pandas==3.0.1
      - name: Require configured existing read-only connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
      - name: Read canonical source archive without remote mutation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            tar -C /home/z/z/runtime/economic7_campaign_20260915 -czf - \
              canonical_12m canonical_gapday_prefix canonical_postgap_20260213 \
            > "$RUNNER_TEMP/issue1388-source.tar.gz"
          test -s "$RUNNER_TEMP/issue1388-source.tar.gz"
      - name: Safely stage canonical source
        run: |
          stage=/home/z/z/runtime/economic7_campaign_20260915
          test ! -e "$stage"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$stage"
          printf '%s\n' issue1388-ephemeral-stage > "$stage/.issue1388-stage"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'issue1388-source.tar.gz'
          destination = Path('/home/z/z/runtime/economic7_campaign_20260915')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) > 100000 or sum(x.size for x in members) > 12 * 1024**3:
                  raise SystemExit('SOURCE_ARCHIVE_BOUND_EXCEEDED')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not (member.isdir() or member.isfile()) or path.parts[0] not in {'canonical_12m','canonical_gapday_prefix','canonical_postgap_20260213'}:
                      raise SystemExit('UNSAFE_ARCHIVE_MEMBER:' + member.name)
              handle.extractall(destination, filter='data')
          PY
      - name: Execute and persist cheap screen once
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE1388_GLOBAL_HEAVY_GROUP: a1-global-heavy-economic-evaluator-v1
        run: >-
          python ops/issue1388_alpha_screen_v1.py
          --source-root /home/z/z/runtime/economic7_campaign_20260915
          --activation "$RUNNER_TEMP/ACTIVATION_001.json"
          --output-dir "$RUNNER_TEMP/issue1388-results"
      - name: Remove transferred source and credential
        if: always()
        run: |
          rm -f ~/.ssh/vps_key "$RUNNER_TEMP/issue1388-source.tar.gz"
          stage=/home/z/z/runtime/economic7_campaign_20260915
          if [ -f "$stage/.issue1388-stage" ]; then sudo rm -rf -- "$stage"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1388-cheap-screen-001
          path: ${{ runner.temp }}/issue1388-results
          if-no-files-found: error

  cheap-screen-002:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
