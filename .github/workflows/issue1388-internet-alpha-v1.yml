          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          message = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())['head_commit']['message']
          number = '008' if '[issue1388-alpha-screen-8-ema800-1h-v1]' in message else '007' if '[issue1388-alpha-screen-7-inverted-hammer-1h-v1]' in message else '006' if '[issue1388-alpha-screen-6-bband-rsi-1h-v1]' in message else '005' if '[issue1388-alpha-screen-5-eth-session-1h-v1]' in message else '004' if '[issue1388-alpha-screen-4-btc-shock-1h-v1]' in message else '003'
          if '[issue1388-alpha-screen-9-hansen-1h-v1]' in message:
              number = '009'
          path = Path('research/campaigns/scalp7_20261007/issue1388_internet_alpha_v1/ACTIVATION_' + number + '.json')
          value = json.loads(path.read_bytes())
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git','diff','--name-status','--no-renames',parent,head], text=True).splitlines()
          if changed != ['A\t' + str(path)]:
              if number in ('007', '008', '009'):
                  raise SystemExit('INVERTED_SINGLE_ADD_ACTIVATION_REQUIRED')
              from ops.issue1388_preclaim_recovery_v1 import recover
              recover(Path.cwd(), path, head, parent, changed)
          source = value.get('reviewed_source_sha')
          if not isinstance(source, str) or len(source) != 40 or any(c not in '0123456789abcdef' for c in source):
              raise SystemExit('REVIEWED_SOURCE_SHA_REQUIRED')
          if subprocess.run(['git','merge-base','--is-ancestor',source,parent]).returncode:
              raise SystemExit('REVIEWED_SOURCE_NOT_ANCESTOR')
          dest = Path(os.environ['RUNNER_TEMP']) / 'ACTIVATION.json'
          dest.write_bytes(path.read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('reviewed_source_sha=' + source + '\n')
              handle.write('number=' + number + '\n')
          PY
      - run: git checkout --detach '${{ steps.activation.outputs.reviewed_source_sha }}'
