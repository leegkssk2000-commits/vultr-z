name: Issue1388 static-only candidate admission against saved A5 economic failures
on:
  push:
    branches: [ci/issue1388-executable-candidate-static-20261009]
    paths:
      - '.github/workflows/issue1388-static-candidate-preflight-v1.yml'
      - 'ops/issue1388_candidate_static_preflight_v1.py'
      - 'tests/test_issue1388_candidate_static_preflight_v1.py'
permissions:
  contents: read
concurrency:
  group: issue1388-static-candidate-preflight-only
  cancel-in-progress: false
jobs:
  static-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 171aabdbcdb3f43fcdad52b70220b98836017b79
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute native static fail-fast unit tests
        run: |
          set -euo pipefail
          python -m py_compile ops/issue1388_candidate_static_preflight_v1.py tests/test_issue1388_candidate_static_preflight_v1.py
          python -m unittest discover -s tests -p test_issue1388_candidate_static_preflight_v1.py -v
          python -m py_compile backend/research/architecture_factory/a1_a5_static_admission_v1.py backend/research/architecture_factory/a1_a5_economic_improvement_v3.py tests/test_issue1388_candidate_static_wrapper_v1.py
          python -m unittest discover -s tests -p test_issue1388_candidate_static_wrapper_v1.py -v
          python - <<'PY'
          from pathlib import Path
          src=Path('backend/research/architecture_factory/a1_a5_economic_improvement_v3.py').read_text()
          assert src.count('static_admission.evaluate_queue(econ, ') == 4
          assert 'dev = econ.evaluate_queue(' not in src
          assert 'repair_dev = econ.evaluate_queue(' not in src
          print('PASS_ALL_FOUR_A5_STATIC_ADMISSION_CALL_SITES',flush=True)
          PY

      - name: Inspect saved real five generated candidates without market APIs
        run: |
          python ops/issue1388_candidate_static_preflight_v1.py --output out/issue1388_static_candidate_receipt.json
      - name: Persist fail-fast result with zero economic credit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1388-static-admission-frozen-five
          path: out/issue1388_static_candidate_receipt.json
          if-no-files-found: warn
          retention-days: 7
