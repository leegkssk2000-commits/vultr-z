name: JC lifecycle first FULL pair
on:
  push:
    branches: [research/trader-lifecycle-after-pr1249-v1]
    paths: ['.github/workflows/jc-lifecycle-first-full-v1.yml']
permissions:
  contents: write
jobs:
  full-pair:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trader-lifecycle-after-pr1249-v1
      - name: Canonical and artificial prices only
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python -B -m unittest backend.research.rebuild.test_jc_lifecycle_v1 -v
      - name: Freeze then reserve and execute two first FULLs only
        run: |
          git config user.name 'zel-research'
          git config user.email 'zel-research@users.noreply.github.com'
          python -B -m backend.research.rebuild.jc_lifecycle_study_v1 --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jc-lifecycle-first-full-${{ github.run_id }}
          path: research/development_evidence/TRADER_LIFECYCLE_BENCHMARK_AFTER_PR1249_V1
