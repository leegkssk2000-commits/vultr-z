name: Keltner verified price input and frozen validation 20261004
on:
  push:
    branches: [codex/kp-input-validation-20261004]
    paths:
      - research/campaigns/scalp7_20261004/kp_input_validation_v1/PREEXEC_RESUME.json
  pull_request:
    branches: [master]
    paths:
      - ops/kp*input*.py
      - ops/kp_configured_prefix_export_v1.py
      - ops/kp_connected_research_validation_v1.py
      - tests/test_kp*input*.py
      - tests/test_kp_connected_research_validation_v1.py
      - .github/workflows/kp-input-validation-20261004.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('kp-input-pr-tests-{0}', github.event.pull_request.number) || 'kp-github-access-diagnosis-20261004' }}
  cancel-in-progress: false
jobs:
  verify-input:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Canonical precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Regression and shell syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5 PyYAML==6.0.2
          mkdir -p "$RUNNER_TEMP/kp-input"
          python3 -m unittest discover -s tests -p 'test_kp_price_input_export_v1.py' -v 2>&1 | tee "$RUNNER_TEMP/kp-input/input-tests.log"
          python3 -m unittest discover -s tests -p 'test_kp_connected_research_validation_v1.py' -v 2>&1 | tee "$RUNNER_TEMP/kp-input/execution-tests.log"
          python3 - <<'PY'
          import pathlib,subprocess,yaml
          d=yaml.safe_load(pathlib.Path('.github/workflows/kp-input-validation-20261004.yml').read_text())
          for step in d['jobs']['verify-input']['steps']:
              if 'run' in step:subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)
          print('ALL_WORKFLOW_SHELL_STEPS_PARSE')
          PY
      - name: Resume only the proven unstarted model execution
        if: github.event_name == 'push' && github.event.sender.id == 232057951
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCOPE=research/campaigns/scalp7_20261004/kp_input_validation_v1
          export SCOPE
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || { echo 'ECONOMIC_RETRY_NOT_AUTHORIZED';exit 1; }
          git diff --name-status HEAD^ HEAD -- "$SCOPE/PREEXEC_RESUME.json" | grep -q '^A' || { echo 'RESUME_ALREADY_CONSUMED';exit 1; }
          curl --fail --silent --show-error --location --proto '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/leegkssk2000-commits/vultr-z/actions/artifacts/11305289063/zip -o "$RUNNER_TEMP/prior-failure.zip"
          curl --fail --silent --show-error --location --proto '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/leegkssk2000-commits/vultr-z/actions/artifacts/11305382754/zip -o "$RUNNER_TEMP/verified-input.zip"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          scope=Path(os.environ['SCOPE']);temp=Path(os.environ['RUNNER_TEMP']);out=temp/'kp-input'
          a=json.loads((scope/'RUN.json').read_bytes());resume=json.loads((scope/'PREEXEC_RESUME.json').read_bytes())
          assert a['max_model_replays']==1 and a['official_fresh_credit'] is False
          assert a['contract_sha256']=='e2e02b9013b91c92411741791535746e671e9b146eca82c8e0ce3a19176e3e1c'
          assert a['input_artifact_id']==11305382754 and a['input_artifact_sha256']=='a656836ac36ab2dd8b90344513f567b296c6f092213a84e4d195e9b5bbabe299'
          assert resume['failed_run_id']==37208507591 and resume['economic_starts_before_resume']==0 and resume['remaining_model_replays']==1
          failed=(temp/'prior-failure.zip').read_bytes();assert hashlib.sha256(failed).hexdigest()=='67d184422fc7996e3dfa37a672a325945f3509f2eb36e2fa7403020af6de10ba'
          with zipfile.ZipFile(temp/'prior-failure.zip') as z:
              assert set(z.namelist())=={'input-tests.log','execution-tests.log'}
          p=temp/'verified-input.zip';assert hashlib.sha256(p.read_bytes()).hexdigest()==a['input_artifact_sha256']
          with zipfile.ZipFile(p) as z:
              info=z.getinfo('PRICE_INPUT.json.gz');assert info.file_size<64*1024*1024
              (temp/'frozen-price-input.json.gz').write_bytes(z.read(info))
          (out/'PREEXEC_FAILURE_PRESERVED.json').write_text(json.dumps(resume,indent=2)+'\n')
          PY
          python3 ops/kp_connected_research_validation_v1.py --input "$RUNNER_TEMP/frozen-price-input.json.gz" --contract "$SCOPE/RUN_CONTRACT.json" --activation "$SCOPE/RUN.json" --output "$RUNNER_TEMP/kp-input/validation"
      - name: Canonical postcheck
        if: always()
        run: |
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kp-price-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kp-input/
          if-no-files-found: error
          retention-days: 14
