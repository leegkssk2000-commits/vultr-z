name: K.P saved evidence closeout V1
on:
  push:
    branches: [codex/kp-saved-evidence-closeout-20261003]
    paths:
      - .github/workflows/kp-saved-evidence-closeout-v1.yml
      - scripts/kp_saved_evidence_closeout_v1.py
      - tests/test_kp_saved_evidence_closeout_v1.py
      - research/campaigns/scalp7_20261003/kp_saved_evidence_v1/**
permissions:
  contents: read
concurrency:
  group: kp-saved-evidence-closeout-v1
  cancel-in-progress: false
jobs:
  saved-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Required canonical source precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Export only existing K.P evidence and source text
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'kp-saved-evidence'
          root.mkdir()
          base = 'research/campaigns/scalp7_20260915/broad_rebuild_v2/'
          exact = [
              'AGENTS.md',
              'backend/research/rebuild/scalp7_positive_lanes_v2.py',
              'backend/research/rebuild/scalp7_execution_v2.py',
              'backend/research/rebuild/scalp7_metrics_v2.py',
              'backend/research/rebuild/economic7_core_promotion_roadmap_v2.json',
              'backend/research/rebuild/economic_dev_execution_split_v1.json',
              'backend/research/rebuild/economic_material_policy_v2.json',
              base + 'results/scalp7_keltner_hg_parent_utc30m_v2.json',
              base + 'results/scalp7_keltner_hg_parent_utc30m_v2.trades.json.gz',
              base + 'POSITIVE_LANES_FREEZE_V2.json',
              base + 'EXECUTION_REGISTRY_EXPORT_V2.json',
              base + 'SCALP7_BROAD_REBUILD_V2_FINAL_REPORT.md',
              'research/campaigns/scalp7_20260915/broad_v2/SAVED_RESULTS_INDEPENDENT_ARITHMETIC_V2.json',
              'research/campaigns/scalp7_20260915/cost_snapshot_v2/SCALP7_CURRENT_REFERENCE_COST_SNAPSHOT_V2.json',
              'research/campaigns/scalp7_20260917/source_fidelity_v1/audits/SAVED_ARITHMETIC_INDEPENDENT_REVIEW.json',
              'research/campaigns/scalp7_20260915/SCALP7_WORK_HANDOFF_AFTER_CHAT_BENCHMARK_V1.md',
          ]
          manifest = {'head_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                      'new_full_runs': 0, 'source_files': [], 'missing': []}
          for name in exact:
              path = Path(name)
              if not path.is_file():
                  manifest['missing'].append(name)
                  continue
              raw = path.read_bytes()
              if len(raw) > 5_000_000:
                  raise ValueError('UNEXPECTED_SOURCE_SIZE:' + name)
              dest = root / 'repo' / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              manifest['source_files'].append({'path': name, 'bytes':len(raw), 'sha256':hashlib.sha256(raw).hexdigest()})
          ledger = Path(base + 'results/scalp7_keltner_hg_parent_utc30m_v2.trades.json.gz')
          raw = ledger.read_bytes()
          if hashlib.sha256(raw).hexdigest() != '8863caa8231282fbd7dfd5660811b74e007c018c9cdafdaa52c24830cddfd989':
              raise ValueError('FROZEN_KP_LEDGER_CHANGED')
          rows = json.loads(gzip.decompress(raw))
          print('LEDGER_TYPE',type(rows).__name__)
          print('LEDGER_PREVIEW',str(rows)[:5000])
          tree = subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          scoped = [p for p in tree if any(x in p.lower() for x in ['cashflow','keltner','g4_g5','g4-to-g5','g5_validation_contract','core_promotion'])]
          (root/'RELATED_PATHS.json').write_text(json.dumps(scoped,indent=2)+'\n')
          (root/'FETCH_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('EXPORTED_FILES',len(manifest['source_files']),'NEW_FULL_RUNS',0)
          PY
      - name: Run additive saved-only audit and synthetic tests when present
        shell: bash
        run: |
          if [ -f scripts/kp_saved_evidence_closeout_v1.py ]; then
            python3 -m unittest discover -s tests -p test_kp_saved_evidence_closeout_v1.py -v
            python3 scripts/kp_saved_evidence_closeout_v1.py --repo-root . --output-dir "$RUNNER_TEMP/kp-saved-evidence/audit"
          fi
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - name: Preserve saved evidence and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kp-saved-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/kp-saved-evidence/
          if-no-files-found: error
          retention-days: 7
