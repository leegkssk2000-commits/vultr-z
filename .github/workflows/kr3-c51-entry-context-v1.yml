name: KR3 C51 entry context factorial
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/*c51_entry_context*.py'
      - 'research/development_evidence/KR3_C51_ENTRY_CONTEXT_AB_AFTER_PR1225_V1/**'
      - '.github/workflows/kr3-c51-entry-context-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c51-entry-context-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  finite-six:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      B: research/development_evidence/KR3_C51_ENTRY_CONTEXT_AB_AFTER_PR1225_V1
      BRANCH: research/c51-entry-context-ab-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Unique explicit finite dispatch
        id: scope
        env:
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" = 1 ] && [ "$HEAD_REF" = "$BRANCH" ] && [ "$(git log -1 --format=%s)" = 'RUN_C51_ENTRY_AB_SIX_20260909' ] && [ ! -f "$B/SPEC.json" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Canonical preflight and artificial boundaries
        if: steps.scope.outputs.execute == 'true'
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          python -m unittest backend.research.rebuild.test_kr3_c51_entry_context_v1 -v
          python -m py_compile backend/research/rebuild/kr3_c51_entry_context_study_v1.py
      - uses: actions/download-artifact@v4
        if: steps.scope.outputs.execute == 'true'
        with:
          name: kr3-profit-zone-34282003231
          run-id: 34282003231
          github-token: ${{ github.token }}
          path: out/parent51
      - name: Freeze three rules and persist each claim before six serial FULLs
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name c51-entry-context-evaluator
          git config user.email actions@users.noreply.github.com
          persist() {
            git add "$B"
            python - <<'PY'
          import os,subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not p.startswith(os.environ['B']+'/') for p in changed):raise SystemExit('UNSCOPED_WRITE')
          PY
            git diff --cached --quiet || git commit -m "$1 [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          }
          python -m backend.research.rebuild.kr3_c51_entry_context_study_v1 freeze --inputs out/parent51/inputs
          persist 'research: freeze three C51 entry hypotheses before outcomes'
          for mode in A B AB; do
            for per in DEV2025 SEEN2026; do
              python -m backend.research.rebuild.kr3_c51_entry_context_study_v1 reserve --mode "$mode" --period "$per"
              persist "research: reserve C51 entry $mode $per before replay"
              remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
              test "$remote" = "$(git rev-parse HEAD)"
              timeout 150 python -u -m backend.research.rebuild.kr3_c51_entry_context_study_v1 execute --inputs out/parent51/inputs --mode "$mode" --period "$per" --remote-sha "$remote"
              persist "research: preserve C51 entry $mode $per result"
            done
          done
          python -m backend.research.rebuild.kr3_c51_entry_context_study_v1 summarize
          persist 'research: summarize six fixed C51 entry comparisons'
      - name: Preserve checkpoint without replay or retry
        if: always() && steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name c51-entry-context-evaluator
          git config user.email actions@users.noreply.github.com
          git add "$B"
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve finite C51 entry checkpoint [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p out/entry-artifact
          git archive HEAD "$B" backend/research/rebuild/kr3_c51_entry_context_v1.py backend/research/rebuild/test_kr3_c51_entry_context_v1.py backend/research/rebuild/kr3_c51_entry_context_study_v1.py .github/workflows/kr3-c51-entry-context-v1.yml > out/entry-artifact/code-results.tar
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.execute == 'true'
        with:
          name: c51-entry-context-${{ github.run_id }}
          path: out/entry-artifact
          retention-days: 90
