name: KR3 C54 effort progress
on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/kr3-c54-effort-progress-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/**'
      - 'research/development_evidence/**'
      - '.github/workflows/kr3-c54-effort-progress-v1.yml'
permissions:
  contents: read
jobs:
  verify-completed-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical validation
        run: npm run --prefix frontend/z-os-app-source validate
      - name: Artificial strategy boundaries only
        run: python3 -B -m unittest backend.research.rebuild.test_kr3_c54_effort_progress_v1 backend.research.rebuild.test_kr3_c51_entry_context_v1 -v
      - name: Saved raw, original-source binding and arithmetic
        working-directory: research/development_evidence/KR3_C54_EFFORT_PROGRESS_AFTER_PR1226_V1
        run: |
          python3 -B verify_saved.py --manifest-sha256 b5d5491c51ced5b34ab87ecf1901c28f2f51d62f15b8d3306bf18c8a8a6e9ccc
          python3 -B -m unittest test_saved -v
          git diff --exit-code
