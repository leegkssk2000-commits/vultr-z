name: KR3 D1 progress requalification
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/kr3-d1-progress-v1.yml'
      - 'backend/research/rebuild/kr3_d1*.py'
      - 'backend/research/rebuild/test_kr3_d1*.py'
      - 'research/development_evidence/KR3_D1_PROGRESS_DESIGN.md'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/kr3-d1-progress-v1.yml'
      - 'backend/research/rebuild/kr3_d1*.py'
      - 'backend/research/rebuild/test_kr3_d1*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS/**'
permissions:
  contents: read
concurrency:
  group: kr3-d1-progress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.scope.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical preflight and synthetic boundary tests
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          python -m unittest backend.research.rebuild.test_kr3_d1_progress_requal_v1 -v
      - name: Determine finite first-attempt execution or saved verification
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          from backend.research.rebuild import kr3_d1_progress_study_v1 as m
          b=pathlib.Path(m.OUT)
          budget=json.loads(pathlib.Path(m.p.BUDGET).read_bytes())
          subject=subprocess.check_output(['git','log','-1','--format=%s'],text=True).strip()
          go=(os.environ['EVENT']=='pull_request' and os.environ['ATTEMPT']=='1' and os.environ['HEAD_BRANCH']=='research/kr3-d1-progress-requal-v1' and subject=='RUN_D1_PROGRESS_ONCE_AFTER_PR1216' and m.KEY not in budget and not (b/'SPEC.json').exists())
          if (b/'SPEC.json').exists():
            check=m.saved_check(json.loads((b/'SPEC.json').read_bytes()));print(check)
            if check['completed']!=2:raise SystemExit('D1_SCOPE_NOT_COMPLETE_NO_AUTOMATIC_RETRY')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(go).lower()+'\n')
          print('ONE_CANDIDATE_TWO_PERIODS_RESERVED_BEFORE_EACH' if go else 'READ_ONLY_NO_ECONOMIC_REPLAY')
          PY
  economic_once:
    needs: verify
    if: needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      BRANCH: research/kr3-d1-progress-requal-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse canonical opaque archive, decode only two already-used prefixes
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6d6335d1c9ad7ecb1e9597da85c2eb87635561e1
          mkdir -p /tmp/d1-source out/d1-input
          git archive 6d6335d1c9ad7ecb1e9597da85c2eb87635561e1 research/data/g5a_stage_v1 | tar -x -C /tmp/d1-source
          python - <<'PY'
          import gzip,json,pathlib
          from backend.research.rebuild import kr3_d1_progress_study_v1 as m
          from backend.research.rebuild import step7_kr3_dev_evidence_v1 as e
          from backend.research.rebuild import q0_b_seen_adapter_v1 as adapter
          source='/tmp/d1-source/research/data/g5a_stage_v1'
          rows,policy,costs,lineage=e.load_dev_slice(source)
          assert lineage['decoded_OOS_rows']==lineage['decoded_validation_rows']==0
          packets={'DEV2025':{'rows_by':rows,'policy':policy,'costs':costs,'lineage':lineage}}
          config=json.loads(pathlib.Path('research/development_evidence/Q0_B_SEEN_2026_V1/SPEC.json').read_bytes())
          policy,dev,rows,access=adapter.load_seen_inputs(source,config)
          assert all(a['rows_after_evaluation_end_decoded']==0 for a in access.values())
          packets['SEEN2026']={'rows_by':rows,'policy':policy,'costs':dev['cost_by_symbol'],'lineage':access}
          for period,packet in packets.items():
            m.packet_check(period,packet)
            pathlib.Path('out/d1-input/'+period+'.json.gz').write_bytes(gzip.compress(m.p.canonical(packet),mtime=0))
          print('EXACT_2025_2026_INPUT_HASHES_MATCH_NO_STRATEGY_REPLAY_NO_MARKET_QUERY')
          PY
      - name: Freeze and minimally bind successor verification route
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.kr3_d1_progress_study_v1 freeze
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/step7-parent-survivor-v1.yml');s=p.read_text()
          needle='          dev_only = d_only or winner_only or mechanism_only or ('
          if s.count(needle)!=1:raise SystemExit('EXACT_PARENT_ROUTER_ANCHOR_REQUIRED')
          lines=[
            "d1_prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS/'",
            "d1_allowed = {'.github/workflows/step7-parent-survivor-v1.yml', '.github/workflows/kr3-d1-progress-v1.yml', 'backend/research/rebuild/kr3_d1_progress_requal_v1.py', 'backend/research/rebuild/kr3_d1_progress_study_v1.py', 'backend/research/rebuild/test_kr3_d1_progress_requal_v1.py', 'research/development_evidence/KR3_D1_PROGRESS_DESIGN.md', 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json'}",
            "d1_only = bool(changed) and any(p.startswith(d1_prefix) for p in changed) and all(p in d1_allowed or p.startswith(d1_prefix) for p in changed)",
            "if d1_only:",
            "  from backend.research.rebuild.kr3_d1_progress_study_v1 import saved_check",
            "  result = saved_check(json.loads(pathlib.Path(d1_prefix+'SPEC.json').read_bytes()))",
            "  if result['completed'] != 2: raise SystemExit('D1_FINITE_SCOPE_INCOMPLETE')",
            "  print('D1_SAVED_RESULTS_VERIFIED_NO_PREVIOUS_ECONOMIC_REPLAY')",
          ]
          extra=''.join('          '+line+'\n' for line in lines)
          p.write_text(s.replace(needle,extra+'          dev_only = d1_only or d_only or winner_only or mechanism_only or ('))
          PY
      - name: Persist each real attempt remotely before its only FULL execution
        run: |
          set -euo pipefail
          b=research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS
          budget=research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json
          git config user.name kr3-d1-finite-evaluator
          git config user.email actions@users.noreply.github.com
          for period in DEV2025 SEEN2026; do
            test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
            python -m backend.research.rebuild.kr3_d1_progress_study_v1 reserve --period "$period"
            git add "$b" "$budget" .github/workflows/step7-parent-survivor-v1.yml
            git commit -m "research: persist D1 $period attempt BEFORE replay [skip ci]"
            git push origin HEAD:refs/heads/$BRANCH
            export ZEL_D1_RESERVATION_COMMIT="$(git rev-parse HEAD)"
            test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$ZEL_D1_RESERVATION_COMMIT"
            python -u -m backend.research.rebuild.kr3_d1_progress_study_v1 execute --period "$period" --input "out/d1-input/$period.json.gz"
            git add "$b" "$budget"
            git commit -m "research: preserve D1 $period actual result [skip ci]"
            git push origin HEAD:refs/heads/$BRANCH
          done
          python -m backend.research.rebuild.kr3_d1_progress_study_v1 summarize
          python -m backend.research.rebuild.kr3_d1_progress_study_v1 verify
          git add "$b"
          git commit -m 'research: preserve D1 two-period accounting [skip ci]'
          git push origin HEAD:refs/heads/$BRANCH
      - name: Preserve any locally completed failure or result without retry
        if: always()
        run: |
          set -euo pipefail
          b=research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS
          test -d "$b" || exit 0
          git config user.name kr3-d1-finite-evaluator
          git config user.email actions@users.noreply.github.com
          git add "$b" research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json .github/workflows/step7-parent-survivor-v1.yml
          git diff --cached --quiet || { git commit -m 'research: preserve D1 checkpoint no retry [skip ci]'; git push origin HEAD:refs/heads/$BRANCH; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr3-d1-progress-${{ github.run_id }}
          path: |
            research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D1_PROGRESS
            research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json
          retention-days: 90
