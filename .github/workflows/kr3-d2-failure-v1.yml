      - 'backend/research/rebuild/parallel_exit_keltner_v1.py'
      - 'backend/research/rebuild/parallel_exit_metrics_v1.py'
      - 'backend/research/rebuild/step7_candidate_contract_v1.py'
      - 'backend/research/rebuild/step7_kr3_dev_evidence_v1.py'
      - 'backend/research/rebuild/step7_kr3_dev_validation_v1.py'
      - 'backend/research/rebuild/step7_kr3_execution_v1.py'
      - 'backend/research/rebuild/step7_kr3_mechanism_separation_v1.py'
      - 'backend/research/rebuild/step7_kr3_winner_accounting_v1.py'
      - 'backend/research/rebuild/supertrend_flip_ab_v1.py'
      - 'backend/research/rebuild/top5_development_repair_v1.py'
      - 'backend/research/rebuild/top5_diverse_batch_execution_v1.py'
      - 'backend/research/rebuild/top5_diverse_batch_preparation_v1.py'
      - 'backend/research/rebuild/top5_external_metrics_v1.py'
      - 'research/development_evidence/KR3_D_HELD_PATH_DIAGNOSIS_V1/**'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D2_FAILURE/**'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/kr3-d2-failure-v1.yml'
      - 'backend/research/rebuild/kr3_d2*.py'
      - 'backend/research/rebuild/test_kr3_d2*.py'
      - 'backend/research/architecture_factory/a1_gen2_generic_dev_econ_v1.py'
      - 'backend/research/architecture_factory/g5a_development_probe_v1.py'
      - 'backend/research/architecture_factory/g5a_source_admission_v1.py'
      - 'backend/research/architecture_factory/g5a_stage_candidate_v1.py'
      - 'backend/research/rebuild/a1_top5_replacement_child_prospective_v1.py'
      - 'backend/research/rebuild/break_channel_metrics_v1.py'
      - 'backend/research/rebuild/break_channel_q1_metrics_v1.py'
      - 'backend/research/rebuild/keltner_cumulative_entry_adapter_v1.py'
      - 'backend/research/rebuild/keltner_kr1_v1.py'
      - 'backend/research/rebuild/keltner_kr3_v1.py'
      - 'backend/research/rebuild/keltner_m2_context_v1.py'
      - 'backend/research/rebuild/keltner_opportunity_reservation_adapter_v1.py'
      - 'backend/research/rebuild/kr3_d2_failure_exit_v1.py'
      - 'backend/research/rebuild/kr3_d2_failure_study_v1.py'
      - 'backend/research/rebuild/parallel_exit_dev_v1.py'
      - 'backend/research/rebuild/parallel_exit_keltner_v1.py'
      - 'backend/research/rebuild/parallel_exit_metrics_v1.py'
      - 'backend/research/rebuild/step7_candidate_contract_v1.py'
      - 'backend/research/rebuild/step7_kr3_dev_evidence_v1.py'
      - 'backend/research/rebuild/step7_kr3_dev_validation_v1.py'
      - 'backend/research/rebuild/step7_kr3_execution_v1.py'
      - 'backend/research/rebuild/step7_kr3_mechanism_separation_v1.py'
      - 'backend/research/rebuild/step7_kr3_winner_accounting_v1.py'
      - 'backend/research/rebuild/supertrend_flip_ab_v1.py'
      - 'backend/research/rebuild/top5_development_repair_v1.py'
      - 'backend/research/rebuild/top5_diverse_batch_execution_v1.py'
      - 'backend/research/rebuild/top5_diverse_batch_preparation_v1.py'
      - 'backend/research/rebuild/top5_external_metrics_v1.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D2_FAILURE/**'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json'
permissions:
  contents: read
concurrency:
  group: kr3-d2-failure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mandatory completed evidence, never fall back to replay
        run: |
          b=research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D2_FAILURE
          for period in DEV2025 SEEN2026; do
            for name in ATTEMPT.json EXECUTION_STARTED.json RECEIPT.json RESULT.json.gz; do
              test -f "$b/$period/$name"
            done
          done
      - name: Canonical validation and saved-result tests only
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python -m unittest backend.research.rebuild.test_kr3_d2_failure_exit_v1 backend.research.rebuild.test_kr3_d2_closed_verify_v1 -v
          python -m backend.research.rebuild.kr3_d2_closed_verify_v1
          git diff --exit-code
