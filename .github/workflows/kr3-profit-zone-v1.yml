permissions:
  contents: read
jobs:
  verify-saved-economic-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical validation
        run: npm run --prefix frontend/z-os-app-source validate
      - name: Artificial strategy and accounting boundary tests only
        run: |
          python3 -B -m unittest -v backend.research.rebuild.test_kr3_profit_zone_exit_v1
          python3 -B -m unittest discover -s research/development_evidence/KR3_PROFIT_ZONE_PRESERVATION_AFTER_PR1223_V1 -p test_verify_saved.py -v
      - name: Pinned raw costs metrics and complete attribution without replay
        run: |
          python3 -B research/development_evidence/KR3_PROFIT_ZONE_PRESERVATION_AFTER_PR1223_V1/verify_saved.py --manifest-sha256 d8a4eb3df74c24a017694021461e42f73137c4d622eab2ff0153f99b02a85479
          git diff --exit-code
