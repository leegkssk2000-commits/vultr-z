name: KR3 whole-entry failure profit study
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/kr3_whole_entry_failure*.py'
      - 'backend/research/rebuild/test_kr3_whole_entry_failure*.py'
      - 'research/development_evidence/KR3_WHOLE_FAILURE_AFTER_PR1221_V1/**'
      - '.github/workflows/kr3-whole-failure-v1.yml'
permissions:
  contents: read
concurrency:
  group: kr3-whole-failure-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  finite-profit-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      B: research/development_evidence/KR3_WHOLE_FAILURE_AFTER_PR1221_V1
      MOD: backend.research.rebuild.kr3_whole_entry_failure_study_v1
      BRANCH: research/kr3-whole-failure-after-pr1221-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Finite new-scope dispatch check
        id: scope
        run: |
          if [ '${{ github.run_attempt }}' = 1 ] && [ '${{ github.event.pull_request.head.ref }}' = "$BRANCH" ] && [ "$(git log -1 --format=%s)" = 'RUN_ONCE_KR3_WHOLE_FAILURE_AFTER_PR1221_V1' ] && [ ! -f "$B/SPEC.json" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Canonical validation and synthetic causality tests before market inputs
        if: steps.scope.outputs.execute == 'true'
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          mkdir -p out/kr3-whole
          python -m unittest backend.research.rebuild.test_kr3_whole_entry_failure_exit_v1 -v 2>&1 | tee out/kr3-whole/SYNTHETIC_TESTS.log
      - name: Retrieve original archive and decode approved prefixes only
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6d6335d1c9ad7ecb1e9597da85c2eb87635561e1
          mkdir -p /tmp/kr3-source
          git archive 6d6335d1c9ad7ecb1e9597da85c2eb87635561e1 research/data/g5a_stage_v1 | tar -x -C /tmp/kr3-source
          python -m "$MOD" prepare --source /tmp/kr3-source/research/data/g5a_stage_v1 --inputs out/kr3-whole/inputs
      - name: Persist freeze and runtime claim before each of two FULLs
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name kr3-whole-failure-evaluator
          git config user.email actions@users.noreply.github.com
          persist() {
            git add "$B"
            python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not n.startswith(os.environ['B']+'/') for n in names):raise SystemExit('UNSCOPED_WRITE')
          PY
            git diff --cached --quiet || git commit -m "$1 [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          }
          python -m "$MOD" freeze --inputs out/kr3-whole/inputs
          persist 'research: freeze KR3 whole-entry failure rule before outcomes'
          for period in DEV2025 SEEN2026; do
            python -m "$MOD" reserve --period "$period"
            persist "research: reserve KR3 failure $period before actual replay"
            remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
            timeout 180 python -u -m "$MOD" execute --period "$period" --inputs out/kr3-whole/inputs --remote-sha "$remote"
            persist "research: preserve KR3 whole-entry failure $period result"
          done
          python -m "$MOD" summarize
          persist 'research: report single KR3 profit candidate whole economics'
      - name: Preserve any checkpoint without retry
        if: always() && steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name kr3-whole-failure-evaluator
          git config user.email actions@users.noreply.github.com
          git add "$B"
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve KR3 whole failure checkpoint no retry [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p out/kr3-whole
          git archive HEAD "$B" backend/research/rebuild/kr3_whole_entry_failure_exit_v1.py backend/research/rebuild/kr3_whole_entry_failure_study_v1.py backend/research/rebuild/test_kr3_whole_entry_failure_exit_v1.py .github/workflows/kr3-whole-failure-v1.yml > out/kr3-whole/code-results.tar
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.execute == 'true'
        with:
          name: kr3-whole-failure-${{ github.run_id }}
          path: out/kr3-whole
          retention-days: 90
