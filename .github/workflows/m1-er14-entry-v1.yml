name: M1 ER14 entry finite comparison
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/*m1_er14*.py'
      - 'research/development_evidence/M1_ER14_ENTRY_AFTER_PR1231_V1/**'
      - '.github/workflows/m1-er14-entry-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: m1-er14-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  finite-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      B: research/development_evidence/M1_ER14_ENTRY_AFTER_PR1231_V1
      BRANCH: research/m1-er14-entry-after-pr1231-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Exact single authorized dispatch
        id: scope
        env:
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" = 1 ] && [ "$HEAD_REF" = "$BRANCH" ] && [ "$(git log -1 --format=%s)" = 'RUN_M1_ER14_TWO_20260909' ] && [ ! -f "$B/SPEC.json" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Full-checkout preflight and synthetic boundaries
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
          mkdir -p out/m1-er14
          python -B -m unittest backend.research.rebuild.test_m1_er14_entry_v1 backend.research.rebuild.test_chart_mechanism_execution_v1 backend.research.rebuild.test_chart_mechanism_c54_binding_v1 -v > out/m1-er14/SYNTHETIC_QA.log 2>&1
          cat out/m1-er14/SYNTHETIC_QA.log
          python -m py_compile backend/research/rebuild/m1_er14_study_v1.py
      - uses: actions/download-artifact@v4
        if: steps.scope.outputs.execute == 'true'
        with:
          name: kr3-profit-zone-34282003231
          run-id: 34282003231
          github-token: ${{ github.token }}
          path: out/parent51
      - name: Freeze then persist a runtime claim before each first FULL
        if: steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name m1-er14-evaluator
          git config user.email actions@users.noreply.github.com
          persist() {
            git add "$B"
            python - <<'PY'
          import os,subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not p.startswith(os.environ['B']+'/') for p in files):raise SystemExit('UNSCOPED_WRITE')
          PY
            git diff --cached --quiet || git commit -m "$1 [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          }
          python -m backend.research.rebuild.m1_er14_study_v1 freeze --inputs out/parent51/inputs
          persist 'research: freeze one M1 ER rule before market features'
          python -m backend.research.rebuild.m1_er14_study_v1 applicability --inputs out/parent51/inputs
          persist 'research: persist ER eligibility applicability before economics'
          if [ -f "$B/NOT_RUN.json" ]; then exit 0; fi
          for per in DEV2025 SEEN2026; do
            python -m backend.research.rebuild.m1_er14_study_v1 reserve --period "$per"
            persist "research: reserve M1 ER $per before replay"
            remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
            test "$remote" = "$(git rev-parse HEAD)"
            timeout 150 python -u -m backend.research.rebuild.m1_er14_study_v1 execute --inputs out/parent51/inputs --period "$per" --remote-sha "$remote"
            persist "research: preserve M1 ER $per actual result"
          done
          python -m backend.research.rebuild.m1_er14_study_v1 summarize
          persist 'research: save two M1 ER comparisons'
      - name: Preserve finite checkpoint without retry
        if: always() && steps.scope.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name m1-er14-evaluator
          git config user.email actions@users.noreply.github.com
          git add "$B"
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve M1 ER checkpoint without replay [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p out/m1-er14
          git archive HEAD "$B" backend/research/rebuild/m1_er14_entry_v1.py backend/research/rebuild/test_m1_er14_entry_v1.py backend/research/rebuild/m1_er14_study_v1.py .github/workflows/m1-er14-entry-v1.yml > out/m1-er14/code-results.tar
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.execute == 'true'
        with:
          name: m1-er14-${{ github.run_id }}
          path: out/m1-er14
          retention-days: 90
