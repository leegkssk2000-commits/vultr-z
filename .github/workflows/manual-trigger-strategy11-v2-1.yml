name: Manual Trigger Strategy11 V2.1 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/manual-trigger-strategy11-v2-1.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch only when no active V2.1 run exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='r7a4d-strategy11-unattended-improvement-v2-1.yml'
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch master --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          result='SKIP_ACTIVE'
          if [ "$active" -eq 0 ]; then
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref master
            result='DISPATCHED'
            sleep 8
          fi
          latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch master --limit 1 --json databaseId,status,conclusion,event,headSha,createdAt,url)"
          mkdir -p /tmp/receipt
          printf 'result=%s\nactive_before=%s\nlatest=%s\n' "$result" "$active" "$latest" > /tmp/receipt/strategy11-v2-1-latest.txt
          encoded="$(base64 -w0 /tmp/receipt/strategy11-v2-1-latest.txt)"
          path='.github/manual_trigger_receipts/strategy11-v2-1-latest.txt'
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=master" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Strategy11 V2.1 manual dispatch' -f content="$encoded" -f branch=master)
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
