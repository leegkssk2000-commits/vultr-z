name: R3 exact25 whole-set structural gate v1

on:
  pull_request:
    paths:
      - 'backend/research/rebuild/strategy25_structural_inventory_v2.json'
      - 'backend/research/rebuild/strategy25_complete_policy_progress_v1.json'
      - 'backend/research/rebuild/r3_exact25_gate_v1.py'
      - '.github/workflows/r3-exact25-whole-set-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact25-whole-set-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile R3 gate and all structural policy owners
        run: |
          python -m py_compile \
            backend/research/rebuild/r3_exact25_gate_v1.py \
            backend/research/rebuild/policy_kernel_v1.py \
            backend/research/rebuild/turtle_trend_policy_v2.py \
            backend/research/rebuild/bb_revert_policy_v2.py \
            backend/research/rebuild/vwap_bb_policy_batch_v1.py \
            backend/research/rebuild/breakout_policy_batch_v1.py \
            backend/research/rebuild/trend_policy_batch_v1.py \
            backend/research/rebuild/microstructure_policy_batch_v1.py \
            backend/research/rebuild/reversal_range_policy_batch_v1.py \
            backend/research/rebuild/indicator_core_policy_batch_v1.py \
            backend/research/rebuild/final_four_policy_batch_v1.py
      - name: Verify exact25 structural inventory and R2T coverage
        run: python backend/research/rebuild/r3_exact25_gate_v1.py
