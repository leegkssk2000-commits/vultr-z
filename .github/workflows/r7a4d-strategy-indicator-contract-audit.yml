name: R7A4D Strategy Indicator Contract Audit

on:
  push:
    branches:
      - r7a4d-strategy-indicator-contract-repair-v1
    paths:
      - 'backend/strategies/**'
      - 'backend/strategy25/indicator_contract_repair_adapter_v1.py'
      - 'backend/strategy25/indicator_contract_repair_loader_v1.py'
      - 'backend/contracts/ZOS_STRATEGY_INDICATOR_CONTRACTS_v1.json'
      - 'backend/tools/z_strategy_indicator_contract_audit.py'
      - 'tests/test_indicator_contract*.py'
      - '.github/workflows/r7a4d-strategy-indicator-contract-audit.yml'
  pull_request:
    branches:
      - r7a4d-strategy-indicator-contract-repair-v1
    paths:
      - 'backend/strategies/**'
      - 'backend/strategy25/indicator_contract_repair_adapter_v1.py'
      - 'backend/strategy25/indicator_contract_repair_loader_v1.py'
      - 'backend/contracts/ZOS_STRATEGY_INDICATOR_CONTRACTS_v1.json'
      - 'backend/tools/z_strategy_indicator_contract_audit.py'
      - 'tests/test_indicator_contract*.py'
      - '.github/workflows/r7a4d-strategy-indicator-contract-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas

      - name: Compile audit and repair adapter
        run: |
          python -m py_compile backend/tools/z_strategy_indicator_contract_audit.py
          python -m py_compile backend/strategy25/indicator_contract_repair_adapter_v1.py
          python -m py_compile backend/strategy25/indicator_contract_repair_loader_v1.py
          python -m py_compile tests/test_indicator_contract_repair_adapter_v1.py
          python -m py_compile tests/test_indicator_contract_ci_probe_v1.py

      - name: Run child repair tests and preserve diagnostics
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests.test_indicator_contract_repair_adapter_v1 \
            tests.test_indicator_contract_ci_probe_v1 \
            2>&1 | tee child_repair_tests.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > child_repair_tests.rc
          exit 0

      - name: Run canonical indicator audit and preserve diagnostics
        shell: bash
        run: |
          set +e
          python backend/tools/z_strategy_indicator_contract_audit.py \
            2>&1 | tee strategy_indicator_audit.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > strategy_indicator_audit.rc
          exit 0

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-indicator-contract-audit-v1
          path: |
            artifacts/strategy_indicator_contract_audit_v1/audit.json
            artifacts/strategy_indicator_contract_audit_v1/audit.md
            child_repair_tests.log
            child_repair_tests.rc
            strategy_indicator_audit.log
            strategy_indicator_audit.rc
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce validation result
        shell: bash
        run: |
          test "$(cat child_repair_tests.rc)" = "0"
          test "$(cat strategy_indicator_audit.rc)" = "0"
