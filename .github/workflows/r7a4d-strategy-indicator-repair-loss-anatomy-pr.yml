name: R7A4D Strategy Indicator Repair Loss Anatomy

on:
  pull_request:
    branches:
      - r7a4d-strategy-indicator-contract-repair-v1
    paths:
      - 'backend/tools/r7a4d_strategy_indicator_repair_loss_anatomy.py'
      - 'backend/tools/r7a4d_strategy_indicator_repairs_real_oos.py'
      - 'backend/strategy25/indicator_contract_repair_adapter_v1.py'
      - 'backend/strategy25/indicator_contract_repair_loader_v1.py'
      - 'backend/strategies/common_utils.py'
      - '.github/workflows/r7a4d-strategy-indicator-repair-loss-anatomy-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loss-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas

      - name: Compile anatomy runner
        run: PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy_indicator_repair_loss_anatomy.py

      - name: Run fixed two-window loss anatomy
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python backend/tools/r7a4d_strategy_indicator_repair_loss_anatomy.py --root . \
            2>&1 | tee strategy_indicator_repair_loss_anatomy.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > strategy_indicator_repair_loss_anatomy.rc
          exit 0

      - name: Upload anatomy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-indicator-repair-loss-anatomy-v1
          path: |
            artifacts/strategy_indicator_repair_loss_anatomy_v1/anatomy.json
            strategy_indicator_repair_loss_anatomy.log
            strategy_indicator_repair_loss_anatomy.rc
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce anatomy integrity
        run: test "$(cat strategy_indicator_repair_loss_anatomy.rc)" = "0"
