name: R7A4D Strategy Indicator Runtime Owner Audit

on:
  push:
    branches:
      - r7a4d-strategy-indicator-contract-runtime-owner-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit
        run: python -m py_compile backend/tools/r7a4d_strategy_indicator_runtime_owner_audit.py
      - name: Run audit
        run: |
          python backend/tools/r7a4d_strategy_indicator_runtime_owner_audit.py \
            --root "$GITHUB_WORKSPACE" \
            --target-sha "$GITHUB_SHA" | tee strategy_indicator_runtime_owner_audit.log
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: r7a4d-strategy-indicator-runtime-owner-audit
          path: |
            runtime/r7a4d_strategy_indicator_runtime_owner_audit_v1/summary_v1.json
            strategy_indicator_runtime_owner_audit.log
