name: R7A4D Strategy11 Advisory Hold Integrity Fixture V1

on:
  pull_request:
    branches:
      - master
    paths:
      - backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1_1.py
      - backend/tools/r7a4d_strategy11_path_candidate_state_v1.py
      - backend/tools/r7a4d_strategy11_path_search_ledger_update_v1.py
      - backend/research/strategy11_pre_shadow_path_optimize_planner_v1_2.py
      - backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py
      - backend/tools/r7a4d_strategy11_advisory_hold_integrity_fixture_v1.py
      - scripts/strategy11_groq_redteam_v1_2.py
      - .github/workflows/r7a4d-strategy11-advisory-hold-integrity-fixture-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile repaired modules
        run: |
          python -m py_compile \
            backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1_1.py \
            backend/tools/r7a4d_strategy11_path_candidate_state_v1.py \
            backend/tools/r7a4d_strategy11_path_search_ledger_update_v1.py \
            backend/research/strategy11_pre_shadow_path_optimize_planner_v1_2.py \
            backend/tools/r7a4d_strategy11_advisory_hold_integrity_fixture_v1.py \
            scripts/strategy11_groq_redteam_v1_2.py
      - name: Verify advisory hold integrity end to end
        env:
          PYTHONPATH: .
        run: python backend/tools/r7a4d_strategy11_advisory_hold_integrity_fixture_v1.py
      - name: Verify existing quota runtime fixture
        env:
          PYTHONPATH: .
        run: |
          python backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py \
            --root /tmp/g7-quota-runtime-fixture \
            --workflow .github/workflows/r7a4d-strategy11-generation7-quota-state-machine-v1.yml \
            --groq-client scripts/strategy11_groq_redteam_v1_2.py
