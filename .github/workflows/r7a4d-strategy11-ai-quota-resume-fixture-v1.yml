name: R7A4D Strategy11 AI Quota Resume Fixture V1

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/strategy11_ai_review_router_v3.py
      - scripts/strategy11_ai_review_router_v3_1.py
      - scripts/strategy11_groq_redteam_v1_2.py
      - backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1.py
      - backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1_1.py
      - backend/tools/r7a4d_strategy11_ai_quota_resume_fixture_v1.py
      - backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py
      - backend/tools/r7a4d_strategy11_hold_badrequest_fixture_v1.py
      - .github/workflows/r7a4d-strategy11-ai-quota-resume-fixture-v1.yml
      - .github/workflows/r7a4d-strategy11-generation7-quota-state-machine-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-ai-quota-resume-fixture-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  verify-quota-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile resumable router and state machine
        run: |
          python -m py_compile \
            scripts/strategy11_ai_review_router_v3.py \
            scripts/strategy11_ai_review_router_v3_1.py \
            scripts/strategy11_groq_redteam_v1_2.py \
            backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1.py \
            backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1_1.py \
            backend/tools/r7a4d_strategy11_ai_quota_resume_fixture_v1.py \
            backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py \
            backend/tools/r7a4d_strategy11_hold_badrequest_fixture_v1.py
      - name: Execute cache reuse and Groq short-circuit fixture
        run: |
          python backend/tools/r7a4d_strategy11_ai_quota_resume_fixture_v1.py \
            --root artifacts/quota-resume-fixture \
            --policy backend/research/strategy11_ai_review_router_v1.json \
            --router scripts/strategy11_ai_review_router_v3_1.py \
            --driver backend/tools/r7a4d_strategy11_generation7_quota_state_machine_v1_1.py
      - name: Execute reserved provider-output retry fixture
        run: |
          python backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py \
            --root artifacts/quota-runtime-fixture \
            --workflow .github/workflows/r7a4d-strategy11-generation7-quota-state-machine-v1.yml \
            --groq-client scripts/strategy11_groq_redteam_v1_2.py
      - name: Execute advisory-hold and BadRequest closure fixture
        run: |
          python backend/tools/r7a4d_strategy11_hold_badrequest_fixture_v1.py \
            --root artifacts/hold-badrequest-fixture \
            --groq-client scripts/strategy11_groq_redteam_v1_2.py
      - name: Assert fail-closed authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          resume=json.loads(Path('artifacts/quota-resume-fixture/summary.json').read_text())
          runtime=json.loads(Path('artifacts/quota-runtime-fixture/summary.json').read_text())
          closure=json.loads(Path('artifacts/hold-badrequest-fixture/summary.json').read_text())
          assert resume['state']=='PASS_AI_QUOTA_RESUME_FIXTURE'
          assert resume['cached_provider_reviews_reused']==3
          assert resume['workers_calls_avoided_by_groq_reject']==1
          assert resume['new_provider_calls']==0
          assert runtime['state']=='PASS_GENERATION7_PROVIDER_OUTPUT_RETRY_FIXTURE'
          assert runtime['daily_new_candidate_budget_used']==10
          assert runtime['daily_new_candidate_budget_remaining']==0
          assert runtime['reserved_retry_candidate_count']==4
          assert runtime['reserved_retry_attempt']==2
          assert runtime['new_candidates_consumed_by_retry']==0
          assert runtime['mixed_wait_state']=='WAIT_GENERATION7_PROVIDER_RETRY'
          assert closure['state']=='PASS_GENERATION7_HOLD_BADREQUEST_CLOSURE_FIXTURE'
          assert closure['classification']=={
            'advisory_hold':'ADVISORY_HOLD',
            'badrequest_retry':'WAIT_PROVIDER_RETRY',
            'inconclusive_hold':'BLOCKER',
            'semantic_reject':'SEMANTIC_REJECT',
          }
          assert closure['advisory_hold_count']==1
          assert closure['semantic_reject_count']==1
          assert closure['terminal_next']=='WAIT_NEW_EVIDENCE'
          assert closure['badrequest_json_mode_fallback'] is True
          assert closure['new_candidate_budget_consumed']==0
          for summary in (resume,runtime,closure):
            assert summary['promotion_authority'] is False
            assert summary['protected_mutations']==0
            assert summary['execution_allowed'] is False
            assert summary['order_authority']=='BLOCKED'
          print(resume['state'],runtime['state'],closure['state'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-ai-quota-resume-fixture-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
