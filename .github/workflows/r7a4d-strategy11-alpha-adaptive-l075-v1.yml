name: R7A4D Strategy11 Alpha Adaptive L075 V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-alpha-adaptive-l080-v1
    paths:
      - backend/tools/r7a4d_strategy11_alpha_adaptive_l075_v1.py
      - .github/workflows/r7a4d-strategy11-alpha-adaptive-l075-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-alpha-adaptive-l075-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'

jobs:
  alpha_l075:
    name: alpha_combo adaptive L075 strict target
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile L075 runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_alpha_adaptive_l075_v1.py

      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download alpha_combo authority evidence
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download L085 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-adaptive-l085-v1-30327226304-attempt-1
          path: input/l085
          github-token: ${{ github.token }}
          run-id: 30327226304

      - name: Download L080 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-adaptive-l080-v1-30328459739-attempt-1
          path: input/l080
          github-token: ${{ github.token }}
          run-id: 30328459739

      - name: Verify adaptive authorities and no sealed reuse
        run: |
          test -f input/fresh/manifest.json
          test -f input/evidence/alpha_combo/summary.json
          test -f input/l085/summary.json
          test -f input/l080/summary.json
          test ! -e input/sealed
          python - <<'PY'
          import json
          from pathlib import Path
          l85=json.loads(Path('input/l085/summary.json').read_text())
          l80=json.loads(Path('input/l080/summary.json').read_text())
          assert l85['state']=='PASS_L085_RESEARCH_CANDIDATE'
          assert l85['winner']=='L085_STOP065_CONTROL'
          assert l80['state']=='PASS_L080_RESEARCH_CANDIDATE'
          assert l80['winner']=='L080_STOP065_CONTROL'
          assert l85['sealed_holdback_read'] is False
          assert l80['sealed_holdback_read'] is False
          assert l80['promotion_authority'] is False
          PY

      - name: Run L075 strict target replay
        run: |
          python backend/tools/r7a4d_strategy11_alpha_adaptive_l075_v1.py \
            --root . \
            --fresh-root input/fresh \
            --baseline-summary input/evidence/alpha_combo/summary.json \
            --l085-summary input/l085/summary.json \
            --l080-summary input/l080/summary.json \
            --out out \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA"

      - name: Assert L075 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/summary.json').read_text())
          assert d['state'] in {'PASS_L075_RESEARCH_CANDIDATE','HOLD_L075_TARGET'}
          assert d['loss_ladder_stage']=='L075_TARGET'
          assert d['promotion_authority'] is False
          assert d['requires_w1_confirmation'] is True
          assert d['requires_new_sealed_holdback'] is True
          assert d['sealed_holdback_read'] is False
          assert d['canonical_mutated'] is False
          assert d['registry_mutated'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert len(d['variants'])==3
          for row in d['variants']:
              assert row['parity']['state']=='PASS'
              assert row['parity']['duplicate_trade_count']==0
              check=row['strict_target_check']
              if check['strict_target_pass']:
                  assert check['normal_worst_net_loss_R'] >= -0.75
                  assert check['stress_worst_net_loss_R'] >= -0.75
                  assert check['normal_breach_count']==0
                  assert check['stress_breach_count']==0
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/summary.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# alpha_combo adaptive L075 strict target\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Winner: {d['winner']}\n")
              out.write(f"- Eligible: {d['eligible_count']}\n")
              out.write(f"- Next: {d['next']}\n")
              for row in d['variants']:
                  loss=row['loss_metrics']; stress=row['stress_2x_p95_plus_one']['loss_metrics']; check=row['strict_target_check']
                  out.write(
                      f"- {row['variant_id']}: trades={row['trade_count']} WR={row['win_rate_pct']:.2f}% "
                      f"Net={row['net_return_pct_sum']:.6f}% PF={row['net_profit_factor']:.4f} "
                      f"payoff={row['payoff_ratio']:.4f} DD={row['max_drawdown_pct']:.6f}% "
                      f"avgLoss={loss['avg_loss_R']:.4f}R worst={loss['worst_net_loss_R']:.4f}R "
                      f"stressWorst={stress['worst_net_loss_R']:.4f}R strictPass={check['strict_target_pass']}\n"
                  )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-alpha-adaptive-l075-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
