name: R7A4D Strategy11 Alpha Adaptive L085 V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-gemini-active-research-v3-1-json-shape
    paths:
      - backend/research/strategy11_adaptive_repair_ssot_v2.json
      - backend/tools/r7a4d_strategy11_alpha_adaptive_l085_v1.py
      - .github/workflows/r7a4d-strategy11-alpha-adaptive-l085-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-alpha-adaptive-l085-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  PRIOR_RUN_ID: '30278422559'

jobs:
  alpha_adaptive_l085:
    name: alpha_combo adaptive L085 discovery replay
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile adaptive runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_alpha_adaptive_l085_v1.py

      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download alpha_combo authority evidence
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download prior cost-aware fresh winner
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-cost-aware-stop-v1-30278422559-attempt-1
          path: input/prior
          github-token: ${{ github.token }}
          run-id: 30278422559

      - name: Verify immutable inputs and no sealed reuse
        run: |
          test -f input/fresh/manifest.json
          test -f input/evidence/alpha_combo/summary.json
          test -f input/prior/summary.json
          test ! -e input/sealed
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('input/prior/summary.json').read_text())
          assert p['strategy_id']=='alpha_combo'
          assert p['state']=='PASS_TO_SEALED'
          assert p['winner']=='STOP_MULT_065_REFERENCE_R'
          assert p['sealed_holdback_read'] is False
          PY

      - name: Run adaptive L085 full-state replay
        run: |
          python backend/tools/r7a4d_strategy11_alpha_adaptive_l085_v1.py \
            --root . \
            --fresh-root input/fresh \
            --baseline-summary input/evidence/alpha_combo/summary.json \
            --prior-summary input/prior/summary.json \
            --adaptive-ssot backend/research/strategy11_adaptive_repair_ssot_v2.json \
            --out out \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA"

      - name: Assert adaptive research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/summary.json').read_text())
          assert d['state'] in {'PASS_L085_RESEARCH_CANDIDATE','NO_L085_CANDIDATE'}
          assert d['loss_ladder_stage']=='L085_DISCOVERY'
          assert d['promotion_authority'] is False
          assert d['sealed_holdback_read'] is False
          assert d['canonical_mutated'] is False
          assert d['registry_mutated'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert len(d['variants'])==4
          for row in d['variants']:
              assert row['parity']['state']=='PASS'
              assert row['parity']['duplicate_trade_count']==0
          print(json.dumps({'state':d['state'],'winner':d['winner'],'next':d['next']},sort_keys=True))
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/summary.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# alpha_combo adaptive L085 discovery\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Winner: {d['winner']}\n")
              out.write(f"- Next: {d['next']}\n")
              out.write('- Final promotion authority: false\n')
              for row in d['variants']:
                  loss=row['loss_metrics']; stress=row['stress_2x_p95_plus_one']['loss_metrics']
                  check=row.get('adaptive_research_check',{})
                  out.write(
                      f"- {row['variant_id']}: trades={row['trade_count']} WR={row['win_rate_pct']:.2f}% "
                      f"Net={row['net_return_pct_sum']:.6f}% PF={row['net_profit_factor']:.4f} "
                      f"payoff={row['payoff_ratio']:.4f} DD={row['max_drawdown_pct']:.6f}% "
                      f"avgLoss={loss['avg_loss_R']:.4f}R worst={loss['worst_net_loss_R']:.4f}R "
                      f"stressWorst={stress['worst_net_loss_R']:.4f}R researchPass={check.get('research_pass')}\n"
                  )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-alpha-adaptive-l085-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
