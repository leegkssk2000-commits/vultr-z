name: R7A4D Strategy11 Alpha Cost-Aware Gate Causal Audit V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-gemini-active-research-v3-1-json-shape
    paths:
      - backend/tools/r7a4d_strategy11_alpha_cost_aware_gate_causal_audit_v1.py
      - .github/workflows/r7a4d-strategy11-alpha-cost-aware-gate-causal-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-alpha-cost-aware-gate-causal-audit-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: alpha_combo cost-aware gate causal audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_alpha_cost_aware_gate_causal_audit_v1.py

      - name: Download latest Gemini V3.1 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-gemini-active-research-v3-1-30302007460-attempt-1
          path: input/gemini-v3-1
          github-token: ${{ github.token }}
          run-id: '30302007460'

      - name: Run causal audit
        run: |
          python backend/tools/r7a4d_strategy11_alpha_cost_aware_gate_causal_audit_v1.py \
            --gemini-root input/gemini-v3-1 \
            --out out

      - name: Assert fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/summary.json').read_text())
          assert d['strategy_id']=='alpha_combo'
          assert d['source_authority']['pr']==222
          assert d['canonical_mutated'] is False
          assert d['registry_mutated'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          assert d['state'] in {'PASS_TO_ISOLATED_REPLAY','HOLD'}
          print(json.dumps({'state':d['state'],'blockers':d['blockers'],'next':d['next']}, sort_keys=True))
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/summary.json')
          if not p.exists():
              raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('# alpha_combo cost-aware gate causal audit\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Trades: `{d['audit']['trade_count']}`\n")
              out.write(f"- Expected-return feature coverage: `{d['audit']['expected_return_feature_completeness_pct']}%`\n")
              out.write(f"- Blockers: `{d['blockers']}`\n")
              out.write(f"- Next: `{d['next']}`\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-alpha-cost-aware-gate-causal-audit-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
