name: R7A4D Strategy11 Alpha Multiobjective Auto V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-alpha-adaptive-l075-v1
    paths:
      - backend/tools/r7a4d_strategy11_alpha_multiobjective_auto_v1.py
      - backend/research/alpha_multiobjective_auto_v1.json
      - .github/workflows/r7a4d-strategy11-alpha-multiobjective-auto-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-multiobjective-auto-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'

jobs:
  optimize:
    name: TIME neighborhood plus Gemini-selected win-rate repair
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile optimizer
        run: python -m py_compile backend/tools/r7a4d_strategy11_alpha_multiobjective_auto_v1.py

      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download alpha baseline authority
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download L085 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-adaptive-l085-v1-30327226304-attempt-1
          path: input/l085
          github-token: ${{ github.token }}
          run-id: '30327226304'

      - name: Download L075 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-adaptive-l075-v1-30329120944-attempt-1
          path: input/l075
          github-token: ${{ github.token }}
          run-id: '30329120944'

      - name: Verify immutable authorities
        run: |
          test -f input/fresh/manifest.json
          test -f input/evidence/alpha_combo/summary.json
          test -f input/l085/summary.json
          test -f input/l075/summary.json
          test ! -e input/sealed
          python - <<'PY'
          import json
          from pathlib import Path
          l85=json.loads(Path('input/l085/summary.json').read_text())
          l75=json.loads(Path('input/l075/summary.json').read_text())
          assert l85['state']=='PASS_L085_RESEARCH_CANDIDATE'
          assert l75['state']=='PASS_L075_RESEARCH_CANDIDATE'
          assert l75['winner']=='L075_STOP065_CONTROL'
          assert l75['sealed_holdback_read'] is False
          assert l75['promotion_authority'] is False
          PY

      - name: Run two-generation multiobjective optimizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/tools/r7a4d_strategy11_alpha_multiobjective_auto_v1.py \
            --root . \
            --fresh-root input/fresh \
            --baseline-summary input/evidence/alpha_combo/summary.json \
            --l085-summary input/l085/summary.json \
            --l075-summary input/l075/summary.json \
            --policy backend/research/alpha_multiobjective_auto_v1.json \
            --video-registry backend/research/strategy11_gemini_video_registry_v2.json \
            --out out \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA"

      - name: Assert multiobjective contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/summary.json').read_text())
          assert d['state'] in {'PASS_MULTIOBJECTIVE_RESEARCH_CANDIDATES','HOLD_NO_STRICT_CANDIDATE'}
          assert d['generation_count']==2
          assert d['same_dataset_generation_budget_exhausted'] is True
          assert d['same_window_infinite_search_forbidden'] is True
          assert d['gemini_audit']['GEMINI_USED'] is True
          assert d['gemini_audit']['free_only'] is True
          assert d['gemini_audit']['public_video_count'] >= 4
          assert d['gemini_audit']['independent_channel_count'] >= 4
          assert len(d['gemini_audit']['selected_candidate_ids']) <= 2
          assert len(d['active_candidate_queue']) <= 3
          assert d['requires_w1_fresh_non_overlap'] is True
          assert d['requires_new_sealed_holdback'] is True
          assert d['sealed_holdback_read'] is False
          assert d['promotion_authority'] is False
          assert d['canonical_mutated'] is False
          assert d['registry_mutated'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          for row in d['variants']:
              assert row['parity']['state']=='PASS'
              assert row['parity']['duplicate_trade_count']==0
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/summary.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# alpha_combo multiobjective auto optimizer\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Profit max: `{d['profit_max_control']}`\n")
              out.write(f"- Balanced WR: `{d['balanced_wr_control']}`\n")
              out.write(f"- Robust: `{d['robust_control']}`\n")
              out.write(f"- Pareto: `{', '.join(d['pareto_frontier'])}`\n")
              out.write(f"- Active queue: `{', '.join(d['active_candidate_queue'])}`\n")
              out.write(f"- Gemini picks: `{', '.join(d['gemini_audit']['selected_candidate_ids'])}`\n")
              out.write(f"- Next: `{d['next']}`\n")
              for row in d['variants']:
                  m=row.get('multiobjective',{})
                  out.write(
                      f"- {row['variant_id']}: trades={row['trade_count']} WR={row['win_rate_pct']:.2f}% "
                      f"Net={row['net_return_pct_sum']:.6f}% PF={row['net_profit_factor']:.4f} "
                      f"payoff={row['payoff_ratio']:.4f} DD={row['max_drawdown_pct']:.6f}% "
                      f"worst={row['loss_metrics']['worst_net_loss_R']:.4f}R "
                      f"stressWorst={row['stress_2x_p95_plus_one']['loss_metrics']['worst_net_loss_R']:.4f}R "
                      f"strict={m.get('strict',{}).get('pass')}\n"
                  )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-alpha-multiobjective-auto-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
