name: R7A4D Strategy11 Alpha Reference R Lock V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-alpha-repair-v2
    paths:
      - 'backend/tools/r7a4d_strategy11_alpha_reference_r_lock_v1.py'
      - '.github/workflows/r7a4d-strategy11-alpha-reference-r-lock-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-alpha-reference-r-lock-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  ITERATION1_RUN_ID: '30262701736'
  ITERATION2_RUN_ID: '30264493769'

jobs:
  reference_r_recheck:
    name: alpha_combo fixed-reference R re-adjudication
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile fixed-reference R runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_alpha_reference_r_lock_v1.py
      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: artifacts/strategy11_evidence_data_v1/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download alpha_combo authority evidence
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: artifacts/strategy11_evidence_v1
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download verified iteration 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-repair-v1-30262701736-attempt-1
          path: artifacts/strategy11_alpha_repair_v1_authority
          github-token: ${{ github.token }}
          run-id: 30262701736
      - name: Download verified iteration 2 artifact
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-repair-v2-30264493769-attempt-1
          path: artifacts/strategy11_alpha_repair_v2_authority
          github-token: ${{ github.token }}
          run-id: 30264493769
      - name: Verify immutable inputs and lineage
        run: |
          test -f artifacts/strategy11_evidence_data_v1/fresh/manifest.json
          test -f artifacts/strategy11_evidence_v1/alpha_combo/summary.json
          test -f artifacts/strategy11_alpha_repair_v1_authority/summary.json
          test -f artifacts/strategy11_alpha_repair_v2_authority/summary.json
          test ! -e artifacts/strategy11_evidence_data_v1/sealed/market
          python - <<'PY'
          import json
          from pathlib import Path
          i1=json.loads(Path('artifacts/strategy11_alpha_repair_v1_authority/summary.json').read_text())
          i2=json.loads(Path('artifacts/strategy11_alpha_repair_v2_authority/summary.json').read_text())
          assert i1['state']=='HOLD' and i1['next']=='ITERATION_2_PARTIAL_OR_TRAILING'
          assert i2['state']=='HOLD' and i2['next']=='ITERATION_3_TIME_STOP_OR_SINGLE_GATE'
          assert i1['sealed_holdback_read'] is False and i2['sealed_holdback_read'] is False
          assert i1['source_run_id']=='30252022416' and i2['source_run_id']=='30252022416'
          assert i1['source_head_sha']=='64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
          assert i2['source_head_sha']=='64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
          PY
      - name: Run fixed-reference R re-adjudication
        id: recheck
        run: |
          python backend/tools/r7a4d_strategy11_alpha_reference_r_lock_v1.py \
            --root . \
            --fresh-root artifacts/strategy11_evidence_data_v1/fresh \
            --baseline-summary artifacts/strategy11_evidence_v1/alpha_combo/summary.json \
            --iteration1-summary artifacts/strategy11_alpha_repair_v1_authority/summary.json \
            --iteration2-summary artifacts/strategy11_alpha_repair_v2_authority/summary.json \
            --ssot backend/research/strategy11_improvement_ssot_v1.json \
            --out artifacts/strategy11_alpha_reference_r_lock_v1 \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA"
      - name: Write fixed-reference R summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/strategy11_alpha_reference_r_lock_v1/summary.json')
          if not p.exists():
              raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('# alpha_combo fixed-reference R re-adjudication\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Reference R lock: {d['reference_r_lock']['state']}\n")
              out.write(f"- Eligible for sealed: {d['eligible_for_sealed_one_shot']}\n")
              out.write(f"- Sealed read: {d['sealed_holdback_read']}\n")
              if d.get('blockers'):
                  out.write('- Blockers: ' + ', '.join(d['blockers']) + '\n')
              for row in d['variants']:
                  loss=row['loss_metrics']
                  stress=row['stress_2x_p95_plus_one']['loss_metrics']
                  out.write(
                      f"- {row['variant_id']}: trades={row['trade_count']} WR={row['win_rate_pct']} "
                      f"Net={row['net_return_pct_sum']} PF={row['net_profit_factor']} payoff={row['payoff_ratio']} "
                      f"avgLossR={loss['avg_loss_R']} worstR={loss['worst_net_loss_R']} breaches={loss['loss_cap_breach_count']} "
                      f"stressWorstR={stress['worst_net_loss_R']} stressBreaches={stress['loss_cap_breach_count']}\n"
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-alpha-reference-r-lock-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_alpha_reference_r_lock_v1
          if-no-files-found: error
          retention-days: 30
