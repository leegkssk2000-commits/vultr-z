name: R7A4D Strategy11 Attribution Ledger V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/strategy11_attribution_ledger_v1.py
      - backend/research/fixtures/strategy11_attribution_ledger_v1_fixture.json
      - .github/workflows/r7a4d-strategy11-attribution-ledger-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile backend/research/strategy11_attribution_ledger_v1.py
      - run: |
          mkdir -p artifacts/strategy11_attribution_ledger_v1
          python backend/research/strategy11_attribution_ledger_v1.py --input backend/research/fixtures/strategy11_attribution_ledger_v1_fixture.json --output artifacts/strategy11_attribution_ledger_v1/result.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/strategy11_attribution_ledger_v1/result.json').read_text())
          assert d['status']=='PASS_STRATEGY_ATTRIBUTION_LEDGER'
          assert d['trade_count']==3
          assert abs(d['total_net_pnl_r']-1.83)<1e-9
          assert d['append_only'] is True and d['runtime_bound'] is False
          assert d['research_only'] is True and d['promotion_authority'] is False
          assert d['protected_mutations']==0 and d['execution_allowed'] is False and d['order_authority']=='BLOCKED'
          assert 'strategy:alpha_combo' in d['attribution']
          assert 'regime:UP' in d['attribution']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-attribution-ledger-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_attribution_ledger_v1
          if-no-files-found: error
          retention-days: 90
