name: R7A4D Strategy11 Canonical Trigger Trace V1

on:
  pull_request:
    branches:
      - strategy11-zero-trade-funnel-v1
    paths:
      - backend/tools/r7a4d_strategy11_canonical_trigger_trace_v1.py
      - .github/workflows/r7a4d-strategy11-canonical-trigger-trace-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'

concurrency:
  group: r7a4d-strategy11-canonical-trigger-trace-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-trigger-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download exact baseline evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/evidence
          for batch in 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "s11-evidence-batch-${batch}-${SOURCE_RUN_ID}-attempt-1" \
              --dir "input/evidence/batch-${batch}"
          done
      - name: Compile canonical trigger trace
        run: python -m py_compile backend/tools/r7a4d_strategy11_canonical_trigger_trace_v1.py
      - name: Trace hold reasons and exposed internal entry predicates
        run: |
          python backend/tools/r7a4d_strategy11_canonical_trigger_trace_v1.py \
            --root . \
            --fresh-root input/fresh \
            --evidence-root input/evidence \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --out artifacts/strategy11_canonical_trigger_trace_v1
      - name: Assert complete trace and bounded repair authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/strategy11_canonical_trigger_trace_v1/canonical_trigger_trace.json').read_text())
          assert d['state']=='PASS_CANONICAL_TRIGGER_TRACE'
          assert d['source_run_id']=='30252022416'
          assert d['strategy_count']==11,d['strategy_count']
          assert sum(d['state_counts'].values())==11
          assert all(row['call_count']>0 for row in d['rows'])
          assert all(row['action_counts'].get('enter',0)==0 for row in d['rows'])
          assert all(row['source_sha'] for row in d['rows'])
          assert d['repair_policy']['single_predicate_ablation_only'] is True
          assert d['repair_policy']['diagnostic_replay_before_code_change'] is True
          assert d['repair_policy']['no_threshold_sweep'] is True
          assert d['promotion_authority'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          assert d['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-canonical-trigger-trace-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_canonical_trigger_trace_v1
          if-no-files-found: error
          retention-days: 90
