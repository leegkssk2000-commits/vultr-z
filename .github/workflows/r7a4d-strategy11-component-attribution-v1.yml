name: R7A4D Strategy11 Component Attribution V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/research/strategy11_component_attribution_v1.py"
      - "backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-component-attribution-v1.yml"
  push:
    branches: [master]
    paths:
      - "backend/research/strategy11_component_attribution_v1.py"
      - "backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-component-attribution-v1.yml"

permissions:
  contents: read

concurrency:
  group: strategy11-component-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-component-attribution:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile attribution chain
        run: |
          python -m py_compile \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/research/strategy11_component_attribution_v1.py \
            backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py \
            backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py
      - name: Execute attribution fixtures
        run: python backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py
      - name: Assert component contribution and blocked authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/strategy11_component_attribution_v1")
          result = json.loads((root / "result.json").read_text())
          status = json.loads((root / "status.json").read_text())
          assert result["state"] == "PASS_COMPONENT_ATTRIBUTION"
          assert result["next"] == "SYNTHESIS_SEALER"
          assert len(result["components"]) == 2
          assert all(row["contribution_pass"] for row in result["components"])
          assert abs(result["shapley_sum_net_r"] - result["joint_uplift_net_r"]) < 1e-9
          assert status["fixture_only"] is True
          assert status["production_authority"] is False
          for value in (result, status):
              assert value["research_only"] is True
              assert value["promotion_authority"] is False
              assert value["protected_mutations"] == 0
              assert value["execution_allowed"] is False
              assert value["order_authority"] == "BLOCKED"
              assert value["runtime_bound"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy11-component-attribution-${{ github.run_id }}
          path: artifacts/strategy11_component_attribution_v1
          if-no-files-found: error
