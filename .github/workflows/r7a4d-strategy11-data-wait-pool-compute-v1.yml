name: R7A4D Strategy11 DATA WAIT POOL Compute V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-data-wait-pool-refresh-v1
    paths:
      - backend/tools/r7a4d_strategy11_data_wait_pool_compute_v1.py
      - .github/workflows/r7a4d-strategy11-data-wait-pool-compute-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy11-data-wait-pool-compute-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  compute-or-wait:
    name: DATA_WAIT_POOL_REFRESH compute or WAIT_DATA
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile compute runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_data_wait_pool_compute_v1.py

      - name: Download immutable fresh authority
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download corrected DATA_GATE authority
        uses: actions/download-artifact@v4
        with:
          name: s11-data-adequacy-v1-1-30255639710-attempt-1
          path: input/data-gate-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30255639710'

      - name: Download PRIMARY_REVIEW_QUEUE terminal authority
        uses: actions/download-artifact@v4
        with:
          name: s11-ema-repair-v3-30282593225-attempt-1
          path: input/ema-terminal-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30282593225'

      - name: Download evidence authority batch 1
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence/batch-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download evidence authority batch 2
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-2-30252022416-attempt-1
          path: input/evidence/batch-2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download evidence authority batch 3
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-3-30252022416-attempt-1
          path: input/evidence/batch-3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download evidence authority batch 4
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-4-30252022416-attempt-1
          path: input/evidence/batch-4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download evidence authority batch 5
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-5-30252022416-attempt-1
          path: input/evidence/batch-5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Run compute or safe WAIT_DATA
        run: |
          python backend/tools/r7a4d_strategy11_data_wait_pool_compute_v1.py \
            --root . \
            --fresh-manifest input/fresh-authority/manifest.json \
            --ranking input/data-gate-authority/global_ranking.csv \
            --ema-terminal input/ema-terminal-authority/summary.json \
            --evidence-root input/evidence \
            --out out

      - name: Assert safe state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('out/status.json').read_text())
          assert row['state'] in {'WAIT_DATA', 'PASS'}, row
          assert row['blockers'] == [], row
          assert row['data_wait_pool_count'] == 22, row
          assert row['canonical_mutated'] is False
          assert row['registry_mutated'] is False
          assert row['protected_mutations'] == 0
          assert row['execution_allowed'] is False
          if row['state'] == 'PASS':
              assert row['evaluated_strategy_count'] == 22, row
          print(json.dumps({
              'state': row['state'],
              'qualified_count': row.get('qualified_count'),
              'next': row['next'],
          }, sort_keys=True))
          PY

      - name: Upload DATA_WAIT_POOL_REFRESH compute status
        uses: actions/upload-artifact@v4
        with:
          name: s11-data-wait-pool-compute-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
