name: R7A4D Strategy11 Distinct Axis Rotation L090 V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-multimodal-l090-replay-v1
    paths:
      - backend/tools/r7a4d_strategy11_distinct_axis_rotation_l090_v1.py
      - .github/workflows/r7a4d-strategy11-distinct-axis-rotation-l090-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-distinct-axis-rotation-l090-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  PRIOR_PLAN_RUN_ID: '30377925428'
  PRIOR_REPLAY_RUN_ID: '30378570267'

jobs:
  plan:
    name: build generation-two search ledger and plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile planner
        run: python -m py_compile backend/tools/r7a4d_strategy11_distinct_axis_rotation_l090_v1.py

      - name: Download prior multimodal plan
        uses: actions/download-artifact@v4
        with:
          name: s11-multimodal-rescue-l090-v1-30377925428-attempt-1
          path: input/prior-plan
          github-token: ${{ github.token }}
          run-id: 30377925428

      - name: Download prior L090 final
        uses: actions/download-artifact@v4
        with:
          name: s11-multimodal-l090-replay-final-30378570267-attempt-1
          path: input/prior-final
          github-token: ${{ github.token }}
          run-id: 30378570267

      - name: Rotate to previously untested causal axes
        run: |
          python backend/tools/r7a4d_strategy11_distinct_axis_rotation_l090_v1.py \
            --prior-plan-root input/prior-plan \
            --prior-final input/prior-final/final.json \
            --out out/plan

      - name: Assert plan and search ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('out/plan/plan.json').read_text())
          ledger=json.loads(Path('out/plan/search_ledger.json').read_text())
          assert plan['state']=='PASS_DISTINCT_AXIS_ROTATION_PLAN'
          assert plan['strategy_count']==22
          assert plan['candidate_count']==44
          assert plan['generation']==2
          assert ledger['state']=='PASS_SEARCH_LEDGER'
          assert ledger['strategy_count']==22
          assert ledger['duplicate_strategy_axis_data_runs']==0
          for row in plan['rows']:
              assert len(row['candidate_ids'])==2
              axes={row['candidate_specs'][cid]['axis'] for cid in row['candidate_ids']}
              assert len(axes)==2
          for payload in (plan, ledger):
              assert payload['promotion_authority'] is False
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
          assert plan['protected_mutations']==0
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s11-distinct-axis-rotation-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan
          if-no-files-found: error
          retention-days: 90

  replay:
    name: replay rotated axes batch ${{ matrix.batch }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: '1'
            strategies: 'anchor_vwap_trend,bb_revert,break_and_continue,fvg_revert,grid_rebalance'
          - batch: '2'
            strategies: 'keltner_trend,liquidity_sweep,mfi_rsi_div,obv_trend,pivot_reversal'
          - batch: '3'
            strategies: 'range_fade,rbreaker_like,rsi_swing_fail,scalp_snap,session_bias'
          - batch: '4'
            strategies: 'squeeze_break,sr_levels,supertrend_pullback,trend_ma_macd,trend_rider'
          - batch: '5'
            strategies: 'vol_spike_fade,vwap_revert'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile replay engine
        run: python -m py_compile backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py

      - name: Download generation-two plan
        uses: actions/download-artifact@v4
        with:
          name: s11-distinct-axis-rotation-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/plan

      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download evidence batch 1
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence/batch-1
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download evidence batch 2
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-2-30252022416-attempt-1
          path: input/evidence/batch-2
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download evidence batch 3
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-3-30252022416-attempt-1
          path: input/evidence/batch-3
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download evidence batch 4
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-4-30252022416-attempt-1
          path: input/evidence/batch-4
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download evidence batch 5
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-5-30252022416-attempt-1
          path: input/evidence/batch-5
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Replay control and rotated candidates
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py \
            --mode replay \
            --root . \
            --plan input/plan/plan.json \
            --policy backend/research/strategy11_multimodal_rescue_l090_v1.json \
            --fresh-root input/fresh \
            --evidence-root input/evidence \
            --strategy-ids '${{ matrix.strategies }}' \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --out out/batch-${{ matrix.batch }}

      - name: Assert replay safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('out').rglob('summary.json'):
              d=json.loads(p.read_text())
              if d.get('strategy_id') and d.get('version')=='R7A4D_STRATEGY11_MULTIMODAL_L090_REPLAY_V1':
                  rows.append(d)
          assert rows
          for d in rows:
              assert len(d['tested_candidate_ids'])==2
              assert len(d['variants'])==3
              assert d['promotion_authority'] is False
              assert d['protected_mutations']==0
              assert d['execution_allowed'] is False
              assert d['order_authority']=='BLOCKED'
              for row in d['variants']:
                  assert row['parity']['state']=='PASS'
                  assert row['parity']['duplicate_trade_count']==0
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s11-distinct-axis-l090-replay-batch-${{ matrix.batch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate generation-two L090 results
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Download replay batches
        uses: actions/download-artifact@v4
        with:
          pattern: s11-distinct-axis-l090-replay-batch-*
          path: input/replays
          merge-multiple: true

      - name: Download search ledger
        uses: actions/download-artifact@v4
        with:
          name: s11-distinct-axis-rotation-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/plan

      - name: Aggregate
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py \
            --mode aggregate \
            --replay-root input/replays \
            --out out/final
          cp input/plan/search_ledger.json out/final/search_ledger.json
          cp input/plan/plan.json out/final/generation2_plan.json

      - name: Assert final contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/final/final.json').read_text())
          ledger=json.loads(Path('out/final/search_ledger.json').read_text())
          assert d['state']=='PASS_MULTIMODAL_L090_REPLAY_COMPLETE'
          assert d['strategy_count']==22
          assert len(d['active_l085_queue'])<=3
          assert ledger['state']=='PASS_SEARCH_LEDGER'
          assert d['promotion_authority'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/final/final.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# Strategy11 distinct-axis L090 generation 2\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Strategies: {d['strategy_count']}\n")
              out.write(f"- L090 candidates: {d['l090_candidate_count']}\n")
              out.write(f"- Active L085 queue: {len(d['active_l085_queue'])}/3\n")
              for row in d['active_l085_queue']:
                  m=row['metrics']
                  out.write(f"- {row['strategy_id']}/{row['winner']}: trades={m['trade_count']} WR={m['win_rate_pct']} Net={m['net_return_pct_sum']} PF={m['net_profit_factor']} payoff={m['payoff_ratio']} DD={m['max_drawdown_pct']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-distinct-axis-l090-final-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/final
          if-no-files-found: error
          retention-days: 90
