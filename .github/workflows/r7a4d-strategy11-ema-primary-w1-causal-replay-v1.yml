name: R7A4D Strategy11 EMA Primary W1 Causal Replay V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-turtle-primary-w1-causal-replay-v1
    paths:
      - backend/tools/r7a4d_strategy11_ema_primary_w1_causal_replay_v1.py
      - backend/research/ema_primary_w1_causal_replay_v1.json
      - .github/workflows/r7a4d-strategy11-ema-primary-w1-causal-replay-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy11-ema-primary-w1-causal-replay-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  DATA_WAIT_POOL_HEAD_SHA: d4926a6f0a3c5e9632ae74321baf21d87247445b

jobs:
  replay-or-wait:
    name: Shared-W1 EMA causal replay or safe WAIT_DATA
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile EMA PRIMARY W1 runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_ema_primary_w1_causal_replay_v1.py

      - name: Resolve latest successful PR219 source artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; head=os.environ['DATA_WAIT_POOL_HEAD_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          query=urllib.parse.urlencode({'head_sha':head,'status':'success','per_page':100})
          runs=get(f'https://api.github.com/repos/{repo}/actions/runs?{query}').get('workflow_runs',[])
          runs=[r for r in runs if r.get('name')=='R7A4D Strategy11 DATA WAIT POOL Compute V1' and r.get('conclusion')=='success']
          runs.sort(key=lambda r:(r.get('updated_at') or '',int(r.get('id') or 0)),reverse=True)
          selected=artifact=None
          for run in runs:
              items=get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts',[])
              items=[a for a in items if not a.get('expired') and str(a.get('name','')).startswith('s11-data-wait-pool-compute-v1-')]
              items.sort(key=lambda a:(a.get('updated_at') or '',int(a.get('id') or 0)),reverse=True)
              if items: selected,artifact=run,items[0]; break
          if selected is None: raise SystemExit('NO_SUCCESSFUL_PR219_ARTIFACT')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"run_id={selected['id']}\nhead_sha={selected['head_sha']}\nartifact_name={artifact['name']}\n")
          PY

      - name: Download shared PR219 W1 source
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: input/w1-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download immutable EMA baseline authority
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download EMA causal authority
        uses: actions/download-artifact@v4
        with:
          name: s11-ema-repair-v2-30282056363-attempt-1
          path: input/ema-authority
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30282056363'

      - name: Verify immutable authorities
        run: |
          test -f input/w1-source/status.json
          test -f input/evidence/ema_ribbon_scalp/summary.json
          test -f input/ema-authority/summary.json
          test -f input/ema-authority/INCUMBENT_CONTROL/replay-A.json
          test -f input/ema-authority/BLOCK_HIGH_ATR_PCT/replay-A.json
          test ! -e input/sealed
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('input/w1-source/status.json').read_text())
          baseline=json.loads(Path('input/evidence/ema_ribbon_scalp/summary.json').read_text())
          authority=json.loads(Path('input/ema-authority/summary.json').read_text())
          assert source['state'] in {'WAIT_DATA','PASS'} and source['blockers']==[]
          assert baseline['state']=='PASS' and baseline['strategy_id']=='ema_ribbon_scalp'
          assert authority['strategy_id']=='ema_ribbon_scalp'
          assert authority['sealed_holdback_read'] is False
          ids=[row['variant_id'] for row in authority['variants']]
          assert 'INCUMBENT_CONTROL' in ids and 'BLOCK_HIGH_ATR_PCT' in ids
          PY

      - name: Run shared-W1 EMA causal replay or WAIT_DATA
        run: |
          python backend/tools/r7a4d_strategy11_ema_primary_w1_causal_replay_v1.py \
            --root . \
            --source-root input/w1-source \
            --baseline-summary input/evidence/ema_ribbon_scalp/summary.json \
            --ema-authority-root input/ema-authority \
            --policy backend/research/ema_primary_w1_causal_replay_v1.json \
            --out out \
            --source-run-id '${{ steps.source.outputs.run_id }}' \
            --source-head-sha '${{ steps.source.outputs.head_sha }}'

      - name: Assert EMA W1 safety and lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/status.json').read_text())
          assert row['state'] in {'WAIT_DATA','PASS_W1_PRIMARY_CAUSAL_REPLAY','W1_LOW_SAMPLE_HOLD','W1_REJECT_RETAIN_INCUMBENT'}
          assert row['blockers']==[]
          assert row['capability_marker']=='PRIMARY_W1_CAUSAL_REPLAY'
          assert row['strategy_id']=='ema_ribbon_scalp'
          assert row['promotion_authority'] is False
          assert row['sealed_holdback_read'] is False
          assert row['canonical_mutated'] is False and row['registry_mutated'] is False
          assert row['protected_mutations']==0 and row['execution_allowed'] is False
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED'
          if row['state']!='WAIT_DATA':
              assert len(row['variants'])==2
              assert row['source_w1_manifest_sha256']
              for variant in row['variants']:
                  assert variant['parity']['state']=='PASS'
                  assert variant['parity']['duplicate_trade_count']==0
          print(json.dumps({'state':row['state'],'active':row.get('active_candidate_queue',[]),'next':row['next']},sort_keys=True))
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/status.json')
          if not p.exists(): raise SystemExit(0)
          row=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# ema_ribbon_scalp PRIMARY W1 causal replay\n\n')
              out.write(f"- State: **{row['state']}**\n- Source W1 run: `{row['source_w1_run_id']}`\n- Next: `{row['next']}`\n")
              if row['state']=='WAIT_DATA': out.write(f"- Available: `{row['available_non_overlap_bars']}/480`; missing `{row['missing_bars']}`\n")
              else:
                  for variant in row['variants']:
                      w=variant['W1']; s=variant['W1_stress_2x_p95_plus_one']; gate=variant.get('W1_confirmation_gate',{})
                      out.write(f"- {variant['variant_id']}: trades={w['trade_count']} WR={w.get('win_rate_pct')} Net={w.get('net_return_pct_sum')} PF={w.get('net_profit_factor')} payoff={w.get('payoff_ratio')} DD={w.get('max_drawdown_pct')} worst={w['loss_metrics']['normal_worst_net_loss_R']}R stressWorst={s['loss_metrics']['normal_worst_net_loss_R']}R pass={gate.get('pass')}\n")
          PY

      - name: Upload EMA primary W1 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-ema-primary-w1-causal-replay-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
