name: R7A4D Strategy11 Gemini Active Research V3.1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-gemini-active-research-v3
    paths:
      - backend/tools/r7a4d_strategy11_gemini_active_research_v3_1.py
      - .github/workflows/r7a4d-strategy11-gemini-active-research-v3-1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy11-gemini-active-research-v3-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  active-research-shape-fix:
    name: Gemini active research JSON shape repair
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check matplotlib pandas

      - name: Compile shape-repair runner
        run: |
          python -m py_compile backend/tools/r7a4d_strategy11_gemini_active_research_v3.py
          python -m py_compile backend/tools/r7a4d_strategy11_gemini_active_research_v3_1.py

      - name: Download actual Gemini V2 authority
        uses: actions/download-artifact@v4
        with:
          name: s11-gemini-direct-video-v2-30299621045-attempt-1
          path: input/gemini-v2
          github-token: ${{ github.token }}
          run-id: '30299621045'

      - name: Download alpha authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-sealed-one-shot-v1-30279647167-attempt-1
          path: input/alpha
          github-token: ${{ github.token }}
          run-id: '30279647167'

      - name: Download turtle authority
        uses: actions/download-artifact@v4
        with:
          name: s11-turtle-repair-v1-30280820928-attempt-1
          path: input/turtle
          github-token: ${{ github.token }}
          run-id: '30280820928'

      - name: Download EMA terminal authority
        uses: actions/download-artifact@v4
        with:
          name: s11-ema-repair-v3-30282593225-attempt-1
          path: input/ema
          github-token: ${{ github.token }}
          run-id: '30282593225'

      - name: Download evidence batch 1
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download evidence batch 2
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-2-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download evidence batch 3
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-3-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download evidence batch 4
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-4-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Download evidence batch 5
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-5-30252022416-attempt-1
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: '30252022416'

      - name: Run active Gemini research with shape repair
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/tools/r7a4d_strategy11_gemini_active_research_v3_1.py \
            --policy backend/research/strategy11_gemini_active_research_v3.json \
            --registry backend/research/strategy11_gemini_video_registry_v2.json \
            --prior-gemini input/gemini-v2/analysis.json \
            --alpha-root input/alpha \
            --turtle-root input/turtle \
            --ema-root input/ema \
            --evidence-root input/evidence \
            --out out

      - name: Assert source-review shape repaired and coverage retained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('out/summary.json').read_text())
          source = json.loads(Path('out/source_review.json').read_text())
          queue = json.loads(Path('out/repair_queue.json').read_text())
          assert summary['GEMINI_USED'] is True, summary
          assert summary['free_only'] is True, summary
          assert summary['gemini_call_count'] >= 5, summary
          assert summary['video_attachment_count'] >= 4, summary
          assert summary['image_attachment_count'] >= 3, summary
          assert source.get('status') in {'PASS', 'HOLD'}, source
          assert source.get('blockers') != ['NON_OBJECT_JSON'], source
          assert summary['private_code_sent'] is False, summary
          assert summary['account_data_sent'] is False, summary
          assert summary['exchange_credentials_sent'] is False, summary
          assert summary['canonical_mutated'] is False, summary
          assert summary['registry_mutated'] is False, summary
          assert summary['execution_allowed'] is False, summary
          print(json.dumps({
              'state': summary['state'],
              'source_status': source.get('status'),
              'approved': summary['approved_hypothesis_count'],
              'strategies': summary['approved_strategies'],
              'queue_state': queue['state'],
              'next': summary['next'],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-gemini-active-research-v3-1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
