name: R7A4D Strategy11 Gemini22 Second Causal V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-gemini-22-prework-v1
    paths:
      - backend/tools/r7a4d_strategy11_gemini22_second_causal_v1.py
      - .github/workflows/r7a4d-strategy11-gemini22-second-causal-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile backend/tools/r7a4d_strategy11_gemini22_second_causal_v1.py
      - name: Download Gemini22 final authority
        uses: actions/download-artifact@v4
        with:
          name: s11-gemini-22-prework-v1-1-30328652883-attempt-1
          path: input/gemini22
          github-token: ${{ github.token }}
          run-id: 30328652883
      - name: Run second causal review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/tools/r7a4d_strategy11_gemini22_second_causal_v1.py --artifact-root input/gemini22 --out out
      - name: Assert fail-closed contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/second_causal_review.json'))
          assert d['state']=='PASS'
          assert d['strategy_count']==22
          assert d['second_causal_review_complete'] is True
          assert d['GEMINI_USED'] is True and d['free_only'] is True
          assert d['gemini_call_count']>=3
          assert len(d['rows'])==22
          assert all(r['final_state']=='W1_CAUSAL_WAIT' for r in d['rows'])
          assert d['approved_execution_count']==0
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-gemini22-second-causal-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
