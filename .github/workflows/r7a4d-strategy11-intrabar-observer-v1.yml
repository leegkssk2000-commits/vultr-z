name: R7A4D Strategy11 Intrabar Observer V1

on:
  pull_request:
    branches:
      - master
    paths:
      - backend/tools/r7a4d_strategy11_intrabar_observer_v1.py
      - .github/workflows/r7a4d-strategy11-intrabar-observer-v1.yml
  workflow_dispatch:
  schedule:
    # Full history is refetched on every run; once daily is sufficient.
    # 06:17 UTC = 08:17 CEST / 07:17 CET, after the Berlin quiet window.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-intrabar-observer-v1
  cancel-in-progress: false

jobs:
  collect:
    name: collect 1m and 5m observer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pandas
      - name: Compile collector
        run: python -m py_compile backend/tools/r7a4d_strategy11_intrabar_observer_v1.py
      - name: Collect verified public intrabar data
        run: python backend/tools/r7a4d_strategy11_intrabar_observer_v1.py --out out
      - name: Assert observer-only contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/manifest.json'))
          assert d['state']=='PASS_INTRABAR_OBSERVER_COLLECTION'
          assert d['symbol_count']==5 and set(d['intervals'])=={'1m','5m'}
          assert all(d['row_parity'].values()) and d['gap_count']==0 and d['duplicate_count']==0
          assert d['w1_metric_input_allowed'] is False and d['observer_only'] is True
          assert d['usage_contract']['current_w1_performance_gate']=='FORBIDDEN'
          assert d['usage_contract']['current_candidate_selection']=='FORBIDDEN'
          assert d['research_only'] is True and d['promotion_authority'] is False
          assert d['protected_mutations']==0 and d['execution_allowed'] is False and d['order_authority']=='BLOCKED'
          assert d['canonical_mutated'] is False and d['registry_mutated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-intrabar-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 30
