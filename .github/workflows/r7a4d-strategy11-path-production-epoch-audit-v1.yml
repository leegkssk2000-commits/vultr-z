name: R7A4D Strategy11 Path Production Epoch Audit V1

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/r7a4d-strategy11-path-production-epoch-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-path-production-epoch-audit-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  REQUIRED_MASTER_SHA: 'bc6fc2487905fe4570510d22b2e072649e7ce7bb'
  ARTIFACT_PREFIX: 's11-path-candidate-state-v1-'

jobs:
  audit-production-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact production artifact for required master SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/state
          gh api "repos/$GITHUB_REPOSITORY/commits/$REQUIRED_MASTER_SHA" > audit/commit.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > audit/artifacts.json
          python - <<'PY' > audit/artifact.env
          import json, os
          from datetime import datetime
          commit=json.load(open('audit/commit.json'))
          payload=json.load(open('audit/artifacts.json'))
          required=os.environ['REQUIRED_MASTER_SHA']
          prefix=os.environ['ARTIFACT_PREFIX']
          commit_at=datetime.fromisoformat(commit['commit']['committer']['date'].replace('Z','+00:00'))
          rows=[]
          for artifact in payload.get('artifacts',[]):
              run=artifact.get('workflow_run') or {}
              if artifact.get('expired'):
                  continue
              if not str(artifact.get('name') or '').startswith(prefix):
                  continue
              if str(run.get('head_sha') or '') != required:
                  continue
              created=datetime.fromisoformat(str(artifact['created_at']).replace('Z','+00:00'))
              if created < commit_at:
                  continue
              rows.append((created,artifact))
          if not rows:
              raise SystemExit('PRODUCTION_EPOCH_ARTIFACT_MISSING_FOR_REQUIRED_MASTER_SHA')
          artifact=sorted(rows,key=lambda item:item[0])[-1][1]
          run=artifact.get('workflow_run') or {}
          print(f"ARTIFACT_ID={artifact['id']}")
          print(f"ARTIFACT_NAME={artifact['name']}")
          print(f"RUN_ID={run.get('id')}")
          print(f"HEAD_SHA={run.get('head_sha')}")
          print(f"CREATED_AT={artifact['created_at']}")
          PY
          source audit/artifact.env
          test "$HEAD_SHA" = "$REQUIRED_MASTER_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > audit/state.zip
          unzip -qo audit/state.zip -d audit/state
      - name: Verify full source-bound production epoch authority
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('audit/state')
          status_paths=list(root.rglob('status.json'))
          manifest_paths=list(root.rglob('source_manifest.json'))
          if len(status_paths)!=1 or len(manifest_paths)!=1:
              raise SystemExit(f'PRODUCTION_EPOCH_AUTHORITY_PATH_COUNT:{len(status_paths)}:{len(manifest_paths)}')
          status=json.loads(status_paths[0].read_text())
          manifest=json.loads(manifest_paths[0].read_text())
          if status != manifest:
              raise SystemExit('PRODUCTION_STATUS_MANIFEST_MISMATCH')
          if status.get('state')!='PASS_PATH_STATE_SOURCE_READY':
              raise SystemExit(f"PRODUCTION_EPOCH_NOT_SOURCE_READY:{status.get('state')}:{status.get('path_state')}")
          if status.get('source_type') not in {'PRIOR_PATH_EPOCH','GENERATION7_PATH_LOOP'}:
              raise SystemExit(f"PRODUCTION_SOURCE_TYPE_INVALID:{status.get('source_type')}")
          safety={
              'research_only':True,'promotion_authority':False,'protected_mutations':0,
              'execution_allowed':False,'order_authority':'BLOCKED','runtime_bound':False,
          }
          for key,expected in safety.items():
              if status.get(key)!=expected:
                  raise SystemExit(f'PRODUCTION_SAFETY_MISMATCH:{key}')
          components=status.get('components') or {}
          expected_paths={
              'replay_batch':'source/replay/batch.json',
              'path_index':'source/path_evidence/index.json',
              'triage':'source/triage.json',
              'search_ledger':'source/search_ledger.json',
              'path_plan':'source/path_plan.json',
          }
          state_root=status_paths[0].parent
          if set(components)!=set(expected_paths):
              raise SystemExit(f"PRODUCTION_COMPONENT_SET_MISMATCH:{sorted(components)}")
          verified={}
          for name,relative in expected_paths.items():
              path=state_root/relative
              if not path.exists():
                  raise SystemExit(f'PRODUCTION_COMPONENT_MISSING:{name}:{path}')
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if digest!=components[name]:
                  raise SystemExit(f'PRODUCTION_COMPONENT_SHA_MISMATCH:{name}')
              verified[name]=digest
          raw={k:v for k,v in status.items() if k!='source_manifest_sha'}
          manifest_sha=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if manifest_sha!=status.get('source_manifest_sha'):
              raise SystemExit('PRODUCTION_SOURCE_MANIFEST_SHA_MISMATCH')
          summary={
              'state':'PASS_PATH_PRODUCTION_EPOCH_AUDIT',
              'required_master_sha':os.environ['REQUIRED_MASTER_SHA'],
              'artifact_name':os.environ.get('ARTIFACT_NAME'),
              'run_id':os.environ.get('RUN_ID'),
              'created_at':os.environ.get('CREATED_AT'),
              'path_state':status.get('path_state'),
              'review_state':status.get('review_state'),
              'accepted_count':status.get('accepted_count'),
              'semantic_reject_count':status.get('semantic_reject_count'),
              'wait_quota_count':status.get('wait_quota_count'),
              'unsupported_count':status.get('unsupported_count'),
              'source_type':status.get('source_type'),
              'source_manifest_sha':status.get('source_manifest_sha'),
              'components':verified,
              **safety,
          }
          out=Path('audit/summary.json')
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(summary['state'],summary['path_state'],summary['run_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-path-production-epoch-audit-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: audit
          if-no-files-found: error
          retention-days: 90
