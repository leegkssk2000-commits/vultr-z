name: R7A4D Strategy11 Path Production Epoch Audit V1

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/r7a4d-strategy11-path-production-epoch-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-path-production-epoch-audit-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  REQUIRED_MASTER_SHA: '05ecf2102bb5ab948170f2d32c65268af76ddcc0'
  ARTIFACT_PREFIX: 's11-path-candidate-state-v1-'

jobs:
  audit-production-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact production artifact for required master SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/state
          gh api "repos/$GITHUB_REPOSITORY/commits/$REQUIRED_MASTER_SHA" > audit/commit.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > audit/artifacts.json
          python - <<'PY' > audit/artifact.env
          import json, os
          from datetime import datetime
          commit=json.load(open('audit/commit.json'))
          payload=json.load(open('audit/artifacts.json'))
          required=os.environ['REQUIRED_MASTER_SHA']
          prefix=os.environ['ARTIFACT_PREFIX']
          commit_at=datetime.fromisoformat(commit['commit']['committer']['date'].replace('Z','+00:00'))
          rows=[]
          for artifact in payload.get('artifacts',[]):
              run=artifact.get('workflow_run') or {}
              if artifact.get('expired'):
                  continue
              if not str(artifact.get('name') or '').startswith(prefix):
                  continue
              if str(run.get('head_sha') or '') != required:
                  continue
              created=datetime.fromisoformat(str(artifact['created_at']).replace('Z','+00:00'))
              if created < commit_at:
                  continue
              rows.append((created,artifact))
          if not rows:
              raise SystemExit('PRODUCTION_EPOCH_ARTIFACT_MISSING_FOR_REQUIRED_MASTER_SHA')
          artifact=sorted(rows,key=lambda item:item[0])[-1][1]
          run=artifact.get('workflow_run') or {}
          values={
              'ARTIFACT_ID':artifact['id'],
              'ARTIFACT_NAME':artifact['name'],
              'RUN_ID':run.get('id'),
              'HEAD_SHA':run.get('head_sha'),
              'CREATED_AT':artifact['created_at'],
          }
          for key,value in values.items():
              print(f'{key}={value}')
          json.dump(values,open('audit/artifact_selection.json','w'),indent=2,sort_keys=True)
          PY
          source audit/artifact.env
          test "$HEAD_SHA" = "$REQUIRED_MASTER_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > audit/state.zip
          unzip -qo audit/state.zip -d audit/state
      - name: Verify full source-bound production epoch authority
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('audit/state')
          selection=json.loads(Path('audit/artifact_selection.json').read_text())
          status_paths=list(root.rglob('status.json'))
          if len(status_paths)!=1:
              raise SystemExit(f'PRODUCTION_STATUS_PATH_COUNT:{len(status_paths)}')
          epoch_root=status_paths[0].parent
          epoch_manifest_path=epoch_root/'source_manifest.json'
          restored_manifest_path=epoch_root/'source/source_manifest.json'
          if not epoch_manifest_path.exists() or not restored_manifest_path.exists():
              raise SystemExit(
                  f'PRODUCTION_MANIFEST_MISSING:epoch={epoch_manifest_path.exists()}:restored={restored_manifest_path.exists()}'
              )
          status=json.loads(status_paths[0].read_text())
          epoch_manifest=json.loads(epoch_manifest_path.read_text())
          restored=json.loads(restored_manifest_path.read_text())
          if status != epoch_manifest:
              raise SystemExit('PRODUCTION_STATUS_EPOCH_MANIFEST_MISMATCH')
          if status.get('state')!='PASS_PATH_STATE_SOURCE_READY':
              raise SystemExit(f"PRODUCTION_EPOCH_NOT_SOURCE_READY:{status.get('state')}:{status.get('path_state')}")
          if status.get('source_type') not in {'PATH_EPOCH','GENERATION7'}:
              raise SystemExit(f"PRODUCTION_SOURCE_TYPE_INVALID:{status.get('source_type')}")
          if restored.get('state')!='PASS_PATH_STATE_SOURCE_RESTORED':
              raise SystemExit(f"PRODUCTION_RESTORED_SOURCE_NOT_PASS:{restored.get('state')}")
          if restored.get('source_type')!=status.get('source_type'):
              raise SystemExit(
                  f"PRODUCTION_SOURCE_TYPE_MISMATCH:{status.get('source_type')}:{restored.get('source_type')}"
              )
          safety={
              'research_only':True,'promotion_authority':False,'protected_mutations':0,
              'execution_allowed':False,'order_authority':'BLOCKED','runtime_bound':False,
          }
          for payload_name,payload in (('epoch',status),('restored',restored)):
              for key,expected in safety.items():
                  if payload.get(key)!=expected:
                      raise SystemExit(f'PRODUCTION_SAFETY_MISMATCH:{payload_name}:{key}')
          components=status.get('components') or {}
          expected_paths={
              'replay_batch':'source/replay/batch.json',
              'path_index':'source/path_evidence/index.json',
              'triage':'source/triage.json',
              'search_ledger':'source/search_ledger.json',
              'path_plan':'source/path_plan.json',
          }
          if set(components)!=set(expected_paths):
              raise SystemExit(f"PRODUCTION_COMPONENT_SET_MISMATCH:{sorted(components)}")
          verified={}
          for name,relative in expected_paths.items():
              path=epoch_root/relative
              if not path.exists():
                  raise SystemExit(f'PRODUCTION_COMPONENT_MISSING:{name}:{path}')
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if digest!=components[name]:
                  raise SystemExit(f'PRODUCTION_COMPONENT_SHA_MISMATCH:{name}')
              verified[name]=digest
          epoch_raw={k:v for k,v in status.items() if k!='source_manifest_sha'}
          epoch_sha=hashlib.sha256(json.dumps(epoch_raw,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if epoch_sha!=status.get('source_manifest_sha'):
              raise SystemExit('PRODUCTION_EPOCH_MANIFEST_SHA_MISMATCH')
          restored_raw={k:v for k,v in restored.items() if k!='source_manifest_sha'}
          restored_sha=hashlib.sha256(json.dumps(restored_raw,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if restored_sha!=restored.get('source_manifest_sha'):
              raise SystemExit('PRODUCTION_RESTORED_MANIFEST_SHA_MISMATCH')
          summary={
              'state':'PASS_PATH_PRODUCTION_EPOCH_AUDIT',
              'required_master_sha':os.environ['REQUIRED_MASTER_SHA'],
              'artifact_name':selection['ARTIFACT_NAME'],
              'run_id':selection['RUN_ID'],
              'created_at':selection['CREATED_AT'],
              'path_state':status.get('path_state'),
              'review_state':status.get('review_state'),
              'accepted_count':status.get('accepted_count'),
              'semantic_reject_count':status.get('semantic_reject_count'),
              'wait_quota_count':status.get('wait_quota_count'),
              'unsupported_count':status.get('unsupported_count'),
              'source_type':status.get('source_type'),
              'restore_mode':restored.get('restore_mode'),
              'remote_artifact_id':restored.get('remote_artifact_id'),
              'remote_run_id':restored.get('remote_run_id'),
              'epoch_manifest_sha':status.get('source_manifest_sha'),
              'restored_manifest_sha':restored.get('source_manifest_sha'),
              'components':verified,
              **safety,
          }
          Path('audit/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(summary['state'],summary['path_state'],summary['run_id'],summary['restore_mode'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-path-production-epoch-audit-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: audit
          if-no-files-found: error
          retention-days: 90
