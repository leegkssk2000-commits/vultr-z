name: R7A4D Strategy11 RBreaker Signal Boundary Distance V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-cause-aware-rotation-l090-v6
    paths:
      - backend/tools/r7a4d_strategy11_rbreaker_signal_boundary_distance_v1.py
      - .github/workflows/r7a4d-strategy11-rbreaker-signal-boundary-distance-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-rbreaker-signal-boundary-distance-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'

jobs:
  rbreaker-signal-boundary-distance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download exact baseline evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/evidence
          for batch in 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "s11-evidence-batch-${batch}-${SOURCE_RUN_ID}-attempt-1" \
              --dir "input/evidence/batch-${batch}"
          done
      - name: Compile signal-boundary diagnostic
        run: python -m py_compile backend/tools/r7a4d_strategy11_rbreaker_signal_boundary_distance_v1.py
      - name: Replay unchanged control versus one boundary-distance candidate
        run: |
          python backend/tools/r7a4d_strategy11_rbreaker_signal_boundary_distance_v1.py \
            --root . \
            --fresh-root input/fresh \
            --evidence-root input/evidence \
            --policy backend/research/strategy11_multimodal_rescue_l090_v1.json \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --out artifacts/strategy11_rbreaker_signal_boundary_distance_v1
      - name: Assert single semantic change, parity and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/strategy11_rbreaker_signal_boundary_distance_v1/final.json').read_text())
          assert d['state']=='PASS_RBREAKER_SIGNAL_BOUNDARY_DIAGNOSTIC_COMPLETE'
          assert d['repair']['semantic_change_count']==1
          assert d['repair']['threshold_changed'] is False
          assert d['repair']['max_chase_dist_atr_unchanged'] is True
          assert d['repair']['reversal_thresholds_unchanged'] is True
          assert d['after_trace']['signal_accounting_identity_pass'] is True
          assert d['after_trace']['eligible_equals_actual_enter'] is True
          assert d['canonical_source_modified'] is False
          assert d['registry_modified'] is False
          assert d['thresholds_modified'] is False
          assert d['promotion_authority'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          assert d['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-rbreaker-signal-boundary-distance-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_rbreaker_signal_boundary_distance_v1
          if-no-files-found: error
          retention-days: 90
