name: R7A4D Strategy11 Replay Stall Diagnostic

on:
  pull_request:
    branches:
      - r7a4d-strategy11-structure-lock-v3-minimal
    paths:
      - '.github/workflows/r7a4d-strategy11-replay-stall-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-replay-stall-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic child
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Download immutable input from authority run
        uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-input-v3-30209054842
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30209054842

      - name: Verify immutable cache
        run: |
          test -f artifacts/strategy11_market_cache_v2/manifest.json
          test -f artifacts/strategy11_structure_lock_v2/preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('artifacts/strategy11_market_cache_v2/manifest.json').read_text())
          preflight=json.loads(Path('artifacts/strategy11_structure_lock_v2/preflight.json').read_text())
          assert manifest.get('state') == 'PASS', manifest.get('blockers')
          assert preflight.get('state') == 'PASS', preflight.get('blockers')
          print({'cache_state':manifest['state'],'preflight_state':preflight['state']})
          PY

      - name: Profile alpha_combo screen
        timeout-minutes: 22
        shell: bash
        run: |
          mkdir -p diagnostic/alpha_combo
          start=$(date +%s)
          set +e
          timeout 1200s python backend/tools/r7a4d_strategy11_screen_v2.py --root . --strategy-id alpha_combo > diagnostic/alpha_combo/run.log 2>&1
          rc=$?
          set -e
          end=$(date +%s)
          printf '{"strategy":"alpha_combo","phase":"screen","rc":%s,"elapsed_s":%s,"timed_out":%s}\n' "$rc" "$((end-start))" "$([ "$rc" -eq 124 ] && echo true || echo false)" > diagnostic/alpha_combo/status.json
          cat diagnostic/alpha_combo/status.json

      - name: Upload alpha_combo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-stall-alpha-combo-${{ github.run_id }}
          path: diagnostic/alpha_combo
          if-no-files-found: error
          retention-days: 7

      - name: Profile range_fade screen
        timeout-minutes: 22
        shell: bash
        run: |
          mkdir -p diagnostic/range_fade
          start=$(date +%s)
          set +e
          timeout 1200s python backend/tools/r7a4d_strategy11_screen_v2.py --root . --strategy-id range_fade > diagnostic/range_fade/run.log 2>&1
          rc=$?
          set -e
          end=$(date +%s)
          printf '{"strategy":"range_fade","phase":"screen","rc":%s,"elapsed_s":%s,"timed_out":%s}\n' "$rc" "$((end-start))" "$([ "$rc" -eq 124 ] && echo true || echo false)" > diagnostic/range_fade/status.json
          cat diagnostic/range_fade/status.json

      - name: Upload range_fade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-stall-range-fade-${{ github.run_id }}
          path: diagnostic/range_fade
          if-no-files-found: error
          retention-days: 7

      - name: Profile vwap_revert screen
        timeout-minutes: 22
        shell: bash
        run: |
          mkdir -p diagnostic/vwap_revert
          start=$(date +%s)
          set +e
          timeout 1200s python backend/tools/r7a4d_strategy11_screen_v2.py --root . --strategy-id vwap_revert > diagnostic/vwap_revert/run.log 2>&1
          rc=$?
          set -e
          end=$(date +%s)
          printf '{"strategy":"vwap_revert","phase":"screen","rc":%s,"elapsed_s":%s,"timed_out":%s}\n' "$rc" "$((end-start))" "$([ "$rc" -eq 124 ] && echo true || echo false)" > diagnostic/vwap_revert/status.json
          cat diagnostic/vwap_revert/status.json

      - name: Upload vwap_revert evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-stall-vwap-revert-${{ github.run_id }}
          path: diagnostic/vwap_revert
          if-no-files-found: error
          retention-days: 7

      - name: Build diagnostic summary
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('diagnostic').glob('*/status.json')):
              rows.append(json.loads(path.read_text(encoding='utf-8')))
          out={'authority':'READ_ONLY_TIMING_DIAGNOSTIC','source_run_id':30209054842,'rows':rows,'canonical_mutated':False,'runtime_mutated':False,'next':'PROFILE_EXACT_OR_BATCH_REPLAY'}
          Path('diagnostic/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-stall-summary-${{ github.run_id }}
          path: diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
