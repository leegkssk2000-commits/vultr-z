name: R7A4D Strategy11 Semantic Axis Rotation L090 V5

on:
  pull_request:
    branches:
      - r7a4d-strategy11-semantic-axis-rotation-l090-v4
    paths:
      - .github/workflows/r7a4d-strategy11-semantic-axis-rotation-l090-v5.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: r7a4d-strategy11-semantic-axis-rotation-l090-v5-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  ORIGINAL_PLAN_RUN_ID: '30377925428'
  PRIOR_ROTATION_RUN_ID: '30400870451'

jobs:
  plan:
    name: build generation-six semantic search ledger and plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile planner
        run: python -m py_compile backend/tools/r7a4d_strategy11_semantic_axis_rotation_l090_v3.py
      - name: Download original multimodal plan
        uses: actions/download-artifact@v4
        with:
          name: s11-multimodal-rescue-l090-v1-30377925428-attempt-1
          path: input/original
          github-token: ${{ github.token }}
          run-id: 30377925428
      - name: Download generation-five final and ledger
        uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v4-final-30400870451-attempt-1
          path: input/prior
          github-token: ${{ github.token }}
          run-id: 30400870451
      - name: Rotate to next untested semantic axes
        run: |
          python backend/tools/r7a4d_strategy11_semantic_axis_rotation_l090_v3.py \
            --original-plan-root input/original \
            --prior-final-root input/prior \
            --out out/plan
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('plan.json','search_ledger.json'):
              path=Path('out/plan')/name
              data=json.loads(path.read_text())
              data['version']='R7A4D_STRATEGY11_SEMANTIC_AXIS_ROTATION_L090_V5'
              data['generation']=6
              if name=='plan.json':
                  data['evidence_parent_run_id']=30400870451
                  data['supersedes_run_id']=30407772491
                  data['supersede_reason']='AI_REJECTED_MULTI_AXIS_BATCH_PAYLOAD'
                  for row in data['rows']:
                      row['generation']=6
                      row['evidence_lanes'].append('SEMANTIC_GENERATION5_REPLAY')
              path.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
      - name: Assert semantic plan and ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('out/plan/plan.json').read_text())
          ledger=json.loads(Path('out/plan/search_ledger.json').read_text())
          assert plan['state']=='PASS_SEMANTIC_AXIS_ROTATION_PLAN'
          assert plan['strategy_count']==22 and plan['candidate_count']==44 and plan['generation']==6
          assert plan['supersedes_run_id']==30407772491
          assert ledger['state']=='PASS_SEARCH_LEDGER' and ledger['duplicate_strategy_axis_data_runs']==0
          for row in plan['rows']:
              assert len(row['candidate_ids'])==2
              specs=[row['candidate_specs'][cid] for cid in row['candidate_ids']]
              assert all(len([spec['axis']])==1 for spec in specs)
          for payload in (plan,ledger):
              assert payload['promotion_authority'] is False
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
          assert plan['protected_mutations']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-semantic-axis-v5-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan
          if-no-files-found: error
          retention-days: 90

  ai-review:
    name: per-candidate Groq and Workers AI fail-closed review
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: master
          path: ai-router
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Download generation-six plan
        uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v5-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/plan
      - name: Build 44 anonymized single-axis review payloads
        run: |
          mkdir -p input/ai out/ai
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          plan=json.loads(Path('input/plan/plan.json').read_text())
          ledger=json.loads(Path('input/plan/search_ledger.json').read_text())
          count=0
          for row in plan['rows']:
              for candidate_id in row['candidate_ids']:
                  spec=row['candidate_specs'][candidate_id]
                  axis=spec['axis']
                  candidate_text=json.dumps({'strategy_id':row['strategy_id'],'candidate_id':candidate_id,'spec':spec},sort_keys=True,separators=(',',':'))
                  payload={
                    'strategy_id':row['strategy_id'],
                    'candidate_id':candidate_id,
                    'changed_axes':[axis],
                    'routing_flags':{
                      'external_hypothesis':True,
                      'multimodal':False,
                      'new_multimodal_evidence':False,
                      'new_failure_fingerprint':False,
                      'borderline_case':False,
                      'major_gate_review':False
                    },
                    'hypothesis':{
                      'axis':axis,
                      'generation':6,
                      'description':'One existing feature changes one semantic causal axis for isolated replay.',
                      'candidate_spec':spec
                    },
                    'evidence':{
                      'strategy_count':1,
                      'candidate_count':1,
                      'duplicate_strategy_axis_data_runs':ledger['duplicate_strategy_axis_data_runs'],
                      'prior_evidence_lanes':row['evidence_lanes'],
                      'falsification_test':row['falsification_test']
                    },
                    'lineage':{
                      'source_sha':'64e27d16d7f28b9fae59cf2a875d195f4bca22a1',
                      'data_sha':'SOURCE_RUN_30252022416',
                      'window_sha':plan.get('prior_final_sha256',''),
                      'candidate_sha':hashlib.sha256(candidate_text.encode()).hexdigest()
                    }
                  }
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f"{row['strategy_id']}__{candidate_id}")
                  Path(f'input/ai/{safe}.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
                  count+=1
          assert count==44,count
          Path('input/ai_manifest.json').write_text(json.dumps({'state':'PASS_SINGLE_AXIS_AI_INPUTS','payload_count':count,'superseded_run_id':30407772491},indent=2,sort_keys=True)+'\n')
          PY
      - name: Execute decision gate v2 for every candidate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          set -euo pipefail
          for input in input/ai/*.json; do
            name="$(basename "$input" .json)"
            (
              cd ai-router
              python scripts/strategy11_ai_review_router_v2.py \
                --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS \
                --mode execute \
                --input "../$input" \
                --output "../out/ai/${name}.json"
            )
          done
      - name: Assert all candidate decisions permit replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('out/ai').glob('*.json')):
              data=json.loads(path.read_text())
              assert data['status']=='PASS_AI_REVIEW_DECISION_GATE',(path,data.get('blocker_codes'))
              providers=data['provider_results']
              for provider in ('groq','workers_ai'):
                  review=providers[provider]['artifact']['review']
                  assert review['decision']=='PASS_TO_REPLAY',(path,provider,review)
                  assert review['single_axis'] is True
              assert providers['workers_ai']['artifact']['review']['lineage_complete'] is True
              assert data['promotion_authority'] is False
              assert data['protected_mutations']==0
              assert data['execution_allowed'] is False
              assert data['order_authority']=='BLOCKED'
              rows.append({'path':path.name,'input_sha':data['input_sha'],'status':data['status']})
          assert len(rows)==44,len(rows)
          Path('out/ai_manifest.json').write_text(json.dumps({'state':'PASS_ALL_44_SINGLE_AXIS_AI_DECISIONS','review_count':44,'rows':rows,'promotion_authority':False,'execution_allowed':False,'order_authority':'BLOCKED'},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-semantic-axis-v5-ai-review-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            out/ai
            out/ai_manifest.json
            input/ai_manifest.json
          if-no-files-found: error
          retention-days: 90

  replay:
    name: replay semantic axes batch ${{ matrix.batch }}
    needs: [plan, ai-review]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: '1'
            strategies: 'anchor_vwap_trend,bb_revert,break_and_continue,fvg_revert,grid_rebalance'
          - batch: '2'
            strategies: 'keltner_trend,liquidity_sweep,mfi_rsi_div,obv_trend,pivot_reversal'
          - batch: '3'
            strategies: 'range_fade,rbreaker_like,rsi_swing_fail,scalp_snap,session_bias'
          - batch: '4'
            strategies: 'squeeze_break,sr_levels,supertrend_pullback,trend_ma_macd,trend_rider'
          - batch: '5'
            strategies: 'vol_spike_fade,vwap_revert'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile replay engine
        run: python -m py_compile backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py
      - name: Download generation-six plan
        uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v5-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/plan
      - name: Download AI decision manifest
        uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v5-ai-review-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/ai
      - name: Assert AI manifest authority before data replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          matches=list(Path('input/ai').rglob('ai_manifest.json'))
          assert matches,matches
          data=json.loads(matches[0].read_text())
          assert data['state']=='PASS_ALL_44_SINGLE_AXIS_AI_DECISIONS'
          assert data['review_count']==44
          assert data['promotion_authority'] is False
          assert data['execution_allowed'] is False
          assert data['order_authority']=='BLOCKED'
          PY
      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download evidence batches
        run: |
          mkdir -p input/evidence
          for b in 1 2 3 4 5; do
            gh run download 30252022416 --repo "$GITHUB_REPOSITORY" --name "s11-evidence-batch-${b}-30252022416-attempt-1" --dir "input/evidence/batch-${b}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Replay control and semantic-axis candidates
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py \
            --mode replay \
            --root . \
            --plan input/plan/plan.json \
            --policy backend/research/strategy11_multimodal_rescue_l090_v1.json \
            --fresh-root input/fresh \
            --evidence-root input/evidence \
            --strategy-ids '${{ matrix.strategies }}' \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --out out/batch-${{ matrix.batch }}
      - name: Assert replay safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in Path('out').rglob('summary.json'):
              data=json.loads(path.read_text())
              if data.get('strategy_id') and data.get('version')=='R7A4D_STRATEGY11_MULTIMODAL_L090_REPLAY_V1': rows.append(data)
          assert rows
          for data in rows:
              assert len(data['tested_candidate_ids'])==2 and len(data['variants'])==3
              assert data['promotion_authority'] is False and data['protected_mutations']==0
              assert data['execution_allowed'] is False and data['order_authority']=='BLOCKED'
              for variant in data['variants']:
                  assert variant['parity']['state']=='PASS'
                  assert variant['parity']['duplicate_trade_count']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-semantic-axis-v5-replay-batch-${{ matrix.batch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate generation-six semantic-axis L090 results
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Download replay batches
        uses: actions/download-artifact@v4
        with:
          pattern: s11-semantic-axis-v5-replay-batch-*
          path: input/replays
          merge-multiple: true
      - name: Download search ledger
        uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v5-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/plan
      - name: Aggregate
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py \
            --mode aggregate --replay-root input/replays --out out/final
          cp input/plan/search_ledger.json out/final/search_ledger.json
          cp input/plan/plan.json out/final/generation6_plan.json
      - name: Assert final contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('out/final/final.json').read_text())
          ledger=json.loads(Path('out/final/search_ledger.json').read_text())
          assert data['state']=='PASS_MULTIMODAL_L090_REPLAY_COMPLETE' and data['strategy_count']==22
          assert len(data['active_l085_queue'])<=3 and ledger['state']=='PASS_SEARCH_LEDGER'
          assert data['promotion_authority'] is False and data['protected_mutations']==0
          assert data['execution_allowed'] is False and data['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-semantic-axis-v5-final-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/final
          if-no-files-found: error
          retention-days: 90
