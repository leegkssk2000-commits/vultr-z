name: R7A4D Strategy11 Semantic Axis Rotation L090 V6

on:
  pull_request:
    branches:
      - r7a4d-strategy11-semantic-axis-rotation-l090-v5
    paths:
      - .github/workflows/r7a4d-strategy11-semantic-axis-rotation-l090-v6.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: r7a4d-strategy11-semantic-axis-v6-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  ORIGINAL_PLAN_RUN_ID: '30377925428'
  PRIOR_RUN_ID: '30410892147'
  PRIOR_ARTIFACT: 's11-semantic-axis-v5-filtered-final-30410892147'

jobs:
  plan:
    name: build generation-seven semantic plan and cumulative ledger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original bounded profile plan
        uses: actions/download-artifact@v4
        with:
          name: s11-multimodal-rescue-l090-v1-30377925428-attempt-1
          path: input/original
          github-token: ${{ github.token }}
          run-id: ${{ env.ORIGINAL_PLAN_RUN_ID }}
      - name: Download authoritative generation-six final and ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_ARTIFACT }}
          path: input/prior
          github-token: ${{ github.token }}
          run-id: ${{ env.PRIOR_RUN_ID }}
      - name: Rotate every strategy to next untested semantic axes
        run: |
          mkdir -p out/plan
          python -m py_compile backend/tools/r7a4d_strategy11_semantic_axis_rotation_l090_v3.py
          python backend/tools/r7a4d_strategy11_semantic_axis_rotation_l090_v3.py \
            --original-plan-root input/original \
            --prior-final-root input/prior \
            --out out/plan
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('plan.json','search_ledger.json'):
              path=Path('out/plan')/name
              data=json.loads(path.read_text())
              data['version']='R7A4D_STRATEGY11_SEMANTIC_AXIS_ROTATION_L090_V6'
              data['generation']=7
              data['evidence_parent_run_id']=30410892147
              data['prior_authority_artifact']='s11-semantic-axis-v5-filtered-final-30410892147'
              if name=='plan.json':
                  for row in data['rows']:
                      row['generation']=7
                      row.setdefault('evidence_lanes',[]).append('SEMANTIC_GENERATION6_FILTERED_REPLAY')
              path.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
      - name: Assert plan and ledger authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('out/plan/plan.json').read_text())
          ledger=json.loads(Path('out/plan/search_ledger.json').read_text())
          assert plan['state']=='PASS_SEMANTIC_AXIS_ROTATION_PLAN'
          assert plan['strategy_count']==22 and plan['candidate_count']==44 and plan['generation']==7
          assert ledger['state']=='PASS_SEARCH_LEDGER'
          assert ledger['duplicate_strategy_axis_data_runs']==0
          for row in plan['rows']:
              assert len(row['candidate_ids'])==2
              specs=[row['candidate_specs'][cid] for cid in row['candidate_ids']]
              assert len({spec['axis'] for spec in specs})==2
          for payload in (plan,ledger):
              assert payload['promotion_authority'] is False
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
          assert plan['protected_mutations']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-semantic-axis-v6-plan-${{ github.run_id }}
          path: out/plan
          if-no-files-found: error
          retention-days: 90

  ai-filter:
    name: per-candidate AI decision gate and immutable filtering
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: master
          path: ai-router
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v6-plan-${{ github.run_id }}
          path: input/plan
      - name: Build 44 anonymized single-axis payloads
        run: |
          mkdir -p input/ai out/providers out/filter
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          plan=json.loads(Path('input/plan/plan.json').read_text())
          ledger=json.loads(Path('input/plan/search_ledger.json').read_text())
          assert plan['generation']==7 and plan['candidate_count']==44
          assert ledger['duplicate_strategy_axis_data_runs']==0
          rows=[]
          for row in plan['rows']:
              for cid in row['candidate_ids']:
                  spec=row['candidate_specs'][cid]
                  canonical=json.dumps({'strategy_id':row['strategy_id'],'candidate_id':cid,'spec':spec},sort_keys=True,separators=(',',':'))
                  payload={
                    'strategy_id':row['strategy_id'],
                    'candidate_id':cid,
                    'changed_axes':[spec['axis']],
                    'routing_flags':{'external_hypothesis':True,'multimodal':False,'new_multimodal_evidence':False,'new_failure_fingerprint':False,'borderline_case':False,'major_gate_review':False},
                    'hypothesis':{'axis':spec['axis'],'generation':7,'description':'One bounded existing feature changes exactly one semantic axis for isolated deterministic replay.','candidate_spec':spec},
                    'evidence':{'strategy_count':1,'candidate_count':1,'duplicate_strategy_axis_data_runs':0,'prior_evidence_lanes':row['evidence_lanes'],'falsification_test':row['falsification_test']},
                    'lineage':{'source_sha':'64e27d16d7f28b9fae59cf2a875d195f4bca22a1','data_sha':'SOURCE_RUN_30252022416','window_sha':plan.get('prior_final_sha256',''),'candidate_sha':hashlib.sha256(canonical.encode()).hexdigest()}
                  }
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f"{row['strategy_id']}__{cid}")
                  path=Path('input/ai')/f'{safe}.json'
                  path.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
                  rows.append({'strategy_id':row['strategy_id'],'candidate_id':cid,'axis':spec['axis'],'file':path.name})
          assert len(rows)==44
          Path('input/payload_manifest.json').write_text(json.dumps({'state':'PASS_44_SINGLE_AXIS_PAYLOADS','rows':rows},indent=2,sort_keys=True)+'\n')
          PY
      - name: Execute role-based AI decision gate for every candidate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          set +e
          for input in input/ai/*.json; do
            name="$(basename "$input" .json)"
            (
              cd ai-router
              python scripts/strategy11_ai_review_router_v2.py \
                --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS \
                --mode execute \
                --input "../$input" \
                --output "../out/providers/${name}.json"
            )
          done
          exit 0
      - name: Freeze accepted candidates and evidence holds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('input/plan/plan.json').read_text())
          ledger=json.loads(Path('input/plan/search_ledger.json').read_text())
          manifest=json.loads(Path('input/payload_manifest.json').read_text())
          decisions=[]; rejected=[]; accepted=set()
          for row in manifest['rows']:
              path=Path('out/providers')/row['file']
              if path.exists():
                  data=json.loads(path.read_text())
                  providers=data.get('provider_results',{})
                  item={**row,'status':data.get('status'),'blocker_codes':data.get('blocker_codes',[]),'input_sha':data.get('input_sha'),'groq':((providers.get('groq') or {}).get('artifact') or {}).get('review'),'workers_ai':((providers.get('workers_ai') or {}).get('artifact') or {}).get('review')}
              else:
                  item={**row,'status':'MISSING','blocker_codes':['AI_RESULT_MISSING']}
              decisions.append(item)
              key=(row['strategy_id'],row['candidate_id'])
              if item['status']=='PASS_AI_REVIEW_DECISION_GATE': accepted.add(key)
              else: rejected.append(item)
          zero=[]; accepted_count=0
          for row in plan['rows']:
              original=list(row['candidate_ids'])
              kept=[cid for cid in original if (row['strategy_id'],cid) in accepted]
              if not kept: zero.append(row['strategy_id'])
              row['candidate_ids']=kept
              row['candidate_specs']={cid:row['candidate_specs'][cid] for cid in kept}
              row['ai_review_state']='PASS_TO_REPLAY_FILTERED' if kept else 'HOLD_NO_AI_ACCEPTED_CANDIDATE'
              row['ai_rejected_candidates']=[cid for cid in original if cid not in kept]
              accepted_count+=len(kept)
          for row in ledger['rows']:
              prow=next(x for x in plan['rows'] if x['strategy_id']==row['strategy_id'])
              row['selected_candidate_ids']=list(prow['candidate_ids'])
              row['selected_axes']=[prow['candidate_specs'][cid]['axis'] for cid in prow['candidate_ids']]
              if prow['ai_rejected_candidates']:
                  row['rejection_reason']='AI_PRE_REPLAY_REJECT:'+','.join(prow['ai_rejected_candidates'])
          plan['state']='PASS_AI_FILTERED_SEMANTIC_AXIS_ROTATION_PLAN' if not zero else 'HOLD_STRATEGY_WITHOUT_ACCEPTED_CANDIDATE'
          plan['candidate_count']=accepted_count
          plan['ai_pass_count']=accepted_count
          plan['ai_reject_count']=len(rejected)
          plan['wait_new_evidence']=rejected
          ledger['ai_pass_count']=accepted_count
          ledger['ai_reject_count']=len(rejected)
          ledger['wait_new_evidence']=rejected
          ai={'state':'PASS_AI_FILTERED_PLAN' if not zero else 'HOLD_AI_FILTERED_PLAN','review_count':len(decisions),'pass_count':accepted_count,'reject_count':len(rejected),'zero_accepted_strategies':zero,'decisions':decisions,'rejected':rejected,'promotion_authority':False,'protected_mutations':0,'execution_allowed':False,'order_authority':'BLOCKED'}
          Path('out/filter/accepted_plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          Path('out/filter/search_ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          Path('out/filter/ai_manifest.json').write_text(json.dumps(ai,indent=2,sort_keys=True)+'\n')
          assert len(decisions)==44
          assert accepted_count+len(rejected)==44
          assert not zero,zero
          assert all(1<=len(row['candidate_ids'])<=2 for row in plan['rows'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-semantic-axis-v6-filtered-plan-${{ github.run_id }}
          path: |
            out/filter
            out/providers
            input/payload_manifest.json
          if-no-files-found: error
          retention-days: 90

  replay:
    name: replay accepted generation-seven candidates batch ${{ matrix.batch }}
    needs: ai-filter
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: '1'
            strategies: 'anchor_vwap_trend,bb_revert,break_and_continue,fvg_revert,grid_rebalance'
          - batch: '2'
            strategies: 'keltner_trend,liquidity_sweep,mfi_rsi_div,obv_trend,pivot_reversal'
          - batch: '3'
            strategies: 'range_fade,rbreaker_like,rsi_swing_fail,scalp_snap,session_bias'
          - batch: '4'
            strategies: 'squeeze_break,sr_levels,supertrend_pullback,trend_ma_macd,trend_rider'
          - batch: '5'
            strategies: 'vol_spike_fade,vwap_revert'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v6-filtered-plan-${{ github.run_id }}
          path: input/plan
      - uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download immutable evidence batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/evidence
          for b in 1 2 3 4 5; do gh run download 30252022416 --repo "$GITHUB_REPOSITORY" --name "s11-evidence-batch-${b}-30252022416-attempt-1" --dir "input/evidence/batch-${b}"; done
      - name: Replay control and accepted candidates
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py \
            --mode replay --root . --plan input/plan/accepted_plan.json \
            --policy backend/research/strategy11_multimodal_rescue_l090_v1.json \
            --fresh-root input/fresh --evidence-root input/evidence \
            --strategy-ids '${{ matrix.strategies }}' \
            --source-run-id "$SOURCE_RUN_ID" --source-head-sha "$SOURCE_HEAD_SHA" \
            --out out/batch-${{ matrix.batch }}
      - name: Assert parity, lineage and bounded candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in Path('out').rglob('summary.json'):
              d=json.loads(path.read_text())
              if d.get('strategy_id') and d.get('version')=='R7A4D_STRATEGY11_MULTIMODAL_L090_REPLAY_V1': rows.append(d)
          assert rows
          for d in rows:
              count=len(d['tested_candidate_ids'])
              assert 1<=count<=2
              assert len(d['variants'])==count+1
              assert d['promotion_authority'] is False and d['protected_mutations']==0
              assert d['execution_allowed'] is False and d['order_authority']=='BLOCKED'
              for variant in d['variants']:
                  assert variant['parity']['state']=='PASS'
                  assert variant['parity']['duplicate_trade_count']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-semantic-axis-v6-replay-${{ matrix.batch }}-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate authoritative generation-seven results
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: s11-semantic-axis-v6-replay-*
          path: input/replays
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: s11-semantic-axis-v6-filtered-plan-${{ github.run_id }}
          path: input/plan
      - name: Aggregate and assert authority
        run: |
          python backend/tools/r7a4d_strategy11_multimodal_l090_replay_v1.py --mode aggregate --replay-root input/replays --out out/final
          cp input/plan/accepted_plan.json out/final/generation7_accepted_plan.json
          cp input/plan/search_ledger.json out/final/search_ledger.json
          cp input/plan/ai_manifest.json out/final/ai_manifest.json
          python - <<'PY'
          import json
          d=json.load(open('out/final/final.json'))
          ledger=json.load(open('out/final/search_ledger.json'))
          ai=json.load(open('out/final/ai_manifest.json'))
          assert d['state']=='PASS_MULTIMODAL_L090_REPLAY_COMPLETE'
          assert d['strategy_count']==22
          assert len(d['active_l085_queue'])<=3
          assert ledger['duplicate_strategy_axis_data_runs']==0
          assert ai['review_count']==44 and ai['pass_count']>=22
          assert d['promotion_authority'] is False and d['protected_mutations']==0
          assert d['execution_allowed'] is False and d['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-semantic-axis-v6-final-${{ github.run_id }}
          path: out/final
          if-no-files-found: error
          retention-days: 90
