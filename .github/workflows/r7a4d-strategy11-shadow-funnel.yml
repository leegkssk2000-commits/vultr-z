name: R7A4D Strategy11 Shadow Funnel

on:
  push:
    branches:
      - r7a4d-strategy11-shadow-funnel-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile funnel
        run: |
          PYTHONPATH=. python -m py_compile backend/strategy25/strategy11_feature_library_v1.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy11_screen.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy11_exact.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy11_aggregate.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy11_orchestrator.py

      - name: Run simulation and replay funnel
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python backend/tools/r7a4d_strategy11_orchestrator.py --root . --workers 3 2>&1 | tee strategy11-funnel.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > strategy11-funnel.rc
          exit 0

      - name: Upload funnel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-shadow-funnel-v1
          path: |
            artifacts/strategy11_screen_v1
            artifacts/strategy11_exact_v1
            artifacts/strategy11_final_roster_v1
            artifacts/strategy11_orchestrator_v1
            strategy11-funnel.log
            strategy11-funnel.rc
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce funnel integrity
        run: test "$(cat strategy11-funnel.rc)" = "0"
