name: R7A4D Strategy11 Shadow20 Readonly Canary V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/strategy11_shadow20_readonly_canary_v1.py
      - backend/tools/r7a4d_strategy11_shadow20_readonly_canary_fixture_v1.py
      - .github/workflows/r7a4d-strategy11-shadow20-readonly-canary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy11-shadow20-readonly-canary-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile canary and fixtures
        run: |
          python -m py_compile backend/research/strategy11_shadow20_readonly_canary_v1.py
          python -m py_compile backend/tools/r7a4d_strategy11_shadow20_readonly_canary_fixture_v1.py
          python -m py_compile backend/contracts/strategy11_source_binding_contract_v1.py

      - name: Run PASS HOLD ROLLBACK and tamper lanes
        run: python backend/tools/r7a4d_strategy11_shadow20_readonly_canary_fixture_v1.py

      - name: Assert Shadow20 state machine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('artifacts/strategy11_shadow20_readonly_canary_v1')
          row=json.loads((root/'summary.json').read_text())
          assert row['state']=='PASS_SHADOW20_READ_ONLY_CANARY_FIXTURES', row
          assert row['pass_state']=='PASS_SHADOW20_READ_ONLY_CANARY'
          assert row['cycle_count']==20
          assert row['incomplete_state']=='HOLD_SHADOW20_READ_ONLY_CANARY'
          assert row['dd_breach_state']=='ROLLBACK_SHADOW20_READ_ONLY_CANARY'
          assert row['weight_drift_state']=='HOLD_SHADOW20_READ_ONLY_CANARY'
          assert row['parity_failure_state']=='HOLD_SHADOW20_READ_ONLY_CANARY'
          assert set(row['negative_cases_passed'])=={
              'CYCLE_DATA_SHA_MISMATCH',
              'CYCLE_SHA_MISMATCH',
              'CYCLE_EXECUTION_FORBIDDEN',
              'PREFLIGHT_SHA_MISMATCH',
          }
          assert row['shadow_200c_allowed'] is True
          assert row['automatic_shadow_start'] is False
          assert row['real_shadow_started'] is False
          assert row['fixture_only'] is True
          assert row['production_threshold_authority'] is False
          assert row['runtime_bound'] is False
          assert row['research_only'] is True
          assert row['promotion_authority'] is False
          assert row['protected_mutations']==0
          assert row['execution_allowed'] is False
          assert row['order_authority']=='BLOCKED'

          passed=json.loads((root/'pass.json').read_text())
          assert passed['shadow_20c_complete'] is True
          assert passed['shadow_200c_allowed'] is True
          assert passed['reason_codes']==['ALL_SHADOW20_GATES_PASS']
          assert passed['requested_action']=='hold'
          assert passed['automatic_shadow_start'] is False
          assert passed['real_shadow_started'] is False
          assert passed['next']=='SHADOW_200C_READ_ONLY_ACCUMULATION'
          PY

      - name: Upload Shadow20 canary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-shadow20-readonly-canary-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_shadow20_readonly_canary_v1
          if-no-files-found: error
          retention-days: 90
