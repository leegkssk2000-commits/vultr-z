# experiment trigger: R7A4D_S11_SL3_2_PARALLEL_HEARTBEAT_20260726T1742Z
name: R7A4D Strategy11 Structure Lock V3.2 Parallel Heartbeat

on:
  push:
    branches:
      - r7a4d-strategy11-structure-lock-v3-parallel-heartbeat
    paths:
      - 'backend/tools/r7a4d_strategy11_structure_lock.py'
      - 'backend/tools/r7a4d_strategy11_structure_lock_v2.py'
      - 'backend/tools/r7a4d_strategy11_orchestrator.py'
      - 'tests/test_r7a4d_strategy11_structure_lock.py'
      - '.github/workflows/r7a4d-strategy11-structure-lock-v2.yml'
  pull_request:
    branches:
      - r7a4d-strategy11-structure-lock-v3-minimal
    paths:
      - 'backend/tools/r7a4d_strategy11_structure_lock.py'
      - 'backend/tools/r7a4d_strategy11_structure_lock_v2.py'
      - 'backend/tools/r7a4d_strategy11_orchestrator.py'
      - 'tests/test_r7a4d_strategy11_structure_lock.py'
      - '.github/workflows/r7a4d-strategy11-structure-lock-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-structure-lock-v3-2-parallel-heartbeat-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  STRATEGY11_STRUCTURE_VERSION: R7A4D_STRATEGY11_STRUCTURE_LOCK_V3_2_PARALLEL_HEARTBEAT
  STRATEGY11_EXPERIMENT_ID: R7A4D_S11_SL3_2_${{ github.sha }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile lock funnel and tests
        run: |
          python -m py_compile backend/tools/r7a4d_strategy11_structure_lock.py
          python -m py_compile backend/tools/r7a4d_strategy11_structure_lock_v2.py
          python -m py_compile backend/tools/r7a4d_strategy11_orchestrator.py
          python -m py_compile tests/test_r7a4d_strategy11_structure_lock.py

      - name: Run fixtures and invariants
        run: python -m unittest -v tests.test_r7a4d_strategy11_structure_lock

      - name: Capture owner source and protected SHA lock
        run: python backend/tools/r7a4d_strategy11_structure_lock.py capture --root .

      - name: Build immutable market cache
        run: python backend/tools/r7a4d_strategy11_prepare_data_v2.py --root .

      - name: Enforce data and preflight lock
        run: python backend/tools/r7a4d_strategy11_structure_lock.py pre --root .

      - name: Write experiment identity
        run: |
          mkdir -p artifacts/strategy11_structure_lock_v2
          printf '%s\n' "$STRATEGY11_STRUCTURE_VERSION" > artifacts/strategy11_structure_lock_v2/structure_version.txt
          printf '%s\n' "$STRATEGY11_EXPERIMENT_ID" > artifacts/strategy11_structure_lock_v2/experiment_id.txt

      - name: Upload immutable experiment input
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-input-v3-${{ github.run_id }}
          path: |
            artifacts/strategy11_market_cache_v2
            artifacts/strategy11_structure_lock_v2
          if-no-files-found: error
          retention-days: 30

  replay-a:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-input-v3-${{ github.run_id }}
          path: artifacts
      - name: Full deterministic replay A
        shell: bash
        run: |
          set +e
          set -o pipefail
          python backend/tools/r7a4d_strategy11_orchestrator.py --root . --workers 3 --child-timeout-s 1800 2>&1 | tee strategy11-funnel-A.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > strategy11-funnel-A.rc
          exit "$rc"
      - name: Upload replay A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-run-A-v3-${{ github.run_id }}
          path: |
            artifacts/strategy11_screen_v1
            artifacts/strategy11_exact_v1
            artifacts/strategy11_final_roster_v1
            artifacts/strategy11_orchestrator_v1
            strategy11-funnel-A.log
            strategy11-funnel-A.rc
          if-no-files-found: error
          retention-days: 30

  replay-b:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-input-v3-${{ github.run_id }}
          path: artifacts
      - name: Full deterministic replay B
        shell: bash
        run: |
          set +e
          set -o pipefail
          python backend/tools/r7a4d_strategy11_orchestrator.py --root . --workers 3 --child-timeout-s 1800 2>&1 | tee strategy11-funnel-B.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > strategy11-funnel-B.rc
          exit "$rc"
      - name: Upload replay B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-run-B-v3-${{ github.run_id }}
          path: |
            artifacts/strategy11_screen_v1
            artifacts/strategy11_exact_v1
            artifacts/strategy11_final_roster_v1
            artifacts/strategy11_orchestrator_v1
            strategy11-funnel-B.log
            strategy11-funnel-B.rc
          if-no-files-found: error
          retention-days: 30

  compare-and-lock:
    needs: [preflight, replay-a, replay-b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-input-v3-${{ github.run_id }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-run-A-v3-${{ github.run_id }}
          path: compare/A
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-run-B-v3-${{ github.run_id }}
          path: compare/B
      - name: Compare deterministic replay and protected SHA
        shell: bash
        run: |
          set +e
          set -o pipefail
          python backend/tools/r7a4d_strategy11_structure_lock.py compare --root . --run-a compare/A --run-b compare/B 2>&1 | tee strategy11-structure-lock-v3.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > strategy11-structure-lock-v3.rc
          exit "$rc"
      - name: Upload final structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-lock-final-v3-${{ github.run_id }}
          path: |
            artifacts/strategy11_structure_lock_v2
            strategy11-structure-lock-v3.log
            strategy11-structure-lock-v3.rc
          if-no-files-found: error
          retention-days: 30
      - name: Enforce final STRUCTURE_LOCK
        run: test "$(cat strategy11-structure-lock-v3.rc)" = "0"
