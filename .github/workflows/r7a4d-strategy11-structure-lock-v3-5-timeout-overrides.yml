name: R7A4D Strategy11 Structure Lock V3.5 Timeout Overrides

on:
  pull_request:
    branches:
      - r7a4d-strategy11-structure-lock-v3-lineage-symmetric
    paths:
      - 'backend/tools/r7a4d_strategy11_batch_runner_v3.py'
      - '.github/workflows/r7a4d-strategy11-structure-lock-v3-5-timeout-overrides.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-structure-lock-v3-5-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  STRATEGY11_STRUCTURE_VERSION: R7A4D_STRATEGY11_STRUCTURE_LOCK_V3_5_TIMEOUT_OVERRIDES
  STRATEGY11_EXPERIMENT_ID: R7A4D_S11_SL3_5_${{ github.sha }}
  INPUT_ARTIFACT: strategy11-structure-input-v3-5-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  preflight:
    name: Preflight / immutable input / attempt ${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile V3.5 and invariants
        run: |
          python -m py_compile backend/tools/r7a4d_strategy11_structure_lock.py
          python -m py_compile backend/tools/r7a4d_strategy11_batch_runner_v2.py
          python -m py_compile backend/tools/r7a4d_strategy11_batch_runner_v3.py
          python -m unittest -v tests.test_r7a4d_strategy11_structure_lock
      - name: Capture owner source and protected SHA lock
        run: python backend/tools/r7a4d_strategy11_structure_lock.py capture --root .
      - name: Build immutable market cache
        run: python backend/tools/r7a4d_strategy11_prepare_data_v2.py --root .
      - name: Enforce data and preflight lock
        run: python backend/tools/r7a4d_strategy11_structure_lock.py pre --root .
      - name: Write V3.5 identity
        run: |
          mkdir -p artifacts/strategy11_structure_lock_v2
          printf '%s\n' "$STRATEGY11_STRUCTURE_VERSION" > artifacts/strategy11_structure_lock_v2/structure_version.txt
          printf '%s\n' "$STRATEGY11_EXPERIMENT_ID" > artifacts/strategy11_structure_lock_v2/experiment_id.txt
          printf '%s\n' "${{ github.run_id }}" > artifacts/strategy11_structure_lock_v2/run_id.txt
          printf '%s\n' "${{ github.run_attempt }}" > artifacts/strategy11_structure_lock_v2/run_attempt.txt
          printf '%s\n' "${{ github.sha }}" > artifacts/strategy11_structure_lock_v2/head_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: |
            artifacts/strategy11_market_cache_v2
            artifacts/strategy11_structure_lock_v2
          if-no-files-found: error
          retention-days: 30

  screen:
    name: Replay ${{ matrix.replay }} / SCREEN / batch ${{ matrix.batch }}/5
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        replay: [A, B]
        batch: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: artifacts
      - name: Run SCREEN batch
        run: python backend/tools/r7a4d_strategy11_batch_runner_v3.py run-batch --root . --replay "${{ matrix.replay }}" --phase screen --batch-index "${{ matrix.batch }}" --timeout-seconds 1800 --workers 3
      - name: Upload SCREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-${{ matrix.replay }}-screen-${{ matrix.batch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/strategy11_screen_v1
            artifacts/strategy11_batch_v2/${{ matrix.replay }}/screen
          if-no-files-found: error
          retention-days: 30

  exact:
    name: Replay ${{ matrix.replay }} / EXACT / batch ${{ matrix.batch }}/5
    needs: [preflight, screen]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        replay: [A, B]
        batch: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: s11-${{ matrix.replay }}-screen-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
          merge-multiple: true
      - name: Run EXACT batch
        run: python backend/tools/r7a4d_strategy11_batch_runner_v3.py run-batch --root . --replay "${{ matrix.replay }}" --phase exact --batch-index "${{ matrix.batch }}" --timeout-seconds 1800 --workers 3
      - name: Upload EXACT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-${{ matrix.replay }}-exact-${{ matrix.batch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/strategy11_exact_v1
            artifacts/strategy11_batch_v2/${{ matrix.replay }}/exact
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Replay ${{ matrix.replay }} / AGGREGATE / 25+25 verification
    needs: [preflight, exact]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replay: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: s11-${{ matrix.replay }}-screen-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: s11-${{ matrix.replay }}-exact-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
          merge-multiple: true
      - name: Finalize replay
        run: python backend/tools/r7a4d_strategy11_batch_runner_v3.py finalize-replay --root . --replay "${{ matrix.replay }}"
      - name: Upload complete replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-run-${{ matrix.replay }}-v3-5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/strategy11_screen_v1
            artifacts/strategy11_exact_v1
            artifacts/strategy11_final_roster_v1
            artifacts/strategy11_orchestrator_v1
            artifacts/strategy11_batch_v2/${{ matrix.replay }}
          if-no-files-found: error
          retention-days: 30

  compare_and_lock:
    name: Compare A/B / final STRUCTURE_LOCK
    needs: [preflight, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-run-A-v3-5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: compare/A
      - uses: actions/download-artifact@v4
        with:
          name: strategy11-structure-run-B-v3-5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: compare/B
      - name: Compare deterministic replay and protected SHA
        run: python backend/tools/r7a4d_strategy11_structure_lock.py compare --root . --run-a compare/A --run-b compare/B
      - name: Upload final structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy11-structure-lock-final-v3-5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_structure_lock_v2
          if-no-files-found: error
          retention-days: 30
