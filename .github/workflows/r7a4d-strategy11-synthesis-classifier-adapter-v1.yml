name: R7A4D Strategy11 Synthesis Classifier Adapter V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/research/strategy11_synthesis_classifier_adapter_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_classifier_adapter_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-classifier-adapter-v1.yml"
  push:
    branches: [master]
    paths:
      - "backend/research/strategy11_synthesis_classifier_adapter_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_classifier_adapter_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-classifier-adapter-v1.yml"

permissions:
  contents: read

concurrency:
  group: strategy11-synthesis-classifier-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-synthesis-classifier-adapter:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile synthesis classifier chain
        run: |
          python -m py_compile \
            backend/contracts/strategy11_strategy_proposal_contract_v1.py \
            backend/research/strategy11_global_candidate_classifier_v1.py \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/research/strategy11_component_attribution_v1.py \
            backend/research/strategy11_synthesis_sealer_v1.py \
            backend/research/strategy11_synthesis_classifier_adapter_v1.py \
            backend/tools/r7a4d_strategy11_synthesis_classifier_adapter_fixture_v1.py
      - name: Execute synthesis classifier adapter fixtures
        run: python backend/tools/r7a4d_strategy11_synthesis_classifier_adapter_fixture_v1.py
      - name: Assert synthesis-only classifier boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/strategy11_synthesis_classifier_adapter_v1")
          passed = json.loads((root / "pass.json").read_text())
          held = json.loads((root / "hold.json").read_text())
          rejected = json.loads((root / "reject.json").read_text())
          status = json.loads((root / "status.json").read_text())

          assert passed["state"] == "PASS_SYNTHESIS_CLASSIFIER_ADAPTER"
          assert passed["classification"]["classification"] == "SYNTHESIS"
          assert passed["next"] == "ENSEMBLE_CORRELATION_ANALYZER"
          assert passed["classifier_evidence"]["independent_edge_pass"] is False
          assert passed["classifier_evidence"]["synthesis_eligible"] is True
          assert held["classification"]["classification"] == "HOLD"
          assert rejected["classification"]["classification"] == "REJECT"
          assert status["fixture_only"] is True
          assert status["production_authority"] is False
          for value in (passed, held, rejected, status):
              assert value["research_only"] is True
              assert value["promotion_authority"] is False
              assert value["protected_mutations"] == 0
              assert value["execution_allowed"] is False
              assert value["order_authority"] == "BLOCKED"
          assert passed["runtime_bound"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy11-synthesis-classifier-adapter-${{ github.run_id }}
          path: artifacts/strategy11_synthesis_classifier_adapter_v1
          if-no-files-found: error
