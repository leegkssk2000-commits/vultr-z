name: R7A4D Strategy11 Synthesis Factorial Replay V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/research/strategy11_synthesis_factorial_replay_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-factorial-replay-v1.yml"
  push:
    branches: [master]
    paths:
      - "backend/research/strategy11_synthesis_factorial_replay_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-factorial-replay-v1.yml"

permissions:
  contents: read

concurrency:
  group: strategy11-synthesis-factorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-factorial-replay:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile factorial replay chain
        run: |
          python -m py_compile \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py
      - name: Execute positive and negative factorial fixtures
        run: python backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py
      - name: Assert W2 OOS and blocked authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/strategy11_synthesis_factorial_replay_v1")
          result = json.loads((root / "result.json").read_text())
          status = json.loads((root / "status.json").read_text())
          assert result["state"] == "PASS_SYNTHESIS_FACTORIAL_W2_CANDIDATE"
          assert result["evaluation_stage"] == "W2"
          assert result["selection_data_reused"] is False
          assert result["next"] == "COMPONENT_ATTRIBUTION"
          assert status["fixture_only"] is True
          assert status["production_authority"] is False
          for value in (result, status):
              assert value["research_only"] is True
              assert value["promotion_authority"] is False
              assert value["protected_mutations"] == 0
              assert value["execution_allowed"] is False
              assert value["order_authority"] == "BLOCKED"
              assert value["runtime_bound"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy11-synthesis-factorial-replay-${{ github.run_id }}
          path: artifacts/strategy11_synthesis_factorial_replay_v1
          if-no-files-found: error
