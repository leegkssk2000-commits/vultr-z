name: R7A4D Strategy11 Synthesis Material Registry V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/research/strategy11_synthesis_material_registry_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-material-registry-v1.yml"
  push:
    branches: [master]
    paths:
      - "backend/research/strategy11_synthesis_material_registry_v1.py"
      - "backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py"
      - ".github/workflows/r7a4d-strategy11-synthesis-material-registry-v1.yml"

permissions:
  contents: read

concurrency:
  group: strategy11-synthesis-material-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-material-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile registry and fixture
        run: |
          python -m py_compile \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py
      - name: Execute deterministic positive and negative fixtures
        run: python backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py
      - name: Assert fixture-only blocked authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("artifacts/strategy11_synthesis_material_registry_v1/status.json").read_text())
          assert value["state"] == "PASS_SYNTHESIS_MATERIAL_REGISTRY_FIXTURE"
          assert value["fixture_only"] is True
          assert value["production_authority"] is False
          assert value["research_only"] is True
          assert value["promotion_authority"] is False
          assert value["protected_mutations"] == 0
          assert value["execution_allowed"] is False
          assert value["order_authority"] == "BLOCKED"
          assert value["runtime_bound"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy11-synthesis-material-registry-${{ github.run_id }}
          path: artifacts/strategy11_synthesis_material_registry_v1
          if-no-files-found: error
