name: R7A4D Strategy11 Trade Path Causal Loop V1

on:
  pull_request:
    branches:
      - master
    paths:
      - backend/research/strategy11_trade_path_enricher_v1.py
      - backend/research/strategy11_pre_shadow_path_optimize_planner_v1.py
      - backend/research/strategy11_pre_shadow_path_optimize_policy_v1.json
      - backend/tools/r7a4d_strategy11_trade_path_causal_loop_fixture_v1.py
      - .github/workflows/r7a4d-strategy11-trade-path-causal-loop-v1.yml
      - .github/workflows/r7a4d-strategy11-generation7-quota-state-machine-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-trade-path-causal-loop-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  validate-trade-path-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile path evidence and planner
        run: |
          python -m py_compile \
            backend/research/strategy11_trade_path_enricher_v1.py \
            backend/research/strategy11_pre_shadow_path_optimize_planner_v1.py \
            backend/tools/r7a4d_strategy11_trade_path_causal_loop_fixture_v1.py
      - name: Execute deterministic path fixtures
        run: |
          python backend/tools/r7a4d_strategy11_trade_path_causal_loop_fixture_v1.py \
            --root artifacts/trade-path-causal-loop \
            --enricher backend/research/strategy11_trade_path_enricher_v1.py \
            --planner backend/research/strategy11_pre_shadow_path_optimize_planner_v1.py \
            --policy backend/research/strategy11_pre_shadow_path_optimize_policy_v1.json
      - name: Assert classification and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/trade-path-causal-loop')
          summary=json.loads((root/'summary.json').read_text())
          plan=json.loads((root/'plan.json').read_text())
          path_index=json.loads((root/'path/index.json').read_text())
          assert summary['state']=='PASS_TRADE_PATH_CAUSAL_LOOP_FIXTURE'
          assert summary['selected_fingerprint']=='MFE_GIVEBACK'
          assert summary['selected_candidate_id']=='PATH_TRAIL_R075_ATR075'
          assert summary['selected_axis']=='MFE_TRAILING'
          assert summary['exhausted_state']=='WAIT_NEW_EVIDENCE_AXIS_EXHAUSTED'
          assert summary['ambiguous_state']=='HOLD_BASIS_AMBIGUITY'
          assert path_index['state']=='PASS_TRADE_PATH_EVIDENCE_INDEX'
          assert path_index['hold_bundle_count']==0
          assert plan['candidate_count']==1
          assert plan['single_axis_per_strategy'] is True
          assert plan['automatic_replay_start_allowed'] is False
          assert plan['ml_light_consumed'] is False
          assert plan['failure_learning_consumed'] is False
          assert plan['runtime_bridge_allowed'] is False
          for payload in (summary,plan,path_index):
              assert payload['promotion_authority'] is False
              assert payload['protected_mutations']==0
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
              assert payload['runtime_bound'] is False
          print(summary['state'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-trade-path-causal-loop-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/trade-path-causal-loop
          if-no-files-found: error
          retention-days: 90
