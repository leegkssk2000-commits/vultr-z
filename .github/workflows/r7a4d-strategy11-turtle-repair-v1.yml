name: R7A4D Strategy11 Turtle Repair V1

on:
  pull_request:
    branches:
      - r7a4d-strategy11-alpha-sealed-one-shot-v1
    paths:
      - 'backend/tools/r7a4d_strategy11_turtle_repair_v1.py'
      - '.github/workflows/r7a4d-strategy11-turtle-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-turtle-repair-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  ALPHA_SEALED_RUN_ID: '30279647167'

jobs:
  turtle_repair:
    name: turtle_trend parity-locked repair
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile turtle repair runner
        run: python -m py_compile backend/tools/r7a4d_strategy11_turtle_repair_v1.py
      - name: Download immutable fresh data
        uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: artifacts/strategy11_fresh_source/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download turtle_trend authority evidence
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-5-30252022416-attempt-1
          path: artifacts/strategy11_evidence_v1
          github-token: ${{ github.token }}
          run-id: 30252022416
      - name: Download alpha_combo sealed authority
        uses: actions/download-artifact@v4
        with:
          name: s11-alpha-sealed-one-shot-v1-30279647167-attempt-1
          path: artifacts/strategy11_alpha_sealed_authority
          github-token: ${{ github.token }}
          run-id: 30279647167
      - name: Verify immutable inputs and queue transition
        run: |
          test -f artifacts/strategy11_fresh_source/fresh/manifest.json
          test -f artifacts/strategy11_evidence_v1/turtle_trend/summary.json
          test -f artifacts/strategy11_alpha_sealed_authority/summary.json
          test ! -e artifacts/strategy11_sealed_source
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('artifacts/strategy11_evidence_v1/turtle_trend/summary.json').read_text())
          a=json.loads(Path('artifacts/strategy11_alpha_sealed_authority/summary.json').read_text())
          assert t['state']=='PASS' and t['strategy_id']=='turtle_trend'
          assert t['baseline']['trade_count']==21
          assert a['state']=='SEALED_REJECT_ROLLBACK'
          assert a['classification']=='NEAR_MISS_REPAIR_EXHAUSTED'
          assert a['sealed_one_shot_consumed'] is True
          assert a['next']=='ADVANCE_TURTLE_TREND_REVIEW'
          assert a['canonical_mutated'] is False and a['registry_mutated'] is False
          PY
      - name: Run turtle_trend repair validation
        run: |
          python backend/tools/r7a4d_strategy11_turtle_repair_v1.py \
            --root . \
            --fresh-root artifacts/strategy11_fresh_source/fresh \
            --baseline-summary artifacts/strategy11_evidence_v1/turtle_trend/summary.json \
            --alpha-sealed-summary artifacts/strategy11_alpha_sealed_authority/summary.json \
            --ssot backend/research/strategy11_improvement_ssot_v1.json \
            --out artifacts/strategy11_turtle_repair_v1 \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA"
      - name: Write turtle repair summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/strategy11_turtle_repair_v1/summary.json')
          if not p.exists():
              raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('# turtle_trend repair validation\n\n')
              out.write(f"- State: **{d['state']}**\n")
              out.write(f"- Winner: {d['winner']}\n")
              out.write(f"- Eligible for sealed: {d['eligible_for_sealed_one_shot']}\n")
              out.write(f"- Sealed read: {d['sealed_holdback_read']}\n")
              out.write(f"- Next: {d['next']}\n")
              if d.get('blockers'):
                  out.write('- Blockers: ' + ', '.join(d['blockers']) + '\n')
              for row in d['variants']:
                  loss=row['loss_metrics']
                  stress=row['stress_2x_p95_plus_one']['loss_metrics']
                  comparison=row.get('comparison_to_incumbent') or {}
                  out.write(
                      f"- {row['variant_id']}: trades={row['trade_count']} WR={row['win_rate_pct']} "
                      f"Net={row['net_return_pct_sum']} PF={row['net_profit_factor']} payoff={row['payoff_ratio']} DD={row['max_drawdown_pct']} "
                      f"avgLossR={loss['avg_loss_R']} worstR={loss['worst_net_loss_R']} breaches={loss['loss_cap_breach_count']} "
                      f"stressWorstR={stress['worst_net_loss_R']} stressBreaches={stress['loss_cap_breach_count']} "
                      f"passToSealed={comparison.get('pass_to_sealed')}\n"
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-turtle-repair-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_turtle_repair_v1
          if-no-files-found: error
          retention-days: 30
