name: R7A4D Strategy11 Unattended Improvement V2

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/strategy11_unattended_improvement_v2.py
      - backend/tools/strategy11_unattended_improvement_replay_v2.py
      - backend/tools/strategy11_unattended_improvement_fixture_v2.py
      - backend/research/strategy11_unattended_improvement_policy_v2.json
      - backend/research/strategy11_famous_indicator_catalog_v1.json
      - backend/strategy25/strategy11_extended_indicator_features_v1.py
      - .github/workflows/r7a4d-strategy11-unattended-improvement-v2.yml
      - .github/workflows/r7a4d-strategy11-famous-indicator-autonomy-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/strategy11_unattended_improvement_v2.py
      - backend/tools/strategy11_unattended_improvement_replay_v2.py
      - backend/tools/strategy11_unattended_improvement_fixture_v2.py
      - backend/research/strategy11_unattended_improvement_policy_v2.json
      - backend/research/strategy11_famous_indicator_catalog_v1.json
      - backend/strategy25/strategy11_extended_indicator_features_v1.py
      - .github/workflows/r7a4d-strategy11-unattended-improvement-v2.yml
      - .github/workflows/r7a4d-strategy11-famous-indicator-autonomy-v1.yml
  schedule:
    - cron: '27 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-unattended-improvement-v2
  cancel-in-progress: false

env:
  PYTHONPATH: .
  COMPUTE_REF: r7a4d-strategy11-cause-aware-rotation-l090-v6
  SOURCE_RUN_ID: '30252022416'
  SOURCE_HEAD_SHA: '64e27d16d7f28b9fae59cf2a875d195f4bca22a1'
  SEED_RUN_ID: '30516499556'
  CUTOFF_UTC: '2026-08-01T08:30:00Z'

jobs:
  plan:
    name: Classify lanes and select causal improvement axes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      active: ${{ steps.state.outputs.active }}
      active_strategies: ${{ steps.state.outputs.active_strategies }}
      cycle: ${{ steps.state.outputs.cycle }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Compile and run lane policy fixture
        run: |
          python -m py_compile \
            backend/tools/strategy11_unattended_improvement_v2.py \
            backend/tools/strategy11_unattended_improvement_replay_v2.py \
            backend/tools/strategy11_unattended_improvement_fixture_v2.py
          python backend/tools/strategy11_unattended_improvement_fixture_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('backend/research/strategy11_unattended_improvement_policy_v2.json').read_text())
          assert policy['selection_rules']['gate_only_forbidden_in_lanes']==[
              'A_ENTRY_LIVENESS_REPAIR','B_COVERAGE_EXPANSION'
          ]
          assert policy['selection_rules']['max_candidates_per_strategy_cycle']==2
          assert policy['promotion_authority'] is False
          assert policy['execution_allowed'] is False
          assert policy['order_authority']=='BLOCKED'
          PY

      - name: Restore latest V2 state or source-bound cycle-one seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/previous
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            previous_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow r7a4d-strategy11-unattended-improvement-v2.yml \
              --branch master --status success --limit 20 \
              --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
            if [ -n "$previous_run" ]; then
              gh run download "$previous_run" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 's11-unattended-improvement-v2-state-*' \
                --dir input/previous || true
            fi
          fi
          if ! find input/previous -type f -name base_replay_final.json -print -quit | grep -q .; then
            gh run download "$SEED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "s11-famous-indicator-autonomy-state-$SEED_RUN_ID" \
              --dir input/previous/seed
          fi
          find input/previous -type f -name search_ledger.json -print -quit > input/previous-ledger-path.txt || true
          find input/previous -type f -name base_replay_final.json -print -quit > input/baseline-final-path.txt
          test -s input/baseline-final-path.txt

      - name: Build lane-aware unattended cycle
        run: |
          mkdir -p out/plan
          previous_args=()
          if [ -s input/previous-ledger-path.txt ]; then
            previous_args=(--previous-ledger "$(cat input/previous-ledger-path.txt)")
          fi
          python backend/tools/strategy11_unattended_improvement_v2.py \
            --mode plan \
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \
            --baseline-final "$(cat input/baseline-final-path.txt)" \
            "${previous_args[@]}" \
            --out out/plan

      - name: Assert plan contract and expose state
        id: state
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('out/plan/plan.json').read_text())
          ledger=json.loads(Path('out/plan/search_ledger.json').read_text())
          coverage=json.loads(Path('out/plan/coverage.json').read_text())
          assert plan['state'] in {
              'PASS_UNATTENDED_IMPROVEMENT_PLAN',
              'COMPLETE_CUTOFF_NO_NEW_REPLAY',
              'COMPLETE_NO_SAFE_UNTESTED_AXIS',
          },plan
          assert plan['strategy_count_total']==25
          assert sum(plan['lane_counts'].values())==25
          assert plan['candidate_count']<=plan['active_strategy_count']*2
          for row in plan['rows']:
              assert row['lane'] in {
                  'A_ENTRY_LIVENESS_REPAIR','B_COVERAGE_EXPANSION',
                  'C_DISCOVERY_OPTIMIZATION','D_QUALITY_OPTIMIZATION'
              }
              assert 1<=len(row['candidate_ids'])<=2
              axes=[row['candidate_specs'][cid]['axis'] for cid in row['candidate_ids']]
              assert len(axes)==len(set(axes))
              if row['lane'] in {'A_ENTRY_LIVENESS_REPAIR','B_COVERAGE_EXPANSION'}:
                  assert not all(row['candidate_specs'][cid]['kind']=='GATE' for cid in row['candidate_ids'])
          assert coverage['gate_only_search'] is False
          for payload in (plan,ledger,coverage):
              assert payload['promotion_authority'] is False
              assert payload['protected_mutations']==0
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
              assert payload['runtime_bound'] is False
          active=plan['state']=='PASS_UNATTENDED_IMPROVEMENT_PLAN' and plan['candidate_count']>0
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"active={'true' if active else 'false'}\n")
              handle.write('active_strategies='+','.join(plan['active_strategy_ids'])+'\n')
              handle.write(f"cycle={plan['cycle_index']}\n")
          PY

      - name: Assert cutoff terminal behavior
        run: |
          python backend/tools/strategy11_unattended_improvement_v2.py \
            --mode plan \
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \
            --baseline-final "$(cat input/baseline-final-path.txt)" \
            --now-utc 2026-08-01T08:30:01Z \
            --out out/cutoff
          python - <<'PY'
          import json
          row=json.load(open('out/cutoff/plan.json'))
          assert row['state']=='COMPLETE_CUTOFF_NO_NEW_REPLAY'
          assert row['candidate_count']==0 and row['rows']==[]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s11-unattended-improvement-v2-plan-${{ github.run_id }}
          path: out/plan
          if-no-files-found: error
          retention-days: 90

  replay:
    name: Replay lane-aware candidates batch ${{ matrix.batch }}
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: '1'
            strategies: 'alpha_combo,anchor_vwap_trend,bb_revert,break_and_continue,ema_ribbon_scalp'
          - batch: '2'
            strategies: 'fvg_revert,grid_rebalance,keltner_trend,liquidity_sweep,mfi_rsi_div'
          - batch: '3'
            strategies: 'obv_trend,pivot_reversal,range_fade,rbreaker_like,rsi_swing_fail'
          - batch: '4'
            strategies: 'scalp_snap,session_bias,squeeze_break,sr_levels,supertrend_pullback'
          - batch: '5'
            strategies: 'trend_ma_macd,trend_rider,turtle_trend,vol_spike_fade,vwap_revert'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - uses: actions/download-artifact@v4
        with:
          name: s11-unattended-improvement-v2-plan-${{ github.run_id }}
          path: input/plan

      - uses: actions/download-artifact@v4
        with:
          name: s11-fresh-data-v1-30252022416-attempt-1
          path: input/fresh
          github-token: ${{ github.token }}
          run-id: 30252022416

      - name: Download immutable evidence batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/evidence
          for batch in 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "s11-evidence-batch-${batch}-${SOURCE_RUN_ID}-attempt-1" \
              --dir "input/evidence/batch-${batch}"
          done

      - name: Resolve active strategies in this batch
        id: select
        env:
          BATCH_STRATEGIES: ${{ matrix.strategies }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          active=set(json.loads(Path('input/plan/plan.json').read_text())['active_strategy_ids'])
          selected=[sid for sid in os.environ['BATCH_STRATEGIES'].split(',') if sid in active]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write('strategies='+','.join(selected)+'\n')
              handle.write(f"has_rows={'true' if selected else 'false'}\n")
          PY

      - name: Replay control plus lane-selected causal axes
        if: steps.select.outputs.has_rows == 'true'
        run: |
          mkdir -p out/batch-${{ matrix.batch }}
          python backend/tools/strategy11_unattended_improvement_replay_v2.py \
            --compute-root compute \
            --expected-strategies '${{ needs.plan.outputs.active_strategies }}' \
            --mode replay \
            --root compute \
            --plan input/plan/plan.json \
            --policy compute/backend/research/strategy11_multimodal_rescue_l090_v1.json \
            --fresh-root input/fresh \
            --evidence-root input/evidence \
            --strategy-ids '${{ steps.select.outputs.strategies }}' \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --out out/batch-${{ matrix.batch }}

      - name: Write empty batch marker
        if: steps.select.outputs.has_rows != 'true'
        run: |
          mkdir -p out/batch-${{ matrix.batch }}
          printf '%s\n' '{"state":"SKIP_NO_ACTIVE_STRATEGIES","rows":[]}' > out/batch-${{ matrix.batch }}/batch.json

      - name: Assert replay parity and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('out').rglob('summary.json'):
              row=json.loads(path.read_text())
              if row.get('version')!='STRATEGY11_UNATTENDED_IMPROVEMENT_REPLAY_V2':
                  continue
              assert 1<=len(row['tested_candidate_ids'])<=2
              assert len(row['variants'])==len(row['tested_candidate_ids'])+1
              for variant in row['variants']:
                  assert variant['parity']['state']=='PASS'
                  assert variant['parity']['duplicate_trade_count']==0
              assert row['promotion_authority'] is False
              assert row['execution_allowed'] is False
              assert row['order_authority']=='BLOCKED'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s11-unattended-improvement-v2-replay-${{ matrix.batch }}-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Classify lane outcomes and preserve improvement evidence
    needs: [plan, replay]
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check pandas numpy

      - uses: actions/download-artifact@v4
        with:
          name: s11-unattended-improvement-v2-plan-${{ github.run_id }}
          path: input/plan

      - uses: actions/download-artifact@v4
        with:
          pattern: s11-unattended-improvement-v2-replay-*-${{ github.run_id }}
          path: input/replays
          merge-multiple: true

      - name: Aggregate deterministic replay output
        run: |
          mkdir -p out/base out/state
          python backend/tools/strategy11_unattended_improvement_replay_v2.py \
            --compute-root compute \
            --expected-strategies '${{ needs.plan.outputs.active_strategies }}' \
            --mode aggregate \
            --replay-root input/replays \
            --out out/base

      - name: Classify A-D lane outcomes and advance ledger
        run: |
          python backend/tools/strategy11_unattended_improvement_v2.py \
            --mode update \
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \
            --plan input/plan/plan.json \
            --ledger input/plan/search_ledger.json \
            --replay-root input/replays \
            --out out/state
          cp input/plan/plan.json out/state/cycle_plan.json
          cp input/plan/coverage.json out/state/coverage_before_cycle.json
          cp out/base/final.json out/state/base_replay_final.json

      - name: Assert no promotion or runtime authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          final=json.loads(Path('out/state/final.json').read_text())
          ledger=json.loads(Path('out/state/search_ledger.json').read_text())
          assert final['state']=='PASS_UNATTENDED_IMPROVEMENT_CYCLE'
          assert final['missing_count']==0
          assert final['tested_count_this_cycle']>0
          for row in (final,ledger):
              assert row['promotion_authority'] is False
              assert row['protected_mutations']==0
              assert row['execution_allowed'] is False
              assert row['execution_authority']=='NONE'
              assert row['order_authority']=='BLOCKED'
              assert row['runtime_bound'] is False
          PY

      - name: Write run summary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          final=json.loads(Path('out/state/final.json').read_text())
          plan=json.loads(Path('out/state/cycle_plan.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# Lane-aware unattended improvement cycle\n\n')
              out.write(f"- Cycle: `{final['cycle_index']}`\n")
              out.write(f"- Lane census: `{plan['lane_counts']}`\n")
              out.write(f"- Tested: `{final['tested_count_this_cycle']}`\n")
              out.write(f"- Research survivors: `{final['research_survivor_count']}`\n")
              out.write(f"- Improved discovery holds: `{final['improved_hold_count']}`\n")
              out.write('- Authority: `RESEARCH_ONLY / ORDER_BLOCKED`\n\n')
              out.write('## Top improvement evidence\n')
              for row in final['top_improvement_candidates'][:10]:
                  out.write(
                      f"- `{row['strategy_id']}` / `{row['candidate_id']}` / `{row['status']}` "
                      f"trades=`{row['trade_count']}` net=`{row['net_return_pct_sum']}` "
                      f"PF=`{row['net_profit_factor']}` DD=`{row['max_drawdown_pct']}`\n"
                  )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s11-unattended-improvement-v2-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90

  terminal:
    name: Record cutoff or no safe untested axis
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.active != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s11-unattended-improvement-v2-plan-${{ github.run_id }}
          path: out/state
      - uses: actions/upload-artifact@v4
        with:
          name: s11-unattended-improvement-v2-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90
