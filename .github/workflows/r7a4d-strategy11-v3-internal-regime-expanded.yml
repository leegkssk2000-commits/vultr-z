name: R7A4D Strategy11 V3 Internal Regime Expanded Discovery

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/strategy11_*_v3.py'
      - 'backend/tools/strategy11_v3_*.py'
      - 'backend/research/strategy11_v3_policy.json'
      - '.github/workflows/r7a4d-strategy11-v3-internal-regime-expanded.yml'
  schedule:
    - cron: '47 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-v3-${{ github.event_name == 'pull_request' && github.ref || 'master-discovery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  COMPUTE_REF: r7a4d-strategy11-cause-aware-rotation-l090-v6
  SOURCE_RUN_ID: '30252022416'
  SEED_RUN_ID: '30516499556'

jobs:
  verify:
    name: Verify V3 modules and actual 25-strategy registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy pyyaml
      - name: Compile and run negative/positive fixture
        run: |
          python -m py_compile \
            backend/tools/strategy11_internal_condition_registry_v3.py \
            backend/tools/strategy11_bounded_internal_mutation_v3.py \
            backend/tools/strategy11_regime_edge_router_v3.py \
            backend/tools/strategy11_long_short_observer_v3.py \
            backend/tools/strategy11_expanded_discovery_v3.py \
            backend/tools/strategy11_v3_orchestrator.py \
            backend/tools/strategy11_v3_fixture.py
          python backend/tools/strategy11_v3_fixture.py
      - name: Build actual source-SHA-bound internal registry
        run: |
          mkdir -p out/verify
          python backend/tools/strategy11_internal_condition_registry_v3.py \
            --compute-root compute \
            --policy backend/research/strategy11_v3_policy.json \
            --out out/verify/internal_registry.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/verify/internal_registry.json').read_text())
          assert row['strategy_count']==25
          assert row['injectable_strategy_count']>=20
          assert row['protected_mutations']==0
          assert row['execution_allowed'] is False
          assert row['order_authority']=='BLOCKED'
          for item in row['rows']:
              assert item['canonical_mutated'] is False
              for field in item['safe_internal_fields']:
                  assert field['one_axis_only'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-verify-${{ github.run_id }}
          path: out/verify
          if-no-files-found: error
          retention-days: 30

  plan:
    name: Build V3 internal/regime plan
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      active: ${{ steps.state.outputs.active }}
      active_strategies: ${{ steps.state.outputs.active_strategies }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy pyyaml
      - name: Restore latest baseline and V3 ledger
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/previous input/baseline
          v3run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow r7a4d-strategy11-v3-internal-regime-expanded.yml --branch master --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$v3run" ]; then
            gh run download "$v3run" --repo "$GITHUB_REPOSITORY" --pattern 's11-v3-state-*' --dir input/previous || true
          fi
          v2run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow r7a4d-strategy11-unattended-improvement-v2-1.yml --branch master --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$v2run" ]; then
            gh run download "$v2run" --repo "$GITHUB_REPOSITORY" --pattern 's11-unattended-improvement-v2-1-state-*' --dir input/baseline || true
          fi
          if ! find input/baseline -name base_replay_final.json -print -quit | grep -q .; then
            gh run download "$SEED_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 's11-unattended-improvement-v2*-state-*' --dir input/baseline
          fi
          find input/baseline -name base_replay_final.json -print -quit > input/baseline-path.txt
          find input/previous -name search_ledger.json -print -quit > input/ledger-path.txt || true
          test -s input/baseline-path.txt
      - name: Build registry and plan
        run: |
          mkdir -p out/plan
          python backend/tools/strategy11_internal_condition_registry_v3.py --compute-root compute --policy backend/research/strategy11_v3_policy.json --out out/plan/internal_registry.json
          previous=()
          if [ -s input/ledger-path.txt ]; then previous=(--previous-ledger "$(cat input/ledger-path.txt)"); fi
          python backend/tools/strategy11_v3_orchestrator.py \
            --registry out/plan/internal_registry.json \
            --baseline "$(cat input/baseline-path.txt)" \
            --policy backend/research/strategy11_v3_policy.json \
            "${previous[@]}" --out out/plan
      - name: Assert plan contract
        id: state
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('out/plan/plan.json').read_text())
          assert plan['strategy_count_total']==25
          assert 'alpha_combo' not in plan['active_strategy_ids']
          assert plan['alpha_special_route']=='ALPHA_W1_MULTIOBJECTIVE_CONFIRMATION'
          assert plan['candidate_count']<=plan['active_strategy_count']*2
          for row in plan['rows']:
              axes=[row['candidate_specs'][cid]['axis'] for cid in row['candidate_ids']]
              assert len(axes)==len(set(axes))
              assert all(row['candidate_specs'][cid]['one_axis_only'] for cid in row['candidate_ids'])
          for payload in (plan,json.loads(Path('out/plan/search_ledger.json').read_text())):
              assert payload['promotion_authority'] is False
              assert payload['protected_mutations']==0
              assert payload['execution_allowed'] is False
              assert payload['order_authority']=='BLOCKED'
          active=plan['state']=='PASS_V3_PLAN' and plan['candidate_count']>0
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"active={'true' if active else 'false'}\n")
              handle.write('active_strategies='+','.join(plan['active_strategy_ids'])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-plan-${{ github.run_id }}
          path: out/plan
          if-no-files-found: error
          retention-days: 90

  archive:
    name: Prepare 12-window expanded discovery archive
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/cache@v4
        id: archive-cache
        with:
          path: out/archive
          key: s11-v3-archive-${{ hashFiles('backend/research/strategy11_v3_policy.json') }}
      - name: Fetch exact non-overlap archive on cache miss
        if: steps.archive-cache.outputs.cache-hit != 'true'
        run: |
          python backend/tools/strategy11_expanded_discovery_v3.py prepare --compute-root compute --policy backend/research/strategy11_v3_policy.json --out out/archive
      - name: Verify archive contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/archive/manifest.json').read_text())
          assert row['state']=='PASS_EXPANDED_ARCHIVE'
          assert row['window_count']==12 and row['symbol_count']==5
          assert row['evaluation_symbol_bars']==54000
          assert row['evaluation_periods_non_overlapping'] is True
          assert len(row['rows'])==60 and all(item['state']=='PASS' for item in row['rows'])
          assert row['execution_allowed'] is False and row['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-archive-${{ github.run_id }}
          path: out/archive
          if-no-files-found: error
          retention-days: 30

  replay:
    name: Replay V3 discovery batch ${{ matrix.batch }}
    if: github.event_name != 'pull_request' && needs.plan.outputs.active == 'true'
    needs: [plan, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: '1'
            strategies: 'anchor_vwap_trend,bb_revert,break_and_continue,ema_ribbon_scalp'
          - batch: '2'
            strategies: 'fvg_revert,grid_rebalance,keltner_trend,liquidity_sweep,mfi_rsi_div'
          - batch: '3'
            strategies: 'obv_trend,pivot_reversal,range_fade,rbreaker_like,rsi_swing_fail'
          - batch: '4'
            strategies: 'scalp_snap,session_bias,squeeze_break,sr_levels,supertrend_pullback'
          - batch: '5'
            strategies: 'trend_ma_macd,trend_rider,turtle_trend,vol_spike_fade,vwap_revert'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with: {name: 's11-v3-plan-${{ github.run_id }}', path: input/plan}
      - uses: actions/download-artifact@v4
        with: {name: 's11-v3-archive-${{ github.run_id }}', path: input/archive}
      - name: Download immutable evidence batches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/evidence
          for batch in 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "s11-evidence-batch-${batch}-${SOURCE_RUN_ID}-attempt-1" --dir "input/evidence/batch-${batch}"
          done
      - name: Resolve active strategies
        id: select
        env: {BATCH_STRATEGIES: '${{ matrix.strategies }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          active=set(json.loads(Path('input/plan/plan.json').read_text())['active_strategy_ids'])
          selected=[sid for sid in os.environ['BATCH_STRATEGIES'].split(',') if sid in active]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write('strategies='+','.join(selected)+'\n')
              handle.write(f"has_rows={'true' if selected else 'false'}\n")
          PY
      - name: Replay internal/regime candidates
        if: steps.select.outputs.has_rows == 'true'
        run: |
          mkdir -p out/batch-${{ matrix.batch }}
          python backend/tools/strategy11_expanded_discovery_v3.py replay \
            --compute-root compute --archive-root input/archive --evidence-root input/evidence \
            --plan input/plan/plan.json --registry input/plan/internal_registry.json \
            --policy backend/research/strategy11_v3_policy.json \
            --strategy-ids '${{ steps.select.outputs.strategies }}' \
            --out out/batch-${{ matrix.batch }}
      - name: Write empty batch
        if: steps.select.outputs.has_rows != 'true'
        run: |
          mkdir -p out/batch-${{ matrix.batch }}
          printf '%s\n' '{"state":"SKIP_NO_ACTIVE_STRATEGIES","rows":[]}' > out/batch-${{ matrix.batch }}/batch.json
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-replay-${{ matrix.batch }}-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Audit V3 organic chain and preserve candidates
    if: github.event_name != 'pull_request' && needs.plan.outputs.active == 'true'
    needs: [plan, archive, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with: {name: 's11-v3-plan-${{ github.run_id }}', path: input/plan}
      - uses: actions/download-artifact@v4
        with:
          pattern: s11-v3-replay-*-${{ github.run_id }}
          path: input/replays
          merge-multiple: true
      - name: Aggregate and audit all handoffs
        run: |
          mkdir -p out/state
          python backend/tools/strategy11_expanded_discovery_v3.py aggregate \
            --batch-root input/replays --plan input/plan/plan.json \
            --policy backend/research/strategy11_v3_policy.json --out out/state/final.json
          cp input/plan/plan.json out/state/cycle_plan.json
          cp input/plan/internal_registry.json out/state/internal_registry.json
          cp input/plan/search_ledger.json out/state/search_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/state/final.json').read_text())
          assert row['state']=='PASS_V3_ORGANIC_AUDIT'
          assert row['blockers']==[]
          assert row['fresh_confirmation_required'] is True
          assert row['w1_w2_w3_new_sealed_required'] is True
          assert row['promotion_authority'] is False
          assert row['execution_allowed'] is False
          assert row['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90
