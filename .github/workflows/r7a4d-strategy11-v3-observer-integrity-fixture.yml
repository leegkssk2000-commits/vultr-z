name: R7A4D Strategy11 V3 Observer Integrity Fixture

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/strategy11_long_short_observer_v3.py'
      - 'backend/tools/strategy11_expanded_discovery_v3.py'
      - 'backend/tools/strategy11_v3_observer_integrity_fixture.py'
      - '.github/workflows/r7a4d-strategy11-v3-observer-integrity-fixture.yml'
  push:
    branches: [master]
    paths:
      - 'backend/tools/strategy11_long_short_observer_v3.py'
      - 'backend/tools/strategy11_expanded_discovery_v3.py'
      - 'backend/tools/strategy11_v3_observer_integrity_fixture.py'
      - '.github/workflows/r7a4d-strategy11-v3-observer-integrity-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: |
          python -m py_compile \
            backend/tools/strategy11_long_short_observer_v3.py \
            backend/tools/strategy11_expanded_discovery_v3.py \
            backend/tools/strategy11_v3_observer_integrity_fixture.py
          python backend/tools/strategy11_v3_observer_integrity_fixture.py
          python - <<'PY'
          from backend.tools.strategy11_expanded_discovery_v3 import SAFETY
          assert SAFETY['promotion_authority'] is False
          assert SAFETY['execution_allowed'] is False
          assert SAFETY['order_authority']=='BLOCKED'
          assert SAFETY['runtime_bound'] is False
          PY
