name: R7A4D Strategy11 V3 Survivor W1 Overlay V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/strategy11_v3_survivor_w1_overlay_v1.json'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py'
      - '.github/workflows/r7a4d-strategy11-v3-survivor-w1-overlay-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/strategy11_v3_survivor_w1_overlay_v1.json'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py'
      - '.github/workflows/r7a4d-strategy11-v3-survivor-w1-overlay-v2.yml'
  schedule:
    - cron: '49 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-v3-survivor-w1-overlay-v2
  cancel-in-progress: false

env:
  COMPUTE_REF: r7a4d-strategy11-cause-aware-rotation-l090-v6
  NATIVE_ARTIFACT: s11-w1-native-completion-20260801t083000z-v1
  OVERLAY_ARTIFACT: s11-v3-survivor-w1-overlay-completion-20260801t083000z-v1

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile overlay and verify bounded config fixture
        run: |
          python -m py_compile \
            backend/tools/strategy11_v3_survivor_w1_overlay_v1.py \
            backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py \
            backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py
          python backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py
      - name: Resolve upstream and overlay one-shot receipts
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          native_name=os.environ['NATIVE_ARTIFACT']
          overlay_name=os.environ['OVERLAY_ARTIFACT']
          def artifacts(name):
              raw=subprocess.check_output([
                  'gh','api','--method','GET',f'repos/{repo}/actions/artifacts',
                  '-f',f'name={name}','-f','per_page=100'
              ],text=True)
              rows=json.loads(raw).get('artifacts',[])
              return sorted([row for row in rows if not row.get('expired')],key=lambda row:str(row.get('created_at') or ''),reverse=True)
          completed=artifacts(overlay_name)
          native=artifacts(native_name)
          if completed:
              state,ready,native_run_id,next_step='ALREADY_COMPLETED',False,None,'NO_DUPLICATE_REPLAY'
          elif not native:
              state,ready,native_run_id,next_step='WAIT_UPSTREAM',False,None,'WAIT_NATIVE_W1_COMPLETION_RECEIPT'
          else:
              state,ready,native_run_id,next_step='READY_TO_EXECUTE',True,int(native[0]['workflow_run']['id']),'EXECUTE_EXACT_SHA_OVERLAY'
          status={
              'schema_version':'1.0','version':'R7A4D_STRATEGY11_V3_SURVIVOR_W1_OVERLAY_GATE_V2',
              'state':state,'blockers':[],'native_completion_artifact':native_name,
              'overlay_completion_artifact':overlay_name,'native_run_id':native_run_id,'next':next_step,
              'research_only':True,'promotion_authority':False,'canonical_mutated':False,
              'registry_mutated':False,'protected_mutations':0,'execution_allowed':False,
              'execution_authority':'NONE','order_authority':'BLOCKED','runtime_bound':False,
              'native_w1_chain_modified':False,
          }
          Path('out/status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
              handle.write(f"native_run_id={native_run_id or ''}\n")
          print(json.dumps(status,sort_keys=True))
          PY
      - name: Restore exact V3 survivor evidence
        uses: actions/download-artifact@v4
        with:
          name: final-v3-trend_ma_macd-30588354565
          path: input/discovery
          github-token: ${{ github.token }}
          run-id: 30588354565
      - name: Restore source-bound trend_ma_macd evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/evidence
          gh run download 30252022416 --repo "$GITHUB_REPOSITORY" \
            --name s11-evidence-batch-5-30252022416-attempt-1 \
            --dir input/evidence
      - name: Verify V3 survivor canonical source and original gate authority
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          contract=json.loads(Path('backend/research/strategy11_v3_survivor_w1_overlay_v1.json').read_text())
          result_paths=list(Path('input/discovery').rglob('result.json'))
          assert len(result_paths)==1,result_paths
          result=json.loads(result_paths[0].read_text())
          assert result['strategy_id']=='trend_ma_macd'
          matches=[row for row in result['variants'] if row['variant_id']=='INT3_MAX_CHASE_DIST_ATR_RELAX']
          assert len(matches)==1
          row=matches[0]
          assert row['research_state']=='DISCOVERY_PASS_INTERNAL_OR_REGIME'
          assert row['candidate_spec_sha256']==contract['candidate']['candidate_spec_sha256']
          assert row['candidate_spec']['field']=='max_chase_dist_atr'
          assert row['candidate_spec']['base_value']==1.6 and row['candidate_spec']['mutation_value']==1.84
          registry=json.loads(Path('compute/backend/strategy25/canonical_strategy_registry_v1.json').read_text())
          entry=next(item for item in registry['entries'] if item['strategy_id']=='trend_ma_macd')
          source=Path('compute')/entry['canonical_engine']['implementation_path']
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual==entry['canonical_engine']['source_sha256']==result['source_sha256']
          summaries=[path for path in Path('input/evidence').rglob('summary.json') if path.parent.name=='trend_ma_macd']
          assert len(summaries)==1,summaries
          summary=json.loads(summaries[0].read_text())
          assert summary['strategy_id']=='trend_ma_macd'
          assert summary['symbols']==['BTCUSDT','SOLUSDT']
          assert summary['candidate']['gate']['gate_id']=='TF_EMA'
          assert summary['candidate']['gate']['required']==['trend_ema20_50']
          assert summary['candidate']['gate']['forbidden']==[]
          assert summary.get('surgery') is None
          PY
      - name: Download exact native W1 completion artifact
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/native
          gh run download "${{ steps.gate.outputs.native_run_id }}" --repo "$GITHUB_REPOSITORY" --name "$NATIVE_ARTIFACT" --dir input/native
      - name: Execute exact-SHA W1 survivor overlay
        if: steps.gate.outputs.ready == 'true'
        env:
          PYTHONPATH: compute
        run: |
          rm -rf out
          mkdir -p out
          python backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py \
            --contract backend/research/strategy11_v3_survivor_w1_overlay_v1.json \
            --native-root input/native --compute-root compute --evidence-root input/evidence \
            --discovery-root input/discovery --out out
      - name: Assert fail-closed terminal state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/status.json').read_text())
          assert row['state'] in {'WAIT_UPSTREAM','ALREADY_COMPLETED','HOLD_W1_LOW_SAMPLE','REJECT_W1_V3_SURVIVOR','PASS_W1_V3_SURVIVOR_CONFIRMATION'},row
          assert row.get('blockers',[])==[] or row['state'] in {'HOLD_W1_LOW_SAMPLE','REJECT_W1_V3_SURVIVOR'}
          for key,value in {
              'promotion_authority':False,'canonical_mutated':False,'registry_mutated':False,
              'protected_mutations':0,'execution_allowed':False,'execution_authority':'NONE',
              'order_authority':'BLOCKED','runtime_bound':False,'native_w1_chain_modified':False,
          }.items():
              assert row[key]==value,(key,row.get(key),value)
          if row['state'] not in {'WAIT_UPSTREAM','ALREADY_COMPLETED'}:
              assert row['source_w1_manifest_sha256'] and row['a_b_parity']=='PASS' and row['duplicate_trade_count']==0
          PY
      - name: Upload one-shot overlay completion receipt
        if: steps.gate.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: s11-v3-survivor-w1-overlay-completion-20260801t083000z-v1
          path: out
          if-no-files-found: error
          retention-days: 90
      - name: Upload overlay diagnostic state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-v3-survivor-w1-overlay-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
