name: R7A4D Strategy11 V3 Survivor W1 Overlay V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/strategy11_v3_survivor_w1_overlay_v1.json'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py'
      - '.github/workflows/r7a4d-strategy11-v3-survivor-w1-overlay-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/strategy11_v3_survivor_w1_overlay_v1.json'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py'
      - 'backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py'
      - '.github/workflows/r7a4d-strategy11-v3-survivor-w1-overlay-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7a4d-strategy11-v3-survivor-w1-overlay-v2-diagnostic
  cancel-in-progress: false

env:
  COMPUTE_SHA: 1dadb1f6a28662823058a58fdeaa978fcd104b7b

jobs:
  diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_SHA }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Verify exact compute SHA and fixture only
        run: |
          test "$(git -C compute rev-parse HEAD)" = "$COMPUTE_SHA"
          python -m py_compile \
            backend/tools/strategy11_v3_survivor_w1_overlay_v1.py \
            backend/tools/strategy11_v3_survivor_w1_overlay_runner_v1.py \
            backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py
          python backend/tools/strategy11_v3_survivor_w1_overlay_fixture_v1.py
      - name: Emit explicit no-execution receipt
        run: |
          mkdir -p out
          python - <<'PY'
          import json,os
          from pathlib import Path
          row={
            'schema_version':'1.2',
            'version':'R7A4D_STRATEGY11_V3_SURVIVOR_W1_OVERLAY_V2_DIAGNOSTIC_ONLY',
            'state':'PASS_DIAGNOSTIC_ONLY_SHA_PINNED',
            'execution_skipped':True,
            'compute_sha':os.environ['COMPUTE_SHA'],
            'next':'USE_ZEL_W1_CONTROL_PLANE_V1_FOR_NATIVE_EMA_V3_ORDER',
            'blockers':[],
            'research_only':True,
            'promotion_authority':False,
            'canonical_mutated':False,
            'registry_mutated':False,
            'protected_mutations':0,
            'execution_allowed':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'runtime_bound':False,
            'native_w1_chain_modified':False,
          }
          Path('out/status.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-v3-survivor-w1-overlay-v2-diagnostic-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
