name: R7A4D Strategy11 W1 Native EMA Bind V1

on:
  pull_request:
    branches:
      - master
    paths:
      - backend/tools/strategy11_w1_one_shot_gate_v1.py
      - backend/research/strategy11_w1_native_ema_bind_v1.json
      - .github/workflows/r7a4d-strategy11-w1-native-ema-bind-v1.yml
  push:
    branches:
      - master
    paths:
      - backend/tools/strategy11_w1_one_shot_gate_v1.py
      - backend/research/strategy11_w1_native_ema_bind_v1.json
      - .github/workflows/r7a4d-strategy11-w1-native-ema-bind-v1.yml
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7a4d-strategy11-w1-native-ema-bind-v1
  cancel-in-progress: false

jobs:
  bind:
    name: Bind EMA once to completed native shared-W1 chain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve clock upstream and one-shot receipt gate
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          PYTHONPATH=control python control/backend/tools/strategy11_w1_one_shot_gate_v1.py \
            --mode ema \
            --contract control/backend/research/strategy11_w1_native_ema_bind_v1.json \
            --out out/status.json

      - name: Download upstream native W1 completion artifact
        if: steps.upstream.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.upstream.outputs.artifact_name }}
          path: upstream
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upstream.outputs.run_id }}

      - name: Checkout exact EMA PRIMARY W1 authority
        if: steps.upstream.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: r7a4d-strategy11-ema-primary-w1-causal-replay-v1
          path: ema
          persist-credentials: false

      - name: Verify exact EMA head and upstream state
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path('control/backend/research/strategy11_w1_native_ema_bind_v1.json').read_text())
          assert subprocess.check_output(['git','-C','ema','rev-parse','HEAD'],text=True).strip()==c['ema_head_sha']
          upstream=json.loads(Path('upstream/native-out/status.json').read_text())
          source=json.loads(Path('upstream/shared-w1/status.json').read_text())
          assert upstream['state']=='PASS_W1_NATIVE_PRIMARY_CHAIN', upstream
          assert upstream['one_shot_completed'] is True
          assert source['state']=='PASS' and source['blockers']==[], source
          assert upstream['source_w1_manifest_sha256']==source['W1_manifest_sha256']
          PY

      - name: Install and compile EMA runner
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check pandas numpy
          PYTHONPATH=ema python -m py_compile ema/backend/tools/r7a4d_strategy11_ema_primary_w1_causal_replay_v1.py

      - name: Download EMA baseline and causal authority
        if: steps.upstream.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s11-evidence-batch-1-30252022416-attempt-1
          path: inputs/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30252022416'

      - name: Download EMA repair V2 authority
        if: steps.upstream.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s11-ema-repair-v2-30282056363-attempt-1
          path: inputs/ema-authority
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30282056363'

      - name: Execute EMA on identical shared W1 artifact
        if: steps.upstream.outputs.ready == 'true'
        env:
          PYTHONPATH: ema
        run: |
          python ema/backend/tools/r7a4d_strategy11_ema_primary_w1_causal_replay_v1.py \
            --root ema \
            --source-root upstream/shared-w1 \
            --baseline-summary inputs/evidence/ema_ribbon_scalp/summary.json \
            --ema-authority-root inputs/ema-authority \
            --policy ema/backend/research/ema_primary_w1_causal_replay_v1.json \
            --out primary/ema \
            --source-run-id '${{ steps.upstream.outputs.run_id }}' \
            --source-head-sha '${{ steps.upstream.outputs.head_sha }}'

      - name: Assert shared SHA and finalize EMA-bound chain
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          upstream=json.loads(Path('upstream/native-out/status.json').read_text())
          source=json.loads(Path('upstream/shared-w1/status.json').read_text())
          ema=json.loads(Path('primary/ema/status.json').read_text())
          manifest_sha=source['W1_manifest_sha256']
          assert upstream['source_w1_manifest_sha256']==manifest_sha
          assert ema['source_w1_manifest_sha256']==manifest_sha
          assert ema['source_w1_run_id']==str(upstream['source_w1_run_id'])
          for row in (source,upstream,ema):
              assert row['canonical_mutated'] is False and row['registry_mutated'] is False
              assert row['protected_mutations']==0 and row['execution_allowed'] is False
          final={
              'schema_version':'1.1',
              'version':'R7A4D_STRATEGY11_W1_NATIVE_EMA_BIND_V1_HARDENED',
              'state':'PASS_W1_NATIVE_PRIMARY_CHAIN_WITH_EMA',
              'blockers':[],
              'source_w1_run_id':str(upstream['source_w1_run_id']),
              'source_w1_head_sha':upstream['source_w1_head_sha'],
              'source_w1_manifest_sha256':manifest_sha,
              'data_wait_pool_state':upstream['data_wait_pool_state'],
              'alpha_state':upstream['alpha_state'],
              'turtle_state':upstream['turtle_state'],
              'ema_state':ema['state'],
              'ema_active_candidate_queue':ema.get('active_candidate_queue',[]),
              'next':'W1_NEW_SEALED_HOLDBACK_GENERATOR',
              'completion_artifact_name':'s11-w1-native-ema-completion-20260801t083000z-v1',
              'one_shot_completed':True,
              'research_only':True,
              'promotion_authority':False,
              'sealed_holdback_read':False,
              'canonical_mutated':False,
              'registry_mutated':False,
              'protected_mutations':0,
              'execution_allowed':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'runtime_bound':False,
          }
          Path('out/status.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          Path('out/lineage.json').write_text(json.dumps({
              'shared_w1_manifest_sha256':manifest_sha,
              'upstream_native_status_sha256':hashlib.sha256(Path('upstream/native-out/status.json').read_bytes()).hexdigest(),
              'ema_status_sha256':hashlib.sha256(Path('primary/ema/status.json').read_bytes()).hexdigest(),
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Assert fail-closed contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/status.json').read_text())
          assert row['state'] in {'WAIT_DATA','WAIT_UPSTREAM','ALREADY_COMPLETED','PASS_W1_NATIVE_PRIMARY_CHAIN_WITH_EMA'}, row
          assert row['blockers']==[] and row['promotion_authority'] is False
          assert row['canonical_mutated'] is False and row['registry_mutated'] is False
          assert row['protected_mutations']==0 and row['execution_allowed'] is False
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED'
          assert row['runtime_bound'] is False
          PY

      - name: Write GitHub summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads(Path('out/status.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# Strategy11 hardened EMA shared-W1 bind\n\n')
              out.write(f"- State: **{row['state']}**\n")
              out.write(f"- Next: `{row['next']}`\n")
              if row['state']=='WAIT_UPSTREAM':
                  out.write('- Native W1 completion receipt not present; no failure and no replay.\n')
              elif row['state']=='ALREADY_COMPLETED':
                  out.write('- Existing EMA completion receipt found; replay skipped.\n')
          PY

      - name: Upload immutable EMA completion receipt
        uses: actions/upload-artifact@v4
        if: steps.upstream.outputs.ready == 'true' && success()
        with:
          name: s11-w1-native-ema-completion-20260801t083000z-v1
          path: |
            out
            primary/ema
          if-no-files-found: error
          retention-days: 90

      - name: Upload EMA bind diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-w1-native-ema-bind-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            out
            primary/ema
          if-no-files-found: warn
          retention-days: 90
