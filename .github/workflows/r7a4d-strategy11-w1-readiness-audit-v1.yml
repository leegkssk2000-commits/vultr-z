name: R7A4D Strategy11 W1 Readiness Audit V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/r7a4d_strategy11_w1_readiness_audit_v1.py
      - .github/workflows/r7a4d-strategy11-w1-readiness-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false

      - name: Checkout master control plane
        uses: actions/checkout@v4
        with:
          ref: master
          path: master
          persist-credentials: false

      - name: Checkout DATA_WAIT_POOL compute authority
        uses: actions/checkout@v4
        with:
          ref: r7a4d-strategy11-data-wait-pool-compute-v1
          path: pool22
          persist-credentials: false

      - name: Checkout alpha multiobjective authority
        uses: actions/checkout@v4
        with:
          ref: r7a4d-strategy11-alpha-multiobjective-auto-v1-clean
          path: alpha
          persist-credentials: false

      - name: Checkout append-only data stream
        uses: actions/checkout@v4
        with:
          ref: strategy11-data-stream-v1
          path: stream
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile audit
        run: python -m py_compile audit/backend/tools/r7a4d_strategy11_w1_readiness_audit_v1.py

      - name: Run full W1 readiness audit
        run: |
          python audit/backend/tools/r7a4d_strategy11_w1_readiness_audit_v1.py \
            --master master \
            --pool22 pool22 \
            --alpha alpha \
            --stream stream \
            --out out

      - name: Assert fail-closed contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/summary.json'))
          assert d['state'] in {'PASS_W1_READINESS_AUDIT_IMPLEMENTATION_REQUIRED','PASS_W1_READINESS_COMPLETE'}
          assert d['canonical_mutated'] is False
          assert d['registry_mutated'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          assert d['stream']['state']=='PASS'
          assert d['stream']['blockers']==[]
          PY

      - name: Write audit summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('out/summary.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as f:
              f.write('# Strategy11 W1 readiness audit\n\n')
              f.write(f"- State: **{d['state']}**\n")
              f.write(f"- Stream: `{d['stream']['available_non_overlap_bars']}/480`\n")
              f.write(f"- Missing: `{d['missing_capabilities']}`\n")
              f.write(f"- Next: `{d['next']}`\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-w1-readiness-audit-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 90
