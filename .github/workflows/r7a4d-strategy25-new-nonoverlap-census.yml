name: R7A4D Strategy25 New Nonoverlap Census

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Compile census stack
        run: |
          PYTHONPATH=. python -m py_compile backend/strategy25/indicator_contract_repair_adapter_v2.py
          PYTHONPATH=. python -m py_compile backend/strategy25/indicator_contract_repair_loader_v2.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy25_new_nonoverlap_baseline_census.py
      - name: Run new nonoverlap census
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python backend/tools/r7a4d_strategy25_new_nonoverlap_baseline_census.py --root . 2>&1 | tee strategy25_new_nonoverlap_census.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > strategy25_new_nonoverlap_census.rc
          exit 0
      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy25-new-nonoverlap-census-v1
          path: |
            artifacts/strategy25_new_nonoverlap_baseline_census_v1/summary.json
            strategy25_new_nonoverlap_census.log
            strategy25_new_nonoverlap_census.rc
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce census integrity
        run: test "$(cat strategy25_new_nonoverlap_census.rc)" = "0"
