name: R7A4D Strategy25 Runtime Owner Contract Audit

on:
  push:
    branches:
      - r7a4d-strategy25-runtime-contract-census-surgery-v2
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Compile audit and repair loaders
        run: |
          PYTHONPATH=. python -m py_compile backend/strategy25/indicator_contract_repair_adapter_v2.py
          PYTHONPATH=. python -m py_compile backend/strategy25/indicator_contract_repair_loader_v2.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy25_runtime_owner_contract_audit.py
      - name: Run owner and contract audit
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python backend/tools/r7a4d_strategy25_runtime_owner_contract_audit.py --root . 2>&1 | tee runtime_owner_contract_audit.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > runtime_owner_contract_audit.rc
          exit 0
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy25-runtime-owner-contract-audit-v1
          path: |
            artifacts/strategy25_runtime_owner_contract_audit_v1/summary.json
            runtime_owner_contract_audit.log
            runtime_owner_contract_audit.rc
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce audit integrity
        run: test "$(cat runtime_owner_contract_audit.rc)" = "0"
