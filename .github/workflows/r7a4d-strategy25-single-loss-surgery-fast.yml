name: R7A4D Strategy25 Single Loss Surgery Fast

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/tools/r7a4d_strategy25_selected_single_loss_surgery.py'
      - 'backend/tools/r7a4d_strategy25_selected_single_loss_surgery_v2.py'
      - 'backend/strategy25/strategy25_new_nonoverlap_census_selection_v1.json'
      - 'backend/strategies/vol_spike_fade.py'
      - '.github/workflows/r7a4d-strategy25-single-loss-surgery-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surgery-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Compile surgery stack
        run: |
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy25_selected_single_loss_surgery.py
          PYTHONPATH=. python -m py_compile backend/tools/r7a4d_strategy25_selected_single_loss_surgery_v2.py
      - name: Run corrected one-cause full replay
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python backend/tools/r7a4d_strategy25_selected_single_loss_surgery_v2.py \
            --root . \
            --census-summary backend/strategy25/strategy25_new_nonoverlap_census_selection_v1.json \
            2>&1 | tee selected_single_loss_surgery_v2.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > selected_single_loss_surgery_v2.rc
          exit 0
      - name: Upload corrected surgery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy25-selected-single-loss-surgery-v2-fast
          path: |
            backend/strategy25/strategy25_new_nonoverlap_census_selection_v1.json
            artifacts/strategy25_selected_single_loss_surgery_v2/summary.json
            selected_single_loss_surgery_v2.log
            selected_single_loss_surgery_v2.rc
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce surgery integrity
        run: test "$(cat selected_single_loss_surgery_v2.rc)" = "0"
