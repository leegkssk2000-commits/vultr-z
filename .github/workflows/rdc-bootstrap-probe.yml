name: RDC Bootstrap Probe

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rdc-bootstrap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ALL_SECRETS: ${{ toJSON(secrets) }}
      ALL_VARS: ${{ toJSON(vars) }}
    steps:
      - name: Probe available credential names only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          secrets = json.loads(os.environ.get('ALL_SECRETS') or '{}')
          vars_ = json.loads(os.environ.get('ALL_VARS') or '{}')
          print('SECRET_KEYS=' + ','.join(sorted(secrets)))
          print('VAR_KEYS=' + ','.join(sorted(vars_)))
          hints = ('SSH','VPS','VULTR','SERVER','HOST','IP','KEY','TAILSCALE','DEPLOY')
          print('REMOTE_SECRET_KEYS=' + ','.join(k for k in sorted(secrets) if any(h in k.upper() for h in hints)))
          print('REMOTE_VAR_KEYS=' + ','.join(k for k in sorted(vars_) if any(h in k.upper() for h in hints)))
          PY
