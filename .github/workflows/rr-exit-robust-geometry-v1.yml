name: RR Exit Robust Geometry V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/prep/rr_exit_robust_geometry_v1.py'
      - '.github/workflows/rr-exit-robust-geometry-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/prep/rr_exit_robust_geometry_v1.py'
      - '.github/workflows/rr-exit-robust-geometry-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: a1-global-heavy-economic-evaluator-v1
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile backend/research/prep/rr_exit_robust_geometry_v1.py
          python -m backend.research.prep.rr_exit_robust_geometry_v1 --self-test
      - name: Download frozen development sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/trend70 out/a4 out/break
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9446790894/zip > out/trend70.zip
          unzip -q out/trend70.zip -d out/trend70
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9614562185/zip > out/a4.zip
          unzip -q out/a4.zip -d out/a4
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9603011773/zip > out/break.zip
          unzip -q out/break.zip -d out/break
      - name: Search development-only empirical RR geometry
        run: |
          set -euo pipefail
          python -m backend.research.prep.rr_exit_robust_geometry_v1 \
            --trend70-source out/trend70/a1_exact25_drain_6_receipt.json \
            --a4-source-dir out/a4 \
            --break-source-dir out/break \
            --out out/rr_exit_robust_geometry_v1.json
          python - <<'PY'
          import json
          r=json.load(open('out/rr_exit_robust_geometry_v1.json'))
          assert r['parent_T']==30
          assert r['old_fixed_cells_retested'] is False
          assert r['fresh_outcome_used_for_search'] is False
          assert r['g5_W2_W3_used_for_search'] is False
          assert r['sealed_holdout_used_for_search'] is False
          assert r['entry_logic_frozen'] is True
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED'
          print(json.dumps({'state':r['state'],'selected':r['selected'],'plateau':r['plateau'],'validation_positive':r['validation_positive'],'robust':r['robust_candidate_ready'],'receipt':r['receipt_sha256']},sort_keys=True))
          PY
      - name: Persist latest on master
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          target=backend/research/prep/rr_exit_robust_geometry_latest.json
          cp out/rr_exit_robust_geometry_v1.json "$target"
          git config user.name 'rr-exit-robust-geometry'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: persist robust RR geometry receipt [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rr-exit-robust-geometry-${{ github.run_id }}
          path: out/rr_exit_robust_geometry_v1.json
          if-no-files-found: error
          retention-days: 90
