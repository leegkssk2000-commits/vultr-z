name: Scalp7 broad V2 saved verification
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'tests/test_scalp7_*.py'
      - 'tests/fixtures/scalp7_*/**'
      - 'scripts/verify_scalp7_clock_freezes_v3.py'
      - 'research/campaigns/scalp7_20260915/**'
      - '.github/workflows/scalp7-broad-v2-saved-verify.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'tests/test_scalp7_*.py'
      - 'tests/fixtures/scalp7_*/**'
      - 'scripts/verify_scalp7_clock_freezes_v3.py'
      - 'research/campaigns/scalp7_20260915/**'
      - '.github/workflows/scalp7-broad-v2-saved-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scalp7-broad-v2-code-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  saved-and-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 websockets==15.0.1 requests==2.32.5
      - name: Causal contracts and implementation fixtures
        run: python -m pytest -q tests/test_scalp7_*.py
      - name: Verify saved frozen Scalp7 evidence without economic replay
        run: python -m backend.research.rebuild.scalp7_campaign_binding_repair_v2 verify
      - name: Independently reconcile saved trade arithmetic
        run: python research/campaigns/scalp7_20260915/broad_v2/verify_saved_results_v2.py --repo "$PWD"
      - name: Verify separate source-clock freezes and original evidence
        run: python scripts/verify_scalp7_clock_freezes_v3.py
      - name: Preserve historical Exact25 source
        run: python scripts/verify_frozen_exact25_source_v1.py
