name: Scalp7 broad V2 saved verification
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'tests/test_scalp7_*.py'
      - 'research/campaigns/scalp7_20260915/**'
      - '.github/workflows/scalp7-broad-v2-saved-verify.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'tests/test_scalp7_*.py'
      - 'research/campaigns/scalp7_20260915/**'
      - '.github/workflows/scalp7-broad-v2-saved-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scalp7-broad-v2-code-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  saved-and-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 pytest==8.3.5 requests==2.32.3
      - name: Causal contracts and synthetic-only unit fixtures
        run: python -m pytest -q tests/test_scalp7_*.py
      - name: Verify saved frozen Scalp7 evidence without economic replay
        run: python -m backend.research.rebuild.scalp7_campaign_binding_repair_v2 verify
      - name: Preserve historical Exact25 source
        run: python scripts/verify_frozen_exact25_source_v1.py
