name: Scalp7 clock-aware shared execution 20261004
on:
  push:
    branches: [codex/scalp7-clocked-lanes-20261004]
    paths: ['.github/workflows/scalp7-clocked-lanes-20261004.yml', 'ops/scalp7_clocked*.py', 'tests/test_scalp7_clocked*.py', 'research/campaigns/scalp7_20261004/clocked_lanes_v1/**']
  pull_request:
    branches: [master]
    paths: ['.github/workflows/scalp7-clocked-lanes-20261004.yml', 'ops/scalp7_clocked*.py', 'tests/test_scalp7_clocked*.py', 'research/campaigns/scalp7_20261004/clocked_lanes_v1/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: scalp7-clocked-lanes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Canonical precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Generated regressions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clocked"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5 PyYAML==6.0.2
          python3 -m unittest discover -s tests -p 'test_scalp7_clocked*.py' -v 2>&1 | tee "$RUNNER_TEMP/clocked/tests.log"
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,yaml
          c=pathlib.Path('research/campaigns/scalp7_20261004/clocked_lanes_v1')
          contract=json.loads((c/'CONTRACT_GITHUB.json').read_text())
          pins={**contract['source_pins'],'ops/scalp7_clocked_execution_v1.py':contract['script_sha256'],'ops/scalp7_clocked_github_owner_v1.py':contract['driver_sha256'],str(c/'OWNER_TRANSFER.json'):contract['owner_transfer_sha256'],str(c/'CONTRACT.json'):contract['predecessor_contract_sha256']}
          for name,expected in pins.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          workflow=yaml.safe_load(pathlib.Path('.github/workflows/scalp7-clocked-lanes-20261004.yml').read_text())
          for job in workflow['jobs'].values():
              for step in job['steps']:
                  if 'run' in step:subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)
          print('PINS_AND_SHELL_PASS_NO_ECONOMICS')
          PY
          tar -czf "$RUNNER_TEMP/clocked/source.tar.gz" AGENTS.md ops/scalp7_clocked*py tests/test_scalp7_clocked*py research/campaigns/scalp7_20261004/clocked_lanes_v1 .github/workflows/scalp7-clocked-lanes-20261004.yml
      - name: Canonical postcheck
        if: always()
        run: |
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalp7-clocked-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clocked/
          if-no-files-found: error
          retention-days: 90
  economic-comparison:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-squeeze-clocked]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Recover pinned existing research input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -f research/campaigns/scalp7_20261004/clocked_lanes_v1/RUN_GITHUB.json
          mkdir -p "$RUNNER_TEMP/clocked-execution"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5
          curl --fail --silent --show-error --location --proto '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/leegkssk2000-commits/vultr-z/actions/artifacts/11305382754/zip -o "$RUNNER_TEMP/clocked-execution/ORIGINAL_INPUT.zip"
          python3 - <<'PY'
          import hashlib,os,zipfile,gzip
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'clocked-execution'
          raw=(out/'ORIGINAL_INPUT.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='a656836ac36ab2dd8b90344513f567b296c6f092213a84e4d195e9b5bbabe299'
          with zipfile.ZipFile(out/'ORIGINAL_INPUT.zip') as z:
              p=z.read('PRICE_INPUT.json.gz')
          assert hashlib.sha256(gzip.decompress(p)).hexdigest()=='3da2f940e532be2c04ea25386782ef5732b12eb99d6f8203473ee3d57433d0b3'
          (out/'PRICE_INPUT.json.gz').write_bytes(p)
          PY
      - name: Atomically claim and execute the frozen two-lane comparison once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          c=research/campaigns/scalp7_20261004/clocked_lanes_v1
          python3 ops/scalp7_clocked_github_owner_v1.py --input "$RUNNER_TEMP/clocked-execution/PRICE_INPUT.json.gz" --contract "$c/CONTRACT_GITHUB.json" --activation "$c/RUN_GITHUB.json" --output "$RUNNER_TEMP/clocked-execution/result" 2>&1 | tee "$RUNNER_TEMP/clocked-execution/execution.log"
      - name: Preserve source and canonical validation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/clocked-execution"
          tar -czf "$RUNNER_TEMP/clocked-execution/source.tar.gz" AGENTS.md ops/scalp7_clocked*py tests/test_scalp7_clocked*py research/campaigns/scalp7_20261004/clocked_lanes_v1
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalp7-clocked-economic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clocked-execution/
          if-no-files-found: error
          retention-days: 90
