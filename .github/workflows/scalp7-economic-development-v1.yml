name: Scalp7 economic development saved verification
# Branch-only source-isolation repair; original workflow restored before publication.
on:
  push:
    branches: [repair/scalp7-mr-frozen-source-isolation-20261014]
    paths: [.github/workflows/scalp7-economic-development-v1.yml]
permissions:
  contents: write
concurrency:
  group: scalp7-mr-source-isolation-repair-once
  cancel-in-progress: false
jobs:
  economic-development-saved:
    if: github.ref == 'refs/heads/repair/scalp7-mr-frozen-source-isolation-20261014' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: a2361cd859f150951ec5d815073eaf57f291c9cd
      REPAIR_DRIVER_SHA: 419f31bee3b8febb90f3c2673e26e76d2a11c5b7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Required canonical checkout precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Install original deterministic verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 websockets==15.0.1 requests==2.32.5 pre-commit==4.6.0 pyyaml==6.0.3
      - name: Reuse exact source-isolation code from previous verified patch
        run: |
          python - <<'PY'
          import os, subprocess, sys, yaml
          from pathlib import Path
          if sys.version_info[:2] != (3,11):
              raise SystemExit('ORIGINAL_VERIFIER_RUNTIME_REQUIRED')
          raw=subprocess.check_output(['git','show',os.environ['REPAIR_DRIVER_SHA']+':.github/workflows/scalp7-economic-development-v1.yml'],text=True)
          steps=yaml.safe_load(raw)['jobs']['economic-development-saved']['steps']
          expected={
              'Restore frozen source and isolate already-existing extension':'isolate.sh',
              'Both original and preserved extension tests':'tests.sh',
              'Publish tested source-only changes to this repair branch, never master':'publish.sh',
          }
          root=Path(os.environ['RUNNER_TEMP'])/'frozen-repair-code'; root.mkdir()
          for name,dest in expected.items():
              matches=[s for s in steps if s.get('name')==name]
              if len(matches)!=1:
                  raise SystemExit('PINNED_REPAIR_STEP_MISSING:'+name)
              (root/dest).write_text('set -euo pipefail\n'+matches[0]['run'])
          subprocess.run(['bash',str(root/'isolate.sh')],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'freeze-repair'
          (out/'runtime.txt').write_text(sys.version+'\nBroad saved-publication workflow uses Python 3.11; Issue1377 workflow separately pins 3.12.14. No result tolerance or frozen bytes are changed.\n')
          subprocess.run(['git','diff','--binary'],check=True,stdout=(out/'proposed.diff').open('w'))
          PY
      - name: Both original and preserved extension tests
        run: bash "$RUNNER_TEMP/frozen-repair-code/tests.sh"
      - name: Original strict frozen-source and publications under Python 3.11
        run: |
          set -euo pipefail
          {
            python -m backend.research.rebuild.scalp7_campaign_binding_repair_v2 verify
            python research/campaigns/scalp7_20260915/broad_v2/verify_saved_results_v2.py --repo "$PWD"
            python scripts/verify_scalp7_clock_freezes_v3.py
            python scripts/verify_scalp7_source_ab_seal_v1.py
            python scripts/verify_frozen_exact25_source_v1.py
            python scripts/verify_scalp7_fidelity_saved_v1.py
            python scripts/verify_scalp7_economic_saved_v1.py
          } 2>&1 | tee "$RUNNER_TEMP/freeze-repair/frozen-validation.log"
          npm run --prefix frontend/z-os-app-source validate
          git diff --check
      - uses: actions/setup-python@v5
        with:
          # Exact independent original Issue1377 saved-audit runtime; not a tolerance change.
          python-version: '3.12.14'
      - name: Preserve Issue1377 saved audit under its own original runtime
        run: |
          set -euo pipefail
          python --version | tee "$RUNNER_TEMP/freeze-repair/issue1377-runtime.txt"
          python backend/research/rebuild/issue1377_saved_ledger_audit_v1.py verify 2>&1 | tee "$RUNNER_TEMP/freeze-repair/issue1377-verification.log"
      - name: Publish fully tested repair only to own branch
        run: bash "$RUNNER_TEMP/frozen-repair-code/publish.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mr-freeze-isolation-${{ github.run_id }}
          path: ${{ runner.temp }}/freeze-repair/
          if-no-files-found: warn
          retention-days: 7
