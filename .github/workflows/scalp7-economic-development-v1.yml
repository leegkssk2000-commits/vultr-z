name: Scalp7 economic development saved verification
# Temporary own-branch build; exact original workflow is restored before verification.
on:
  push:
    branches: [repair/scalp7-mr-frozen-source-isolation-20261014]
    paths: [.github/workflows/scalp7-economic-development-v1.yml]
permissions:
  contents: write
concurrency:
  group: scalp7-mr-source-isolation-repair-once
  cancel-in-progress: false
jobs:
  economic-development-saved:
    if: github.ref == 'refs/heads/repair/scalp7-mr-frozen-source-isolation-20261014' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Canonical source precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Build exact workflow adapter and bind isolation regression coverage
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from ops import scalp7_mr_isolation_publication_guard_v1 as m
          base='b2bf42d937f8d6f5b61cbcff78014dc3da783b84'
          def git(*args): return subprocess.check_output(['git',*args])
          original=git('show',m.PUBLICATION+':'+m.WORKFLOW)
          Path(m.WORKFLOW).write_bytes(m.adapted_workflow(original))
          path='.github/workflows/issue1377-keltner-orthogonal-v1.yml'
          text=git('show',base+':'+path).decode()
          before="      - 'tests/test_scalp7_mr_cost2_extension_v1.py'"
          command='          tests/test_scalp7_mr_cost2_extension_v1.py\n'
          assert text.count(before)==1 and text.count(command)==1
          text=text.replace(before,before+"\n      - 'tests/test_scalp7_mr_source_isolation_v1.py'\n      - 'ops/scalp7_mr_isolation_publication_guard_v1.py'")
          text=text.replace(command,command+'          tests/test_scalp7_mr_source_isolation_v1.py\n')
          Path(path).write_text(text)
          driver='.github/workflows/scalp7-economic-development-v1.yml'
          Path(driver).write_bytes(git('show',m.PUBLICATION+':'+driver))
          allowed={m.WORKFLOW,path,driver}
          observed={line[3:] for line in git('status','--porcelain','--untracked-files=all').decode().splitlines()}
          assert observed==allowed,observed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Bind exact authorized relocation proof and all source-isolation tests'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'mr-migration-proof'; out.mkdir()
          head=git('rev-parse','HEAD').decode().strip()
          (out/'candidate.json').write_text(json.dumps({'head':head,'base':m.PUBLICATION,'market_runs':0,'old_seal_or_validator_changed':False}))
          print('CANDIDATE_COMMIT='+head)
          PY
      - name: Install deterministic verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 websockets==15.0.1 requests==2.32.5 pre-commit==4.6.0
      - name: Original and extension regressions plus exact migration rejection cases
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_scalp7_*.py tests/test_issue1377_mr_batch_v1.py tests/test_issue1377_saved_ledger_audit_v1.py 2>&1 | tee "$RUNNER_TEMP/mr-migration-proof/tests.log"
      - name: All unchanged original publication guards in real checkout
        run: |
          set -euo pipefail
          {
            python -m backend.research.rebuild.scalp7_campaign_binding_repair_v2 verify
            python research/campaigns/scalp7_20260915/broad_v2/verify_saved_results_v2.py --repo "$PWD"
            python scripts/verify_scalp7_clock_freezes_v3.py
            python scripts/verify_scalp7_source_ab_seal_v1.py
            python scripts/verify_frozen_exact25_source_v1.py
            python scripts/verify_scalp7_fidelity_saved_v1.py
            python scripts/verify_scalp7_economic_saved_v1.py
          } 2>&1 | tee "$RUNNER_TEMP/mr-migration-proof/original-guards.log"
      - name: Exact migration proof and historic guard without altering seals
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          python ops/scalp7_mr_isolation_publication_guard_v1.py --base-sha a2361cd859f150951ec5d815073eaf57f291c9cd --checkout-sha "$HEAD" --base-source PR_EVENT_BASE --default-branch master --history-only 2>&1 | tee "$RUNNER_TEMP/mr-migration-proof/history.log"
          python ops/scalp7_mr_isolation_publication_guard_v1.py --base-sha a2361cd859f150951ec5d815073eaf57f291c9cd --checkout-sha "$HEAD" --base-source PR_EVENT_BASE --default-branch master 2>&1 | tee "$RUNNER_TEMP/mr-migration-proof/publication.log"
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Unchanged Issue1377 saved ledger audit in its original runtime
        run: |
          set -euo pipefail
          python backend/research/rebuild/issue1377_saved_ledger_audit_v1.py verify 2>&1 | tee "$RUNNER_TEMP/mr-migration-proof/issue1377.log"
      - name: Publish verified objects to own branch or record connector handoff
        run: |
          set +e
          git push origin HEAD:refs/heads/repair/scalp7-mr-frozen-source-isolation-20261014 > "$RUNNER_TEMP/mr-migration-proof/push.log" 2>&1
          RC=$?
          set -e
          export RC
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'mr-migration-proof'
          rc=int(os.environ['RC']); log=(out/'push.log').read_text()
          expected='without `workflows` permission' in log
          if rc!=0 and not expected:
              raise SystemExit('UNEXPECTED_PUBLICATION_FAILURE:'+log)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'verified.json').write_text(json.dumps({'head':head,'all_validations_passed':True,'branch_published':rc==0,'authorized_connector_workflow_publication_needed':rc!=0,'new_credentials_or_permissions':False,'economic_runs':0},indent=2))
          print('VERIFIED_COMMIT='+head)
          print('PUBLICATION='+('DONE' if rc==0 else 'EXISTING_AUTHORIZED_CONNECTOR_REQUIRED'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mr-migration-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/mr-migration-proof/
          if-no-files-found: warn
          retention-days: 7
