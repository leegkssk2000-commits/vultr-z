name: Scalp7 Exact25 five saved publication verification
on:
  pull_request:
    paths:
      - 'backend/__init__.py'
      - 'backend/research/**'
      - 'research/campaigns/scalp7*/**'
      - 'scripts/run_scalp7*'
      - 'scripts/supervise_scalp7*'
      - 'scripts/report_scalp7*'
      - 'scripts/verify_scalp7*'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - 'tests/test_scalp7*'
      - 'tests/fixtures/scalp7*/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/scalp7*.yml'
  push:
    paths:
      - 'backend/__init__.py'
      - 'backend/research/**'
      - 'research/campaigns/scalp7*/**'
      - 'scripts/run_scalp7*'
      - 'scripts/supervise_scalp7*'
      - 'scripts/report_scalp7*'
      - 'scripts/verify_scalp7*'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - 'tests/test_scalp7*'
      - 'tests/fixtures/scalp7*/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/scalp7*.yml'
permissions:
  contents: read
jobs:
  five-saved-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject budget, history, identity and path tampering
        run: python scripts/verify_scalp7_exact25_five_publication_v1.py --self-test
      - name: Verify sealed receipts, results and independent audit without replay
        run: python scripts/verify_scalp7_exact25_five_publication_v1.py
