name: Scalp7 Exact25 implementation saved verification
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/**'
      - 'tests/test_scalp7_*.py'
      - 'scripts/verify_scalp7*.py'
      - 'research/campaigns/scalp7*/**'
      - '.github/workflows/scalp7*.yml'
      - '.pre-commit-config.yaml'
  push:
    paths:
      - 'backend/research/rebuild/**'
      - 'tests/test_scalp7_*.py'
      - 'scripts/verify_scalp7*.py'
      - 'research/campaigns/scalp7*/**'
      - '.github/workflows/scalp7*.yml'
      - '.pre-commit-config.yaml'
permissions:
  contents: read
concurrency:
  group: scalp7-exact25-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact25-implementation-saved:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 websockets==15.0.1 requests==2.32.5 pre-commit==4.6.0
      - name: Normal isolated hooks
        shell: bash
        run: |
          files=(backend/research/rebuild/scalp7_exact25_*_v1.py tests/test_scalp7_exact25_*_v1.py)
          pre-commit run --files "${files[@]}" backend/research/rebuild/scalp7_implementation_contract_v1.py tests/test_scalp7_implementation_numeric_v1.py scripts/verify_scalp7_exact25_implementation_v1.py
      - name: Causal and failure-case tests
        run: python -m pytest -q tests/test_scalp7_*.py
      - name: Preserve completed publications without replay
        run: |
          python -m backend.research.rebuild.scalp7_campaign_binding_repair_v2 verify
          python research/campaigns/scalp7_20260915/broad_v2/verify_saved_results_v2.py --repo "$PWD"
          python scripts/verify_scalp7_clock_freezes_v3.py
          python scripts/verify_scalp7_source_ab_seal_v1.py
          python scripts/verify_frozen_exact25_source_v1.py
          python scripts/verify_scalp7_fidelity_saved_v1.py
          python scripts/verify_scalp7_economic_saved_v1.py
      - name: Verify Exact25 saved implementation and zero economics claim
        run: python scripts/verify_scalp7_exact25_implementation_v1.py
