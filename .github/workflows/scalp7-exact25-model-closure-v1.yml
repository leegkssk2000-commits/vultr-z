name: Scalp7 Exact25 model closure saved verification
on:
  pull_request:
    paths:
      - 'backend/__init__.py'
      - 'backend/research/**'
      - 'tests/test_scalp7*'
      - 'tests/fixtures/scalp7*/**'
      - 'research/campaigns/scalp7*/**'
      - 'scripts/verify_scalp7*'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/scalp7*.yml'
  push:
    paths:
      - 'backend/__init__.py'
      - 'backend/research/**'
      - 'tests/test_scalp7*'
      - 'tests/fixtures/scalp7*/**'
      - 'research/campaigns/scalp7*/**'
      - 'scripts/verify_scalp7*'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/scalp7*.yml'
permissions:
  contents: read
jobs:
  model-closure-saved:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable preparation without market replay
        run: python scripts/verify_scalp7_exact25_model_closure_v1.py
