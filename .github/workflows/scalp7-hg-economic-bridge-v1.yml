name: Scalp7 HG economic bridge fixtures
on:
  push:
    branches: [codex/keltner-hg-economic-bridge-20261002]
    paths:
      - backend/research/rebuild/scalp7_hg_economic_bridge_v1.py
      - tests/test_scalp7_hg_economic_bridge_v1.py
      - .github/workflows/scalp7-hg-economic-bridge-v1.yml
permissions:
  contents: read
concurrency:
  group: scalp7-hg-economic-bridge-fixtures
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate requested research checkout
        run: |
          pwd
          test -d frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Install pinned fixture dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Test actual HG producer and adapter with generated prices only
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p /tmp/hg-fixture-results
          python -m py_compile backend/research/rebuild/scalp7_hg_economic_bridge_v1.py
          python -m pytest -q tests/test_scalp7_hg_economic_bridge_v1.py tests/test_scalp7_hg_closure_v1.py --junitxml=/tmp/hg-fixture-results/pytest.xml 2>&1 | tee /tmp/hg-fixture-results/pytest.txt
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg-bridge-fixtures-${{ github.sha }}
          path: /tmp/hg-fixture-results/
          if-no-files-found: warn
          retention-days: 14
