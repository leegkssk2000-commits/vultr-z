name: Scalp7 source components saved verification
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/scalp7_source_*v1.py'
      - 'tests/test_scalp7_source_components_v1.py'
      - 'research/campaigns/scalp7_20260916/source_ab_v1/**'
      - '.github/workflows/scalp7-source-ab-saved-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/scalp7_source_*v1.py'
      - 'tests/test_scalp7_source_components_v1.py'
      - 'research/campaigns/scalp7_20260916/source_ab_v1/**'
      - '.github/workflows/scalp7-source-ab-saved-v1.yml'
permissions:
  contents: read
concurrency:
  group: scalp7-source-ab-saved-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-ab-saved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 requests==2.32.5
      - name: Causal component fixtures
        run: python -m pytest -q tests/test_scalp7_source_components_v1.py
      - name: Frozen sources and saved arithmetic only, no economic replay
        run: python -m backend.research.rebuild.scalp7_source_ab_runner_v1 verify
      - name: Preserve immutable Exact25 source
        run: python scripts/verify_frozen_exact25_source_v1.py
