name: Scalp7 source components saved verification
on:
  pull_request:
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'backend/research/rebuild/economic7_*.py'
      - 'backend/research/rebuild/benchmark25_donor_state_machine_v2.py'
      - 'backend/research/rebuild/benchmark25_donor_state_machine_v2.json'
      - 'tests/test_scalp7_*.py'
      - 'research/campaigns/scalp7_20260915/**'
      - 'research/campaigns/scalp7_20260916/**'
      - 'scripts/verify_scalp7_source_ab_seal_v1.py'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - '.github/workflows/scalp7-source-ab-saved-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/scalp7_*.py'
      - 'backend/research/rebuild/economic7_*.py'
      - 'backend/research/rebuild/benchmark25_donor_state_machine_v2.py'
      - 'backend/research/rebuild/benchmark25_donor_state_machine_v2.json'
      - 'tests/test_scalp7_*.py'
      - 'research/campaigns/scalp7_20260915/**'
      - 'research/campaigns/scalp7_20260916/**'
      - 'scripts/verify_scalp7_source_ab_seal_v1.py'
      - 'scripts/verify_frozen_exact25_source_v1.py'
      - '.github/workflows/scalp7-source-ab-saved-v1.yml'
permissions:
  contents: read
concurrency:
  group: scalp7-source-ab-saved-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-ab-saved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 pytest==9.0.2 requests==2.32.5 black==24.8.0 ruff==0.6.9 mypy==1.10.0
      - name: Check only the two new review-repair Python files
        run: |
          black --check --diff scripts/verify_scalp7_source_ab_seal_v1.py tests/test_scalp7_source_ab_seal_v1.py
          ruff check scripts/verify_scalp7_source_ab_seal_v1.py tests/test_scalp7_source_ab_seal_v1.py
          mypy --ignore-missing-imports --scripts-are-modules --explicit-package-bases scripts/verify_scalp7_source_ab_seal_v1.py tests/test_scalp7_source_ab_seal_v1.py
      - name: Causal component and publication-seal fixtures
        run: python -m pytest -q tests/test_scalp7_source_components_v1.py tests/test_scalp7_source_ab_seal_v1.py
      - name: All publications, frozen dependency triggers and saved arithmetic; no replay
        run: python scripts/verify_scalp7_source_ab_seal_v1.py
      - name: Preserve immutable Exact25 source
        run: python scripts/verify_frozen_exact25_source_v1.py
