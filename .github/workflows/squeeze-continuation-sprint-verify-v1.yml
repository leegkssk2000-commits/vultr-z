name: Squeeze Continuation frozen sprint saved verification
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  saved-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Canonical and synthetic causal regression
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python -B -m unittest discover -s backend/research/rebuild -p 'test_squeeze_sprint*_v1.py' -v
          python -B -m unittest backend.research.rebuild.test_c70_lotlock_v1 backend.research.rebuild.test_c70_lotlock_verify_v1 backend.research.rebuild.test_c70_tm_capreuse_v1 backend.research.rebuild.test_c63_c70_trader_management_v1 backend.research.rebuild.test_m1_er_range_rescue_v1
      - name: Frozen source and saved cash only; no economic dispatch
        run: |
          python -B -m backend.research.rebuild.squeeze_sprint_verify_v1
          python -B -m backend.research.rebuild.c70_lotlock_verify_v1
          git diff --exit-code
