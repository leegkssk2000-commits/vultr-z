name: Squeeze KR3 Native Sleeve 1294
on:
  push:
    branches: [codex/squeeze-kr3-native-sleeve-1294]
    paths:
      - 'backend/research/rebuild/squeeze_kr3_native_sleeve_v1.py'
      - 'backend/research/rebuild/squeeze_kr3_native_sleeve_study_v1.py'
      - 'backend/research/rebuild/test_squeeze_kr3_native_sleeve_v1.py'
      - 'research/development_evidence/SQUEEZE_KR3_CORE_PLUS_C54_NATIVE_SLEEVE_AFTER_PR1293_V1/DESIGN.md'
      - '.github/workflows/squeeze-kr3-native-sleeve-1294.yml'
permissions:
  contents: write
concurrency:
  group: squeeze-kr3-native-sleeve-1294
  cancel-in-progress: false
jobs:
  bounded-union:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      SKR1294_PREFLIGHT: 'PASSED'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Canonical validation and arbitration regressions
        run: |
          npm run --prefix frontend/z-os-app-source validate
          python3 -B -m unittest backend.research.rebuild.test_squeeze_kr3_native_sleeve_v1 -v
      - name: Verify exact saved core and donor before union economics
        run: |
          python3 -B -m backend.research.rebuild.c70_tm_capreuse_verify_v1
          (cd research/development_evidence/KR3_C51_ENTRY_CONTEXT_AB_AFTER_PR1225_V1 && python3 -B verify_saved.py --manifest-sha256 6aed19ef05f68518c1257916b6239f04120de636e4fd386fb9727fa056d25d64)
          git diff --exit-code
      - name: Execute exactly two U4 USED_DEV union FULLs
        run: |
          git config user.name 'squeeze-kr3-native-sleeve-owner'
          git config user.email 'actions@users.noreply.github.com'
          python3 -B -m backend.research.rebuild.squeeze_kr3_native_sleeve_study_v1 --all
