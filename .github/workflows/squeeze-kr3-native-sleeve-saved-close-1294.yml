name: Squeeze KR3 Native Sleeve Saved Close 1294
on:
  push:
    branches: [codex/squeeze-kr3-native-sleeve-1294]
    paths:
      - 'backend/research/rebuild/squeeze_kr3_native_sleeve_saved_close_v1.py'
      - 'research/development_evidence/SQUEEZE_KR3_CORE_PLUS_C54_NATIVE_SLEEVE_AFTER_PR1293_V1/POST_RESULT_CLOSURE.md'
      - '.github/workflows/squeeze-kr3-native-sleeve-saved-close-1294.yml'
permissions:
  contents: write
concurrency:
  group: squeeze-kr3-native-sleeve-saved-close-1294
  cancel-in-progress: false
jobs:
  saved-only-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Assert both U4 FULL receipts are already complete
        run: |
          test -f research/development_evidence/SQUEEZE_KR3_CORE_PLUS_C54_NATIVE_SLEEVE_AFTER_PR1293_V1/DEV2025/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_CORE_PLUS_C54_NATIVE_SLEEVE_AFTER_PR1293_V1/SEEN2026/RECEIPT.json
      - name: Verify and apply frozen adoption contract from saved evidence only
        run: |
          git config user.name 'squeeze-kr3-native-sleeve-saved-close'
          git config user.email 'actions@users.noreply.github.com'
          python3 -B backend/research/rebuild/squeeze_kr3_native_sleeve_saved_close_v1.py
