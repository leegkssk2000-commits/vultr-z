name: Squeeze KR3 Unified Saved Close 1292
on:
  push:
    branches: [codex/squeeze-kr3-unified-repair-1292]
    paths:
      - 'backend/research/rebuild/squeeze_kr3_unified_saved_close_1292_v1.py'
      - 'research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/POST_RESULT_CLOSURE.md'
      - '.github/workflows/squeeze-kr3-unified-saved-close-1292.yml'
permissions:
  contents: write
concurrency:
  group: squeeze-kr3-unified-saved-close-1292
  cancel-in-progress: false
jobs:
  saved-only-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify no economic dispatcher in this closure and exact stored receipts
        run: |
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U1/DEV2025/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U1/SEEN2026/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U2/DEV2025/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U2/SEEN2026/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U3/DEV2025/RECEIPT.json
          test -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_EXECUTION_REPAIR_AFTER_1291_V1/U3/SEEN2026/RECEIPT.json
          test ! -f research/development_evidence/SQUEEZE_KR3_TRUE_COMPONENT_UNIFIED_AFTER_TOP6_V1/U1/DEV2025/RESULT.json.gz
      - name: Apply frozen ranking to saved evidence only
        run: |
          git config user.name 'squeeze-kr3-saved-close-owner'
          git config user.email 'actions@users.noreply.github.com'
          python -B backend/research/rebuild/squeeze_kr3_unified_saved_close_1292_v1.py
