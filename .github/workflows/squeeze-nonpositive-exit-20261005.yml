name: Squeeze nonpositive exit bounded comparison
on:
  push:
    branches: [codex/squeeze-nonpositive-exit-20261005]
    paths: ['.github/workflows/squeeze-nonpositive-exit-20261005.yml', 'ops/squeeze_nonpositive*.py', 'ops/verify_squeeze_nonpositive_saved_v1.py', 'tests/test_squeeze_nonpositive*.py', 'research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/**']
  pull_request:
    branches: [master]
    paths: ['.github/workflows/squeeze-nonpositive-exit-20261005.yml', 'ops/squeeze_nonpositive*.py', 'ops/verify_squeeze_nonpositive_saved_v1.py', 'tests/test_squeeze_nonpositive*.py', 'research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/**']
permissions:
  contents: read
concurrency:
  group: squeeze-nonpositive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Canonical precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Generated tests only; completed market path is never repeated
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squeeze-np-closeout"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5 PyYAML==6.0.2
          python3 -m unittest discover -s tests -p 'test_squeeze_nonpositive*.py' -v 2>&1 | tee "$RUNNER_TEMP/squeeze-np-closeout/tests.log"
      - name: Independently reconcile the permanently saved result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,lzma,os,subprocess,yaml
          from pathlib import Path
          p=Path('research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1')
          c=json.loads((p/'CONTRACT_GITHUB.json').read_text())
          r=json.loads((p/'COMPLETION.json').read_text())
          sha=lambda raw:hashlib.sha256(raw).hexdigest()
          assert r['contract_sha256']==sha((p/'CONTRACT_GITHUB.json').read_bytes())
          assert r['model_lane_executions']==1 and r['remaining_lane_executions']==0
          assert r['parent_replays']==r['keltner_replays']==0 and not r['unused_oos_certified']
          pins={**c['source_pins'],'ops/squeeze_nonpositive_exit_v1.py':c['script_sha256'],'ops/squeeze_nonpositive_owner_v1.py':c['driver_sha256']}
          for path,h in pins.items():assert sha(Path(path).read_bytes())==h,path
          output=Path(os.environ['RUNNER_TEMP'])/'squeeze-np-closeout'/'SAVED_AUDIT.json'
          subprocess.run(['python3','ops/verify_squeeze_nonpositive_saved_v1.py','--bundle',str(p/'RESULT_BUNDLE.json.xz'),'--sha256',r['result_bundle_sha256'],'--parent-bundle','research/campaigns/scalp7_20261004/clocked_lanes_v1/RESULT_BUNDLE.json.xz','--output',str(output)],check=True)
          assert sha(output.read_bytes())==r['saved_audit_sha256']
          audit=json.loads(output.read_text())
          assert {k:v for k,v in audit['exit_evidence'].items() if k!='rows'}==r['exit_evidence']
          files=json.loads(lzma.decompress((p/'RESULT_BUNDLE.json.xz').read_bytes()))
          assert {name:sha(text.encode()) for name,text in files.items()}==r['original_files_sha256']
          w=yaml.safe_load(Path('.github/workflows/squeeze-nonpositive-exit-20261005.yml').read_text())
          assert set(w['jobs'])=={'verify'} and w['permissions']=={'contents':'read'}
          for job in w['jobs'].values():
              for step in job['steps']:
                  if 'run' in step:subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)
          print('SAVED_ONLY_NEW_ECONOMIC_EXECUTIONS=0')
          PY
          tar -czf "$RUNNER_TEMP/squeeze-np-closeout/source-and-results.tar.gz" AGENTS.md ops/squeeze_nonpositive*.py ops/verify_squeeze_nonpositive_saved_v1.py tests/test_squeeze_nonpositive*.py research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1 .github/workflows/squeeze-nonpositive-exit-20261005.yml
      - name: Canonical postcheck
        if: always()
        run: |
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeeze-np-closeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squeeze-np-closeout/
          retention-days: 90
          if-no-files-found: error
