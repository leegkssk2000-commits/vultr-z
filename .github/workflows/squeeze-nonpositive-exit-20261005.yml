name: Squeeze nonpositive exit bounded comparison
on:
  push:
    branches: [codex/squeeze-nonpositive-exit-20261005]
    paths: ['.github/workflows/squeeze-nonpositive-exit-20261005.yml', 'ops/squeeze_nonpositive*.py', 'tests/test_squeeze_nonpositive*.py', 'research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/**']
  pull_request:
    branches: [master]
    paths: ['.github/workflows/squeeze-nonpositive-exit-20261005.yml', 'ops/squeeze_nonpositive*.py', 'tests/test_squeeze_nonpositive*.py', 'research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/**']
permissions:
  contents: read
concurrency:
  group: squeeze-nonpositive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      activate: ${{ steps.gate.outputs.activate }}
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Canonical precheck
        run: |
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Generated tests and frozen source checks only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squeeze-np-verify"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5 PyYAML==6.0.2
          python3 -m unittest discover -s tests -p 'test_squeeze_nonpositive*.py' -v 2>&1 | tee "$RUNNER_TEMP/squeeze-np-verify/tests.log"
          python3 - <<'PY'
          from pathlib import Path
          from ops import squeeze_nonpositive_exit_v1 as m
          c=m.load(Path('research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/CONTRACT_GITHUB.json').read_bytes())
          for p,h in c['source_pins'].items():
              assert m.sha(Path(p).read_bytes())==h,p
          assert m.sha(Path('ops/squeeze_nonpositive_exit_v1.py').read_bytes())==c['script_sha256']
          assert m.sha(Path('ops/squeeze_nonpositive_owner_v1.py').read_bytes())==c['driver_sha256']
          assert m.sha(m.encoded(m.saved_parent()['signals']))==c['parent_signals_sha256']
          assert c['max_lane_executions']==1 and c['parent_replays']==0 and not c['unused_oos_certified']
          print('GENERATED_TESTS_AND_PINS_ONLY;ECONOMIC_EXECUTIONS=0')
          PY
      - id: gate
        shell: bash
        run: |
          p=research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1
          if [ -f "$p/RUN_GITHUB.json" ] && [ ! -f "$p/COMPLETION.json" ]; then
            echo 'activate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'activate=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Canonical postcheck
        if: always()
        run: |
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeeze-np-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squeeze-np-verify/
          retention-days: 90
  economic-comparison:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.activate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Recover fixed previously consumed input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squeeze-np"
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 requests==2.32.5
          curl --fail --silent --show-error --location --proto '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/leegkssk2000-commits/vultr-z/actions/artifacts/11305382754/zip -o "$RUNNER_TEMP/squeeze-np/ORIGINAL_INPUT.zip"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'squeeze-np'
          with zipfile.ZipFile(p/'ORIGINAL_INPUT.zip') as z:
              assert z.getinfo('PRICE_INPUT.json.gz').file_size<10_000_000
              (p/'PRICE_INPUT.json.gz').write_bytes(z.read('PRICE_INPUT.json.gz'))
          PY
      - name: Independent approval and permanent atomic claim before one child execution
        run: |
          python3 ops/squeeze_nonpositive_owner_v1.py \
            --input "$RUNNER_TEMP/squeeze-np/PRICE_INPUT.json.gz" \
            --contract research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/CONTRACT_GITHUB.json \
            --activation research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1/RUN_GITHUB.json \
            --output "$RUNNER_TEMP/squeeze-np/result"
      - name: Preserve exact source without replay
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/squeeze-np"
          tar -czf "$RUNNER_TEMP/squeeze-np/source.tar.gz" AGENTS.md ops/squeeze_nonpositive*.py tests/test_squeeze_nonpositive*.py research/campaigns/scalp7_20261005/squeeze_nonpositive_exit_v1 .github/workflows/squeeze-nonpositive-exit-20261005.yml
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeeze-np-economic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squeeze-np/
          retention-days: 90
          if-no-files-found: error
