name: STEP7 KR3 winner repair
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/step7_kr3_winner*.py'
      - 'backend/research/rebuild/test_step7_kr3_winner*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/WINNER_REPAIR/**'
      - '.github/workflows/step7-kr3-winner-repair-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/step7_kr3_winner*.py'
      - 'backend/research/rebuild/test_step7_kr3_winner*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/WINNER_REPAIR/**'
      - '.github/workflows/step7-kr3-winner-repair-v1.yml'
permissions:
  contents: read
concurrency:
  group: kr3-winner-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Changed entry and accounting boundaries only
        run: |
          python -m unittest backend.research.rebuild.test_step7_kr3_winner_repair_v1 backend.research.rebuild.test_step7_kr3_winner_accounting_v1 -v
          npm run --prefix frontend/z-os-app-source validate
      - name: Verify completed finite results without any economic replay
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from backend.research.rebuild import step7_kr3_winner_repair_v1 as m
          p=pathlib.Path(m.OUTPUT);s=json.loads((p/'SPEC.json').read_bytes())
          assert m.parent.native.contracts.check_seal(s)
          assert s['rule']==m.RULE and s['runs']==list(m.RUNS)
          for path,digest in s['files_sha256'].items():
            assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
          assert json.loads((p/'INPUTS.json').read_bytes())==s['input_bindings']
          assert (p/'SCOPE_ATTEMPT.json').is_file()
          index=json.loads((p/'RESULT_INDEX.json').read_bytes())
          assert index['specification_sha256']==s['receipt_sha256']
          assert len(index['results'])==3
          for ordinal,name,row in zip((61,62,63),m.RUNS,index['results']):
            folder=p/name
            assert row['run']==name and row['actual_experiment_ordinal']==ordinal and row['status']=='COMPLETED'
            assert row['specification_sha256']==s['receipt_sha256']
            assert json.loads((folder/'RECEIPT.json').read_bytes())==row
            assert json.loads((folder/'ATTEMPT.json').read_bytes())['retry_allowed'] is False
            assert hashlib.sha256((folder/'RESULT.json.gz').read_bytes()).hexdigest()==row['artifact_sha256']
          b=json.loads(pathlib.Path(m.BUDGET).read_bytes());a=b.pop('kr3_winner_repair_allocation')
          assert a['used']==3 and a['specification_sha256']==s['receipt_sha256']
          assert b['cumulative_actual']==45 and b['cumulative_actual_evaluations']==63
          assert [t['actual_experiment_ordinal'] for t in b['trials'] if t['actual_experiment_ordinal']>60]==[61,62,63]
          b['trials']=[t for t in b['trials'] if t['actual_experiment_ordinal']<=60]
          b['cumulative_actual']=44;b['cumulative_actual_evaluations']=60;b['new_candidate_runs']=0
          assert len(b.pop('candidate_trials'))==1
          assert hashlib.sha256((json.dumps(b,sort_keys=True,indent=2)+'\n').encode()).hexdigest()==a['inherited_budget_sha256']
          print('THREE_ACTUAL_RESULTS_PRESERVED; CANDIDATES45; EVALUATIONS63; OLD_HISTORY_UNCHANGED; ECONOMIC_REPLAYS0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr3-winner-${{ github.sha }}-${{ github.run_id }}
          path: research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/WINNER_REPAIR
          retention-days: 90
