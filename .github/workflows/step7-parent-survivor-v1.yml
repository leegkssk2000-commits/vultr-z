name: STEP7 Parent Survivor
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*step7*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/**'
      - '.github/workflows/step7-parent-survivor-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*step7*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/**'
      - '.github/workflows/step7-parent-survivor-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: step7-parent-survivor-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify authorization-only continuation without rerunning economics
        id: scope
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^1','HEAD'],text=True).splitlines()
          allowed = {
            '.github/workflows/step7-parent-survivor-v1.yml',
            '.github/workflows/step7-g5a-readiness.yml',
            'backend/research/rebuild/step7_authorized_io_v1.py',
            'backend/research/rebuild/step7_callable_binding_v1.py',
            'backend/research/rebuild/test_step7_callable_binding_v1.py',
            'backend/research/rebuild/test_step7_g5a_contract_scope_v1.py',
          }
          prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/G5A_READINESS/'
          auth_only = bool(changed) and all(p in allowed or p.startswith(prefix) for p in changed)
          if auth_only:
            # PR1210 remains historical evidence. Only authorized auth/CI drift
            # is exempted; all unchanged candidate/producer/design bytes match.
            base = pathlib.Path('research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR')
            spec = json.loads((base/'EXECUTION_PATH/SPEC.json').read_text())
            allowed_drift = {'.github/workflows/step7-parent-survivor-v1.yml',
                             'backend/research/rebuild/step7_authorized_io_v1.py'}
            for path, expected in spec['files_sha256'].items():
              if path not in allowed_drift and hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                raise SystemExit('UNRELATED_FROZEN_INPUT_CHANGED:' + path)
            print('REUSE_PR1210_FROZEN_SYNTHETIC_RESULT; no native economics or source rerun')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('auth_only=' + str(auth_only).lower() + '\n')
          PY
      - name: Changed authorization boundary and G5A scope regression
        if: steps.scope.outputs.auth_only == 'true'
        run: |
          python -m unittest backend.research.rebuild.test_step7_authorized_io_v1 backend.research.rebuild.test_step7_callable_binding_v1 backend.research.rebuild.test_step7_g5a_contract_scope_v1 -v
          npm run --prefix frontend/z-os-app-source validate
      - name: New execution path regression only
        if: steps.scope.outputs.auth_only != 'true'
        run: |
          set -euo pipefail
          python -m unittest backend.research.rebuild.test_step7_authorized_io_v1 backend.research.rebuild.test_step7_kr3_execution_v1 backend.research.rebuild.test_step7_source_sequence_v1 backend.research.rebuild.test_step7_design_feasibility_v1 backend.research.rebuild.test_step7_execution_path_v1 -v
          npm run --prefix frontend/z-os-app-source validate
      - name: Frozen native nine-report integration reproduction
        if: steps.scope.outputs.auth_only != 'true'
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.step7_execution_path_v1 --verify
          python -m backend.research.rebuild.step7_kr3_execution_v1 --fixture --out-dir out/step7-path-integration
          python -m backend.research.rebuild.step7_execution_path_v1 --verify-fixture out/step7-path-integration
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step7-path-implementation-${{ github.run_id }}
          path: |
            out/step7-path-integration
            research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/EXECUTION_PATH
          retention-days: 90
  source_sequence:
    needs: verify
    if: github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Merge STEP7 execution path task-c28e09b57c612762')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Additional allocated native source sequence once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.step7_execution_path_v1 --collect-source out/step7-path-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step7-path-source-${{ github.run_id }}
          path: out/step7-path-source
          if-no-files-found: error
          retention-days: 90
