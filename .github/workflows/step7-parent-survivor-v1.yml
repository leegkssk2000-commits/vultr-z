name: STEP7 Parent Survivor
on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*step7*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/**'
      - '.github/workflows/step7-parent-survivor-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*step7*.py'
      - 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/**'
      - '.github/workflows/step7-parent-survivor-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: step7-parent-survivor-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify completed scopes and finite KR3 DEV successor
        id: scope
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^1','HEAD'],text=True).splitlines()
          allowed = {
            '.github/workflows/step7-parent-survivor-v1.yml',
            '.github/workflows/step7-g5a-readiness.yml',
            'backend/research/rebuild/step7_authorized_io_v1.py',
            'backend/research/rebuild/step7_callable_binding_v1.py',
            'backend/research/rebuild/test_step7_callable_binding_v1.py',
            'backend/research/rebuild/test_step7_g5a_contract_scope_v1.py',
            'backend/research/rebuild/step7_kr3_g5a_evidence_v1.py',
            'backend/research/rebuild/step7_isolated_worker_v1.py',
            'backend/research/rebuild/test_step7_isolated_worker_v1.py',
            'backend/research/rebuild/test_step7_kr3_g5a_evidence_v1.py',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/TASK.json',
          }
          prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/G5A_READINESS/'
          dev_allowed = {
            '.github/workflows/step7-parent-survivor-v1.yml',
            '.github/workflows/step7-kr3-dev-validation-v1.yml',
            '.github/workflows/top5-cumulative-api-v4.yml',
            'backend/research/rebuild/step7_kr3_dev_evidence_v1.py',
            'backend/research/rebuild/test_step7_kr3_dev_evidence_v1.py',
            'backend/research/rebuild/step7_kr3_dev_validation_v1.py',
            'backend/research/rebuild/test_step7_kr3_dev_validation_v1.py',
            'backend/research/rebuild/step7_kr3_review_route_v1.py',
            'backend/research/rebuild/test_step7_kr3_review_route_v1.py',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/TASK.json',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json',
          }
          dev_prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/DEV_VALIDATION/'
          mechanism_prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/MECHANISM_SEPARATION/'
          mechanism_allowed = {
            '.github/workflows/step7-parent-survivor-v1.yml',
            '.github/workflows/step7-kr3-mechanism-separation-v1.yml',
            'backend/research/rebuild/step7_kr3_mechanism_separation_v1.py',
            'backend/research/rebuild/test_step7_kr3_mechanism_separation_v1.py',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json',
          }
          mechanism_only = bool(changed) and any(p.startswith(mechanism_prefix) for p in changed) and all(p in mechanism_allowed or p.startswith(mechanism_prefix) for p in changed)
          if mechanism_only:
            old = json.loads(pathlib.Path(dev_prefix+'SPEC.json').read_bytes())
            for path, expected in old['code_files_sha256'].items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                raise SystemExit('PR1212_FROZEN_NATIVE_CHANGED:'+path)
            print('REUSE_COMPLETED_PR1212; MECHANISM_RESULTS_VERIFIED_BY_OWN_SCOPED_WORKFLOW; NO_OLD_ECONOMIC_RERUN')
          winner_prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/WINNER_REPAIR/'
          winner_allowed = {
            '.github/workflows/step7-parent-survivor-v1.yml',
            '.github/workflows/step7-kr3-winner-repair-v1.yml',
            'backend/research/rebuild/step7_kr3_winner_repair_v1.py',
            'backend/research/rebuild/test_step7_kr3_winner_repair_v1.py',
            'backend/research/rebuild/step7_kr3_winner_persistence_v1.py',
            'backend/research/rebuild/test_step7_kr3_winner_persistence_v1.py',
            'backend/research/rebuild/step7_kr3_winner_accounting_v1.py',
            'backend/research/rebuild/test_step7_kr3_winner_accounting_v1.py',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json',
            'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/TASK.json',
          }
          winner_only = bool(changed) and any(p.startswith(winner_prefix) for p in changed) and all(p in winner_allowed or p.startswith(winner_prefix) for p in changed)
          if winner_only:
            print('REUSE_COMPLETED_PR1213_AND_PRIOR_ECONOMICS; WINNER_SCOPE_HAS_OWN_TESTS_AND_STORED_RESULT_CHECKS')
          d_prefix = 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/D_PARENT_2026/'
          d_allowed = {'.github/workflows/step7-parent-survivor-v1.yml', '.github/workflows/kr3-d-seen2026-exact-v1.yml', 'backend/research/rebuild/kr3_d_seen2026_v1.py', 'backend/research/rebuild/test_kr3_d_seen2026_v1.py', 'research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/BUDGET.json'}
          d_only = bool(changed) and any(p.startswith(d_prefix) for p in changed) and all(p in d_allowed or p.startswith(d_prefix) for p in changed)
          if d_only:
            from backend.research.rebuild.kr3_d_seen2026_v1 import verify_saved
            print(verify_saved())
            print('EXACT_D_SUCCESSOR_OWNS_ITS_TESTS; NO_PRIOR_ECONOMIC_REPLAY')
          dev_only = d_only or winner_only or mechanism_only or (bool(changed) and any(p.startswith(dev_prefix) for p in changed) and all(p in dev_allowed or p.startswith(dev_prefix) for p in changed))
          auth_only = not dev_only and bool(changed) and all(p in allowed or p.startswith(prefix) for p in changed)
          if dev_only:
            print('REUSE_COMPLETED_PR1211_AUTH_AND_PR1210_SYNTHETIC_EVIDENCE; NEW_DEV_TESTS_AND_STORED_RESULTS_HAVE_SEPARATE_WORKFLOW')
          if auth_only:
            base = pathlib.Path('research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR')
            spec = json.loads((base/'EXECUTION_PATH/SPEC.json').read_text())
            allowed_drift = {'.github/workflows/step7-parent-survivor-v1.yml',
                             'backend/research/rebuild/step7_authorized_io_v1.py'}
            for path, expected in spec['files_sha256'].items():
              if path not in allowed_drift and hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                raise SystemExit('UNRELATED_FROZEN_INPUT_CHANGED:' + path)
            print('REUSE_PR1210_FROZEN_SYNTHETIC_RESULT; no native economics or source rerun')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('auth_only=' + str(auth_only).lower() + '\n')
            f.write('dev_only=' + str(dev_only).lower() + '\n')
          PY
      - name: Changed authorization boundary and actual evidence linkage regression
        if: steps.scope.outputs.auth_only == 'true'
        run: |
          python -m unittest backend.research.rebuild.test_step7_authorized_io_v1 backend.research.rebuild.test_step7_callable_binding_v1 backend.research.rebuild.test_step7_kr3_g5a_evidence_v1 backend.research.rebuild.test_step7_isolated_worker_v1 -v
          npm run --prefix frontend/z-os-app-source validate
          python -m backend.research.rebuild.step7_kr3_g5a_evidence_v1 --out-dir out/step7-g5a-evidence
          cmp out/step7-g5a-evidence/KR3_G5A_EVIDENCE.json research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/G5A_READINESS/KR3_G5A_EVIDENCE.json
      - name: New execution path regression only
        if: steps.scope.outputs.auth_only != 'true' && steps.scope.outputs.dev_only != 'true'
        run: |
          set -euo pipefail
          python -m unittest backend.research.rebuild.test_step7_authorized_io_v1 backend.research.rebuild.test_step7_kr3_execution_v1 backend.research.rebuild.test_step7_source_sequence_v1 backend.research.rebuild.test_step7_design_feasibility_v1 backend.research.rebuild.test_step7_execution_path_v1 -v
          npm run --prefix frontend/z-os-app-source validate
      - name: Frozen native nine-report integration reproduction
        if: steps.scope.outputs.auth_only != 'true' && steps.scope.outputs.dev_only != 'true'
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.step7_execution_path_v1 --verify
          python -m backend.research.rebuild.step7_kr3_execution_v1 --fixture --out-dir out/step7-path-integration
          python -m backend.research.rebuild.step7_execution_path_v1 --verify-fixture out/step7-path-integration
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step7-path-implementation-${{ github.run_id }}
          path: |
            out/step7-path-integration
            out/step7-g5a-evidence
            research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/G5A_READINESS
            research/development_evidence/ZEL_PARENT_CLOSURE_TO_G5_SURVIVOR/EXECUTION_PATH
          retention-days: 90
  source_sequence:
    needs: verify
    if: github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Merge STEP7 execution path task-c28e09b57c612762')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Additional allocated native source sequence once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m backend.research.rebuild.step7_execution_path_v1 --collect-source out/step7-path-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step7-path-source-${{ github.run_id }}
          path: out/step7-path-source
          if-no-files-found: error
          retention-days: 90
