name: Strategy Lifecycle + Synthesis Material V1
on:
  push:
    branches: [master]
    paths:
      - 'backend/research/prep/strategy_synthesis_material_ssot_v1.json'
      - 'backend/research/prep/strategy_material_grade_v1.py'
      - 'backend/research/architecture_factory/a1_gen2_alpha_proof_e2e_v2.py'
      - '.github/workflows/strategy-lifecycle-material-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: strategy-lifecycle-material-v1
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install provider dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Validate lifecycle and material engines
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/prep/strategy_material_grade_v1.py \
            backend/research/architecture_factory/a1_gen2_alpha_proof_e2e_v2.py
          python -m backend.research.prep.strategy_material_grade_v1 --self-test
          python -m backend.research.architecture_factory.a1_gen2_alpha_proof_e2e_v2 --self-test
      - name: Synchronize verified external evidence
        run: |
          set -euo pipefail
          python -m backend.research.architecture_factory.a1_sync_external_evidence_v1 --write backend/research/architecture_factory/a1_free_evidence_sweep_v1.json
      - name: Push all currently intake-ready GEN2 candidates to evidence ceiling
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m backend.research.architecture_factory.a1_terminal_repair_swarm_v5 --output out/a1_terminal_repair_swarm_v5.json
          python -m backend.research.architecture_factory.a1_gen2_alpha_proof_e2e_v2 \
            --swarm out/a1_terminal_repair_swarm_v5.json \
            --output out/a1_gen2_alpha_proof_e2e_v2.json \
            --limit 25
      - name: Classify all Exact25 strategies and build material-upgrade queue
        run: |
          set -euo pipefail
          python -m backend.research.prep.strategy_material_grade_v1 \
            --output out/strategy_material_grade_v1.json
      - name: Publish lifecycle and synthesis receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          marker='<!-- STRATEGY_LIFECYCLE_MATERIAL_V1 -->'
          def load(path, default):
              try: return json.loads(Path(path).read_text())
              except Exception: return default
          mat=load('out/strategy_material_grade_v1.json', {'state':'HOLD_MATERIAL_RUNTIME_NO_RECEIPT','grades':{},'buckets':{},'upgrade_queue':[],'rows':[]})
          e2e=load('out/a1_gen2_alpha_proof_e2e_v2.json', {'state':'HOLD_GEN2_RUNTIME_NO_RECEIPT','rows':[]})
          grade_counts={k:len(v) for k,v in (mat.get('grades') or {}).items()}
          bucket_counts={k:len(v) for k,v in (mat.get('buckets') or {}).items()}
          e2e_rows=[{'candidate_id':x.get('candidate_id'),'state':x.get('state'),'failed_gates':x.get('failed_gates')} for x in (e2e.get('rows') or [])]
          upgrades=[{'strategy_id':x.get('strategy_id'),'from':x.get('from_grade'),'target':x.get('target_grade'),'axis':x.get('axis')} for x in (mat.get('upgrade_queue') or [])]
          lines=[
            marker,
            '## Strategy Lifecycle + Synthesis Material V1',
            f"run={os.environ['RUN_ID']}|head={os.environ['HEAD_SHA']}",
            f"gen2_state={e2e.get('state')}|intake_ready={e2e.get('intake_ready_count',0)}|attempted={e2e.get('attempted_count',0)}|alpha_pass={e2e.get('alpha_proof_pass_count',0)}|fresh_prereg={e2e.get('fresh_preregistration_count',0)}",
            'gen2_rows='+json.dumps(e2e_rows,sort_keys=True,separators=(',',':')),
            f"material_state={mat.get('state')}|strategy_count={mat.get('strategy_count',0)}|all25={mat.get('all_exact25_accounted')}",
            'grade_counts='+json.dumps(grade_counts,sort_keys=True,separators=(',',':')),
            'bucket_counts='+json.dumps(bucket_counts,sort_keys=True,separators=(',',':')),
            'a3_promotion_queue='+json.dumps((mat.get('buckets') or {}).get('A3_PROMOTION_QUEUE') or [],sort_keys=True),
            'synthesis_core='+json.dumps((mat.get('buckets') or {}).get('SYNTHESIS_CORE') or [],sort_keys=True),
            'synthesis_upgrade='+json.dumps((mat.get('buckets') or {}).get('SYNTHESIS_UPGRADE') or [],sort_keys=True),
            'synthesis_experimental='+json.dumps((mat.get('buckets') or {}).get('SYNTHESIS_EXPERIMENTAL') or [],sort_keys=True),
            'hold_data='+json.dumps((mat.get('buckets') or {}).get('HOLD_DATA') or [],sort_keys=True),
            'discard_pending_ablation='+json.dumps((mat.get('buckets') or {}).get('DISCARD_PENDING_ABLATION') or [],sort_keys=True),
            'discard_confirmed='+json.dumps((mat.get('buckets') or {}).get('DISCARD_CONFIRMED') or [],sort_keys=True),
            'upgrade_queue='+json.dumps(upgrades,sort_keys=True,separators=(',',':')),
            f"material_receipt={mat.get('receipt_sha256')}|gen2_receipt={e2e.get('receipt_sha256')}",
            'policy=push_every_candidate_to_current_evidence_ceiling; material_grade_separate_from_promotion; final_discard_requires_marginal_synthesis_ablation',
            'selection=false|promotion=false|execution=NONE|order/live=BLOCKED|exchange_order=false|protected_mutations=0'
          ]
          body='\n'.join(lines)
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          comments=[]
          for page in range(1,60):
              url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments?per_page=100&page={page}"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: batch=json.load(r)
              comments.extend(batch)
              if len(batch)<100: break
          prior=next((c for c in reversed(comments) if marker in str(c.get('body') or '')),None)
          url=prior.get('url') if prior else f"https://api.github.com/repos/{os.environ['REPO']}/issues/566/comments"
          method='PATCH' if prior else 'POST'
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers=headers,method=method)): pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lifecycle-material-${{ github.run_id }}
          retention-days: 90
          path: |
            out/a1_terminal_repair_swarm_v5.json
            out/a1_gen2_alpha_proof_e2e_v2.json
            out/strategy_material_grade_v1.json
