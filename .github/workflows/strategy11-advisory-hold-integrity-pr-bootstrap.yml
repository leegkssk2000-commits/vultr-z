name: Bootstrap Strategy11 Advisory Hold Integrity Repair

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/strategy11-advisory-hold-integrity-patch.yml
      - .github/workflows/strategy11-advisory-hold-integrity-pr-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-advisory-hold-integrity-repair-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and execute the reviewed patch steps
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          source=Path('.github/workflows/strategy11-advisory-hold-integrity-patch.yml')
          data=yaml.safe_load(source.read_text(encoding='utf-8'))
          steps=data['jobs']['patch']['steps']
          wanted={step.get('name'): step.get('run') for step in steps if isinstance(step,dict)}
          for idx,name in enumerate(('Apply exact single-cause patches','Verify patched modules locally'),1):
              script=wanted.get(name)
              if not script:
                  raise SystemExit(f'PATCH_STEP_MISSING:{name}')
              Path(f'/tmp/step-{idx}.sh').write_text('set -euo pipefail\n'+script+'\n',encoding='utf-8')
          PY
          bash /tmp/step-1.sh
          bash /tmp/step-2.sh
      - name: Commit only permanent repair files
        run: |
          rm -f .github/workflows/strategy11-advisory-hold-integrity-patch.yml
          rm -f .github/workflows/strategy11-advisory-hold-integrity-pr-bootstrap.yml
          git config user.name 'strategy11-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Strategy11 advisory hold integrity gaps'
          git push origin HEAD:strategy11-advisory-hold-integrity-repair-v1
