name: Bootstrap Strategy11 Advisory Hold Integrity Repair

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/strategy11-advisory-hold-integrity-patch.yml
      - .github/workflows/strategy11-advisory-hold-integrity-pr-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-advisory-hold-integrity-repair-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and execute the reviewed patch steps
        run: |
          python - <<'PY'
          from pathlib import Path

          source=Path('.github/workflows/strategy11-advisory-hold-integrity-patch.yml')
          text=source.read_text(encoding='utf-8')
          names=(
              ('Apply exact single-cause patches','Verify patched modules locally'),
              ('Verify patched modules locally','Commit repaired files'),
          )
          for idx,(start_name,end_name) in enumerate(names,1):
              start=text.index(f'      - name: {start_name}')
              end=text.index(f'      - name: {end_name}',start)
              block=text[start:end]
              marker='        run: |\n'
              script=block.split(marker,1)[1]
              normalized='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
              Path(f'/tmp/step-{idx}.sh').write_text('set -euo pipefail\n'+normalized+'\n',encoding='utf-8')
          PY
          export PYTHONPATH="$PWD"
          bash /tmp/step-1.sh
          bash /tmp/step-2.sh
      - name: Commit verified backend repair only
        run: |
          rm -f .github/workflows/r7a4d-strategy11-advisory-hold-integrity-fixture-v1.yml
          git checkout HEAD -- \
            .github/workflows/strategy11-advisory-hold-integrity-patch.yml \
            .github/workflows/strategy11-advisory-hold-integrity-pr-bootstrap.yml
          git config user.name 'strategy11-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Strategy11 advisory hold integrity gaps'
          git push origin HEAD:strategy11-advisory-hold-integrity-repair-v1
