name: Strategy11 Provider Guard V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/strategy11_groq_redteam.py'
      - 'scripts/strategy11_github_models_review.py'
      - '.github/workflows/strategy11-groq-anonymization-guard-v2.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/strategy11_groq_redteam.py'
      - 'scripts/strategy11_github_models_review.py'
      - '.github/workflows/strategy11-groq-anonymization-guard-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy11-provider-guard-v2-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - name: Compile provider clients
        run: |
          python -m py_compile scripts/strategy11_groq_redteam.py scripts/strategy11_github_models_review.py
      - name: Validate Groq anonymization boundaries
        run: |
          python scripts/strategy11_groq_redteam.py --self-test
          python - <<'PY'
          from scripts.strategy11_groq_redteam import assert_anonymized, strip_authority_fields
          payload={
            'evidence':{'ordered_marginal_delta_net':{'TEAM':0.4}},
            'research_only':True,'promotion_authority':False,'protected_mutations':0,
            'execution_allowed':False,'execution_authority':'NONE','order_authority':'BLOCKED','runtime_bound':False,
          }
          assert_anonymized(payload)
          external=strip_authority_fields(payload)
          assert external=={'evidence':{'ordered_marginal_delta_net':{'TEAM':0.4}}}
          for bad in ({'orders':[]},{'position_id':'x'},{'order_authority':'ENABLED'}):
              try: assert_anonymized(bad)
              except ValueError: pass
              else: raise AssertionError(bad)
          PY
      - name: Validate GitHub Models retirement HOLD
        run: |
          python scripts/strategy11_github_models_review.py --self-test
          python - <<'PY'
          from scripts.strategy11_github_models_review import retired_review, validate_review
          row=validate_review(retired_review())
          assert row['decision']=='HOLD'
          assert row['blocker_codes']==['GITHUB_MODELS_PROVIDER_RETIRED_HTTP_410']
          PY
