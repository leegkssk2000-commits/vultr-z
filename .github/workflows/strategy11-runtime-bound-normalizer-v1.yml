name: Strategy11 Runtime Bound Normalizer V1

on:
  pull_request:
    paths:
      - ".github/workflows/strategy11-runtime-bound-normalizer-v1.yml"
      - "backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py"
      - "backend/contracts/strategy11_source_binding_contract_v1.py"
      - "backend/research/strategy11_attribution_ledger_v1.py"
      - "backend/research/strategy11_chain_intake_preflight_v1.py"
      - "backend/research/strategy11_model_risk_governance_v1.py"
      - "backend/research/strategy11_portfolio_governor_v1.py"
      - "backend/tools/r7a4d_strategy11_internal_synergy_audit_v1.py"
      - "backend/tools/r7a4d_strategy11_intrabar_observer_v1.py"

permissions:
  contents: write

concurrency:
  group: strategy11-runtime-bound-normalizer-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the missing blocked-runtime invariant only
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py"),
              Path("backend/contracts/strategy11_source_binding_contract_v1.py"),
              Path("backend/research/strategy11_attribution_ledger_v1.py"),
              Path("backend/research/strategy11_chain_intake_preflight_v1.py"),
              Path("backend/research/strategy11_model_risk_governance_v1.py"),
              Path("backend/research/strategy11_portfolio_governor_v1.py"),
              Path("backend/tools/r7a4d_strategy11_internal_synergy_audit_v1.py"),
              Path("backend/tools/r7a4d_strategy11_intrabar_observer_v1.py"),
          ]
          needle = '    "order_authority": "BLOCKED",\n'
          insertion = needle + '    "runtime_bound": False,\n'
          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              safety_start = text.find("SAFETY = {")
              if safety_start < 0:
                  raise SystemExit(f"SAFETY_BLOCK_MISSING:{path}")
              safety_end = text.find("}\n", safety_start)
              if safety_end < 0:
                  raise SystemExit(f"SAFETY_BLOCK_UNTERMINATED:{path}")
              safety = text[safety_start:safety_end]
              if '"runtime_bound": False' in safety:
                  continue
              if safety.count(needle) != 1:
                  raise SystemExit(f"ORDER_AUTHORITY_PATTERN_COUNT:{path}:{safety.count(needle)}")
              updated_safety = safety.replace(needle, insertion, 1)
              updated = text[:safety_start] + updated_safety + text[safety_end:]
              if updated.count('"runtime_bound": False') != text.count('"runtime_bound": False') + 1:
                  raise SystemExit(f"RUNTIME_BOUND_DELTA_INVALID:{path}")
              path.write_text(updated, encoding="utf-8")
              changed.append(str(path))
          print("CHANGED=" + ",".join(changed))
          PY
      - name: Verify exact diff and compile
        run: |
          git diff --check
          python -m py_compile \
            backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            backend/contracts/strategy11_source_binding_contract_v1.py \
            backend/research/strategy11_attribution_ledger_v1.py \
            backend/research/strategy11_chain_intake_preflight_v1.py \
            backend/research/strategy11_model_risk_governance_v1.py \
            backend/research/strategy11_portfolio_governor_v1.py \
            backend/tools/r7a4d_strategy11_internal_synergy_audit_v1.py \
            backend/tools/r7a4d_strategy11_intrabar_observer_v1.py
          python - <<'PY'
          from pathlib import Path
          paths = [
              "backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py",
              "backend/contracts/strategy11_source_binding_contract_v1.py",
              "backend/research/strategy11_attribution_ledger_v1.py",
              "backend/research/strategy11_chain_intake_preflight_v1.py",
              "backend/research/strategy11_model_risk_governance_v1.py",
              "backend/research/strategy11_portfolio_governor_v1.py",
              "backend/tools/r7a4d_strategy11_internal_synergy_audit_v1.py",
              "backend/tools/r7a4d_strategy11_intrabar_observer_v1.py",
          ]
          for raw in paths:
              text = Path(raw).read_text(encoding="utf-8")
              start = text.index("SAFETY = {")
              end = text.index("}\n", start)
              assert '"runtime_bound": False' in text[start:end], raw
          PY
      - name: Commit normalized authority metadata
        run: |
          if git diff --quiet; then
            echo "No normalization needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            backend/contracts/strategy11_source_binding_contract_v1.py \
            backend/research/strategy11_attribution_ledger_v1.py \
            backend/research/strategy11_chain_intake_preflight_v1.py \
            backend/research/strategy11_model_risk_governance_v1.py \
            backend/research/strategy11_portfolio_governor_v1.py \
            backend/tools/r7a4d_strategy11_internal_synergy_audit_v1.py \
            backend/tools/r7a4d_strategy11_intrabar_observer_v1.py
          git commit -m "Normalize Strategy11 runtime-bound safety metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
