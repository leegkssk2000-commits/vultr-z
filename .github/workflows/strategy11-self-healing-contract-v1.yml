name: Strategy11 Self Healing Operations Contract V1

on:
  pull_request:
    branches:
      - master
    paths:
      - backend/contracts/strategy11_self_healing_operations_contract_v1.py
      - backend/research/strategy11_self_healing_fixture_policy_v1.json
      - backend/tools/strategy11_self_healing_fixture_v1.py
      - .github/workflows/strategy11-self-healing-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy11-self-healing-contract-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  self-healing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile contract and fixtures
        run: |
          python -m py_compile \
            backend/contracts/strategy11_self_healing_operations_contract_v1.py \
            backend/tools/strategy11_self_healing_fixture_v1.py
      - name: Run deterministic self-healing fixtures
        run: |
          python backend/tools/strategy11_self_healing_fixture_v1.py \
            --policy backend/research/strategy11_self_healing_fixture_policy_v1.json \
            --out artifacts/strategy11_self_healing_contract_v1
      - name: Assert fail-closed observer authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/strategy11_self_healing_contract_v1/summary.json').read_text())
          assert d['state']=='PASS_SELF_HEALING_OPERATIONS_FIXTURES'
          assert d['case_count']==6
          assert d['healthy']['state']=='PASS_SELF_HEALING_OBSERVER'
          assert d['healthy']['metrics']['incident_duplicate_count']==1
          assert d['duplicate_writer_block']['state']=='BLOCK_SELF_HEALING_AUTHORITY'
          assert d['parity_hold']['state']=='HOLD_SELF_HEALING_OPERATIONS'
          assert d['service_rollback_request']['state']=='ROLLBACK_REQUEST_SELF_HEALING'
          assert d['service_rollback_request']['recovery_requests'][0]['execute_allowed'] is False
          assert d['authority_block']['state']=='BLOCK_SELF_HEALING_AUTHORITY'
          assert len(d['negative_cases'])==1
          assert d['runtime_activation_allowed'] is False
          assert d['automatic_recovery_execute_allowed'] is False
          assert d['service_mutation_allowed'] is False
          assert d['ledger_mutation_allowed'] is False
          assert d['writer_reassignment_allowed'] is False
          assert d['research_only'] is True
          assert d['promotion_authority'] is False
          assert d['protected_mutations']==0
          assert d['execution_allowed'] is False
          assert d['order_authority']=='BLOCKED'
          assert d['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s11-self-healing-contract-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strategy11_self_healing_contract_v1
          if-no-files-found: error
          retention-days: 90
