name: Strategy11 Source Authority Audit Fix V1

on:
  pull_request:
    paths:
      - ".github/workflows/strategy11-source-authority-audit-fix-v1.yml"

permissions:
  contents: write

concurrency:
  group: strategy11-source-authority-audit-fix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch exact non-overlapping reference census
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path=Path('backend/tools/strategy11_source_authority_audit_v1.py')
          text=path.read_text(encoding='utf-8')
          new='''def token_references(files: Iterable[SourceFile], target: str) -> list[dict[str, Any]]:
              path_token = target
              module_token = target[:-3].replace("/", ".")
              stem_token = Path(target).stem
              audit_rel = Path(__file__).resolve().relative_to(ROOT).as_posix()
              token_specs = (
                  ("path_hits", path_token, r"A-Za-z0-9_./-"),
                  ("module_hits", module_token, r"A-Za-z0-9_."),
                  ("stem_hits", stem_token, r"A-Za-z0-9_"),
              )
              result = []
              for file in files:
                  if file.rel in {target, audit_rel}:
                      continue
                  accepted: list[tuple[int, int, str]] = []
                  for kind, token, boundary in token_specs:
                      pattern = re.compile(rf"(?<![{boundary}]){re.escape(token)}(?![{boundary}])")
                      for match in pattern.finditer(file.text):
                          span = match.span()
                          if any(not (span[1] <= start or span[0] >= end) for start, end, _ in accepted):
                              continue
                          accepted.append((span[0], span[1], kind))
                  if not accepted:
                      continue
                  counts = {kind: sum(row[2] == kind for row in accepted) for kind, _, _ in token_specs}
                  result.append(
                      {
                          "path": file.rel,
                          "total_hits": len(accepted),
                          **counts,
                          "is_workflow": file.rel.startswith(".github/workflows/"),
                          "is_python": file.rel.endswith(".py"),
                      }
                  )
              return sorted(result, key=lambda row: (-row["total_hits"], row["path"]))
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n\n'
          pattern=re.compile(r'def token_references\(.*?\n\n(?=def similarity)', re.DOTALL)
          updated,count=pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f'TOKEN_REFERENCE_FUNCTION_COUNT:{count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify audit behavior
        run: |
          python -m py_compile backend/tools/strategy11_source_authority_audit_v1.py
          python backend/tools/strategy11_source_authority_audit_v1.py
          git diff --check
      - name: Commit audit accuracy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tools/strategy11_source_authority_audit_v1.py
          git commit -m "Fix Strategy11 source reference census accuracy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
