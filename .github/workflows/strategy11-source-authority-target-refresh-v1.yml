name: Strategy11 Source Authority Target Refresh V1

on:
  pull_request:
    paths:
      - ".github/workflows/strategy11-source-authority-target-refresh-v1.yml"

permissions:
  contents: write

concurrency:
  group: strategy11-source-authority-target-refresh-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove completed duplicate from unresolved target list
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('backend/tools/strategy11_source_authority_audit_v1.py')
          text=path.read_text(encoding='utf-8')
          line='    "backend/tools/r7a4d_strategy11_post_shadow_observer_gate_optimized_fixture_v1.py",\n'
          if text.count(line) != 1:
              raise SystemExit(f'TARGET_LINE_COUNT:{text.count(line)}')
          path.write_text(text.replace(line, '', 1), encoding='utf-8')
          PY
      - name: Verify audit after cleanup
        run: |
          python -m py_compile backend/tools/strategy11_source_authority_audit_v1.py
          python backend/tools/strategy11_source_authority_audit_v1.py
          git diff --check
      - name: Commit target refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tools/strategy11_source_authority_audit_v1.py
          git commit -m "Record completed duplicate source cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
