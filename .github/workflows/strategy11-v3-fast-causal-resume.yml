name: Strategy11 V3 Fast Causal Resume

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/strategy11_expanded_discovery_v3.py
      - backend/tools/strategy11_v3_fast_causal.py
      - .github/workflows/strategy11-v3-fast-causal-resume.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  COMPUTE_REF: r7a4d-strategy11-cause-aware-rotation-l090-v6
  OLD_RUN_ID: '30588354565'
  SOURCE_RUN_ID: '30252022416'
  STRATEGY_ID: trend_rider

concurrency:
  group: strategy11-v3-fast-causal-resume-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-v3-fast-causal-resume
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: final-v3-prep-${{ env.OLD_RUN_ID }}
          path: input/prep
          github-token: ${{ github.token }}
          run-id: ${{ env.OLD_RUN_ID }}
      - name: Verify rolling-history equivalence and reuse
        run: |
          python -m py_compile backend/tools/strategy11_v3_fast_causal.py backend/tools/strategy11_expanded_discovery_v3.py
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          import pandas as pd
          from backend.tools.strategy11_regime_edge_router_v3 import ConfigStrategyWrapper
          from backend.tools.strategy11_v3_fast_causal import FastCausalConfigStrategyWrapper

          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              module=importlib.util.module_from_spec(spec)
              sys.modules[name]=module
              spec.loader.exec_module(module)
              return module

          frame=pd.read_csv('input/prep/archive/market/A01-BTCUSDT.csv')
          frame['timestamp']=pd.to_datetime(frame['timestamp_ms'],unit='ms',utc=True)
          windows=[frame.iloc[:100].copy(),frame.iloc[50:250].copy(),frame.iloc[200:440].copy(),frame.iloc[660:900].copy()]
          path=Path('compute/backend/strategies/trend_rider.py')
          for idx,(field,value,scope) in enumerate([(None,None,None),('max_chase_dist_atr',2.415,None),('st_mult',2.55,'TREND_UP')]):
              slow_mod=load(f'slow_{idx}',path)
              fast_mod=load(f'fast_{idx}',path)
              slow=ConfigStrategyWrapper(slow_mod.strategy,slow_mod.TrendRiderConfig,field,value,scope)
              fast=FastCausalConfigStrategyWrapper(fast_mod.strategy,fast_mod.TrendRiderConfig,field,value,scope)
              fast.prepare_frame(frame)
              for history in windows:
                  expected=slow(history,state={},risk_action='hold')
                  actual=fast(history,state={},risk_action='hold')
                  repeated=fast(history,state={},risk_action='hold')
                  encoded=json.dumps(expected,sort_keys=True,allow_nan=True)
                  assert encoded==json.dumps(actual,sort_keys=True,allow_nan=True)
                  assert encoded==json.dumps(repeated,sort_keys=True,allow_nan=True)
              assert len(fast.supertrend_cache)>0
              assert len(fast.ema_cache)>0
              assert fast.cache_hits['regime']>0
              assert fast.cache_hits['decision']>0
          print('PASS_FAST_ROLLING_CAUSAL_EQUIVALENCE')
          PY

  replay:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-v3-fast-causal-resume
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPUTE_REF }}
          path: compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: final-v3-prep-${{ env.OLD_RUN_ID }}
          path: input/prep
          github-token: ${{ github.token }}
          run-id: ${{ env.OLD_RUN_ID }}
      - name: Download immutable evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/evidence
          for batch in 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "s11-evidence-batch-${batch}-${SOURCE_RUN_ID}-attempt-1" --dir "input/evidence/batch-${batch}"
          done
      - name: Replay missing trend rider
        run: |
          mkdir -p out/batch-trend_rider
          python backend/tools/strategy11_expanded_discovery_v3.py replay \
            --compute-root compute --archive-root input/prep/archive --evidence-root input/evidence \
            --plan input/prep/plan/plan.json --registry input/prep/plan/internal_registry.json \
            --policy backend/research/strategy11_v3_policy.json --strategy-ids trend_rider \
            --out out/batch-trend_rider
          python - <<'PY'
          import json
          from pathlib import Path
          batch=json.loads(Path('out/batch-trend_rider/batch.json').read_text())
          assert batch['state']=='PASS_V3_DISCOVERY_BATCH'
          assert batch['strategy_count']==1
          for variant in batch['rows'][0]['variants']:
              assert variant['parity']['state']=='PASS'
              assert variant['parity']['duplicate_trade_count']==0
              assert variant['canonical_mutated'] is False
              assert variant['promotion_authority'] is False
              assert variant['execution_allowed'] is False
              assert variant['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resume-v3-trend-rider-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-v3-fast-causal-resume
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: final-v3-prep-${{ env.OLD_RUN_ID }}
          path: input/prep
          github-token: ${{ github.token }}
          run-id: ${{ env.OLD_RUN_ID }}
      - name: Restore completed artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/old input/replays
          gh run download "$OLD_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "final-v3-*-${OLD_RUN_ID}" --dir input/old
          find input/old -type d -name 'batch-*' -print0 | while IFS= read -r -d '' path; do cp -R "$path" input/replays/; done
          test "$(find input/replays -mindepth 2 -maxdepth 2 -name batch.json | wc -l)" -eq 23
      - uses: actions/download-artifact@v4
        with:
          name: resume-v3-trend-rider-${{ github.run_id }}
          path: input/new
      - name: Aggregate 24 strategies and 48 candidates
        run: |
          cp -R input/new/batch-trend_rider input/replays/
          test "$(find input/replays -mindepth 2 -maxdepth 2 -name batch.json | wc -l)" -eq 24
          mkdir -p out/state
          python backend/tools/strategy11_expanded_discovery_v3.py aggregate \
            --batch-root input/replays --plan input/prep/plan/plan.json \
            --policy backend/research/strategy11_v3_policy.json --out out/state/final.json
          cp input/prep/plan/plan.json out/state/cycle_plan.json
          cp input/prep/plan/internal_registry.json out/state/internal_registry.json
          cp input/prep/plan/search_ledger.json out/state/search_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          final=json.loads(Path('out/state/final.json').read_text())
          plan=json.loads(Path('out/state/cycle_plan.json').read_text())
          assert final['state']=='PASS_V3_ORGANIC_AUDIT'
          assert final['blockers']==[]
          assert final['strategy_count']==len(plan['active_strategy_ids'])==24
          assert final['candidate_count']==plan['candidate_count']==48
          assert final['fresh_confirmation_required'] is True
          assert final['w1_w2_w3_new_sealed_required'] is True
          assert final['promotion_authority'] is False
          assert final['execution_allowed'] is False
          assert final['order_authority']=='BLOCKED'
          assert final['runtime_bound'] is False
          print(json.dumps(final,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-v3-resumed-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90
