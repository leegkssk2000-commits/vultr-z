name: Strategy11 Validation Primitives Migrator V1

on:
  pull_request:
    paths:
      - ".github/workflows/strategy11-validation-primitives-migrator-v1.yml"

permissions:
  contents: write

concurrency:
  group: strategy11-validation-primitives-migrator-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace local duplicate validators with bound shared primitives
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          targets = {
              Path("backend/research/strategy11_synthesis_material_registry_v1.py"): {
                  "_mapping": "mapping",
                  "_string": "string",
                  "_sha": "sha256",
                  "_bool": "boolean",
                  "_integer": "integer",
                  "_number": "number",
              },
              Path("backend/research/strategy11_bounded_synthesis_constructor_v1.py"): {
                  "_mapping": "mapping",
                  "_string": "string",
                  "_integer": "integer",
                  "_bool": "boolean",
                  "_sha": "sha256",
              },
              Path("backend/research/strategy11_synthesis_factorial_replay_v1.py"): {
                  "_mapping": "mapping",
                  "_string": "string",
                  "_sha": "sha256",
                  "_bool": "boolean",
                  "_integer": "integer",
                  "_number": "number",
              },
              Path("backend/research/strategy11_component_attribution_v1.py"): {
                  "_mapping": "mapping",
                  "_string": "string",
                  "_number": "number",
                  "_bool": "boolean",
              },
              Path("backend/research/strategy11_synthesis_sealer_v1.py"): {
                  "_mapping": "mapping",
                  "_string": "string",
                  "_sha": "sha256",
                  "_bool": "boolean",
                  "_integer": "integer",
                  "_number": "number",
              },
          }
          import_line = "from backend.contracts.strategy11_validation_primitives_v1 import ValidationPrimitives"

          for path, aliases in targets.items():
              text = path.read_text(encoding="utf-8")
              if import_line in text and "_validation = ValidationPrimitives(_fail)" in text:
                  continue
              tree = ast.parse(text, filename=str(path))
              imports = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom))]
              import_end = max(node.end_lineno for node in imports)
              functions = {
                  node.name: node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }
              if "_fail" not in functions:
                  raise SystemExit(f"FAIL_FUNCTION_MISSING:{path}")
              missing = sorted(set(aliases) - set(functions))
              if missing:
                  raise SystemExit(f"VALIDATOR_FUNCTIONS_MISSING:{path}:{','.join(missing)}")
              removal_lines = set()
              for name in aliases:
                  node = functions[name]
                  removal_lines.update(range(node.lineno, node.end_lineno + 1))
                  removal_lines.add(node.end_lineno + 1)
              fail_end = functions["_fail"].end_lineno
              assignment_lines = ["", "_validation = ValidationPrimitives(_fail)"]
              assignment_lines.extend(f"{name} = _validation.{method}" for name, method in aliases.items())
              assignment_lines.append("")

              output = []
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if line_number not in removal_lines:
                      output.append(line)
                  if line_number == import_end:
                      output.append(import_line)
                  if line_number == fail_end:
                      output.extend(assignment_lines)
              updated = "\n".join(output).rstrip() + "\n"
              parsed = ast.parse(updated, filename=str(path))
              remaining = {
                  node.name for node in parsed.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }
              stale = sorted(set(aliases) & remaining)
              if stale:
                  raise SystemExit(f"LOCAL_VALIDATORS_REMAIN:{path}:{','.join(stale)}")
              if updated.count(import_line) != 1:
                  raise SystemExit(f"VALIDATION_IMPORT_COUNT:{path}:{updated.count(import_line)}")
              path.write_text(updated, encoding="utf-8")
          PY
      - name: Compile migrated synthesis chain
        run: |
          python -m py_compile \
            backend/contracts/strategy11_validation_primitives_v1.py \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/research/strategy11_component_attribution_v1.py \
            backend/research/strategy11_synthesis_sealer_v1.py \
            backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py
          git diff --check
      - name: Run primitive and existing chain fixtures
        run: |
          python backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py
          python backend/tools/r7a4d_strategy11_bounded_synthesis_constructor_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py
          python backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_sealer_fixture_v1.py
      - name: Commit bounded synthesis validation migration
        run: |
          if git diff --quiet; then
            echo "No migration needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/research/strategy11_component_attribution_v1.py \
            backend/research/strategy11_synthesis_sealer_v1.py
          git commit -m "Share validation primitives across the synthesis chain"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
