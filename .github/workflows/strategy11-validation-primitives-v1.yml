name: Strategy11 Validation Primitives V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/contracts/strategy11_validation_primitives_v1.py"
      - "backend/research/strategy11_synthesis_material_registry_v1.py"
      - "backend/research/strategy11_bounded_synthesis_constructor_v1.py"
      - "backend/research/strategy11_synthesis_factorial_replay_v1.py"
      - "backend/research/strategy11_component_attribution_v1.py"
      - "backend/research/strategy11_synthesis_sealer_v1.py"
      - "backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py"
      - ".github/workflows/strategy11-validation-primitives-v1.yml"
  push:
    branches: [master]
    paths:
      - "backend/contracts/strategy11_validation_primitives_v1.py"
      - "backend/research/strategy11_synthesis_material_registry_v1.py"
      - "backend/research/strategy11_bounded_synthesis_constructor_v1.py"
      - "backend/research/strategy11_synthesis_factorial_replay_v1.py"
      - "backend/research/strategy11_component_attribution_v1.py"
      - "backend/research/strategy11_synthesis_sealer_v1.py"
      - "backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py"
      - ".github/workflows/strategy11-validation-primitives-v1.yml"

permissions:
  contents: read

concurrency:
  group: strategy11-validation-primitives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile shared validation chain
        run: |
          python -m py_compile \
            backend/contracts/strategy11_validation_primitives_v1.py \
            backend/research/strategy11_synthesis_material_registry_v1.py \
            backend/research/strategy11_bounded_synthesis_constructor_v1.py \
            backend/research/strategy11_synthesis_factorial_replay_v1.py \
            backend/research/strategy11_component_attribution_v1.py \
            backend/research/strategy11_synthesis_sealer_v1.py \
            backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py
      - name: Run primitive and synthesis regression fixtures
        run: |
          python backend/tools/r7a4d_strategy11_validation_primitives_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_material_registry_fixture_v1.py
          python backend/tools/r7a4d_strategy11_bounded_synthesis_constructor_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_factorial_replay_fixture_v1.py
          python backend/tools/r7a4d_strategy11_component_attribution_fixture_v1.py
          python backend/tools/r7a4d_strategy11_synthesis_sealer_fixture_v1.py
      - name: Assert blocked authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('artifacts/strategy11_validation_primitives_v1/summary.json').read_text())
          assert summary['state']=='PASS_STRATEGY11_VALIDATION_PRIMITIVES', summary
          assert summary['error_code_preserved'] is True
          assert summary['mapping_copy_verified'] is True
          assert summary['research_only'] is True
          assert summary['promotion_authority'] is False
          assert summary['protected_mutations']==0
          assert summary['execution_allowed'] is False
          assert summary['order_authority']=='BLOCKED'
          assert summary['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy11-validation-primitives-${{ github.run_id }}
          path: artifacts/strategy11_validation_primitives_v1
          if-no-files-found: error
