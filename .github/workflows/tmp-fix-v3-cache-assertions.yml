name: TMP Fix V3 Cache Assertions

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-fix-v3-cache-assertions.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-v3-fast-causal-resume
          token: ${{ github.token }}
      - name: Fix cache assertions
        run: |
          python -c "from pathlib import Path; p=Path('.github/workflows/strategy11-v3-fast-causal-resume.yml'); s=p.read_text(); old=\"              assert fast.cache_hits['supertrend']>0\\n              assert fast.cache_hits['ema']>0\\n              assert fast.cache_hits['regime']>0\\n              assert fast.cache_hits['decision']>0\\n\"; new=\"              assert len(fast.supertrend_cache)>0\\n              assert len(fast.ema_cache)>0\\n              assert fast.cache_hits['regime']>0\\n              assert fast.cache_hits['decision']>0\\n\"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/strategy11-v3-fast-causal-resume.yml
          git commit -m 'Fix V3 rolling cache validation assertions'
          git push origin HEAD:strategy11-v3-fast-causal-resume
