name: Temporary Strategy11 Alpha Route Branch Patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/tmp-strategy11-alpha-route-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-alpha-authority-route-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route Alpha out of general lane replay
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/r7a4d-strategy11-unattended-improvement-v2.yml')
          text=path.read_text()
          text=text.replace(
              '      - backend/tools/strategy11_unattended_improvement_v2.py\n',
              '      - backend/tools/strategy11_unattended_improvement_v2.py\n      - backend/tools/strategy11_unattended_improvement_router_v2_1.py\n      - backend/research/strategy11_alpha_authority_route_v1.json\n',
          )
          text=text.replace(
              '            backend/tools/strategy11_unattended_improvement_v2.py \\\n            backend/tools/strategy11_unattended_improvement_replay_v2.py \\\n',
              '            backend/tools/strategy11_unattended_improvement_v2.py \\\n            backend/tools/strategy11_unattended_improvement_router_v2_1.py \\\n            backend/tools/strategy11_unattended_improvement_replay_v2.py \\\n',
          )
          old_plan='''          python backend/tools/strategy11_unattended_improvement_v2.py \\
            --mode plan \\
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \\
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \\
            --baseline-final "$(cat input/baseline-final-path.txt)" \\
            "${previous_args[@]}" \\
            --out out/plan\n'''
          new_plan='''          python backend/tools/strategy11_unattended_improvement_router_v2_1.py \\
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \\
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \\
            --baseline-final "$(cat input/baseline-final-path.txt)" \\
            --alpha-authority backend/research/strategy11_alpha_authority_route_v1.json \\
            "${previous_args[@]}" \\
            --out out/plan\n'''
          if old_plan not in text:
              raise SystemExit('PLAN_COMMAND_NOT_FOUND')
          text=text.replace(old_plan,new_plan,1)
          old_cutoff='''          python backend/tools/strategy11_unattended_improvement_v2.py \\
            --mode plan \\
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \\
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \\
            --baseline-final "$(cat input/baseline-final-path.txt)" \\
            --now-utc 2026-08-01T08:30:01Z \\
            --out out/cutoff\n'''
          new_cutoff='''          python backend/tools/strategy11_unattended_improvement_router_v2_1.py \\
            --policy backend/research/strategy11_unattended_improvement_policy_v2.json \\
            --catalog backend/research/strategy11_famous_indicator_catalog_v1.json \\
            --baseline-final "$(cat input/baseline-final-path.txt)" \\
            --alpha-authority backend/research/strategy11_alpha_authority_route_v1.json \\
            --now-utc 2026-08-01T08:30:01Z \\
            --out out/cutoff\n'''
          if old_cutoff not in text:
              raise SystemExit('CUTOFF_COMMAND_NOT_FOUND')
          text=text.replace(old_cutoff,new_cutoff,1)
          marker="""          assert plan['strategy_count_total']==25\n          assert sum(plan['lane_counts'].values())==25\n"""
          addition=marker+"""          assert len(plan['special_routes'])==1\n          assert plan['special_routes'][0]['strategy_id']=='alpha_combo'\n          assert plan['special_routes'][0]['route']=='ALPHA_W1_MULTIOBJECTIVE_CONFIRMATION'\n          assert 'alpha_combo' not in plan['active_strategy_ids']\n"""
          if marker not in text:
              raise SystemExit('PLAN_ASSERT_MARKER_NOT_FOUND')
          text=text.replace(marker,addition,1)
          cutoff_marker="""          assert row['state']=='COMPLETE_CUTOFF_NO_NEW_REPLAY'\n          assert row['candidate_count']==0 and row['rows']==[]\n"""
          cutoff_add=cutoff_marker+"""          assert row['special_routes'][0]['route']=='ALPHA_W1_MULTIOBJECTIVE_CONFIRMATION'\n"""
          if cutoff_marker not in text:
              raise SystemExit('CUTOFF_ASSERT_MARKER_NOT_FOUND')
          text=text.replace(cutoff_marker,cutoff_add,1)
          path.write_text(text)
          PY
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/r7a4d-strategy11-unattended-improvement-v2.yml').read_text())
          PY
          PYTHONPATH=. python backend/tools/strategy11_unattended_improvement_router_fixture_v2_1.py
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/r7a4d-strategy11-unattended-improvement-v2.yml
          git commit -m "Route Alpha authority outside general unattended lanes"
          git push origin HEAD:strategy11-alpha-authority-route-v1
