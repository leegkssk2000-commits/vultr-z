name: TMP Strategy11 Runtime Hardening Writer

on:
  workflow_dispatch:
  push:
    branches: [strategy11-runtime-system-hardening-v1]
    paths:
      - ".github/workflows/tmp-strategy11-runtime-hardening-writer.yml"

permissions:
  contents: write

concurrency:
  group: tmp-strategy11-runtime-hardening-writer
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy11-runtime-system-hardening-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch audit and create canonical quota state fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path("backend/tools/strategy11_runtime_system_audit_v1.py")
          text = audit.read_text(encoding="utf-8")
          old_skip = 'SKIP_PARTS = {".git", "node_modules", "dist", "build", "__pycache__", ".venv", "venv"}'
          new_skip = 'SKIP_PARTS = {".git", "node_modules", "dist", "build", "artifacts", "__pycache__", ".venv", "venv"}'
          if old_skip not in text:
              raise SystemExit("SKIP_PARTS_PATTERN_MISSING")
          text = text.replace(old_skip, new_skip, 1)
          old_suffix = 'TEXT_SUFFIXES = {".py", ".json", ".yml", ".yaml", ".md", ".txt", ".toml", ".ini", ".cfg", ".service", ".timer", ".sh", ".js", ".ts", ".tsx"}'
          new_suffix = 'TEXT_SUFFIXES = {".py", ".json", ".yml", ".yaml", ".html", ".css", ".md", ".txt", ".toml", ".ini", ".cfg", ".service", ".timer", ".sh", ".js", ".ts", ".tsx"}'
          if old_suffix not in text:
              raise SystemExit("TEXT_SUFFIX_PATTERN_MISSING")
          text = text.replace(old_suffix, new_suffix, 1)
          old_fn = '''def runtime_named_files(files: Iterable[TextFile]) -> list[TextFile]:
    return [row for row in files if any("runtime" in part.lower() for part in Path(row.rel).parts)]
'''
          new_fn = '''def runtime_named_files(files: Iterable[TextFile]) -> list[TextFile]:
    allowed_suffixes = {".py", ".js", ".ts", ".tsx", ".json", ".service", ".timer", ".sh"}
    result: list[TextFile] = []
    for row in files:
        name = row.path.name.lower()
        if "runtime" not in name or row.path.suffix.lower() not in allowed_suffixes:
            continue
        if row.rel.startswith(".github/workflows/"):
            continue
        if row.rel == "backend/tools/strategy11_runtime_system_audit_v1.py":
            continue
        result.append(row)
    return result
'''
          if old_fn not in text:
              raise SystemExit("RUNTIME_FUNCTION_PATTERN_MISSING")
          text = text.replace(old_fn, new_fn, 1)
          audit.write_text(text, encoding="utf-8")

          old = Path("backend/tools/r7a4d_strategy11_generation7_quota_runtime_fixture_v1.py")
          new = Path("backend/tools/r7a4d_strategy11_generation7_quota_state_fixture_v1.py")
          if not old.is_file():
              raise SystemExit("OLD_QUOTA_FIXTURE_MISSING")
          if not new.exists():
              new.write_text(old.read_text(encoding="utf-8"), encoding="utf-8")

          index = Path("frontend/z-os-app-source/baseline/index.html").read_text(encoding="utf-8")
          for required in (
              "z_emergency_runtime_guard_v2.js",
              "zel_source_envelope_runtime.js",
              "zops_runtime_guard_v1.js",
          ):
              if required not in index:
                  raise SystemExit(f"BASELINE_RUNTIME_REFERENCE_MISSING:{required}")
          PY
          python -m py_compile \
            backend/tools/strategy11_runtime_system_audit_v1.py \
            backend/tools/r7a4d_strategy11_generation7_quota_state_fixture_v1.py
      - name: Commit bounded source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tools/strategy11_runtime_system_audit_v1.py backend/tools/r7a4d_strategy11_generation7_quota_state_fixture_v1.py
          git diff --cached --check
          git commit -m "Correct runtime authority audit and stage canonical quota fixture"
          git push origin HEAD:strategy11-runtime-system-hardening-v1
