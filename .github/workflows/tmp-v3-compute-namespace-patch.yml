name: TMP V3 Compute Namespace Patcher

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-v3-compute-namespace-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7a4d-strategy11-v3-internal-regime-expanded
          fetch-depth: 0
      - name: Patch compute namespace activation
        run: |
          python - <<'PY'
          from pathlib import Path
          registry=Path('backend/tools/strategy11_internal_condition_registry_v3.py')
          text=registry.read_text()
          needle='def build_registry(compute_root: Path, policy: Mapping[str, Any]) -> dict[str, Any]:\n    registry_path'
          replacement='''def activate_compute_namespace(compute_root: Path) -> None:\n    root = str(compute_root)\n    if root not in sys.path:\n        sys.path.insert(0, root)\n    import backend\n    backend_path = str(compute_root / "backend")\n    if hasattr(backend, "__path__") and backend_path not in backend.__path__:\n        backend.__path__.insert(0, backend_path)\n\n\ndef build_registry(compute_root: Path, policy: Mapping[str, Any]) -> dict[str, Any]:\n    activate_compute_namespace(compute_root)\n    registry_path'''
          if needle not in text:
              raise SystemExit('REGISTRY_PATCH_NEEDLE_MISSING')
          registry.write_text(text.replace(needle,replacement,1))

          expanded=Path('backend/tools/strategy11_expanded_discovery_v3.py')
          text=expanded.read_text()
          needle='''def exact_module(compute_root: Path) -> Any:\n    if str(compute_root) not in sys.path:\n        sys.path.insert(0, str(compute_root))\n    return load_module'''
          replacement='''def activate_compute_namespace(compute_root: Path) -> None:\n    root = str(compute_root)\n    if root not in sys.path:\n        sys.path.insert(0, root)\n    import backend\n    backend_path = str(compute_root / "backend")\n    if hasattr(backend, "__path__") and backend_path not in backend.__path__:\n        backend.__path__.insert(0, backend_path)\n\n\ndef exact_module(compute_root: Path) -> Any:\n    activate_compute_namespace(compute_root)\n    return load_module'''
          if needle not in text:
              raise SystemExit('EXPANDED_PATCH_NEEDLE_MISSING')
          expanded.write_text(text.replace(needle,replacement,1))
          PY
          python -m py_compile backend/tools/strategy11_internal_condition_registry_v3.py backend/tools/strategy11_expanded_discovery_v3.py
          git diff --check
      - name: Commit branch patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tools/strategy11_internal_condition_registry_v3.py backend/tools/strategy11_expanded_discovery_v3.py
          git commit -m 'Fix V3 compute namespace resolution'
          git push origin HEAD:r7a4d-strategy11-v3-internal-regime-expanded
