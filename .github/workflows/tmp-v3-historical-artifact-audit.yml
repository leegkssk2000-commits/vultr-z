name: TMP V3 Historical Artifact Audit

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-v3-historical-artifact-audit.yml']

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Query exact historical workflow and artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sleep 10
          mkdir -p .github/manual_trigger_receipts/v3-historical
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/r7a4d-strategy11-shadow-funnel.yml/runs?per_page=100" > .github/manual_trigger_receipts/v3-historical/shadow_funnel_runs_raw.json
          python - <<'PY'
          import json,os,subprocess
          runs=json.load(open('.github/manual_trigger_receipts/v3-historical/shadow_funnel_runs_raw.json')).get('workflow_runs',[])
          run_rows=[{'id':r.get('id'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'head_branch':r.get('head_branch'),'event':r.get('event'),'created_at':r.get('created_at')} for r in runs]
          artifacts=[]
          for page in range(1,21):
              payload=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts?per_page=100&page={page}']))
              items=payload.get('artifacts',[])
              if not items: break
              for row in items:
                  if row.get('name')=='strategy11-shadow-funnel-v1':
                      run=row.get('workflow_run') or {}
                      artifacts.append({'id':row.get('id'),'name':row.get('name'),'expired':row.get('expired'),'size_in_bytes':row.get('size_in_bytes'),'created_at':row.get('created_at'),'run_id':run.get('id'),'head_sha':run.get('head_sha'),'head_branch':run.get('head_branch')})
          artifacts.sort(key=lambda x:str(x.get('created_at') or ''),reverse=True)
          out={'workflow_runs':run_rows,'matching_artifacts':artifacts,'matching_count':len(artifacts)}
          open('.github/manual_trigger_receipts/v3-historical/shadow_funnel_exact.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/manual_trigger_receipts/v3-historical/shadow_funnel_exact.json
          git commit -m 'Record exact Strategy11 shadow funnel archives'
          git push
# exact-shadow-funnel
