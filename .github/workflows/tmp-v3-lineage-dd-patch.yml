name: TMP V3 Lineage DD Patcher

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-v3-lineage-dd-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7a4d-strategy11-v3-internal-regime-expanded
          fetch-depth: 0
      - name: Patch chronology and candidate digest
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/tools/strategy11_expanded_discovery_v3.py')
          text=p.read_text()
          old='ledgers.append(sorted(repeat_trades, key=lambda value: (value.get("window_id"), value.get("symbol"), value.get("entry_ts"), value.get("exit_ts"))))'
          new='ledgers.append(sorted(repeat_trades, key=lambda value: (value.get("window_id"), value.get("entry_ts"), value.get("exit_ts"), value.get("symbol"))))'
          if old not in text: raise SystemExit('SORT_NEEDLE_MISSING')
          text=text.replace(old,new,1)
          old='"candidate_spec_sha256": stable_sha(variant)'
          new='"candidate_spec_sha256": variant.get("candidate_spec_sha256") or stable_sha({key: value for key, value in variant.items() if key != "candidate_spec_sha256"})'
          if old not in text: raise SystemExit('DIGEST_NEEDLE_MISSING')
          text=text.replace(old,new,1)
          old='''    expected = set(plan.get("active_strategy_ids", [])); observed = {str(row["strategy_id"]) for row in rows}\n    blockers: list[str] = []'''
          new='''    expected = set(plan.get("active_strategy_ids", [])); observed = {str(row["strategy_id"]) for row in rows}\n    plan_digests = {(str(row["strategy_id"]), str(candidate_id)): str(row["candidate_specs"][candidate_id]["candidate_spec_sha256"]) for row in plan.get("rows", []) for candidate_id in row.get("candidate_ids", [])}\n    blockers: list[str] = []'''
          if old not in text: raise SystemExit('AGG_HEADER_NEEDLE_MISSING')
          text=text.replace(old,new,1)
          old='''            if variant.get("parity", {}).get("state") != "PASS":\n                blockers.append(f"PARITY:{row['strategy_id']}:{variant.get('variant_id')}")'''
          new='''            if variant.get("parity", {}).get("state") != "PASS":\n                blockers.append(f"PARITY:{row['strategy_id']}:{variant.get('variant_id')}")\n            expected_digest = plan_digests.get((str(row["strategy_id"]), str(variant.get("variant_id"))))\n            if not expected_digest or variant.get("candidate_spec_sha256") != expected_digest:\n                blockers.append(f"CANDIDATE_DIGEST:{row['strategy_id']}:{variant.get('variant_id')}")'''
          if old not in text: raise SystemExit('AGG_DIGEST_NEEDLE_MISSING')
          p.write_text(text.replace(old,new,1))
          PY
          python -m py_compile backend/tools/strategy11_expanded_discovery_v3.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tools/strategy11_expanded_discovery_v3.py
          git commit -m 'Preserve V3 candidate lineage and chronological drawdown'
          git push origin HEAD:r7a4d-strategy11-v3-internal-regime-expanded
