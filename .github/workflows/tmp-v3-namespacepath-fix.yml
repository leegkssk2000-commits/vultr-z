name: TMP V3 NamespacePath Compatibility Fix

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-v3-namespacepath-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Replace NamespacePath mutation with list assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            Path('backend/tools/strategy11_internal_condition_registry_v3.py'),
            Path('backend/tools/strategy11_expanded_discovery_v3.py'),
          ]
          old='''    if hasattr(backend, "__path__") and backend_path not in backend.__path__:\n        backend.__path__.insert(0, backend_path)'''
          new='''    if hasattr(backend, "__path__") and backend_path not in backend.__path__:\n        backend.__path__ = [backend_path, *list(backend.__path__)]'''
          for path in paths:
              text=path.read_text()
              if old not in text:
                  raise SystemExit(f'PATCH_NEEDLE_MISSING:{path}')
              path.write_text(text.replace(old,new,1))
          PY
          python -m py_compile backend/tools/strategy11_internal_condition_registry_v3.py backend/tools/strategy11_expanded_discovery_v3.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tools/strategy11_internal_condition_registry_v3.py backend/tools/strategy11_expanded_discovery_v3.py
          git commit -m 'Fix V3 NamespacePath compatibility'
          git push
