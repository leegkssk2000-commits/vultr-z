name: TMP V3 Run Status Query

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-v3-status-query.yml']

permissions:
  contents: write
  actions: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Query V3 master runs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p .github/manual_trigger_receipts
          gh run list --repo "$GITHUB_REPOSITORY" --workflow r7a4d-strategy11-v3-internal-regime-expanded.yml --branch master --limit 5 --json databaseId,status,conclusion,event,headSha,createdAt,url > .github/manual_trigger_receipts/v3-master-latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/manual_trigger_receipts/v3-master-latest.json
          git commit -m 'Refresh V3 master run status'
          git push
# refresh-2
