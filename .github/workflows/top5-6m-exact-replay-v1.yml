name: Top5 Frozen 6M Exact Replay V1

on:
  push:
    branches: [research/top5-6m-exact-replay-v1]
    paths:
      - 'backend/research/rebuild/top5_6m_exact_historical_replay_v1.py'
      - 'backend/research/rebuild/top5_6m_exact_lane_runner_v1.py'
      - 'backend/research/rebuild/top5_6m_exact_aggregate_v1.py'
      - '.github/workflows/top5-6m-exact-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: TOP5_6M_EXACT_HISTORICAL_REPLAY_V1
  cancel-in-progress: false

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: keltner
            strategy_name: Keltner Reclaim
          - lane: supertrend
            strategy_name: Supertrend Momentum
          - lane: squeeze_kr3
            strategy_name: Squeeze-KR3 Unified
          - lane: trend_rider
            strategy_name: TrendRider Unified
          - lane: q0
            strategy_name: Q0 Channel Breakout
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top5-6m-exact-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Compile replay harnesses
        run: |
          python3 -B -m py_compile backend/research/rebuild/top5_6m_exact_historical_replay_v1.py
          python3 -B -m py_compile backend/research/rebuild/top5_6m_exact_lane_runner_v1.py
          python3 -B -m py_compile backend/research/rebuild/top5_6m_exact_aggregate_v1.py

      - name: Check durable lane checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          p="research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/LANES/${{ matrix.lane }}.json"
          if [[ -s "$p" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "REUSE_CHECKPOINT:$p"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run frozen 6M lane replay
        if: steps.checkpoint.outputs.exists != 'true'
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          python3 -B -m backend.research.rebuild.top5_6m_exact_lane_runner_v1 \
            --lane "${{ matrix.lane }}" \
            --out "out/${{ matrix.lane }}.json"

      - name: Persist durable lane checkpoint
        if: steps.checkpoint.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'top5-6m-exact-replay-v1'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin research/top5-6m-exact-replay-v1
          mkdir -p research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/LANES
          cp "out/${{ matrix.lane }}.json" "research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/LANES/${{ matrix.lane }}.json"
          git add "research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/LANES/${{ matrix.lane }}.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist Top5 6M lane ${{ matrix.lane }} [skip ci]"
          for n in 1 2 3; do
            if git push origin HEAD:research/top5-6m-exact-replay-v1; then exit 0; fi
            git pull --rebase origin research/top5-6m-exact-replay-v1
            sleep $((n*3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-6m-exact-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/${{ matrix.lane }}.json
            research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/LANES/${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: always()
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top5-6m-exact-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh durable checkpoints
        run: git pull --rebase origin research/top5-6m-exact-replay-v1

      - name: Build aggregate status
        run: |
          mkdir -p out
          python3 -B -m backend.research.rebuild.top5_6m_exact_aggregate_v1 \
            --out out/top5_6m_exact_historical_replay_v1.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-6m-exact-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/top5_6m_exact_historical_replay_v1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Require all five terminal lanes
        run: |
          python3 -B -m backend.research.rebuild.top5_6m_exact_aggregate_v1 \
            --require-complete \
            --out out/top5_6m_exact_historical_replay_v1.json

      - name: Persist final terminal receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'top5-6m-exact-replay-v1'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin research/top5-6m-exact-replay-v1
          mkdir -p research/development_evidence/TOP5_6M_EXACT_REPLAY_V1
          cp out/top5_6m_exact_historical_replay_v1.json research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/RESULT.json
          git add research/development_evidence/TOP5_6M_EXACT_REPLAY_V1/RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: persist Top5 6M exact replay result [skip ci]'
          git push origin HEAD:research/top5-6m-exact-replay-v1
