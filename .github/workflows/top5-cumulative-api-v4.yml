name: Top5 Cumulative V4 Manual API
on:
  workflow_dispatch:
    inputs:
      allow_network:
        type: boolean
        default: false
      route:
        type: choice
        default: winrate
        options: [winrate, kr3]
      approval_file:
        type: string
        default: 'research/development_evidence/TOP5_AFTER_PR1206_WINRATE_FIRST_AI_V1/API/API_APPROVAL.json'
permissions:
  contents: read
concurrency:
  group: top5-shared-ai-budget-pr1204-pr1205
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Presence only without network or secret values
        env:
          REVIEW_ROUTE: ${{ inputs.route }}
        run: |
          case "$REVIEW_ROUTE" in
            kr3) python -m backend.research.rebuild.step7_kr3_review_route_v1 --no-network ;;
            winrate) python -m backend.research.rebuild.api_winrate_runtime_v1 --no-network ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-cumulative-api-probe-${{ github.run_id }}
          path: |
            out/top5-winrate-api-v5.json
            out/step7-kr3-review.json
  pilot:
    needs: probe
    if: github.event_name == 'workflow_dispatch' && inputs.allow_network == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      APPROVAL_FILE: ${{ inputs.approval_file }}
      REVIEW_ROUTE: ${{ inputs.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact manual approval with committed shared reservation
        run: |
          case "$REVIEW_ROUTE" in
            kr3) python -m backend.research.rebuild.step7_kr3_review_route_v1 --approval "$APPROVAL_FILE" ;;
            winrate) python -m backend.research.rebuild.api_winrate_runtime_v1 --approval "$APPROVAL_FILE" ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-cumulative-api-pilot-${{ github.run_id }}
          path: |
            out/top5-winrate-api-v5.json
            out/step7-kr3-review.json
