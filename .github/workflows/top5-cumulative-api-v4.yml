name: Top5 Cumulative V4 Manual API
on:
  workflow_dispatch:
    inputs:
      allow_network:
        type: boolean
        default: false
      approval_file:
        type: string
        default: 'research/development_evidence/TOP5_AFTER_PR1205_CUMULATIVE_DEV_G5_SUBAGENTS_V1/API/API_APPROVAL.json'
permissions:
  contents: read
concurrency:
  group: top5-shared-ai-budget-pr1204-pr1205
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Presence only without network or secret values
        run: python -m backend.research.rebuild.api_pilot_runtime_v2 --no-network
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-cumulative-api-probe-${{ github.run_id }}
          path: out/top5-cumulative-api-v4.json
  pilot:
    needs: probe
    if: github.event_name == 'workflow_dispatch' && inputs.allow_network == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      APPROVAL_FILE: ${{ inputs.approval_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact manual approval with committed shared reservation
        run: python -m backend.research.rebuild.api_pilot_runtime_v2 --approval "$APPROVAL_FILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-cumulative-api-pilot-${{ github.run_id }}
          path: out/top5-cumulative-api-v4.json
