name: Top5 Cumulative Development Repair V1
on:
  push:
    branches: [master, research/top5-cumulative-dev-improvement-v1]
    paths:
      - 'backend/research/rebuild/*top5_development*.py'
      - 'backend/research/contracts/top5_development_*.json'
      - 'research/development_evidence/TOP5_DEV_REPAIR_20260905_V1/**'
      - '.github/workflows/top5-development-repair-v1.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/*top5_development*.py'
      - 'backend/research/contracts/top5_development_*.json'
      - 'research/development_evidence/TOP5_DEV_REPAIR_20260905_V1/**'
      - '.github/workflows/top5-development-repair-v1.yml'
permissions:
  contents: read
concurrency:
  group: top5-development-repair-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native parity and development isolation regression
        run: |
          set -euo pipefail
          python -m compileall -q backend
          python -m unittest backend.research.rebuild.test_top5_development_repair_v1 backend.research.architecture_factory.test_g5a_development_probe_v1 backend.research.architecture_factory.test_g5a_development_event_evaluator_v1 -v
          python -m backend.research.alpha_proof.a1_alpha_proof_gate_v1 --self-test
          python -m backend.research.architecture_factory.a1_common_source_semantic_guard_v1 --self-test
      - name: Reproduce committed development evidence without acquiring market data
        run: |
          set -euo pipefail
          data_ref=$(python -c "import json; print(json.load(open('backend/research/contracts/top5_development_repair_v1.json'))['data_ref'])")
          git fetch --no-tags origin "$data_ref"
          mkdir -p /tmp/top5-dev-input
          git archive "$data_ref" research/data/g5a_stage_v1/development_manifest.json research/data/g5a_stage_v1/ohlcv research/data/g5a_stage_v1/cost | tar -x -C /tmp/top5-dev-input
          python -m backend.research.rebuild.top5_development_repair_v1 --stage baseline --data-dir /tmp/top5-dev-input/research/data/g5a_stage_v1 --verify-only
          if test -f research/development_evidence/TOP5_DEV_REPAIR_20260905_V1/comparison/receipt.json; then
            python -m backend.research.rebuild.top5_development_repair_v1 --stage comparison --data-dir /tmp/top5-dev-input/research/data/g5a_stage_v1 --verify-only
            python -m backend.research.rebuild.top5_development_path_audit_v1 --data-dir /tmp/top5-dev-input/research/data/g5a_stage_v1 --verify-only
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/development_evidence/TOP5_DEV_REPAIR_20260905_V1
          retention-days: 90
