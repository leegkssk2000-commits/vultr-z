name: Top5 G5A Phase-1 Monitor 1313

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/rebuild/top5_g5a_phase1_monitor_v1.py'
      - '.github/workflows/top5-g5a-phase1-monitor-1313.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: TOP5_G5A_PHASE1_MONITOR_V1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compile and self-test read-only monitor
        run: |
          set -euo pipefail
          python3 -B -m py_compile backend/research/rebuild/top5_g5a_phase1_monitor_v1.py
          python3 -B -m backend.research.rebuild.top5_g5a_phase1_monitor_v1 --self-test
          python3 -B -m backend.research.rebuild.top5_g5a_phase1_monitor_v1 --output /tmp/top5-g5a-phase1.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/top5-g5a-phase1.json'))
          assert p['scope_key']=='TOP5_G5A_FRESH_COLLECTION_AFTER_PHASE0_V1'
          assert len(p['active_top5'])==5
          assert p['reserve']==['Break & Continue']
          assert p['formal_pass_authority'] is False
          assert p['strategy_mutation'] is False
          assert p['historical_backfill'] is False
          assert p['g5a_rows_reusable_for_g5b'] is False
          print('PASS_TOP5_G5A_PHASE1_MONITOR_CONTRACT')
          PY

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Build lane-local Phase-1 matrix from persisted collector states
        run: |
          set -euo pipefail
          mkdir -p /tmp/g5a-monitor
          python3 -B -m backend.research.rebuild.top5_g5a_phase1_monitor_v1 --output /tmp/g5a-monitor/TOP5_G5A_PHASE1_STATUS_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-g5a-phase1-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/g5a-monitor/TOP5_G5A_PHASE1_STATUS_V1.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist only semantic status deltas
        run: |
          set -euo pipefail
          target=research/g5/TOP5_G5A_PHASE1_STATUS_V1.json
          generated=/tmp/g5a-monitor/TOP5_G5A_PHASE1_STATUS_V1.json
          git config user.name 'top5-g5a-phase1-monitor-v1'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git switch --detach origin/master
            python3 - "$target" "$generated" <<'PY'
          import copy,json,sys
          from pathlib import Path
          target=Path(sys.argv[1]); generated=Path(sys.argv[2])
          new=json.loads(generated.read_text())
          old=json.loads(target.read_text()) if target.is_file() else None
          def semantic(x):
              y=copy.deepcopy(x)
              y.pop('observed_at_ms',None)
              return y
          if old is not None and semantic(old)==semantic(new):
              Path('/tmp/no-semantic-delta').write_text('1\n')
              raise SystemExit(0)
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(new,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
            if [[ -f /tmp/no-semantic-delta ]]; then exit 0; fi
            git add "$target"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'G5A: persist Top5 Phase-1 status matrix [skip ci]'
            if git push origin HEAD:master; then exit 0; fi
            rm -f /tmp/no-semantic-delta
            sleep $((attempt * 3))
          done
          exit 1
