name: Top5 Trader Benchmark Multi-AI V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/benchmark/top5_trader_benchmark_multi_ai_v1.py'
      - 'backend/research/benchmark/top5_trader_benchmark_multi_ai_v2.py'
      - 'backend/research/benchmark/test_top5_trader_benchmark_multi_ai_v1.py'
      - 'backend/research/benchmark/test_top5_trader_benchmark_multi_ai_v2.py'
      - '.github/workflows/top5-trader-benchmark-multi-ai-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/benchmark/top5_trader_benchmark_multi_ai_v1.py'
      - 'backend/research/benchmark/top5_trader_benchmark_multi_ai_v2.py'
      - 'backend/research/benchmark/test_top5_trader_benchmark_multi_ai_v1.py'
      - 'backend/research/benchmark/test_top5_trader_benchmark_multi_ai_v2.py'
      - '.github/workflows/top5-trader-benchmark-multi-ai-v2.yml'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: top5-trader-benchmark-multi-ai-v2
  cancel-in-progress: false

env:
  TOKEN: RUN_TOP5_TRADER_BENCHMARK_MULTI_AI_V2_ONCE
  CLAIM_BRANCH: research/receipt-top5-trader-benchmark-multi-ai-v2
  EVIDENCE_DIR: research/development_evidence/TOP5_TRADER_BENCHMARK_MULTI_AI_AFTER_PR1255_V1

jobs:
  offline-verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Required AGENTS precheck
        run: |
          set -euo pipefail
          pwd
          ls -la frontend/z-os-app-source
          cat frontend/z-os-app-source/package.json
          npm run --prefix frontend/z-os-app-source validate
      - name: Compile and bounded offline tests
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          python -m py_compile backend/research/benchmark/top5_trader_benchmark_multi_ai_v1.py
          python -m py_compile backend/research/benchmark/top5_trader_benchmark_multi_ai_v2.py
          python -m unittest backend.research.benchmark.test_top5_trader_benchmark_multi_ai_v1 backend.research.benchmark.test_top5_trader_benchmark_multi_ai_v2 -v
          python -m backend.research.benchmark.top5_trader_benchmark_multi_ai_v1 --self-test
          python -m backend.research.benchmark.top5_trader_benchmark_multi_ai_v2 --self-test
          python -m backend.research.benchmark.top5_trader_benchmark_multi_ai_v2 > /tmp/top5-dry.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/top5-dry.json'))
          assert r['state']=='PASS_OFFLINE_TOP5_BENCHMARK_CONTRACT',r
          assert r['generation_call_cap']==2,r
          assert r['selection_authority'] is False and r['promotion_authority'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED' and r['live_trade_authority']=='BLOCKED',r
          print('PASS_TOP5_TRADER_BENCHMARK_V2_OFFLINE_VERIFY')
          PY

  execute-once:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_TOP5_TRADER_BENCHMARK_MULTI_AI_V2_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve exact merged PR and reject duplicate receipt
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{os.environ['PR']}",
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r: p=json.load(r)
          assert p.get('merged_at') and p.get('merge_commit_sha'),'PR_NOT_MERGED'
          assert p.get('base',{}).get('ref')=='master','BASE_NOT_MASTER'
          assert p.get('head',{}).get('ref')=='research/top5-trader-benchmark-multi-ai-after-pr1255-v1','WRONG_REVIEWED_BRANCH'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('merge_sha='+p['merge_commit_sha']+'\n')
          print('BOUND_MERGE_SHA='+p['merge_commit_sha'])
          PY
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${CLAIM_BRANCH}" >/dev/null 2>&1; then
            echo 'DUPLICATE_SCOPE_RECEIPT_BRANCH_EXISTS'
            exit 19
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.bind.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact reviewed merge and timing guard
        env:
          MERGE_SHA: ${{ steps.bind.outputs.merge_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          python -m py_compile backend/research/benchmark/top5_trader_benchmark_multi_ai_v1.py backend/research/benchmark/top5_trader_benchmark_multi_ai_v2.py
          python -m unittest backend.research.benchmark.test_top5_trader_benchmark_multi_ai_v1 backend.research.benchmark.test_top5_trader_benchmark_multi_ai_v2 -v
          python -m backend.research.benchmark.top5_trader_benchmark_multi_ai_v2 --self-test
      - name: Create durable pre-call claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.bind.outputs.merge_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'top5-benchmark-receipt'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$CLAIM_BRANCH"
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import json,os
          p=os.path.join(os.environ['EVIDENCE_DIR'],'RUN_START.json')
          with open(p,'w') as f:
              json.dump({'scope_key':'TOP5_TRADER_BENCHMARK_MULTI_AI_AFTER_PR1255_V1','runner_version':'v2','state':'CLAIMED_BEFORE_EXTERNAL_AI','run_id':int(os.environ['RUN_ID']),'merge_sha':os.environ['MERGE_SHA'],'provider_generation_cap':2,'reserved_usd_cap':1.50,'billing_status':'UNKNOWN_NOT_SETTLED','next_bar_timing_guard':True},f,indent=2,sort_keys=True)
              f.write('\n')
          PY
          git add "$EVIDENCE_DIR/RUN_START.json"
          git commit -m 'research: claim Top5 multi-AI benchmark v2 execution [skip ci]'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${CLAIM_BRANCH}"
      - name: One-shot Gemini mapper + OpenAI red-team + corrected economic replay
        id: run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          python -m backend.research.benchmark.top5_trader_benchmark_multi_ai_v2 --run | tee /tmp/top5-run.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Persist final or partial receipt without provider retry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['EVIDENCE_DIR']); d.mkdir(parents=True,exist_ok=True)
          rc=int(os.environ.get('RC') or 1)
          (d/'WORKFLOW_TERMINAL.json').write_text(json.dumps({'run_id':int(os.environ['RUN_ID']),'runner_version':'v2','runner_rc':rc,'provider_retry_performed':False,'terminal':'COMPLETE' if rc==0 else 'PARTIAL_BLOCKED'},indent=2,sort_keys=True)+'\n')
          PY
          git add "$EVIDENCE_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist Top5 trader benchmark v2 evidence [skip ci]'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${CLAIM_BRANCH}"
          fi
      - name: Publish terminal summary to Issue 1256
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MERGE_SHA: ${{ steps.bind.outputs.merge_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          d=pathlib.Path(os.environ['EVIDENCE_DIR'])
          final=d/'FINAL.json'
          terminal=json.loads((d/'WORKFLOW_TERMINAL.json').read_text())
          if final.exists():
              r=json.loads(final.read_text()); c=r['economic_comparison']; p=c['same_snapshot_parent_metrics']; x=c['benchmark_child_metrics']; delta=c['delta']; providers=r['providers']; ti=c.get('trade_identity',{})
              body='\n'.join([
                  '<!-- TOP5_TRADER_BENCHMARK_MULTI_AI_V2 -->','## Top5 trader benchmark + multi-AI terminal',
                  f"run={os.environ['RUN_ID']}|merge={os.environ['MERGE_SHA']}|receipt_branch={os.environ['CLAIM_BRANCH']}|state={r['state']}|timing={r.get('timing_repair')}",
                  f"Gemini:{providers['gemini'].get('state')}|model={providers['gemini'].get('model')}|calls={providers['gemini'].get('generation_attempts',0)}|OpenAI:{providers['openai'].get('state')}|model={providers['openai'].get('model')}|calls={providers['openai'].get('generation_attempts',0)}",
                  f"supertrend parent: T={p['trades']}|WR={p['win_rate']}|PF={p['profit_factor']}|net_bps={p['net_pnl_bps']}|exp_bps={p['net_expectancy_bps']}|DD_bps={p['drawdown_bps']}|cost_bps={p['cost_total_bps']}|hold_h={p['holding_hours_total']}|top1_share={p['top1_share_of_total']}|wobest_bps={p['pnl_without_best_trade_bps']}",
                  f"LBR child: T={x['trades']}|WR={x['win_rate']}|PF={x['profit_factor']}|net_bps={x['net_pnl_bps']}|exp_bps={x['net_expectancy_bps']}|DD_bps={x['drawdown_bps']}|cost_bps={x['cost_total_bps']}|hold_h={x['holding_hours_total']}|top1_share={x['top1_share_of_total']}|wobest_bps={x['pnl_without_best_trade_bps']}",
                  f"delta: T={delta['trades']}|WRpp={delta['win_rate_pp']}|net_bps={delta['net_pnl_bps']}|exp_bps={delta['net_expectancy_bps']}|DD_bps={delta['drawdown_bps']}|retained={ti.get('retained_same_signal_count')}|excluded={ti.get('excluded_parent_signal_count')}|new={ti.get('new_child_signal_count')}|economic_pass={c['economic_pass']}",
                  'source_conformance is separate from economics; billing=UNKNOWN_NOT_SETTLED; no selection/promotion/order/live authority; REPORT_ONLY.'
              ])
          else:
              body='\n'.join(['<!-- TOP5_TRADER_BENCHMARK_MULTI_AI_V2 -->','## Top5 trader benchmark + multi-AI terminal',f"run={os.environ['RUN_ID']}|merge={os.environ['MERGE_SHA']}|receipt_branch={os.environ['CLAIM_BRANCH']}|state={terminal['terminal']}|runner_rc={terminal['runner_rc']}",'No provider retry was performed; inspect durable partial receipt.'])
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/1256/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as resp: print('ISSUE_COMMENT_HTTP='+str(resp.status))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top5-trader-benchmark-v2-${{ github.run_id }}
          path: |
            research/development_evidence/TOP5_TRADER_BENCHMARK_MULTI_AI_AFTER_PR1255_V1
            /tmp/top5-run.log
          if-no-files-found: warn
          retention-days: 90
