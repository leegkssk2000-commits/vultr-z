name: TrendRider ACK Repair Saved Verify V1
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: trendrider-ack-repair-saved-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  saved-verify:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'ops/rdc-probe-via-approved-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packages used by synthetic transport fixtures
        run: python -m pip install aiohttp==3.13.5 websockets==16.0
      - name: Verify saved ACK success, next-frame schema block, and zero economic execution
        run: python -m backend.research.rebuild.trendrider_ack_saved_verify_v1
      - name: Synthetic fixtures and saved evidence mutations only
        run: |
          python -m unittest backend.research.rebuild.test_trendrider_rest_ws_timestamp_v2 backend.research.rebuild.test_trendrider_common_source_v5 backend.research.rebuild.test_trendrider_ack_saved_verify_v1 -v
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code

  rdc-ssh-probe:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ops/rdc-probe-via-approved-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RDC_HOST: ${{ secrets.RDC_HOST }}
      RDC_USER: ${{ secrets.RDC_USER }}
      RDC_SSH_KEY: ${{ secrets.RDC_SSH_KEY }}
    steps:
      - name: SSH credential trio present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RDC_HOST:-}"
          test -n "${RDC_USER:-}"
          test -n "${RDC_SSH_KEY:-}"

  rdc-api-token-probe:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ops/rdc-probe-via-approved-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RDC_API_TOKEN: ${{ secrets.RDC_API_TOKEN }}
    steps:
      - name: API token present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RDC_API_TOKEN:-}"
