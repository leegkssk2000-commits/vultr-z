name: TrendRider Source Repair Saved Verify V1
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: trendrider-source-repair-saved-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  saved-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed timestamp blocker and zero acquisition/economic budgets
        run: python -m backend.research.rebuild.trendrider_source_repair_saved_verify_v1
      - name: Synthetic source and sealed-evidence regressions only
        run: |
          python -m unittest backend.research.rebuild.test_trendrider_common_source_v2 backend.research.rebuild.test_trendrider_source_repair_saved_verify_v1 -v
          npm run --prefix frontend/z-os-app-source validate
          git diff --exit-code

  rdc-ssh-probe:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'ops: execute RDC credential probe via trusted source workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RDC_HOST: ${{ secrets.RDC_HOST }}
      RDC_USER: ${{ secrets.RDC_USER }}
      RDC_SSH_KEY: ${{ secrets.RDC_SSH_KEY }}
    steps:
      - name: Confirm SSH credential trio without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RDC_HOST:-}"
          test -n "${RDC_USER:-}"
          test -n "${RDC_SSH_KEY:-}"

  rdc-api-token-probe:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'ops: execute RDC credential probe via trusted source workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RDC_API_TOKEN: ${{ secrets.RDC_API_TOKEN }}
    steps:
      - name: Confirm API token without printing value
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RDC_API_TOKEN:-}"
