name: ZEL Actions Queue Purge V1

on:
  push:
    branches:
      - master
    paths:
      - backend/research/zel_actions_queue_purge_trigger_v1.json
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: zel-actions-queue-purge-v1
  cancel-in-progress: true

jobs:
  purge-obsolete-queued-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel every queued run except this cleanup and structural premium
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zel-actions-queue-purge-v1',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  return exc.code, {'error': raw}

          status, payload = request(f'{base}/actions/runs?status=queued&per_page=100')
          if status != 200:
              raise SystemExit(f'LIST_QUEUED_FAILED:{status}:{payload}')

          preserved = []
          cancelled = []
          failures = []
          for run in payload.get('workflow_runs', []):
              run_id = int(run['id'])
              name = str(run.get('name') or '')
              if run_id == current or 'Structural Premium' in name or name == 'ZEL Actions Queue Purge V1':
                  preserved.append({'id': run_id, 'name': name, 'reason': 'ACTIVE_ROUTE_OR_SELF'})
                  continue
              code, body = request(f'{base}/actions/runs/{run_id}/cancel', method='POST')
              row = {'id': run_id, 'name': name, 'http_status': code}
              if code in (202, 409):
                  cancelled.append(row)
              else:
                  row['body'] = body
                  failures.append(row)

          verify_status, verify = request(f'{base}/actions/runs?status=queued&per_page=100')
          receipt = {
              'schema_version': 'zel.actions.queue_purge.v1',
              'state': 'PASS_QUEUE_PURGE_REQUESTED' if not failures else 'HOLD_QUEUE_PURGE_PARTIAL',
              'initial_queued': int(payload.get('total_count', 0)),
              'cancelled': cancelled,
              'preserved': preserved,
              'failures': failures,
              'verify_http_status': verify_status,
              'remaining_queued_snapshot': int((verify or {}).get('total_count', -1)),
              'execution_authority': 'NONE',
              'order_authority': 'BLOCKED',
              'protected_mutations': 0,
          }
          Path('out').mkdir(exist_ok=True)
          Path('out/queue_purge_receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          if failures:
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-actions-queue-purge-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/queue_purge_receipt.json
          if-no-files-found: warn
          retention-days: 7
