name: ZEL Actions Queue Purge V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_actions_queue_purge_trigger_v1.json
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: zel-actions-queue-purge-v1
  cancel-in-progress: false

jobs:
  purge-obsolete-queued-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable user-owned plan
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned obsolete workflow queue and cancel only if separately authorized
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 backend/research/ops/zel_actions_queue_cleanup_safe_v2.py
      - name: Preserve exact cleanup receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-actions-queue-purge-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/queue_purge_receipt.json
          if-no-files-found: warn
          retention-days: 7
