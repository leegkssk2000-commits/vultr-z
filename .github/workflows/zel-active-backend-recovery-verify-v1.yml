name: ZEL Active Backend Recovery Verify V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/recovery/active_backend_source_manifest_v1.json
      - backend/recovery/active_backend_git_patch_overlay_v1.json
      - backend/**/*.py
      - .github/workflows/zel-active-backend-recovery-verify-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-active-backend-recovery-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Git baseline, patch overlay and compile closure
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib, json, py_compile
          from pathlib import Path

          manifest_path=Path('backend/recovery/active_backend_source_manifest_v1.json')
          overlay_path=Path('backend/recovery/active_backend_git_patch_overlay_v1.json')
          manifest=json.loads(manifest_path.read_text())
          overlay=json.loads(overlay_path.read_text()) if overlay_path.exists() else {'patches':[]}
          assert overlay.get('protected_mutations',0)==0
          assert overlay.get('execution_allowed',False) is False
          assert overlay.get('order_authority','BLOCKED')=='BLOCKED'

          patches={row['path']:row for row in overlay.get('patches',[])}
          manifest_paths={item['path'] for item in manifest['files']}
          unknown=sorted(set(patches)-manifest_paths)
          assert not unknown, f'OVERLAY_PATH_NOT_IN_MANIFEST:{unknown}'

          rows=[]
          server_expected={}
          for item in manifest['files']:
              rel=item['path']
              path=Path(rel)
              if not path.is_file():
                  raise AssertionError(f'MISSING_GIT_FILE:{path}')
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              patch=patches.get(rel)
              want_git=patch['git_sha256'] if patch else item['sha256']
              want_server=patch['server_sha256'] if patch else item['sha256']
              if digest!=want_git:
                  raise AssertionError(f'GIT_SHA_MISMATCH:{path}:{digest}:{want_git}')
              if patch:
                  assert patch.get('deployed') is False
                  assert patch.get('deployment_required_for_recovery_merge') is False
                  assert want_git!=want_server, f'PATCH_OVERLAY_NOT_DISTINCT:{rel}'
              py_compile.compile(str(path),doraise=True)
              rows.append({'path':rel,'git_sha256':digest,'server_sha256':want_server,'patched':bool(patch),'size_bytes':path.stat().st_size})
              server_expected[rel]=want_server

          result={
              'state':'PASS_GIT_BASELINE_OVERLAY_AND_COMPILE',
              'file_count':len(rows),
              'patched_file_count':sum(1 for r in rows if r['patched']),
              'mismatch_count':0,
              'compile_pass':True,
              'deployment_changed':False,
              'service_changed':False,
              'database_changed':False,
              'protected_mutations':0,
              'execution_allowed':False,
              'order_authority':'BLOCKED',
          }
          Path('out/git_verify.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')

          remote=f'''import hashlib,json\nfrom pathlib import Path\nroot=Path("/home/z/z")\nexpected={server_expected!r}\nrows=[]\nfor rel,want in sorted(expected.items()):\n p=root/rel\n if not p.is_file(): rows.append({{"path":rel,"state":"MISSING"}}); continue\n got=hashlib.sha256(p.read_bytes()).hexdigest()\n rows.append({{"path":rel,"state":"MATCH" if got==want else "MISMATCH","sha256":got}})\nbad=[r for r in rows if r["state"]!="MATCH"]\nprint(json.dumps({{"state":"PASS_SERVER_RECOVERED_SHA_PARITY" if not bad else "HOLD_SERVER_SHA_DRIFT","file_count":len(rows),"bad_count":len(bad),"bad":bad,"service_changed":False,"process_changed":False,"database_changed":False,"deployment_changed":False,"protected_mutations":0,"execution_allowed":False,"order_authority":"BLOCKED"}},sort_keys=True))\n'''
          Path('out/remote_verify.py').write_text(remote)
          PY

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify current server recovered SHA parity read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "python3 -" < out/remote_verify.py > out/server_verify.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/server_verify.json').read_text())
          assert row['state']=='PASS_SERVER_RECOVERED_SHA_PARITY',row
          assert row['bad_count']==0,row
          assert row['protected_mutations']==0
          assert row['execution_allowed'] is False
          assert row['order_authority']=='BLOCKED'
          PY

      - name: Verify live OpenAPI remains coherent
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "python3 -" > out/openapi_verify.json <<'PY'
          import json,urllib.request
          doc=json.load(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',timeout=10))
          ids=[]; operations=0
          for _,row in doc.get('paths',{}).items():
              for method,op in row.items():
                  if method.lower() not in {'get','post','put','patch','delete','options','head'} or not isinstance(op,dict):
                      continue
                  operations+=1
                  if op.get('operationId'): ids.append(op['operationId'])
          dup=sorted({x for x in ids if ids.count(x)>1})
          print(json.dumps({'state':'PASS_LIVE_OPENAPI_COHERENT' if operations>0 and not dup else 'HOLD_LIVE_OPENAPI_INCOHERENT','operation_count':operations,'duplicate_operation_ids':dup,'service_changed':False,'process_changed':False,'database_changed':False,'deployment_changed':False,'protected_mutations':0,'execution_allowed':False,'order_authority':'BLOCKED'},sort_keys=True))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/openapi_verify.json').read_text())
          assert row['state']=='PASS_LIVE_OPENAPI_COHERENT',row
          assert row['operation_count']>0
          assert row['duplicate_operation_ids']==[]
          PY

      - name: Summarize recovery verification
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          git=json.loads(Path('out/git_verify.json').read_text())
          srv=json.loads(Path('out/server_verify.json').read_text())
          api=json.loads(Path('out/openapi_verify.json').read_text())
          result={'state':'PASS_ACTIVE_BACKEND_RECOVERY_VERIFIED','git_file_count':git['file_count'],'git_only_patch_count':git['patched_file_count'],'server_file_count':srv['file_count'],'server_bad_count':srv['bad_count'],'openapi_operation_count':api['operation_count'],'duplicate_operation_ids':api['duplicate_operation_ids'],'deployment_changed':False,'service_changed':False,'database_changed':False,'protected_mutations':0,'execution_allowed':False,'order_authority':'BLOCKED','next':'SECOND_PASS_OWNER_SERVICE_DB_AUDIT_BEFORE_MERGE'}
          Path('out/status.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('# ZEL active backend recovery verification\n\n')
              f.write(f"- State: **{result['state']}**\n")
              f.write(f"- Git/server files: `{result['git_file_count']}/{result['server_file_count']}`\n")
              f.write(f"- Git-only patches: `{result['git_only_patch_count']}`\n")
              f.write(f"- Server drift: `{result['server_bad_count']}`\n")
              f.write(f"- OpenAPI operations: `{result['openapi_operation_count']}`\n")
          PY

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key out/remote_verify.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zel-active-backend-recovery-verify-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: error
          retention-days: 30
