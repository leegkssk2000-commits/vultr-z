name: ZEL Active Backend Source Census V2.2

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_active_backend_source_census_v1.py
      - backend/tools/zel_active_backend_dynamic_census_v2.py
      - backend/tools/zel_active_openapi_snapshot_v1.py
      - backend/tools/zel_route_ownership_adjudicator_v1.py
      - backend/tools/zel_active_source_export_guard_v1.py
      - .github/workflows/zel-active-backend-source-census-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-active-backend-source-census-v2-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile census tools
        run: |
          python -m py_compile backend/tools/zel_active_backend_dynamic_census_v2.py
          python -m py_compile backend/tools/zel_active_openapi_snapshot_v1.py
          python -m py_compile backend/tools/zel_route_ownership_adjudicator_v1.py
          python -m py_compile backend/tools/zel_active_source_export_guard_v1.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Census static and dynamic active import closure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "Z_HOME=/home/z/z ACTIVE_BACKEND_ENTRY=/home/z/z/backend/main.py python3 -" \
            < backend/tools/zel_active_backend_dynamic_census_v2.py \
            > out/active_backend_dynamic_census.json \
            2> out/active_backend_dynamic_stderr.txt

      - name: Snapshot active OpenAPI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "ACTIVE_OPENAPI_URL=http://127.0.0.1:8000/openapi.json python3 -" \
            < backend/tools/zel_active_openapi_snapshot_v1.py \
            > out/active_openapi_snapshot.json \
            2> out/active_openapi_stderr.txt

      - name: Adjudicate active route ownership
        run: |
          python backend/tools/zel_route_ownership_adjudicator_v1.py \
            --census out/active_backend_dynamic_census.json \
            --openapi out/active_openapi_snapshot.json \
            --out out/route_ownership_adjudication.json

      - name: Run fail-closed source export guard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "Z_HOME=/home/z/z ACTIVE_BACKEND_ENTRY=/home/z/z/backend/main.py python3 -" \
            < backend/tools/zel_active_source_export_guard_v1.py \
            > out/active_source_export_guard.json \
            2> out/active_source_export_stderr.txt

      - name: Assert read-only contracts and summarize
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          census = json.loads(Path('out/active_backend_dynamic_census.json').read_text())
          openapi = json.loads(Path('out/active_openapi_snapshot.json').read_text())
          routes = json.loads(Path('out/route_ownership_adjudication.json').read_text())
          export = json.loads(Path('out/active_source_export_guard.json').read_text())
          assert census['state'] in {'PASS_ACTIVE_DYNAMIC_SOURCE_CENSUS', 'HOLD_ACTIVE_DYNAMIC_SOURCE_NOT_IN_GIT'}
          assert openapi['state'] in {'PASS_OPENAPI_SNAPSHOT', 'HOLD_OPENAPI_FETCH_FAILED', 'HOLD_DUPLICATE_OPERATION_IDS'}
          assert routes['state'] in {'PASS_ROUTE_OWNERSHIP_ADJUDICATED', 'HOLD_ROUTE_OWNERSHIP_REVIEW_REQUIRED'}
          assert export['state'] in {'PASS_SECRET_GUARD_EXPORT_READY', 'HOLD_SECRET_GUARD_BLOCKED'}
          for row in (census, openapi, routes, export):
              safety = row['safety']
              assert safety['read_only'] is True
              assert safety['remote_file_created'] is False
              assert safety['service_changed'] is False
              assert safety['process_changed'] is False
              assert safety['database_changed'] is False
              assert safety['deployment_changed'] is False
              assert safety['execution_allowed'] is False
              assert safety['order_authority'] == 'BLOCKED'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('# ZEL active backend source census v2.2\n\n')
              out.write(f"- Dynamic source: **{census['state']}**\n")
              out.write(f"- OpenAPI: **{openapi['state']}**\n")
              out.write(f"- Route ownership: **{routes['state']}**\n")
              out.write(f"- Export guard: **{export['state']}**\n")
              out.write(f"- Closure files: `{census['closure_file_count']}`\n")
              out.write(f"- OpenAPI operations: `{openapi['operation_count']}`\n")
              out.write(f"- Owned/ambiguous/unowned: `{routes['owned_operation_count']}/{routes['ambiguous_operation_count']}/{routes['unowned_operation_count']}`\n")
              out.write(f"- Guarded export files/bytes: `{export['file_count']}/{export['total_bytes']}`\n")
              out.write(f"- Export allowed: `{export['export_allowed']}`\n")
          PY

      - name: Create Git-only recovery branch
        if: github.event_name == 'pull_request' && github.head_ref == 'zel-active-backend-source-census-v1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_BRANCH: zel-active-backend-recovery-v1
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "{\"state\":\"FAIL_RECOVERY_BRANCH_STAGE\",\"rc\":%s,\"line\":%s,\"deployment_changed\":false,\"service_changed\":false,\"execution_allowed\":false,\"order_authority\":\"BLOCKED\"}\n" "$rc" "$LINENO" > "$GITHUB_WORKSPACE/out/recovery_branch_status.json"; exit "$rc"' ERR

          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('out/active_source_export_guard.json').read_text())
          assert row['state'] == 'PASS_SECRET_GUARD_EXPORT_READY', row['state']
          assert row['export_allowed'] is True
          Path('/tmp/active_source_export_guard.json').write_text(json.dumps(row), encoding='utf-8')
          PY

          if git ls-remote --exit-code --heads origin "refs/heads/$RECOVERY_BRANCH" >/dev/null 2>&1; then
            printf '{"state":"HOLD_RECOVERY_BRANCH_ALREADY_EXISTS","branch":"%s"}\n' "$RECOVERY_BRANCH" > out/recovery_branch_status.json
            exit 0
          fi

          git fetch origin master
          git switch --detach origin/master
          git switch -c "$RECOVERY_BRANCH"

          python - <<'PY'
          import base64
          import hashlib
          import json
          import py_compile
          from pathlib import Path

          source = json.loads(Path('/tmp/active_source_export_guard.json').read_text())
          allowed = ('backend/', 'engine/', 'strategies/', 'config/', 'ensemble/', 'telegram/')
          imported = []
          equal_existing = []
          file_manifest = []
          for row in source['files']:
              relative = row['path']
              assert relative.startswith(allowed), relative
              assert '..' not in Path(relative).parts, relative
              data = base64.b64decode(row['content_b64'])
              digest = hashlib.sha256(data).hexdigest()
              assert digest == row['sha256'], relative
              target = Path(relative)
              if target.exists():
                  existing = hashlib.sha256(target.read_bytes()).hexdigest()
                  if existing != digest:
                      raise RuntimeError(f'MASTER_CONFLICT:{relative}:{existing}:{digest}')
                  equal_existing.append(relative)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  imported.append(relative)
              py_compile.compile(str(target), doraise=True)
              file_manifest.append({'path': relative, 'sha256': digest, 'size_bytes': len(data)})

          manifest = {
              'schema_version': '1.0',
              'version': 'ZEL_ACTIVE_BACKEND_SOURCE_RECOVERY_MANIFEST_V1',
              'source_root': source['root'],
              'source_entry': source['entry'],
              'source_export_version': source['version'],
              'source_generated_at_utc': source['generated_at_utc'],
              'total_source_files': len(file_manifest),
              'newly_imported_files': len(imported),
              'master_equal_existing_files': len(equal_existing),
              'imported_paths': imported,
              'equal_existing_paths': equal_existing,
              'files': file_manifest,
              'secret_guard_blockers': [],
              'compile_pass': True,
              'deployed_runtime_changed': False,
              'service_changed': False,
              'database_changed': False,
              'execution_allowed': False,
              'order_authority': 'BLOCKED',
              'next': 'VERIFY_RECOVERY_BRANCH_HASH_PARITY_AND_ROUTE_TESTS_BEFORE_ANY_MERGE',
          }
          manifest_path = Path('backend/recovery/active_backend_source_manifest_v1.json')
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('/tmp/recovery_paths.txt').write_text('\n'.join(imported + [str(manifest_path)]) + '\n', encoding='utf-8')
          Path('/tmp/recovery_counts.json').write_text(json.dumps({'imported': len(imported), 'equal_existing': len(equal_existing)}), encoding='utf-8')
          assert len(imported) > 0
          PY

          git config user.name 'ZEL Authority Recovery'
          git config user.email 'zel-authority-recovery@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/recovery_paths.txt
          git commit -m 'Recover active FastAPI backend source authority'
          RECOVERY_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$RECOVERY_BRANCH"
          COUNTS="$(cat /tmp/recovery_counts.json)"
          printf '{"state":"PASS_RECOVERY_BRANCH_CREATED","branch":"%s","commit_sha":"%s","counts":%s,"deployment_changed":false,"service_changed":false,"execution_allowed":false,"order_authority":"BLOCKED"}\n' \
            "$RECOVERY_BRANCH" "$RECOVERY_SHA" "$COUNTS" > "$GITHUB_WORKSPACE/out/recovery_branch_status.json"
          trap - ERR

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Upload source census evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-active-backend-source-census-v2-2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: warn
          retention-days: 30
