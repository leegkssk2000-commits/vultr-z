name: ZEL AI Proposal Error Diagnostic V1

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/zel-ai-proposal-error-diagnostic-v1.yml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/zel-ai-proposal-error-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify diagnostic contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/zel-ai-proposal-error-diagnostic-v1.yml').read_text()
          assert "production_ai_edge_proposals_v1.json" in src
          assert "error_code" in src and "error_class" in src
          assert "permissions:\n  contents: read" in src
          assert "Read sanitized AI proposal failure receipt" in src
          print('PASS_READ_ONLY_AI_PROPOSAL_DIAGNOSTIC')
          PY

  diagnose-vps:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read sanitized AI proposal failure receipt
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'python3 - <<'"'"'PY'"'"'
          import json
          from pathlib import Path
          p=Path("/home/z/z/ledger/production_ai_edge_proposals_v1.json")
          if not p.exists():
              print(json.dumps({"state":"MISSING_PROPOSAL_RECEIPT"},sort_keys=True))
              raise SystemExit(0)
          row=json.loads(p.read_text())
          print(json.dumps({
              "state":row.get("state"),
              "error_class":row.get("error_class"),
              "error_code":row.get("error_code"),
              "provider":row.get("provider"),
              "model":row.get("model"),
              "ai_call_made":row.get("ai_call_made"),
              "ai_call_succeeded":row.get("ai_call_succeeded"),
              "retry_after_ms":row.get("retry_after_ms"),
              "updated_at_ms":row.get("updated_at_ms"),
          },sort_keys=True))
          PY'
