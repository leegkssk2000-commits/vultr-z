name: ZEL AI Proposal Mechanism Readout V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_mechanism_readout_v1.py'
      - '.github/workflows/zel-ai-proposal-mechanism-readout-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_mechanism_readout_v1.py'
      - '.github/workflows/zel-ai-proposal-mechanism-readout-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only mechanism diagnostic
        run: |
          set -euo pipefail
          python -m py_compile backend/production/zel_production_ai_proposal_mechanism_readout_v1.py
          python - <<'PY'
          from pathlib import Path
          src=Path('backend/production/zel_production_ai_proposal_mechanism_readout_v1.py').read_text()
          assert 'atomic_json_write' not in src
          assert 'submit_order' not in src
          assert 'https://' not in src
          assert 'selection_authority' in src and 'order_authority' in src
          print('PASS_READ_ONLY_PROPOSAL_MECHANISM_DIAGNOSTIC')
          PY

  read-vps:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read generated proposal mechanisms only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'cd /home/z/zel-production-current && PYTHONPATH=/home/z/zel-production-current python3 -m backend.production.zel_production_ai_proposal_mechanism_readout_v1'
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
