name: ZEL ALIMI View Runtime Audit V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_alimi_view_runtime_audit_v1.py
      - .github/workflows/zel-alimi-view-runtime-audit-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_alimi_view_runtime_audit_v1.py
      - .github/workflows/zel-alimi-view-runtime-audit-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-alimi-view-runtime-audit-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate audit source
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_alimi_view_runtime_audit_v1.py
          python - <<'PY'
          from pathlib import Path
          text=Path('backend/tools/zel_alimi_view_runtime_audit_v1.py').read_text()
          forbidden=('systemctl restart','systemctl stop','systemctl start','systemctl enable','systemctl disable','rm -rf','git reset','git clean','curl -X POST','curl -X PUT','curl -X DELETE')
          assert not any(item in text for item in forbidden),forbidden
          assert 'order_authority": "BLOCKED' in text
          assert 'execution_authority": "NONE' in text
          print('PASS_ALIMI_VIEW_AUDIT_STATIC_SAFETY')
          PY

  remote-audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload audit source
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key backend/tools/zel_alimi_view_runtime_audit_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_alimi_view_runtime_audit_v1.py"
      - name: Execute read-only audit
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'python3 /tmp/zel_alimi_view_runtime_audit_v1.py --out /tmp/zel_alimi_view_runtime_audit_v1.json'
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_alimi_view_runtime_audit_v1.json" \
            out/latest.json
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel_alimi_view_runtime_audit_v1.py /tmp/zel_alimi_view_runtime_audit_v1.json' || true
      - name: Assert read-only terminal receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state']=='PASS_READ_ONLY_AUDIT_COMPLETE',d
          s=d['safety']
          assert s['runtime_mutated'] is False and s['service_mutated'] is False,d
          assert s['frontend_mutated'] is False and s['canonical_mutated'] is False,d
          assert s['execution_authority']=='NONE' and s['order_authority']=='BLOCKED',d
          assert s['action']=='hold',d
          print(json.dumps(d['findings'],sort_keys=True))
          PY
      - name: Publish sanitized audit receipt
        run: |
          set -euo pipefail
          git clone --depth=1 --branch zel-data-expansion-results-v1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results
          root=results/runtime_results/zel/alimi_view_runtime_audit_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-alimi-view-audit-bot'
          git config user.email 'zel-alimi-view-audit-bot@users.noreply.github.com'
          git add runtime_results/zel/alimi_view_runtime_audit_v1
          git commit -m "result(zel): ALIMI View runtime audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - uses: actions/upload-artifact@v4
        with:
          name: zel-alimi-view-runtime-audit-v1-${{ github.run_id }}
          path: out/latest.json
          retention-days: 30
