name: ZEL Alpha Unattended Champion V2

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_alpha_unattended_champion_v2.json
      - backend/tools/zel_alpha_unattended_champion_v2.py
      - backend/tools/zel_alpha_unattended_champion_v2_bounded.py
      - .github/workflows/zel-alpha-unattended-champion-v2.yml
  push:
    branches: [master]
    paths:
      - backend/research/zel_alpha_unattended_champion_v2.json
      - backend/tools/zel_alpha_unattended_champion_v2.py
      - backend/tools/zel_alpha_unattended_champion_v2_bounded.py
      - .github/workflows/zel-alpha-unattended-champion-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-alpha-unattended-champion-v2-${{ github.event_name == 'pull_request' && github.head_ref || 'master' }}
  cancel-in-progress: false

env:
  BASELINE_RUN_ID: '30252022416'
  BASELINE_ARTIFACT: s11-evidence-batch-1-30252022416-attempt-1
  MULTIOBJECTIVE_RUN_ID: '30345463070'
  MULTIOBJECTIVE_ARTIFACT: s11-alpha-multiobjective-auto-v1-30345463070-attempt-1
  ALPHA_CODE_REF: r7a4d-strategy11-alpha-primary-w1-multiobjective-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pandas
      - name: Validate bounded optimizer and safety policy
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_alpha_combo_validation_chain_v1.py \
            backend/tools/zel_alpha_unattended_champion_v2.py \
            backend/tools/zel_alpha_unattended_champion_v2_bounded.py
          python -m json.tool backend/research/zel_alpha_unattended_champion_v2.json >/dev/null
          PYTHONPATH=backend/tools python backend/tools/zel_alpha_unattended_champion_v2.py \
            --policy backend/research/zel_alpha_unattended_champion_v2.json --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/research/zel_alpha_unattended_champion_v2.json').read_text())
          assert p['authority']['profit_control']=='TIME54'
          assert p['authority']['robust_control']=='TIME60'
          assert p['authority']['raw_canonical_exact25_is_diagnostic_only'] is True
          assert p['absolute_champion_gate']['minimum_net_return_pct_sum'] > 0
          assert p['absolute_champion_gate']['minimum_win_rate_pct'] >= 55
          assert p['absolute_champion_gate']['minimum_profit_factor'] >= 2
          assert p['absolute_champion_gate']['minimum_payoff_ratio'] >= 2
          assert p['safety']['canonical_mutation'] is False
          assert p['safety']['runtime_mutation'] is False
          assert p['safety']['promotion_authority'] is False
          assert p['safety']['execution_authority']=='NONE'
          assert p['safety']['order_authority']=='BLOCKED'
          PY

  research:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false
      - name: Checkout TIME54 TIME60 authority code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ALPHA_CODE_REF }}
          path: alpha-code
          persist-credentials: false
      - name: Checkout immutable Data B
        uses: actions/checkout@v4
        with:
          ref: zel-historical-oos-data-v1
          path: historical
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MULTIOBJECTIVE_ARTIFACT }}
          path: input/multiobjective
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MULTIOBJECTIVE_RUN_ID }}
      - name: Restore latest state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/previous
          branch="${GITHUB_HEAD_REF:-master}"
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-alpha-unattended-champion-v2.yml --branch "$branch" --status success --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-alpha-unattended-champion-state-*' --dir input/previous 2>/dev/null; then break; fi
          done
          find input/previous -name state.json -print -quit > input/previous-path.txt || true
      - name: Run one bounded deterministic candidate
        run: |
          set -euo pipefail
          baseline=$(find input/evidence -path '*/alpha_combo/summary.json' -print -quit)
          test -n "$baseline"
          previous=()
          if [ -s input/previous-path.txt ]; then previous=(--previous-state "$(cat input/previous-path.txt)"); fi
          PYTHONPATH=control/backend/tools python control/backend/tools/zel_alpha_unattended_champion_v2_bounded.py \
            --policy control/backend/research/zel_alpha_unattended_champion_v2.json \
            --alpha-root alpha-code \
            --baseline-summary "$baseline" \
            --multiobjective-root input/multiobjective \
            --data-root historical/zel_historical_oos_v1 \
            "${previous[@]}" \
            --out out/research
          python -m json.tool out/research/latest.json >/dev/null
          python -m json.tool out/research/state.json >/dev/null
      - name: Gemini review and next-axis selection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          result=json.loads(Path('out/research/latest.json').read_text())
          state=json.loads(Path('out/research/state.json').read_text())
          allowed=set(result.get('remaining_axis_ids') or [])
          allowed.discard(result.get('axis_id'))
          if not allowed: allowed=set(result.get('remaining_axis_ids') or [])
          evidence={
            'state':result.get('state'),'epoch':result.get('epoch'),'axis':result.get('axis_id'),
            'control':result.get('control'),'candidates':result.get('candidates'),
            'selected':result.get('selected_improvement'),'champion':result.get('champion'),
            'target':result.get('absolute_champion_gate'),'allowed_next_axes':sorted(allowed),
            'TIME54_TIME60_authority_only':True,'raw_canonical_control_forbidden':True,
            'one_axis_only':True,'production_authority':False
          }
          def call(role,instruction):
            payload={'contents':[{'parts':[{'text':role+' '+instruction+' EVIDENCE='+json.dumps(evidence,sort_keys=True,separators=(',',':'))}]}],
                     'generationConfig':{'temperature':0.1,'maxOutputTokens':1600,'responseMimeType':'application/json'}}
            last=''
            for model in ['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']:
              try:
                req=urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={os.environ["GEMINI_API_KEY"]}',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
                with urllib.request.urlopen(req,timeout=90) as r: body=json.load(r)
                return {'model':model,'response':json.loads(body['candidates'][0]['content']['parts'][0]['text'])}
              except Exception as exc:
                last=f'{type(exc).__name__}:{exc}'; time.sleep(2)
            raise RuntimeError('GEMINI_CALL_FAILED:'+last)
          if result.get('champion_found') or result.get('converged'):
            designer={'model':None,'response':{'verdict':'STOP','next_axis':None}}
            redteam={'model':None,'response':{'verdict':'ACCEPT'}}
            selected=None; accepted=True
          else:
            designer=call('You are the causal next-axis designer.','Return verdict TEST|HOLD, next_axis, reason, falsification. next_axis must be one allowed value.')
            proposed=designer['response'].get('next_axis')
            evidence['proposed_next_axis']=proposed
            redteam=call('You are an independent red-team.','Return verdict ACCEPT|REJECT|MORE_EVIDENCE, reason, hidden_failure. Reject repeated mining or leakage.')
            accepted=(designer['response'].get('verdict')=='TEST' and proposed in allowed and redteam['response'].get('verdict')=='ACCEPT')
            selected=proposed if accepted else result.get('deterministic_next_axis_id')
          if selected in set(result.get('remaining_axis_ids') or []): state['next_axis_id']=selected
          review={'schema_version':'zel.alpha.unattended_champion.gemini_review.v2','state':'PASS_GEMINI_NEXT_AXIS_ACCEPTED' if accepted else 'HOLD_GEMINI_FALLBACK_TO_DETERMINISTIC_AXIS','designer':designer,'redteam':redteam,'selected_next_axis':state.get('next_axis_id'),'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          review['receipt_sha256']=hashlib.sha256(json.dumps(review,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          state['gemini_last_review_sha256']=review['receipt_sha256']
          Path('out/research/gemini_review.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
          Path('out/research/state.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
      - name: Verify deterministic and safety gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('out/research/latest.json').read_text())
          state=json.loads(Path('out/research/state.json').read_text())
          review=json.loads(Path('out/research/gemini_review.json').read_text())
          assert result['candidate_count'] <= 1,result
          assert result['time54_time60_authority_restored'] is True,result
          assert result['raw_canonical_exact25_used_as_control'] is False,result
          assert result['canonical_mutated'] is False and result['registry_mutated'] is False,result
          assert result['runtime_mutated'] is False and result['formal_ledger_mutated'] is False,result
          for row in (result,state,review):
            assert row['selection_authority'] is False,row
            assert row['promotion_authority'] is False,row
            assert row['execution_authority']=='NONE',row
            assert row['order_authority']=='BLOCKED',row
            assert row['action']=='hold',row
          if result['champion_found']:
            assert all(result['champion']['champion_gate']['checks'].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-alpha-unattended-champion-state-${{ github.run_id }}
          path: out/research
          if-no-files-found: error
          retention-days: 90
