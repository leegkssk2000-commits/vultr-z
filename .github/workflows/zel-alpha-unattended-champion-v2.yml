name: ZEL Alpha Unattended Champion V2

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_alpha_unattended_champion_v2.json
      - backend/tools/zel_alpha_unattended_champion_v2.py
      - .github/workflows/zel-alpha-unattended-champion-v2.yml
  push:
    branches: [master]
    paths:
      - backend/research/zel_alpha_unattended_champion_v2.json
      - backend/tools/zel_alpha_unattended_champion_v2.py
      - .github/workflows/zel-alpha-unattended-champion-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-alpha-unattended-champion-v2-${{ github.event_name == 'pull_request' && github.head_ref || 'master' }}
  cancel-in-progress: false

env:
  PYTHONPATH: control
  BASELINE_RUN_ID: '30252022416'
  BASELINE_ARTIFACT: s11-evidence-batch-1-30252022416-attempt-1
  MULTIOBJECTIVE_RUN_ID: '30345463070'
  MULTIOBJECTIVE_ARTIFACT: s11-alpha-multiobjective-auto-v1-30345463070-attempt-1
  ALPHA_CODE_REF: r7a4d-strategy11-alpha-primary-w1-multiobjective-v1

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policy and optimizer
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_alpha_combo_validation_chain_v1.py \
            backend/tools/zel_alpha_unattended_champion_v2.py
          python -m json.tool backend/research/zel_alpha_unattended_champion_v2.json >/dev/null
          PYTHONPATH=backend/tools python backend/tools/zel_alpha_unattended_champion_v2.py \
            --policy backend/research/zel_alpha_unattended_champion_v2.json \
            --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/research/zel_alpha_unattended_champion_v2.json').read_text())
          gate=p['absolute_champion_gate']
          assert gate['minimum_net_return_pct_sum'] > 0
          assert gate['minimum_win_rate_pct'] >= 55.0
          assert gate['minimum_profit_factor'] >= 2.0
          assert gate['minimum_payoff_ratio'] >= 2.0
          assert gate['minimum_positive_windows_pct'] == 100.0
          assert p['authority']['profit_control']=='TIME54'
          assert p['authority']['robust_control']=='TIME60'
          assert p['authority']['raw_canonical_exact25_is_diagnostic_only'] is True
          assert p['autonomy']['one_axis_per_epoch'] is True
          assert p['autonomy']['reset_on_new_data_fingerprint'] is True
          assert p['safety']['canonical_mutation'] is False
          assert p['safety']['runtime_mutation'] is False
          assert p['safety']['promotion_authority'] is False
          assert p['safety']['execution_authority']=='NONE'
          assert p['safety']['order_authority']=='BLOCKED'
          PY

  research:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout optimizer control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false

      - name: Checkout Alpha TIME54/TIME60 authority code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ALPHA_CODE_REF }}
          path: alpha-code
          persist-credentials: false

      - name: Checkout immutable Data B
        uses: actions/checkout@v4
        with:
          ref: zel-historical-oos-data-v1
          path: historical
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy

      - name: Download immutable Alpha baseline authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: Download immutable Alpha multiobjective authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MULTIOBJECTIVE_ARTIFACT }}
          path: input/multiobjective
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MULTIOBJECTIVE_RUN_ID }}

      - name: Restore latest state for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/previous
          branch="${GITHUB_HEAD_REF:-master}"
          for run in $(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow zel-alpha-unattended-champion-v2.yml \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'zel-alpha-unattended-champion-state-*' \
              --dir input/previous 2>/dev/null; then
              break
            fi
          done
          find input/previous -name state.json -print -quit > input/previous-path.txt || true

      - name: Run one deterministic single-axis epoch
        run: |
          set -euo pipefail
          mkdir -p out/research
          baseline=$(find input/evidence -path '*/alpha_combo/summary.json' -print -quit)
          test -n "$baseline"
          previous=()
          if [ -s input/previous-path.txt ]; then
            previous=(--previous-state "$(cat input/previous-path.txt)")
          fi
          PYTHONPATH=control/backend/tools python control/backend/tools/zel_alpha_unattended_champion_v2.py \
            --policy control/backend/research/zel_alpha_unattended_champion_v2.json \
            --alpha-root alpha-code \
            --baseline-summary "$baseline" \
            --multiobjective-root input/multiobjective \
            --data-root historical/zel_historical_oos_v1 \
            "${previous[@]}" \
            --out out/research
          python -m json.tool out/research/latest.json >/dev/null
          python -m json.tool out/research/state.json >/dev/null

      - name: Gemini next-axis designer and red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          result=json.loads(Path('out/research/latest.json').read_text())
          state=json.loads(Path('out/research/state.json').read_text())
          allowed=set(result.get('remaining_axis_ids') or [])
          current=result.get('axis_id')
          allowed.discard(current)
          if not allowed:
              allowed=set(result.get('remaining_axis_ids') or [])

          evidence={
            'state':result.get('state'),
            'epoch':result.get('epoch'),
            'current_axis':current,
            'control':result.get('control'),
            'candidates':result.get('candidates'),
            'selected_improvement':result.get('selected_improvement'),
            'champion':result.get('champion'),
            'champion_found':result.get('champion_found'),
            'converged':result.get('converged'),
            'target_gate':result.get('absolute_champion_gate'),
            'allowed_next_axes':sorted(allowed),
            'constraints':{
              'TIME54_TIME60_authority_only':True,
              'raw_canonical_exact25_control_forbidden':True,
              'one_axis_next_epoch':True,
              'deterministic_gate_overrides_ai':True,
              'no_production_authority':True,
            },
          }
          key=os.environ['GEMINI_API_KEY']
          models=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']

          def call(role, instruction):
              prompt=(
                'You are '+role+' for a stateful unattended alpha_combo research optimizer. '
                'Use aggregate metrics only. Select no production action. '
                'The deterministic target requires positive Net, WR>=55%, PF>=2, payoff>=2, '
                'DD<=5%, 100% positive windows, and normal/stress loss cap compliance. '
                +instruction+' EVIDENCE='+json.dumps(evidence,sort_keys=True,separators=(',',':'))
              )
              payload={
                'contents':[{'parts':[{'text':prompt}]}],
                'generationConfig':{
                  'temperature':0.1,
                  'maxOutputTokens':2048,
                  'responseMimeType':'application/json'
                }
              }
              last=None
              for model in models:
                  try:
                      url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}'
                      request=urllib.request.Request(
                        url,
                        data=json.dumps(payload).encode(),
                        headers={'Content-Type':'application/json'}
                      )
                      with urllib.request.urlopen(request,timeout=90) as response:
                          body=json.load(response)
                      parsed=json.loads(body['candidates'][0]['content']['parts'][0]['text'])
                      return {'model':model,'response':parsed}
                  except Exception as exc:
                      last=f'{type(exc).__name__}:{exc}'
                      time.sleep(2)
              raise RuntimeError('GEMINI_CALL_FAILED:'+str(last))

          if result.get('champion_found') is True or result.get('converged') is True:
              designer={'model':None,'response':{
                'verdict':'STOP',
                'next_axis':None,
                'reason':'champion_found_or_wait_new_fingerprint'
              }}
              redteam={'model':None,'response':{
                'verdict':'ACCEPT_STOP',
                'reason':'deterministic terminal state'
              }}
              selected=None
              accepted=True
          else:
              designer=call(
                'the causal next-axis designer',
                'Return JSON keys verdict,next_axis,reason,falsification. '
                'verdict must be TEST or HOLD. next_axis must be exactly one allowed_next_axes value.'
              )
              proposed=designer['response'].get('next_axis')
              redteam_evidence=dict(evidence)
              redteam_evidence['proposed_next_axis']=proposed
              evidence=redteam_evidence
              redteam=call(
                'the independent red-team',
                'Return JSON keys verdict,reason,hidden_failure. '
                'verdict must be ACCEPT, REJECT, or MORE_EVIDENCE. '
                'Reject repeated-axis mining, post-entry leakage, or an axis unsupported by the current metric gap.'
              )
              accepted=(
                designer['response'].get('verdict')=='TEST'
                and proposed in allowed
                and redteam['response'].get('verdict')=='ACCEPT'
              )
              selected=proposed if accepted else result.get('deterministic_next_axis_id')

          if selected in set(result.get('remaining_axis_ids') or []):
              state['next_axis_id']=selected
          state['gemini_last_axis_accepted']=accepted
          state['gemini_last_review_sha256']=None
          review={
            'schema_version':'zel.alpha.unattended_champion.gemini_review.v2',
            'state':'PASS_GEMINI_NEXT_AXIS_ACCEPTED' if accepted else 'HOLD_GEMINI_FALLBACK_TO_DETERMINISTIC_AXIS',
            'designer':designer,
            'redteam':redteam,
            'selected_next_axis':state.get('next_axis_id'),
            'champion_found':result.get('champion_found'),
            'converged':result.get('converged'),
            'raw_trade_rows_sent':False,
            'raw_prices_sent':False,
            'private_code_sent':False,
            'credentials_sent':False,
            'canonical_mutated':False,
            'runtime_mutated':False,
            'selection_authority':False,
            'promotion_authority':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'action':'hold',
          }
          import hashlib
          encoded=json.dumps(review,sort_keys=True,separators=(',',':')).encode()
          review['receipt_sha256']=hashlib.sha256(encoded).hexdigest()
          state['gemini_last_review_sha256']=review['receipt_sha256']
          Path('out/research/gemini_review.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
          Path('out/research/state.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          print({
            'result_state':result.get('state'),
            'champion_found':result.get('champion_found'),
            'next_axis':state.get('next_axis_id'),
            'gemini_accepted':accepted,
          })
          PY
          python -m json.tool out/research/gemini_review.json >/dev/null
          python -m json.tool out/research/state.json >/dev/null

      - name: Verify safety and terminal target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('out/research/latest.json').read_text())
          state=json.loads(Path('out/research/state.json').read_text())
          review=json.loads(Path('out/research/gemini_review.json').read_text())
          for row in (result,state,review):
              assert row['selection_authority'] is False,row
              assert row['promotion_authority'] is False,row
              assert row['execution_authority']=='NONE',row
              assert row['order_authority']=='BLOCKED',row
              assert row['action']=='hold',row
          assert result['canonical_mutated'] is False,result
          assert result['registry_mutated'] is False,result
          assert result['runtime_mutated'] is False,result
          assert result['formal_ledger_mutated'] is False,result
          assert result['time54_time60_authority_restored'] is True,result
          assert result['raw_canonical_exact25_used_as_control'] is False,result
          if result['champion_found']:
              champion=result['champion']
              checks=champion['champion_gate']['checks']
              assert all(checks.values()),checks
          PY

      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('out/research/latest.json')
          if not path.is_file(): raise SystemExit(0)
          row=json.loads(path.read_text())
          best=row.get('champion') or row.get('selected_improvement') or row.get('control') or {}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as out:
              out.write('# Alpha unattended champion V2\n\n')
              out.write(f"- State: **{row.get('state')}**\n")
              out.write(f"- Epoch / axis: `{row.get('epoch')} / {row.get('axis_id')}`\n")
              out.write(f"- Champion found: `{row.get('champion_found')}`\n")
              out.write(f"- Net: `{best.get('net_return_pct_sum')}`\n")
              out.write(f"- WR: `{best.get('win_rate_pct')}%`\n")
              out.write(f"- PF: `{best.get('net_profit_factor')}`\n")
              out.write(f"- Payoff: `{best.get('payoff_ratio')}`\n")
              out.write(f"- DD: `{best.get('max_drawdown_pct')}%`\n")
              out.write(f"- Next: `{row.get('next')}`\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-alpha-unattended-champion-state-${{ github.run_id }}
          path: out/research
          if-no-files-found: error
          retention-days: 90
