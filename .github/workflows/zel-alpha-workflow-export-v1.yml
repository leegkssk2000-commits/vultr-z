name: ZEL Alpha Workflow Cutover Export V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-alpha-workflow-export-v1.yml
      - .github/workflows/zel-alpha-auto-validation-chain-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-alpha-workflow-cutover-export-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate gated Alpha workflow copy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source=Path('.github/workflows/zel-alpha-auto-validation-chain-v1.yml')
          text=source.read_text()
          header,tail=text.split('\npermissions:',1)
          marker='\n  schedule:\n'
          if marker in header:
              header=header[:header.index(marker)]+'\n'
          text=header+'\npermissions:'+tail

          expression='$'+'{{ steps.gate.outputs.ready }}'
          block=f'''  prerequisite:
            if: github.event_name != 'pull_request'
            needs: validate
            runs-on: ubuntu-latest
            timeout-minutes: 10
            outputs:
              ready: {expression}
            steps:
              - uses: actions/checkout@v4
                with:
                  ref: zel-data-expansion-results-v1
                  path: results
                  persist-credentials: false
              - id: gate
                name: Require strategy Top3 bundle receipt
                run: |
                  set -euo pipefail
                  python - <<'PY2'
                  import json
                  from pathlib import Path
                  p=Path('results/runtime_results/zel/strategy_top3_bundles_v1/latest.json')
                  ready=False
                  if p.is_file():
                      d=json.loads(p.read_text())
                      ready=(
                          d.get('state')=='PASS_STRATEGY_TOP3_BUNDLES_COMPLETE'
                          and d.get('promotion_authority') is False
                          and d.get('execution_authority')=='NONE'
                          and d.get('order_authority')=='BLOCKED'
                      )
                  Path('/tmp/ready').write_text('true' if ready else 'false')
                  print({{'top3_receipt_ready':ready}})
                  PY2
                  echo "ready=$(cat /tmp/ready)" >> "$GITHUB_OUTPUT"
          '''
          if '\n  prerequisite:\n' not in text:
              text=text.replace('\n  orchestrate:\n','\n'+block+'\n  orchestrate:\n',1)
          old="  orchestrate:\n    if: github.event_name != 'pull_request'\n    needs: validate\n"
          new="  orchestrate:\n    if: github.event_name != 'pull_request' && needs.prerequisite.outputs.ready == 'true'\n    needs: [validate, prerequisite]\n"
          if old in text:
              text=text.replace(old,new,1)
          assert new in text

          start=text.find("          active=$(gh run list --workflow zel-historical-oos-1m-resume-v1.yml")
          if start >= 0:
              end=text.index("          python - <<'PY'",start)
              text=text[:start]+"          echo 'WAIT_DATA_B_WITHOUT_REDISPATCH'\n"+text[end:]

          target=Path('backend/generated_workflows/zel-alpha-auto-validation-chain-v1.yml.txt')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(text)
          PY
      - name: Validate generated workflow
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('backend/generated_workflows/zel-alpha-auto-validation-chain-v1.yml.txt')
          text=p.read_text()
          parsed=yaml.safe_load(text)
          assert isinstance(parsed,dict),parsed
          header=text.split('\npermissions:',1)[0]
          assert 'schedule:' not in header,header
          assert 'workflow_run:' not in header,header
          assert '\n  prerequisite:\n' in text
          assert 'PASS_STRATEGY_TOP3_BUNDLES_COMPLETE' in text
          assert "needs: [validate, prerequisite]" in text
          assert 'gh workflow run zel-historical-oos-1m-resume-v1.yml' not in text
          assert "WAIT_DATA_B_WITHOUT_REDISPATCH" in text
          print('PASS_ALPHA_WORKFLOW_CUTOVER_COPY')
          PY
      - name: Publish non-executable validated copy
        run: |
          set -euo pipefail
          git config user.name 'zel-alpha-workflow-export-bot'
          git config user.email 'zel-alpha-workflow-export-bot@users.noreply.github.com'
          git add backend/generated_workflows/zel-alpha-auto-validation-chain-v1.yml.txt
          git commit -m 'build(zel): export validated Alpha DAG workflow copy' || exit 0
          git push origin HEAD:${{ github.head_ref }}
