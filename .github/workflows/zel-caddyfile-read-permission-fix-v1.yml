name: ZEL Caddyfile Read Permission Fix V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_caddyfile_read_permission_fix_v1.py
      - .github/workflows/zel-caddyfile-read-permission-fix-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_caddyfile_read_permission_fix_v1.py
      - .github/workflows/zel-caddyfile-read-permission-fix-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-caddyfile-read-permission-fix-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate minimal permission repair
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_caddyfile_read_permission_fix_v1.py
          python - <<'PY'
          from pathlib import Path
          t=Path('backend/tools/zel_caddyfile_read_permission_fix_v1.py').read_text()
          assert "os.chmod(PATH, 0o640)" in t
          assert "os.chown(PATH, 0, caddy_gid)" in t
          assert "systemctl', 'reload', 'caddy" in t
          assert 'CADDY_PERMISSION_FIX_FAILED_AND_ROLLED_BACK' in t
          assert "'execution_authority': 'NONE'" in t
          assert "'order_authority': 'BLOCKED'" in t
          for x in ('systemctl restart','systemctl stop','systemctl start','rm -rf','git reset','git clean'):
              assert x not in t,x
          print('PASS_CADDYFILE_PERMISSION_FIX_STATIC')
          PY

  repair:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Apply reversible root:caddy 0640 repair
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key backend/tools/zel_caddyfile_read_permission_fix_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_caddyfile_read_permission_fix_v1.py"
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'python3 /tmp/zel_caddyfile_read_permission_fix_v1.py'
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_caddyfile_read_permission_fix_v1.json" \
            out/latest.json
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel_caddyfile_read_permission_fix_v1.py /tmp/zel_caddyfile_read_permission_fix_v1.json' || true
      - name: Verify receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state']=='PASS_CADDYFILE_ROOT_CADDY_0640_AND_RELOAD',d
          assert d['after']['uid']==0 and d['after']['mode']==0o640,d
          assert d['validate_root']['returncode']==0 and d['validate_caddy']['returncode']==0,d
          assert d['reload']['returncode']==0 and d['active']['stdout'].strip()=='active',d
          assert d['frontend_mutated'] is False and d['runtime_strategy_mutated'] is False,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          print(json.dumps({'state':d['state'],'before':d['before'],'after':d['after']},sort_keys=True))
          PY
      - name: Publish receipt
        run: |
          set -euo pipefail
          git clone --depth=1 --branch zel-data-expansion-results-v1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results
          root=results/runtime_results/zel/caddyfile_read_permission_fix_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-caddy-permission-fix-bot'
          git config user.email 'zel-caddy-permission-fix-bot@users.noreply.github.com'
          git add runtime_results/zel/caddyfile_read_permission_fix_v1
          git commit -m "result(zel): Caddyfile permission fix ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - uses: actions/upload-artifact@v4
        with:
          name: zel-caddyfile-read-permission-fix-v1-${{ github.run_id }}
          path: out/latest.json
          retention-days: 30
