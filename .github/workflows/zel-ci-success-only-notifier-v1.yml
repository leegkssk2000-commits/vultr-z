name: ZEL CI Success-Only Notifier V1

on:
  workflow_run:
    workflows:
      - ZEL Component Autonomy V2
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: zel-ci-success-only-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify-success:
    name: Notify critical master success only
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post deduplicated success receipt
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = 417;
            const run = context.payload.workflow_run;
            const marker = `<!-- ci-success-run:${run.id} -->`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info(`SUCCESS_RECEIPT_ALREADY_POSTED:${run.id}`);
              return;
            }
            const sha = (run.head_sha || '').slice(0, 12);
            const body = [
              marker,
              '@leegkssk2000-commits',
              '',
              `✅ **${run.name} PASS**`,
              `- branch: \`${run.head_branch}\``,
              `- commit: \`${sha}\``,
              `- run: [${run.id}](${run.html_url})`,
              `- completed: \`${run.updated_at}\``,
              '',
              '`failure/cancelled/skipped/PR/non-master = no notification`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
