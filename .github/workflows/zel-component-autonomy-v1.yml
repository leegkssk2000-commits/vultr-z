name: ZEL Component Autonomy V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/zel_component_autonomy_policy_v1.json'
      - 'backend/tools/zel_component_autonomy_v1.py'
      - '.github/workflows/zel-component-autonomy-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/zel_component_autonomy_policy_v1.json'
      - 'backend/tools/zel_component_autonomy_v1.py'
      - '.github/workflows/zel-component-autonomy-v1.yml'
  schedule:
    - cron: '57 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-component-autonomy-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  EVIDENCE_RUN_ID: '30252022416'
  EVIDENCE_ARTIFACT: 's11-evidence-batch-5-30252022416-attempt-1'

jobs:
  verify:
    name: Verify component autonomy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Compile and run deterministic fixture
        run: |
          python -m py_compile backend/tools/zel_component_autonomy_v1.py
          python -m json.tool backend/research/zel_component_autonomy_policy_v1.json >/dev/null
          python backend/tools/zel_component_autonomy_v1.py fixture --out out/fixture
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/fixture/fixture_result.json').read_text())
          assert row['state']=='PASS_COMPONENT_AUTONOMY_EPOCH'
          assert set(row['module_results'])=={'bots','teams','skills','advisors'}
          assert row['module_results']['skills']['tested']>=15
          assert row['module_results']['teams']['tested']==4
          assert row['execution_fidelity']=='CANONICAL_EXACT_TRADE_LEDGER_PLUS_EVENT_COUNTERFACTUAL_COMPONENTS'
          assert row['convergence']['fingerprint_reset'] is True
          assert row['ai_usage']['xai_grok_required'] is False
          assert row['shadow_start_allowed'] is False
          assert row['order_authority']=='BLOCKED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-fixture-${{ github.run_id }}
          path: out/fixture
          if-no-files-found: error
          retention-days: 30

  replay:
    name: Exact-ledger bot/team/skill/advisor epoch
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      state: ${{ steps.result.outputs.state }}
      ai_escalation: ${{ steps.result.outputs.ai_escalation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Restore exact canonical Strategy11 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Restore latest successful component state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/previous
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-component-autonomy-v1.yml --branch master --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-component-autonomy-state-*' --dir input/previous 2>/dev/null; then break; fi
          done
          find input/previous -name state.json -print -quit > input/previous-path.txt || true
      - name: Verify exact source files
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          policy=json.loads(Path('backend/research/zel_component_autonomy_policy_v1.json').read_text())
          root=Path('input/evidence/trend_ma_macd')
          ledger=root/'baseline_trades.json'; summary=root/'summary.json'
          assert ledger.is_file() and summary.is_file()
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==policy['source_authorities']['trade_ledger_file_sha256']
          assert hashlib.sha256(summary.read_bytes()).hexdigest()==policy['source_authorities']['summary_file_sha256']
          row=json.loads(summary.read_text())
          assert row['authority_exact_summary_sha256']==policy['source_authorities']['authority_exact_summary_sha256']
          assert row['selected_authority_result_sha256']==policy['source_authorities']['selected_authority_result_sha256']
          PY
      - name: Run bounded autonomous epoch
        run: |
          previous=()
          if [ -s input/previous-path.txt ]; then previous=(--previous-state "$(cat input/previous-path.txt)"); fi
          python backend/tools/zel_component_autonomy_v1.py run \
            --policy backend/research/zel_component_autonomy_policy_v1.json \
            --ledger input/evidence/trend_ma_macd/baseline_trades.json \
            --summary input/evidence/trend_ma_macd/summary.json \
            "${previous[@]}" --out out/state
      - name: Verify terminal authority
        id: result
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads(Path('out/state/final.json').read_text())
          assert row['state'] in {'PASS_COMPONENT_AUTONOMY_EPOCH','CONVERGED_HOLD'}
          assert row['order_authority']=='BLOCKED' and row['execution_allowed'] is False
          assert row['shadow_start_allowed'] is False and row['runtime_bound'] is False
          assert row['execution_fidelity']=='CANONICAL_EXACT_TRADE_LEDGER_PLUS_EVENT_COUNTERFACTUAL_COMPONENTS'
          assert set(row['module_results'])=={'bots','teams','skills','advisors'}
          ai_required=row['state']=='CONVERGED_HOLD' or int(row.get('convergence',{}).get('patience',0))>=2
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"state={row['state']}\n")
              h.write(f"ai_escalation={'true' if ai_required else 'false'}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90

  ai-axis-gate:
    name: Required per-axis Groq and Workers AI review
    if: needs.replay.result == 'success'
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with:
          name: zel-component-autonomy-state-${{ github.run_id }}
          path: input/state
      - name: Build four isolated component-axis envelopes
        run: |
          mkdir -p out/ai/inputs out/ai/reviews
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('input/state/final.json').read_text())
          mapping={
            'BOT_POLICY':'bots',
            'TEAM_POLICY':'teams',
            'SKILL_PROFILE':'skills',
            'ADVISOR_PROFILE':'advisors',
          }
          for axis,module in mapping.items():
              best=row['module_results'][module]['best']
              config={k:v for k,v in best.items() if k not in {'stats','evidence'}}
              payload={
                'strategy_id':row['strategy_id'],
                'component_epoch':row['epoch'],
                'changed_axes':[axis],
                'lineage_complete':True,
                'hypothesis':{
                  'axis':axis,
                  'generation':row['epoch'],
                  'configuration':config,
                  'description':'Evaluate one bounded component axis against the exact canonical trade ledger.'
                },
                'control':row['control']['stats'],
                'candidate':best['stats'],
                'evidence':best['evidence'],
                'lineage':{
                  'ledger_sha':row['source_authority']['ledger_sha256'],
                  'summary_sha':row['source_authority']['summary_sha256'],
                  'fingerprint':row['data_fingerprint'],
                  'candidate_result_sha':row['result_sha256']
                }
              }
              Path(f'out/ai/inputs/{axis}.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Run Groq red-team and Workers AI guard per axis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_WORKERS_AI_TOKEN:-}"
          for input in out/ai/inputs/*.json; do
            axis=$(basename "$input" .json)
            python scripts/strategy11_groq_redteam.py \
              --input "$input" --output "out/ai/reviews/${axis}.groq.json"
            python scripts/strategy11_workers_ai_guard.py \
              --input "$input" --output "out/ai/reviews/${axis}.workers.json"
          done
      - name: Verify independent provider receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          axes={'BOT_POLICY','TEAM_POLICY','SKILL_PROFILE','ADVISOR_PROFILE'}
          summary={'state':'PASS_COMPONENT_AXIS_AI_GATE','axes':{},'research_only':True,'promotion_authority':False,'protected_mutations':0,'execution_allowed':False,'order_authority':'BLOCKED'}
          for axis in axes:
              groq=json.loads(Path(f'out/ai/reviews/{axis}.groq.json').read_text())
              workers=json.loads(Path(f'out/ai/reviews/{axis}.workers.json').read_text())
              assert groq['status']=='PASS_GROQ_CONNECTION'
              assert workers['status']=='PASS_WORKERS_AI_CONNECTION'
              assert groq['review']['decision'] in {'PASS_TO_REPLAY','REJECT','HOLD'}
              assert workers['review']['decision'] in {'PASS_TO_REPLAY','REJECT','HOLD'}
              for receipt in (groq,workers):
                  assert receipt['promotion_authority'] is False
                  assert receipt['execution_allowed'] is False
                  assert receipt['order_authority']=='BLOCKED'
              summary['axes'][axis]={
                'groq_decision':groq['review']['decision'],
                'workers_decision':workers['review']['decision'],
                'groq_response_sha':groq.get('response_sha'),
                'workers_response_sha':workers.get('response_sha')
              }
          Path('out/ai/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-axis-ai-review-${{ github.run_id }}
          path: out/ai
          if-no-files-found: error
          retention-days: 90

  gemini-escalation:
    name: Emit Gemini video request only on convergence or new fingerprint
    if: needs.replay.outputs.ai_escalation == 'true'
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zel-component-autonomy-state-${{ github.run_id }}
          path: input/state
      - name: Build bounded direct-video request receipt
        run: |
          mkdir -p out/gemini
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          final=json.loads(Path('input/state/final.json').read_text())
          request={
            'state':'REQUEST_GEMINI_DIRECT_VIDEO_ON_NEW_FAILURE_FINGERPRINT',
            'public_video_min':4,
            'independent_channel_min':4,
            'max_hypotheses_per_component':2,
            'max_generations_per_axis':2,
            'component_scope':['BOT','TEAM','SKILL','ADVISOR'],
            'data_fingerprint':final.get('data_fingerprint'),
            'failure_evidence':final.get('component_attribution'),
            'same_fingerprint_repeat_forbidden':True,
            'research_only':True,
            'promotion_authority':False,
            'protected_mutations':0,
            'execution_allowed':False,
            'order_authority':'BLOCKED',
            'runtime_bound':False
          }
          request['request_sha256']=hashlib.sha256(json.dumps(request,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('out/gemini/request.json').write_text(json.dumps(request,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-gemini-request-${{ github.run_id }}
          path: out/gemini
          if-no-files-found: error
          retention-days: 90
