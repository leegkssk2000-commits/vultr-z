name: ZEL Component Autonomy V2.1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_autonomy_v2_runner.py'
      - 'backend/tools/zel_component_axis_ai_gate_v2.py'
      - 'backend/tools/zel_component_gemini_v2.py'
      - 'backend/tools/zel_component_gemini_v2_guard.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2-1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_autonomy_v2_runner.py'
      - 'backend/tools/zel_component_axis_ai_gate_v2.py'
      - 'backend/tools/zel_component_gemini_v2.py'
      - 'backend/tools/zel_component_gemini_v2_guard.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2-1.yml'
  schedule:
    - cron: '57 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-component-autonomy-v2-1-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  EVIDENCE_RUN_ID: '30252022416'
  EVIDENCE_ARTIFACT: 's11-evidence-batch-5-30252022416-attempt-1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Compile and run deterministic fixtures
        run: |
          python -m py_compile \
            backend/tools/zel_component_autonomy_v2.py \
            backend/tools/zel_component_autonomy_v2_runner.py \
            backend/tools/zel_component_axis_ai_gate_v2.py \
            backend/tools/zel_component_gemini_v2.py \
            backend/tools/zel_component_gemini_v2_guard.py
          python -m json.tool backend/research/zel_component_autonomy_policy_v2.json >/dev/null
          python backend/tools/zel_component_autonomy_v2_runner.py fixture --out out/runner-fixture
          python backend/tools/zel_component_axis_ai_gate_v2.py fixture --out out/axis-fixture
          python backend/tools/zel_component_gemini_v2_guard.py fixture --out out/gemini-guard-fixture
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/runner-fixture/fixture_result.json').read_text())
          low=json.loads(Path('out/runner-fixture/low_sample_fixture_result.json').read_text())
          assert row['schema_version']=='2.1'
          assert row['component_attribution']['method']=='SEQUENTIAL_MATERIAL_ONLY_EXACT_SUM'
          assert abs(row['component_attribution']['interaction_residual']) <= 1e-12
          assert all(
              not decision['applied'] or stage=='ZLICE' or decision['evidence']['material']
              for stage,decision in row['pipeline_decisions'].items()
          )
          assert low['state']=='LOW_SAMPLE_HOLD'
          assert not any(low['axis_review_eligibility'].values())
          assert low['ai_usage']['gemini_required_this_epoch'] is True
          assert row['order_authority']=='BLOCKED' and row['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-v2-1-fixtures-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30

  replay:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      state: ${{ steps.result.outputs.state }}
      active_axis_count: ${{ steps.result.outputs.active_axis_count }}
      gemini_required: ${{ steps.result.outputs.gemini_required }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Restore latest V2.1 state on master only
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/previous
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-component-autonomy-v2-1.yml --branch master --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-component-autonomy-v2-1-state-*' --dir input/previous 2>/dev/null; then break; fi
          done
          find input/previous -name state.json -print -quit > input/previous-path.txt || true
      - name: Verify exact source authority
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          policy=json.loads(Path('backend/research/zel_component_autonomy_policy_v2.json').read_text())
          root=Path('input/evidence/trend_ma_macd')
          ledger=root/'baseline_trades.json'; summary=root/'summary.json'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==policy['source_authorities']['trade_ledger_file_sha256']
          assert hashlib.sha256(summary.read_bytes()).hexdigest()==policy['source_authorities']['summary_file_sha256']
          row=json.loads(summary.read_text())
          assert row['authority_exact_summary_sha256']==policy['source_authorities']['authority_exact_summary_sha256']
          assert row['selected_authority_result_sha256']==policy['source_authorities']['selected_authority_result_sha256']
          PY
      - name: Run sequential material-only component pipeline
        run: |
          previous=()
          if [ -s input/previous-path.txt ]; then previous=(--previous-state "$(cat input/previous-path.txt)"); fi
          python backend/tools/zel_component_autonomy_v2_runner.py run \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --ledger input/evidence/trend_ma_macd/baseline_trades.json \
            --summary input/evidence/trend_ma_macd/summary.json \
            "${previous[@]}" --out out/state
      - name: Verify low-sample terminal authority
        id: result
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads(Path('out/state/final.json').read_text())
          assert row['state']=='LOW_SAMPLE_HOLD'
          assert row['control']['stats']['trade_count']==5
          assert row['convergence']['low_sample_hold'] is True
          assert not any(row['axis_review_eligibility'].values())
          assert set(row['module_results']['bots']['best_by_role'])=={'LBot','MBot','OBot','SBot'}
          assert row['module_results']['skills']['best']['skill_id'] not in row['module_results']['skills']['observer_only_ids']
          assert abs(row['component_attribution']['interaction_residual']) <= 1e-12
          for stage,decision in row['pipeline_decisions'].items():
              if stage!='ZLICE' and decision['applied']:
                  assert decision['evidence']['material'] is True
                  assert row['component_attribution']['ordered_marginal_delta_net'][stage] >= -1e-12
          assert row['shadow_start_allowed'] is False and row['order_authority']=='BLOCKED'
          active=[axis for axis,value in row['axis_review_eligibility'].items() if value]
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"state={row['state']}\n")
              handle.write(f"active_axis_count={len(active)}\n")
              handle.write(f"gemini_required={'true' if row['ai_usage']['gemini_required_this_epoch'] else 'false'}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-v2-1-state-${{ github.run_id }}
          path: out/state
          if-no-files-found: error
          retention-days: 90

  axis-ai-gate:
    needs: replay
    if: needs.replay.outputs.active_axis_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with: {name: 'zel-component-autonomy-v2-1-state-${{ github.run_id }}', path: input/state}
      - name: Prepare stripped single-axis envelopes
        run: python backend/tools/zel_component_axis_ai_gate_v2.py prepare --result input/state/final.json --out out/ai
      - name: Review each axis without aborting on expected HOLD or REJECT
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          mkdir -p out/ai/reviews
          for input in out/ai/inputs/*.json; do
            [ "$(basename "$input")" = index.json ] && continue
            axis=$(basename "$input" .json)
            set +e
            python scripts/strategy11_ai_review_router.py \
              --stage PRE_REPLAY_COMPONENT_AXIS --mode execute \
              --input "$input" --output "out/ai/reviews/${axis}.json"
            rc=$?
            set -e
            test -s "out/ai/reviews/${axis}.json" || { echo "missing receipt axis=$axis rc=$rc"; exit 1; }
          done
          python backend/tools/zel_component_axis_ai_gate_v2.py summarize \
            --inputs out/ai/inputs --reviews out/ai/reviews --out out/ai/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-autonomy-v2-1-axis-ai-${{ github.run_id }}
          path: out/ai
          if-no-files-found: error
          retention-days: 90

  gemini-direct-video:
    needs: replay
    if: needs.replay.outputs.gemini_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with: {name: 'zel-component-autonomy-v2-1-state-${{ github.run_id }}', path: input/state}
      - name: Restore previous Gemini receipt on master only
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/previous
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-component-autonomy-v2-1.yml --branch master --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-component-autonomy-v2-1-gemini-*' --dir input/previous 2>/dev/null; then break; fi
          done
          find input/previous -name gemini_artifact.json -print -quit > input/previous-path.txt || true
      - name: Execute or deduplicate Gemini direct-video review
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'}
        run: |
          previous=()
          if [ -s input/previous-path.txt ]; then previous=(--previous "$(cat input/previous-path.txt)"); fi
          python backend/tools/zel_component_gemini_v2_guard.py run \
            --result input/state/final.json \
            --video-registry backend/research/strategy11_gemini_video_registry_v3_2.json \
            "${previous[@]}" --out out/gemini
      - name: Gate each Gemini hypothesis independently
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          mkdir -p out/gemini/reviews
          if [ -d out/gemini/hypotheses ]; then
            for input in out/gemini/hypotheses/*.json; do
              [ -f "$input" ] || continue
              id=$(basename "$input" .json)
              set +e
              python scripts/strategy11_ai_review_router.py \
                --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS --mode execute \
                --input "$input" --gemini-artifact out/gemini/gemini_artifact.json \
                --output "out/gemini/reviews/${id}.json"
              rc=$?
              set -e
              test -s "out/gemini/reviews/${id}.json" || { echo "missing Gemini hypothesis receipt id=$id rc=$rc"; exit 1; }
            done
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          artifact=json.loads(Path('out/gemini/gemini_artifact.json').read_text())
          rows={}
          accepted=[]
          for path in sorted(Path('out/gemini/reviews').glob('*.json')):
              row=json.loads(path.read_text())
              providers=row.get('provider_results') or {}
              groq=(((providers.get('groq') or {}).get('artifact') or {}).get('review') or {}).get('decision')
              workers=(((providers.get('workers_ai') or {}).get('artifact') or {}).get('review') or {}).get('decision')
              passed=row.get('status')=='PASS_AI_REVIEW_ROUTER' and groq=='PASS_TO_REPLAY' and workers=='PASS_TO_REPLAY'
              rows[path.stem]={'router_status':row.get('status'),'groq_decision':groq,'workers_decision':workers,'pass_to_next':passed}
              if passed: accepted.append(path.stem)
          summary={'state':'PASS_COMPONENT_GEMINI_AI_GATE' if accepted else 'HOLD_NO_AI_APPROVED_COMPONENT_HYPOTHESIS','gemini_state':artifact.get('state'),'GEMINI_USED':artifact.get('GEMINI_USED',False),'data_fingerprint':artifact.get('data_fingerprint'),'hypothesis_count':len(artifact.get('hypotheses',[])),'reviewed_count':len(rows),'accepted_count':len(accepted),'accepted_ids':accepted,'reviews':rows,'replay_allowed':False,'research_only':True,'promotion_authority':False,'execution_allowed':False,'order_authority':'BLOCKED','runtime_bound':False}
          Path('out/gemini/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-autonomy-v2-1-gemini-${{ github.run_id }}
          path: out/gemini
          if-no-files-found: error
          retention-days: 90
