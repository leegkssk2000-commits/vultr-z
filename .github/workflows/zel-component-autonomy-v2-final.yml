name: ZEL Component Autonomy V2 Final

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_autonomy_v2_runner.py'
      - 'backend/tools/zel_component_axis_ai_gate_v2.py'
      - 'backend/tools/zel_component_gemini_v2.py'
      - 'backend/tools/zel_component_pipeline_audit_v2.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2-final.yml'
  push:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_autonomy_v2_runner.py'
      - 'backend/tools/zel_component_axis_ai_gate_v2.py'
      - 'backend/tools/zel_component_gemini_v2.py'
      - 'backend/tools/zel_component_pipeline_audit_v2.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2-final.yml'
  schedule:
    - cron: '57 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-component-autonomy-v2-final-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  EVIDENCE_RUN_ID: '30252022416'
  EVIDENCE_ARTIFACT: 's11-evidence-batch-5-30252022416-attempt-1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Compile and run all deterministic fixtures
        run: |
          python -m py_compile \
            backend/tools/zel_component_autonomy_v2.py \
            backend/tools/zel_component_autonomy_v2_runner.py \
            backend/tools/zel_component_axis_ai_gate_v2.py \
            backend/tools/zel_component_gemini_v2.py \
            backend/tools/zel_component_pipeline_audit_v2.py
          python -m json.tool backend/research/zel_component_autonomy_policy_v2.json >/dev/null
          python backend/tools/zel_component_autonomy_v2_runner.py fixture --out out/runner
          python backend/tools/zel_component_axis_ai_gate_v2.py fixture --out out/axis
          python backend/tools/zel_component_gemini_v2.py --fixture --out out/gemini
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/runner/fixture_result.json').read_text())
          low=json.loads(Path('out/runner/low_sample_fixture_result.json').read_text())
          assert row['schema_version']=='2.1'
          assert row['component_attribution']['method']=='SEQUENTIAL_MATERIAL_ONLY_EXACT_SUM'
          assert abs(row['component_attribution']['interaction_residual']) <= 1e-12
          assert low['state']=='LOW_SAMPLE_HOLD' and not any(low['axis_review_eligibility'].values())
          assert row['order_authority']=='BLOCKED' and row['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-v2-final-fixtures-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30

  replay-audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      active_axis_count: ${{ steps.gates.outputs.active_axis_count }}
      gemini_required: ${{ steps.gates.outputs.gemini_required }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Restore latest final state on master only
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p input/previous
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-component-autonomy-v2-final.yml --branch master --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-component-v2-final-state-*' --dir input/previous 2>/dev/null; then break; fi
          done
          find input/previous -name state.json -print -quit > input/previous-path.txt || true
      - name: Verify exact source authority
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          policy=json.loads(Path('backend/research/zel_component_autonomy_policy_v2.json').read_text())
          root=Path('input/evidence/trend_ma_macd')
          ledger=root/'baseline_trades.json'; summary=root/'summary.json'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==policy['source_authorities']['trade_ledger_file_sha256']
          assert hashlib.sha256(summary.read_bytes()).hexdigest()==policy['source_authorities']['summary_file_sha256']
          row=json.loads(summary.read_text())
          assert row['authority_exact_summary_sha256']==policy['source_authorities']['authority_exact_summary_sha256']
          assert row['selected_authority_result_sha256']==policy['source_authorities']['selected_authority_result_sha256']
          PY
      - name: Run sequential material-only pipeline
        run: |
          previous=()
          if [ -s input/previous-path.txt ]; then previous=(--previous-state "$(cat input/previous-path.txt)"); fi
          python backend/tools/zel_component_autonomy_v2_runner.py run \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --ledger input/evidence/trend_ma_macd/baseline_trades.json \
            --summary input/evidence/trend_ma_macd/summary.json \
            "${previous[@]}" --out out/state
      - name: Audit source-bound pipeline and prepare safe AI envelopes
        id: gates
        run: |
          python backend/tools/zel_component_pipeline_audit_v2.py \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --result out/state/final.json \
            --core backend/tools/zel_component_autonomy_v2.py \
            --runner backend/tools/zel_component_autonomy_v2_runner.py \
            --gemini backend/tools/zel_component_gemini_v2.py \
            --role-contract backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            --workflow .github/workflows/zel-component-autonomy-v2-final.yml \
            --diagnostic-workflow .github/workflows/zel-component-ai-gate-diagnostic-v1.yml \
            --out out/audit
          python backend/tools/zel_component_axis_ai_gate_v2.py prepare --result out/state/final.json --out out/axis
          python - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads(Path('out/state/final.json').read_text())
          audit=json.loads(Path('out/audit/report.json').read_text())
          index=json.loads(Path('out/axis/inputs/index.json').read_text())
          assert audit['state']=='PASS_COMPONENT_PIPELINE_AUDIT_V2', audit['findings']
          assert row['state']=='LOW_SAMPLE_HOLD'
          assert row['control']['stats']['trade_count']==5
          assert not any(row['axis_review_eligibility'].values())
          assert index['active_axes']==[]
          assert abs(row['component_attribution']['interaction_residual']) <= 1e-12
          assert row['shadow_start_allowed'] is False and row['order_authority']=='BLOCKED'
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"active_axis_count={len(index['active_axes'])}\n")
              handle.write(f"gemini_required={'true' if row['ai_usage']['gemini_required_this_epoch'] else 'false'}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-v2-final-state-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  axis-ai-gate:
    needs: replay-audit
    if: needs.replay-audit.outputs.active_axis_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with: {name: 'zel-component-v2-final-state-${{ github.run_id }}', path: input}
      - name: Review each material axis and preserve expected HOLD or REJECT
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          mkdir -p out/reviews
          for input_file in input/axis/inputs/*.json; do
            [ "$(basename "$input_file")" = index.json ] && continue
            axis=$(basename "$input_file" .json)
            set +e
            python scripts/strategy11_ai_review_router.py --stage PRE_REPLAY_COMPONENT_AXIS --mode execute --input "$input_file" --output "out/reviews/${axis}.json"
            rc=$?
            set -e
            test -s "out/reviews/${axis}.json" || { echo "missing receipt axis=$axis rc=$rc"; exit 1; }
          done
          python backend/tools/zel_component_axis_ai_gate_v2.py summarize --inputs input/axis/inputs --reviews out/reviews --out out/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-v2-final-axis-ai-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90

  gemini-direct-video:
    needs: replay-audit
    if: needs.replay-audit.outputs.gemini_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir groq
      - uses: actions/download-artifact@v4
        with: {name: 'zel-component-v2-final-state-${{ github.run_id }}', path: input}
      - name: Restore prior Gemini receipt on master only
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p previous out/gemini
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow zel-component-autonomy-v2-final.yml --branch master --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'zel-component-v2-final-gemini-*' --dir previous 2>/dev/null; then break; fi
          done
          find previous -name gemini_artifact.json -print -quit > previous-path.txt || true
      - name: Resolve fingerprint guard
        id: preflight
        run: |
          mkdir -p out/gemini
          python - <<'PY'
          import json,os
          from pathlib import Path
          current=json.loads(Path('input/state/final.json').read_text())
          previous={}
          p=Path('previous-path.txt')
          if p.exists() and p.read_text().strip(): previous=json.loads(Path(p.read_text().strip()).read_text())
          execute=not (previous.get('GEMINI_USED') is True and previous.get('data_fingerprint')==current.get('data_fingerprint'))
          if not execute:
              Path('out/gemini/gemini_artifact.json').write_text(json.dumps({'state':'SKIP_UNCHANGED_COMPONENT_FINGERPRINT','GEMINI_USED':False,'data_fingerprint':current.get('data_fingerprint'),'hypotheses':[],'replay_allowed':False,'research_only':True,'promotion_authority':False,'execution_allowed':False,'order_authority':'BLOCKED','runtime_bound':False},indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle: handle.write(f"execute={'true' if execute else 'false'}\n")
          PY
      - name: Execute actual four-video Gemini review
        if: steps.preflight.outputs.execute == 'true'
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'}
        run: python backend/tools/zel_component_gemini_v2.py --result input/state/final.json --video-registry backend/research/strategy11_gemini_video_registry_v3_2.json --out out/gemini
      - name: Gate each Gemini hypothesis independently
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          mkdir -p out/gemini/reviews
          if [ -d out/gemini/hypotheses ]; then
            for input_file in out/gemini/hypotheses/*.json; do
              [ -f "$input_file" ] || continue
              id=$(basename "$input_file" .json)
              set +e
              python scripts/strategy11_ai_review_router.py --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS --mode execute --input "$input_file" --gemini-artifact out/gemini/gemini_artifact.json --output "out/gemini/reviews/${id}.json"
              rc=$?
              set -e
              test -s "out/gemini/reviews/${id}.json" || { echo "missing hypothesis receipt id=$id rc=$rc"; exit 1; }
            done
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          artifact=json.loads(Path('out/gemini/gemini_artifact.json').read_text())
          reviews={}; accepted=[]
          for path in sorted(Path('out/gemini/reviews').glob('*.json')):
              row=json.loads(path.read_text()); providers=row.get('provider_results') or {}
              gd=((((providers.get('groq') or {}).get('artifact') or {}).get('review') or {}).get('decision'))
              wd=((((providers.get('workers_ai') or {}).get('artifact') or {}).get('review') or {}).get('decision'))
              passed=row.get('status')=='PASS_AI_REVIEW_ROUTER' and gd==wd=='PASS_TO_REPLAY'
              reviews[path.stem]={'router_status':row.get('status'),'groq_decision':gd,'workers_decision':wd,'pass_to_future_replay':passed}
              if passed: accepted.append(path.stem)
          summary={'state':'PASS_COMPONENT_GEMINI_AI_GATE' if accepted else 'HOLD_NO_AI_APPROVED_COMPONENT_HYPOTHESIS','gemini_state':artifact.get('state'),'GEMINI_USED':artifact.get('GEMINI_USED',False),'data_fingerprint':artifact.get('data_fingerprint'),'actual_model':artifact.get('actual_model'),'video_count':artifact.get('public_video_count',0),'independent_channel_count':artifact.get('independent_channel_count',0),'hypothesis_count':len(artifact.get('hypotheses',[])),'reviewed_count':len(reviews),'accepted_count':len(accepted),'accepted_ids':accepted,'reviews':reviews,'replay_allowed_now':False,'research_only':True,'promotion_authority':False,'execution_allowed':False,'order_authority':'BLOCKED','runtime_bound':False}
          Path('out/gemini/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          if '${{ steps.preflight.outputs.execute }}'=='true':
              assert artifact.get('state')=='PASS_COMPONENT_GEMINI_DIRECT_VIDEO'
              assert artifact.get('GEMINI_USED') is True
              assert artifact.get('public_video_count',0)>=4 and artifact.get('independent_channel_count',0)>=4
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-v2-final-gemini-${{ github.run_id }}
          path: out/gemini
          if-no-files-found: error
          retention-days: 90
