name: ZEL Component Autonomy V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_autonomy_v2_runner.py'
      - 'backend/tools/zel_component_gemini_v2.py'
      - 'backend/tools/zel_component_pipeline_audit_v2.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-component-autonomy-v2-legacy-provenance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .

jobs:
  legacy-provenance:
    name: Verify V2 legacy baseline without autonomous execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Compile and verify deterministic legacy fixtures
        run: |
          python -m py_compile \
            backend/tools/zel_component_autonomy_v2.py \
            backend/tools/zel_component_autonomy_v2_runner.py \
            backend/tools/zel_component_gemini_v2.py \
            backend/tools/zel_component_pipeline_audit_v2.py
          python -m json.tool backend/research/zel_component_autonomy_policy_v2.json >/dev/null
          python backend/tools/zel_component_autonomy_v2_runner.py fixture --out out/fixture
          python backend/tools/zel_component_gemini_v2.py --fixture --out out/gemini-fixture
      - name: Audit legacy result against canonical V3 guard surface
        run: |
          python backend/tools/zel_component_pipeline_audit_v2.py \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --result out/fixture/fixture_result.json \
            --core backend/tools/zel_component_autonomy_v2.py \
            --runner backend/tools/zel_component_autonomy_v2_runner.py \
            --gemini backend/tools/zel_component_gemini_v2.py \
            --role-contract backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            --workflow .github/workflows/zel-component-autonomy-v3.yml \
            --diagnostic-workflow .github/workflows/zel-component-ai-gate-diagnostic-v1.yml \
            --out out/audit
          python - <<'PY'
          import json
          from pathlib import Path
          fixture=json.loads(Path('out/fixture/fixture_result.json').read_text())
          low=json.loads(Path('out/fixture/low_sample_fixture_result.json').read_text())
          audit=json.loads(Path('out/audit/report.json').read_text())
          assert fixture['schema_version']=='2.1'
          assert fixture['component_attribution']['method']=='SEQUENTIAL_MATERIAL_ONLY_EXACT_SUM'
          assert low['state']=='LOW_SAMPLE_HOLD'
          assert not any(low['axis_review_eligibility'].values())
          assert audit['state']=='PASS_COMPONENT_PIPELINE_AUDIT_V2',audit['findings']
          assert fixture['execution_allowed'] is False
          assert fixture['execution_authority']=='NONE'
          assert fixture['order_authority']=='BLOCKED'
          assert fixture['shadow_start_allowed'] is False
          print('PASS_COMPONENT_V2_LEGACY_PROVENANCE_ONLY')
          PY
      - name: Emit explicit retirement receipt
        run: |
          mkdir -p out/retirement
          python - <<'PY'
          import json
          from pathlib import Path
          row={
            'schema_version':'zel.component.v2.retirement.v1',
            'state':'PASS_V2_LEGACY_PROVENANCE_ONLY',
            'autonomous_schedule_enabled':False,
            'push_execution_enabled':False,
            'canonical_successor':'ZEL Component Autonomy V3',
            'next':'USE_COMPONENT_V3_ONLY',
            'research_only':True,
            'promotion_authority':False,
            'protected_mutations':0,
            'execution_allowed':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'runtime_bound':False,
            'shadow_start_allowed':False,
            'paper_allowed':False,
            'live_allowed':False,
          }
          Path('out/retirement/status.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-component-autonomy-v2-legacy-provenance-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
