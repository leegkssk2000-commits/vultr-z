name: ZEL Component Pipeline Audit V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v1.py'
      - 'backend/tools/zel_component_pipeline_audit_v1.py'
      - 'backend/research/zel_component_autonomy_policy_v1.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v1.yml'
      - '.github/workflows/zel-component-pipeline-audit-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v1.py'
      - 'backend/tools/zel_component_pipeline_audit_v1.py'
      - 'backend/research/zel_component_autonomy_policy_v1.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v1.yml'
      - '.github/workflows/zel-component-pipeline-audit-v1.yml'
  schedule:
    - cron: '27 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-component-pipeline-audit-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  COMPONENT_STATE_RUN_ID: '30631629312'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact source-bound component state
        uses: actions/download-artifact@v4
        with:
          name: zel-component-autonomy-state-${{ env.COMPONENT_STATE_RUN_ID }}
          path: input/state
          github-token: ${{ github.token }}
          run-id: ${{ env.COMPONENT_STATE_RUN_ID }}
      - name: Compile and audit complete pipeline
        run: |
          python -m py_compile backend/tools/zel_component_pipeline_audit_v1.py
          python backend/tools/zel_component_pipeline_audit_v1.py \
            --policy backend/research/zel_component_autonomy_policy_v1.json \
            --result input/state/final.json \
            --source backend/tools/zel_component_autonomy_v1.py \
            --role-contract backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            --workflow .github/workflows/zel-component-autonomy-v1.yml \
            --diagnostic-workflow .github/workflows/zel-component-ai-gate-diagnostic-v1.yml \
            --out out/audit
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/audit/report.json').read_text())
          assert row['order_authority']=='BLOCKED'
          assert row['execution_allowed'] is False
          assert row['runtime_bound'] is False
          assert row['finding_count']>=1
          assert row['state']=='HOLD_COMPONENT_PIPELINE_OPTIMIZATION_REQUIRED'
          required={
            'SHORT_BEAM_FALSE_EXACT_ABLATION','LONG_BEAM_REVERSED_ABLATION_SEMANTICS',
            'TEAM_WATCHERS_PARTIALLY_APPLIED','BOT_PROFILE_LEAK_ACROSS_ROLES',
            'ZLICE_NOT_ACTUALLY_REPLAYED','LOW_SAMPLE_PERFORMANCE_CLAIM',
            'GEMINI_REQUEST_ONLY_NOT_EXECUTED'
          }
          actual={item['code'] for item in row['findings']}
          assert required <= actual, sorted(required-actual)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-pipeline-audit-${{ github.run_id }}
          path: out/audit
          if-no-files-found: error
          retention-days: 90
