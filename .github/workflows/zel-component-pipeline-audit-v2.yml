name: ZEL Component Pipeline Audit V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_gemini_direct_video_v1.py'
      - 'backend/tools/zel_component_pipeline_audit_v2.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2.yml'
      - '.github/workflows/zel-component-pipeline-audit-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/tools/zel_component_autonomy_v2.py'
      - 'backend/tools/zel_component_gemini_direct_video_v1.py'
      - 'backend/tools/zel_component_pipeline_audit_v2.py'
      - 'backend/research/zel_component_autonomy_policy_v2.json'
      - 'backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py'
      - '.github/workflows/zel-component-autonomy-v2.yml'
      - '.github/workflows/zel-component-pipeline-audit-v2.yml'
  schedule:
    - cron: '27 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-component-pipeline-audit-v2-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: .
  EVIDENCE_RUN_ID: '30252022416'
  EVIDENCE_ARTIFACT: 's11-evidence-batch-5-30252022416-attempt-1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: input/evidence
          github-token: ${{ github.token }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Recompute source-bound V2 result
        run: |
          python backend/tools/zel_component_autonomy_v2.py run \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --ledger input/evidence/trend_ma_macd/baseline_trades.json \
            --summary input/evidence/trend_ma_macd/summary.json \
            --out out/state
      - name: Audit complete V2 pipeline
        run: |
          python -m py_compile backend/tools/zel_component_pipeline_audit_v2.py
          python backend/tools/zel_component_pipeline_audit_v2.py \
            --policy backend/research/zel_component_autonomy_policy_v2.json \
            --result out/state/final.json \
            --source backend/tools/zel_component_autonomy_v2.py \
            --role-contract backend/contracts/strategy11_role_boundary_zbot_zico_lico_zlice_v1.py \
            --workflow .github/workflows/zel-component-autonomy-v2.yml \
            --diagnostic .github/workflows/zel-component-ai-gate-diagnostic-v1.yml \
            --out out/audit
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/audit/report.json').read_text())
          assert row['state']=='PASS_COMPONENT_PIPELINE_AUDIT_V2', row
          assert row['finding_count']==0, row['findings']
          assert row['metrics']['control_trade_count']==5
          assert row['order_authority']=='BLOCKED' and row['runtime_bound'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-component-pipeline-audit-v2-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
