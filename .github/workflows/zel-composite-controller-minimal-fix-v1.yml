name: ZEL Composite Controller Minimal Fix V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-composite-controller-minimal-fix-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-composite-controller-minimal-fix-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zel-composite-ssh-path-fix-v1
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Permit audited HOLD receipt exit code
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('backend/tools/zel_composite_post_terminal_controller_v2.sh')
          text=path.read_text()
          old='''"${SSH[@]}" \\
  "python3 - --source-root /home/z/z --trades /var/lib/zel-research/data-b-1m-v2/trades.jsonl.gz --stdout" \\
  < "$ROOT/backend/tools/zel_trade_method_runtime_behavior_v1.py" \\
  > "$OUT/trade_method_behavior.json"
          python - <<'PY'
          '''
          new='''set +e
          "${SSH[@]}" \\
            "python3 - --source-root /home/z/z --trades /var/lib/zel-research/data-b-1m-v2/trades.jsonl.gz --stdout" \\
            < "$ROOT/backend/tools/zel_trade_method_runtime_behavior_v1.py" \\
            > "$OUT/trade_method_behavior.json"
          trade_method_behavior_rc=$?
          set -e
          test "$trade_method_behavior_rc" -eq 0 -o "$trade_method_behavior_rc" -eq 1
          python - <<'PY'
          '''
          if 'trade_method_behavior_rc=$?' not in text:
              assert text.count(old)==1,text.count(old)
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          bash -n backend/tools/zel_composite_post_terminal_controller_v2.sh
          python - <<'PY'
          from pathlib import Path
          text=Path('backend/tools/zel_composite_post_terminal_controller_v2.sh').read_text()
          assert 'trade_method_behavior_rc=$?' in text
          assert 'test "$trade_method_behavior_rc" -eq 0 -o "$trade_method_behavior_rc" -eq 1' in text
          assert 'HOLD_TRADE_METHOD_ENABLED_COUNTERFACTUAL_ADAPTER_REQUIRED' in text
          print('PASS_TRADE_METHOD_FAIL_CLOSED_EXIT_COMPATIBILITY')
          PY
      - name: Commit shell-only fix
        run: |
          set -euo pipefail
          git config user.name 'zel-composite-controller-fix-bot'
          git config user.email 'zel-composite-controller-fix-bot@users.noreply.github.com'
          git add backend/tools/zel_composite_post_terminal_controller_v2.sh
          if git diff --cached --quiet; then
            echo 'PASS_ALREADY_PATCHED'
            exit 0
          fi
          git commit -m 'fix(zel): accept audited Trade Method HOLD exit'
          git push origin HEAD:zel-composite-ssh-path-fix-v1
