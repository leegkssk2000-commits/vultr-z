name: ZEL D2 hlhb saved benchmark verification
on:
  pull_request:
    paths:
      - 'research/benchmarks/D2_HLHB_FREQTRADE_2026_7_V1/**'
      - '.github/workflows/zel-d2-hlhb-benchmark-verify.yml'
  push:
    branches: [master]
    paths:
      - 'research/benchmarks/D2_HLHB_FREQTRADE_2026_7_V1/**'
      - '.github/workflows/zel-d2-hlhb-benchmark-verify.yml'
permissions:
  contents: read
jobs:
  verify-saved-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify closed ledger and frozen saved artifacts without economic replay
        working-directory: research/benchmarks/D2_HLHB_FREQTRADE_2026_7_V1
        run: |
          python3 -B verify_closed.py --manifest-sha256 378a28dd3696422a13b938bf5f95c1de1381b12b4b5dfdb64a4e914c8c9398b5
          python3 -B -m unittest -v test_verify_closed
