name: ZEL Data A Isolated Owner Repair V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - tools/run_zel_data_a_isolated_owner_repair_v1.sh
      - .github/workflows/zel-data-a-isolated-owner-repair-v1.yml
  push:
    branches: [master]
    paths:
      - tools/run_zel_data_a_isolated_owner_repair_v1.sh
      - .github/workflows/zel-data-a-isolated-owner-repair-v1.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-data-a-isolated-owner-repair-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate repair syntax and fixed lineage
        run: |
          set -euo pipefail
          bash -n tools/run_zel_data_a_isolated_owner_repair_v1.sh
          grep -q 'a45d875964abc6b4e6e55425ce4ae3a4931c7e53' tools/run_zel_data_a_isolated_owner_repair_v1.sh
          grep -q '52d2a4454311a604edcb9d74596dc65d092c84267e5fc439b794becd5432e338' tools/run_zel_data_a_isolated_owner_repair_v1.sh
          grep -q 'formal_prefix_unchanged' tools/run_zel_data_a_isolated_owner_repair_v1.sh

  repair:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Checkout verified Data B branch
        uses: actions/checkout@v4
        with:
          ref: zel-historical-oos-data-v1
          path: historical
          persist-credentials: false

      - name: Assert Data B remains PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('historical/zel_historical_oos_v1/manifest.json').read_text())
          assert d['state']=='PASS_HISTORICAL_OOS_DATA_READY',d
          assert d['total_market_rows']==302400,d
          assert d['window_count']==6,d
          assert d['forward_overlap_count']==0,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE',d
          assert d['order_authority']=='BLOCKED',d
          PY

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload isolated owner repair
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            tools/run_zel_data_a_isolated_owner_repair_v1.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Execute isolated Data A repair
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod 700 /tmp/run_zel_data_a_isolated_owner_repair_v1.sh && \
             /tmp/run_zel_data_a_isolated_owner_repair_v1.sh \
               /tmp/zel_data_a_isolated_owner_repair_result.json \
               '${GITHUB_SHA}'"

      - name: Fetch Data A terminal result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p result
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_a_isolated_owner_repair_result.json" \
            result/data_a_latest.json

      - name: Build combined A+B result
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          a=json.loads(Path('result/data_a_latest.json').read_text())
          b=json.loads(Path('historical/zel_historical_oos_v1/manifest.json').read_text())
          passed=(a.get('state')=='PASS' and b.get('state')=='PASS_HISTORICAL_OOS_DATA_READY')
          combined={
            'schema_version':'zel.data_ab_expansion.combined_result.v2',
            'state':'PASS' if passed else 'HOLD',
            'verdict':'DATA_A_FORWARD_EXPANSION_AND_B_HISTORICAL_OOS_READY' if passed else 'DATA_AB_EXPANSION_HOLD',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'source_sha':a.get('source_sha'),
            'data_a':a,
            'data_b':{
              'state':b['state'],
              'symbols':b['symbols'],
              'symbol_count':len(b['symbols']),
              'window_count':b['window_count'],
              'total_market_rows':b['total_market_rows'],
              'total_market_requests':b['total_market_requests'],
              'forward_overlap_count':b['forward_overlap_count'],
              'final_holdout_accessed':b['final_holdout_accessed'],
              'promotion_authority':b['promotion_authority'],
              'data_branch':'zel-historical-oos-data-v1',
              'manifest_sha256':'180862fd1ccd3f32eea28698ea1480982687db00',
            },
            'paper_enabled':False,
            'live_enabled':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'action':'hold',
          }
          Path('result/latest.json').write_text(json.dumps(combined,indent=2,sort_keys=True)+'\n')
          PY

      - name: Checkout result branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results-branch
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish Data A and combined result
        if: always()
        run: |
          set -euo pipefail
          test -s result/data_a_latest.json
          test -s result/latest.json
          mkdir -p results-branch/runtime_results/zel/data_ab_expansion_v1
          cp result/data_a_latest.json results-branch/runtime_results/zel/data_ab_expansion_v1/data_a_latest.json
          cp result/latest.json results-branch/runtime_results/zel/data_ab_expansion_v1/latest.json
          cp result/latest.json "results-branch/runtime_results/zel/data_ab_expansion_v1/combined_${GITHUB_RUN_ID}.json"
          cd results-branch
          git config user.name 'zel-data-a-repair-bot'
          git config user.email 'zel-data-a-repair-bot@users.noreply.github.com'
          git add runtime_results/zel/data_ab_expansion_v1
          state=$(python -c "import json;print(json.load(open('runtime_results/zel/data_ab_expansion_v1/latest.json'))['state'])")
          git commit -m "result(zel): isolated Data A repair ${state} ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Assert final PASS contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/latest.json').read_text())
          assert d['state']=='PASS',d
          assert d['verdict']=='DATA_A_FORWARD_EXPANSION_AND_B_HISTORICAL_OOS_READY',d
          a=d['data_a']
          assert a['verdict']=='DATA_A_FORWARD_EXPANSION_ISOLATED_OWNER_PINNED_READY',d
          assert a['owner_recovery']['canonical_working_tree_mutated'] is False,d
          assert a['owner_recovery']['manifest_mutated'] is False,d
          assert a['canonical']['producer_pid_before']==a['canonical']['producer_pid_after'],d
          assert a['canonical']['writer_pid_before']==a['canonical']['writer_pid_after'],d
          assert a['canonical']['formal_prefix_unchanged'] is True,d
          lane=a['data_a']
          assert lane['service_active'] is True,d
          assert lane['symbol_count']==5,d
          assert lane['strategy_count']==25,d
          assert lane['parallel_strategy_symbol_lanes']==125,d
          assert lane['processed_symbol_count']==5,d
          assert lane['measurement_writer_enabled'] is False,d
          assert lane['formal_ledger_join_enabled'] is False,d
          assert lane['private_credentials_used'] is False,d
          assert not lane['cycle_errors'],d
          assert d['data_b']['total_market_rows']==302400,d
          assert d['data_b']['forward_overlap_count']==0,d
          assert d['execution_authority']=='NONE',d
          assert d['order_authority']=='BLOCKED',d
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-data-a-isolated-owner-repair-v1-${{ github.run_id }}
          path: result
          if-no-files-found: error
          retention-days: 30
