name: ZEL Data A+B Expansion V1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - tools/run_zel_data_ab_expansion_v1.sh
      - backend/tools/zel_historical_oos_data_collector_v1.py
      - .github/workflows/zel-data-ab-expansion-v1.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-data-ab-expansion-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Validate deployment and collector syntax
        run: |
          set -euo pipefail
          bash -n tools/run_zel_data_ab_expansion_v1.sh
          python -m py_compile backend/tools/zel_historical_oos_data_collector_v1.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload isolated A+B job
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            tools/run_zel_data_ab_expansion_v1.sh \
            backend/tools/zel_historical_oos_data_collector_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Execute A+B expansion on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod 700 /tmp/run_zel_data_ab_expansion_v1.sh && \
             /tmp/run_zel_data_ab_expansion_v1.sh \
               /tmp/zel_historical_oos_data_collector_v1.py \
               /tmp/zel_data_ab_expansion_result.json \
               '${GITHUB_SHA}'"

      - name: Fetch verified result
        if: always()
        run: |
          mkdir -p result
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_ab_expansion_result.json" \
            result/latest.json

      - name: Assert terminal contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/latest.json').read_text())
          assert d['state']=='PASS', d
          assert d['verdict']=='DATA_A_FORWARD_EXPANSION_AND_B_HISTORICAL_OOS_READY', d
          assert d['producer_blob_expected']==d['producer_blob_actual'], d
          c=d['canonical']
          assert c['producer_pid_before']==c['producer_pid_after'], d
          assert c['writer_pid_before']==c['writer_pid_after'], d
          assert c['formal_prefix_unchanged'] is True, d
          a=d['data_a']
          assert a['service_active'] is True, d
          assert a['symbol_count']==5, d
          assert a['strategy_count']==25, d
          assert a['parallel_strategy_symbol_lanes']==125, d
          assert a['processed_symbol_count']==5, d
          assert a['measurement_writer_enabled'] is False, d
          assert a['formal_ledger_join_enabled'] is False, d
          assert a['private_credentials_used'] is False, d
          assert not a['cycle_errors'], d
          b=d['data_b']
          assert b['state']=='PASS_HISTORICAL_OOS_DATA_READY', d
          assert b['symbol_count']==5, d
          assert b['window_count']==6, d
          assert b['total_market_rows']==302400, d
          assert b['forward_overlap_count']==0, d
          assert b['final_holdout_accessed'] is False, d
          assert b['promotion_authority'] is False, d
          assert d['paper_enabled'] is False, d
          assert d['live_enabled'] is False, d
          assert d['execution_authority']=='NONE', d
          assert d['order_authority']=='BLOCKED', d
          PY

      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results-branch
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish sanitized GitHub result
        run: |
          set -euo pipefail
          mkdir -p results-branch/runtime_results/zel/data_ab_expansion_v1
          cp result/latest.json results-branch/runtime_results/zel/data_ab_expansion_v1/latest.json
          cp result/latest.json "results-branch/runtime_results/zel/data_ab_expansion_v1/run_${GITHUB_RUN_ID}.json"
          cd results-branch
          git config user.name 'zel-data-ab-bot'
          git config user.email 'zel-data-ab-bot@users.noreply.github.com'
          git add runtime_results/zel/data_ab_expansion_v1
          if git diff --cached --quiet; then
            echo 'No result delta.'
            exit 0
          fi
          git commit -m "result(zel): data A+B expansion ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Upload terminal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zel-data-ab-expansion-v1-${{ github.run_id }}
          path: result
          if-no-files-found: error
          retention-days: 30
