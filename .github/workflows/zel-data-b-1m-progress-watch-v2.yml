name: ZEL Data B 1m Progress Watch V2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_progress_probe_v2.py
      - .github/workflows/zel-data-b-1m-progress-watch-v2.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_progress_probe_v2.py
      - .github/workflows/zel-data-b-1m-progress-watch-v2.yml

permissions:
  contents: write

concurrency:
  group: zel-data-b-1m-progress-watch-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate read-only probe
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_data_b_1m_progress_probe_v2.py
          python - <<'PY'
          from pathlib import Path
          t=Path('backend/tools/zel_data_b_1m_progress_probe_v2.py').read_text()
          for token in ('os.kill','pkill','kill -','rm -rf','unlink(','rmtree(','systemctl stop','systemctl restart'):
              assert token not in t,token
          assert 'progress_pct": None' in t
          assert 'eta_min": None' in t
          assert 'ENGINE_DOES_NOT_EMIT_UNIT_PROGRESS' in t
          assert 'process_mutated": False' in t
          assert 'output_mutated": False' in t
          print('PASS_DATA_B_1M_PROGRESS_PROBE_V2_STATIC')
          PY

  watch:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Run read-only progress sample
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key backend/tools/zel_data_b_1m_progress_probe_v2.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_b_1m_progress_probe_v2.py"
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'python3 /tmp/zel_data_b_1m_progress_probe_v2.py'
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_b_1m_progress_probe_v2.json" \
            out/latest.json
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel_data_b_1m_progress_probe_v2.py /tmp/zel_data_b_1m_progress_probe_v2.json' || true
      - name: Validate receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['schema_version']=='zel.data_b.1m.progress_probe.v2',d
          assert d['safety']['read_only'] is True,d
          assert d['safety']['process_mutated'] is False,d
          assert d['safety']['output_mutated'] is False,d
          assert d['safety']['execution_authority']=='NONE',d
          assert d['safety']['order_authority']=='BLOCKED',d
          print(json.dumps({
              'state':d['state'],
              'process_count':d['latest']['process_count'],
              'root_group_count':d['latest']['root_group_count'],
              'cpu_delta_sec':d['cpu_delta_sec'],
              'output_bytes_delta':d['output_bytes_delta'],
              'elapsed_max_sec':d['latest']['elapsed_max_sec'],
              'terminal':d['latest']['output']['terminal'],
          },sort_keys=True))
          PY
      - name: Publish status authority
        run: |
          set -euo pipefail
          git clone --depth=1 --branch zel-data-expansion-results-v1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results
          root=results/runtime_results/zel/data_b_1m_progress_probe_v2
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-data-b-progress-watch-bot'
          git config user.email 'zel-data-b-progress-watch-bot@users.noreply.github.com'
          git add runtime_results/zel/data_b_1m_progress_probe_v2
          git commit -m "result(zel): Data B 1m progress watch ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - uses: actions/upload-artifact@v4
        with:
          name: zel-data-b-1m-progress-watch-v2-${{ github.run_id }}
          path: out/latest.json
          retention-days: 30

