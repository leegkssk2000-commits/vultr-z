name: ZEL Data B 1m Single Owner Repair V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_single_owner_prepare_v1.py
      - .github/workflows/zel-data-b-1m-single-owner-repair-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_single_owner_prepare_v1.py
      - .github/workflows/zel-data-b-1m-single-owner-repair-v1.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: zel-data-b-1m-single-owner-global-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Validate engine cleanup scope and 15m authority
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_historical_oos_exact25_replay_v1.py backend/tools/zel_data_b_1m_single_owner_prepare_v1.py
          python backend/tools/zel_historical_oos_exact25_replay_v1.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('backend/tools/zel_data_b_1m_single_owner_prepare_v1.py').read_text()
          assert "OUTPUT_ARG = '--output-dir /tmp/zel_historical_oos_exact25_replay_v1_1m'" in t
          assert "PATTERN = 'zel_historical_oos_exact25_replay_v1.py'" in t
          assert 'formal_ledger_mutated' in t
          d=json.loads(Path('results/runtime_results/zel/historical_oos_exact25_replay_v1/15m/latest.json').read_text())
          assert d['state']=='PASS' and d['interval']=='15m',d
          assert d['replay']['strategy_count_completed']==25 and d['replay']['strategy_failure_count']==0,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          PY

  repair:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload engine and exact cleanup
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            backend/tools/zel_historical_oos_exact25_replay_v1.py \
            backend/tools/zel_data_b_1m_single_owner_prepare_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"
      - name: Remove duplicate owners quarantine output and run one locked replay
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          exec 9>/var/lock/zel-data-b-1m-single-owner-v1.lock
          if ! flock -n 9; then
            echo GLOBAL_1M_LOCK_ALREADY_HELD
            exit 75
          fi
          python3 /tmp/zel_data_b_1m_single_owner_prepare_v1.py
          test -s /opt/zel/historical-oos-v1/manifest.json
          /home/z/z/.venv/bin/python /tmp/zel_historical_oos_exact25_replay_v1.py \
            --source-root /opt/zel/forward-expansion-v1/source \
            --data-root /opt/zel/historical-oos-v1 \
            --interval 1m \
            --output-dir /tmp/zel_historical_oos_exact25_replay_v1_1m \
            --workers 4
          test -s /tmp/zel_historical_oos_exact25_replay_v1_1m/report.json
          test -s /tmp/zel_historical_oos_exact25_replay_v1_1m/summary.json
          test -s /tmp/zel_historical_oos_exact25_replay_v1_1m/scoreboard.csv
          test -s /tmp/zel_historical_oos_exact25_replay_v1_1m/trades.jsonl.gz
          tar -C /tmp/zel_historical_oos_exact25_replay_v1_1m -czf /tmp/zel_historical_oos_exact25_replay_v1_1m.tar.gz .
          REMOTE
      - name: Fetch and validate exact result
        run: |
          set -euo pipefail
          mkdir -p result/1m
          scp -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_historical_oos_exact25_replay_v1_1m.tar.gz" /tmp/1m.tar.gz
          scp -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_b_1m_single_owner_prepare_v1.json" result/prepare.json
          tar -C result/1m -xzf /tmp/1m.tar.gz
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/prepare.json').read_text())
          d=json.loads(Path('result/1m/report.json').read_text())
          assert p['state']=='PASS_DUPLICATE_OWNERS_REMOVED_AND_OUTPUT_QUARANTINED',p
          assert not p['matched_processes_after'],p
          assert d['state']=='PASS' and d['interval']=='1m',d
          assert d['data']['symbol_count']==5 and d['data']['window_count']==3,d
          assert d['source']['strategy_count']==25 and d['source']['strategy_tree_unchanged'] is True,d
          assert d['canonical_runtime']['producer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['writer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['formal_ledger']['prefix_unchanged'] is True,d
          assert d['replay']['strategy_count_completed']==25 and d['replay']['strategy_failure_count']==0,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          PY
      - name: Publish 1m and combined authority
        run: |
          set -euo pipefail
          cd results
          git config user.name 'zel-data-b-single-owner-bot'
          git config user.email 'zel-data-b-single-owner-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          cd ..
          root=results/runtime_results/zel/historical_oos_exact25_replay_v1
          mkdir -p "$root/1m" "$root/single_owner"
          cp result/1m/report.json "$root/1m/latest.json"
          cp result/1m/summary.json "$root/1m/summary_latest.json"
          cp result/1m/scoreboard.csv "$root/1m/scoreboard_latest.csv"
          cp result/1m/report.json "$root/1m/run_${GITHUB_RUN_ID}.json"
          cp result/prepare.json "$root/single_owner/latest.json"
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('results/runtime_results/zel/historical_oos_exact25_replay_v1')
          a=json.loads((root/'15m/latest.json').read_text())
          b=json.loads((root/'1m/latest.json').read_text())
          d={'schema_version':'zel.historical_oos_exact25_replay.combined.v1','state':'PASS','verdict':'HISTORICAL_OOS_EXACT25_MULTI_TIMEFRAME_COMPLETE','generated_at':datetime.now(timezone.utc).isoformat(),'intervals':{'15m':{'closed_trade_count':a['replay']['closed_trade_count'],'strategy_call_count':a['replay']['strategy_call_count'],'error_count':a['replay']['error_count'],'report_sha256':hashlib.sha256((root/'15m/latest.json').read_bytes()).hexdigest()},'1m':{'closed_trade_count':b['replay']['closed_trade_count'],'strategy_call_count':b['replay']['strategy_call_count'],'error_count':b['replay']['error_count'],'report_sha256':hashlib.sha256((root/'1m/latest.json').read_bytes()).hexdigest()}},'total_closed_trade_count':a['replay']['closed_trade_count']+b['replay']['closed_trade_count'],'total_strategy_call_count':a['replay']['strategy_call_count']+b['replay']['strategy_call_count'],'single_owner_proved':True,'research_only':True,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','paper_enabled':False,'live_enabled':False,'action':'hold'}
          (root/'combined_latest.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cd results
          git add runtime_results/zel/historical_oos_exact25_replay_v1
          git commit -m "result(zel): Data B 1m single owner ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1
      - name: Dispatch receipt-driven DAG controller only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zel-pre-shadow-dag-controller-v1.yml --ref master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-data-b-1m-single-owner-repair-v1-${{ github.run_id }}
          path: result
          if-no-files-found: error
          retention-days: 90
