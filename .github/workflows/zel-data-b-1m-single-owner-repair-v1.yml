name: ZEL Data B 1m Single Owner Repair V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-single-owner-repair-v1.yml
      - .github/workflows/zel-data-b-1m-v2-recovery-v1.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: zel-data-b-1m-single-owner-global-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify legacy owner is retired
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/zel-data-b-1m-single-owner-repair-v1.yml').read_text()
          forbidden_replay='zel_historical_oos_exact25_replay_v1.py' + ' \\'
          forbidden_timeout='timeout-minutes: ' + '420'
          assert forbidden_replay not in text
          assert forbidden_timeout not in text
          assert 'gh workflow run zel-data-b-1m-v2-recovery-v1.yml --ref master' in text
          assert Path('.github/workflows/zel-data-b-1m-v2-recovery-v1.yml').is_file()
          print('PASS_LEGACY_V1_OWNER_RETIRED_TO_V2')
          PY

  redirect:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redirect all recovery authority to persistent V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zel-data-b-1m-v2-recovery-v1.yml --ref master
