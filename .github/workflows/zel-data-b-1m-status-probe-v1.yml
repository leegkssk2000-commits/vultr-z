name: ZEL Data B 1m Status Probe V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_status_probe_v1.py
      - .github/workflows/zel-data-b-1m-status-probe-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_data_b_1m_status_probe_v1.py
      - .github/workflows/zel-data-b-1m-status-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-data-b-1m-status-probe-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only probe
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_data_b_1m_status_probe_v1.py
          python - <<'PY'
          from pathlib import Path
          text=Path('backend/tools/zel_data_b_1m_status_probe_v1.py').read_text()
          assert "pgrep" in text
          assert "'read_only': True" in text
          assert "'execution_authority': 'NONE'" in text
          assert "'order_authority': 'BLOCKED'" in text
          forbidden=('systemctl', 'subprocess.run([\'kill\'', 'subprocess.run([\'pkill\'', 'unlink(', 'rmtree(')
          assert not any(token in text for token in forbidden)
          print('PASS_DATA_B_1M_STATUS_PROBE_READ_ONLY')
          PY

  probe:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Read VPS 1m state
        run: |
          set -euo pipefail
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            backend/tools/zel_data_b_1m_status_probe_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_data_b_1m_status_probe_v1.py"
          ssh -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'python3 /tmp/zel_data_b_1m_status_probe_v1.py' > out/vps.json
          python -m json.tool out/vps.json >/dev/null
      - name: Resolve publication state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          v=json.loads(Path('out/vps.json').read_text())
          root=Path('results/runtime_results/zel/historical_oos_exact25_replay_v1')
          one=(root/'1m/latest.json').is_file()
          combined=(root/'combined_latest.json').is_file()
          if one and combined:
              state='PASS_DATA_B_1M_AND_COMBINED_PUBLISHED'
          elif v.get('local_report_state')=='PASS' and not one:
              state='HOLD_1M_LOCAL_PASS_NOT_PUBLISHED'
          elif v.get('process_running'):
              state='IN_PROGRESS_DATA_B_1M_REPLAY'
          else:
              state='HOLD_1M_NOT_RUNNING_NO_TERMINAL_PUBLICATION'
          out={
              **v,
              'state':state,
              'result_branch_1m_published':one,
              'result_branch_combined_published':combined,
              'checked_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('out/latest.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(state)
          PY
      - name: Publish sanitized probe
        run: |
          set -euo pipefail
          mkdir -p results/runtime_results/zel/data_b_1m_status_probe_v1
          cp out/latest.json results/runtime_results/zel/data_b_1m_status_probe_v1/latest.json
          cd results
          git config user.name 'zel-data-b-status-probe-bot'
          git config user.email 'zel-data-b-status-probe-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          git add runtime_results/zel/data_b_1m_status_probe_v1/latest.json
          git commit -m "result(zel): Data B 1m status probe ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - name: Remove temporary probe
        if: always()
        run: |
          ssh -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel_data_b_1m_status_probe_v1.py' >/dev/null 2>&1 || true
