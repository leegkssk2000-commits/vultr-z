name: ZEL Data B 1m Terminal Repair V2

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-terminal-repair-v2.yml
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-terminal-repair-v2.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: zel-data-b-1m-terminal-repair-v2-dispatch
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Route to canonical single-owner workflow
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/zel-data-b-1m-single-owner-repair-v1.yml/dispatches" \
            -f ref=master
      - name: Record contract
        run: |
          echo 'Direct replay disabled. Canonical owner: ZEL Data B 1m Single Owner Repair V1.'
          echo 'execution=NONE order=BLOCKED action=hold'
