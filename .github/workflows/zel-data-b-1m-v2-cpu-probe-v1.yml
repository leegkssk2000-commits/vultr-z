name: ZEL Data B 1m V2 CPU Probe V1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-v2-cpu-probe-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-data-b-1m-v2-cpu-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: zel-data-expansion-results-v1, path: results, fetch-depth: 0, token: '${{ github.token }}'}
      - name: Sample V2 CPU for ten seconds
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'python3 -' > out/latest.json <<'PY'
          import json,os,time
          from datetime import datetime,timezone
          from pathlib import Path
          def pids():
              out=[]
              for p in Path('/proc').iterdir():
                  if not p.name.isdigit():continue
                  try:cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  except Exception:continue
                  if 'zel_historical_oos_exact25_replay_v2.py' in cmd and '--interval 1m' in cmd:out.append(int(p.name))
              return sorted(out)
          def sample(ids):
              total=0;rss=0;rows=[]
              hz=os.sysconf(os.sysconf_names['SC_CLK_TCK'])
              for pid in ids:
                  try:
                      stat=(Path('/proc')/str(pid)/'stat').read_text().split()
                      cpu=(int(stat[13])+int(stat[14]))/hz
                      status=(Path('/proc')/str(pid)/'status').read_text().splitlines()
                      rss_kb=next((int(x.split()[1]) for x in status if x.startswith('VmRSS:')),0)
                      total+=cpu;rss+=rss_kb/1024;rows.append({'pid':pid,'cpu_sec':cpu,'rss_mb':rss_kb/1024})
                  except Exception:pass
              return {'cpu_total_sec':total,'rss_total_mb':rss,'processes':rows}
          ids1=pids();a=sample(ids1);time.sleep(10);ids2=pids();b=sample(ids2)
          delta=round(b['cpu_total_sec']-a['cpu_total_sec'],3)
          out={'schema_version':'zel.data_b.1m.v2.cpu_probe.v1','generated_at':datetime.now(timezone.utc).isoformat(),'state':'IN_PROGRESS_DATA_B_1M_V2_ACTIVE' if len(ids2)>=2 and delta>0.5 else 'HOLD_V2_ACTIVITY_NOT_PROVED','sample_window_sec':10,'process_count_first':len(ids1),'process_count_latest':len(ids2),'cpu_delta_sec':delta,'rss_total_mb':round(b['rss_total_mb'],3),'pids_stable':ids1==ids2,'first':a,'latest':b,'read_only':True,'runtime_mutated':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python -m json.tool out/latest.json >/dev/null
      - name: Publish probe
        run: |
          set -euo pipefail
          root=results/runtime_results/zel/data_b_1m_v2_cpu_probe_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-data-b-v2-probe-bot'
          git config user.email 'zel-data-b-v2-probe-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          git add runtime_results/zel/data_b_1m_v2_cpu_probe_v1
          git commit -m "result(zel): Data B 1m V2 CPU probe ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
