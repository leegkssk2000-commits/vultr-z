name: ZEL Data B 1m V2 Stall Diagnose Once

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-v2-stall-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Capture all process CPU and IO deltas read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'python3 -' > out/diagnostic.json <<'PY'
          import json, subprocess, time
          from datetime import datetime, timezone
          from pathlib import Path

          unit='zel-data-b-1m-v2.service'
          root=Path('/var/lib/zel-research/data-b-1m-v2')

          def run(*args):
              p=subprocess.run(args,text=True,capture_output=True)
              return {'rc':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}

          def read_json(path):
              try: return json.loads(path.read_text()) if path.is_file() else None
              except Exception as exc: return {'_error':type(exc).__name__}

          def snapshot(pid):
              base=Path(f'/proc/{pid}')
              if not base.exists(): return None
              parts=(base/'stat').read_text().split()
              io={}
              for line in (base/'io').read_text().splitlines():
                  k,v=line.split(':',1); io[k.strip()]=int(v.strip())
              try: wchan=(base/'wchan').read_text().strip()
              except Exception: wchan=None
              return {
                  'pid':pid,
                  'state':parts[2],
                  'utime_ticks':int(parts[13]),
                  'stime_ticks':int(parts[14]),
                  'io':io,
                  'wchan':wchan,
                  'ps':run('ps','-p',str(pid),'-o','pid,ppid,etime,time,%cpu,%mem,stat,wchan:32,cmd')['stdout'],
              }

          show=run('systemctl','show',unit,'-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','CPUUsageNSec','-p','MemoryCurrent','-p','TasksCurrent','-p','ExecMainStartTimestamp')
          props={}
          for line in show['stdout'].splitlines():
              if '=' in line:
                  k,v=line.split('=',1); props[k]=v
          parent=int(props.get('MainPID') or 0)
          children=[]
          if parent:
              raw=run('pgrep','-P',str(parent))['stdout']
              children=[int(x) for x in raw.split() if x.isdigit()]
          pids=[parent]+children if parent else children
          before={str(pid):snapshot(pid) for pid in pids}
          time.sleep(10)
          after={str(pid):snapshot(pid) for pid in pids}

          deltas={}
          active=[]
          for pid in pids:
              key=str(pid); a=before.get(key); b=after.get(key)
              if not a or not b:
                  deltas[key]={'disappeared':True}; continue
              cpu=(b['utime_ticks']+b['stime_ticks'])-(a['utime_ticks']+a['stime_ticks'])
              io={k:b['io'].get(k,0)-a['io'].get(k,0) for k in set(a['io'])|set(b['io'])}
              moving=cpu>0 or any(io.get(k,0)>0 for k in ('read_bytes','write_bytes','syscr','syscw','rchar','wchar'))
              if moving: active.append(pid)
              deltas[key]={'cpu_delta_ticks_10s':cpu,'io_delta_10s':io,'active':moving,'state':b['state'],'wchan':b['wchan'],'ps':b['ps']}

          now=datetime.now(timezone.utc)
          progress_path=root/'progress.json'
          progress=read_json(progress_path)
          progress_age=None
          if progress_path.is_file(): progress_age=(now-datetime.fromtimestamp(progress_path.stat().st_mtime,timezone.utc)).total_seconds()
          checkpoints=sorted((root/'checkpoints').glob('*.json.gz'),key=lambda p:p.stat().st_mtime) if (root/'checkpoints').is_dir() else []

          if props.get('ActiveState')!='active' or parent<=0:
              state='HOLD_SERVICE_NOT_ACTIVE'
          elif active:
              state='PASS_WORKER_OR_PARENT_ACTIVITY_DETECTED'
          else:
              state='HOLD_ALL_PARENT_AND_WORKERS_NO_CPU_OR_IO_DELTA'

          out={
              'schema_version':'zel.data_b.1m.v2.stall_diagnostic.v2',
              'generated_at':now.isoformat(),
              'state':state,
              'systemd':props,
              'parent_pid':parent,
              'child_pids':children,
              'active_pids_10s':active,
              'before':before,
              'after':after,
              'deltas':deltas,
              'progress':progress,
              'progress_age_sec':progress_age,
              'checkpoint_count':len(checkpoints),
              'latest_checkpoints':[{'name':p.name,'size':p.stat().st_size,'mtime':datetime.fromtimestamp(p.stat().st_mtime,timezone.utc).isoformat()} for p in checkpoints[-5:]],
              'terminal_receipt':read_json(root/'terminal_receipt.json'),
              'journal_tail':run('journalctl','-u',unit,'--since','-90 minutes','-n','300','--no-pager'),
              'read_only':True,
              'runtime_mutated':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'action':'hold',
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python -m json.tool out/diagnostic.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: zel-data-b-1m-v2-stall-diagnose-once-${{ github.run_id }}
          path: out/diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
