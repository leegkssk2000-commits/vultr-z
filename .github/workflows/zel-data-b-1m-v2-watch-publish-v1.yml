name: ZEL Data B 1m V2 Watch Publish V1

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-v2-watch-publish-v1.yml
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-v2-watch-publish-v1.yml
      - backend/tools/zel_historical_oos_exact25_replay_v2.py

permissions:
  contents: write
  actions: write

concurrency:
  group: zel-data-b-1m-v2-watch-publish-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate publisher boundary
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_historical_oos_exact25_replay_v2.py
          python backend/tools/zel_historical_oos_exact25_replay_v2.py --self-test
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/zel-data-b-1m-v2-watch-publish-v1.yml').read_text()
          assert "schedule:" in t and "*/15 * * * *" in t
          assert "push:" in t and "branches: [master]" in t
          assert "terminal_receipt.json" in t
          assert "artifact_manifest.json" in t
          assert "strategy_count_completed']==25" in t
          assert "strategy_failure_count']==0" in t
          assert "gh workflow run zel-pre-shadow-dag-controller-v1.yml" in t
          assert "gh workflow run zel-composite-post-terminal-ai-authorizer-v1.yml" in t
          assert "git add runtime_results/zel/data_b_1m_v2_watch_v1" in t
          forbidden=(
            "git add runtime_results/zel/data_b_1m_v2_watch_v1 "
            + "runtime_results/zel/historical_oos_exact25_replay_v1"
          )
          assert forbidden not in t
          print('PASS_DATA_B_1M_V2_WATCH_PUBLISH_STATIC')
          PY

  watch:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Read V2 service, checkpoint and terminal state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'python3 -' > out/status.json <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/var/lib/zel-research/data-b-1m-v2')
          def cmd(*args):
              return subprocess.run(args,text=True,capture_output=True).stdout.strip()
          active=cmd('systemctl','is-active','zel-data-b-1m-v2.service')=='active'
          enabled=cmd('systemctl','is-enabled','zel-data-b-1m-v2.service')=='enabled'
          pid=int(cmd('systemctl','show','-p','MainPID','--value','zel-data-b-1m-v2.service') or 0)
          checkpoints=list((root/'checkpoints').glob('*.json.gz')) if (root/'checkpoints').is_dir() else []
          progress={}
          if (root/'progress.json').is_file():
              try: progress=json.loads((root/'progress.json').read_text())
              except Exception: progress={'state':'INVALID_PROGRESS_JSON'}
          terminal={}
          if (root/'terminal_receipt.json').is_file():
              try: terminal=json.loads((root/'terminal_receipt.json').read_text())
              except Exception: terminal={'state':'INVALID_TERMINAL_JSON'}
          terminal_complete=terminal.get('state')=='PASS'
          state='PASS_DATA_B_1M_V2_TERMINAL' if terminal_complete else ('IN_PROGRESS_DATA_B_1M_V2' if active else 'HOLD_DATA_B_1M_V2_NOT_ACTIVE_NO_TERMINAL')
          out={
            'schema_version':'zel.data_b.1m.v2.watch.v1',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'state':state,
            'service_active':active,
            'service_enabled':enabled,
            'main_pid':pid,
            'checkpoint_count':len(checkpoints),
            'progress':progress,
            'terminal_receipt':terminal,
            'terminal_complete':terminal_complete,
            'output_root_sha256':hashlib.sha256(str(root).encode()).hexdigest(),
            'read_only':True,
            'runtime_mutated':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'action':'hold',
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python -m json.tool out/status.json >/dev/null
      - name: Fetch terminal artifacts when complete
        id: terminal
        run: |
          set -euo pipefail
          complete=$(python - <<'PY'
          import json
          print('true' if json.load(open('out/status.json')).get('terminal_complete') else 'false')
          PY
          )
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [ "$complete" = true ]; then
            ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'tar -C /var/lib/zel-research/data-b-1m-v2 -czf /tmp/zel-data-b-1m-v2-terminal.tar.gz report.json summary.json scoreboard.csv trades.jsonl.gz progress.json artifact_manifest.json terminal_receipt.json'
            scp -i ~/.ssh/vps_key \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel-data-b-1m-v2-terminal.tar.gz" \
              out/terminal.tar.gz
            mkdir -p out/terminal
            tar -C out/terminal -xzf out/terminal.tar.gz
          fi
      - name: Validate terminal authority
        if: steps.terminal.outputs.complete == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/terminal')
          report=json.loads((root/'report.json').read_text())
          terminal=json.loads((root/'terminal_receipt.json').read_text())
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          progress=json.loads((root/'progress.json').read_text())
          assert report['state']=='PASS' and report['interval']=='1m',report
          assert report['version']=='ZEL_HISTORICAL_OOS_EXACT25_REPLAY_V2',report
          assert report['replay']['strategy_count_completed']==25,report
          assert report['replay']['strategy_failure_count']==0,report
          assert terminal['state']=='PASS' and terminal['runtime_safe'] is True,terminal
          assert terminal['strategy_count_completed']==25 and terminal['strategy_failure_count']==0,terminal
          assert manifest['terminal_complete'] is True and manifest['atomic_publication'] is True,manifest
          assert progress['state']=='PASS' and progress['completed_units']==25,progress
          assert report['canonical_runtime']['producer_pid_unchanged'] is True,report
          assert report['canonical_runtime']['writer_pid_unchanged'] is True,report
          assert report['canonical_runtime']['formal_ledger']['prefix_unchanged'] is True,report
          assert report['source']['strategy_tree_unchanged'] is True,report
          assert report['execution_authority']=='NONE' and report['order_authority']=='BLOCKED',report
          print(json.dumps({'state':'PASS_V2_TERMINAL_VALIDATED','closed':report['replay']['closed_trade_count']},sort_keys=True))
          PY
      - name: Publish watch and terminal authority
        run: |
          set -euo pipefail
          cd results
          git config user.name 'zel-data-b-v2-watch-bot'
          git config user.email 'zel-data-b-v2-watch-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          cd ..
          watch_root=results/runtime_results/zel/data_b_1m_v2_watch_v1
          mkdir -p "$watch_root"
          cp out/status.json "$watch_root/latest.json"
          cp out/status.json "$watch_root/run_${GITHUB_RUN_ID}.json"
          if [ "${{ steps.terminal.outputs.complete }}" = true ]; then
            v2root=results/runtime_results/zel/historical_oos_exact25_replay_v2/1m
            canon=results/runtime_results/zel/historical_oos_exact25_replay_v1
            mkdir -p "$v2root" "$canon/1m"
            cp out/terminal/report.json "$v2root/latest.json"
            cp out/terminal/summary.json "$v2root/summary_latest.json"
            cp out/terminal/scoreboard.csv "$v2root/scoreboard_latest.csv"
            cp out/terminal/progress.json "$v2root/progress_latest.json"
            cp out/terminal/artifact_manifest.json "$v2root/artifact_manifest_latest.json"
            cp out/terminal/terminal_receipt.json "$v2root/terminal_receipt_latest.json"
            cp out/terminal/report.json "$canon/1m/latest.json"
            cp out/terminal/summary.json "$canon/1m/summary_latest.json"
            cp out/terminal/scoreboard.csv "$canon/1m/scoreboard_latest.csv"
            python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('results/runtime_results/zel/historical_oos_exact25_replay_v1')
          a=json.loads((root/'15m/latest.json').read_text())
          b=json.loads((root/'1m/latest.json').read_text())
          d={
            'schema_version':'zel.historical_oos_exact25_replay.combined.v2',
            'state':'PASS',
            'verdict':'HISTORICAL_OOS_EXACT25_MULTI_TIMEFRAME_COMPLETE',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'intervals':{
              '15m':{'engine_version':a.get('version'),'closed_trade_count':a['replay']['closed_trade_count'],'strategy_call_count':a['replay']['strategy_call_count'],'error_count':a['replay']['error_count'],'report_sha256':hashlib.sha256((root/'15m/latest.json').read_bytes()).hexdigest()},
              '1m':{'engine_version':b.get('version'),'closed_trade_count':b['replay']['closed_trade_count'],'strategy_call_count':b['replay']['strategy_call_count'],'error_count':b['replay']['error_count'],'report_sha256':hashlib.sha256((root/'1m/latest.json').read_bytes()).hexdigest()},
            },
            'total_closed_trade_count':a['replay']['closed_trade_count']+b['replay']['closed_trade_count'],
            'total_strategy_call_count':a['replay']['strategy_call_count']+b['replay']['strategy_call_count'],
            'single_owner_proved':True,
            'v2_resume_capable':True,
            'research_only':True,
            'selection_authority':False,
            'promotion_authority':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'paper_enabled':False,
            'live_enabled':False,
            'action':'hold',
          }
          (root/'combined_latest.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          fi
          cd results
          git add runtime_results/zel/data_b_1m_v2_watch_v1
          if [ "${{ steps.terminal.outputs.complete }}" = true ]; then
            git add runtime_results/zel/historical_oos_exact25_replay_v1
            git add runtime_results/zel/historical_oos_exact25_replay_v2
          fi
          if git diff --cached --quiet; then
            echo 'HOLD_NO_WATCH_OR_TERMINAL_DELTA'
            exit 0
          fi
          git commit -m "result(zel): Data B 1m V2 watch ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1
      - name: Dispatch downstream controllers after terminal publication
        if: steps.terminal.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zel-pre-shadow-dag-controller-v1.yml --ref master
          gh workflow run zel-composite-post-terminal-ai-authorizer-v1.yml --ref master
      - name: Remove temporary terminal archive
        if: always()
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel-data-b-1m-v2-terminal.tar.gz' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-data-b-1m-v2-watch-publish-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
