name: ZEL Data B 1m Watch Manual Dispatch Once

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-watch-manual-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch 15-minute watcher immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zel-data-b-1m-v2-watch-publish-v1.yml -R leegkssk2000-commits/vultr-z --ref master
          echo 'PASS_WATCHER_MANUAL_DISPATCH'
