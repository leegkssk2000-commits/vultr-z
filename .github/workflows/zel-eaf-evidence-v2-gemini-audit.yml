name: ZEL EAF Evidence V2 Gemini Audit

on:
  push:
    branches: [master]
    paths:
      - research/evidence/evidence_alpha_v2_hardened.json
      - .github/workflows/zel-eaf-evidence-v2-gemini-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-eaf-evidence-v2-gemini-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage Evidence V2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes research/evidence/evidence_alpha_v2_hardened.json "$VPS_USER@$VPS_HOST:/tmp/evidence_alpha_v2_hardened.json"
      - name: Gemini evidence audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PY=/home/z/z/.venv/bin/python
          C=/home/z/z/_ai_council
          test -s "$C/.env"
          set -a; . "$C/.env"; set +a
          test -n "${REQUESTY_API_KEY:-}"
          RBASE=${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
          ROOT=/opt/zel/research-runtime/jobs/evidence-alpha-v2
          mkdir -p "$ROOT"
          cp /tmp/evidence_alpha_v2_hardened.json "$ROOT/evidence_alpha_v2_hardened.json"

          curl -fsS -m 30 -H "Authorization: Bearer $REQUESTY_API_KEY" "$RBASE/models" > /tmp/eaf_v2_models.json
          GEMINI=$("$PY" - <<'PYMODEL'
          import json
          d=json.load(open('/tmp/eaf_v2_models.json')); rows=d.get('data',[]) if isinstance(d,dict) else d
          ids={str(x.get('id')) for x in rows if isinstance(x,dict)}
          prefs=['google/gemini-3.6-flash','google/gemini-3.1-pro-preview','google/gemini-3-flash-preview','google/gemini-2.5-pro']
          print(next((x for x in prefs if x in ids),''))
          PYMODEL
          )
          test -n "$GEMINI"
          echo "GEMINI_SELECTED=$GEMINI"

          "$PY" - "$ROOT/evidence_alpha_v2_hardened.json" /tmp/eaf_v2_prompt.txt <<'PYPROMPT'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          shape={
            "verdict":"HOLD_MORE_EVIDENCE",
            "effective_lineages":0,
            "direct_crypto":0,
            "reproducible_impl":0,
            "youtube_counted":0,
            "ready_families":[],
            "not_ready_families":[],
            "top_contradictions":[],
            "missing_categories":[],
            "next_action":""
          }
          q='''Audit ONLY the supplied evidence for a research-only crypto systematic-trading project. No browsing from memory. No invented URLs, view counts, performance, or claims. music.youtube.com/help.youtube.com never count. YouTube counts only with supplied direct youtube.com/watch URL plus verified view count. Paper + mirror = one lineage. Community claims are anecdotes. A family needs >=3 direct independent crypto sources. Cross-asset sources support mechanics only. Return ONE compact valid JSON object, no markdown, no comments. Each list max 6 short strings. Use exactly these keys and no others:\n'''+json.dumps(shape)+'\nEVIDENCE:\n'+json.dumps(d,ensure_ascii=False)
          Path(sys.argv[2]).write_text(q)
          PYPROMPT

          "$PY" - "$GEMINI" /tmp/eaf_v2_prompt.txt /tmp/eaf_v2_body.json <<'PYBODY'
          import json,sys
          json.dump({'model':sys.argv[1],'messages':[{'role':'user','content':open(sys.argv[2]).read()}],'max_tokens':1400,'temperature':0,'response_format':{'type':'json_object'}},open(sys.argv[3],'w'))
          PYBODY
          code=$(curl -sS -m 300 -o /tmp/eaf_v2_resp.json -w '%{http_code}' -H "Authorization: Bearer $REQUESTY_API_KEY" -H 'Content-Type: application/json' --data-binary @/tmp/eaf_v2_body.json "$RBASE/chat/completions" || true)
          echo "GEMINI_HTTP=$code"
          test "$code" = 200
          "$PY" - /tmp/eaf_v2_resp.json "$ROOT/gemini_evidence_v2_audit.json" <<'PYRESP'
          import json,sys,re
          d=json.load(open(sys.argv[1])); text=(((d.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
          if not text: raise SystemExit('EMPTY_GEMINI_AUDIT')
          text=re.sub(r'^```(?:json)?\s*','',text); text=re.sub(r'\s*```$','',text)
          try: obj=json.loads(text)
          except Exception as exc:
              print('RAW_GEMINI_PREFIX',repr(text[:800])); raise
          req={'verdict','effective_lineages','direct_crypto','reproducible_impl','youtube_counted','ready_families','not_ready_families','top_contradictions','missing_categories','next_action'}
          miss=sorted(req-set(obj))
          if miss: raise SystemExit('MISSING_AUDIT_KEYS:'+','.join(miss))
          if obj['verdict'] not in {'PASS_STAGE1R','HOLD_MORE_EVIDENCE'}: raise SystemExit('BAD_VERDICT')
          obj.update({'research_only':True,'execution_authority':'NONE','order_authority':'BLOCKED','promotion_authority':False,'selection_authority':False})
          open(sys.argv[2],'w').write(json.dumps(obj,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps(obj,sort_keys=True,ensure_ascii=False))
          PYRESP
          echo 'PASS_GEMINI_EVIDENCE_V2_AUDIT_WRITTEN'
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
