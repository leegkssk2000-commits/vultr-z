name: ZEL EAF Evidence V2 Gemini Audit

on:
  push:
    branches: [master]
    paths:
      - research/evidence/evidence_alpha_v2_hardened.json
      - .github/workflows/zel-eaf-evidence-v2-gemini-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-eaf-evidence-v2-gemini-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage Evidence V2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes research/evidence/evidence_alpha_v2_hardened.json "$VPS_USER@$VPS_HOST:/tmp/evidence_alpha_v2_hardened.json"
      - name: Gemini evidence audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PY=/home/z/z/.venv/bin/python
          C=/home/z/z/_ai_council
          test -s "$C/.env"
          set -a; . "$C/.env"; set +a
          test -n "${REQUESTY_API_KEY:-}"
          RBASE=${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
          ROOT=/opt/zel/research-runtime/jobs/evidence-alpha-v2
          mkdir -p "$ROOT"
          cp /tmp/evidence_alpha_v2_hardened.json "$ROOT/evidence_alpha_v2_hardened.json"

          curl -fsS -m 30 -H "Authorization: Bearer $REQUESTY_API_KEY" "$RBASE/models" > /tmp/eaf_v2_models.json
          GEMINI=$("$PY" - <<'PYMODEL'
          import json
          d=json.load(open('/tmp/eaf_v2_models.json')); rows=d.get('data',[]) if isinstance(d,dict) else d
          ids={str(x.get('id')) for x in rows if isinstance(x,dict)}
          prefs=['google/gemini-3.6-flash','google/gemini-3.1-pro-preview','google/gemini-3-flash-preview','google/gemini-2.5-pro']
          print(next((x for x in prefs if x in ids),''))
          PYMODEL
          )
          test -n "$GEMINI"
          echo "GEMINI_SELECTED=$GEMINI"

          "$PY" - "$ROOT/evidence_alpha_v2_hardened.json" /tmp/eaf_v2_prompt.txt <<'PYPROMPT'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text())
          q='''You are the independent evidence-audit model for a research-only cryptocurrency systematic-trading project. Audit ONLY the supplied evidence records. Do NOT browse from memory, invent URLs, invent view counts, invent backtest numbers, or upgrade anecdotes into proof. The goal is to decide whether Stage1R evidence is sufficiently broad and direct to design executable alpha families before replay.\n\nHard rules:\n1) music.youtube.com and help.youtube.com are noise and must never count.\n2) YouTube can count only if the supplied record contains a direct youtube.com/watch URL and an independently verified visible view count; otherwise discovery-only.\n3) A family needs >=3 DIRECT, independent sources. Cross-asset mechanism papers may support risk/cost mechanics but cannot by themselves prove crypto alpha.\n4) Community success claims are anecdotal unless independently verified.\n5) Penalize duplicated papers mirrored by a research platform as one underlying evidence lineage, not two independent proofs.\n6) Identify contradictions: trend vs mean-reversion, intraday vs daily, long-only vs long/short, cost sensitivity, regime dependence.\n7) Recommend exact missing evidence CATEGORIES and mechanisms, not fabricated links.\n8) Output strict JSON only.\n\nRequired JSON schema:\n{\n "verdict":"PASS_STAGE1R"|"HOLD_MORE_EVIDENCE",\n "record_count":int,\n "effective_independent_lineages":int,\n "direct_crypto_strategy_count":int,\n "reproducible_implementation_count":int,\n "community_count":int,\n "youtube_counted":int,\n "strong_mechanisms":[{"mechanism":str,"support":str,"confidence":"HIGH"|"MEDIUM"|"LOW"}],\n "contradictions":[str],\n "weak_or_duplicate_ids":[str],\n "families_ready_for_spec":[str],\n "families_not_ready":[{"family":str,"missing":str}],\n "missing_evidence_categories":[str],\n "next_action":str\n}\n\nEVIDENCE:\n'''+json.dumps(d,ensure_ascii=False)
          Path(sys.argv[2]).write_text(q)
          PYPROMPT

          "$PY" - "$GEMINI" /tmp/eaf_v2_prompt.txt /tmp/eaf_v2_body.json <<'PYBODY'
          import json,sys
          model=sys.argv[1]; q=open(sys.argv[2]).read()
          json.dump({'model':model,'messages':[{'role':'user','content':q}],'max_tokens':2600,'temperature':0},open(sys.argv[3],'w'))
          PYBODY
          code=$(curl -sS -m 300 -o /tmp/eaf_v2_resp.json -w '%{http_code}' -H "Authorization: Bearer $REQUESTY_API_KEY" -H 'Content-Type: application/json' --data-binary @/tmp/eaf_v2_body.json "$RBASE/chat/completions" || true)
          test "$code" = 200
          "$PY" - /tmp/eaf_v2_resp.json "$ROOT/gemini_evidence_v2_audit.json" <<'PYRESP'
          import json,sys,re
          d=json.load(open(sys.argv[1])); content=((d.get('choices') or [{}])[0].get('message') or {}).get('content') or ''
          if not content.strip(): raise SystemExit('EMPTY_GEMINI_AUDIT')
          text=content.strip()
          if text.startswith('```'):
              text=re.sub(r'^```(?:json)?\s*','',text); text=re.sub(r'\s*```$','',text)
          obj=json.loads(text)
          obj['research_only']=True; obj['execution_authority']='NONE'; obj['order_authority']='BLOCKED'; obj['promotion_authority']=False; obj['selection_authority']=False
          open(sys.argv[2],'w').write(json.dumps(obj,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps(obj,sort_keys=True,ensure_ascii=False))
          if obj.get('verdict') not in {'PASS_STAGE1R','HOLD_MORE_EVIDENCE'}: raise SystemExit('BAD_VERDICT')
          PYRESP
          echo 'PASS_GEMINI_EVIDENCE_V2_AUDIT_WRITTEN'
          cat "$ROOT/gemini_evidence_v2_audit.json"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
