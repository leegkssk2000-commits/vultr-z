name: ZEL EAF V3 Executable Specs Review

on:
  push:
    branches: [master]
    paths:
      - research/evidence/evidence_alpha_v3_executable_specs_v1.json
      - .github/workflows/zel-eaf-v3-executable-specs-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Static contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/evidence/evidence_alpha_v3_executable_specs_v1.json'))
          assert d['research_only'] and d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED'
          assert d['stage3_unlocked'] is False
          assert len(d['alpha_families'])==4
          assert len(d['routing_overlays'])==1
          assert d['held_families'][0]['family']=='microstructure_ofi'
          ids=[x['id'] for x in d['alpha_families']]
          assert ids==['EAF_TM_V1','EAF_VB_V1','EAF_RMR_V1','EAF_PSA_V1']
          for x in d['alpha_families']:
              assert x['incremental_ablation_order'][0]=='BASE'
              assert len(x['evidence_ids'])>=3
          print('PASS_EXECUTABLE_SPEC_STATIC',ids)
          PY
      - name: SSH setup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Gemini/OpenAI spec audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes research/evidence/evidence_alpha_v3_executable_specs_v1.json "$VPS_USER@$VPS_HOST:/tmp/eaf_specs.json"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PY=/home/z/z/.venv/bin/python
          set -a; . /home/z/z/_ai_council/.env; set +a
          RBASE=${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
          ROOT=/opt/zel/research-runtime/jobs/evidence-alpha-v3-specs
          mkdir -p "$ROOT"; cp /tmp/eaf_specs.json "$ROOT/specs.json"
          curl -fsS -m 30 -H "Authorization: Bearer $REQUESTY_API_KEY" "$RBASE/models" > /tmp/models.json
          call() {
            m="$1" max="$2" q="$3" out="$4"
            "$PY" - "$m" "$max" "$q" "$ROOT/specs.json" /tmp/body.json <<'PYB'
          import json,sys
          m,max_t,q,p,o=sys.argv[1:]; json.dump({'model':m,'messages':[{'role':'user','content':q+'\nSPECS='+open(p).read()}],'max_tokens':int(max_t),'temperature':0},open(o,'w'))
          PYB
            code=$(curl -sS -m 300 -o /tmp/resp.json -w '%{http_code}' -H "Authorization: Bearer $REQUESTY_API_KEY" -H 'Content-Type: application/json' --data-binary @/tmp/body.json "$RBASE/chat/completions" || true)
            [ "$code" = 200 ] || return 2
            "$PY" - /tmp/resp.json "$out" <<'PYO'
          import json,sys
          d=json.load(open(sys.argv[1])); s=(((d.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
          if not s: raise SystemExit(3)
          s=' '.join(s.split()); open(sys.argv[2],'w').write(s+'\n'); print(s[:1000])
          PYO
          }
          G=''; for m in google/gemini-3.6-flash google/gemini-3.1-pro-preview google/gemini-3-flash-preview google/gemini-2.5-pro; do if grep -q '"id":"'"$m"'"' /tmp/models.json && call "$m" 10000 'Audit these research-only executable alpha specs for causal clarity. Require: BASE contains no indicator soup; additions are one-axis; session_clock cannot create entries; pairs needs separate two-leg adapter; no unsourced fixed thresholds; no profit claims. Return exactly PASS_SPECS|short_reason or HOLD_SPECS|short_reason.' "$ROOT/gemini.txt"; then G="$m"; break; fi; done
          test -n "$G"
          O=''; for m in openai/gpt-5.6-sol openai/gpt-5.4; do if grep -q '"id":"'"$m"'"' /tmp/models.json && call "$m" 8000 'Red-team these research-only specs. Check lookahead risk, indicator stacking, strategy/overlay confusion, and whether Stage3 remains blocked. Return exactly PASS_SPECS|short_reason or HOLD_SPECS|short_reason.' "$ROOT/openai.txt"; then O="$m"; break; fi; done
          test -n "$O"
          "$PY" - "$ROOT" "$G" "$O" <<'PYR'
          import json,re,sys
          from pathlib import Path
          r=Path(sys.argv[1]); g=(r/'gemini.txt').read_text().strip(); o=(r/'openai.txt').read_text().strip()
          gm=re.search(r'(PASS_SPECS|HOLD_SPECS)\|(.+)',g); om=re.search(r'(PASS_SPECS|HOLD_SPECS)\|(.+)',o)
          if not gm or not om: raise SystemExit('BAD_AI_FORMAT:'+g[:200]+' / '+o[:200])
          p={'schema_version':'zel.eaf.v3.spec_review.v1','gemini_model':sys.argv[2],'openai_model':sys.argv[3],'gemini_verdict':gm.group(1),'gemini_reason':gm.group(2),'openai_verdict':om.group(1),'openai_reason':om.group(2),'stage3_unlocked':False,'research_only':True,'execution_authority':'NONE','order_authority':'BLOCKED','promotion_authority':False,'selection_authority':False}
          p['state']='PASS_STAGE2_EXECUTABLE_SPECS_REVIEW' if gm.group(1)=='PASS_SPECS' and om.group(1)=='PASS_SPECS' else 'HOLD_STAGE2_EXECUTABLE_SPECS'
          (r/'review.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n'); print(json.dumps(p,sort_keys=True))
          PYR
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
