name: ZEL EAF V3 Stage3 BingX Credential Locator

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-eaf-v3-stage3-bingx-credential-locator.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  locate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Scan credential key names and source paths only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'python3 -' > out/credential_locator.json <<'PY'
          import json, os, pathlib, re
          roots=[pathlib.Path('/home/z/z'),pathlib.Path('/opt/zel'),pathlib.Path('/etc/zel'),pathlib.Path('/etc/default'),pathlib.Path('/etc/systemd/system')]
          key_re=re.compile(r'^\s*(?:export\s+)?(BINGX_[A-Z0-9_]+)\s*=',re.M)
          envfile_re=re.compile(r'^\s*EnvironmentFile\s*=\s*-?([^\s#]+)',re.M)
          envkey_re=re.compile(r'BINGX_[A-Z0-9_]+')
          hits=[]; env_refs=[]; scanned=0
          wanted_names={'.env','.env.production','.env.local','zel.env','z-os.env'}
          for root in roots:
              if not root.exists(): continue
              it=root.rglob('*') if str(root) in ('/home/z/z','/opt/zel','/etc/systemd/system') else root.glob('*')
              for p in it:
                  try:
                      if not p.is_file() or p.stat().st_size>1_000_000: continue
                  except OSError:
                      continue
                  name=p.name.lower()
                  if not (name in wanted_names or '.env' in name or 'bingx' in name or name.endswith(('.service','.timer','.conf'))):
                      continue
                  try: txt=p.read_text(errors='ignore')
                  except Exception: continue
                  scanned+=1
                  keys=sorted(set(key_re.findall(txt)))
                  if keys:
                      mode=oct(p.stat().st_mode & 0o777)
                      hits.append({'path':str(p),'keys':keys,'mode':mode})
                  if name.endswith(('.service','.timer','.conf')):
                      for ref in envfile_re.findall(txt):
                          env_refs.append({'unit_path':str(p),'environment_file':ref})
                      unit_keys=sorted(set(envkey_re.findall(txt)))
                      if unit_keys:
                          hits.append({'path':str(p),'keys_referenced':unit_keys,'mode':oct(p.stat().st_mode & 0o777)})
                  if scanned>=5000: break
          secret_names={'BINGX_SECRET_KEY','BINGX_API_SECRET','BINGX_SECRET'}
          complete=[]
          for h in hits:
              keys=set(h.get('keys',[]))
              if 'BINGX_API_KEY' in keys and keys.intersection(secret_names):
                  complete.append(h['path'])
          print(json.dumps({'state':'PASS_READ_ONLY_CREDENTIAL_SOURCE_SCAN','files_scanned':scanned,'hits':hits[:200],'environment_file_refs':env_refs[:200],'complete_credential_sources':sorted(set(complete)),'secret_values_exposed':False,'execution_authority':'NONE','order_authority':'BLOCKED'},sort_keys=True))
          PY
          python -m json.tool out/credential_locator.json
      - uses: actions/upload-artifact@v4
        with:
          name: zel-eaf-v3-stage3-bingx-credential-locator-${{ github.run_id }}
          path: out/credential_locator.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
