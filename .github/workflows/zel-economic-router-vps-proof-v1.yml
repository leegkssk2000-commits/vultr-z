name: ZEL Economic Router VPS Proof V1

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/zel-economic-router-vps-proof-v1.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read service exit reason only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'python3 - <<'"'"'PY'"'"'
          import json, pathlib, subprocess
          ledger=pathlib.Path("/home/z/z/ledger")
          router=json.load(open(ledger/"production_economic_edge_acquisition_v1.json"))
          bootstrap=json.load(open(ledger/"production_performance_bootstrap_state_v1.json"))
          show=subprocess.run([
            "systemctl","show","zel-production-paper-loop.service",
            "--property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts"
          ],capture_output=True,text=True)
          props={}
          for line in show.stdout.splitlines():
              if "=" in line:
                  k,v=line.split("=",1); props[k]=v
          journal=subprocess.run([
            "journalctl","-u","zel-production-paper-loop.service","-n","80","--no-pager","-o","cat"
          ],capture_output=True,text=True)
          safe=[]
          for raw in journal.stdout.splitlines():
              line=raw.strip()
              if not line: continue
              if any(tok in line for tok in ("RuntimeError","Traceback","UNBOUND","HOLD_","ERROR","Error","exit-code","Failed","Exception","zel_production_")):
                  safe.append(line[:500])
          out={
            "router_state":router.get("state"),
            "bootstrap_state":bootstrap.get("state"),
            "systemd":props,
            "diagnostic_lines":safe[-20:],
          }
          print(json.dumps(out,sort_keys=True))
          PY' | tee out/vps_router_proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: zel-economic-router-vps-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/vps_router_proof.json
          retention-days: 30
      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/vps_key
