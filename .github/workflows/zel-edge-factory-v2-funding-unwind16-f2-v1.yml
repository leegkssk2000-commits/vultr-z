name: ZEL Edge Factory V2 Funding Unwind16 F2 V1

on:
  pull_request:
    paths:
      - 'backend/research/edge_factory_v2_funding_unwind16_f2.py'
      - 'research/policies/edge_factory_v2_funding_unwind16_f2_contract.json'
      - '.github/workflows/zel-edge-factory-v2-funding-unwind16-f2-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  funding-unwind16-f2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert F2 contract frozen before source access
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/policies/edge_factory_v2_funding_unwind16_f2_contract.json'))
          assert c['state']=='FROZEN_BEFORE_F2_D1_SCORE'
          assert c['candidate_id']=='XSEC_FUNDING_UNWIND_L4_S4_8H_V1'
          assert c['family_budget']==1
          assert len(c['universe']['symbols'])==16
          assert c['universe']['selection_basis']=='SOURCE_CONTINUITY_ONLY_BEFORE_F2_ECONOMICS'
          assert c['signal']['score']=='CURRENT_REALIZED_FUNDING_RATE'
          assert c['signal']['holding_hours']==8
          assert c['signal']['long_selection']=='BOTTOM_4_LOWEST_CURRENT_FUNDING'
          assert c['signal']['short_selection']=='TOP_4_HIGHEST_CURRENT_FUNDING'
          assert c['signal']['threshold_search']==0 and c['signal']['direction_search']==0 and c['signal']['selection_count_search']==0 and c['signal']['holding_period_search']==0
          assert c['execution_cost']['normal_roundtrip_bps_on_gross']==12.30757224
          assert c['execution_cost']['stress_roundtrip_bps_on_gross']==14.61514448
          assert c['F2_T1_access_before_V1_pass'] is False
          assert c['AI_before_F2_D1'] is False
          print('PASS_FUNDING_UNWIND16_F2_CONTRACT_FROZEN')
          PY
      - name: Install deterministic runtime
        run: python -m pip install --disable-pip-version-check pandas==2.3.3 numpy==2.3.2
      - name: Download immutable fresh2026 price source
        uses: actions/download-artifact@v4
        with:
          name: zel-edge-factory-v2-broad20-fresh2026-source-31435447148-1
          path: /tmp/f2-price
          github-token: ${{ github.token }}
          repository: leegkssk2000-commits/vultr-z
          run-id: 31435447148
      - name: Download immutable exact funding source
        uses: actions/download-artifact@v4
        with:
          name: zel-edge-factory-v2-xsec-ls-funding2026-exact-probe-31437940806-1
          path: /tmp/f2-funding
          github-token: ${{ github.token }}
          repository: leegkssk2000-commits/vultr-z
          run-id: 31437940806
      - name: Run F2 D1 only
        run: |
          mkdir -p out
          python backend/research/edge_factory_v2_funding_unwind16_f2.py \
            --stage D1 --price-root /tmp/f2-price --funding-root /tmp/f2-funding \
            --out out/f2_d1.json
      - name: Run frozen F2 V1 only if D1 passes
        run: |
          state=$(python -c "import json;print(json.load(open('out/f2_d1.json'))['state'])")
          if [ "$state" = "PASS_FUNDING_UNWIND16_D1_TO_FROZEN_V1" ]; then
            python backend/research/edge_factory_v2_funding_unwind16_f2.py \
              --stage V1 --price-root /tmp/f2-price --funding-root /tmp/f2-funding \
              --parent-d1 out/f2_d1.json --out out/f2_v1.json
          else
            python - <<'PY'
          import json
          json.dump({'state':'SKIPPED_V1_D1_NOT_PASS','T1_rows_read':0},open('out/f2_v1.json','w'),indent=2,sort_keys=True)
          PY
          fi
      - name: Assert terminal authority
        run: |
          python - <<'PY'
          import hashlib,json
          d=json.load(open('out/f2_d1.json'));v=json.load(open('out/f2_v1.json'))
          material={k:x for k,x in d.items() if k!='receipt_sha256'}
          assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False,default=str).encode()).hexdigest()==d['receipt_sha256']
          assert d['source']['T1_rows_read']==0 and d['contract']['rule_search_count']==0
          assert d['survivor_declared'] is False and d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED'
          if d['state']=='PASS_FUNDING_UNWIND16_D1_TO_FROZEN_V1':
            assert v['stage']=='V1' and v['source']['T1_rows_read']==0 and v['contract']['rule_search_count']==0
          else:
            assert v['state']=='SKIPPED_V1_D1_NOT_PASS'
          print('F2_D1_STATE',d['state'])
          print('F2_D1_NORMAL',json.dumps(d['normal_total'],sort_keys=True))
          print('F2_D1_STRESS',json.dumps(d['stress_total'],sort_keys=True))
          print('F2_D1_FUNDING',json.dumps(d['funding_component'],sort_keys=True))
          print('F2_D1_PRICE',json.dumps(d['price_component'],sort_keys=True))
          print('F2_D1_GATE',json.dumps(d['gate'],sort_keys=True))
          print('F2_V1_STATE',v['state'])
          if v.get('stage')=='V1':
            print('F2_V1_NORMAL',json.dumps(v['normal_total'],sort_keys=True))
            print('F2_V1_STRESS',json.dumps(v['stress_total'],sort_keys=True))
            print('F2_V1_GATE',json.dumps(v['gate'],sort_keys=True))
          PY
      - name: Upload F2 receipts
        uses: actions/upload-artifact@v4
        with:
          name: zel-edge-factory-v2-funding-unwind16-f2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/f2_d1.json
            out/f2_v1.json
          if-no-files-found: error
          retention-days: 90
