name: ZEL Edge Factory V2 Funding18M Source V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/edge_factory_v2_funding18m_collect.py'
      - 'research/policies/edge_factory_v2_funding18m_source_contract.json'
      - '.github/workflows/zel-edge-factory-v2-funding18m-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-funding18m:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert source-only contract before funding requests
        run: |
          set -euo pipefail
          python -m py_compile backend/research/edge_factory_v2_funding18m_collect.py
          python - <<'PY'
          import json
          c=json.load(open('research/policies/edge_factory_v2_funding18m_source_contract.json'))
          assert c['state']=='FROZEN_BEFORE_FUNDING_COLLECTION'
          assert c['price_authority']['dataset_sha256']=='87ff0595f7ab90728af265eaf1b5aa79571317de61c6f68ce890526f3eff3c28'
          assert c['funding_source']['endpoint']=='/openApi/swap/v2/quote/fundingRate'
          assert c['funding_source']['symbols']==['BTC-USDT','ETH-USDT','LINK-USDT','SOL-USDT','XRP-USDT']
          assert c['funding_source']['start_ms']==1719792000000 and c['funding_source']['end_exclusive_ms']==1767225600000
          assert c['funding_source']['chunk_days']==30 and c['funding_source']['request_limit']==1000
          assert c['source_acceptance']['interpolation'] is False
          assert c['source_acceptance']['synthetic_funding'] is False
          assert c['source_acceptance']['forward_fill'] is False
          assert c['funding_signal_hypotheses_defined'] is False
          assert c['economics_inspected_during_collection'] is False
          assert c['d1_funding_metrics_inspected'] is False and c['v1_funding_metrics_inspected'] is False and c['t1_funding_metrics_inspected'] is False
          assert c['ai_used_during_collection'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED'
          print('PASS_FUNDING18M_SOURCE_CONTRACT_FROZEN')
          PY
          mkdir -p out/data

      - name: Collect native funding history read-only
        run: |
          set -euo pipefail
          python backend/research/edge_factory_v2_funding18m_collect.py \
            --out-dir out/data \
            --manifest out/manifest.json

      - name: Verify source binding without exposing funding values
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json
          from pathlib import Path
          r=json.load(open('out/manifest.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==r['receipt_sha256']
          assert r['state']=='PASS_FUNDING18M_SOURCE_BOUND'
          assert r['funding_signal_hypotheses_defined'] is False and r['economics_inspected'] is False
          assert r['d1_funding_metrics_inspected'] is False and r['v1_funding_metrics_inspected'] is False and r['t1_funding_metrics_inspected'] is False
          assert r['raw_funding_values_logged'] is False and r['ai_used'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert len(r['results'])==5
          for row in r['results']:
              p=Path('out/data')/row['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['file_sha256']
              assert row['duplicate_timestamp_count']==0
              assert row['row_count']>=100 and row['distinct_observation_days']>=100
              assert row['first_delay_hours']<=24 and row['last_gap_hours']<=24
              prior=None;count=0
              with gzip.open(p,'rt',encoding='utf-8',newline='') as fh:
                  for x in csv.DictReader(fh):
                      ts=int(x['fundingTime'])
                      if prior is not None:assert ts>prior
                      prior=ts;count+=1
              assert count==row['row_count']
              print('FUNDING_SOURCE',row['symbol'],'rows=',row['row_count'],'days=',row['distinct_observation_days'],'first=',row['first_timestamp_ms'],'last=',row['last_timestamp_ms'],'partitions=',json.dumps(row['partition_row_counts'],sort_keys=True),'interval_hist=',json.dumps(row['interval_ms_histogram'],sort_keys=True))
          print('FUNDING_DATASET_SHA',r['funding_dataset_sha256'])
          print('FUNDING_RECEIPT_SHA',r['receipt_sha256'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zel-edge-factory-v2-funding18m-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/manifest.json
            out/data/*.csv.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
