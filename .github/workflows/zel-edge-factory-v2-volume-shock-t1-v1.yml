name: ZEL Edge Factory V2 Volume Shock T1 V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/edge_factory_v2_gemini_mechanism_review.py'
      - 'backend/research/edge_factory_v2_volume_shock_t1.py'
      - 'research/evidence/edge_factory_v2_volume_shock_ai_input.json'
      - 'research/policies/edge_factory_v2_volume_shock_t1_contract.json'
      - '.github/workflows/zel-edge-factory-v2-volume-shock-t1-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-edge-factory-v2-volume-shock-t1-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ai-review-then-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert frozen candidate and no T1 access before AI
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/edge_factory_v2_gemini_mechanism_review.py \
            backend/research/edge_factory_v2_volume_shock_t1.py \
            scripts/strategy11_groq_redteam.py \
            scripts/strategy11_workers_ai_guard.py
          python - <<'PY'
          import json
          c=json.load(open('research/policies/edge_factory_v2_volume_shock_t1_contract.json'))
          i=json.load(open('research/evidence/edge_factory_v2_volume_shock_ai_input.json'))
          assert c['state']=='FROZEN_BEFORE_AI_REVIEW_AND_T1_ACCESS'
          assert c['candidate_id']=='VOLUME_SHOCK_EQW_PORTFOLIO_LONG_V1'
          assert c['source']['dataset_sha256']=='87ff0595f7ab90728af265eaf1b5aa79571317de61c6f68ce890526f3eff3c28'
          assert c['source']['t1_start_ms']==1751328000000 and c['source']['t1_end_exclusive_ms']==1767225600000
          assert c['source']['t1_metrics_inspected_before_freeze'] is False
          assert c['signal']['parameter_search']==0
          assert c['signal']['symbol_filter']=='NONE' and c['signal']['regime_filter']=='NONE'
          assert c['signal']['tp_sl_trailing']=='NONE'
          assert c['portfolio_aggregation']['axis']=='PORTFOLIO_AGGREGATION_ONLY'
          assert c['portfolio_aggregation']['weighting']=='EQUAL_WEIGHT_ACROSS_ELIGIBLE_LEGS'
          assert c['portfolio_aggregation']['parameter_search']==0
          assert c['cost_contract']['normal_roundtrip_bps_per_leg']==8.0
          assert c['cost_contract']['stress_roundtrip_bps_per_leg']==16.0
          assert c['ai_review']['required_before_t1'] is True
          assert c['ai_review']['ai_rule_change_authority'] is False
          assert c['ai_review']['ai_threshold_change_authority'] is False
          assert c['ai_review']['required_gemini_decision']=='PASS_TO_T1_REVIEW'
          assert c['ai_review']['required_groq_decision']=='PASS_TO_REPLAY'
          assert c['ai_review']['required_workers_decision']=='PASS_TO_REPLAY'
          assert c['t1_final_gate']['minimum_portfolio_batches']==60
          assert c['t1_final_gate']['normal_daily_cluster_bootstrap_confidence']==0.99
          assert c['t1_final_gate']['stress_daily_cluster_bootstrap_confidence']==0.95
          assert c['t1_final_gate']['dd_pass_threshold'] is None
          assert c['t1_reuse_allowed_after_result'] is False
          assert i['candidate_id']==c['candidate_id']
          assert i['changed_axes']==['PORTFOLIO_AGGREGATION_ONLY'] and i['lineage_complete'] is True
          assert i['lineage']['t1_inspected'] is False
          assert i['evidence']['d1']['strict_gate_passed'] is False and i['evidence']['v1']['strict_gate_passed'] is False
          assert i['candidate_contract']['t1_rule_changes_allowed'] is False and i['candidate_contract']['t1_reuse_allowed'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED'
          print('PASS_VOLUME_SHOCK_T1_CONTRACT_FROZEN_BEFORE_AI_AND_DATA')
          PY
          mkdir -p out/ai
          test ! -d /tmp/edge-v2-volume-t1

      - name: Install AI and deterministic research runtime
        run: python -m pip install --disable-pip-version-check groq pandas==2.3.3 numpy==2.3.2

      - name: Gemini mechanism and confounder review only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python backend/research/edge_factory_v2_gemini_mechanism_review.py \
            --input research/evidence/edge_factory_v2_volume_shock_ai_input.json \
            --output out/ai/gemini.json

      - name: Groq causal and overfit red-team only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          python scripts/strategy11_groq_redteam.py \
            --input research/evidence/edge_factory_v2_volume_shock_ai_input.json \
            --output out/ai/groq.json
          rc=$?
          set -e
          echo "GROQ_RC=$rc"
          test -s out/ai/groq.json

      - name: Workers AI schema lineage single-axis guard only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          set +e
          python scripts/strategy11_workers_ai_guard.py \
            --input research/evidence/edge_factory_v2_volume_shock_ai_input.json \
            --output out/ai/workers.json
          rc=$?
          set -e
          echo "WORKERS_RC=$rc"
          test -s out/ai/workers.json

      - name: Fail-closed three-AI advisory gate before T1 download
        id: ai_gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          g=json.load(open('out/ai/gemini.json'))
          q=json.load(open('out/ai/groq.json'))
          w=json.load(open('out/ai/workers.json'))
          input_sha=hashlib.sha256(json.dumps(json.load(open('research/evidence/edge_factory_v2_volume_shock_ai_input.json')),sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          checks={
            'gemini_connection':g.get('status')=='PASS_GEMINI_MECHANISM_REVIEW_CONNECTION',
            'gemini_decision':(g.get('review') or {}).get('decision')=='PASS_TO_T1_REVIEW',
            'gemini_no_rule_authority':g.get('rule_change_authority') is False and g.get('threshold_change_authority') is False,
            'groq_connection':q.get('status')=='PASS_GROQ_REDTEAM_CONNECTION' and q.get('GROQ_USED') is True,
            'groq_decision':(q.get('review') or {}).get('decision')=='PASS_TO_REPLAY',
            'workers_connection':w.get('status')=='PASS_WORKERS_AI_CONNECTION',
            'workers_decision':(w.get('review') or {}).get('decision')=='PASS_TO_REPLAY',
            'workers_single_axis':(w.get('review') or {}).get('single_axis') is True and (w.get('review') or {}).get('lineage_complete') is True,
          }
          approved=all(checks.values())
          receipt={
            'schema_version':'zel.edge_factory_v2.volume_shock_ai_gate.v1',
            'status':'PASS_AI_ADVISORY_GATE_FOR_ONE_T1_TEST' if approved else 'HOLD_AI_ADVISORY_GATE_NO_T1_ACCESS',
            'approved_for_one_t1_test':approved,
            'checks':checks,
            'input_sha':input_sha,
            'gemini':{'model':g.get('actual_model'),'decision':(g.get('review') or {}).get('decision'),'overfit_risk':(g.get('review') or {}).get('overfit_risk'),'fatal_blockers':(g.get('review') or {}).get('fatal_blockers',[])},
            'groq':{'model':q.get('actual_model'),'decision':(q.get('review') or {}).get('decision'),'overfit_risk':(q.get('review') or {}).get('overfit_risk'),'blocker_codes':(q.get('review') or {}).get('blocker_codes',[])},
            'workers_ai':{'model':w.get('model'),'model_called':w.get('model_called'),'decision':(w.get('review') or {}).get('decision'),'overfit_risk':(w.get('review') or {}).get('overfit_risk'),'blocker_codes':(w.get('review') or {}).get('blocker_codes',[])},
            'rule_changes_applied':0,'threshold_changes_applied':0,'t1_metrics_inspected':False,
            'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'
          }
          material=json.dumps(receipt,sort_keys=True,separators=(',',':'),allow_nan=False).encode();receipt['receipt_sha256']=hashlib.sha256(material).hexdigest()
          Path('out/ai_gate.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          with open(Path('/tmp')/'ai_approved.txt','w') as f:f.write('true' if approved else 'false')
          PY
          echo "approved=$(cat /tmp/ai_approved.txt)" >> "$GITHUB_OUTPUT"
          if [ "$(cat /tmp/ai_approved.txt)" != true ]; then
            test ! -d /tmp/edge-v2-volume-t1
          fi

      - name: Download immutable dataset only after all three AI reviews permit one T1 test
        if: steps.ai_gate.outputs.approved == 'true'
        uses: actions/download-artifact@v4
        with:
          name: zel-edge-factory-v2-fresh-18m-1h-data-31429880433-1
          path: /tmp/edge-v2-volume-t1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31429880433'

      - name: Verify immutable source and run the single-use T1
        if: steps.ai_gate.outputs.approved == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/edge-v2-volume-t1')
          m=json.loads((root/'manifest.json').read_text())
          assert m['state']=='PASS_FRESH_18M_1H_DATA_STAGED'
          assert m['dataset_sha256']=='87ff0595f7ab90728af265eaf1b5aa79571317de61c6f68ce890526f3eff3c28'
          assert m['partitions']['T1_TEST']['start_ms']==1751328000000
          assert m['partitions']['T1_TEST']['end_exclusive_ms']==1767225600000
          assert m['partitions']['T1_TEST']['rows_per_symbol']==4416
          for row in m['results']:
              p=root/'data'/row['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['file_sha256']
          print('PASS_T1_SOURCE_IMMUTABLE')
          PY
          python backend/research/edge_factory_v2_volume_shock_t1.py \
            --dataset-root /tmp/edge-v2-volume-t1 \
            --out out/t1.json

      - name: Seal T1 terminal result or AI hold
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          ai=json.load(open('out/ai_gate.json'))
          t=Path('out/t1.json')
          if not ai['approved_for_one_t1_test']:
              assert not t.exists()
              terminal={
                'schema_version':'zel.edge_factory_v2.volume_shock_terminal.v1',
                'state':'HOLD_AI_ADVISORY_GATE_NO_T1_ACCESS','ai_gate_receipt_sha256':ai['receipt_sha256'],
                't1_performed':False,'t1_reuse_allowed':False,
                'survivor_declared':False,'selection_authority':False,'promotion_authority':False,
                'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'
              }
          else:
              r=json.load(open(t))
              material={k:v for k,v in r.items() if k!='receipt_sha256'}
              assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False,default=str).encode()).hexdigest()==r['receipt_sha256']
              assert r['state'] in {'PASS_T1_VOLUME_SHOCK_SURVIVOR_CANDIDATE_NOT_FINAL_SURVIVOR','REJECT_T1_VOLUME_SHOCK_NO_RESCUE_NO_TUNING'}
              assert r['source']['t1_rows_per_symbol']==4416
              assert r['signal_contract']['parameter_search']==0
              assert r['cost_contract']=={'normal_roundtrip_bps_per_leg':8.0,'stress_roundtrip_bps_per_leg':16.0}
              assert r['gate']['dd_threshold_applied'] is False and r['dd_report_only_no_ssot_threshold'] is True
              assert r['t1_reuse_allowed_after_result'] is False
              assert r['survivor_declared'] is False and r['promotion_authority'] is False
              assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
              terminal={
                'schema_version':'zel.edge_factory_v2.volume_shock_terminal.v1','state':r['state'],
                'ai_gate_receipt_sha256':ai['receipt_sha256'],'t1_receipt_sha256':r['receipt_sha256'],
                't1_performed':True,'portfolio':r['portfolio'],'normal':r['normal'],'stress':r['stress'],'gate':r['gate'],
                'next':r['next'],'t1_reuse_allowed':False,'survivor_declared':False,'selection_authority':False,
                'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'
              }
          material=json.dumps(terminal,sort_keys=True,separators=(',',':'),allow_nan=False,default=str).encode();terminal['receipt_sha256']=hashlib.sha256(material).hexdigest()
          Path('out/terminal.json').write_text(json.dumps(terminal,indent=2,sort_keys=True)+'\n')
          print(json.dumps(terminal,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-edge-factory-v2-volume-shock-t1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/ai/*.json
            out/ai_gate.json
            out/t1.json
            out/terminal.json
          if-no-files-found: error
          retention-days: 90
