name: ZEL Edge Factory V2 XSec LS Funding2026 Source V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/edge_factory_v2_xsec_ls_funding2026_source.py'
      - 'research/policies/edge_factory_v2_xsec_ls_funding2026_source_contract.json'
      - '.github/workflows/zel-edge-factory-v2-xsec-ls-funding2026-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-funding2026:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert source-only contract before network access
        run: |
          set -euo pipefail
          python -m py_compile backend/research/edge_factory_v2_xsec_ls_funding2026_source.py
          python - <<'PY'
          import json
          c=json.load(open('research/policies/edge_factory_v2_xsec_ls_funding2026_source_contract.json'))
          assert c['state']=='FROZEN_BEFORE_COLLECTION'
          assert c['candidate_id']=='XSEC_MOMENTUM_LS_24H_TOP4_BOTTOM4_V1'
          assert c['price_edge_receipt_sha256']=='a2fce65e7338aec05981a36d29a34bf8296fc56f5dde027bfbc8d94c75090a70'
          assert len(c['funding_source']['symbols'])==20
          assert c['funding_source']['start_ms']==1767225600000 and c['funding_source']['end_exclusive_ms']==1785542400000
          assert c['funding_source']['primary_chunk_days']==7 and c['funding_source']['gap_repair_chunk_days']==1
          assert c['hard_integrity']['all_20_required'] is True
          assert c['hard_integrity']['maximum_internal_interarrival_hours']==24
          assert c['hard_integrity']['interpolation'] is False and c['hard_integrity']['forward_fill'] is False and c['hard_integrity']['synthetic_funding'] is False
          assert c['funding_accounting_semantics']['settlement_inclusion']=='entry_ms <= fundingTime <= exit_ms'
          assert c['economics_inspected_during_collection'] is False and c['candidate_entries_replayed_during_collection'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED'
          print('PASS_FUNDING2026_SOURCE_CONTRACT_FROZEN')
          PY
          mkdir -p out/data
      - name: Collect native funding with bounded gap repair
        run: |
          set -euo pipefail
          python backend/research/edge_factory_v2_xsec_ls_funding2026_source.py --out-dir out/data --manifest out/manifest.json
      - name: Verify all20 continuity without funding economics
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json
          from pathlib import Path
          r=json.load(open('out/manifest.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==r['receipt_sha256']
          assert r['state'] in {'PASS_XSEC_LS_FUNDING2026_SOURCE','HOLD_XSEC_LS_FUNDING2026_SOURCE_GAPS'}
          assert r['funding_values_logged'] is False and r['economics_inspected'] is False and r['candidate_entries_replayed'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert len(r['results'])==20
          for row in r['results']:
              p=Path('out/data')/row['file'];assert hashlib.sha256(p.read_bytes()).hexdigest()==row['file_sha256']
              prev=None;count=0;maxgap=0
              with gzip.open(p,'rt',encoding='utf-8',newline='') as fh:
                  for x in csv.DictReader(fh):
                      ts=int(x['fundingTime'])
                      if prev is not None:
                          assert ts>prev;maxgap=max(maxgap,ts-prev)
                      prev=ts;count+=1
              assert count==row['row_count']
              if row['state']=='PASS_FUNDING2026_CONTINUITY':
                  assert row['gaps_after']==0 and row['duplicate_timestamp_count']==0 and row['first_delay_hours']<=24 and row['last_gap_hours']<=24 and row['max_interarrival_hours']<=24 and maxgap<=24*3600000
              print('FUNDING2026',row['symbol'],row['state'],'rows=',row['row_count'],'before=',row['gaps_before'],'after=',row['gaps_after'],'max_gap_h=',row['max_interarrival_hours'])
          if r['state']=='PASS_XSEC_LS_FUNDING2026_SOURCE':assert r['all20_pass'] is True
          print('FUNDING2026_STATE',r['state'])
          print('FUNDING2026_DATASET_SHA',r['funding_dataset_sha256'])
          print('FUNDING2026_RECEIPT_SHA',r['receipt_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-edge-factory-v2-xsec-ls-funding2026-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/manifest.json
            out/data/*.csv.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
