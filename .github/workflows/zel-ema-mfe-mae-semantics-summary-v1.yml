name: ZEL EMA MFE MAE Semantics Summary V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-ema-mfe-mae-semantics-summary-v1.yml
      - backend/tools/zel_ema_mfe_mae_semantics_probe_v1.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-ema-mfe-mae-semantics-summary-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  summarize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Extract writer semantics read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          sed '/^from __future__ import annotations$/a from collections import Counter' \
            backend/tools/zel_ema_mfe_mae_semantics_probe_v1.py \
          | timeout 900s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --stdout' \
            > out/semantics.json
          python -m json.tool out/semantics.json >/dev/null

      - name: Build compact semantics summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/semantics.json'))
          writers=[]
          for value in row.get('writers',[]):
              facts=value.get('value') or {}
              writers.append({
                  'root_label':value.get('root_label'),
                  'path':value.get('path'),
                  'sha256':value.get('sha256'),
                  'class_name':value.get('class_name'),
                  'function_name':value.get('function_name'),
                  'function_line':value.get('function_line'),
                  'write_line':value.get('line'),
                  'key':value.get('key'),
                  'kind':value.get('kind'),
                  'uses_high':facts.get('uses_high'),
                  'uses_low':facts.get('uses_low'),
                  'uses_close':facts.get('uses_close'),
                  'uses_open':facts.get('uses_open'),
                  'uses_entry':facts.get('uses_entry'),
                  'uses_stop':facts.get('uses_stop'),
                  'loaded_names':facts.get('loaded_names'),
                  'calls':facts.get('calls'),
                  'strings':facts.get('strings'),
                  'numbers':facts.get('numbers'),
                  'subscripts':facts.get('subscripts'),
              })
          summary={
              'schema_version':'zel.ema_mfe_mae_semantics_summary.v1',
              'state':row['state'],
              'candidate_counts':row['candidate_counts'],
              'candidate_file_count':row['candidate_file_count'],
              'writer_count':row['writer_count'],
              'key_counts':row['key_counts'],
              'semantic_mode_counts':row['semantic_mode_counts'],
              'writers':writers,
              'blockers':row['blockers'],
              'raw_code_published':False,
              'raw_trade_rows_published':False,
              'canonical_mutated':False,
              'runtime_mutated':False,
              'formal_ledger_mutated':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'action':'hold',
              'next':row['next'],
          }
          json.dump(summary,open('out/summary.json','w'),indent=2,sort_keys=True,allow_nan=False)
          print({'state':summary['state'],'writers':summary['writer_count'],'modes':summary['semantic_mode_counts'],'blockers':summary['blockers']})
          PY

      - name: Publish compact summary
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/ema_mfe_mae_semantics_probe_v1
          rm -rf "$dest/latest"
          mkdir -p "$dest/latest"
          cp out/summary.json "$dest/latest/summary.json"
          cp out/summary.json "$dest/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/ema_mfe_mae_semantics_probe_v1
          git commit -m "result(zel): EMA MFE MAE semantics summary ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
