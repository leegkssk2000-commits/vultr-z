name: ZEL EMA MFE MAE Semantics Tiny V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-ema-mfe-mae-semantics-tiny-v1.yml
      - backend/tools/zel_ema_mfe_mae_semantics_probe_v1.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-ema-mfe-mae-semantics-tiny-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  tiny:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Extract one-line semantics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          sed '/^from __future__ import annotations$/a from collections import Counter' \
            backend/tools/zel_ema_mfe_mae_semantics_probe_v1.py \
          | timeout 900s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --stdout' > out/raw.json
          python - <<'PY'
          import json
          row=json.load(open('out/raw.json'))
          owners=[]
          for value in row.get('writers',[]):
              facts=value.get('value') or {}
              item={
                  'path':value.get('path'),
                  'sha':value.get('sha256'),
                  'class':value.get('class_name'),
                  'fn':value.get('function_name'),
                  'key':value.get('key'),
                  'high':bool(facts.get('uses_high')),
                  'low':bool(facts.get('uses_low')),
                  'close':bool(facts.get('uses_close')),
                  'open':bool(facts.get('uses_open')),
                  'entry':bool(facts.get('uses_entry')),
                  'risk':bool(facts.get('uses_stop')),
              }
              if item not in owners: owners.append(item)
          tiny={'state':row['state'],'modes':row['semantic_mode_counts'],'owners':owners,'blockers':row['blockers']}
          open('out/tiny.json','w').write(json.dumps(tiny,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Publish one-line SSOT
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/ema_mfe_mae_semantics_probe_v1
          mkdir -p "$dest/latest"
          cp out/tiny.json "$dest/latest/tiny.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/ema_mfe_mae_semantics_probe_v1/latest/tiny.json
          git commit -m "result(zel): tiny EMA MFE MAE semantics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
