name: ZEL EMA Ribbon Gemini Improvement V2

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py
      - backend/tools/zel_ema_ribbon_intratrade_path_audit_v2.py
      - backend/tools/zel_ema_path_semantics_reconciliation_v1.py
      - backend/tools/zel_ema_trailing_counterfactual_v1.py
      - .github/workflows/zel-ema-ribbon-gemini-improvement-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-ema-ribbon-gemini-improvement-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  improve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py \
            backend/tools/zel_ema_ribbon_intratrade_path_audit_v2.py \
            backend/tools/zel_ema_path_semantics_reconciliation_v1.py \
            backend/tools/zel_ema_trailing_counterfactual_v1.py

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run pinned path audit, reconciliation and trailing tournament
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          remote="/tmp/zel-ema-gemini-improve-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py \
            backend/tools/zel_ema_ribbon_intratrade_path_audit_v2.py \
            backend/tools/zel_ema_path_semantics_reconciliation_v1.py \
            backend/tools/zel_ema_trailing_counterfactual_v1.py \
            "$VPS_USER@$VPS_HOST:$remote/"

          set +e
          timeout 6600s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd '$remote'
             /home/z/z/.venv/bin/python zel_ema_ribbon_intratrade_path_audit_v2.py \
               --base-tool zel_ema_ribbon_intratrade_path_audit_v1.py \
               --out audit.json
             audit_state=\$(python3 -c \"import json; print(json.load(open('audit.json'))['state'])\")
             if [ \"\$audit_state\" = PASS_EMA_RIBBON_POST_ENTRY_PATH_READY ]; then
               PYTHONPATH='$remote' /home/z/z/.venv/bin/python \
                 zel_ema_path_semantics_reconciliation_v1.py \
                 --out reconciliation.json
               reconcile_state=\$(python3 -c \"import json; print(json.load(open('reconciliation.json'))['state'])\")
               if [ \"\$reconcile_state\" = PASS_EMA_PATH_SEMANTICS_RECONCILED ]; then
                 PYTHONPATH='$remote' /home/z/z/.venv/bin/python \
                   zel_ema_trailing_counterfactual_v1.py \
                   --reconciliation reconciliation.json \
                   --out trailing.json
               fi
             fi" > out/remote.stdout 2>out/remote.stderr
          rc=$?
          set -e

          for name in audit reconciliation trailing; do
            scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST:$remote/${name}.json" "out/${name}.json" 2>/dev/null || true
          done
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" || true
          if [ "$rc" -ne 0 ]; then
            tail -n 120 out/remote.stderr
            exit "$rc"
          fi
          test -s out/audit.json
          python -m json.tool out/audit.json >/dev/null
          if [ ! -s out/reconciliation.json ]; then
            printf '%s\n' '{"state":"SKIPPED_BY_AUDIT_GATE","blockers":["AUDIT_NOT_READY"]}' > out/reconciliation.json
          fi
          if [ ! -s out/trailing.json ]; then
            printf '%s\n' '{"state":"SKIPPED_BY_RECONCILIATION_GATE","blockers":["RECONCILIATION_NOT_READY"]}' > out/trailing.json
          fi
          python -m json.tool out/reconciliation.json >/dev/null
          python -m json.tool out/trailing.json >/dev/null

      - name: Gemini causal review, next-axis design and red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          out=Path('out')
          audit=json.load(open(out/'audit.json'))
          reconciliation=json.load(open(out/'reconciliation.json'))
          trailing=json.load(open(out/'trailing.json'))

          compact={
            'strategy_id':'ema_ribbon_scalp',
            'audit':{
              'state':audit.get('state'),
              'blockers':audit.get('blockers'),
              'overall':audit.get('overall'),
              'path':{
                'mfe_mean_abs_error_R':(audit.get('path_audit') or {}).get('mfe_mean_abs_error_R'),
                'mae_mean_abs_error_R':(audit.get('path_audit') or {}).get('mae_mean_abs_error_R'),
                'mfe_max_abs_error_R':(audit.get('path_audit') or {}).get('mfe_max_abs_error_R'),
                'mae_max_abs_error_R':(audit.get('path_audit') or {}).get('mae_max_abs_error_R'),
                'entry_candle_excluded':(audit.get('path_audit') or {}).get('entry_candle_excluded'),
              },
              'terminal_lineage':audit.get('terminal_lineage'),
            },
            'reconciliation':{
              'state':reconciliation.get('state'),
              'blockers':reconciliation.get('blockers'),
              'best_entry_known_candidate':reconciliation.get('best_entry_known_candidate'),
              'top_candidates':(reconciliation.get('top_candidates') or [])[:3],
            },
            'trailing':{
              'state':trailing.get('state'),
              'blockers':trailing.get('blockers'),
              'selected_candidate':trailing.get('selected_candidate'),
              'holdout_pass':trailing.get('holdout_pass'),
              'baseline_metrics':trailing.get('baseline_metrics'),
              'tournament':trailing.get('tournament'),
            },
            'constraints':{
              'one_axis_only':True,
              'selection_window':'1m_w1',
              'holdout_windows':['1m_w2','1m_w3'],
              'canonical_mutation':False,
              'runtime_mutation':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
            }
          }

          models=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']
          key=os.environ['GEMINI_API_KEY']

          def call(role, instruction):
            prompt=(
              'You are the '+role+' for a read-only systematic trading research gate. '
              'Use only the aggregate JSON evidence. Do not request or infer raw trades, prices, code, credentials or account data. '
              'No production, selection, promotion, Shadow, Paper or Live authority exists. '
              +instruction+'\nEVIDENCE='+json.dumps(compact,sort_keys=True,separators=(',',':'))
            )
            payload={
              'contents':[{'parts':[{'text':prompt}]}],
              'generationConfig':{'temperature':0.1,'maxOutputTokens':2048,'responseMimeType':'application/json'}
            }
            last=None
            for model in models:
              url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}'
              request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                with urllib.request.urlopen(request,timeout=90) as response:
                  body=json.load(response)
                text=body['candidates'][0]['content']['parts'][0]['text']
                parsed=json.loads(text)
                return {'model':model,'response':parsed}
              except Exception as exc:
                last=f'{type(exc).__name__}:{exc}'
                time.sleep(2)
            raise RuntimeError('GEMINI_CALL_FAILED:'+str(last))

          auditor=call(
            'causal auditor',
            'Return exactly an object with keys verdict, causal_issue, evidence_required. '
            'verdict must be PASS, HOLD, or REJECT. Focus on path causality, leakage, chronology and immutable lineage.'
          )
          designer=call(
            'single-axis strategy designer',
            'Return exactly an object with keys next_axis, single_change, falsification. '
            'next_axis must be one of TRAILING_SURVIVOR, IMMEDIATE_FAIL_ENTRY_FILTER, TIME_STOP, STOP_EMA_REPAIR. '
            'Choose only one axis; never combine entry, exit, sizing, skill or advisor changes.'
          )
          redteam=call(
            'independent red-team',
            'Return exactly an object with keys verdict, reason, hidden_failure. '
            'verdict must be ACCEPT, REJECT, or MORE_EVIDENCE. Reject overfit, holdout leakage, unresolved path semantics, or negative absolute economics disguised by relative improvement.'
          )

          allowed_a={'PASS','HOLD','REJECT'}
          allowed_d={'TRAILING_SURVIVOR','IMMEDIATE_FAIL_ENTRY_FILTER','TIME_STOP','STOP_EMA_REPAIR'}
          allowed_r={'ACCEPT','REJECT','MORE_EVIDENCE'}
          av=auditor['response'].get('verdict')
          da=designer['response'].get('next_axis')
          rv=redteam['response'].get('verdict')
          valid=av in allowed_a and da in allowed_d and rv in allowed_r
          deterministic_pass=trailing.get('state')=='PASS_EMA_TRAILING_COUNTERFACTUAL_NONOVERLAP' and trailing.get('holdout_pass') is True
          sealed=valid and deterministic_pass and av=='PASS' and da=='TRAILING_SURVIVOR' and rv=='ACCEPT'
          result={
            'schema_version':'zel.ema.gemini.improvement.review.v2',
            'state':'PASS_GEMINI_EMA_TRAILING_SEALED_HOLDBACK' if sealed else ('PASS_GEMINI_EMA_NEXT_AXIS_READY' if valid else 'HOLD_GEMINI_RESPONSE_INVALID'),
            'auditor':auditor,
            'designer':designer,
            'redteam':redteam,
            'response_valid':valid,
            'deterministic_trailing_pass':deterministic_pass,
            'sealed_research_holdback':sealed,
            'next_axis': 'TRAILING_SURVIVOR' if sealed else (da if valid else 'STOP_EMA_REPAIR'),
            'raw_trade_rows_sent':False,
            'raw_prices_sent':False,
            'private_code_sent':False,
            'credentials_sent':False,
            'canonical_mutated':False,
            'runtime_mutated':False,
            'selection_authority':False,
            'promotion_authority':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'action':'hold',
          }
          json.dump(result,open(out/'gemini_review.json','w'),indent=2,sort_keys=True)
          print({k:result[k] for k in ('state','deterministic_trailing_pass','sealed_research_holdback','next_axis')})
          PY
          python -m json.tool out/gemini_review.json >/dev/null

      - name: Verify safety boundary and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          audit=json.load(open('out/audit.json'))
          reconciliation=json.load(open('out/reconciliation.json'))
          trailing=json.load(open('out/trailing.json'))
          gemini=json.load(open('out/gemini_review.json'))
          for row in (audit,trailing,gemini):
              for key in ('canonical_mutated','runtime_mutated','selection_authority','promotion_authority'):
                  if key in row: assert row[key] is False,(key,row)
              if 'execution_authority' in row: assert row['execution_authority']=='NONE',row
              if 'order_authority' in row: assert row['order_authority']=='BLOCKED',row
              if 'action' in row: assert row['action']=='hold',row
          assert (audit.get('terminal_lineage') or {}).get('terminal_trades_sha_match') is True,audit
          assert (audit.get('terminal_lineage') or {}).get('engine_sha_match') is True,audit
          print({
            'audit_state':audit.get('state'),
            'audit_blockers':audit.get('blockers'),
            'mfe_mae_mean_R':[
              (audit.get('path_audit') or {}).get('mfe_mean_abs_error_R'),
              (audit.get('path_audit') or {}).get('mae_mean_abs_error_R'),
            ],
            'reconciliation_state':reconciliation.get('state'),
            'contract':reconciliation.get('best_entry_known_candidate'),
            'trailing_state':trailing.get('state'),
            'selected':(trailing.get('selected_candidate') or {}).get('candidate_id'),
            'holdout_pass':trailing.get('holdout_pass'),
            'gemini_state':gemini.get('state'),
            'next_axis':gemini.get('next_axis'),
          })
          PY

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-ema-ribbon-gemini-improvement-v2-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
