name: ZEL EMA Ribbon Gemini Improvement V2

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py
      - backend/tools/zel_ema_path_semantics_reconciliation_v1.py
      - backend/tools/zel_ema_trailing_counterfactual_v1.py
      - backend/tools/zel_ema_time_stop_counterfactual_v1.py
      - .github/workflows/zel-ema-ribbon-gemini-improvement-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-ema-ribbon-gemini-improvement-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  improve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate time-stop tools
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py \
            backend/tools/zel_ema_path_semantics_reconciliation_v1.py \
            backend/tools/zel_ema_trailing_counterfactual_v1.py \
            backend/tools/zel_ema_time_stop_counterfactual_v1.py
      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          for attempt in 1 2 3; do ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts && break || sleep $((attempt*5)); done
      - name: Run exact reconciliation and time-stop tournament
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-ema-time-stop-${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'" && break
            test "$attempt" -lt 3; sleep $((attempt*5))
          done
          for attempt in 1 2 3; do
            scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ConnectTimeout=20 \
              backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py \
              backend/tools/zel_ema_path_semantics_reconciliation_v1.py \
              backend/tools/zel_ema_trailing_counterfactual_v1.py \
              backend/tools/zel_ema_time_stop_counterfactual_v1.py \
              "$VPS_USER@$VPS_HOST:$remote/" && break
            test "$attempt" -lt 3; sleep $((attempt*5))
          done
          timeout 6900s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd '$remote'; PYTHONPATH='$remote' /home/z/z/.venv/bin/python zel_ema_path_semantics_reconciliation_v1.py --out reconciliation.json; PYTHONPATH='$remote' /home/z/z/.venv/bin/python zel_ema_time_stop_counterfactual_v1.py --reconciliation reconciliation.json --out time_stop.json" \
            > out/remote.stdout 2>out/remote.stderr
          for name in reconciliation time_stop; do
            for attempt in 1 2 3; do
              scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST:$remote/${name}.json" "out/${name}.json" && break
              test "$attempt" -lt 3; sleep $((attempt*5))
            done
          done
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" || true
          python -m json.tool out/reconciliation.json >/dev/null
          python -m json.tool out/time_stop.json >/dev/null
      - name: Gemini causal audit and red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request
          row=json.load(open('out/time_stop.json'))
          evidence={'state':row.get('state'),'contract':row.get('path_semantics_contract'),'baseline':row.get('baseline_metrics'),'selected':row.get('selected_candidate'),'holdout_pass':row.get('holdout_pass'),'blockers':row.get('blockers'),'holding_bars':{'min':row.get('holding_bars_min'),'mean':row.get('holding_bars_mean'),'max':row.get('holding_bars_max')},'tournament':row.get('tournament'),'contract_rules':'W1 selection only; W2/W3 frozen; original earlier exit preserved; target-bar close; one exit axis; no production authority'}
          prompt='Audit this immutable EMA time-stop tournament. Return JSON keys verdict,reason,next_axis. verdict=PASS|HOLD|REJECT; next_axis=TIME_STOP_SURVIVOR|REBUILD_ENTRY_LOGIC|RETIRE_EMA. Deterministic gates override you. EVIDENCE='+json.dumps(evidence,sort_keys=True,separators=(',',':'))
          payload={'contents':[{'parts':[{'text':prompt}]}],'generationConfig':{'temperature':0.1,'maxOutputTokens':2048,'responseMimeType':'application/json'}}
          parsed=None;used=None;last=None
          for model in ['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']:
            try:
              req=urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={os.environ["GEMINI_API_KEY"]}',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response: body=json.load(response)
              parsed=json.loads(body['candidates'][0]['content']['parts'][0]['text']); used=model; break
            except Exception as exc: last=f'{type(exc).__name__}:{exc}'; time.sleep(2)
          if parsed is None: raise RuntimeError('GEMINI_FAILED:'+str(last))
          valid=parsed.get('verdict') in {'PASS','HOLD','REJECT'} and parsed.get('next_axis') in {'TIME_STOP_SURVIVOR','REBUILD_ENTRY_LOGIC','RETIRE_EMA'}
          deterministic=row.get('state')=='PASS_EMA_TIME_STOP_COUNTERFACTUAL' and row.get('holdout_pass') is True
          sealed=valid and deterministic and parsed.get('verdict')=='PASS' and parsed.get('next_axis')=='TIME_STOP_SURVIVOR'
          next_axis='TIME_STOP_SURVIVOR' if sealed else ('REBUILD_ENTRY_LOGIC' if not deterministic else parsed.get('next_axis','RETIRE_EMA'))
          receipt={'schema_version':'zel.ema.time_stop.gemini_review.v1','state':'PASS_GEMINI_EMA_TIME_STOP_SEALED_HOLDBACK' if sealed else 'PASS_GEMINI_EMA_NEXT_AXIS_READY','model':used,'response':parsed,'response_valid':valid,'deterministic_pass':deterministic,'sealed_research_holdback':sealed,'next_axis':next_axis,'canonical_mutated':False,'runtime_mutated':False,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          json.dump(receipt,open('out/gemini_review.json','w'),indent=2,sort_keys=True)
          print({'state':row.get('state'),'selected':(row.get('selected_candidate') or {}).get('candidate_id'),'holdout':row.get('holdout_pass'),'gemini':parsed,'next':next_axis})
          PY
      - name: Verify safety
        run: |
          python - <<'PY'
          import json
          for path in ('out/time_stop.json','out/gemini_review.json'):
            row=json.load(open(path)); assert row['canonical_mutated'] is False and row['runtime_mutated'] is False; assert row['selection_authority'] is False and row['promotion_authority'] is False; assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED' and row['action']=='hold'
          PY
      - name: Cleanup SSH
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-ema-ribbon-gemini-improvement-v2-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
