name: ZEL EMA Ribbon Intratrade Path Audit V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py
      - .github/workflows/zel-ema-ribbon-intratrade-path-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-ema-ribbon-intratrade-path-audit-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: python -m py_compile backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Audit immutable EMA intratrade path read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          timeout 1800s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" \
            '/home/z/z/.venv/bin/python - --stdout' \
            < backend/tools/zel_ema_ribbon_intratrade_path_audit_v1.py \
            > out/audit.json
          test -s out/audit.json
          python -m json.tool out/audit.json >/dev/null

      - name: Verify evidence boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/audit.json'))
          assert row['strategy_id']=='ema_ribbon_scalp',row
          assert row['trade_count']==424,row
          assert set(row['by_window'])=={'1m_w1','1m_w2','1m_w3'},row
          for key in ('raw_trade_rows_published','raw_event_ids_published','raw_price_data_published','raw_code_published','canonical_mutated','runtime_mutated','formal_ledger_mutated','shadow_started','paper_started','live_enabled','selection_authority','promotion_authority'):
              assert row[key] is False,(key,row)
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({
              'state':row['state'],
              'overall':row['overall'],
              'windows':row['by_window'],
              'clusters':row['loss_clusters'],
              'coverage':row['key_group_coverage'],
              'path':{
                  'mapped':row['path_audit']['mapped_count'],
                  'risk_known':row['path_audit']['risk_known_count'],
                  'mfe_mae':[
                      row['path_audit']['mfe_mean_abs_error_R'],
                      row['path_audit']['mae_mean_abs_error_R'],
                  ],
                  'failures':row['path_audit']['failure_reason_counts'],
              },
              'source_candidates':len(row['source_candidates']),
              'blockers':row['blockers'],
              'next':row['next'],
          })
          PY

      - name: Publish redacted audit receipt
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/ema_ribbon_intratrade_path_audit_v1
          rm -rf "$dest/latest"
          mkdir -p "$dest/latest"
          cp out/audit.json "$dest/latest/audit.json"
          cp out/audit.json "$dest/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/ema_ribbon_intratrade_path_audit_v1
          git commit -m "result(zel): EMA ribbon intratrade path audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-ema-ribbon-intratrade-path-audit-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
