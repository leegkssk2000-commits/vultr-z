name: ZEL EMA Selective Window End Repair V1

on:
  pull_request:
    branches: [zel-exact25-identity-indicator-autonomy-v1]
    paths:
      - backend/tools/zel_exact25_causal_exit_screen_window_end_patch_v1.py
      - backend/tools/zel_exact25_causal_exit_checkpoint_migrate_v1.py
      - .github/workflows/zel-ema-selective-window-end-repair-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-ema-selective-window-end-repair-v1
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 560 &&
      github.event.pull_request.head.ref == 'zel-causal-exit-screen-exec-v1' &&
      github.event.pull_request.base.ref == 'zel-exact25-identity-indicator-autonomy-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static minimum-patch verification
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy
          python -m py_compile \
            control/backend/tools/zel_exact25_causal_exit_screen_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_window_end_patch_v1.py \
            control/backend/tools/zel_exact25_causal_exit_checkpoint_migrate_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_resumable_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_resumable_guard_v2.py
          python control/backend/tools/zel_exact25_causal_exit_screen_window_end_patch_v1.py \
            --source control/backend/tools/zel_exact25_causal_exit_screen_v1.py --self-test
          PYTHONPATH=control/backend/tools python control/backend/tools/zel_exact25_causal_exit_screen_resumable_guard_v2.py --self-test
          python -m json.tool control/backend/research/zel_exact25_causal_exit_screen_v1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('control/backend/research/zel_exact25_causal_exit_screen_v1.json'))
          assert len(p['candidate_configs'])==7,p
          assert p['candidate_configs'][3]['mode']=='SOFT_MFE_ARM',p
          assert p['selection_protocol']['select_on_w1_only'] is True,p
          assert p['selection_protocol']['freeze_selected_config_for_w2_w3'] is True,p
          PY
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p out "$GITHUB_WORKSPACE/.ssh" ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Selectively migrate baseline and candidates 01-03
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-ema-window-end-repair-${GITHUB_RUN_ID}"
          old_root="/opt/zel/research-runtime/checkpoints/zel-causal-exit-screen-v2/0561180f8acb8d554433df977d8d789bb8052346"
          new_root="/opt/zel/research-runtime/checkpoints/zel-causal-exit-screen-v3/${PR_HEAD_SHA}"
          echo "$remote" > out/remote_path.txt
          echo "$new_root" > out/checkpoint_path.txt
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; \
             test -s '$old_root/input_manifest.json'; \
             test -s '$old_root/source_owner.json'; \
             test -s '$old_root/router.json'; \
             for n in baseline candidate-01 candidate-02 candidate-03 candidate-04 candidate-05 candidate-06 candidate-07; do test -s '$old_root/candidates/'\"\$n\"'.json'; done; \
             mkdir -p '$remote' '$new_root/candidates'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            control/backend/tools/zel_exact25_causal_exit_screen_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_window_end_patch_v1.py \
            control/backend/tools/zel_exact25_causal_exit_checkpoint_migrate_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_resumable_v1.py \
            control/backend/tools/zel_exact25_causal_exit_screen_resumable_guard_v2.py \
            control/backend/research/zel_exact25_causal_exit_screen_v1.json \
            "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_causal_exit_screen_window_end_patch_v1.py' \
               --source '$remote/zel_exact25_causal_exit_screen_v1.py' \
               --out '$remote/zel_exact25_causal_exit_screen_window_end_v2.py'; \
             /home/z/z/.venv/bin/python -m py_compile '$remote/zel_exact25_causal_exit_screen_window_end_v2.py'; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_causal_exit_checkpoint_migrate_v1.py' \
               --base-runner '$remote/zel_exact25_causal_exit_screen_resumable_v1.py' \
               --guard '$remote/zel_exact25_causal_exit_screen_resumable_guard_v2.py' \
               --screen '$remote/zel_exact25_causal_exit_screen_window_end_v2.py' \
               --engine \"\$engine\" \
               --policy '$remote/zel_exact25_causal_exit_screen_v1.json' \
               --source-root /home/z/z \
               --data-root /opt/zel/historical-oos-v1 \
               --terminal-root /var/lib/zel-research/data-b-1m-v2 \
               --source-owner '$old_root/source_owner.json' \
               --route '$old_root/router.json' \
               --old-input-manifest '$old_root/input_manifest.json' \
               --old-checkpoint-dir '$old_root/candidates' \
               --new-input-manifest-out '$new_root/input_manifest.json' \
               --new-checkpoint-dir '$new_root/candidates' \
               --commit-sha '$PR_HEAD_SHA' \
               --receipt-out '$new_root/migration_receipt.json'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST:$new_root/migration_receipt.json" out/migration_receipt.json
      - name: Resume only candidates 04-07 with deterministic window-end close
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote=$(cat out/remote_path.txt)
          new_root=$(cat out/checkpoint_path.txt)
          old_root="/opt/zel/research-runtime/checkpoints/zel-causal-exit-screen-v2/0561180f8acb8d554433df977d8d789bb8052346"
          set +e
          timeout 39600s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=60 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             nice -n 15 ionice -c2 -n7 /home/z/z/.venv/bin/python \
               '$remote/zel_exact25_causal_exit_screen_resumable_guard_v2.py' \
               --base-runner '$remote/zel_exact25_causal_exit_screen_resumable_v1.py' \
               --screen '$remote/zel_exact25_causal_exit_screen_window_end_v2.py' \
               --engine \"\$engine\" \
               --policy '$remote/zel_exact25_causal_exit_screen_v1.json' \
               --source-root /home/z/z \
               --data-root /opt/zel/historical-oos-v1 \
               --terminal-root /var/lib/zel-research/data-b-1m-v2 \
               --source-owner '$old_root/source_owner.json' \
               --route '$old_root/router.json' \
               --checkpoint-dir '$new_root/candidates' \
               --heartbeat-out '$new_root/heartbeat.json' \
               --input-manifest-out '$new_root/input_manifest.json' \
               --commit-sha '$PR_HEAD_SHA' \
               --out '$new_root/screen.json'"
          rc=$?
          set -e
          mkdir -p out/checkpoints
          for name in heartbeat.json input_manifest.json screen.json migration_receipt.json; do
            scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST:$new_root/$name" "out/$name" 2>/dev/null || true
          done
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST:$new_root/candidates/*.json" out/checkpoints/ 2>/dev/null || true
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST:$old_root/source_owner.json" out/source_owner.json
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST:$old_root/router.json" out/router.json
          printf '%s\n' "$rc" > out/replay_rc.txt
          if [ "$rc" -ne 0 ]; then
            echo "Selective EMA repair exited rc=$rc; checkpoints retained at $new_root" >&2
            exit "$rc"
          fi
      - name: Gemini terminal economic red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          r=json.loads(Path('out/screen.json').read_text())
          evidence={
            'strategy_id':r['strategy_id'],
            'axis_id':r['axis_id'],
            'baseline_parity':r['baseline_parity'],
            'baseline':r['baseline'],
            'selected_config':r['selected_config'],
            'selection_protocol':r['selection_protocol'],
            'confirmation':r['confirmation'],
            'survivor':r['survivor'],
            'candidate_summaries':[
              {'ordinal':i+1,'config':c['config'],'w1_pass':c['w1_pass'],'w1_blockers':c['w1_blockers'],'w1_retention_pct':c['w1_retention_pct'],'metrics':c['metrics'],'counters':c['counters'],'integrity':c['integrity']}
              for i,c in enumerate(r['candidates'])
            ],
            'repair_contract':{'baseline_and_candidates_01_03_preserved':True,'candidates_04_07_replayed':True,'window_end_close_reason':'window_end_close','hard_risk_exit_preserved':True,'future_mfe_forbidden':True,'w1_select_then_freeze_w2_w3':True,'absolute_positive_all_windows_required':True}
          }
          payload={'contents':[{'parts':[{'text':'Independent ZEL terminal red-team. Return JSON keys verdict, reason, hidden_failure. ACCEPT only when the selective repair, integrity, and survivor/no-survivor conclusion follow the immutable metrics. Reject checkpoint contamination, unclosed positions, leakage, hard-risk suppression, W2/W3 retuning, incomplete cost lineage, retention destruction, or relative-only improvement. EVIDENCE='+json.dumps(evidence,sort_keys=True,separators=(',',':'))}]}],'generationConfig':{'temperature':0.1,'maxOutputTokens':2048,'responseMimeType':'application/json'}}
          response=None; used=None; last=None
          for model in ['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']:
              try:
                  url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={os.environ["GEMINI_API_KEY"]}'
                  req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=90) as result: body=json.load(result)
                  candidate=json.loads(body['candidates'][0]['content']['parts'][0]['text'])
                  verdict=str(candidate.get('verdict') or '').upper(); reason=str(candidate.get('reason') or '').strip(); hidden=str(candidate.get('hidden_failure') or '').strip()
                  if verdict not in {'ACCEPT','REJECT','MORE_EVIDENCE'} or not reason or not hidden: raise RuntimeError('GEMINI_CONTRACT_INCOMPLETE')
                  response=candidate; used=model; break
              except Exception as exc:
                  last=f'{type(exc).__name__}:{exc}'; time.sleep(2)
          if response is None: raise RuntimeError('GEMINI_CALL_FAILED:'+str(last))
          accepted=str(response['verdict']).upper()=='ACCEPT'
          out={'schema_version':'zel.exact25.causal_exit_selective_repair.gemini_review.v1','state':'PASS_GEMINI_REPAIR_DECISION_ACCEPTED' if accepted else 'HOLD_GEMINI_REPAIR_DISSENT','model':used,'response':response,'screen_receipt_sha256':r['receipt_sha256'],'accepted':accepted,'protected_mutations':0,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          out['receipt_sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          Path('out/gemini_review.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Verify selective repair and terminal screen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def verify(row,key='receipt_sha256'):
              expected=row[key]; material={k:v for k,v in row.items() if k!=key}
              actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              assert actual==expected,(actual,expected)
          migration=json.load(open('out/migration_receipt.json'))
          r=json.load(open('out/screen.json'))
          g=json.load(open('out/gemini_review.json'))
          assert migration['state']=='PASS_SELECTIVE_CHECKPOINT_MIGRATION',migration
          assert migration['migrated_units']==['baseline','candidate-01','candidate-02','candidate-03'],migration
          assert migration['invalidated_units']==['candidate-04','candidate-05','candidate-06','candidate-07'],migration
          assert migration['baseline_recomputed'] is False,migration
          assert r['state']=='PASS_CAUSAL_EXIT_SCREEN_RESUMABLE_COMPLETE',r
          assert r['candidate_count']==7,r
          assert all(r['baseline_parity'].values()),r
          assert r['selection_protocol']['select_on_w1_only'] is True,r
          assert r['selection_protocol']['freeze_selected_config_for_w2_w3'] is True,r
          assert r['selection_protocol']['w2_w3_retuning_performed'] is False,r
          assert r['oracle_future_mfe_used'] is False,r
          for i,c in enumerate(r['candidates'],1):
              assert c['counters']['error_count']==0,(i,c)
              assert c['counters']['censored_open_at_window_end']==0,(i,c)
              assert c['integrity']['missing_identity_count']==0,(i,c)
              assert c['integrity']['duplicate_trade_count']==0,(i,c)
              assert c['integrity']['unknown_exit_count']==0,(i,c)
              assert c['integrity']['cost_lineage_complete'] is True,(i,c)
              if i>=4:
                  assert c['counters']['window_end_close_count']>0,(i,c)
          assert g['state']=='PASS_GEMINI_REPAIR_DECISION_ACCEPTED' and g['accepted'] is True,g
          assert g['screen_receipt_sha256']==r['receipt_sha256'],g
          for row in (migration,r,g):
              assert row['protected_mutations']==0,row
              assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
              assert row['action']=='hold',row
              verify(row)
          checkpoints=list(Path('out/checkpoints').glob('*.json'))
          assert len(checkpoints)==8,checkpoints
          for path in checkpoints:
              row=json.load(open(path)); verify(row,'checkpoint_sha256')
          print({'survivor':r['survivor'],'survivor_state':r['survivor_state'],'selected_config':r['selected_config'],'checkpoints':len(checkpoints),'screen_receipt_sha256':r['receipt_sha256']})
          PY
      - name: Cleanup temp path
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-ema-selective-window-end-repair-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
