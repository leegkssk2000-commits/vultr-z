name: ZEL Exact25 Exit Contract Probe V1

on:
  pull_request:
    branches: [zel-exact25-identity-indicator-autonomy-v1]
    paths:
      - backend/tools/zel_exact25_exit_contract_probe_v1.py
      - backend/tools/zel_exact25_source_owner_audit_v1.py
      - backend/research/zel_exit_contract_probe_execution_v1.json
      - .github/workflows/zel-exact25-exit-contract-probe-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-exact25-exit-contract-probe-v1-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile \
            control/backend/tools/zel_exact25_exit_contract_probe_v1.py \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py
          python control/backend/tools/zel_exact25_exit_contract_probe_v1.py --self-test
          python control/backend/tools/zel_exact25_source_owner_audit_v1.py --self-test
          python -m json.tool control/backend/research/zel_exit_contract_probe_execution_v1.json >/dev/null
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Source gate and exact exit probe
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-exit-contract-probe-${GITHUB_RUN_ID}"
          echo "$remote" > out/remote_path.txt
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py \
            control/backend/tools/zel_exact25_exit_contract_probe_v1.py \
            control/backend/research/zel_exit_contract_probe_execution_v1.json \
            results/runtime_results/zel/historical_oos_exact25_replay_v1/1m/latest.json \
            "$VPS_USER@$VPS_HOST:$remote/"
          strategy_args=$(python - <<'PY'
          import json
          p=json.load(open('control/backend/research/zel_exit_contract_probe_execution_v1.json'))
          print(' '.join("--strategy '"+s+"'" for s in p['strategy_ids']))
          PY
          )
          timeout 9600s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=60 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_source_owner_audit_v1.py' \
               --engine \"\$engine\" --source-root /home/z/z --terminal '$remote/latest.json' \
               --out '$remote/source_owner.json'; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_exit_contract_probe_v1.py' \
               --engine \"\$engine\" --source-root /home/z/z \
               --data-root /opt/zel/historical-oos-v1 --terminal '$remote/latest.json' \
               $strategy_args --out '$remote/probe.json'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/source_owner.json" out/source_owner.json
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/probe.json" out/probe.json
          python -m json.tool out/source_owner.json >/dev/null
          python -m json.tool out/probe.json >/dev/null
      - name: Verify exact probe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out/source_owner.json').read_text())
          r=json.loads(Path('out/probe.json').read_text())
          assert s['state']=='PASS_EXACT25_SOURCE_OWNER_AUDIT' and s['strategy_count']==25 and not s['quarantined_strategy_ids'],s
          assert r['state']=='PASS_EXIT_CONTRACT_PROBE',r
          assert r['strategy_count']>=1 and r['trade_count']>0,r
          assert r['all_baseline_parity'] is True,r
          assert r['portfolio']['early_0_5m_source_loss_rank'],r
          for row in (r,):
              assert row['selection_authority'] is False and row['promotion_authority'] is False,row
              assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          print({'strategies':r['strategy_count'],'trades':r['trade_count'],'early_loss_rank':r['portfolio']['early_0_5m_source_loss_rank']})
          PY
      - name: Cleanup
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-exact25-exit-contract-probe-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
