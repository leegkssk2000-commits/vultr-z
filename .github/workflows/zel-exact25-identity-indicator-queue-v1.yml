name: ZEL Exact25 Identity Indicator Queue V1

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  pull_request:
    branches: [zel-alpha-unattended-champion-v2, master]
    paths:
      - backend/research/zel_exact25_identity_indicator_policy_v1.json
      - backend/tools/zel_exact25_identity_indicator_audit_v1.py
      - backend/research/zel_alpha_unattended_champion_v2.json
      - .github/workflows/zel-exact25-identity-indicator-queue-v1.yml
  push:
    branches: [zel-exact25-identity-indicator-autonomy-v1]

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-exact25-identity-indicator-queue-v1-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-and-plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false

      - name: Checkout immutable terminal receipts
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate policy and self-test
        run: |
          set -euo pipefail
          python -m py_compile control/backend/tools/zel_exact25_identity_indicator_audit_v1.py
          python -m json.tool control/backend/research/zel_exact25_identity_indicator_policy_v1.json >/dev/null
          python control/backend/tools/zel_exact25_identity_indicator_audit_v1.py \
            --policy control/backend/research/zel_exact25_identity_indicator_policy_v1.json \
            --self-test

      - name: Run exact 25-strategy identity preflight
        run: |
          set -euo pipefail
          terminal=results/runtime_results/zel/historical_oos_exact25_replay_v1/1m/latest.json
          test -s "$terminal"
          mkdir -p out/identity
          python control/backend/tools/zel_exact25_identity_indicator_audit_v1.py \
            --policy control/backend/research/zel_exact25_identity_indicator_policy_v1.json \
            --terminal "$terminal" \
            --optimizer-policy control/backend/research/zel_alpha_unattended_champion_v2.json \
            --out out/identity
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/identity/latest.json').read_text())
          assert r['state']=='PASS_EXACT25_IDENTITY_AND_INDICATOR_QUEUE_READY',r
          assert r['strategy_count']==25,r
          assert r['trade_count']==1951,r
          assert not r['quarantined_strategy_ids'],r
          assert r['global_checks']['owner_manifest_sha256'] is True,r
          assert r['global_checks']['strategy_tree_sha256'] is True,r
          assert r['global_checks']['producer_sha256'] is True,r
          alpha=next(row for row in r['strategies'] if row['strategy_id']=='alpha_combo')
          assert alpha['authority_mode']=='SEALED_RESEARCH_AUTHORITY',alpha
          assert alpha['optimizer_profile']=='ALPHA_TIME54_TIME60_STOP065',alpha
          assert alpha['authority']['raw_exact25_optimizer_forbidden'] is True,alpha
          assert r['selection_authority'] is False
          assert r['promotion_authority'] is False
          assert r['execution_authority']=='NONE'
          assert r['order_authority']=='BLOCKED'
          PY

      - name: Gemini queue designer and independent red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path

          audit=json.loads(Path('out/identity/latest.json').read_text())
          queue=audit['experiment_queue'][:12]
          evidence={
            'identity_receipt_sha256':audit['receipt_sha256'],
            'strategy_count':audit['strategy_count'],
            'quarantined_strategy_ids':audit['quarantined_strategy_ids'],
            'queue':queue,
            'constraints':{
              'choose_from_queue_only':True,
              'one_axis_per_strategy':True,
              'one_axis_change_only':True,
              'entry_causal_only':True,
              'w1_select_then_freeze_w2_w3':True,
              'exact_source_replay_before_survivor':True,
              'no_production_authority':True,
            },
          }
          models=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']
          key=os.environ['GEMINI_API_KEY']

          def call(role,instruction,payload_evidence):
              payload={
                'contents':[{'parts':[{'text':(
                  'You are '+role+' for ZEL Exact25 research. Use aggregate facts only. '
                  +instruction+' EVIDENCE='+json.dumps(payload_evidence,sort_keys=True,separators=(',',':'))
                )}]}],
                'generationConfig':{'temperature':0.1,'maxOutputTokens':2048,'responseMimeType':'application/json'}
              }
              last=None
              for model in models:
                  try:
                      url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}'
                      req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
                      with urllib.request.urlopen(req,timeout=90) as response:
                          body=json.load(response)
                      return {'model':model,'response':json.loads(body['candidates'][0]['content']['parts'][0]['text'])}
                  except Exception as exc:
                      last=f'{type(exc).__name__}:{exc}'
                      time.sleep(2)
              raise RuntimeError('GEMINI_CALL_FAILED:'+str(last))

          designer=call(
            'the causal single-axis experiment designer',
            'Return JSON keys verdict,selections,reason. verdict must be TEST or HOLD. '
            'selections must contain at most 3 objects copied from queue with strategy_id and axis_id unchanged.',
            evidence,
          )
          proposed=designer['response'].get('selections') or []
          allowed={(row['strategy_id'],row['axis_id']) for row in queue}
          normalized=[]
          seen=set()
          for row in proposed:
              keypair=(str(row.get('strategy_id')),str(row.get('axis_id')))
              if keypair in allowed and keypair[0] not in seen:
                  normalized.append({'strategy_id':keypair[0],'axis_id':keypair[1]})
                  seen.add(keypair[0])
              if len(normalized)>=3:
                  break
          red_evidence=dict(evidence)
          red_evidence['proposed']=normalized
          redteam=call(
            'the independent overfit and lineage red-team',
            'Return JSON keys verdict,reason,hidden_failure. verdict must be ACCEPT, REJECT, or MORE_EVIDENCE. '
            'Reject identity ambiguity, post-entry leakage, repeated-axis mining, inadequate warmup, or sample destruction.',
            red_evidence,
          )
          accepted=(designer['response'].get('verdict')=='TEST' and bool(normalized) and redteam['response'].get('verdict')=='ACCEPT')
          result={
            'schema_version':'zel.exact25.identity_indicator.gemini_queue.v1',
            'state':'PASS_GEMINI_SINGLE_AXIS_QUEUE_ACCEPTED' if accepted else 'HOLD_GEMINI_QUEUE_REJECTED',
            'identity_receipt_sha256':audit['receipt_sha256'],
            'designer':designer,
            'redteam':redteam,
            'selected_experiments':normalized if accepted else [],
            'raw_trade_rows_sent':False,
            'raw_prices_sent':False,
            'private_code_sent':False,
            'credentials_sent':False,
            'canonical_mutated':False,
            'registry_mutated':False,
            'runtime_mutated':False,
            'formal_ledger_mutated':False,
            'selection_authority':False,
            'promotion_authority':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'action':'hold',
          }
          result['receipt_sha256']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('out/identity/gemini_queue.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print({'state':result['state'],'selected':result['selected_experiments']})
          PY
          python -m json.tool out/identity/gemini_queue.json >/dev/null

      - name: Upload redacted identity and queue receipts
        uses: actions/upload-artifact@v4
        with:
          name: zel-exact25-identity-indicator-queue-${{ github.run_id }}
          path: out/identity
          if-no-files-found: error
          retention-days: 30
