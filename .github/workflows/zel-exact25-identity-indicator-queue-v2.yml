name: ZEL Exact25 Identity Indicator Queue V2

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  pull_request:
    branches: [zel-alpha-unattended-champion-v2, master]
    paths:
      - backend/research/zel_exact25_identity_indicator_policy_v1.json
      - backend/tools/zel_exact25_identity_indicator_audit_v1.py
      - backend/research/zel_alpha_unattended_champion_v2.json
      - .github/workflows/zel-exact25-identity-indicator-queue-v2.yml
  push:
    branches: [zel-exact25-identity-indicator-autonomy-v1]

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-exact25-identity-indicator-queue-v2-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-and-plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact25 identity preflight
        run: |
          set -euo pipefail
          tool=control/backend/tools/zel_exact25_identity_indicator_audit_v1.py
          policy=control/backend/research/zel_exact25_identity_indicator_policy_v1.json
          terminal=results/runtime_results/zel/historical_oos_exact25_replay_v1/1m/latest.json
          python -m py_compile "$tool"
          python -m json.tool "$policy" >/dev/null
          python "$tool" --policy "$policy" --self-test
          mkdir -p out/identity
          python "$tool" --policy "$policy" --terminal "$terminal" \
            --optimizer-policy control/backend/research/zel_alpha_unattended_champion_v2.json \
            --out out/identity
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/identity/latest.json').read_text())
          assert r['state']=='PASS_EXACT25_IDENTITY_AND_INDICATOR_QUEUE_READY',r
          assert r['strategy_count']==25 and r['trade_count']==1951,r
          assert not r['quarantined_strategy_ids'],r
          assert all(r['global_checks'].values()),r
          alpha=next(row for row in r['strategies'] if row['strategy_id']=='alpha_combo')
          assert alpha['authority_mode']=='SEALED_RESEARCH_AUTHORITY',alpha
          assert alpha['optimizer_profile']=='ALPHA_TIME54_TIME60_STOP065',alpha
          assert alpha['authority']['raw_exact25_optimizer_forbidden'] is True,alpha
          PY
      - name: Gemini bounded designer and selected-only red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          audit=json.loads(Path('out/identity/latest.json').read_text())
          queue=audit['experiment_queue'][:12]
          models=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']
          constraints={'choose_from_queue_only':True,'one_axis_per_strategy':True,'one_axis_change_only':True,'entry_causal_only':True,'w1_select_then_freeze_w2_w3':True,'exact_source_replay_before_survivor':True,'all_authorities_are_research_only':True,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED'}
          def call(role,instruction,evidence):
              payload={'contents':[{'parts':[{'text':'You are '+role+' for ZEL research. '+instruction+' EVIDENCE='+json.dumps(evidence,sort_keys=True,separators=(',',':'))}]}],'generationConfig':{'temperature':0.1,'maxOutputTokens':2048,'responseMimeType':'application/json'}}
              last=None
              for model in models:
                  try:
                      url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={os.environ["GEMINI_API_KEY"]}'
                      req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
                      with urllib.request.urlopen(req,timeout=90) as response: body=json.load(response)
                      return {'model':model,'response':json.loads(body['candidates'][0]['content']['parts'][0]['text'])}
                  except Exception as exc:
                      last=f'{type(exc).__name__}:{exc}'; time.sleep(2)
              raise RuntimeError('GEMINI_CALL_FAILED:'+str(last))
          designer=call('the bounded causal experiment designer','Return verdict TEST/HOLD and at most 3 exact queue selections.',{'identity_receipt_sha256':audit['receipt_sha256'],'queue':queue,'constraints':constraints})
          allowed={(r['strategy_id'],r['axis_id']):r for r in queue}; selected=[]; seen=set()
          for proposed in designer['response'].get('selections') or []:
              pair=(str(proposed.get('strategy_id')),str(proposed.get('axis_id')))
              if pair in allowed and pair[0] not in seen: selected.append(dict(allowed[pair])); seen.add(pair[0])
              if len(selected)>=3: break
          redteam=call('the independent overfit and lineage red-team','Return verdict exactly ACCEPT or REJECT. Review selected_experiments only. SEALED_RESEARCH_AUTHORITY is non-production research lineage.',{'identity_receipt_sha256':audit['receipt_sha256'],'selected_experiments':selected,'constraints':constraints})
          verdict=str(redteam['response'].get('verdict') or '').upper()
          accepted=designer['response'].get('verdict')=='TEST' and bool(selected) and verdict in {'ACCEPT','APPROVED'}
          result={'schema_version':'zel.exact25.identity_indicator.gemini_queue.v2','state':'PASS_GEMINI_SINGLE_AXIS_QUEUE_ACCEPTED' if accepted else 'HOLD_GEMINI_QUEUE_REJECTED','identity_receipt_sha256':audit['receipt_sha256'],'designer':designer,'redteam':redteam,'selected_experiments':selected if accepted else [],'raw_trade_rows_sent':False,'raw_prices_sent':False,'private_code_sent':False,'credentials_sent':False,'canonical_mutated':False,'registry_mutated':False,'runtime_mutated':False,'formal_ledger_mutated':False,'selection_authority':False,'promotion_authority':False,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          result['receipt_sha256']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('out/identity/gemini_queue.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          assert accepted,result
          print({'state':result['state'],'selected':[(r['strategy_id'],r['axis_id']) for r in selected]})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-exact25-identity-indicator-queue-v2-${{ github.run_id }}
          path: out/identity
          if-no-files-found: error
          retention-days: 30
