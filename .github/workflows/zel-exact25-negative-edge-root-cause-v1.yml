name: ZEL Exact25 Negative Edge Root Cause V1

on:
  workflow_dispatch:
  schedule:
    - cron: '42 * * * *'
  pull_request:
    branches: [zel-alpha-unattended-champion-v2, master]
    paths:
      - backend/research/zel_exact25_negative_edge_root_cause_v1.json
      - backend/tools/zel_exact25_negative_edge_root_cause_v1.py
      - backend/tools/zel_exact25_source_owner_audit_v1.py
      - .github/workflows/zel-exact25-negative-edge-root-cause-v1.yml
  push:
    branches: [master]
    paths:
      - backend/research/zel_exact25_negative_edge_root_cause_v1.json
      - backend/tools/zel_exact25_negative_edge_root_cause_v1.py
      - backend/tools/zel_exact25_source_owner_audit_v1.py
      - .github/workflows/zel-exact25-negative-edge-root-cause-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-exact25-negative-edge-root-cause-v1-${{ github.event_name == 'pull_request' && github.head_ref || 'master' }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile \
            control/backend/tools/zel_exact25_negative_edge_root_cause_v1.py \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py
          python -m json.tool control/backend/research/zel_exact25_negative_edge_root_cause_v1.json >/dev/null
          python control/backend/tools/zel_exact25_negative_edge_root_cause_v1.py --self-test
          python control/backend/tools/zel_exact25_source_owner_audit_v1.py --self-test
      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Source-owner gate and root-cause decomposition
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          remote="/tmp/zel-negative-edge-root-cause-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py \
            control/backend/tools/zel_exact25_negative_edge_root_cause_v1.py \
            control/backend/research/zel_exact25_negative_edge_root_cause_v1.json \
            results/runtime_results/zel/historical_oos_exact25_replay_v1/1m/latest.json \
            "$VPS_USER@$VPS_HOST:$remote/"
          timeout 1800s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; \
             engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_source_owner_audit_v1.py' \
               --engine \"\$engine\" --source-root /home/z/z --terminal '$remote/latest.json' \
               --out '$remote/source_owner.json'; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_negative_edge_root_cause_v1.py' \
               --policy '$remote/zel_exact25_negative_edge_root_cause_v1.json' \
               --terminal-root /var/lib/zel-research/data-b-1m-v2 \
               --out '$remote/root_cause.json'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/source_owner.json" out/source_owner.json
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/root_cause.json" out/root_cause.json
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'"
          python -m json.tool out/source_owner.json >/dev/null
          python -m json.tool out/root_cause.json >/dev/null
      - name: Verify fail-closed diagnosis
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('out/source_owner.json').read_text())
          result=json.loads(Path('out/root_cause.json').read_text())
          assert source['state']=='PASS_EXACT25_SOURCE_OWNER_AUDIT',source
          assert source['strategy_count']==25 and not source['quarantined_strategy_ids'],source
          assert result['state']=='PASS_NEGATIVE_EDGE_ROOT_CAUSE_AUDIT',result
          assert result['strategy_count']==25 and result['trade_count']==1951,result
          assert result['root_causes'] and result['next_research_axis'],result
          assert result['raw_trade_rows_published'] is False,result
          assert result['canonical_mutated'] is False and result['registry_mutated'] is False,result
          assert result['runtime_mutated'] is False and result['formal_ledger_mutated'] is False,result
          assert result['selection_authority'] is False and result['promotion_authority'] is False,result
          assert result['execution_authority']=='NONE' and result['order_authority']=='BLOCKED',result
          print({
            'state':result['state'],
            'portfolio':result['portfolio'],
            'top_causes':[(row['cause'],round(row['score'],3)) for row in result['root_causes'][:3]],
            'next_research_axis':result['next_research_axis'],
          })
          PY
      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-exact25-negative-edge-root-cause-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
