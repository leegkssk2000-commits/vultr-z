name: ZEL Exact25 Selected Indicator Screen V1

on:
  workflow_dispatch:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2, master]
    paths:
      - backend/research/zel_exact25_selected_indicator_screen_v1.json
      - backend/tools/zel_exact25_selected_indicator_screen_v1.py
      - backend/tools/zel_exact25_source_owner_audit_v1.py
      - .github/workflows/zel-exact25-selected-indicator-screen-v1.yml

permissions:
  contents: read

concurrency:
  group: zel-exact25-selected-indicator-screen-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  screen:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy
          python -m py_compile \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py \
            control/backend/tools/zel_exact25_selected_indicator_screen_v1.py
          python control/backend/tools/zel_exact25_source_owner_audit_v1.py --self-test
          python control/backend/tools/zel_exact25_selected_indicator_screen_v1.py --self-test
          python -m json.tool control/backend/research/zel_exact25_selected_indicator_screen_v1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('control/backend/research/zel_exact25_selected_indicator_screen_v1.json').read_text())
          expected=[('ema_ribbon_scalp','MACD_HISTOGRAM_SIGN'),('grid_rebalance','FIB_RETRACE_ZONE'),('scalp_snap','RSI_BAND')]
          actual=[(row['strategy_id'],row['axis_id']) for row in p['experiments']]
          assert actual==expected,(actual,expected)
          assert p['selection_protocol']['one_strategy_one_axis'] is True
          assert p['selection_protocol']['select_on_w1_only'] is True
          assert p['selection_protocol']['freeze_for_w2_w3'] is True
          PY
      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Source identity gate then selected indicator screen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          remote="/tmp/zel-selected-indicator-screen-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            control/backend/tools/zel_exact25_source_owner_audit_v1.py \
            control/backend/tools/zel_exact25_selected_indicator_screen_v1.py \
            control/backend/research/zel_exact25_selected_indicator_screen_v1.json \
            results/runtime_results/zel/historical_oos_exact25_replay_v1/1m/latest.json \
            "$VPS_USER@$VPS_HOST:$remote/"
          set +e
          timeout 17400s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=60 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; \
             engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             test -f \"\$engine\" || engine=/home/z/z/backend/tools/zel_historical_oos_exact25_replay_v1.py; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_source_owner_audit_v1.py' \
               --engine \"\$engine\" --source-root /home/z/z --terminal '$remote/latest.json' \
               --out '$remote/source_owner.json'; \
             /home/z/z/.venv/bin/python '$remote/zel_exact25_selected_indicator_screen_v1.py' \
               --policy '$remote/zel_exact25_selected_indicator_screen_v1.json' \
               --engine \"\$engine\" --terminal-root /var/lib/zel-research/data-b-1m-v2 \
               --data-root /opt/zel/historical-oos-v1 --out '$remote/screen.json'; \
             cat '$remote/source_owner.json'; echo; cat '$remote/screen.json'" \
            > out/combined.jsonl 2>out/stderr.log
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "cat '$remote/source_owner.json'" > out/source_owner.json
            ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "cat '$remote/screen.json'" > out/screen.json
          fi
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'"
          rm -f out/combined.jsonl
          if [ "$rc" -ne 0 ]; then tail -n 120 out/stderr.log; exit "$rc"; fi
          rm -f out/stderr.log
          python -m json.tool out/source_owner.json >/dev/null
          python -m json.tool out/screen.json >/dev/null
      - name: Verify source binding and economic gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('out/source_owner.json').read_text())
          result=json.loads(Path('out/screen.json').read_text())
          assert source['state']=='PASS_EXACT25_SOURCE_OWNER_AUDIT',source
          assert source['strategy_count']==25 and not source['quarantined_strategy_ids'],source
          assert result['state']=='PASS_SELECTED_INDICATOR_SCREEN_COMPLETE',result
          assert result['experiment_count']==3,result
          for row in result['strategies']:
              assert all(row['baseline_parity'].values()),row
              assert row['candidate_count']>0,row
          assert result['raw_trade_rows_published'] is False,result
          assert result['raw_prices_published'] is False,result
          assert result['source_copy_deleted'] is True,result
          assert result['canonical_mutated'] is False and result['registry_mutated'] is False,result
          assert result['runtime_mutated'] is False and result['formal_ledger_mutated'] is False,result
          assert result['selection_authority'] is False and result['promotion_authority'] is False,result
          assert result['execution_authority']=='NONE' and result['order_authority']=='BLOCKED',result
          print({'state':result['state'],'survivor_count':result['survivor_count'],'strategies':[(r['strategy_id'],r['axis_id'],r['survivor']) for r in result['strategies']]})
          PY
      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-exact25-selected-indicator-screen-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
