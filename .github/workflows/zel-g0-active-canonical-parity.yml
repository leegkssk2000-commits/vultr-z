name: ZEL G0 Active Canonical Parity

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/ci/g0_active_canonical_parity.py
      - policies/zel/g0_source_persistence_gate_v1.json
      - config/zel_alpha_engine_vnext.json
      - .github/workflows/zel-g0-active-canonical-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-canonical-parity:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate parity probe
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/g0_active_canonical_parity.py
          mkdir -p out

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Compare active runtime to private canonical escrow read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "G0_ROOT=/home/z/z G0_ESCROW_ROOT=/home/z/.zel-g0-source-escrow python3 -" \
            < scripts/ci/g0_active_canonical_parity.py \
            > out/g0_active_canonical_parity.json
          python -m json.tool out/g0_active_canonical_parity.json >/dev/null

      - name: Verify fail-closed parity receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/g0_active_canonical_parity.json').read_text())
          assert r['schema_version']=='zel.g0.active_canonical_parity.v1'
          assert r['source_path_total']==84
          assert r['module_total']==12
          assert r['runtime_mutated'] is False
          assert r['service_state_mutated'] is False
          assert r['destructive_cleanup_authority'] is False
          assert r['execution_authority']=='NONE'
          assert r['order_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],
            'source_match':f"{r['source_match_count']}/{r['source_path_total']}",
            'source_missing':r['source_missing_count'],
            'hash_mismatch':r['source_hash_mismatch_count'],
            'module_pass':f"{r['module_parity_pass_count']}/{r['module_total']}",
            'missing':r['missing_source_paths'],
            'action':r['action']
          }, sort_keys=True))
          PY

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-g0-active-canonical-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/g0_active_canonical_parity.json
          if-no-files-found: error
          retention-days: 30
