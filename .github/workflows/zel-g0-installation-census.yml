name: ZEL G0 Installation Census

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  G0_RECEIPT: out/g0_installation_census_static.json

jobs:
  static-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: G0 policy syntax
        run: |
          set -euo pipefail
          python -m json.tool policies/zel/g0_installation_certification_v1.json >/dev/null
          python -m json.tool config/zel_alpha_engine_vnext.json >/dev/null
      - name: Census self-test
        run: |
          set -euo pipefail
          python scripts/ci/g0_installation_census.py --self-test
          python -m unittest tests.test_g0_installation_census -v
      - name: Generate static ownership receipt
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/ci/g0_installation_census.py --out "$G0_RECEIPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/g0_installation_census_static.json')
          r=json.loads(p.read_text())
          assert r['execution_authority']=='NONE'
          assert r['order_authority']=='BLOCKED'
          assert r['destructive_cleanup_authority'] is False
          assert r['workflow_count'] > 0
          assert r['scan_file_count'] > 0
          assert 'RUNTIME_CENSUS_REQUIRED' in r['runtime_blockers']
          print('PASS_G0A_STATIC_CENSUS_RUNTIME_STILL_REQUIRED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-g0-static-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/g0_installation_census_static.json
          if-no-files-found: error
          retention-days: 30

  p1-cleanup-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'zel/g0-install-certification-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate P1 cleanup probe and G0 PASS gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/p1_cleanup_probe.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('policies/zel/g0_installation_certification_v1.json').read_text())
          assert p['state']=='PASS_G0_INSTALLATION_BASELINE_L0_L1_L2'
          assert p['proven_safe_cleanup_gate_open'] is True
          assert p['destructive_cleanup_authority'] is False
          PY
          mkdir -p ~/.ssh out
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Probe cleanup candidates and workflow sprawl read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" "G0_ROOT=/home/z/z python3 -" \
              < scripts/ci/p1_cleanup_probe.py > out/p1_cleanup_probe.json; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt*4))
          done
          python -m json.tool out/p1_cleanup_probe.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/p1_cleanup_probe.json').read_text())
          assert r['state']=='PASS_P1_READ_ONLY_CLEANUP_PROBE'
          assert r['runtime_mutated'] is False
          assert r['service_state_mutated'] is False
          assert r['destructive_cleanup_performed'] is False
          assert r['execution_authority']=='NONE'
          assert r['order_authority']=='BLOCKED'
          print(json.dumps({
            'delete_ready_count':r['delete_ready_count'],
            'workflow_count':r['workflow_census']['workflow_count'],
            'broad_pull_request_count':r['workflow_census']['broad_pull_request_count'],
            'scheduled_count':r['workflow_census']['scheduled_count'],
            'candidates':[{x['path']:x['decision']} for x in r['candidate_rows']],
            'action':r['action']
          },sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-p1-cleanup-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/p1_cleanup_probe.json
          if-no-files-found: error
          retention-days: 30

  p2-trend-momentum-base:
    if: github.event_name == 'pull_request' && github.head_ref == 'zel/g0-install-certification-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: zel-p2-trend-momentum-base-embedded-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen P2 BASE and authority boundary
        run: |
          set -euo pipefail
          python -m py_compile backend/research/p2_trend_momentum_base.py backend/tools/zel_bingx_real_calibration_v1.py
          python -m json.tool policies/zel/p2_trend_momentum_base_v1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('policies/zel/p2_trend_momentum_base_v1.json').read_text())
          assert c['state']=='FROZEN_BEFORE_REPLAY'
          assert c['family']=='trend_momentum'
          assert c['symbols']==['BTCUSDT','ETHUSDT']
          assert c['timeframe']=='15m'
          assert c['signal']['lookback_bars']==16
          assert c['signal']['same_bar_fill'] is False
          assert c['signal']['parameter_selection_performed'] is False
          assert c['signal']['stop_loss'] is None and c['signal']['take_profit'] is None
          assert c['data']['untouched_window']=='15m_w3'
          assert c['selection_authority'] is False and c['promotion_authority'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED'
          print('PASS_P2_BASE_FROZEN')
          PY
          mkdir -p /tmp/p2_history/zel_historical_oos_v1/market/15m/{15m_w1,15m_w2} out ~/.ssh
      - name: Materialize only W1 and W2 BTC/ETH 15m; W3 stays untouched
        run: |
          set -euo pipefail
          git fetch --depth=1 origin zel-historical-oos-data-v1
          git show FETCH_HEAD:zel_historical_oos_v1/manifest.json > /tmp/p2_history/zel_historical_oos_v1/manifest.json
          for w in 15m_w1 15m_w2; do
            for s in BTCUSDT ETHUSDT; do
              git show FETCH_HEAD:zel_historical_oos_v1/market/15m/$w/$s.csv > /tmp/p2_history/zel_historical_oos_v1/market/15m/$w/$s.csv
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/p2_history/zel_historical_oos_v1/manifest.json').read_text())
          assert str(m['state']).startswith('PASS_')
          assert m['forward_overlap_count']==0
          assert m['execution_authority']=='NONE' and m['order_authority']=='BLOCKED'
          for w in ('15m_w1','15m_w2'):
              for s in ('BTCUSDT','ETHUSDT'):
                  p=Path(f'/tmp/p2_history/zel_historical_oos_v1/market/15m/{w}/{s}.csv')
                  assert p.is_file() and p.stat().st_size>0
          assert not Path('/tmp/p2_history/zel_historical_oos_v1/market/15m/15m_w3').exists()
          print('PASS_P2_W1_W2_ONLY_W3_UNTOUCHED')
          PY
      - name: Prepare P2 SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Collect fresh BingX read-only execution cost envelope
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/p2-trend-cost-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$remote" > out/remote_path.txt
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes backend/tools/zel_bingx_real_calibration_v1.py "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt nice -n 19 ionice -c3 /usr/bin/python3 '$remote/zel_bingx_real_calibration_v1.py' --out '$remote/observation.json'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/observation.json" out/bingx_real_observation.json
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/bingx_real_observation.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==r['receipt_sha256']
          assert r['state'].startswith('PASS_BINGX_REAL_OBSERVATION_COLLECTED')
          assert r['source_tier']=='official' and r['calibration_mode']=='real'
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          print('PASS_P2_COST',json.dumps({
            'taker_fee_pct':r['taker_fee_pct'],
            'funding_p95_abs_pct_8h':r['funding_p95_abs_pct_8h'],
            'slippage':r['slippage_floor_bps_by_notional'],
            'receipt':r['receipt_sha256']
          },sort_keys=True))
          PY
      - name: Scan DD SSOT references read-only without inventing a limit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'python3 -' > out/dd_ssot_scan.json <<'PY'
          import json,re
          from pathlib import Path
          roots=[Path('/home/z/z/config'),Path('/home/z/z/policies'),Path('/home/z/z/runtime')]
          pat=re.compile(r'(DD_total|DD_day|dd_total|dd_day|max_drawdown|drawdown_limit|dd_limit)',re.I)
          hits=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.json'):
                  try:
                      if p.stat().st_size>1_000_000: continue
                      d=json.loads(p.read_text(errors='ignore'))
                  except Exception: continue
                  def walk(v,path):
                      if isinstance(v,dict):
                          for k,x in v.items():
                              np=path+[str(k)]
                              if pat.search(str(k)) and isinstance(x,(int,float)) and not isinstance(x,bool):
                                  hits.append({'source':str(p),'key_path':'.'.join(np),'value':x})
                              walk(x,np)
                      elif isinstance(v,list):
                          for i,x in enumerate(v[:200]): walk(x,path+[str(i)])
                  walk(d,[])
          print(json.dumps({'state':'OBSERVED_NOT_AUTHORITY','hits':hits[:200],'resolved_dd_limit_pct':None},sort_keys=True))
          PY
          python -m json.tool out/dd_ssot_scan.json >/dev/null
      - name: Run W1 plus W2 costed BASE; W3 remains untouched
        run: |
          set -euo pipefail
          python backend/research/p2_trend_momentum_base.py \
            --data-root /tmp/p2_history \
            --manifest /tmp/p2_history/zel_historical_oos_v1/manifest.json \
            --contract policies/zel/p2_trend_momentum_base_v1.json \
            --cost-model out/bingx_real_observation.json \
            --dd-limit-pct 0 \
            --out out/p2_trend_momentum_base_receipt.json
          python - <<'PY'
          import json
          r=json.load(open('out/p2_trend_momentum_base_receipt.json'))
          assert r['contract_frozen_before_replay'] is True
          assert r['parameter_selection_performed'] is False
          assert r['exit_optimization_performed'] is False
          assert r['untouched_w3_accessed'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          for x in r['results']:
              n=x['net']
              print('P2',x['window'],x['symbol'],
                    'trades=',n['trade_count'],
                    'wr=',n['win_rate'],
                    'net=',n['compound_return'],
                    'exp=',n['expectancy_per_trade'],
                    'pf=',n['profit_factor'],
                    'dd=',n['max_drawdown'],
                    'edge=',x['base_edge_pass'])
          print('P2_STATE',r['state'],'OOS_PASS',r['oos_base_edge_pass_symbols'],'OOS_FAIL',r['oos_base_edge_fail_symbols'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-p2-trend-momentum-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/bingx_real_observation.json
            out/dd_ssot_scan.json
            out/p2_trend_momentum_base_receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup remote P2 cost probe
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f ~/.ssh/vps_key
