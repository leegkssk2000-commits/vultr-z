name: ZEL G0 Runtime Census

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/ci/g0_runtime_probe.py
      - scripts/ci/g0_runtime_drift_reconcile.py
      - scripts/ci/g0_runtime_git_persistence_probe.py
      - scripts/ci/g0_runtime_source_safety_scan.py
      - scripts/ci/g0_installation_census.py
      - policies/zel/g0_installation_certification_v1.json
      - config/zel_alpha_engine_vnext.json
      - research/legacy_strategy25_inventory_v1.json
      - backend/research/zel_composite_live_source_pin_v1.json
      - .github/workflows/zel-g0-runtime-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-census:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate local G0 scripts
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/g0_runtime_probe.py scripts/ci/g0_runtime_drift_reconcile.py scripts/ci/g0_runtime_git_persistence_probe.py scripts/ci/g0_runtime_source_safety_scan.py scripts/ci/g0_installation_census.py
          python -m json.tool backend/research/zel_composite_live_source_pin_v1.json >/dev/null
          python -m json.tool research/legacy_strategy25_inventory_v1.json >/dev/null
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run read-only VPS owner/source census
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          LEGACY25_B64=$(base64 -w0 research/legacy_strategy25_inventory_v1.json)
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "G0_ROOT=/home/z/z EXPECTED_PIN_B64='$PIN_B64' LEGACY25_B64='$LEGACY25_B64' python3 -" < scripts/ci/g0_runtime_probe.py > out/g0_runtime_census.json
          python -m json.tool out/g0_runtime_census.json >/dev/null
      - name: Run read-only runtime Git persistence census
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          LEGACY25_B64=$(base64 -w0 research/legacy_strategy25_inventory_v1.json)
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "G0_ROOT=/home/z/z EXPECTED_PIN_B64='$PIN_B64' LEGACY25_B64='$LEGACY25_B64' python3 -" < scripts/ci/g0_runtime_git_persistence_probe.py > out/g0_runtime_git_persistence.json
          python -m json.tool out/g0_runtime_git_persistence.json >/dev/null
      - name: Run secret-safe runtime source staging scan
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          LEGACY25_B64=$(base64 -w0 research/legacy_strategy25_inventory_v1.json)
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "G0_ROOT=/home/z/z EXPECTED_PIN_B64='$PIN_B64' LEGACY25_B64='$LEGACY25_B64' python3 -" < scripts/ci/g0_runtime_source_safety_scan.py > out/g0_runtime_source_safety_scan.json
          python -m json.tool out/g0_runtime_source_safety_scan.json >/dev/null
      - name: Diagnose repo-vs-runtime source drift
        run: |
          set -euo pipefail
          python scripts/ci/g0_runtime_drift_reconcile.py --pin backend/research/zel_composite_live_source_pin_v1.json --runtime out/g0_runtime_census.json --out out/g0_runtime_drift_diagnosis.json
          python -m json.tool out/g0_runtime_drift_diagnosis.json >/dev/null
      - name: Reconcile static and runtime census fail-closed
        run: |
          set -euo pipefail
          python scripts/ci/g0_installation_census.py --runtime-manifest out/g0_runtime_census.json --out out/g0_reconciled_census.json --require-runtime-pass
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-g0-runtime-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/g0_runtime_census.json
            out/g0_runtime_git_persistence.json
            out/g0_runtime_source_safety_scan.json
            out/g0_runtime_drift_diagnosis.json
            out/g0_reconciled_census.json
          if-no-files-found: ignore
          retention-days: 30
