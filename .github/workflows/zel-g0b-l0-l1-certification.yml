name: ZEL G0-B L0/L1 Certification

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/ci/g0b_l0_l1_certify.py
      - scripts/ci/g0b_l1_owner_graph.py
      - scripts/ci/g0b_stage_adjudicate.py
      - scripts/ci/g0_runtime_probe.py
      - backend/research/zel_composite_live_source_pin_v1.json
      - research/legacy_strategy25_inventory_v1.json
      - config/zel_alpha_engine_vnext.json
      - policies/zel/g0_installation_certification_v1.json
      - policies/zel/g0_source_persistence_gate_v1.json
      - policies/zel/g0_stage_aware_binding_v1.json
      - .github/workflows/zel-g0b-l0-l1-certification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0b-l0-l1:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate G0-B scripts and contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/g0b_l0_l1_certify.py scripts/ci/g0b_l1_owner_graph.py scripts/ci/g0b_stage_adjudicate.py scripts/ci/g0_runtime_probe.py
          python -m json.tool backend/research/zel_composite_live_source_pin_v1.json >/dev/null
          python -m json.tool research/legacy_strategy25_inventory_v1.json >/dev/null
          python -m json.tool config/zel_alpha_engine_vnext.json >/dev/null
          python -m json.tool policies/zel/g0_stage_aware_binding_v1.json >/dev/null

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Refresh read-only runtime census receipt for G0-B
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          LEGACY25_B64=$(base64 -w0 research/legacy_strategy25_inventory_v1.json)
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "G0_ROOT=/home/z/z EXPECTED_PIN_B64='$PIN_B64' LEGACY25_B64='$LEGACY25_B64' python3 - | tee /home/z/.zel-g0-source-escrow/runtime_census_latest.json" \
            < scripts/ci/g0_runtime_probe.py \
            > out/g0_runtime_census_for_g0b.json
          python -m json.tool out/g0_runtime_census_for_g0b.json >/dev/null

      - name: Certify raw component L0 PRESENT and active-binding L1 diagnostic
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          LEGACY25_B64=$(base64 -w0 research/legacy_strategy25_inventory_v1.json)
          ALPHA_B64=$(base64 -w0 config/zel_alpha_engine_vnext.json)
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "G0_ROOT=/home/z/z G0_ESCROW_ROOT=/home/z/.zel-g0-source-escrow EXPECTED_PIN_B64='$PIN_B64' LEGACY25_B64='$LEGACY25_B64' ALPHA_B64='$ALPHA_B64' python3 -" \
            < scripts/ci/g0b_l0_l1_certify.py \
            > out/g0b_l0_l1_certification.json
          python -m json.tool out/g0b_l0_l1_certification.json >/dev/null

      - name: Diagnose unresolved active-owner graph read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          PIN_B64=$(base64 -w0 backend/research/zel_composite_live_source_pin_v1.json)
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "G0_ROOT=/home/z/z EXPECTED_PIN_B64='$PIN_B64' python3 -" \
            < scripts/ci/g0b_l1_owner_graph.py \
            > out/g0b_l1_owner_graph.json
          python -m json.tool out/g0b_l1_owner_graph.json >/dev/null

      - name: Adjudicate G0 installation binding by roadmap stage
        run: |
          set -euo pipefail
          python scripts/ci/g0b_stage_adjudicate.py \
            --raw out/g0b_l0_l1_certification.json \
            --policy policies/zel/g0_stage_aware_binding_v1.json \
            --out out/g0b_stage_aware_adjudication.json
          python -m json.tool out/g0b_stage_aware_adjudication.json >/dev/null

      - name: Verify fail-closed G0-B receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/g0b_l0_l1_certification.json').read_text())
          o=json.loads(Path('out/g0b_l1_owner_graph.json').read_text())
          a=json.loads(Path('out/g0b_stage_aware_adjudication.json').read_text())
          assert r['schema_version']=='zel.g0b.l0_l1.certification.v1'
          assert o['schema_version']=='zel.g0b.l1.owner_graph.v1'
          assert a['schema_version']=='zel.g0b.stage_aware_adjudication.v1'
          for x in (r,o,a):
              assert x['runtime_mutated'] is False
              assert x['service_state_mutated'] is False
              assert x['destructive_cleanup_authority'] is False
              assert x['execution_authority']=='NONE'
              assert x['order_authority']=='BLOCKED'
          assert r['l0_pass_total']==r['l0_total']==40
          assert len(r['strategy25_rows'])==25
          assert len(r['alpha_family_rows'])==3
          assert len(r['module_rows'])==12
          assert len(o['module_rows'])==12
          assert a['state']=='PASS_G0B_STAGE_AWARE_L0_L1'
          assert a['stage_aware_l1_pass_count']==a['stage_aware_l1_total']==40
          print(json.dumps({
              'stage_aware_state': a['state'],
              'L0': f"{r['l0_pass_total']}/{r['l0_total']}",
              'raw_active_L1': f"{r['l1_pass_total']}/{r['l1_total']}",
              'stage_aware_L1': f"{a['stage_aware_l1_pass_count']}/{a['stage_aware_l1_total']}",
              'strategy25_registry': r['strategy25_l1_pass'],
              'skill_registry_detected_count': r['skill_registry_detected_count'],
              'owner_graph_active_module_pass': sum(x['L1_OWNER_GRAPH']=='PASS' for x in o['module_rows']),
              'action': a['action'],
          }, sort_keys=True))
          PY

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-g0b-l0-l1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/g0_runtime_census_for_g0b.json
            out/g0b_l0_l1_certification.json
            out/g0b_l1_owner_graph.json
            out/g0b_stage_aware_adjudication.json
          if-no-files-found: error
          retention-days: 30
