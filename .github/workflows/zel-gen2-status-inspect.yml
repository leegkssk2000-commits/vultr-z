name: ZEL C120 PnL WR Validation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-gen2-status-inspect.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Validate C120 with PnL WR primary gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PY=/home/z/z/.venv/bin/python
          ROOT=/opt/zel/research-runtime/jobs/structural-premium-vwap-closed-loop-v1
          DUR=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          BASE=/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1
          RUN=$ROOT/gen2/runs/C120_FASTSALVAGE
          OUT=$ROOT/gen3/c120_pnlwr_validation
          CANON=/opt/zel/forward-expansion-v1/source
          mkdir -p "$OUT" "$RUN/logs" "$RUN/result"
          test -s "$RUN/engine/replay_v1_candidate.py"
          test -s "$RUN/engine/replay_v2_candidate.py"
          test -s "$ROOT/gen2/result/baseline_w12.json"
          test -s "$RUN/result/w2_score.json"

          canon_hash() {
            { find "$CANON/backend/strategies" -type f ! -path '*/__pycache__/*' ! -name '*.pyc' -print0 | sort -z | xargs -0 sha256sum; sha256sum "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json" "$CANON/backend/config/q4r3_exact25_shadow_binding_v1.json"; } | sha256sum | awk '{print $1}'
          }
          BEFORE=$(canon_hash)

          "$PY" - "$ROOT/gen2/result/baseline_w12.json" "$RUN/result/w2_score.json" "$OUT/w2_pnlwr_gate.json" <<'PYW2'
          import json,sys
          from pathlib import Path
          b=json.loads(Path(sys.argv[1]).read_text())['by_window']['1m_w2']
          c=json.loads(Path(sys.argv[2]).read_text())['metrics']
          gate={'baseline_net_R':b['net_R'],'candidate_net_R':c['net_R'],'baseline_wr_pct':b['win_rate_pct'],'candidate_wr_pct':c['win_rate_pct'],'net_improved':c['net_R']>b['net_R'],'wr_improved':c['win_rate_pct']>b['win_rate_pct'],'pf_secondary':c['profit_factor'],'sample_count':c['sample_count']}
          gate['pass']=gate['net_improved'] and gate['wr_improved'] and c['sample_count']>=30
          Path(sys.argv[3]).write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          print('W2_PNLWR_GATE',json.dumps(gate,sort_keys=True))
          if not gate['pass']: raise SystemExit('C120_W2_NOT_PNLWR_PASS')
          PYW2

          make_lane() {
            phase="$1"; window="$2"; lane="$RUN/engine/lane_${phase}_pnlwr.py"
            cp "$DUR/work/engine/lane_checkpoint_v2.py" "$lane"
            "$PY" - "$lane" "$window" <<'PYLANE'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); w=sys.argv[2]; t=p.read_text()
          a='files = sorted(files, key=lambda row: (str(row["window_id"]), str(row["symbol"])))'
          if t.count(a)!=1: raise SystemExit('LANE_SORT_ANCHOR')
          p.write_text(t.replace(a,a+f'\n    files = [row for row in files if str(row["window_id"]) == {w!r}]',1))
          PYLANE
            "$PY" -m py_compile "$lane"
          }

          score_phase() {
            phase="$1"; window="$2"; replay="$RUN/replay_${phase}_pnlwr"; basejson="$3"; score="$OUT/${phase}_pnlwr_score.json"
            "$PY" - "$RUN/engine/replay_v1_candidate.py" "$replay/lane_checkpoints/vwap_revert" "$basejson" "$window" "$score" <<'PYSCORE'
          import gzip,importlib.util,json,sys
          from pathlib import Path
          eng,root,basep=map(Path,sys.argv[1:4]); window=sys.argv[4]; out=Path(sys.argv[5])
          spec=importlib.util.spec_from_file_location('pnlwrscore',eng); e=importlib.util.module_from_spec(spec); sys.modules[spec.name]=e; spec.loader.exec_module(e)
          rows=[]; files=sorted(root.glob('*.json.gz'))
          if len(files)!=5: raise SystemExit(f'LANE_COUNT:{len(files)}')
          for p in files:
            with gzip.open(p,'rt',encoding='utf-8') as h:d=json.load(h)
            if str(d.get('window_id'))!=window: raise SystemExit(f'WINDOW_LEAK:{p}')
            rows += [r for r in (d.get('result') or {}).get('closed_rows') or [] if r.get('side')=='long']
          b=json.loads(basep.read_text())['by_window'][window]; m=e.metrics(rows)
          gate={'net_improved':m['net_R']>b['net_R'],'wr_improved':m['win_rate_pct']>b['win_rate_pct'],'sample_ok':m['sample_count']>=max(30,int(b['sample_count']*.5))}
          gate['pass']=all(gate.values())
          payload={'window':window,'baseline':b,'candidate':m,'gate':gate,'primary':['net_R','win_rate_pct'],'pf_secondary':m['profit_factor'],'dd_guard':m['max_drawdown_R'],'research_only':True,'execution_authority':'NONE','order_authority':'BLOCKED','promotion_authority':False,'action':'hold'}
          out.write_text(json.dumps(payload,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print('PNLWR_SCORE',json.dumps(payload,sort_keys=True))
          PYSCORE
          }

          make_lane w1 1m_w1
          rm -rf "$RUN/replay_w1_pnlwr"
          "$PY" "$RUN/engine/lane_w1_pnlwr.py" --engine-v1 "$RUN/engine/replay_v1_candidate.py" --engine-v2 "$RUN/engine/replay_v2_candidate.py" --source-root "$BASE/work/source" --data-root "$DUR/work/data" --interval 1m --output-dir "$RUN/replay_w1_pnlwr" --workers 4 2>&1 | tee "$RUN/logs/w1_pnlwr.log"
          score_phase w1 1m_w1 "$ROOT/gen2/result/baseline_w12.json"
          W1PASS=$("$PY" -c "import json; print('1' if json.load(open('$OUT/w1_pnlwr_score.json'))['gate']['pass'] else '0')")

          if [ "$W1PASS" = 1 ]; then
            "$PY" - "$DUR/work/engine/replay_v1.py" "$BASE/work/replay/trades.jsonl.gz" "$OUT/baseline_w3.json" <<'PYBASE3'
          import gzip,importlib.util,json,sys
          from pathlib import Path
          eng,trades,out=map(Path,sys.argv[1:]); spec=importlib.util.spec_from_file_location('b3',eng); e=importlib.util.module_from_spec(spec); sys.modules[spec.name]=e; spec.loader.exec_module(e)
          rows=[]
          with gzip.open(trades,'rt',encoding='utf-8') as h:
            for line in h:
              r=json.loads(line)
              if r.get('strategy_id')=='vwap_revert' and r.get('side')=='long' and str(r.get('window_id'))=='1m_w3': rows.append(r)
          p={'by_window':{'1m_w3':e.metrics(rows)},'research_only':True}
          out.write_text(json.dumps(p,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print('W3_BASELINE',json.dumps(p,sort_keys=True))
          PYBASE3
            make_lane w3 1m_w3
            rm -rf "$RUN/replay_w3_pnlwr"
            "$PY" "$RUN/engine/lane_w3_pnlwr.py" --engine-v1 "$RUN/engine/replay_v1_candidate.py" --engine-v2 "$RUN/engine/replay_v2_candidate.py" --source-root "$BASE/work/source" --data-root "$DUR/work/data" --interval 1m --output-dir "$RUN/replay_w3_pnlwr" --workers 4 2>&1 | tee "$RUN/logs/w3_pnlwr.log"
            score_phase w3 1m_w3 "$OUT/baseline_w3.json"
          else
            echo 'W3_REMAINS_SEALED_W1_PNLWR_FAIL'
          fi

          AFTER=$(canon_hash)
          test "$AFTER" = "$BEFORE" || { echo "CRITICAL_CANONICAL_MUTATION before=$BEFORE after=$AFTER" >&2; exit 97; }
          echo "PASS_CANONICAL_UNCHANGED $AFTER"
          echo '===W2_GATE==='; cat "$OUT/w2_pnlwr_gate.json"
          echo '===W1_SCORE==='; cat "$OUT/w1_pnlwr_score.json"
          echo '===W3_SCORE==='; cat "$OUT/w3_pnlwr_score.json" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
