name: ZEL Gen3 Regime Source Inspect

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-gen2-status-inspect.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect regime feature source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          E=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine/replay_v1.py
          echo '===FEATURE_SNAPSHOT_REFS==='; grep -n 'feature_snapshot' "$E" || true
          echo '===PRODUCER_IMPORTS_TOP==='; sed -n '1,180p' "$E"
          echo '===FEATURE_DEFS_ALL_SOURCE==='; grep -RIn --exclude='*.pyc' --exclude-dir='__pycache__' 'def feature_snapshot' /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source 2>/dev/null | head -40 || true
          for f in $(grep -RIl --exclude='*.pyc' --exclude-dir='__pycache__' 'def feature_snapshot' /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source 2>/dev/null | head -5); do echo "===FILE:$f==="; grep -n -A80 -B10 'def feature_snapshot' "$f" | head -120; done
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
