name: ZEL Grid Neutral Causal Evidence Probe V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_grid_neutral_causal_evidence_probe_v1.py
      - .github/workflows/zel-grid-neutral-causal-evidence-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-grid-neutral-causal-evidence-probe-v1
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_grid_neutral_causal_evidence_probe_v1.py

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run causal evidence probe read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          set +e
          timeout 300s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --runtime-root /home/z/z --terminal-root /var/lib/zel-research/data-b-1m-v2 --stdout' \
            < backend/tools/zel_grid_neutral_causal_evidence_probe_v1.py \
            > out/causal_evidence.json
          probe_rc=$?
          set -e
          test "$probe_rc" -eq 0 -o "$probe_rc" -eq 1
          test -s out/causal_evidence.json
          python -m json.tool out/causal_evidence.json >/dev/null
          printf '%s\n' "$probe_rc" > out/probe_rc.txt

      - name: Verify evidence and safety boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/causal_evidence.json'))
          ledger=row['ledger_subset_proof']
          assert ledger['trade_count']==580,ledger
          assert ledger['neutral_trade_count']==248,ledger
          assert ledger['event_id_nonempty'] is True,ledger
          assert ledger['all_event_ids_unique'] is True,ledger
          assert ledger['neutral_event_ids_unique'] is True,ledger
          assert ledger['neutral_event_ids_subset_of_all'] is True,ledger
          assert ledger['raw_event_ids_published'] is False,ledger
          assert ledger['raw_trade_rows_published'] is False,ledger
          assert row['canonical_mutated'] is False,row
          assert row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['raw_code_published'] is False,row
          assert row['raw_trade_rows_published'] is False,row
          assert row['raw_event_ids_published'] is False,row
          assert row['selection_authority'] is False,row
          assert row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE',row
          assert row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({
              'state':row['state'],
              'blockers':row['blockers'],
              'subset':ledger['neutral_event_ids_subset_of_all'],
              'pre_entry':ledger['neutral_with_pre_entry_context_timestamp'],
              'entry_equal':ledger['neutral_with_entry_equal_context_timestamp'],
              'post_only':ledger['neutral_with_post_entry_context_only'],
              'missing_ts':ledger['neutral_without_context_timestamp'],
              'source_order':row['source_order_proof']['order_proved'],
          })
          PY

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-grid-neutral-causal-evidence-probe-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
