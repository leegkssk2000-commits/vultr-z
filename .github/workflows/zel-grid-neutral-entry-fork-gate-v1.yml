name: ZEL Grid Neutral Entry Fork Gate V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_grid_neutral_entry_fork_gate_v1.json
      - backend/tools/zel_grid_neutral_entry_fork_gate_v1.py
      - .github/workflows/zel-grid-neutral-entry-fork-gate-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-grid-neutral-entry-fork-gate-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static and deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_grid_neutral_entry_fork_gate_v1.py
          python backend/tools/zel_grid_neutral_entry_fork_gate_v1.py --self-test
          python -m json.tool backend/research/zel_grid_neutral_entry_fork_gate_v1.json >/dev/null

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run immutable terminal parity gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          remote="/tmp/zel-grid-neutral-entry-fork-gate-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            backend/tools/zel_grid_neutral_entry_fork_gate_v1.py \
            backend/research/zel_grid_neutral_entry_fork_gate_v1.json \
            "$VPS_USER@$VPS_HOST:$remote/"
          set +e
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "python3 '$remote/zel_grid_neutral_entry_fork_gate_v1.py' \
              --policy '$remote/zel_grid_neutral_entry_fork_gate_v1.json' \
              --trades /var/lib/zel-research/data-b-1m-v2/trades.jsonl.gz \
              --source-root /opt/zel/forward-expansion-v1/source \
              --stdout" > out/gate.json
          rc=$?
          set -e
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'"
          test "$rc" -eq 0
          python -m json.tool out/gate.json >/dev/null

      - name: Verify safety and exact parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/gate.json'))
          assert row['state']=='PASS_GRID_NEUTRAL_ENTRY_FORK_GATE_READY',row
          assert row['tmp_fork_allowed'] is True,row
          assert all(row['checks'].values()),row
          assert row['existing_ledger_regime_causal'] is False,row
          assert row['entry_time_reconstruction_required'] is True,row
          assert row['process_arguments_published'] is False,row
          assert row['credentials_published'] is False,row
          assert row['canonical_mutated'] is False,row
          assert row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['execution_authority']=='NONE',row
          assert row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({'state':row['state'],'checks':row['checks'],'next':row['next']})
          PY

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-grid-neutral-entry-fork-gate-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
