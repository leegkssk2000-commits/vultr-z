name: ZEL Grid Neutral Entry Fork Gate V2

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_grid_neutral_entry_fork_gate_v1.json
      - backend/tools/zel_grid_neutral_entry_fork_gate_v1.py
      - .github/workflows/zel-grid-neutral-entry-fork-gate-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-grid-neutral-entry-fork-gate-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate gate and pinned semantic receipt
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_grid_neutral_entry_fork_gate_v1.py
          python backend/tools/zel_grid_neutral_entry_fork_gate_v1.py --self-test
          python -m json.tool backend/research/zel_grid_neutral_entry_fork_gate_v1.json >/dev/null
          policy_path=backend/research/zel_grid_neutral_entry_fork_gate_v1.json
          semantic_path=$(python -c "import json; print(json.load(open('$policy_path'))['semantic_summary_path'])")
          expected_blob=$(python -c "import json; print(json.load(open('$policy_path'))['semantic_summary_blob_sha'])")
          actual_blob=$(git -C results rev-parse "HEAD:$semantic_path")
          test "$actual_blob" = "$expected_blob"
          mkdir -p out
          python backend/tools/zel_grid_neutral_entry_fork_gate_v1.py \
            --policy "$policy_path" \
            --semantic-summary "results/$semantic_path" \
            --source-root . \
            --out out/gate.json
      - name: Verify fail-closed fork decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/gate.json'))
          assert row['state']=='PASS_GRID_NEUTRAL_ENTRY_FORK_BLOCKED',row
          assert all(row['checks'].values()),row
          assert row['economic_gate_pass'] is False,row
          assert row['fork_blocked'] is True,row
          assert row['tmp_fork_allowed'] is False,row
          assert row['existing_ledger_regime_causal'] is False,row
          assert row['entry_time_reconstruction_complete'] is True,row
          assert row['canonical_mutated'] is False,row
          assert row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['selection_authority'] is False,row
          assert row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE',row
          assert row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({'state':row['state'],'entry_range':row['entry_range_metrics'],'tmp_fork_allowed':row['tmp_fork_allowed'],'next':row['next']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-grid-neutral-entry-fork-gate-v2-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
