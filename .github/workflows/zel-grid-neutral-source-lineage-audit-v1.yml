name: ZEL Grid Neutral Source Lineage Audit V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_grid_neutral_source_lineage_audit_v1.py
      - backend/tools/zel_grid_source_authority_disambiguation_v1.py
      - backend/tools/zel_grid_neutral_causal_subset_proof_v1.py
      - backend/tools/zel_grid_neutral_lineage_gemini_review_v1.py
      - backend/research/zel_grid_neutral_source_lineage_audit_v1.json
      - .github/workflows/zel-grid-neutral-source-lineage-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-grid-neutral-source-lineage-audit-v1
  cancel-in-progress: true

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_grid_neutral_source_lineage_audit_v1.py \
            backend/tools/zel_grid_source_authority_disambiguation_v1.py \
            backend/tools/zel_grid_neutral_causal_subset_proof_v1.py \
            backend/tools/zel_grid_neutral_lineage_gemini_review_v1.py \
            backend/tools/zel_strategy_loss_attribution_gemini_v1.py
          python -m json.tool backend/research/zel_grid_neutral_source_lineage_audit_v1.json >/dev/null

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out input
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run runtime lineage audit read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          set +e
          timeout 300s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --runtime-root /home/z/z --terminal-root /var/lib/zel-research/data-b-1m-v2 --stdout' \
            < backend/tools/zel_grid_neutral_source_lineage_audit_v1.py \
            > out/audit_raw.json
          audit_rc=$?
          set -e
          test "$audit_rc" -eq 0 -o "$audit_rc" -eq 1
          test -s out/audit_raw.json
          python -m json.tool out/audit_raw.json >/dev/null
          printf '%s\n' "$audit_rc" > out/audit_rc.txt

      - name: Resolve logical source authority read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          set +e
          timeout 180s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --runtime-root /home/z/z --terminal-root /var/lib/zel-research/data-b-1m-v2 --stdout' \
            < backend/tools/zel_grid_source_authority_disambiguation_v1.py \
            > out/source_authority.json
          authority_rc=$?
          set -e
          test "$authority_rc" -eq 0 -o "$authority_rc" -eq 1
          test -s out/source_authority.json
          python -m json.tool out/source_authority.json >/dev/null
          printf '%s\n' "$authority_rc" > out/source_authority_rc.txt

      - name: Fetch immutable terminal trades for aggregate proof
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          timeout 180s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'cat /var/lib/zel-research/data-b-1m-v2/trades.jsonl.gz' \
            > input/trades.jsonl.gz
          test -s input/trades.jsonl.gz
          python - <<'PY'
          import gzip
          with gzip.open('input/trades.jsonl.gz','rt',encoding='utf-8') as handle:
              count=sum(1 for line in handle if line.strip())
          assert count==1951,count
          print({'trades':count})
          PY

      - name: Prove exact event subset and causal timestamp
        run: |
          set -euo pipefail
          python backend/tools/zel_grid_neutral_causal_subset_proof_v1.py \
            --trades input/trades.jsonl.gz \
            --out out/causal_subset_proof.json
          python - <<'PY'
          import json
          row=json.load(open('out/causal_subset_proof.json'))
          assert row['grid_trade_count']==580,row
          assert row['neutral_trade_count']==248,row
          assert row['neutral_window_counts']=={'1m_w1':133,'1m_w2':66,'1m_w3':49},row
          assert row['raw_event_ids_published'] is False and row['raw_trade_rows_published'] is False,row
          assert row['canonical_mutated'] is False and row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['shadow_started'] is False and row['paper_started'] is False and row['live_enabled'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({
              'state':row['state'],
              'event_subset_pass':row['event_subset_pass'],
              'causal_timestamp_pass':row['causal_timestamp_pass'],
              'selected':row['selected_regime_timestamp_candidate'],
              'blockers':row['blockers'],
          })
          PY

      - name: Adjudicate duplicate copies against terminal source root
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json

          def stable_sha(value):
              encoded=json.dumps(value,sort_keys=True,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode()
              return hashlib.sha256(encoded).hexdigest()

          audit=json.load(open('out/audit_raw.json'))
          authority=json.load(open('out/source_authority.json'))
          proof=json.load(open('out/causal_subset_proof.json'))
          physical=list(audit.get('strategy_sources') or [])
          audit['strategy_source_physical_copy_count']=len(physical)
          audit['strategy_source_copies']=physical
          audit['source_authority']=authority
          audit['causal_subset_proof']=proof
          blockers=list(audit.get('blockers') or [])

          if authority.get('state')=='PASS_GRID_LOGICAL_SOURCE_AUTHORITY_UNIQUE':
              blockers=[value for value in blockers if value!='GRID_STRATEGY_SOURCE_NOT_UNIQUE']
              chain=authority['authority_chain']
              audit['strategy_source_count']=1
              audit['strategy_sources']=[{
                  'path':f"logical_authority:{chain['canonical_path']}=>{chain['terminal_replay_path']}",
                  'sha256':chain['source_sha256'],
                  'roles':chain['roles'],
              }]
          else:
              if 'GRID_LOGICAL_SOURCE_AUTHORITY_UNRESOLVED' not in blockers:
                  blockers.append('GRID_LOGICAL_SOURCE_AUTHORITY_UNRESOLVED')

          audit['blockers']=blockers
          audit['source_level_replay_allowed']=not blockers
          audit['state']='PASS_GRID_NEUTRAL_SOURCE_LINEAGE_READY_FOR_STAGED_REPLAY' if not blockers else 'HOLD_GRID_NEUTRAL_SOURCE_LINEAGE_INCOMPLETE'
          audit['next']='STAGE_GRID_NEUTRAL_FORK_IN_TMP_AND_RUN_EXACT_SOURCE_REPLAY' if not blockers else 'RESOLVE_SINGLE_LINEAGE_BLOCKER_BEFORE_REPLAY'
          audit.pop('receipt_sha256',None)
          audit['receipt_sha256']=stable_sha(audit)
          json.dump(audit,open('out/audit.json','w'),indent=2,sort_keys=True,allow_nan=False)
          print({
              'state':audit['state'],
              'logical_sources':audit['strategy_source_count'],
              'physical_copies':audit['strategy_source_physical_copy_count'],
              'authority_state':authority['state'],
              'proof_state':proof['state'],
              'blockers':audit['blockers'],
          })
          PY

      - name: Verify immutable audit and ledger parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          audit=json.load(open('out/audit.json'))
          authority=json.load(open('out/source_authority.json'))
          policy=json.load(open('backend/research/zel_grid_neutral_source_lineage_audit_v1.json'))
          ledger=audit['trade_ledger']
          assert audit['strategy_id']==policy['strategy_id'],audit
          assert ledger['trade_count']==policy['expected_trade_count'],ledger
          assert ledger['neutral_trade_count']==policy['expected_neutral_trade_count'],ledger
          for window, expected in policy['expected_window_neutral_trade_counts'].items():
              actual=ledger['window_regime_counts'].get(f'{window}|neutral')
              assert actual==expected,(window,actual,expected)
          assert ledger['raw_rows_published'] is False,ledger
          assert authority['raw_code_published'] is False and authority['raw_trade_rows_published'] is False,authority
          assert audit['canonical_mutated'] is False and audit['runtime_mutated'] is False,audit
          assert audit['formal_ledger_mutated'] is False,audit
          assert audit['selection_authority'] is False and audit['promotion_authority'] is False,audit
          assert audit['execution_authority']=='NONE' and audit['order_authority']=='BLOCKED',audit
          assert audit['action']=='hold',audit
          print({
              'state':audit['state'],
              'logical_sources':audit['strategy_source_count'],
              'physical_copies':audit['strategy_source_physical_copy_count'],
              'authority_state':authority['state'],
              'proof_state':audit['causal_subset_proof']['state'],
              'registry_refs':audit['registry_reference_count'],
              'replay_refs':audit['replay_reference_count'],
              'regime_candidates':audit['regime_candidate_count'],
              'blockers':audit['blockers'],
          })
          PY

      - name: Gemini causal review and independent red-team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python backend/tools/zel_grid_neutral_lineage_gemini_review_v1.py \
            --audit out/audit.json \
            --policy backend/research/zel_grid_neutral_source_lineage_audit_v1.json \
            --out out/gemini_review.json

      - name: Verify Gemini boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/gemini_review.json'))
          assert row['gemini_call_count']==2,row
          assert row['raw_code_sent'] is False and row['raw_trades_sent'] is False,row
          assert row['credentials_sent'] is False,row
          assert row['canonical_mutated'] is False and row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['shadow_started'] is False and row['paper_started'] is False and row['live_enabled'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({
              'state':row['state'],
              'models':row['models_used'],
              'tmp_fork_stage_allowed':row['tmp_fork_stage_allowed'],
              'decision':row['red_team'].get('decision'),
          })
          PY

      - name: Publish redacted lineage receipts
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/grid_neutral_source_lineage_audit_v1
          rm -rf "$dest/latest"
          mkdir -p "$dest/latest"
          cp out/audit.json "$dest/latest/audit.json"
          cp out/source_authority.json "$dest/latest/source_authority.json"
          cp out/causal_subset_proof.json "$dest/latest/causal_subset_proof.json"
          cp out/gemini_review.json "$dest/latest/gemini_review.json"
          python - <<'PY'
          import json
          audit=json.load(open('out/audit.json'))
          authority=json.load(open('out/source_authority.json'))
          proof=json.load(open('out/causal_subset_proof.json'))
          review=json.load(open('out/gemini_review.json'))
          summary={
              'schema_version':'zel.grid_neutral.source_lineage.summary.v1',
              'state':review['state'],
              'audit_state':audit['state'],
              'source_authority_state':authority['state'],
              'causal_subset_state':proof['state'],
              'event_subset_pass':proof['event_subset_pass'],
              'causal_timestamp_pass':proof['causal_timestamp_pass'],
              'blockers':audit['blockers'],
              'causal_subset_blockers':proof['blockers'],
              'tmp_fork_stage_allowed':review['tmp_fork_stage_allowed'],
              'strategy_source_count':audit['strategy_source_count'],
              'strategy_source_physical_copy_count':audit['strategy_source_physical_copy_count'],
              'registry_reference_count':audit['registry_reference_count'],
              'replay_reference_count':audit['replay_reference_count'],
              'regime_candidate_count':audit['regime_candidate_count'],
              'neutral_trade_count':audit['trade_ledger']['neutral_trade_count'],
              'gemini_models':review['models_used'],
              'canonical_mutated':False,
              'runtime_mutated':False,
              'formal_ledger_mutated':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'action':'hold',
              'next':review['next'],
          }
          json.dump(summary,open('out/summary.json','w'),indent=2,sort_keys=True)
          PY
          cp out/summary.json "$dest/latest/summary.json"
          cp out/summary.json "$dest/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/grid_neutral_source_lineage_audit_v1
          git commit -m "result(zel): grid neutral source lineage ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Cleanup temporary evidence and SSH key
        if: always()
        run: |
          rm -rf input
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-grid-neutral-source-lineage-audit-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
