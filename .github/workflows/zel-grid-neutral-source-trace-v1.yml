name: ZEL Grid Neutral Source Trace V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_grid_neutral_source_trace_v1.py
      - .github/workflows/zel-grid-neutral-source-trace-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-grid-neutral-source-trace-v1
  cancel-in-progress: true

jobs:
  trace:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: python -m py_compile backend/tools/zel_grid_neutral_source_trace_v1.py
      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run source trace read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          set +e
          timeout 300s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'python3 - --runtime-root /home/z/z --terminal-root /var/lib/zel-research/data-b-1m-v2 --stdout' \
            < backend/tools/zel_grid_neutral_source_trace_v1.py \
            > out/source_trace.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 1
          test -s out/source_trace.json
          python -m json.tool out/source_trace.json >/dev/null
          printf '%s\n' "$rc" > out/trace_rc.txt
      - name: Verify safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/source_trace.json'))
          assert row['raw_code_published'] is False,row
          assert row['canonical_mutated'] is False,row
          assert row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['selection_authority'] is False,row
          assert row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE',row
          assert row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          print({'state':row['state'],'files':row['file_count'],'functions':row['relevant_function_count']})
          PY
      - name: Cleanup SSH key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-grid-neutral-source-trace-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
