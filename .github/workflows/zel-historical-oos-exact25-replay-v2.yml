name: ZEL Historical OOS Exact25 Replay V2

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_historical_oos_exact25_replay_v1.py
      - .github/workflows/zel-historical-oos-exact25-replay-v2.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_historical_oos_exact25_replay_v1.py
      - .github/workflows/zel-historical-oos-exact25-replay-v2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-historical-oos-exact25-replay-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-historical-oos-data-v1
          path: historical-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Validate replay and Data B authority
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_historical_oos_exact25_replay_v1.py
          python backend/tools/zel_historical_oos_exact25_replay_v1.py --self-test
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('historical-data/zel_historical_oos_v1')
          d=json.loads((root/'manifest.json').read_text())
          assert d['state']=='PASS_HISTORICAL_OOS_DATA_READY',d
          assert d['total_market_rows']==302400,d
          assert d['window_count']==6,d
          assert d['forward_overlap_count']==0,d
          assert d['final_holdout_accessed'] is False,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE',d
          assert d['order_authority']=='BLOCKED',d
          for row in d['files']:
              p=root/row['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],p
          PY

  replay_15m:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INTERVAL: 15m
      REMOTE_OUT: /tmp/zel_historical_oos_exact25_replay_v1_15m
      REMOTE_DATA: /opt/zel/historical-oos-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zel-historical-oos-data-v1
          path: historical-data
          persist-credentials: false

      - name: Package immutable Data B
        run: |
          set -euo pipefail
          tar -C historical-data -czf /tmp/zel_historical_oos_v1.tar.gz zel_historical_oos_v1
          sha256sum /tmp/zel_historical_oos_v1.tar.gz > /tmp/zel_historical_oos_v1.tar.gz.sha256

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload replay engine and Data B
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            backend/tools/zel_historical_oos_exact25_replay_v1.py \
            /tmp/zel_historical_oos_v1.tar.gz \
            /tmp/zel_historical_oos_v1.tar.gz.sha256 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Atomically install Data B and execute exact 15m replay
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail; \
             cd /tmp; sha256sum -c zel_historical_oos_v1.tar.gz.sha256; \
             staging='${REMOTE_DATA}.staging.${GITHUB_RUN_ID}'; \
             backup='${REMOTE_DATA}.rollback.${GITHUB_RUN_ID}'; \
             rm -rf \"\$staging\"; mkdir -p \"\$staging\"; \
             tar -xzf /tmp/zel_historical_oos_v1.tar.gz -C \"\$staging\" --strip-components=1; \
             /home/z/z/.venv/bin/python -c \"import json;from pathlib import Path;d=json.loads(Path('\\\"\$staging\\\"/manifest.json').read_text());assert d['state']=='PASS_HISTORICAL_OOS_DATA_READY';assert d['total_market_rows']==302400;assert d['forward_overlap_count']==0;assert d['promotion_authority'] is False\"; \
             if [ -d '${REMOTE_DATA}' ]; then rm -rf \"\$backup\"; mv '${REMOTE_DATA}' \"\$backup\"; fi; \
             mv \"\$staging\" '${REMOTE_DATA}'; \
             rm -rf '${REMOTE_OUT}'; mkdir -p '${REMOTE_OUT}'; \
             /home/z/z/.venv/bin/python /tmp/zel_historical_oos_exact25_replay_v1.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --data-root '${REMOTE_DATA}' \
               --interval '${INTERVAL}' \
               --output-dir '${REMOTE_OUT}' \
               --workers 4; \
             tar -C '${REMOTE_OUT}' -czf /tmp/zel_historical_oos_exact25_replay_v1_15m.tar.gz ."

      - name: Fetch 15m result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p result/15m
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_historical_oos_exact25_replay_v1_15m.tar.gz" \
            /tmp/15m.tar.gz
          tar -C result/15m -xzf /tmp/15m.tar.gz

      - name: Assert 15m terminal contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/15m/report.json').read_text())
          assert d['state']=='PASS',d
          assert d['interval']=='15m',d
          assert d['data']['symbol_count']==5,d
          assert d['data']['window_count']==3,d
          assert d['data']['file_count']==15,d
          assert d['source']['strategy_count']==25,d
          assert d['source']['strategy_tree_unchanged'] is True,d
          assert d['source']['producer_unchanged'] is True,d
          assert d['source']['manifest_unchanged'] is True,d
          assert d['canonical_runtime']['producer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['writer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['formal_ledger']['prefix_unchanged'] is True,d
          assert d['replay']['strategy_count_completed']==25,d
          assert d['replay']['strategy_failure_count']==0,d
          assert d['research_only'] is True,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE',d
          assert d['order_authority']=='BLOCKED',d
          PY

      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results-branch
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish 15m result
        run: |
          set -euo pipefail
          base=results-branch/runtime_results/zel/historical_oos_exact25_replay_v1/15m
          mkdir -p "$base"
          cp result/15m/report.json "$base/latest.json"
          cp result/15m/summary.json "$base/summary_latest.json"
          cp result/15m/scoreboard.csv "$base/scoreboard_latest.csv"
          cp result/15m/report.json "$base/run_${GITHUB_RUN_ID}.json"
          cd results-branch
          git config user.name 'zel-historical-replay-bot'
          git config user.email 'zel-historical-replay-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          git add runtime_results/zel/historical_oos_exact25_replay_v1/15m
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "result(zel): Historical OOS Exact25 15m V2 ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-historical-oos-exact25-replay-15m-v2-${{ github.run_id }}
          path: result/15m
          if-no-files-found: error
          retention-days: 30

  replay_1m:
    if: github.event_name != 'pull_request'
    needs: replay_15m
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INTERVAL: 1m
      REMOTE_OUT: /tmp/zel_historical_oos_exact25_replay_v1_1m
      REMOTE_DATA: /opt/zel/historical-oos-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload replay engine
        run: |
          scp -i ~/.ssh/vps_key \
            backend/tools/zel_historical_oos_exact25_replay_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Verify installed Data B and execute exact 1m replay
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail; \
             /home/z/z/.venv/bin/python -c \"import json;from pathlib import Path;d=json.loads(Path('${REMOTE_DATA}/manifest.json').read_text());assert d['state']=='PASS_HISTORICAL_OOS_DATA_READY';assert d['total_market_rows']==302400;assert d['forward_overlap_count']==0;assert d['promotion_authority'] is False\"; \
             rm -rf '${REMOTE_OUT}'; mkdir -p '${REMOTE_OUT}'; \
             /home/z/z/.venv/bin/python /tmp/zel_historical_oos_exact25_replay_v1.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --data-root '${REMOTE_DATA}' \
               --interval '${INTERVAL}' \
               --output-dir '${REMOTE_OUT}' \
               --workers 4; \
             tar -C '${REMOTE_OUT}' -czf /tmp/zel_historical_oos_exact25_replay_v1_1m.tar.gz ."

      - name: Fetch 1m result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p result/1m
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_historical_oos_exact25_replay_v1_1m.tar.gz" \
            /tmp/1m.tar.gz
          tar -C result/1m -xzf /tmp/1m.tar.gz

      - name: Assert 1m terminal contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/1m/report.json').read_text())
          assert d['state']=='PASS',d
          assert d['interval']=='1m',d
          assert d['data']['symbol_count']==5,d
          assert d['data']['window_count']==3,d
          assert d['data']['file_count']==15,d
          assert d['source']['strategy_count']==25,d
          assert d['source']['strategy_tree_unchanged'] is True,d
          assert d['source']['producer_unchanged'] is True,d
          assert d['source']['manifest_unchanged'] is True,d
          assert d['canonical_runtime']['producer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['writer_pid_unchanged'] is True,d
          assert d['canonical_runtime']['formal_ledger']['prefix_unchanged'] is True,d
          assert d['replay']['strategy_count_completed']==25,d
          assert d['replay']['strategy_failure_count']==0,d
          assert d['research_only'] is True,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE',d
          assert d['order_authority']=='BLOCKED',d
          PY

      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results-branch
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish 1m and combined result
        run: |
          set -euo pipefail
          root=results-branch/runtime_results/zel/historical_oos_exact25_replay_v1
          base="$root/1m"
          mkdir -p "$base"
          cp result/1m/report.json "$base/latest.json"
          cp result/1m/summary.json "$base/summary_latest.json"
          cp result/1m/scoreboard.csv "$base/scoreboard_latest.csv"
          cp result/1m/report.json "$base/run_${GITHUB_RUN_ID}.json"
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('results-branch/runtime_results/zel/historical_oos_exact25_replay_v1')
          a=json.loads((root/'15m/latest.json').read_text())
          b=json.loads(Path('result/1m/report.json').read_text())
          passed=a['state']=='PASS' and b['state']=='PASS'
          d={
            'schema_version':'zel.historical_oos_exact25_replay.combined.v1',
            'state':'PASS' if passed else 'HOLD',
            'verdict':'HISTORICAL_OOS_EXACT25_MULTI_TIMEFRAME_COMPLETE' if passed else 'HISTORICAL_OOS_EXACT25_MULTI_TIMEFRAME_HOLD',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'intervals':{
              '15m':{'closed_trade_count':a['replay']['closed_trade_count'],'strategy_call_count':a['replay']['strategy_call_count'],'error_count':a['replay']['error_count'],'claim_tier_counts':a['replay']['claim_tier_counts'],'failure_fingerprint_counts':a['replay']['failure_fingerprint_counts']},
              '1m':{'closed_trade_count':b['replay']['closed_trade_count'],'strategy_call_count':b['replay']['strategy_call_count'],'error_count':b['replay']['error_count'],'claim_tier_counts':b['replay']['claim_tier_counts'],'failure_fingerprint_counts':b['replay']['failure_fingerprint_counts']},
            },
            'total_closed_trade_count':a['replay']['closed_trade_count']+b['replay']['closed_trade_count'],
            'total_strategy_call_count':a['replay']['strategy_call_count']+b['replay']['strategy_call_count'],
            'research_only':True,'selection_authority':False,'promotion_authority':False,
            'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold',
          }
          (root/'combined_latest.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cd results-branch
          git config user.name 'zel-historical-replay-bot'
          git config user.email 'zel-historical-replay-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          git add runtime_results/zel/historical_oos_exact25_replay_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "result(zel): Historical OOS Exact25 1m V2 ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-historical-oos-exact25-replay-1m-v2-${{ github.run_id }}
          path: result/1m
          if-no-files-found: error
          retention-days: 30
