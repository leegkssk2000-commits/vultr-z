name: ZEL Historical OOS Exact25 Replay V3

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_historical_oos_exact25_replay_v1.py
      - tools/deploy_zel_historical_oos_data_v1.sh
      - .github/workflows/zel-historical-oos-exact25-replay-v3.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_historical_oos_exact25_replay_v1.py
      - tools/deploy_zel_historical_oos_data_v1.sh
      - .github/workflows/zel-historical-oos-exact25-replay-v3.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: zel-historical-oos-exact25-replay-v3-redirect
  cancel-in-progress: false

jobs:
  validate-and-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Validate engine only
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_historical_oos_exact25_replay_v1.py
          python backend/tools/zel_historical_oos_exact25_replay_v1.py --self-test
      - name: Route execution to canonical single-owner workflow
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/zel-data-b-1m-single-owner-repair-v1.yml/dispatches" \
            -f ref=master
      - name: Record ownership boundary
        run: |
          echo 'Direct 15m/1m replay disabled in V3.'
          echo 'Canonical execution owner: ZEL Data B 1m Single Owner Repair V1.'
          echo 'execution=NONE order=BLOCKED action=hold'
