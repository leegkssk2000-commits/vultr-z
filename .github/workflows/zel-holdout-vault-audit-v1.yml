name: ZEL Holdout Vault Audit V1

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_holdout_runtime_config_v1.json
      - backend/tools/zel_holdout_vault_audit_v1.py
      - backend/tools/zel_holdout_vault_v1.py
      - .github/workflows/zel-holdout-vault-audit-v1.yml
  push:
    branches: [master]
    paths:
      - backend/research/zel_holdout_runtime_config_v1.json
      - backend/tools/zel_holdout_vault_audit_v1.py
      - backend/tools/zel_holdout_vault_v1.py
      - .github/workflows/zel-holdout-vault-audit-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-holdout-vault-audit-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate read-only audit and runtime config
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_holdout_vault_audit_v1.py \
            backend/tools/zel_holdout_vault_v1.py
          python backend/tools/zel_holdout_vault_audit_v1.py --self-test
          python backend/tools/zel_holdout_vault_v1.py --self-test
          python -m json.tool backend/research/zel_holdout_runtime_config_v1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('backend/tools/zel_holdout_vault_audit_v1.py').read_text()
          c=json.loads(Path('backend/research/zel_holdout_runtime_config_v1.json').read_text())
          for token in ('os.chown(', 'unlink(', 'rmtree(', 'open("wb")', "open('wb')"):
              assert token not in t,token
          assert c['schema_version']=='zel.holdout.runtime_config.v1',c
          assert 'holdout_bytes_read": False' in t
          assert 'permissions_mutated": False' in t
          print('PASS_HOLDOUT_VAULT_READ_ONLY_AUDIT_STATIC')
          PY

  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve seven settings from versioned runtime config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          c=json.loads(Path('backend/research/zel_holdout_runtime_config_v1.json').read_text())
          mapping={
            'REPOSITORY_ROOT':'repository_root','W2_ROOT':'w2_root','W3_ROOT':'w3_root',
            'FINAL_ROOT':'final_root','SEAL_ROOT':'seal_root','EVALUATOR_GROUP':'evaluator_group',
            'HMAC_KEY_FILE':'hmac_key_file'
          }
          for env,key in mapping.items():
              value=str(c[key])
              if env.endswith('_ROOT') or env=='HMAC_KEY_FILE':
                  assert re.fullmatch(r'/[A-Za-z0-9._/-]+',value),env
              else:
                  assert re.fullmatch(r'[A-Za-z0-9._-]+',value),env
              with Path(os.environ['GITHUB_ENV']).open('a') as h:
                  h.write(f'{env}={value}\n')
          users=','.join(c.get('proposer_users',[]))
          assert not users or re.fullmatch(r'[A-Za-z0-9._,-]+',users)
          with Path(os.environ['GITHUB_ENV']).open('a') as h:
              h.write(f'PROPOSER_USERS={users}\n')
          roots=[c['w2_root'],c['w3_root'],c['final_root']]
          assert len(set(roots))==3,roots
          repo=c['repository_root'].rstrip('/')+'/'
          assert all(not root.startswith(repo) for root in roots),roots
          PY
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Run VPS read-only vault audit
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key backend/tools/zel_holdout_vault_audit_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_holdout_vault_audit_v1.py"
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail; \
             if [ \"\$(id -u)\" -eq 0 ]; then prefix=(); else prefix=(sudo -n); fi; \
             \"\${prefix[@]}\" test -s '$HMAC_KEY_FILE'; \
             test \"\$(\"\${prefix[@]}\" stat -c '%a' '$HMAC_KEY_FILE')\" = 600; \
             \"\${prefix[@]}\" python3 /tmp/zel_holdout_vault_audit_v1.py \
               --repository-root '$REPOSITORY_ROOT' \
               --w2-root '$W2_ROOT' \
               --w3-root '$W3_ROOT' \
               --final-root '$FINAL_ROOT' \
               --seal-root '$SEAL_ROOT' \
               --evaluator-group '$EVALUATOR_GROUP' \
               --proposer-users '$PROPOSER_USERS' \
               --hmac-configured \
               --out /tmp/zel_holdout_vault_audit_latest.json; \
             \"\${prefix[@]}\" chmod 644 /tmp/zel_holdout_vault_audit_latest.json"
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_holdout_vault_audit_latest.json" \
            out/latest.json
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -f /tmp/zel_holdout_vault_audit_v1.py /tmp/zel_holdout_vault_audit_latest.json || sudo -n rm -f /tmp/zel_holdout_vault_audit_v1.py /tmp/zel_holdout_vault_audit_latest.json' || true
      - name: Verify no mutation authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state'] in ('PASS_HOLDOUT_VAULT_AUDIT_READY_TO_SEAL','HOLD_HOLDOUT_VAULT_AUDIT'),d
          assert d['permissions_mutated'] is False,d
          assert d['manifests_written'] is False,d
          assert d['holdout_bytes_read'] is False,d
          assert d['runtime_mutated'] is False,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          print(json.dumps({'state':d['state'],'error_count':len(d.get('errors',[]))},sort_keys=True))
          PY
      - name: Publish audit receipt only
        run: |
          set -euo pipefail
          git clone --depth=1 --branch zel-data-expansion-results-v1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results
          root=results/runtime_results/zel/holdout_vault_audit_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-holdout-vault-audit-bot'
          git config user.email 'zel-holdout-vault-audit-bot@users.noreply.github.com'
          git add runtime_results/zel/holdout_vault_audit_v1
          git commit -m "result(zel): Holdout vault audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-holdout-vault-audit-v1-${{ github.run_id }}
          path: out/latest.json
          if-no-files-found: error
          retention-days: 90
