name: ZEL Indicator History Patch Once

on:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2]
    paths:
      - .github/workflows/zel-indicator-history-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Apply tested-axis and sealed-authority exclusions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy_path=Path('backend/research/zel_exact25_identity_indicator_policy_v1.json')
          policy=json.loads(policy_path.read_text())
          policy['strategy_axis_history']={
            'alpha_combo':{
              'queue_mode':'DEDICATED_V3_ONLY',
              'tested_axis_ids':['ENTRY_REGIME','TIME_STOP','TRAILING_EXIT_GEOMETRY'],
              'reason':'SEALED_TIME54_TIME60_STOP065_AUTHORITY'
            },
            'ema_ribbon_scalp':{
              'queue_mode':'EXCLUDE_TESTED_AXES',
              'tested_axis_ids':['UTC_SESSION','ENTRY_REGIME','SIDE_ROUTER','TIME_STOP','TRAILING_EXIT_GEOMETRY'],
              'result':'NO_W1_W2_W3_SURVIVOR_CURRENT_EPOCH'
            },
            'grid_rebalance':{
              'queue_mode':'EXCLUDE_TESTED_AXES',
              'tested_axis_ids':['ENTRY_REGIME'],
              'result':'BLOCK_TREND_SHORT_RESEARCH_HOLDBACK'
            }
          }
          policy['queue_rules']['exclude_tested_axes']=True
          policy['queue_rules']['sealed_authority_global_queue_forbidden']=True
          policy['queue_rules']['tested_axis_history_required_before_selection']=True
          policy_path.write_text(json.dumps(policy,indent=2,sort_keys=True)+'\n')

          tool_path=Path('backend/tools/zel_exact25_identity_indicator_audit_v1.py')
          text=tool_path.read_text()
          old='''def compatible_axes(row: Mapping[str, Any], policy: Mapping[str, Any]) -> list[dict[str, Any]]:\n    sample = int(row["metrics"]["trade_count"])\n    axes = [dict(axis) for axis in policy.get("indicator_axes", []) if isinstance(axis, Mapping)]\n    if sample == 0:\n        return []\n    return axes\n'''
          new='''def compatible_axes(row: Mapping[str, Any], policy: Mapping[str, Any]) -> list[dict[str, Any]]:\n    sample = int(row["metrics"]["trade_count"])\n    if sample == 0:\n        return []\n    if row.get("authority_mode") == "SEALED_RESEARCH_AUTHORITY":\n        return []\n    history = (policy.get("strategy_axis_history") or {}).get(str(row.get("strategy_id")), {})\n    tested = set(history.get("tested_axis_ids") or []) if isinstance(history, Mapping) else set()\n    return [\n        dict(axis)\n        for axis in policy.get("indicator_axes", [])\n        if isinstance(axis, Mapping) and str(axis.get("axis_id")) not in tested\n    ]\n'''
          assert old in text
          text=text.replace(old,new,1)
          text=text.replace('assert len(result["experiment_queue"]) == 25','assert len(result["experiment_queue"]) == 24',1)
          tool_path.write_text(text)
          PY
          python -m json.tool backend/research/zel_exact25_identity_indicator_policy_v1.json >/dev/null
          python -m py_compile backend/tools/zel_exact25_identity_indicator_audit_v1.py
          python backend/tools/zel_exact25_identity_indicator_audit_v1.py \
            --policy backend/research/zel_exact25_identity_indicator_policy_v1.json --self-test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/research/zel_exact25_identity_indicator_policy_v1.json backend/tools/zel_exact25_identity_indicator_audit_v1.py
          git diff --cached --check
          git commit -m 'fix(zel): exclude tested and sealed axes from unattended queue'
          git push origin HEAD:${GITHUB_HEAD_REF}
