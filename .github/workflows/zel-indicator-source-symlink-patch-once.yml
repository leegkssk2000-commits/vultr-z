name: ZEL Indicator Source Symlink Patch Once

on:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2]
    paths:
      - .github/workflows/zel-indicator-source-symlink-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Replace full source copy with read-only source symlink
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('backend/tools/zel_exact25_selected_indicator_screen_v1.py')
          text=path.read_text()
          old='''def copy_source(source_root: Path, destination: Path) -> None:\n    def ignore(_: str, names: list[str]) -> set[str]:\n        return {name for name in names if name in {".git", ".venv", "venv", "__pycache__", "node_modules"}}\n    shutil.copytree(source_root, destination, symlinks=True, ignore=ignore)\n'''
          new='''def copy_source(source_root: Path, destination: Path) -> None:\n    # Research wrappers never write into source_root. A temporary directory symlink\n    # preserves exact owner paths without copying runtime/backups/data. Baseline\n    # economic-digest parity and the live source-owner gate remain fail-closed.\n    os.symlink(source_root.resolve(), destination, target_is_directory=True)\n'''
          assert text.count(old)==1,text.count(old)
          path.write_text(text.replace(old,new,1))
          PY
          python -m py_compile backend/tools/zel_exact25_selected_indicator_screen_v1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tools/zel_exact25_selected_indicator_screen_v1.py
          git diff --cached --check
          git commit -m 'perf(zel): avoid full source copy in indicator screen'
          git push origin HEAD:${GITHUB_HEAD_REF}
