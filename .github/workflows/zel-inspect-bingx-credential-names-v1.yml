name: ZEL Inspect BingX Credential Names V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_inspect_bingx_credential_names_v1.py
      - .github/workflows/zel-inspect-bingx-credential-names-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_inspect_bingx_credential_names_v1.py
          grep -q 'secret_values_logged.*False' backend/tools/zel_inspect_bingx_credential_names_v1.py
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect names only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-inspect-bingx-names-${GITHUB_RUN_ID}"
          echo "$remote" > out/remote_path.txt
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes backend/tools/zel_inspect_bingx_credential_names_v1.py "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "/home/z/z/.venv/bin/python '$remote/zel_inspect_bingx_credential_names_v1.py'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/tmp/zel_bingx_credential_name_inventory.json" out/inventory.json
      - name: Verify no values exposed
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/inventory.json'))
          expected=r['receipt_sha256']
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==expected,(actual,expected)
          assert r['secret_values_read'] is False,r
          assert r['secret_values_logged'] is False,r
          assert r['secret_values_artifacted'] is False,r
          print({'candidate_names':r['candidate_names'],'receipt_sha256':expected})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-inspect-bingx-credential-names-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote' /tmp/zel_bingx_credential_name_inventory.json" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
