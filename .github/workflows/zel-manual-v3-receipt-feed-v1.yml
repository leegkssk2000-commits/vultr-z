name: ZEL Manual V3 Receipt Feed V1

on:
  workflow_run:
    workflows: ["ZEL Manual V3 Video Improvement V1"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: zel-manual-v3-receipt-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download terminal artifact when available
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p input
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "zel-manual-v3-video-improvement-$RUN_ID" --dir input || true
      - name: Build receipt comment
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          candidates=list(Path('input').rglob('terminal_receipt.json'))
          if candidates:
              row=json.loads(candidates[0].read_text())
              lines=[
                '<!-- zel-manual-v3:'+str(row.get('request_id'))+':'+os.environ['RUN_ID']+' -->',
                '### ZEL Manual V3 Research Receipt',
                f"- run: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']})",
                f"- workflow conclusion: `{os.environ['CONCLUSION']}`",
                f"- state: `{row.get('state')}`",
                f"- V3: `{row.get('v3_state')}`",
                f"- trades: `{row.get('trade_count')}`",
                f"- videos: `{row.get('video_source_count')}` / observed views `{row.get('observed_view_sum')}`",
                f"- hypotheses: `{row.get('hypothesis_count')}`",
                f"- improvements observed: `{row.get('improvement_observed_count')}`",
                f"- jointly AI-approved improvements: `{row.get('joint_ai_approved_improvement_count')}`",
                f"- strategy/team/skill/ZBot tested: `{row.get('strategy_file_mechanism_tested')}/{row.get('team_bot_mechanism_tested')}/{row.get('skill_mechanism_tested')}/{row.get('zbot_mechanism_tested')}`",
                f"- cleanup critical: `{row.get('cleanup_critical_count')}`",
                f"- authority: execution=`{row.get('execution_authority')}` order=`{row.get('order_authority')}` promotion=`{row.get('promotion_authority')}`",
                f"- receipt: `{row.get('receipt_sha256')}`",
            ]
          else:
              lines=[
                '<!-- zel-manual-v3:failed:'+os.environ['RUN_ID']+' -->',
                '### ZEL Manual V3 Research Receipt',
                f"- run: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']})",
                f"- workflow conclusion: `{os.environ['CONCLUSION']}`",
                '- state: `FAILED_BEFORE_TERMINAL_RECEIPT`',
                '- authority: execution=`NONE` order=`BLOCKED` promotion=`false`',
            ]
          Path('comment.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Publish once to receipt issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/433/comments?per_page=100" --jq ".[] | select(.body | contains(\"$RUN_ID\")) | .id" | head -1)
          if [ -z "$existing" ]; then
            gh issue comment 433 --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
