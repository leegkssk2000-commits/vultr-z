name: ZEL Orchestration Cutover One-Shot V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-data-b-1m-single-owner-repair-v1.yml
      - .github/workflows/zel-exact25-material-upgrade-loop-v1.yml
      - .github/workflows/zel-trade-methods-pre-shadow-audit-v1.yml
      - .github/workflows/zel-alpha-auto-validation-chain-v1.yml
      - .github/workflows/zel-pre-shadow-dag-controller-v1.yml
      - .github/workflows/zel-orchestration-cutover-autofix-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-orchestration-cutover-one-shot-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Apply ordered-trigger cutover
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def remove_legacy_triggers(text: str) -> str:
              header, tail = text.split('\npermissions:', 1)
              marker = '\n  schedule:\n'
              if marker in header:
                  header = header[:header.index(marker)] + '\n'
              return header + '\npermissions:' + tail

          def prerequisite_block(receipt_path: str, expected_state: str, label: str) -> str:
              expression = '$' + '{{ steps.gate.outputs.ready }}'
              return f'''  prerequisite:
              if: github.event_name != 'pull_request'
              needs: validate
              runs-on: ubuntu-latest
              timeout-minutes: 10
              outputs:
                ready: {expression}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: zel-data-expansion-results-v1
                    path: results
                    persist-credentials: false
                - id: gate
                  name: Require {label} receipt
                  run: |
                    set -euo pipefail
                    python - <<'PY2'
                    import json
                    from pathlib import Path
                    p=Path({receipt_path!r})
                    ready=False
                    if p.is_file():
                        d=json.loads(p.read_text())
                        ready=(
                            d.get('state')=={expected_state!r}
                            and d.get('promotion_authority') is False
                            and d.get('execution_authority')=='NONE'
                            and d.get('order_authority')=='BLOCKED'
                        )
                    Path('/tmp/ready').write_text('true' if ready else 'false')
                    print({{'receipt':str(p),'ready':ready}})
                    PY2
                    echo "ready=$(cat /tmp/ready)" >> "$GITHUB_OUTPUT"
          '''

          single=Path('.github/workflows/zel-data-b-1m-single-owner-repair-v1.yml')
          text=single.read_text()
          if 'Dispatch receipt-driven DAG controller only' not in text:
              start=text.index('      - name: Dispatch ordered research lanes\n')
              end=text.index('      - uses: actions/upload-artifact@v4\n',start)
              replacement='''      - name: Dispatch receipt-driven DAG controller only
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    set -euo pipefail
                    gh workflow run zel-pre-shadow-dag-controller-v1.yml --ref master
          '''.replace('                  env','        env').replace('                    GH','          GH').replace('                  run','        run').replace('                    set','          set').replace('                    gh','          gh')
              text=text[:start]+replacement+text[end:]
              single.write_text(text)

          specs=[
              (
                  Path('.github/workflows/zel-exact25-material-upgrade-loop-v1.yml'),
                  'direct',
                  'results/runtime_results/zel/data_b_risk_adapter_ablation_v1/latest.json',
                  'PASS_DATA_B_RISK_ADAPTER_ABLATION',
                  'Risk main-effect',
              ),
              (
                  Path('.github/workflows/zel-trade-methods-pre-shadow-audit-v1.yml'),
                  'audit',
                  'results/runtime_results/zel/exact25_material_upgrade_v1/latest.json',
                  'PASS_EXACT25_MATERIAL_DIAGNOSIS_AND_QUEUE',
                  'Exact25 repair',
              ),
              (
                  Path('.github/workflows/zel-alpha-auto-validation-chain-v1.yml'),
                  'orchestrate',
                  'results/runtime_results/zel/strategy_top3_bundles_v1/latest.json',
                  'PASS_STRATEGY_TOP3_BUNDLES_COMPLETE',
                  'strategy Top3 bundle',
              ),
          ]
          for path, job, receipt, expected, label in specs:
              text=remove_legacy_triggers(path.read_text())
              if '\n  prerequisite:\n' not in text:
                  marker=f'\n  {job}:\n'
                  assert marker in text,(path,job)
                  text=text.replace(marker,'\n'+prerequisite_block(receipt,expected,label)+marker,1)
              old=f"  {job}:\n    if: github.event_name != 'pull_request'\n    needs: validate\n"
              new=f"  {job}:\n    if: github.event_name != 'pull_request' && needs.prerequisite.outputs.ready == 'true'\n    needs: [validate, prerequisite]\n"
              if old in text:
                  text=text.replace(old,new,1)
              assert new in text,(path,job)
              if job=='orchestrate':
                  start=text.find("          active=$(gh run list --workflow zel-historical-oos-1m-resume-v1.yml")
                  if start >= 0:
                      end=text.index("          python - <<'PY'",start)
                      text=text[:start]+"          echo 'WAIT_DATA_B_WITHOUT_REDISPATCH'\n"+text[end:]
              path.write_text(text)
          PY
      - name: Validate cutover policy and YAML
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths={
            'single':Path('.github/workflows/zel-data-b-1m-single-owner-repair-v1.yml'),
            'exact':Path('.github/workflows/zel-exact25-material-upgrade-loop-v1.yml'),
            'methods':Path('.github/workflows/zel-trade-methods-pre-shadow-audit-v1.yml'),
            'alpha':Path('.github/workflows/zel-alpha-auto-validation-chain-v1.yml'),
            'controller':Path('.github/workflows/zel-pre-shadow-dag-controller-v1.yml'),
          }
          data={key:path.read_text() for key,path in paths.items()}
          for key,path in paths.items():
              parsed=yaml.safe_load(path.read_text())
              assert isinstance(parsed,dict),(key,parsed)
          assert 'Dispatch receipt-driven DAG controller only' in data['single']
          assert 'for workflow in zel-data-b-risk' not in data['single']
          for key in ('exact','methods','alpha'):
              header=data[key].split('\npermissions:',1)[0]
              assert 'schedule:' not in header,(key,header)
              assert 'workflow_run:' not in header,(key,header)
              assert '\n  prerequisite:\n' in data[key],key
          assert 'PASS_DATA_B_RISK_ADAPTER_ABLATION' in data['exact']
          assert 'PASS_EXACT25_MATERIAL_DIAGNOSIS_AND_QUEUE' in data['methods']
          assert 'PASS_STRATEGY_TOP3_BUNDLES_COMPLETE' in data['alpha']
          assert 'gh workflow run zel-historical-oos-1m-resume-v1.yml' not in data['alpha']
          assert 'ONE_ORDERED_STAGE_AT_A_TIME' in data['controller']
          assert 'Dispatch exactly one eligible implemented stage' in data['controller']
          print('PASS_ORDERED_ORCHESTRATION_CUTOVER')
          PY
      - name: Commit patched workflows
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'zel-orchestration-cutover-bot'
          git config user.email 'zel-orchestration-cutover-bot@users.noreply.github.com'
          git add \
            .github/workflows/zel-data-b-1m-single-owner-repair-v1.yml \
            .github/workflows/zel-exact25-material-upgrade-loop-v1.yml \
            .github/workflows/zel-trade-methods-pre-shadow-audit-v1.yml \
            .github/workflows/zel-alpha-auto-validation-chain-v1.yml
          git commit -m 'fix(zel): enforce receipt-ordered pre-Shadow orchestration'
          git push origin HEAD:${{ github.head_ref }}
