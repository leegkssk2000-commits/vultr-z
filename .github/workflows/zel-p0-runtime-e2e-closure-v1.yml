name: ZEL P0 Runtime E2E Closure V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_p0_runtime_e2e_closure_v1.py
      - backend/tools/zel_historical_oos_exact25_replay_v2.py
      - backend/tools/zel_pre_shadow_receipt_dag_v1.py
      - backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py
      - backend/tools/zel_bingx_execution_calibration_adapter_v1.py
      - backend/tools/zel_component_counterfactual_attribution_v1.py
      - .github/workflows/zel-p0-runtime-e2e-closure-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_p0_runtime_e2e_closure_v1.py
      - backend/tools/zel_historical_oos_exact25_replay_v2.py
      - backend/tools/zel_pre_shadow_receipt_dag_v1.py
      - backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py
      - backend/tools/zel_bingx_execution_calibration_adapter_v1.py
      - backend/tools/zel_component_counterfactual_attribution_v1.py
      - .github/workflows/zel-p0-runtime-e2e-closure-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-p0-runtime-e2e-closure-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile P0 runtime E2E closure
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_p0_runtime_e2e_closure_v1.py \
            backend/tools/zel_historical_oos_exact25_replay_v2.py \
            backend/tools/zel_pre_shadow_receipt_dag_v1.py \
            backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py \
            backend/tools/zel_bingx_execution_calibration_adapter_v1.py \
            backend/tools/zel_component_counterfactual_attribution_v1.py
      - name: Run actual isolated file-I/O and receipt-chain E2E
        run: |
          set -euo pipefail
          mkdir -p out
          python backend/tools/zel_p0_runtime_e2e_closure_v1.py \
            --out-dir out/evidence \
            --receipt out/latest.json
      - name: Verify closure authority and all E2E axes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state']=='PASS_P0_RUNTIME_E2E_CLOSURE',d
          assert d['scope']=='ISOLATED_FILE_IO_AND_RECEIPT_CHAIN',d
          assert d['production_data_b_1m_terminal_claimed'] is False,d
          c=d['checks']
          assert c['checkpoint_roundtrip'] is True,c
          assert c['stale_fingerprint_rejected'] is True,c
          assert c['invalid_checkpoint_quarantine'] is True,c
          assert c['atomic_terminal_file_count']==7,c
          assert c['artifact_manifest_terminal_complete'] is True,c
          assert c['bingx_calibration_state']=='PASS_BINGX_EXECUTION_CALIBRATION_EVIDENCE',c
          assert c['component_attribution_state']=='PASS_COMPONENT_COUNTERFACTUAL_ATTRIBUTION',c
          assert c['component_pair_count']==8,c
          assert c['alpha_registration_state']=='PASS_ALPHA_LAP_CHALLENGERS_REGISTERED',c
          assert c['alpha_paired_state']=='PASS_ALPHA_LAP_PAIRED_COMPARISON',c
          assert c['dag_state']=='PASS_PRE_SHADOW_DAG_COMPLETE',c
          assert c['dag_passed_stage_count']==13,c
          s=d['safety']
          assert s['canonical_strategy_mutated'] is False,s
          assert s['formal_ledger_mutated'] is False,s
          assert s['runtime_registry_written'] is False,s
          assert s['shadow_started'] is False,s
          assert s['paper_started'] is False,s
          assert s['live_enabled'] is False,s
          assert s['selection_authority'] is False,s
          assert s['promotion_authority'] is False,s
          assert s['execution_authority']=='NONE',s
          assert s['order_authority']=='BLOCKED',s
          assert s['action']=='hold',s
          print(json.dumps({'state':d['state'],'checks':c},sort_keys=True))
          PY
      - name: Publish immutable P0 E2E receipt
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch zel-data-expansion-results-v1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results
          root=results/runtime_results/zel/p0_runtime_e2e_closure_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-p0-e2e-bot'
          git config user.email 'zel-p0-e2e-bot@users.noreply.github.com'
          git add runtime_results/zel/p0_runtime_e2e_closure_v1
          git commit -m "result(zel): P0 runtime E2E closure ${GITHUB_RUN_ID}"
          git push origin HEAD:zel-data-expansion-results-v1
      - uses: actions/upload-artifact@v4
        with:
          name: zel-p0-runtime-e2e-closure-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
