name: ZEL P2 Trend Momentum Family V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/p2_trend_momentum_base.py
      - backend/research/p2_trend_momentum_variants.py
      - policies/zel/p2_trend_momentum_base_v1.json
      - policies/zel/p2_trend_momentum_variants_v1.json
      - research/evidence/p2_trend_momentum_base_result_20260809.json
      - backend/tools/zel_bingx_real_calibration_v1.py
      - config/zel_alpha_engine_vnext.json
      - .github/workflows/zel-p2-trend-momentum-base-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-p2-trend-momentum-family-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-variants:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate sealed BASE failure and predeclared variants
        run: |
          set -euo pipefail
          python -m py_compile backend/research/p2_trend_momentum_base.py backend/research/p2_trend_momentum_variants.py backend/tools/zel_bingx_real_calibration_v1.py
          python -m json.tool policies/zel/p2_trend_momentum_variants_v1.json >/dev/null
          python -m json.tool research/evidence/p2_trend_momentum_base_result_20260809.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('research/evidence/p2_trend_momentum_base_result_20260809.json').read_text())
          v=json.loads(Path('policies/zel/p2_trend_momentum_variants_v1.json').read_text())
          assert b['state']=='FAIL_P2_TREND_MOMENTUM_BASE_EDGE'
          assert b['W3_untouched'] is True
          assert v['state']=='FROZEN_BEFORE_VARIANT_REPLAY'
          assert v['predeclared_before_any_variant_replay'] is True
          assert [x['lookback_bars'] for x in v['variants']]==[32,96]
          assert [x['lookback_clock_hours'] for x in v['variants']]==[8,24]
          assert v['common']['same_bar_fill'] is False
          assert v['common']['stop_loss'] is None and v['common']['take_profit'] is None
          assert v['common']['additional_filters']==[]
          assert v['selection_authority'] is False and v['promotion_authority'] is False
          assert v['execution_authority']=='NONE' and v['order_authority']=='BLOCKED'
          print('PASS_P2_VARIANTS_PREDECLARED_8H_24H')
          PY
          mkdir -p /tmp/p2_history/zel_historical_oos_v1/market/15m/{15m_w1,15m_w2} out ~/.ssh

      - name: Materialize W1 and W2 BTC/ETH only; W3 remains untouched
        run: |
          set -euo pipefail
          git fetch --depth=1 origin zel-historical-oos-data-v1
          git show FETCH_HEAD:zel_historical_oos_v1/manifest.json > /tmp/p2_history/zel_historical_oos_v1/manifest.json
          for w in 15m_w1 15m_w2; do
            for s in BTCUSDT ETHUSDT; do
              git show FETCH_HEAD:zel_historical_oos_v1/market/15m/$w/$s.csv > /tmp/p2_history/zel_historical_oos_v1/market/15m/$w/$s.csv
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/p2_history/zel_historical_oos_v1/manifest.json').read_text())
          assert str(m['state']).startswith('PASS_')
          assert m['forward_overlap_count']==0
          for w in ('15m_w1','15m_w2'):
              for s in ('BTCUSDT','ETHUSDT'):
                  p=Path(f'/tmp/p2_history/zel_historical_oos_v1/market/15m/{w}/{s}.csv')
                  assert p.is_file() and p.stat().st_size>0
          assert not Path('/tmp/p2_history/zel_historical_oos_v1/market/15m/15m_w3').exists()
          print('PASS_P2_VARIANT_DATA_W3_UNTOUCHED')
          PY

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Collect one shared fresh BingX read-only cost envelope
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/p2-trend-variants-cost-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$remote" > out/remote_path.txt
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes backend/tools/zel_bingx_real_calibration_v1.py "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt nice -n 19 ionice -c3 /usr/bin/python3 '$remote/zel_bingx_real_calibration_v1.py' --out '$remote/observation.json'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/observation.json" out/bingx_real_observation.json
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/bingx_real_observation.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==r['receipt_sha256']
          assert r['state'].startswith('PASS_BINGX_REAL_OBSERVATION_COLLECTED')
          assert r['source_tier']=='official' and r['calibration_mode']=='real'
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          print('PASS_P2_SHARED_COST',json.dumps({
            'taker_fee_pct':r['taker_fee_pct'],
            'funding_p95_abs_pct_8h':r['funding_p95_abs_pct_8h'],
            'worst_slippage_bps':max(x['slippage_bps_one_way'] for x in r['slippage_floor_bps_by_notional']),
            'receipt':r['receipt_sha256']
          },sort_keys=True))
          PY

      - name: Run both predeclared variants on the same W1/W2 and cost envelope
        run: |
          set -euo pipefail
          python backend/research/p2_trend_momentum_variants.py \
            --data-root /tmp/p2_history \
            --manifest /tmp/p2_history/zel_historical_oos_v1/manifest.json \
            --plan policies/zel/p2_trend_momentum_variants_v1.json \
            --base-result research/evidence/p2_trend_momentum_base_result_20260809.json \
            --cost-model out/bingx_real_observation.json \
            --out out/p2_trend_momentum_variants_receipt.json
          python - <<'PY'
          import json
          r=json.load(open('out/p2_trend_momentum_variants_receipt.json'))
          assert r['variants_predeclared_before_replay'] is True
          assert r['parameter_selection_performed'] is False
          assert r['exit_optimization_performed'] is False
          assert r['additional_filters_added'] is False
          assert r['untouched_w3_accessed'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          for c in r['candidate_rows']:
              for x in c['results']:
                  n=x['net']
                  print('P2VAR',c['candidate_id'],x['window'],x['symbol'],
                        'trades=',n['trade_count'],'wr=',n['win_rate'],
                        'net=',n['compound_return'],'exp=',n['expectancy_per_trade'],
                        'pf=',n['profit_factor'],'dd=',n['max_drawdown'],
                        'edge=',x['base_edge_pass'])
          print('P2_VARIANTS_STATE',r['state'],'PASSING',r['passing_candidates'])
          PY

      - name: Scan DD SSOT only for future passing-candidate gate; do not resolve by guess
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'python3 -' > out/dd_ssot_scan.json <<'PY'
          import json,re
          from pathlib import Path
          roots=[Path('/home/z/z/config'),Path('/home/z/z/policies'),Path('/home/z/z/runtime')]
          pat=re.compile(r'(DD_total|DD_day|dd_total|dd_day|max_drawdown|drawdown_limit|dd_limit)',re.I)
          hits=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.json'):
                  try:
                      if p.stat().st_size>1_000_000: continue
                      d=json.loads(p.read_text(errors='ignore'))
                  except Exception: continue
                  def walk(v,path):
                      if isinstance(v,dict):
                          for k,x in v.items():
                              np=path+[str(k)]
                              if pat.search(str(k)) and isinstance(x,(int,float)) and not isinstance(x,bool):
                                  hits.append({'source':str(p),'key_path':'.'.join(np),'value':x})
                              walk(x,np)
                      elif isinstance(v,list):
                          for i,x in enumerate(v[:200]): walk(x,path+[str(i)])
                  walk(d,[])
          print(json.dumps({'state':'OBSERVED_NOT_AUTHORITY','hits':hits[:200],'resolved_dd_limit_pct':None},sort_keys=True))
          PY
          python -m json.tool out/dd_ssot_scan.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-p2-trend-momentum-variants-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/bingx_real_observation.json
            out/p2_trend_momentum_variants_receipt.json
            out/dd_ssot_scan.json
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup remote cost probe
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f ~/.ssh/vps_key
