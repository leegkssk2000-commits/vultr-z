name: ZEL P3 Carry Flow Prospective Activation V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/p3_prospective_native_feature_collector.py'
      - 'backend/research/p3_prospective_native_append.py'
      - 'backend/research/p3_prospective_native_coverage_gate.py'
      - 'backend/research/contracts/p3_carry_flow_prospective_native_v1.json'
      - 'tests/test_p3_prospective_native_coverage_gate.py'
      - '.github/workflows/zel-p3-carry-flow-prospective-activation-v1.yml'
      - 'backend/research/contracts/p3_clean_native_epoch_v1.json'
      - 'backend/research/architecture_factory/g5a_development_data_v1.py'
  push:
    branches: [master]
    paths:
      - 'backend/research/contracts/p3_clean_native_epoch_v1.json'
  workflow_dispatch:
    inputs:
      persist:
        description: 'Persist append-only snapshot; allowed only when dispatched from master'
        required: false
        default: 'false'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: g5a-stage-source-cost-development-v1
  cancel-in-progress: false

env:
  DATA_BRANCH: zel-p3-prospective-data

jobs:
  collect-and-append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source-only contract and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/research/p3_prospective_native_feature_collector.py \
            backend/research/p3_prospective_native_append.py \
            backend/research/p3_prospective_native_coverage_gate.py
          python -m json.tool backend/research/contracts/p3_carry_flow_prospective_native_v1.json >/dev/null
          python - <<'PY'
          import json
          c=json.load(open('backend/research/contracts/p3_carry_flow_prospective_native_v1.json'))
          assert c['state']=='FROZEN_PROSPECTIVE_SOURCE_ACQUISITION'
          assert c['family']=='carry_flow'
          assert c['research_only'] is True
          f=c['frozen_window_contract']
          assert f['source_pull_request']==605
          assert f['w1_start_ms']==1782549000000
          assert f['w2_end_ms']==1784276940000
          assert f['history_pre_roll_ms']==86400000
          assert f['required_capture_span_ms']==1814340000
          assert f['coverage_clock']=='collected_at_ms'
          assert f['cadence_minimum_record_count']=='NOT_GUESSED'
          assert f['maximum_gap_ms']=='NOT_GUESSED'
          assert c['native_sources']['funding']['status']=='HISTORICAL_W1_W2_BOUND'
          assert c['native_sources']['premium_index']['status']=='PROSPECTIVE_CAPTURE_ALLOWED'
          assert c['native_sources']['open_interest']['status']=='PROSPECTIVE_CAPTURE_ALLOWED'
          assert c['native_sources']['flow']['status']=='SOURCE_NOT_BOUND'
          assert c['capture_policy']['prospective_only'] is True
          assert c['capture_policy']['raw_native_values_only'] is True
          assert c['capture_policy']['replay_before_alignment_and_coverage_gate']=='FORBIDDEN'
          assert c['coverage_gate']['flow_required_for_replay'] is True
          assert c['coverage_gate']['replay_on_basis_oi_duration_only'] is False
          assert c['selection_authority'] is False
          assert c['promotion_authority'] is False
          assert c['execution_authority']=='NONE'
          assert c['order_authority']=='BLOCKED'
          print('PASS_P3_SOURCE_ONLY_FROZEN_COVERAGE_CONTRACT')
          PY

      - name: Run deterministic coverage-gate tests
        env:
          PYTHONPATH: .
        run: python tests/test_p3_prospective_native_coverage_gate.py -q

      - name: Collect one raw native snapshot
        run: python backend/research/p3_prospective_native_feature_collector.py --out /tmp/p3_snapshot.json

      - name: Pull existing dedicated history only on authorized master persistence runs
        # The old mixed clock epoch is frozen audit-only.
        if: false
        shell: bash
        run: |
          set -euo pipefail
          git fetch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}" || true
          mkdir -p /tmp/p3_history
          if git show-ref --verify --quiet "refs/remotes/origin/${DATA_BRANCH}"; then
            mkdir -p /tmp/p3_old
            git archive "origin/${DATA_BRANCH}" research/data/p3_prospective 2>/dev/null | tar -x -C /tmp/p3_old || true
            if [ -d /tmp/p3_old/research/data/p3_prospective ]; then
              cp -a /tmp/p3_old/research/data/p3_prospective/. /tmp/p3_history/
              rm -f /tmp/p3_history/latest_receipt.json /tmp/p3_history/latest_coverage.json
            fi
          fi

      - name: Append and validate history
        run: |
          mkdir -p /tmp/p3_history
          python backend/research/p3_prospective_native_append.py \
            --snapshot /tmp/p3_snapshot.json \
            --history-dir /tmp/p3_history \
            --receipt /tmp/p3_append_receipt.json

      - name: Evaluate frozen-window coverage gate
        run: |
          python backend/research/p3_prospective_native_coverage_gate.py \
            --history-dir /tmp/p3_history \
            --contract backend/research/contracts/p3_carry_flow_prospective_native_v1.json \
            --out /tmp/p3_coverage_receipt.json

      - name: Verify fail-closed receipts
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/p3_snapshot.json'))
          r=json.load(open('/tmp/p3_append_receipt.json'))
          g=json.load(open('/tmp/p3_coverage_receipt.json'))
          assert s['state']=='PASS_P3_PROSPECTIVE_NATIVE_BASIS_OI_SNAPSHOT'
          assert s['record_count']==4
          assert s['flow_source_bound'] is False
          assert s['historical_coverage_claim'] is False
          assert s['replay_allowed'] is False
          assert s['signal_generation_enabled'] is False
          assert s['execution_authority']=='NONE' and s['order_authority']=='BLOCKED'
          assert r['state']=='PASS_P3_PROSPECTIVE_NATIVE_APPEND'
          assert len(r['results'])==4
          assert r['replay_allowed'] is False
          assert r['signal_generation_enabled'] is False
          assert r['selection_authority'] is False
          assert r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert g['state'] in {
              'HOLD_P3_PROSPECTIVE_HISTORY_ACCUMULATING',
              'PASS_P3_BASIS_OI_COVERAGE_READY_FLOW_BLOCKED',
          }
          assert g['required_capture_span_ms']==1814340000
          assert 0.0 <= g['minimum_coverage_progress_ratio'] <= 1.0
          assert g['flow_source_bound'] is False
          assert g['historical_coverage_claim'] is False
          assert g['replay_allowed'] is False
          assert g['signal_generation_enabled'] is False
          assert g['selection_authority'] is False
          assert g['promotion_authority'] is False
          assert g['execution_authority']=='NONE' and g['order_authority']=='BLOCKED'
          print('PASS_P3_PROSPECTIVE_COVERAGE_GATE',g['state'],g['minimum_coverage_progress_ratio'])
          PY

      - name: Append to the new clean native epoch
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          git fetch origin g5a-stage-development-data-v1:refs/remotes/origin/g5a-stage-development-data-v1
          mkdir -p /tmp/p3_clean
          git archive origin/g5a-stage-development-data-v1 research/data/g5a_stage_v1/native_epoch | tar -x -C /tmp/p3_clean
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.research.architecture_factory.g5a_development_data_v1 import append_native_epoch, read, EPOCH
          out=Path('/tmp/p3_clean/research/data/g5a_stage_v1/native_epoch')
          snapshot=json.load(open('/tmp/p3_snapshot.json'))
          result=append_native_epoch(out,read(EPOCH),snapshot['records'])
          (out/'latest.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          assert result['candidate_generation_allowed'] is False and result['paid_AI_calls']==0
          print('PASS_CLEAN_NATIVE_EPOCH',result['clean_native_rows'],result['receipt_sha256'])
          PY

      - name: Upload smoke or persistence evidence
        uses: actions/upload-artifact@v4
        with:
          name: zel-p3-prospective-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/p3_snapshot.json
            /tmp/p3_append_receipt.json
            /tmp/p3_coverage_receipt.json
            /tmp/p3_history/*.ndjson
            /tmp/p3_clean/research/data/g5a_stage_v1/native_epoch/*
          if-no-files-found: error
          retention-days: 90

      - name: Persist to dedicated data branch only from master
        if: false
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p3_data_repo
          mkdir /tmp/p3_data_repo
          cd /tmp/p3_data_repo
          git init
          git config user.name 'zel-p3-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin "${DATA_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${DATA_BRANCH}"; then
            git checkout -B "${DATA_BRANCH}" "origin/${DATA_BRANCH}"
          else
            git checkout --orphan "${DATA_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/data/p3_prospective
          cp /tmp/p3_history/*.ndjson research/data/p3_prospective/
          cp /tmp/p3_append_receipt.json research/data/p3_prospective/latest_receipt.json
          cp /tmp/p3_coverage_receipt.json research/data/p3_prospective/latest_coverage.json
          git add research/data/p3_prospective
          if git diff --cached --quiet; then
            echo 'NO_NEW_NATIVE_RECORDS_OR_COVERAGE_CHANGE'
            exit 0
          fi
          git commit -m "data(p3): append native basis/OI and coverage ${{ github.run_id }}"
          git push origin "${DATA_BRANCH}"

      - name: Persist only the new epoch with append-only prefix checks
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'schedule' || github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.persist == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/p3_clean_repo origin/g5a-stage-development-data-v1
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/p3_clean/research/data/g5a_stage_v1/native_epoch')
          dst=Path('/tmp/p3_clean_repo/research/data/g5a_stage_v1/native_epoch')
          for p in src.iterdir():
              target=dst/p.name
              if p.suffix=='.jsonl' and target.exists():
                  assert p.read_bytes().startswith(target.read_bytes()),p.name
              target.write_bytes(p.read_bytes())
          PY
          cd /tmp/p3_clean_repo
          git config user.name 'p3-clean-native-epoch-owner'
          git config user.email 'actions@users.noreply.github.com'
          git add research/data/g5a_stage_v1/native_epoch
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P3: append clean native epoch ${GITHUB_RUN_ID} [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:g5a-stage-development-data-v1
