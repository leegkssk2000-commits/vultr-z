name: ZEL P3 Carry Flow Native Source Binding

on:
  push:
    branches: [zel/g0-install-certification-20260809]
    paths:
      - backend/research/p3_native_endpoint_probe.py
      - .github/workflows/zel-p3-carry-flow-source-census.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-p3-carry-flow-native-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p3-native-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact-endpoint probe
        run: |
          set -euo pipefail
          python -m py_compile backend/research/p3_native_endpoint_probe.py
          mkdir -p ~/.ssh out
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Probe only previously discovered BingX endpoint literals read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/p3-native-endpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          echo "$remote" > out/remote_path.txt
          scp -i ~/.ssh/vps_key -o BatchMode=yes backend/research/p3_native_endpoint_probe.py "$VPS_USER@$VPS_HOST:$remote"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=15 "$VPS_USER@$VPS_HOST" \
            "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt nice -n 19 ionice -c3 /usr/bin/python3 '$remote'" \
            > out/p3_native_endpoint_probe.json
          python -m json.tool out/p3_native_endpoint_probe.json >/dev/null
      - name: Verify fail-closed native source receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/p3_native_endpoint_probe.json'))
          assert r['schema_version']=='zel.p3.native_endpoint_probe.v1'
          assert r['endpoints_are_previously_discovered_runtime_literals'] is True
          assert r['runtime_mutated'] is False
          assert r['service_state_mutated'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          print(json.dumps({
            'state':r['state'],
            'historical_binding':r['historical_binding'],
            'current_readability':r['current_endpoint_readability'],
            'blockers':r['blockers'],
            'action':r['action']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-p3-native-endpoint-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/p3_native_endpoint_probe.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup remote probe
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -f '$remote'" 2>/dev/null || true
          rm -f ~/.ssh/vps_key
