name: ZEL P4 Durable Zico OMS V1

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/contracts/zel_oms_command_v2.py"
      - "backend/runtime/zel_durable_oms_v2.py"
      - "backend/runtime/zel_durable_oms_v2_1.py"
      - "tests/test_zel_p4_durable_oms_v1.py"
      - ".github/workflows/zel-p4-durable-zico-oms-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-p4-durable-zico-oms-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile P4 OMS
        run: |
          python -m py_compile \
            backend/contracts/zel_oms_command_v2.py \
            backend/runtime/zel_durable_oms_v2.py \
            backend/runtime/zel_durable_oms_v2_1.py \
            tests/test_zel_p4_durable_oms_v1.py

      - name: Run durable OMS regression
        run: python -m pytest -q tests/test_zel_p4_durable_oms_v1.py tests/test_zel_completion_foundation_v1.py

      - name: Assert private exchange surface remains blocked
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths=[
              Path("backend/contracts/zel_oms_command_v2.py"),
              Path("backend/runtime/zel_durable_oms_v2.py"),
              Path("backend/runtime/zel_durable_oms_v2_1.py"),
          ]
          forbidden={
              "create_order", "create_market_order", "create_limit_order", "cancel_order",
              "set_leverage", "set_margin_mode", "fetch_balance", "fetch_positions",
              "private_get", "private_post", "execute_order", "place_order",
          }
          found=[]
          for path in paths:
              tree=ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if not isinstance(node,ast.Call): continue
                  name=""
                  if isinstance(node.func,ast.Name): name=node.func.id
                  elif isinstance(node.func,ast.Attribute): name=node.func.attr
                  if name in forbidden: found.append((str(path),name))
          assert found==[],found
          PY
