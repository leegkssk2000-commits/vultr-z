name: ZEL P5 Paper 30D Evidence V1

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/contracts/zel_paper_canary_v1.py"
      - "backend/runtime/zel_paper_canary_ledger_v1.py"
      - "backend/runtime/zel_paper_canary_ledger_v1_1.py"
      - "tests/test_zel_p5_paper_30d_evidence_v1.py"
      - ".github/workflows/zel-p5-paper-30d-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-p5-paper-30d-evidence-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Paper evidence gate
        run: |
          python -m py_compile \
            backend/contracts/zel_paper_canary_v1.py \
            backend/runtime/zel_paper_canary_ledger_v1.py \
            backend/runtime/zel_paper_canary_ledger_v1_1.py \
            tests/test_zel_p5_paper_30d_evidence_v1.py

      - name: Run Paper 30D evidence regression
        run: python -m pytest -q tests/test_zel_p5_paper_30d_evidence_v1.py tests/test_zel_completion_foundation_v1.py

      - name: Assert no Live or capital activation
        run: |
          python - <<'PY'
          from pathlib import Path
          text="\n".join(path.read_text() for path in (
              Path("backend/contracts/zel_paper_canary_v1.py"),
              Path("backend/runtime/zel_paper_canary_ledger_v1.py"),
              Path("backend/runtime/zel_paper_canary_ledger_v1_1.py"),
          ))
          assert '"live_allowed": False' in text
          assert '"capital_scale_allowed": False' in text
          assert '"activation_allowed": False' in text
          PY
