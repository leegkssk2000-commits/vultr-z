name: ZEL Parallel Live Readiness V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/zel_skill_counterfactual_contract_v1.json
      - backend/tools/zel_skill_counterfactual_adapter_v1.py
      - backend/tools/zel_lico_historical_min_data_mapper_v1.py
      - backend/tools/zel_trade_method_historical_adapter_v1.py
      - backend/tools/zel_trade_method_runtime_behavior_v1.py
      - .github/workflows/zel-parallel-live-readiness-v1.yml

permissions:
  contents: read

concurrency:
  group: zel-parallel-live-readiness-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Export current checkpoint trades through stdout only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'python3 -' > out/partial_trades.jsonl <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('/var/lib/zel-research/data-b-1m-v2/checkpoints')
          seen=set()
          for path in sorted(root.glob('*.json.gz')):
              try:
                  with gzip.open(path,'rt',encoding='utf-8') as handle:
                      payload=json.load(handle)
                  result=payload.get('result') if isinstance(payload,dict) else None
                  if not isinstance(result,dict): continue
                  strategy_id=str(result.get('strategy_id') or '')
                  for lane in result.get('lanes') or []:
                      if not isinstance(lane,dict): continue
                      for raw in lane.get('closed_rows') or []:
                          if not isinstance(raw,dict): continue
                          row=dict(raw)
                          row.setdefault('strategy_id',strategy_id)
                          event_id=str(row.get('event_id') or '')
                          key=event_id or json.dumps(row,sort_keys=True,separators=(',',':'),default=str)
                          if key in seen: continue
                          seen.add(key)
                          print(json.dumps(row,sort_keys=True,default=str))
              except Exception:
                  continue
          PY
          test -s out/partial_trades.jsonl
          gzip -c out/partial_trades.jsonl > out/partial_trades.jsonl.gz

      - name: Read live Skill registry and Trade Method behavior
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            'cat /home/z/z/backend/contracts/ZOS_SKILL_REGISTRY_v1.json' \
            > out/skill_registry.json
          python -m json.tool out/skill_registry.json >/dev/null
          set +e
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "python3 - --source-root /home/z/z --checkpoints /var/lib/zel-research/data-b-1m-v2/checkpoints --stdout" \
            < backend/tools/zel_trade_method_runtime_behavior_v1.py \
            > out/trade_method_behavior.json
          behavior_rc=$?
          set -e
          python -m json.tool out/trade_method_behavior.json >/dev/null
          test "$behavior_rc" -eq 0 -o "$behavior_rc" -eq 1

      - name: Build real partial-data adapter receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.tools import zel_skill_counterfactual_adapter_v1 as adapter
          contract=json.loads(Path('backend/research/zel_skill_counterfactual_contract_v1.json').read_text())
          registry=json.loads(Path('out/skill_registry.json').read_text())
          skill_ids=[]
          for row in registry.get('skills') or []:
              if isinstance(row,dict) and row.get('skill_id'):
                  skill_ids.append(str(row['skill_id']))
          result=adapter.build(contract,skill_ids,adapter.load_trade_schema(Path('out/partial_trades.jsonl.gz')))
          Path('out/skill_adapter_live.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python backend/tools/zel_lico_historical_min_data_mapper_v1.py \
            --trades out/partial_trades.jsonl.gz \
            --out out/lico_mapper_live.json
          lico_rc=$?
          python backend/tools/zel_trade_method_historical_adapter_v1.py \
            --trades out/partial_trades.jsonl.gz \
            --behavior out/trade_method_behavior.json \
            --out out/trade_method_adapter_live.json
          method_rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          skill=json.loads(Path('out/skill_adapter_live.json').read_text())
          lico=json.loads(Path('out/lico_mapper_live.json').read_text())
          method=json.loads(Path('out/trade_method_adapter_live.json').read_text())
          assert skill['skill_count']>0,skill
          assert lico['trade_count']>0,lico
          assert method['trade_count']>0,method
          assert lico['state'] in {'PASS_LICO_HISTORICAL_MIN_DATA_DATASET','HOLD_LICO_HISTORICAL_MIN_DATA_DATASET'},lico
          assert method['state'] in {'PASS_TRADE_METHOD_HISTORICAL_ADAPTER','HOLD_TRADE_METHOD_HISTORICAL_ADAPTER'},method
          for row in (skill,lico,method):
              assert row['active_data_b_1m_mutated'] is False,row
              assert row['canonical_strategy_files_mutated'] is False,row
              assert row['formal_ledger_mutated'] is False,row
              assert row['runtime_registry_mutated'] is False,row
              assert row['selection_authority'] is False and row['promotion_authority'] is False,row
              assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          summary={
            'state':'PASS_PARALLEL_LIVE_READINESS_CAPTURED',
            'trade_count':lico['trade_count'],
            'skill_state':skill['state'],
            'skill_exact':skill['exact_replay_skill_count'],
            'skill_parity':skill['parity_only_skill_count'],
            'skill_blocked':skill['blocked_skill_count'],
            'lico_state':lico['state'],
            'lico_ready':lico['ready_trade_count'],
            'lico_blocked':lico['blocked_trade_count'],
            'trade_method_state':method['state'],
            'trade_method_pass':method['pass_trade_count'],
            'trade_method_blocked':method['blocked_trade_count'],
            'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'
          }
          Path('out/live_readiness_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(summary)
          PY
          test "$lico_rc" -eq 0 -o "$lico_rc" -eq 1
          test "$method_rc" -eq 0 -o "$method_rc" -eq 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-parallel-live-readiness-v1-${{ github.run_id }}
          path: |
            out/skill_adapter_live.json
            out/lico_mapper_live.json
            out/trade_method_behavior.json
            out/trade_method_adapter_live.json
            out/live_readiness_summary.json
          if-no-files-found: error
          retention-days: 30
