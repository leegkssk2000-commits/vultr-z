name: ZEL Patch Loss Attribution Zero Trade V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-patch-loss-attribution-zero-trade-v1.yml
      - backend/tools/zel_patch_loss_attribution_zero_trade_v1.py

permissions:
  contents: write

concurrency:
  group: zel-patch-loss-attribution-zero-trade-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zel-strategy-loss-attribution-gemini-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact patch
        run: |
          set -euo pipefail
          python backend/tools/zel_patch_loss_attribution_zero_trade_v1.py
          python -m py_compile backend/tools/zel_strategy_loss_attribution_gemini_v1.py
          python - <<'PY'
          from pathlib import Path
          script=Path('backend/tools/zel_strategy_loss_attribution_gemini_v1.py').read_text()
          workflow=Path('.github/workflows/zel-strategy-loss-attribution-gemini-v1.yml').read_text()
          assert 'def read_strategy_inventory(' in script
          assert 'HOLD_ZERO_TRADE_STRATEGY' in script
          assert 'traded_strategy_count' in script
          assert '--scoreboard input/scoreboard.csv' in workflow
          assert "row['traded_strategy_count']==13" in workflow
          print('PASS_ZERO_TRADE_PATCH_STATIC')
          PY

      - name: Commit final files and remove patch scaffolding
        run: |
          set -euo pipefail
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git rm \
            backend/tools/zel_patch_loss_attribution_zero_trade_v1.py \
            .github/workflows/zel-patch-loss-attribution-zero-trade-v1.yml
          git add \
            backend/tools/zel_strategy_loss_attribution_gemini_v1.py \
            .github/workflows/zel-strategy-loss-attribution-gemini-v1.yml
          git commit -m 'fix(zel): preserve zero-trade strategies in loss attribution'
          git push origin HEAD:zel-strategy-loss-attribution-gemini-v1
