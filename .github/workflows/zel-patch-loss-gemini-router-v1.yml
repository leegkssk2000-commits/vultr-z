name: ZEL Patch Loss Gemini Router V1

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/zel-patch-loss-gemini-router-v1.yml
      - backend/tools/zel_patch_loss_gemini_router_v1.py

permissions:
  contents: write

concurrency:
  group: zel-patch-loss-gemini-router-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zel-strategy-loss-attribution-gemini-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and verify source patch
        run: |
          set -euo pipefail
          python backend/tools/zel_patch_loss_gemini_router_v1.py
          python -m py_compile backend/tools/zel_strategy_loss_attribution_gemini_v1.py
          python - <<'PY'
          from pathlib import Path
          text=Path('backend/tools/zel_strategy_loss_attribution_gemini_v1.py').read_text()
          assert 'def list_gemini_models(' in text
          assert 'models/gemini-3.6-flash' not in text
          assert 'def compact_filter_screen(' in text
          assert 'top_oos_candidates' in text
          assert 'thinkingLevel' in text
          assert 'retry_delay_seconds' in text
          print('PASS_CURRENT_GEMINI_ROUTER_PATCH_STATIC')
          PY

      - name: Commit Python source only
        run: |
          set -euo pipefail
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add backend/tools/zel_strategy_loss_attribution_gemini_v1.py
          git commit -m 'fix(zel): use current Gemini model discovery and compact evidence'
          git push origin HEAD:zel-strategy-loss-attribution-gemini-v1
