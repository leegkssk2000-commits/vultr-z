name: ZEL PR500 One-Shot Autofix V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_historical_oos_exact25_replay_v2.py
      - backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py
      - backend/tools/zel_bingx_execution_calibration_adapter_v1.py
      - .github/workflows/zel-pr500-autofix-v1.yml

permissions:
  contents: write

concurrency:
  group: zel-pr500-one-shot-autofix-v1-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic review fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replay=Path('backend/tools/zel_historical_oos_exact25_replay_v2.py')
          text=replay.read_text()
          if 'FINAL_PROGRESS_WRITTEN_BEFORE_MANIFEST' not in text:
              manifest_needle='    manifest_payload = artifact_manifest(\n'
              manifest_index=text.index(manifest_needle)
              terminal_start=text.rfind('    write_progress(\n')
              terminal_end=text.index('    print(', terminal_start)
              assert terminal_start > manifest_index,(terminal_start,manifest_index)
              terminal_block=text[terminal_start:terminal_end]
              assert 'failures, state, None' in terminal_block,terminal_block
              text=text[:terminal_start]+text[terminal_end:]
              manifest_index=text.index(manifest_needle)
              text=(
                  text[:manifest_index]
                  +'    # FINAL_PROGRESS_WRITTEN_BEFORE_MANIFEST\n'
                  +terminal_block
                  +text[manifest_index:]
              )
              replay.write_text(text)

          alpha=Path('backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py')
          text=alpha.read_text()
          if 'unpaired_champion_count = len(set(champion) - set(challenger))' not in text:
              old=(
                  '    paired_count = len(pairs)\n'
                  '    state = "PASS_ALPHA_LAP_PAIRED_COMPARISON" if paired_count and not violations else "HOLD_ALPHA_LAP_PAIRED_COMPARISON_INCOMPLETE"\n'
              )
              new=(
                  '    paired_count = len(pairs)\n'
                  '    unpaired_champion_count = len(set(champion) - set(challenger))\n'
                  '    unpaired_challenger_count = len(set(challenger) - set(champion))\n'
                  '    state = (\n'
                  '        "PASS_ALPHA_LAP_PAIRED_COMPARISON"\n'
                  '        if paired_count and not violations and unpaired_champion_count == 0 and unpaired_challenger_count == 0\n'
                  '        else "HOLD_ALPHA_LAP_PAIRED_COMPARISON_INCOMPLETE"\n'
                  '    )\n'
              )
              assert old in text
              text=text.replace(old,new,1)
              text=text.replace(
                  '"unpaired_champion_count": len(set(champion) - set(challenger)),',
                  '"unpaired_champion_count": unpaired_champion_count,',
                  1,
              )
              text=text.replace(
                  '"unpaired_challenger_count": len(set(challenger) - set(champion)),',
                  '"unpaired_challenger_count": unpaired_challenger_count,',
                  1,
              )
              alpha.write_text(text)

          calibration=Path('backend/tools/zel_bingx_execution_calibration_adapter_v1.py')
          text=calibration.read_text()
          old=(
              '        if any(token in text for token in FEE_TYPE_HINTS):\n'
              '            fee += amount\n'
              '            fee_count += 1\n'
              '        elif any(token in text for token in FUNDING_TYPE_HINTS):\n'
              '            funding += amount\n'
              '            funding_count += 1\n'
          )
          new=(
              '        if any(token in text for token in FUNDING_TYPE_HINTS):\n'
              '            funding += amount\n'
              '            funding_count += 1\n'
              '        elif any(token in text for token in FEE_TYPE_HINTS):\n'
              '            fee += amount\n'
              '            fee_count += 1\n'
          )
          if old in text:
              text=text.replace(old,new,1)
              calibration.write_text(text)
          PY
      - name: Validate patched sources and regression cases
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_historical_oos_exact25_replay_v2.py \
            backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py \
            backend/tools/zel_bingx_execution_calibration_adapter_v1.py
          python backend/tools/zel_historical_oos_exact25_replay_v2.py --self-test
          python backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py --self-test
          python backend/tools/zel_bingx_execution_calibration_adapter_v1.py --self-test
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          r=Path('backend/tools/zel_historical_oos_exact25_replay_v2.py').read_text()
          assert r.index('FINAL_PROGRESS_WRITTEN_BEFORE_MANIFEST') < r.index('manifest_payload = artifact_manifest')
          assert r.count('failures, state, None') == 1,r.count('failures, state, None')

          def load(path, name):
              spec=importlib.util.spec_from_file_location(name,path)
              module=importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              return module

          alpha=load('backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py','alpha_fix_test')
          with tempfile.TemporaryDirectory() as temp:
              root=Path(temp)
              context={'timestamp':'2026-01-01T00:00:00Z','symbol':'BTCUSDT','regime':'trend','cost_model_sha256':'c','risk_budget':'1R'}
              champion=root/'champion.jsonl'
              challenger=root/'challenger.jsonl'
              champion.write_text('\n'.join([
                  json.dumps({**context,'opportunity_id':'o1','net_R':0.0}),
                  json.dumps({**context,'opportunity_id':'o2','timestamp':'2026-01-01T00:01:00Z','net_R':0.1}),
              ])+'\n')
              challenger.write_text(json.dumps({**context,'opportunity_id':'o1','net_R':1.0})+'\n')
              comparison=alpha.paired_compare(champion,challenger)
              assert comparison['state']=='HOLD_ALPHA_LAP_PAIRED_COMPARISON_INCOMPLETE',comparison
              assert comparison['unpaired_champion_count']==1,comparison

          calibration=load('backend/tools/zel_bingx_execution_calibration_adapter_v1.py','calibration_fix_test')
          with tempfile.TemporaryDirectory() as temp:
              path=Path(temp)/'input.json'
              path.write_text(json.dumps({'transactions':[
                  {'type':'TRADING_FEE','amount':-1.0},
                  {'type':'FUNDING_FEE','amount':-0.2},
                  {'type':'REALIZED_PNL','amount':2.0},
              ]}))
              result=calibration.calibrate(path)
              assert result['fee_record_count']==1,result
              assert result['funding_record_count']==1,result
              assert result['candidate_cost_model']['observed_fee_total_usdt']==-1.0,result
              assert result['candidate_cost_model']['observed_funding_total_usdt']==-0.2,result
          print('PASS_PR500_REVIEW_REGRESSIONS')
          PY
      - name: Commit fixes once
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'zel-pr500-autofix-bot'
          git config user.email 'zel-pr500-autofix-bot@users.noreply.github.com'
          git add backend/tools/zel_historical_oos_exact25_replay_v2.py \
                  backend/tools/zel_alpha_lap_v2_economic_adapter_v1.py \
                  backend/tools/zel_bingx_execution_calibration_adapter_v1.py
          git commit -m 'fix(zel): address PR500 integrity review'
          git push origin HEAD:${{ github.head_ref }}
