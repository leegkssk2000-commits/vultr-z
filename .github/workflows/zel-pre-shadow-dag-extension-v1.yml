name: ZEL Pre-Shadow DAG Extension V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_pre_shadow_receipt_dag_v1.py
      - backend/tools/zel_pre_shadow_lineage_controller_v1.py
      - backend/tools/zel_remaining_static_stage_receipt_v1.py
      - backend/research/zel_remaining_static_stages_contract_v1.json
      - backend/research/zel_ai_stage_authorization_broker_v1.json
      - .github/workflows/zel-static-stage-reusable-v1.yml
      - .github/workflows/zel-alpha-lap-challengers-v1.yml
      - .github/workflows/zel-w2-forward-v1.yml
      - .github/workflows/zel-w3-durability-v1.yml
      - .github/workflows/zel-portfolio-joint-risk-v1.yml
      - .github/workflows/zel-rollback-rehearsal-v1.yml
      - .github/workflows/zel-pre-shadow-release-v1.yml
      - .github/workflows/zel-pre-shadow-dag-extension-v1.yml
  workflow_run:
    workflows:
      - ZEL Strategy Top3 Bundles V1
      - ZEL Alpha Lap Challengers V1
      - ZEL W2 Forward V1
      - ZEL W3 Durability V1
      - ZEL Portfolio Joint Risk V1
      - ZEL Rollback Rehearsal V1
      - ZEL Pre-Shadow Release V1
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: zel-pre-shadow-dag-controller-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate remaining DAG extension
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_pre_shadow_receipt_dag_v1.py \
            backend/tools/zel_pre_shadow_lineage_controller_v1.py \
            backend/tools/zel_remaining_static_stage_receipt_v1.py
          python backend/tools/zel_pre_shadow_receipt_dag_v1.py --self-test
          python backend/tools/zel_pre_shadow_lineage_controller_v1.py --self-test
          python backend/tools/zel_remaining_static_stage_receipt_v1.py --self-test
          python -m json.tool backend/research/zel_remaining_static_stages_contract_v1.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/zel-pre-shadow-dag-extension-v1.yml').read_text()
          for stage in (
            'ALPHA_LAP_CHALLENGERS','W2_FORWARD','W3_DURABILITY',
            'PORTFOLIO_JOINT_RISK','ROLLBACK_REHEARSAL','PRE_SHADOW_RELEASE'
          ):
              assert f"'{stage}'" in text,stage
              assert f"'broker_stage_id':'{stage}'" in text,stage
          assert 'ONE_ORDERED_STAGE_AT_A_TIME' in text
          assert 'zel-pre-shadow-dag-controller-v1' in text
          print('PASS_REMAINING_DAG_EXTENSION_STATIC')
          PY

  advance:
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: master
          path: control
          persist-credentials: false
      - name: Checkout result authority
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind completed workflow to expected lineage
        run: |
          set -euo pipefail
          mkdir -p out
          python control/backend/tools/zel_pre_shadow_lineage_controller_v1.py \
            --mode bind \
            --results-root results \
            --event-path "$GITHUB_EVENT_PATH" \
            --out out/bind.json
          cat out/bind.json
      - name: Evaluate ordered receipt DAG
        run: |
          set -euo pipefail
          python control/backend/tools/zel_pre_shadow_receipt_dag_v1.py \
            --results-root results \
            --out out/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['dispatch_policy']=='ONE_ORDERED_STAGE_AT_A_TIME',d
          assert d['lineage_policy']=='CURRENT_PREDECESSOR_AND_STAGE_RECEIPT_SHA_REQUIRED',d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          print(json.dumps({
            'state':d['state'],'passed':d['passed_stage_count'],
            'blocked':d['first_blocked_stage'],'eligible':d['eligible_next_stage'],
            'reason':d['eligible_reason']
          },sort_keys=True))
          PY
      - name: Plan exactly one remaining stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          stage=json.loads(Path('out/latest.json').read_text()).get('eligible_next_stage')
          mapping={
            'ALPHA_LAP_CHALLENGERS':{
              'workflow_file':'zel-alpha-lap-challengers-v1.yml',
              'workflow_name':'ZEL Alpha Lap Challengers V1',
              'broker_stage_id':'ALPHA_LAP_CHALLENGERS',
            },
            'W2_FORWARD':{
              'workflow_file':'zel-w2-forward-v1.yml',
              'workflow_name':'ZEL W2 Forward V1',
              'broker_stage_id':'W2_FORWARD',
            },
            'W3_DURABILITY':{
              'workflow_file':'zel-w3-durability-v1.yml',
              'workflow_name':'ZEL W3 Durability V1',
              'broker_stage_id':'W3_DURABILITY',
            },
            'PORTFOLIO_JOINT_RISK':{
              'workflow_file':'zel-portfolio-joint-risk-v1.yml',
              'workflow_name':'ZEL Portfolio Joint Risk V1',
              'broker_stage_id':'PORTFOLIO_JOINT_RISK',
            },
            'ROLLBACK_REHEARSAL':{
              'workflow_file':'zel-rollback-rehearsal-v1.yml',
              'workflow_name':'ZEL Rollback Rehearsal V1',
              'broker_stage_id':'ROLLBACK_REHEARSAL',
            },
            'PRE_SHADOW_RELEASE':{
              'workflow_file':'zel-pre-shadow-release-v1.yml',
              'workflow_name':'ZEL Pre-Shadow Release V1',
              'broker_stage_id':'PRE_SHADOW_RELEASE',
            },
          }
          plan={'stage_id':stage,'implemented':stage in mapping,'dispatch':False,'adopt_active':False}
          if stage in mapping: plan.update(mapping[stage])
          Path('out/dispatch_plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          PY
          workflow=$(python -c "import json;print(json.load(open('out/dispatch_plan.json')).get('workflow_file') or '')")
          if [ -z "$workflow" ]; then cat out/dispatch_plan.json; exit 0; fi
          gh run list --workflow "$workflow" --limit 30 --json databaseId,status,createdAt,headSha > out/active_runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('out/dispatch_plan.json').read_text())
          rows=json.loads(Path('out/active_runs.json').read_text())
          active=[r for r in rows if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
          active.sort(key=lambda r:r.get('createdAt') or '',reverse=True)
          if active:
              plan['adopt_active']=True; plan['active_run']=active[0]
          else:
              plan['dispatch']=True; plan['active_run']=None
          Path('out/dispatch_plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          PY
      - name: Create dispatch expectation
        run: |
          set -euo pipefail
          stage=$(python -c "import json;print(json.load(open('out/dispatch_plan.json')).get('stage_id') or '')")
          implemented=$(python -c "import json;print(str(json.load(open('out/dispatch_plan.json')).get('implemented',False)).lower())")
          if [ -z "$stage" ] || [ "$implemented" != true ]; then
            echo '{"state":"NOOP_NO_IMPLEMENTED_ELIGIBLE_STAGE"}' > out/expectation.json
            exit 0
          fi
          workflow_name=$(python -c "import json;print(json.load(open('out/dispatch_plan.json'))['workflow_name'])")
          python control/backend/tools/zel_pre_shadow_lineage_controller_v1.py \
            --mode expect \
            --results-root results \
            --dag out/latest.json \
            --stage-id "$stage" \
            --workflow-name "$workflow_name" \
            --controller-run-id "$GITHUB_RUN_ID" \
            --out out/expectation.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('out/dispatch_plan.json').read_text())
          if not plan.get('adopt_active'): raise SystemExit(0)
          path=Path('results/runtime_results/zel/pre_shadow_lineage_v1/expectation_latest.json')
          expected=json.loads(path.read_text()); active=plan['active_run']
          expected['state']='ADOPTED_ACTIVE_RUN'
          expected['generated_at']=active['createdAt']
          expected['adopted_active_run_id']=str(active['databaseId'])
          expected['adopted_active_head_sha']=active.get('headSha')
          path.write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          Path('out/expectation.json').write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish DAG and lineage receipts
        run: |
          set -euo pipefail
          cd results
          git config user.name 'zel-pre-shadow-dag-bot'
          git config user.email 'zel-pre-shadow-dag-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          cd ..
          root=results/runtime_results/zel/pre_shadow_receipt_dag_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git add runtime_results/zel/pre_shadow_receipt_dag_v1 runtime_results/zel/pre_shadow_lineage_v1
          git commit -m "result(zel): remaining DAG lineage ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1
      - name: Dispatch exactly one planned stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch=$(python -c "import json;print(str(json.load(open('out/dispatch_plan.json')).get('dispatch',False)).lower())")
          if [ "$dispatch" != true ]; then cat out/dispatch_plan.json; exit 0; fi
          stage=$(python -c "import json;print(json.load(open('out/dispatch_plan.json'))['stage_id'])")
          broker_stage=$(python -c "import json;print(json.load(open('out/dispatch_plan.json'))['broker_stage_id'])")
          gh workflow run zel-ai-stage-authorization-broker-v1.yml \
            --ref master -f stage_id="$broker_stage" -f dispatch_target=true
          echo "DISPATCHED_VIA_BROKER:$stage"
      - name: Record authority boundary
        run: |
          echo 'ONE_ORDERED_STAGE_AT_A_TIME; execution=NONE; order=BLOCKED; Shadow/Paper/Live disabled.'
      - uses: actions/upload-artifact@v4
        with:
          name: zel-pre-shadow-dag-extension-v1-${{ github.run_id }}
          path: out
          retention-days: 90
