name: ZEL Production A1 Jump Liquidity Economic V1

on:
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_a1_jump_liquidity_economic_v1.py'
      - 'config/zel_production_a1_jump_liquidity_economic_v1.json'
      - '.github/workflows/zel-production-a1-jump-liquidity-economic-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read

concurrency:
  group: zel-production-a1-jump-liquidity-economic-v1
  cancel-in-progress: false

jobs:
  evaluate-on-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static compile and fail-closed contract
        run: |
          set -euo pipefail
          python -m py_compile backend/production/zel_production_a1_jump_liquidity_economic_v1.py
          python - <<'PY'
          import json
          p=json.load(open('config/zel_production_a1_jump_liquidity_economic_v1.json'))
          assert p['falsification_horizons_sec']==[5,15,30,60]
          assert p['negative_controls']==['DIRECTION_FLIP','PLUS_ONE_BUCKET_DELAY','TIMESTAMP_SHIFT_PLACEBO','MATCHED_NON_EVENT']
          assert p['taker_fee_bps_per_side']==5.0 and p['fee_model']=='ALL_TAKER_CONSERVATIVE'
          assert p['parameter_search'] is False and p['best_horizon_selection'] is False and p['threshold_tuning'] is False
          assert p['selection_authority'] is False and p['promotion_authority'] is False
          assert p['execution_authority']=='NONE' and p['order_authority']=='BLOCKED' and p['live_trade_authority']=='BLOCKED'
          print('PASS_A1_JUMP_ECON_STATIC')
          PY
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Wait runtime parity and evaluate only post-seal rows
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          EXPECTED_SCRIPT="$(sha256sum backend/production/zel_production_a1_jump_liquidity_economic_v1.py | awk '{print $1}')"
          EXPECTED_POLICY="$(sha256sum config/zel_production_a1_jump_liquidity_economic_v1.json | awk '{print $1}')"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "EXPECTED_SCRIPT='$EXPECTED_SCRIPT' EXPECTED_POLICY='$EXPECTED_POLICY' bash -se" > out/a1_jump_economic_receipt.json <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          matched=0
          for _ in $(seq 1 120); do
            got_script="$(sha256sum "$ROOT/backend/production/zel_production_a1_jump_liquidity_economic_v1.py" 2>/dev/null | awk '{print $1}' || true)"
            got_policy="$(sha256sum "$ROOT/config/zel_production_a1_jump_liquidity_economic_v1.json" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$got_script" = "$EXPECTED_SCRIPT" ] && [ "$got_policy" = "$EXPECTED_POLICY" ]; then matched=1; break; fi
            sleep 2
          done
          [ "$matched" -eq 1 ] || { echo A1_JUMP_ECON_RUNTIME_PARITY_TIMEOUT >&2; exit 71; }
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          python3 -m backend.production.zel_production_a1_jump_liquidity_economic_v1 --policy config/zel_production_a1_jump_liquidity_economic_v1.json
          REMOTE
      - name: Verify receipt remains research-only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/a1_jump_economic_receipt.json'))
          assert r['state'] in {
            'PASS_A1_FIRST_PROSPECTIVE_ECONOMIC_EVIDENCE',
            'HOLD_A1_ECON_CALIBRATION_SEAL_REQUIRED',
            'HOLD_A1_ECON_POST_SEAL_HISTORY_REQUIRED',
            'HOLD_A1_ECON_FUNDING_RATE_REQUIRED',
            'HOLD_A1_ECON_NO_QUALIFYING_EVENTS_YET',
          }, r
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert r['protected_mutations']==0
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-a1-jump-economic-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/a1_jump_economic_receipt.json
          if-no-files-found: error
          retention-days: 30
