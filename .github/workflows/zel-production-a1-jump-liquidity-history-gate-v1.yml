name: ZEL Production A1 Jump Liquidity History Gate V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_a1_jump_liquidity_history_gate_v1.py'
      - 'config/zel_production_a1_jump_liquidity_source_template_v1.json'
      - 'config/zel_production_a1_jump_liquidity_history_gate_v1.json'
      - 'tests/test_zel_production_a1_jump_liquidity_history_gate_v1.py'
      - '.github/workflows/zel-production-a1-jump-liquidity-history-gate-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_a1_jump_liquidity_history_gate_v1.py'
      - 'config/zel_production_a1_jump_liquidity_source_template_v1.json'
      - 'config/zel_production_a1_jump_liquidity_history_gate_v1.json'
      - '.github/workflows/zel-production-a1-jump-liquidity-history-gate-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: zel-production-a1-jump-liquidity-history-gate-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test source-quality gate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile backend/production/zel_production_a1_jump_liquidity_history_gate_v1.py
          PYTHONPATH=. pytest -q tests/test_zel_production_a1_jump_liquidity_history_gate_v1.py
      - name: Verify exact source template has no economic threshold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('config/zel_production_a1_jump_liquidity_source_template_v1.json').read_text())
          g=json.loads(Path('config/zel_production_a1_jump_liquidity_history_gate_v1.json').read_text())
          assert set(t['sources'])=={'l2_order_book','volume','ohlcv'}
          assert t['template_ready'] is True
          assert t['numeric_signal_thresholds_frozen'] is False
          assert t['economic_signal_enabled'] is False
          assert g['history_gate_decision_scope']=='SOURCE_QUALITY_ONLY'
          assert g['economic_replay_allowed_by_this_gate'] is False
          assert g['collector_heartbeat_schema']=='zel.production_bingx_ws_microstructure_heartbeat.v2'
          assert g['history_path'].endswith('production_bingx_ws_microstructure_v2.jsonl')
          assert g['execution_authority']=='NONE' and g['order_authority']=='BLOCKED'
          print('PASS_A1_JUMP_SOURCE_HISTORY_GATE_STATIC')
          PY

  evaluate-on-vps:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Wait runtime parity and evaluate prospective source quality
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          RUNTIME_PARITY_B64="$(python3 - <<'PY' | base64 -w0
          import hashlib,json
          from pathlib import Path
          files=[
            'backend/production/zel_production_a1_jump_liquidity_history_gate_v1.py',
            'config/zel_production_a1_jump_liquidity_source_template_v1.json',
            'config/zel_production_a1_jump_liquidity_history_gate_v1.json',
            'backend/production/zel_production_bingx_ws_microstructure_v2.py',
            'config/zel_production_bingx_ws_microstructure_v2.json',
          ]
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},sort_keys=True,separators=(',',':')))
          PY
          )"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "RUNTIME_PARITY_B64='$RUNTIME_PARITY_B64' bash -se" > out/jump_source_history_receipt.json <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          HB=/home/z/z/ledger/production_bingx_ws_microstructure_heartbeat_v2.json
          export ROOT RUNTIME_PARITY_B64 HB
          matched=0
          for _ in $(seq 1 90); do
            if python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          expected=json.loads(base64.b64decode(os.environ['RUNTIME_PARITY_B64']).decode())
          ok=root.exists()
          for rel,want in expected.items():
              p=root/rel
              got=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              ok=ok and got==want
          raise SystemExit(0 if ok else 1)
          PY
            then matched=1; break; fi
            sleep 2
          done
          [ "$matched" -eq 1 ] || { echo A1_JUMP_HISTORY_RUNTIME_PARITY_TIMEOUT >&2; exit 71; }
          expected_source="$(sha256sum "$ROOT/backend/production/zel_production_bingx_ws_microstructure_v2.py" | awk '{print $1}')"
          expected_policy="$(sha256sum "$ROOT/config/zel_production_bingx_ws_microstructure_v2.json" | awk '{print $1}')"
          collector_ready=0
          for _ in $(seq 1 90); do
            if [ -f "$HB" ] && EXPECTED_SOURCE="$expected_source" EXPECTED_POLICY="$expected_policy" python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          try:r=json.loads(Path(os.environ['HB']).read_text())
          except Exception:raise SystemExit(1)
          now=int(time.time()*1000); streams=r.get('streams') or {}
          ok=(
              r.get('schema_version')=='zel.production_bingx_ws_microstructure_heartbeat.v2' and
              r.get('source_sha256')==os.environ['EXPECTED_SOURCE'] and r.get('policy_sha256')==os.environ['EXPECTED_POLICY'] and
              now-int(r.get('updated_at_ms') or 0)<=30000 and
              all(int((streams.get(s) or {}).get('normalized_messages') or 0)>0 for s in ('depth','trade','kline')) and
              int(r.get('depth_messages_total') or 0)>0 and int(r.get('trade_messages_total') or 0)>0 and int(r.get('kline_messages_total') or 0)>0 and
              int(r.get('parse_errors_total') or 0)==0 and
              r.get('execution_authority')=='NONE' and r.get('order_authority')=='BLOCKED' and r.get('live_trade_authority')=='BLOCKED' and r.get('exchange_order_submitted') is False
          )
          raise SystemExit(0 if ok else 1)
          PY
            then collector_ready=1; break; fi
            sleep 2
          done
          [ "$collector_ready" -eq 1 ] || { echo A1_JUMP_V2_COLLECTOR_NOT_READY >&2; exit 72; }
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          python3 -m backend.production.zel_production_a1_jump_liquidity_history_gate_v1 \
            --policy config/zel_production_a1_jump_liquidity_history_gate_v1.json
          REMOTE
      - name: Verify source gate remains non-economic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/jump_source_history_receipt.json').read_text())
          assert not r['integrity_defects'], r
          assert r['template_ready'] is True
          assert r['economic_replay_allowed'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False
          assert r['protected_mutations']==0
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-a1-jump-source-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/jump_source_history_receipt.json
          if-no-files-found: error
          retention-days: 30
