name: ZEL Production AI Admission Executor V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_admission_executor_v1.py'
      - 'backend/production/zel_production_ai_admission_executor_v2.py'
      - 'backend/production/zel_production_ai_admission_materializer_v1.py'
      - 'backend/production/zel_production_ai_family_canary_handoff_v1.py'
      - 'backend/production/zel_production_family_paper_canary_runner_v1.py'
      - 'backend/production/zel_production_family_paper_canary_runner_v2.py'
      - 'backend/production/zel_production_family_paper_evidence_producer_v1.py'
      - 'backend/production/zel_production_family_survivor_verifier_v1.py'
      - 'backend/production/zel_production_survivor_catalog_v1.py'
      - 'backend/production/zel_production_survivor_pool_v1.py'
      - 'config/zel_production_ai_admission_executor_v1.json'
      - 'config/zel_production_ai_admission_template_registry_v1.json'
      - 'config/zel_production_ai_family_canary_handoff_v1.json'
      - 'config/zel_production_family_paper_canary_runner_v1.json'
      - 'config/zel_production_family_paper_evidence_producer_v1.json'
      - 'config/zel_production_risk_sizing_v1.json'
      - 'tests/test_zel_production_ai_admission_executor_v1.py'
      - 'tests/test_zel_production_ai_admission_executor_v2.py'
      - 'tests/test_zel_production_ai_family_canary_handoff_v1.py'
      - 'tests/test_zel_production_family_paper_canary_runner_v1.py'
      - 'tests/test_zel_production_family_paper_canary_runner_v2.py'
      - 'tests/test_zel_production_family_paper_evidence_producer_v1.py'
      - 'tests/test_zel_production_family_survivor_verifier_v1.py'
      - 'tests/test_zel_production_survivor_catalog_v1.py'
      - 'tests/test_zel_production_survivor_pool_v1.py'
      - '.github/workflows/zel-production-ai-admission-executor-v1.yml'
  workflow_run:
    workflows: ['ZEL Production AI Proposal Explore V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-ai-admission-executor-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test frozen admission, symbol-qualified canary, and survivor lineage
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            backend/production/zel_production_ai_admission_executor_v1.py \
            backend/production/zel_production_ai_admission_executor_v2.py \
            backend/production/zel_production_ai_admission_materializer_v1.py \
            backend/production/zel_production_ai_family_canary_handoff_v1.py \
            backend/production/zel_production_family_paper_canary_runner_v1.py \
            backend/production/zel_production_family_paper_canary_runner_v2.py \
            backend/production/zel_production_family_paper_evidence_producer_v1.py \
            backend/production/zel_production_family_survivor_verifier_v1.py \
            backend/production/zel_production_survivor_catalog_v1.py \
            backend/production/zel_production_survivor_pool_v1.py
          PYTHONPATH=. pytest -q \
            tests/test_zel_production_ai_admission_executor_v1.py \
            tests/test_zel_production_ai_admission_executor_v2.py \
            tests/test_zel_production_ai_admission_materializer_v1.py \
            tests/test_zel_production_ai_family_canary_handoff_v1.py \
            tests/test_zel_production_family_paper_canary_runner_v1.py \
            tests/test_zel_production_family_paper_canary_runner_v2.py \
            tests/test_zel_production_family_paper_evidence_producer_v1.py \
            tests/test_zel_production_family_survivor_verifier_v1.py \
            tests/test_zel_production_survivor_catalog_v1.py \
            tests/test_zel_production_survivor_pool_v1.py
      - name: Verify frozen no-search no-authority and symbol-qualified prospective boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_ai_admission_executor_v1.json').read_text())
          h=json.loads(Path('config/zel_production_ai_family_canary_handoff_v1.json').read_text())
          c=json.loads(Path('config/zel_production_family_paper_canary_runner_v1.json').read_text())
          t=json.loads(Path('config/zel_production_ai_admission_template_registry_v1.json').read_text())
          r=json.loads(Path('config/zel_production_risk_sizing_v1.json').read_text())
          assert p['mode']=='PAPER' and c['mode']=='PAPER'
          assert p['numeric_signal_thresholds']==[] and p['parameter_search'] is False
          assert c['numeric_signal_thresholds']==[] and c['parameter_search'] is False
          assert c['windows']==['W1','W2','W3'] and c['trades_per_window']==60
          assert c['runtime_symbol_precedence']==['BTCUSDT','ETHUSDT']
          assert c['retention_semantics']=='WINDOW_EXPECTANCY_DIV_W1_EXPECTANCY'
          assert c['risk_basis']=='MINIMUM_FROZEN_PAPER_EXPOSURE'
          assert min(r['allowed_leverage_x'])==10 and min(r['allowed_position_pct'])==5
          for row in (p,h,c):
              assert row['selection_authority'] is False and row['promotion_authority'] is False
              assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED'
              assert row['live_trade_authority']=='BLOCKED'
          expected={
            'l2_inventory_pressure_v1':(['basis','l2_order_book'],'REQUIRE_BASIS_SIGN_MATCH_PRIMARY_IMBALANCE_SIGN'),
            'basis_oi_deleveraging_v1':(['basis','open_interest'],'REQUIRE_OPEN_INTEREST_INCREASE_AND_NONZERO_BASIS_CHANGE'),
            'funding_l2_inventory_exhaustion_v1':(['funding','l2_order_book'],'REQUIRE_FUNDING_SIGN_MATCH_PRIMARY_IMBALANCE_SIGN'),
          }
          for tid,(sources,context) in expected.items():
              row=t['templates'][tid]
              assert row['required_sources_exact']==sources
              assert row['context_rule']==context
              assert row['numeric_signal_thresholds']==[] and row['parameter_search'] is False
              assert row['negative_controls']==['DIRECTION_REVERSAL','PLUS_ONE_EVENT_DELAY','NO_SIGNAL_PLACEBO']
          src=Path('backend/production/zel_production_ai_admission_executor_v2.py').read_text()
          bridge=Path('backend/production/zel_production_ai_family_canary_handoff_v1.py').read_text()
          runner=Path('backend/production/zel_production_family_paper_canary_runner_v2.py').read_text()
          evidence=Path('backend/production/zel_production_family_paper_evidence_producer_v1.py').read_text()
          verifier=Path('backend/production/zel_production_family_survivor_verifier_v1.py').read_text()
          assert 'PASS_AI_ADMISSION_ECONOMIC_CANDIDATE' in src
          assert 'BUILD_INDEPENDENT_FAMILY_PAPER_CANARY' in src
          assert 'admission_history_reuse_allowed' in bridge and 'prospective_only' in bridge
          assert 'runtime_symbol_precedence' in runner and 'FROZEN_PRECEDENCE_FIRST_QUALIFIED_NO_METRIC_SEARCH' in runner
          assert 'symbol_qualified' in evidence and 'runtime_symbol' in verifier
          assert 'production_family_paper_canary_history_v1' in Path('config/zel_production_family_paper_canary_runner_v1.json').read_text()
          assert 'production_ai_admission_observations_v1.ndjson' not in runner
          for code in (src,bridge,runner,evidence,verifier):
              assert 'submit_order' not in code and 'https://' not in code
          print('PASS_FROZEN_ADMISSION_TO_SYMBOL_QUALIFIED_SURVIVOR_BOUNDARY')
          PY

  execute-on-vps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run one bounded frozen admission, handoff, and symbol-qualified canary tick
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          RUNTIME_PARITY_B64="$(python3 - <<'PY' | base64 -w0
          import hashlib,json
          from pathlib import Path
          files=[
            'backend/production/zel_production_ai_admission_executor_v1.py',
            'backend/production/zel_production_ai_admission_executor_v2.py',
            'backend/production/zel_production_ai_admission_materializer_v1.py',
            'backend/production/zel_production_ai_family_canary_handoff_v1.py',
            'backend/production/zel_production_family_paper_canary_runner_v1.py',
            'backend/production/zel_production_family_paper_canary_runner_v2.py',
            'backend/production/zel_production_family_paper_evidence_producer_v1.py',
            'backend/production/zel_production_family_survivor_verifier_v1.py',
            'backend/production/zel_production_survivor_catalog_v1.py',
            'backend/production/zel_production_survivor_pool_v1.py',
            'backend/production/zel_production_carry_flow_data_v1.py',
            'backend/production/zel_production_l2_order_book_data_v1.py',
            'backend/engine/market_data_service.py',
            'config/zel_production_ai_admission_executor_v1.json',
            'config/zel_production_ai_admission_template_registry_v1.json',
            'config/zel_production_ai_family_canary_handoff_v1.json',
            'config/zel_production_family_paper_canary_runner_v1.json',
            'config/zel_production_family_paper_evidence_producer_v1.json',
            'config/zel_production_risk_sizing_v1.json',
            'config/zel_production_carry_positioning_v1.json',
          ]
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},sort_keys=True,separators=(',',':')))
          PY
          )"
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "RUNTIME_PARITY_B64='$RUNTIME_PARITY_B64' bash -se" <<'REMOTE'
          set -euo pipefail
          matched=0
          for _ in $(seq 1 60); do
            if RUNTIME_PARITY_B64="$RUNTIME_PARITY_B64" python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path('/home/z/zel-production-current')
          expected=json.loads(base64.b64decode(os.environ['RUNTIME_PARITY_B64']).decode())
          ok=root.exists()
          for rel,want in expected.items():
              p=root/rel
              ok=ok and p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==want
          raise SystemExit(0 if ok else 1)
          PY
            then
              matched=1
              break
            fi
            sleep 2
          done
          if [ "$matched" -ne 1 ]; then
            echo 'RUNTIME_PARITY_TIMEOUT' >&2
            exit 71
          fi
          ROOT=/home/z/zel-production-current
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          python3 -m backend.production.zel_production_carry_flow_data_v1 >/tmp/zel-ai-admission-carry.json
          python3 -m backend.production.zel_production_ai_admission_executor_v2 >/tmp/zel-ai-admission-executor.json
          python3 -m backend.production.zel_production_ai_family_canary_handoff_v1 >/tmp/zel-ai-family-canary-handoff.json
          python3 -m backend.production.zel_production_family_paper_canary_runner_v2 >/tmp/zel-family-paper-canary-runner.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('/tmp/zel-ai-admission-executor.json').read_text())
          handoff=json.loads(Path('/tmp/zel-ai-family-canary-handoff.json').read_text())
          canary=json.loads(Path('/tmp/zel-family-paper-canary-runner.json').read_text())
          assert row['state'] in {
              'HOLD_AI_ADMISSION_NO_FROZEN_CONTRACT',
              'HOLD_AI_ADMISSION_EXECUTOR_AUTHORITY_MISSING',
              'HOLD_AI_ADMISSION_EXECUTOR_SOURCE_SNAPSHOT_MISSING',
              'HOLD_AI_ADMISSION_HISTORY_ACCUMULATING',
              'PASS_AI_ADMISSION_ECONOMIC_CANDIDATE',
              'REJECT_AI_ADMISSION_ECONOMIC_EDGE',
          }
          assert handoff['state'] in {
              'HOLD_AI_FAMILY_CANARY_ECONOMIC_RESULT_MISSING',
              'HOLD_AI_FAMILY_CANARY_NO_ECONOMIC_CANDIDATE',
              'HOLD_AI_FAMILY_CANARY_LINEAGE_MISSING',
              'HOLD_AI_FAMILY_CANARY_NO_PASSING_RESULT',
              'PASS_AI_FAMILY_CANARY_HANDOFF_READY',
          }
          assert canary['runner_version']=='V2_SYMBOL_QUALIFIED'
          assert canary['state'] in {
              'HOLD_FAMILY_CANARY_NO_ACTIVE_REQUEST',
              'HOLD_FAMILY_PAPER_CANARY_ACCUMULATING',
              'HOLD_FAMILY_PAPER_CANARY_TERMINAL_ONLY',
              'PASS_FAMILY_PAPER_CANARY_RESULT_READY',
              'REJECT_FAMILY_PAPER_CANARY',
          }
          persisted=Path('/home/z/z/ledger/production_ai_admission_economic_v1.json')
          if persisted.exists():
              p=json.loads(persisted.read_text())
              assert p.get('selection_authority') is False
              assert p.get('promotion_authority') is False
              assert p.get('execution_authority')=='NONE'
              assert p.get('order_authority')=='BLOCKED'
              assert p.get('live_trade_authority')=='BLOCKED'
              assert p.get('exchange_order_submitted') is False
              assert p.get('executor_version')=='V2'
          cs=Path('/home/z/z/ledger/production_family_paper_canary_runner_state_v1.json')
          if cs.exists():
              c=json.loads(cs.read_text())
              assert c.get('runner_version')=='V2_SYMBOL_QUALIFIED'
              assert c.get('runtime_symbol_precedence')==['BTCUSDT','ETHUSDT']
              assert c.get('selection_authority') is False
              assert c.get('promotion_authority') is False
              assert c.get('execution_authority')=='NONE'
              assert c.get('order_authority')=='BLOCKED'
              assert c.get('live_trade_authority')=='BLOCKED'
              assert c.get('exchange_order_submitted') is False
          result=Path('/home/z/z/ledger/production_family_paper_canary_result_v1.json')
          if result.exists():
              r=json.loads(result.read_text())
              if r.get('runtime_symbol_precedence') is not None:
                  assert r.get('state')=='PASS_FAMILY_PAPER_CANARY'
                  assert r.get('symbol_qualified') is True
                  assert r.get('runtime_symbol') in {'BTCUSDT','ETHUSDT'}
                  assert r.get('runtime_symbol_precedence')==['BTCUSDT','ETHUSDT']
                  assert r.get('prospective_only') is True
                  assert r.get('admission_history_reuse_allowed') is False
                  assert r.get('metrics',{}).get('trade_count')==180
                  assert r.get('risk_request')=={'leverage_x':10,'position_pct':5.0}
                  assert r.get('order_authority')=='BLOCKED' and r.get('live_trade_authority')=='BLOCKED'
          print(json.dumps({'admission':row,'handoff':handoff,'canary':canary},sort_keys=True))
          PY
          REMOTE
