name: ZEL Production AI Proposal Explore V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_layer_v1.py'
      - 'backend/production/zel_production_openai_critic_v1.py'
      - 'backend/production/zel_production_ai_terminal_feedback_v1.py'
      - 'backend/production/zel_production_source_acquisition_v1.py'
      - 'backend/production/zel_production_l2_order_book_data_v1.py'
      - 'config/zel_production_ai_proposal_layer_v1.json'
      - 'config/zel_production_ai_terminal_feedback_v1.json'
      - 'config/zel_production_source_acquisition_v1.json'
      - 'config/zel_production_source_capability_registry_v1.json'
      - 'backend/production/zel_production_ai_admission_materializer_v1.py'
      - 'config/zel_production_ai_admission_materializer_v1.json'
      - 'config/zel_production_ai_admission_template_registry_v1.json'
      - 'backend/production/zel_production_economic_edge_router_v1.py'
      - 'config/zel_production_economic_edge_router_v1.json'
      - 'backend/production/zel_production_paper_runner_v1.sh'
      - 'backend/production/zel_production_survivor_pool_v2.py'
      - 'tests/test_zel_production_ai_proposal_layer_v1.py'
      - 'tests/test_zel_production_ai_terminal_feedback_v1.py'
      - 'tests/test_zel_production_ai_admission_materializer_v1.py'
      - 'tests/test_zel_production_economic_edge_router_v1.py'
      - '.github/workflows/zel-production-ai-proposal-explore-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_layer_v1.py'
      - 'backend/production/zel_production_openai_critic_v1.py'
      - 'backend/production/zel_production_ai_terminal_feedback_v1.py'
      - 'backend/production/zel_production_source_acquisition_v1.py'
      - 'backend/production/zel_production_l2_order_book_data_v1.py'
      - 'config/zel_production_ai_proposal_layer_v1.json'
      - 'config/zel_production_ai_terminal_feedback_v1.json'
      - 'config/zel_production_source_acquisition_v1.json'
      - 'config/zel_production_source_capability_registry_v1.json'
      - 'backend/production/zel_production_ai_admission_materializer_v1.py'
      - 'config/zel_production_ai_admission_materializer_v1.json'
      - 'config/zel_production_ai_admission_template_registry_v1.json'
      - 'backend/production/zel_production_economic_edge_router_v1.py'
      - 'config/zel_production_economic_edge_router_v1.json'
      - '.github/workflows/zel-production-ai-proposal-explore-v1.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-ai-proposal-explore-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test AI Explore proposal layer
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            backend/production/zel_production_ai_proposal_layer_v1.py \
            backend/production/zel_production_openai_critic_v1.py \
            backend/production/zel_production_ai_terminal_feedback_v1.py \
            backend/production/zel_production_source_acquisition_v1.py \
            backend/production/zel_production_l2_order_book_data_v1.py \
            backend/production/zel_production_ai_admission_materializer_v1.py \
            backend/production/zel_production_economic_edge_router_v1.py
          bash -n backend/production/zel_production_paper_runner_v1.sh
          PYTHONPATH=. pytest -q \
            tests/test_zel_production_ai_proposal_layer_v1.py \
            tests/test_zel_production_ai_terminal_feedback_v1.py \
            tests/test_zel_production_ai_admission_materializer_v1.py \
            tests/test_zel_production_economic_edge_router_v1.py \
            tests/test_zel_production_economic_edge_dynamic_v1.py \
            tests/test_zel_production_l2_order_book_data_v1.py
      - name: Verify proposal-only AI authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_ai_proposal_layer_v1.json').read_text())
          f=json.loads(Path('config/zel_production_ai_terminal_feedback_v1.json').read_text())
          assert p['mode']=='PAPER' and f['mode']=='PAPER'
          assert p['candidate_budget']<=2
          assert p['numeric_threshold_proposals_allowed'] is False
          critic=p.get('openai_critic',{})
          assert critic.get('enabled') is True
          assert critic.get('required') is False
          assert critic.get('execution_authority')=='NONE'
          assert critic.get('order_authority')=='BLOCKED'
          assert critic.get('live_trade_authority')=='BLOCKED'
          for k in ('raw_trades_sent','private_code_sent','account_data_sent','credentials_sent'):
              assert p[k] is False
          for row in (p,f):
              assert row['selection_authority'] is False and row['promotion_authority'] is False
              assert row['execution_authority']=='NONE'
              assert row['order_authority']=='BLOCKED' and row['live_trade_authority']=='BLOCKED'
              assert row['source_code_mutation_allowed'] is False and row['self_modification_allowed'] is False
          src=Path('backend/production/zel_production_ai_proposal_layer_v1.py').read_text()
          openai=Path('backend/production/zel_production_openai_critic_v1.py').read_text()
          guard=Path('backend/production/zel_production_ai_terminal_feedback_v1.py').read_text()
          assert 'generativelanguage.googleapis.com' in src
          assert 'api.openai.com/v1/responses' in openai
          assert 'BingX' not in src and 'submit_order' not in src
          assert 'submit_order' not in openai and 'submit_order' not in guard
          print('PASS_AI_PROPOSAL_ONLY_AUTHORITY_BOUNDARY')
          PY
      - name: Verify PAPER runner stays network-free from AI Explore
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('backend/production/zel_production_paper_runner_v1.sh').read_text()
          bootstrap=r.index('zel_production_performance_bootstrap_v1')
          router=r.index('zel_production_economic_edge_router_v1')
          alpha=r.index('zel_production_alpha_signal_runner_v1')
          paper=r.index('zel_production_paper_loop_v1')
          improve=r.index('zel_production_improvement_controller_v1')
          pool=r.index('zel_production_survivor_pool_v2')
          assert bootstrap < router < alpha < paper < improve < pool
          for forbidden in (
              'zel_production_ai_proposal_layer_v1',
              'zel_production_openai_critic_v1',
              'zel_production_ai_terminal_feedback_v1',
              'zel_production_source_acquisition_v1',
              'zel_production_ai_admission_materializer_v1',
              'GEMINI_API_KEY',
              'OPENAI_API_KEY',
              'generativelanguage.googleapis.com',
              'api.openai.com',
          ):
              assert forbidden not in r
          assert r.count('zel_production_economic_edge_router_v1') == 1
          print('PASS_PAPER_LOOP_AI_EXPLORE_NETWORK_ISOLATION')
          PY
      - name: Verify terminal feedback precedes router and proposal
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/zel-production-ai-proposal-explore-v1.yml').read_text()
          assert 'RUNTIME_PARITY_B64' in w and 'RUNTIME_PARITY_TIMEOUT' in w
          assert 'secrets.OPENAI_API_KEY' in w
          feedback=w.index('zel_production_ai_terminal_feedback_v1 >/tmp/zel-ai-explore-feedback.json')
          router=w.index('zel_production_economic_edge_router_v1 --tick >/tmp/zel-ai-explore-router-before.json')
          proposal=w.index('zel_production_ai_proposal_layer_v1 --policy /home/z/z/ledger/production_ai_feedback_proposal_policy_v1.json --tick')
          l2=w.index('zel_production_l2_order_book_data_v1 --append-history')
          resolver=w.index('zel_production_source_acquisition_v1 >/tmp/zel-ai-explore-source-acquisition.json')
          admission=w.index('zel_production_ai_admission_materializer_v1 >/tmp/zel-ai-explore-admission.json')
          assert feedback < router < proposal < l2 < resolver < admission
          print('PASS_EXPLORE_TERMINAL_FEEDBACK_ORDER')
          PY
      - name: Verify router cannot treat AI as authority
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('backend/production/zel_production_economic_edge_router_v1.py').read_text()
          assert 'PASS_EDGE_ACQUISITION_AI_PROPOSAL_QUEUE' in src
          assert 'AI_PROPOSAL_PASSED_SOURCE_AVAILABILITY_ONLY' in src
          assert 'FREEZE_AI_PROPOSAL_AND_BUILD_DETERMINISTIC_ADMISSION' in src
          assert 'selection_authority' in src and 'promotion_authority' in src
          assert 'submit_order' not in src and 'https://' not in src
          print('PASS_AI_PROPOSAL_DETERMINISTIC_ROUTER_BOUNDARY')
          PY

  propose-on-vps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run one bounded terminal-feedback Explore tick
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          API_KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          OPENAI_KEY_B64="$(printf '%s' "$OPENAI_API_KEY" | base64 -w0)"
          RUNTIME_PARITY_B64="$(python3 - <<'PY' | base64 -w0
          import hashlib,json
          from pathlib import Path
          files=[
            'backend/production/zel_production_ai_proposal_layer_v1.py',
            'backend/production/zel_production_openai_critic_v1.py',
            'backend/production/zel_production_ai_terminal_feedback_v1.py',
            'backend/production/zel_production_source_acquisition_v1.py',
            'backend/production/zel_production_l2_order_book_data_v1.py',
            'backend/production/zel_production_ai_admission_materializer_v1.py',
            'backend/production/zel_production_economic_edge_router_v1.py',
            'config/zel_production_ai_proposal_layer_v1.json',
            'config/zel_production_ai_terminal_feedback_v1.json',
            'config/zel_production_source_acquisition_v1.json',
            'config/zel_production_source_capability_registry_v1.json',
            'config/zel_production_ai_admission_materializer_v1.json',
            'config/zel_production_ai_admission_template_registry_v1.json',
            'config/zel_production_economic_edge_router_v1.json',
            'config/zel_production_alpha_factory_v1.json',
          ]
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},sort_keys=True,separators=(',',':')))
          PY
          )"
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "API_KEY_B64='$API_KEY_B64' OPENAI_KEY_B64='$OPENAI_KEY_B64' RUNTIME_PARITY_B64='$RUNTIME_PARITY_B64' EVENT_NAME='$EVENT_NAME' bash -se" <<'REMOTE'
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            matched=0
            for _ in $(seq 1 60); do
              if RUNTIME_PARITY_B64="$RUNTIME_PARITY_B64" python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path('/home/z/zel-production-current')
          expected=json.loads(base64.b64decode(os.environ['RUNTIME_PARITY_B64']).decode())
          ok=root.exists()
          for rel,want in expected.items():
              p=root/rel
              ok=ok and p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==want
          raise SystemExit(0 if ok else 1)
          PY
              then
                matched=1
                break
              fi
              sleep 2
            done
            if [ "$matched" -ne 1 ]; then
              echo "RUNTIME_PARITY_TIMEOUT" >&2
              exit 71
            fi
          fi
          ROOT=/home/z/zel-production-current
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          export GEMINI_API_KEY="$(printf '%s' "$API_KEY_B64" | base64 -d)"
          export OPENAI_API_KEY="$(printf '%s' "$OPENAI_KEY_B64" | base64 -d)"
          python3 -m backend.production.zel_production_ai_terminal_feedback_v1 >/tmp/zel-ai-explore-feedback.json
          python3 -m backend.production.zel_production_economic_edge_router_v1 --tick >/tmp/zel-ai-explore-router-before.json
          python3 -m backend.production.zel_production_ai_proposal_layer_v1 --policy /home/z/z/ledger/production_ai_feedback_proposal_policy_v1.json --tick >/tmp/zel-ai-explore-proposal.json
          if python3 -m backend.production.zel_production_l2_order_book_data_v1 --append-history >/tmp/zel-ai-explore-l2.json 2>/tmp/zel-ai-explore-l2.err; then
            :
          else
            printf '%s\n' '{"state":"HOLD_L2_NATIVE_FETCH_FAILED","history_appended":false}' >/tmp/zel-ai-explore-l2.json
          fi
          python3 -m backend.production.zel_production_source_acquisition_v1 >/tmp/zel-ai-explore-source-acquisition.json
          python3 -m backend.production.zel_production_economic_edge_router_v1 --tick >/tmp/zel-ai-explore-router-after.json
          python3 -m backend.production.zel_production_ai_admission_materializer_v1 >/tmp/zel-ai-explore-admission.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          feedback=json.loads(Path('/tmp/zel-ai-explore-feedback.json').read_text())
          proposal=json.loads(Path('/tmp/zel-ai-explore-proposal.json').read_text())
          l2=json.loads(Path('/tmp/zel-ai-explore-l2.json').read_text())
          acquisition=json.loads(Path('/tmp/zel-ai-explore-source-acquisition.json').read_text())
          admission=json.loads(Path('/tmp/zel-ai-explore-admission.json').read_text())
          assert feedback['state'] in {'HOLD_AI_TERMINAL_FEEDBACK_NO_NEW_REJECT','PASS_AI_TERMINAL_REJECT_FEEDBACK_APPLIED'}
          allowed={
            'HOLD_AI_PROPOSAL_NOT_REQUIRED','HOLD_AI_PROPOSAL_FACTORY_MISSING',
            'HOLD_AI_PROPOSAL_CALLER_UNAVAILABLE','HOLD_AI_PROPOSAL_CALL_FAILED',
            'HOLD_AI_PROPOSAL_SOURCE_BINDING_REQUIRED','HOLD_AI_PROPOSAL_NO_CANDIDATE',
            'PASS_AI_PROPOSAL_SOURCE_READY',
          }
          assert proposal['state'] in allowed
          if proposal['state']=='HOLD_AI_PROPOSAL_NOT_REQUIRED':
              assert proposal.get('written') is False
          assert l2['state'] in {'PASS_L2_ORDER_BOOK_NATIVE_SNAPSHOT','HOLD_L2_NATIVE_FETCH_FAILED'}
          assert acquisition['state'] in {
              'HOLD_SOURCE_ACQUISITION_NO_AI_PROPOSAL','HOLD_SOURCE_ACQUISITION_REGISTRY_MISSING',
              'HOLD_SOURCE_ACQUISITION_NO_CANDIDATES','HOLD_SOURCE_ACQUISITION_VERIFIED_SOURCE_REQUIRED',
              'PASS_SOURCE_ACQUISITION_PROPOSALS_SOURCE_READY',
          }
          assert admission['state'] in {
              'HOLD_AI_ADMISSION_NO_SOURCE_READY_PROPOSAL','HOLD_AI_ADMISSION_REGISTRY_MISSING',
              'HOLD_AI_ADMISSION_TEMPLATE_REQUIRED','HOLD_AI_ADMISSION_SOURCE_BINDING_REQUIRED',
              'PASS_AI_ADMISSION_CONTRACTS_FROZEN',
          }
          receipt=Path('/home/z/z/ledger/production_ai_edge_proposals_v1.json')
          if receipt.exists():
              row=json.loads(receipt.read_text())
              assert row.get('selection_authority') is False
              assert row.get('promotion_authority') is False
              assert row.get('execution_authority')=='NONE'
              assert row.get('order_authority')=='BLOCKED'
              assert row.get('live_trade_authority')=='BLOCKED'
              assert row.get('exchange_order_submitted') is False
              assert row.get('source_code_mutation_applied') is False
              assert row.get('self_modification_applied') is False
          print(json.dumps({'feedback':feedback,'l2':l2,'proposal':proposal,'acquisition':acquisition,'admission':admission},sort_keys=True))
          PY
          REMOTE
