name: ZEL Production AI Proposal Explore V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_layer_v1.py'
      - 'config/zel_production_ai_proposal_layer_v1.json'
      - 'backend/production/zel_production_source_acquisition_v1.py'
      - 'config/zel_production_source_acquisition_v1.json'
      - 'config/zel_production_source_capability_registry_v1.json'
      - 'backend/production/zel_production_ai_admission_materializer_v1.py'
      - 'config/zel_production_ai_admission_materializer_v1.json'
      - 'config/zel_production_ai_admission_template_registry_v1.json'
      - 'backend/production/zel_production_economic_edge_router_v1.py'
      - 'config/zel_production_economic_edge_router_v1.json'
      - 'backend/production/zel_production_paper_runner_v1.sh'
      - 'tests/test_zel_production_ai_proposal_layer_v1.py'
      - 'tests/test_zel_production_ai_admission_materializer_v1.py'
      - 'tests/test_zel_production_economic_edge_router_v1.py'
      - '.github/workflows/zel-production-ai-proposal-explore-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_ai_proposal_layer_v1.py'
      - 'config/zel_production_ai_proposal_layer_v1.json'
      - 'backend/production/zel_production_source_acquisition_v1.py'
      - 'config/zel_production_source_acquisition_v1.json'
      - 'config/zel_production_source_capability_registry_v1.json'
      - 'backend/production/zel_production_ai_admission_materializer_v1.py'
      - 'config/zel_production_ai_admission_materializer_v1.json'
      - 'config/zel_production_ai_admission_template_registry_v1.json'
      - 'backend/production/zel_production_economic_edge_router_v1.py'
      - 'config/zel_production_economic_edge_router_v1.json'
      - '.github/workflows/zel-production-ai-proposal-explore-v1.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-ai-proposal-explore-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test AI Explore proposal layer
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            backend/production/zel_production_ai_proposal_layer_v1.py \
            backend/production/zel_production_source_acquisition_v1.py \
            backend/production/zel_production_ai_admission_materializer_v1.py \
            backend/production/zel_production_economic_edge_router_v1.py
          bash -n backend/production/zel_production_paper_runner_v1.sh
          PYTHONPATH=. pytest -q \
            tests/test_zel_production_ai_proposal_layer_v1.py \
            tests/test_zel_production_ai_admission_materializer_v1.py \
            tests/test_zel_production_economic_edge_router_v1.py \
            tests/test_zel_production_economic_edge_dynamic_v1.py
      - name: Verify proposal-only AI authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_ai_proposal_layer_v1.json').read_text())
          assert p['mode']=='PAPER'
          assert p['candidate_budget']<=2
          assert p['numeric_threshold_proposals_allowed'] is False
          for k in ('raw_trades_sent','private_code_sent','account_data_sent','credentials_sent'):
              assert p[k] is False
          assert p['selection_authority'] is False and p['promotion_authority'] is False
          assert p['execution_authority']=='NONE'
          assert p['order_authority']=='BLOCKED' and p['live_trade_authority']=='BLOCKED'
          assert p['source_code_mutation_allowed'] is False and p['self_modification_allowed'] is False
          src=Path('backend/production/zel_production_ai_proposal_layer_v1.py').read_text()
          assert 'generativelanguage.googleapis.com' in src
          assert 'BingX' not in src and 'submit_order' not in src
          print('PASS_AI_PROPOSAL_ONLY_AUTHORITY_BOUNDARY')
          PY
      - name: Verify PAPER runner stays network-free from AI Explore
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('backend/production/zel_production_paper_runner_v1.sh').read_text()
          bootstrap=r.index('zel_production_performance_bootstrap_v1')
          router=r.index('zel_production_economic_edge_router_v1')
          alpha=r.index('zel_production_alpha_signal_runner_v1')
          paper=r.index('zel_production_paper_loop_v1')
          improve=r.index('zel_production_improvement_controller_v1')
          pool=r.index('zel_production_survivor_pool_v1')
          assert bootstrap < router < alpha < paper < improve < pool
          for forbidden in (
              'zel_production_ai_proposal_layer_v1',
              'zel_production_source_acquisition_v1',
              'zel_production_ai_admission_materializer_v1',
              'GEMINI_API_KEY',
              'generativelanguage.googleapis.com',
          ):
              assert forbidden not in r
          assert r.count('zel_production_economic_edge_router_v1') == 1
          print('PASS_PAPER_LOOP_AI_EXPLORE_NETWORK_ISOLATION')
          PY
      - name: Verify router cannot treat AI as authority
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('backend/production/zel_production_economic_edge_router_v1.py').read_text()
          assert 'PASS_EDGE_ACQUISITION_AI_PROPOSAL_QUEUE' in src
          assert 'AI_PROPOSAL_PASSED_SOURCE_AVAILABILITY_ONLY' in src
          assert 'FREEZE_AI_PROPOSAL_AND_BUILD_DETERMINISTIC_ADMISSION' in src
          assert 'selection_authority' in src and 'promotion_authority' in src
          assert 'submit_order' not in src and 'https://' not in src
          print('PASS_AI_PROPOSAL_DETERMINISTIC_ROUTER_BOUNDARY')
          PY

  propose-on-vps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run one bounded Explore proposal, source-resolution and admission-materialization tick
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          API_KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "API_KEY_B64='$API_KEY_B64' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          export GEMINI_API_KEY="$(printf '%s' "$API_KEY_B64" | base64 -d)"
          python3 -m backend.production.zel_production_economic_edge_router_v1 --tick >/tmp/zel-ai-explore-router-before.json
          python3 -m backend.production.zel_production_ai_proposal_layer_v1 --tick >/tmp/zel-ai-explore-proposal.json
          python3 -m backend.production.zel_production_source_acquisition_v1 >/tmp/zel-ai-explore-source-acquisition.json
          python3 -m backend.production.zel_production_economic_edge_router_v1 --tick >/tmp/zel-ai-explore-router-after.json
          python3 -m backend.production.zel_production_ai_admission_materializer_v1 >/tmp/zel-ai-explore-admission.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          proposal=json.loads(Path('/tmp/zel-ai-explore-proposal.json').read_text())
          acquisition=json.loads(Path('/tmp/zel-ai-explore-source-acquisition.json').read_text())
          admission=json.loads(Path('/tmp/zel-ai-explore-admission.json').read_text())
          allowed={
            'HOLD_AI_PROPOSAL_NOT_REQUIRED','HOLD_AI_PROPOSAL_FACTORY_MISSING',
            'HOLD_AI_PROPOSAL_CALLER_UNAVAILABLE','HOLD_AI_PROPOSAL_CALL_FAILED',
            'HOLD_AI_PROPOSAL_SOURCE_BINDING_REQUIRED','HOLD_AI_PROPOSAL_NO_CANDIDATE',
            'PASS_AI_PROPOSAL_SOURCE_READY',
          }
          assert proposal['state'] in allowed
          if proposal['state']=='HOLD_AI_PROPOSAL_NOT_REQUIRED':
              assert proposal.get('written') is False
          assert acquisition['state'] in {
              'HOLD_SOURCE_ACQUISITION_NO_AI_PROPOSAL','HOLD_SOURCE_ACQUISITION_REGISTRY_MISSING',
              'HOLD_SOURCE_ACQUISITION_NO_CANDIDATES','HOLD_SOURCE_ACQUISITION_VERIFIED_SOURCE_REQUIRED',
              'PASS_SOURCE_ACQUISITION_PROPOSALS_SOURCE_READY',
          }
          assert admission['state'] in {
              'HOLD_AI_ADMISSION_NO_SOURCE_READY_PROPOSAL','HOLD_AI_ADMISSION_REGISTRY_MISSING',
              'HOLD_AI_ADMISSION_TEMPLATE_REQUIRED','HOLD_AI_ADMISSION_SOURCE_BINDING_REQUIRED',
              'PASS_AI_ADMISSION_CONTRACTS_FROZEN',
          }
          receipt=Path('/home/z/z/ledger/production_ai_edge_proposals_v1.json')
          if receipt.exists():
              row=json.loads(receipt.read_text())
              assert row.get('selection_authority') is False
              assert row.get('promotion_authority') is False
              assert row.get('execution_authority')=='NONE'
              assert row.get('order_authority')=='BLOCKED'
              assert row.get('live_trade_authority')=='BLOCKED'
              assert row.get('exchange_order_submitted') is False
              assert row.get('source_code_mutation_applied') is False
              assert row.get('self_modification_applied') is False
          print(json.dumps({'proposal':proposal,'acquisition':acquisition,'admission':admission},sort_keys=True))
          PY
          REMOTE
