name: ZEL Production AI Proposal Secret Bind V1

on:
  workflow_run:
    workflows: ["ZEL Production Isolated Deploy V1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-ai-proposal-secret-bind-v1
  cancel-in-progress: false

jobs:
  bind-and-prove:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Validate AI environment contract
        run: |
          set -euo pipefail
          grep -Fq 'EnvironmentFile=-/etc/zel/production-ai.env' deploy/systemd/zel-production-paper-loop-v1.service
          python -m py_compile backend/production/zel_production_ai_proposal_layer_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_ai_proposal_layer_v1.json').read_text())
          assert p['mode']=='PAPER'
          assert p['selection_authority'] is False and p['promotion_authority'] is False
          assert p['execution_authority']=='NONE'
          assert p['order_authority']=='BLOCKED' and p['live_trade_authority']=='BLOCKED'
          print('PASS_AI_SECRET_STATIC_CONTRACT')
          PY
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Install root-only Gemini environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY}" || { echo 'GEMINI_API_KEY_NOT_CONFIGURED'; exit 4; }
          umask 077
          trap 'rm -f /tmp/zel-production-ai.env' EXIT
          printf 'GEMINI_API_KEY=%s\n' "${GEMINI_API_KEY}" > /tmp/zel-production-ai.env
          chmod 600 /tmp/zel-production-ai.env
          scp -i ~/.ssh/vps_key /tmp/zel-production-ai.env \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel-production-ai.env"
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" = 0 ]; then
            INSTALL='install'
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            INSTALL='sudo install'
          else
            echo 'AI_ENV_PRIVILEGE_UNAVAILABLE' >&2
            exit 5
          fi
          $INSTALL -o root -g root -m 0600 /tmp/zel-production-ai.env /etc/zel/production-ai.env
          rm -f /tmp/zel-production-ai.env
          test "$(stat -c '%a' /etc/zel/production-ai.env)" = 600
          test "$(stat -c '%U:%G' /etc/zel/production-ai.env)" = root:root
          grep -q '^GEMINI_API_KEY=.' /etc/zel/production-ai.env
          REMOTE
      - name: Restart PAPER loop and prove real AI proposal handoff
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          CURRENT=/home/z/zel-production-current
          LEDGER=/home/z/z/ledger
          PROPOSAL="$LEDGER/production_ai_edge_proposals_v1.json"
          EDGE="$LEDGER/production_economic_edge_acquisition_v1.json"
          EVENTS="$LEDGER/production_events_v1.sqlite"
          RECEIPT=/tmp/zel-production-ai-proposal-secret-bind-receipt.json

          if [ "$(id -u)" = 0 ]; then
            SYSTEMCTL='systemctl'
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            SYSTEMCTL='sudo systemctl'
          else
            echo 'AI_SERVICE_PRIVILEGE_UNAVAILABLE' >&2
            exit 6
          fi

          test -f "$CURRENT/backend/production/zel_production_ai_proposal_layer_v1.py"
          test -f "$CURRENT/config/zel_production_ai_proposal_layer_v1.json"
          grep -Fq 'zel_production_ai_proposal_layer_v1' "$CURRENT/backend/production/zel_production_paper_runner_v1.sh"
          grep -Fq 'EnvironmentFile=-/etc/zel/production-ai.env' /etc/systemd/system/zel-production-paper-loop-v1.service

          count_events() {
            python3 - "$EVENTS" <<'PY'
          import sqlite3,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.exists():
              print(0); raise SystemExit
          db=sqlite3.connect(p)
          try:
              found=db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='trade_events'").fetchone()
              print(db.execute('SELECT COUNT(*) FROM trade_events').fetchone()[0] if found else 0)
          finally:
              db.close()
          PY
          }

          # A previous missing-key failure is an ephemeral proposal receipt, not a
          # trading ledger. Clear only that exact failure so the newly installed
          # secret can be exercised immediately rather than waiting for cooldown.
          python3 - "$PROPOSAL" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.exists():
              raise SystemExit
          try: row=json.loads(p.read_text())
          except Exception: raise SystemExit
          if row.get('state')=='HOLD_AI_PROPOSAL_CALL_FAILED' and 'GEMINI_API_KEY_MISSING' in str(row.get('error_code') or ''):
              p.unlink()
          PY

          BEFORE=$(count_events)
          $SYSTEMCTL daemon-reload
          $SYSTEMCTL restart zel-production-paper-loop-v1.service

          ok=false
          for _ in $(seq 1 36); do
            if [ -f "$PROPOSAL" ]; then
              if python3 - "$PROPOSAL" <<'PY'
          import json,sys
          from pathlib import Path
          row=json.loads(Path(sys.argv[1]).read_text())
          assert row.get('schema_version')=='zel.production_ai_proposal_layer.v1'
          assert row.get('ai_call_succeeded') is True
          assert row.get('selection_authority') is False and row.get('promotion_authority') is False
          assert row.get('execution_authority')=='NONE'
          assert row.get('order_authority')=='BLOCKED' and row.get('live_trade_authority')=='BLOCKED'
          PY
              then
                ok=true
                break
              fi
            fi
            sleep 5
          done
          [ "$ok" = true ] || { echo 'AI_PROPOSAL_REAL_CALL_NOT_PROVEN' >&2; exit 7; }
          test "$($SYSTEMCTL is-active zel-production-paper-loop-v1.service)" = active
          AFTER=$(count_events)
          DELTA=$((AFTER-BEFORE))
          test "$DELTA" -eq 0

          PYTHONPATH="$CURRENT" python3 - "$PROPOSAL" "$EDGE" "$DELTA" "$RECEIPT" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          proposal=json.loads(Path(sys.argv[1]).read_text())
          edge=json.loads(Path(sys.argv[2]).read_text()) if Path(sys.argv[2]).exists() else {}
          delta=int(sys.argv[3])
          ready=int(proposal.get('source_ready_count') or 0)
          count=int(proposal.get('proposal_count') or 0)
          if ready:
              assert edge.get('state')=='PASS_EDGE_ACQUISITION_AI_PROPOSAL_QUEUE',edge
          elif count:
              assert edge.get('state')=='HOLD_EDGE_AI_PROPOSAL_SOURCE_BINDING_REQUIRED',edge
          else:
              assert edge.get('state')=='HOLD_EDGE_ACQUISITION_CATALOG_EXHAUSTED',edge
          out={
              'schema_version':'zel.production_ai_proposal_secret_bind_receipt.v1',
              'state':'PASS_AI_PROPOSAL_SECRET_BOUND_AND_REAL_CALL_PROVEN',
              'gemini_key_present':True,
              'gemini_key_value_exposed':False,
              'service_active':True,
              'proposal_state':proposal.get('state'),
              'proposal_count':count,
              'source_ready_count':ready,
              'edge_state':edge.get('state'),
              'trade_event_delta':delta,
              'selection_authority':False,
              'promotion_authority':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'live_trade_authority':'BLOCKED',
              'updated_at_ms':int(time.time()*1000),
          }
          out['receipt_sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(sys.argv[4]).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ('state','proposal_state','proposal_count','source_ready_count','edge_state','trade_event_delta','receipt_sha256')},sort_keys=True))
          PY
          REMOTE
      - name: Download proof receipt
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel-production-ai-proposal-secret-bind-receipt.json" \
            /tmp/zel-production-ai-proposal-secret-bind-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: zel-production-ai-proposal-secret-bind-receipt
          path: /tmp/zel-production-ai-proposal-secret-bind-receipt.json
          if-no-files-found: error
          retention-days: 30
