name: ZEL Production AI Secret Bind CI V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/systemd/zel-production-paper-loop-v1.service'
      - '.github/workflows/zel-production-ai-proposal-secret-bind-v1.yml'
      - '.github/workflows/zel-production-ai-secret-bind-ci-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify secret bind contract without exposing a secret
        run: |
          set -euo pipefail
          unit=deploy/systemd/zel-production-paper-loop-v1.service
          wf=.github/workflows/zel-production-ai-proposal-secret-bind-v1.yml
          grep -Fq 'EnvironmentFile=-/etc/zel/production-ai.env' "$unit"
          grep -Fq 'GEMINI_API_KEY:' "$wf"
          grep -Fq 'secrets.GEMINI_API_KEY' "$wf"
          grep -Fq 'install -o root -g root -m 0600' "$wf"
          grep -Fq 'PASS_AI_PROPOSAL_SECRET_BOUND_AND_REAL_CALL_PROVEN' "$wf"
          grep -Fq "trade_event_delta':delta" "$wf"
          if grep -Eq 'echo[^\n]*\$\{?GEMINI_API_KEY\}?|cat[^\n]*/etc/zel/production-ai\.env' "$wf"; then
            echo 'SECRET_OUTPUT_PATH_FORBIDDEN' >&2
            exit 3
          fi
          python -m py_compile backend/production/zel_production_ai_proposal_layer_v1.py
          bash -n backend/production/zel_production_paper_runner_v1.sh
          echo PASS_AI_SECRET_BIND_STATIC_CONTRACT
