name: ZEL Production Alpha Producer V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_trend_momentum_v1.py'
      - 'backend/production/zel_production_alpha_signal_runner_v1.py'
      - 'backend/production/zel_production_paper_runner_v1.sh'
      - 'backend/production/zel_production_pipeline_audit_v2.py'
      - 'config/zel_production_alpha_factory_v1.json'
      - 'tests/test_zel_production_trend_momentum_v1.py'
      - 'tests/test_zel_production_alpha_signal_runner_v1.py'
      - '.github/workflows/zel-production-alpha-producer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-alpha-producer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test/runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile producer chain
        run: |
          python -m py_compile \
            backend/production/zel_production_trend_momentum_v1.py \
            backend/production/zel_production_alpha_signal_runner_v1.py \
            backend/production/zel_production_active_alpha_adapter_v1.py \
            backend/production/zel_production_bingx_freshness_v1.py \
            backend/production/zel_production_pipeline_audit_v2.py
          bash -n backend/production/zel_production_paper_runner_v1.sh
          python -m json.tool config/zel_production_alpha_factory_v1.json >/dev/null
      - name: Run focused producer tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_zel_production_trend_momentum_v1.py \
            tests/test_zel_production_alpha_signal_runner_v1.py
      - name: Verify no-alpha runner path without network
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from backend.production.zel_production_alpha_signal_runner_v1 import run_once

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              cfg={
                  'schema_version':'zel.production_alpha_factory.v1',
                  'mode':'PAPER',
                  'families':{},
                  'active_authority_path':str(root/'missing-authority.json'),
                  'active_signal_path':str(root/'signal.json'),
                  'order_authority':'BLOCKED',
                  'live_trade_authority':'BLOCKED',
              }
              def forbidden(*args, **kwargs):
                  raise AssertionError('network/generator called on SAFE-IDLE')
              r=run_once(factory=cfg, now_ms=1_000, signal_generator=forbidden)
              assert r['state']=='HOLD_NO_EXECUTABLE_ALPHA'
              assert r['network_called'] is False
              assert r['signal_written'] is False
              assert not (root/'signal.json').exists()
              assert r['exchange_order_submitted'] is False
          print('PASS_SAFE_IDLE_ALPHA_PRODUCER_NO_NETWORK')
          PY
      - name: Run full production pipeline audit
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python backend/production/zel_production_pipeline_audit_v2.py \
            --repo-root . \
            --out out/zel_production_pipeline_audit_v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/zel_production_pipeline_audit_v2.json').read_text())
          assert r['state']=='PASS_PRODUCTION_COMPLETION_PIPELINE_AUDIT'
          assert all(r['checks'].values())
          b=r['bottleneck_findings']
          assert b['runner_stage_order']=='ALPHA_PRODUCER_THEN_SOURCE_THEN_PAPER_THEN_IMPROVEMENT'
          assert b['primary_alpha_family']=='trend_momentum'
          assert b['carry_flow']=='PENDING_PRODUCTION_DATA_BINDING'
          assert b['relative_value_psa']=='PENDING_PRODUCTION_DATA_BINDING'
          assert b['legacy_strategy_role']=='MATERIAL_ONLY'
          print('PASS_ALPHA_PRODUCER_PIPELINE_AUDIT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-production-alpha-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/zel_production_pipeline_audit_v2.json
          if-no-files-found: error
          retention-days: 30
