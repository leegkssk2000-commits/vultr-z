name: ZEL Production BingX Market Sources V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_bingx_market_sources_v1.py'
      - 'config/zel_production_bingx_market_sources_v1.json'
      - 'tests/test_zel_production_bingx_market_sources_v1.py'
      - '.github/workflows/zel-production-bingx-market-sources-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_bingx_market_sources_v1.py'
      - 'config/zel_production_bingx_market_sources_v1.json'
      - '.github/workflows/zel-production-bingx-market-sources-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-bingx-market-sources-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and unit test fail-closed verifier
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile backend/production/zel_production_bingx_market_sources_v1.py
          PYTHONPATH=. pytest -q tests/test_zel_production_bingx_market_sources_v1.py
      - name: Probe BingX public response shapes
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY' | tee out/schema_probe.json
          import json,time,urllib.parse,urllib.request
          base='https://open-api.bingx.com'
          rows={}
          for name,path,params in [
              ('klines','/openApi/swap/v3/quote/klines',{'symbol':'BTC-USDT','interval':'15m','limit':2}),
              ('depth','/openApi/swap/v2/quote/depth',{'symbol':'BTC-USDT','limit':5}),
          ]:
              p=dict(params); p['timestamp']=int(time.time()*1000)
              url=base+path+'?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(url,headers={'User-Agent':'ZEL-PAPER-RESEARCH/1.0','X-SOURCE-KEY':'BX-AI-SKILL'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  payload=json.load(r)
              data=payload.get('data') if isinstance(payload,dict) else None
              sample=None
              if isinstance(data,list) and data:
                  sample=data[0]
              elif isinstance(data,dict):
                  sample={k:(type(v).__name__,len(v) if isinstance(v,(list,dict,str)) else None) for k,v in list(data.items())[:12]}
              rows[name]={
                  'code':payload.get('code') if isinstance(payload,dict) else None,
                  'data_type':type(data).__name__,
                  'data_len':len(data) if isinstance(data,(list,dict,str)) else None,
                  'sample_type':type(sample).__name__,
                  'sample_len':len(sample) if isinstance(sample,(list,dict,str)) else None,
                  'sample':sample,
              }
          print(json.dumps(rows,sort_keys=True))
          PY
      - name: Live-smoke BingX public OHLCV volume and L2 endpoints
        run: |
          set -euo pipefail
          mkdir -p out
          set +e
          python -m backend.production.zel_production_bingx_market_sources_v1 \
            --policy config/zel_production_bingx_market_sources_v1.json \
            --output out/bingx_market_sources_receipt.json \
            >out/live_stdout.txt 2>out/live_stderr.txt
          rc=$?
          set -e
          cat out/live_stdout.txt || true
          cat out/live_stderr.txt >&2 || true
          [ "$rc" -eq 0 ] || exit "$rc"
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/bingx_market_sources_receipt.json').read_text())
          assert row['state']=='PASS_BINGX_PUBLIC_MARKET_SOURCES_VERIFIED'
          assert row['verified_sources']==['ohlcv','volume','l2_order_book']
          assert row['source_bindings']=={
              'ohlcv_source_bound':True,
              'volume_source_bound':True,
              'l2_order_book_source_bound':True,
          }
          assert row['history_coverage_bound'] is False
          assert row['economic_signal_enabled'] is False
          assert row['selection_authority'] is False
          assert row['promotion_authority'] is False
          assert row['execution_authority']=='NONE'
          assert row['order_authority']=='BLOCKED'
          assert row['live_trade_authority']=='BLOCKED'
          assert row['exchange_order_submitted'] is False
          assert len(row['symbols'])==2
          print(row['state'],row['verified_sources'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-bingx-market-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
