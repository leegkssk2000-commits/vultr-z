name: ZEL Production BingX WS Microstructure V2

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_bingx_ws_microstructure_v2.py'
      - 'config/zel_production_bingx_ws_microstructure_v2.json'
      - 'tests/test_zel_production_bingx_ws_microstructure_v2.py'
      - '.github/workflows/zel-production-bingx-ws-microstructure-v2.yml'
  push:
    branches: [master]
    paths:
      - 'backend/production/zel_production_bingx_ws_microstructure_v2.py'
      - 'config/zel_production_bingx_ws_microstructure_v2.json'
      - '.github/workflows/zel-production-bingx-ws-microstructure-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '9,24,39,54 * * * *'

permissions:
  contents: read

concurrency:
  group: zel-production-bingx-ws-microstructure-v2
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test v2
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile backend/production/zel_production_bingx_ws_microstructure_v2.py
          PYTHONPATH=. pytest -q tests/test_zel_production_bingx_ws_microstructure_v2.py
      - name: Verify fail-closed v2 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('config/zel_production_bingx_ws_microstructure_v2.json').read_text())
          assert c['streams']['depth']=='{symbol}@depth20@200ms'
          assert c['streams']['trade']=='{symbol}@trade'
          assert c['streams']['kline']=='{symbol}@kline_1m'
          assert c['economic_signal_enabled'] is False
          assert c['selection_authority'] is False and c['promotion_authority'] is False
          assert c['execution_authority']=='NONE' and c['order_authority']=='BLOCKED'
          assert c['live_trade_authority']=='BLOCKED' and c['exchange_order_submitted'] is False
          print('PASS_BINGX_WS_MICROSTRUCTURE_V2_STATIC')
          PY

  supervise-vps:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Wait runtime parity and supervise v2 collector
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          RUNTIME_PARITY_B64="$(python3 - <<'PY' | base64 -w0
          import hashlib,json
          from pathlib import Path
          files=[
            'backend/production/zel_production_bingx_ws_microstructure_v1.py',
            'backend/production/zel_production_bingx_ws_microstructure_v2.py',
            'config/zel_production_bingx_ws_microstructure_v2.json',
          ]
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},sort_keys=True,separators=(',',':')))
          PY
          )"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "RUNTIME_PARITY_B64='$RUNTIME_PARITY_B64' bash -se" > out/ws_microstructure_v2_receipt.json <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          HB=/home/z/z/ledger/production_bingx_ws_microstructure_heartbeat_v2.json
          PID=/home/z/z/ledger/production_bingx_ws_microstructure_v2.pid
          LOG=/home/z/z/ledger/production_bingx_ws_microstructure_v2.log
          export ROOT RUNTIME_PARITY_B64 HB
          matched=0
          for _ in $(seq 1 90); do
            if python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          expected=json.loads(base64.b64decode(os.environ['RUNTIME_PARITY_B64']).decode())
          ok=root.exists()
          for rel,want in expected.items():
              p=root/rel; got=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              ok=ok and got==want
          raise SystemExit(0 if ok else 1)
          PY
            then matched=1; break; fi
            sleep 2
          done
          [ "$matched" -eq 1 ] || { echo WS_MICRO_V2_RUNTIME_PARITY_TIMEOUT >&2; exit 71; }
          expected_source="$(sha256sum "$ROOT/backend/production/zel_production_bingx_ws_microstructure_v2.py" | awk '{print $1}')"
          expected_dep="$(sha256sum "$ROOT/backend/production/zel_production_bingx_ws_microstructure_v1.py" | awk '{print $1}')"
          expected_policy="$(sha256sum "$ROOT/config/zel_production_bingx_ws_microstructure_v2.json" | awk '{print $1}')"
          healthy=0
          if [ -f "$HB" ] && EXPECTED_SOURCE="$expected_source" EXPECTED_DEP="$expected_dep" EXPECTED_POLICY="$expected_policy" python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          try:r=json.loads(Path(os.environ['HB']).read_text())
          except Exception:raise SystemExit(1)
          now=int(time.time()*1000)
          ok=(r.get('source_sha256')==os.environ['EXPECTED_SOURCE'] and r.get('dependency_sha256')==os.environ['EXPECTED_DEP'] and r.get('policy_sha256')==os.environ['EXPECTED_POLICY'] and now-int(r.get('updated_at_ms') or 0)<=30000 and r.get('execution_authority')=='NONE' and r.get('order_authority')=='BLOCKED')
          raise SystemExit(0 if ok else 1)
          PY
          then healthy=1; fi
          if [ "$healthy" -ne 1 ]; then
            if [ -f "$PID" ]; then
              oldpid="$(cat "$PID" 2>/dev/null || true)"
              if [[ "$oldpid" =~ ^[0-9]+$ ]] && [ -r "/proc/$oldpid/cmdline" ]; then
                cmd="$(tr '\0' ' ' < "/proc/$oldpid/cmdline" || true)"
                if [[ "$cmd" == *"zel_production_bingx_ws_microstructure_v2"* ]]; then
                  kill "$oldpid" 2>/dev/null || true
                  for _ in $(seq 1 10); do kill -0 "$oldpid" 2>/dev/null || break; sleep 1; done
                fi
              fi
            fi
            cd "$ROOT"
            mkdir -p "$(dirname "$LOG")"
            setsid nohup env PYTHONPATH="$ROOT" python3 -m backend.production.zel_production_bingx_ws_microstructure_v2 \
              --policy config/zel_production_bingx_ws_microstructure_v2.json >> "$LOG" 2>&1 </dev/null &
          fi
          ready=0
          for _ in $(seq 1 75); do
            if [ -f "$HB" ] && EXPECTED_SOURCE="$expected_source" EXPECTED_DEP="$expected_dep" EXPECTED_POLICY="$expected_policy" python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          r=json.loads(Path(os.environ['HB']).read_text()); now=int(time.time()*1000)
          streams=r.get('streams') or {}
          ok=(
              r.get('state')=='PASS_BINGX_WS_MICROSTRUCTURE_V2_ACCUMULATING' and
              r.get('source_sha256')==os.environ['EXPECTED_SOURCE'] and r.get('dependency_sha256')==os.environ['EXPECTED_DEP'] and r.get('policy_sha256')==os.environ['EXPECTED_POLICY'] and
              now-int(r.get('updated_at_ms') or 0)<=30000 and
              all(int((streams.get(s) or {}).get('messages') or 0)>0 for s in ('depth','trade','kline')) and
              r.get('history_gate_decision')=='UNSET_BY_COLLECTOR' and r.get('economic_signal_enabled') is False and
              r.get('selection_authority') is False and r.get('promotion_authority') is False and
              r.get('execution_authority')=='NONE' and r.get('order_authority')=='BLOCKED' and r.get('live_trade_authority')=='BLOCKED' and r.get('exchange_order_submitted') is False and int(r.get('protected_mutations') or 0)==0
          )
          raise SystemExit(0 if ok else 1)
          PY
            then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          hb=Path(os.environ['HB']); out={'state':'HOLD_BINGX_WS_MICROSTRUCTURE_V2_NOT_READY','heartbeat':None,'log_tail':[],'execution_authority':'NONE','order_authority':'BLOCKED','live_trade_authority':'BLOCKED','exchange_order_submitted':False,'protected_mutations':0}
          try:out['heartbeat']=json.loads(hb.read_text())
          except Exception:pass
          log=Path('/home/z/z/ledger/production_bingx_ws_microstructure_v2.log')
          try:out['log_tail']=log.read_text(errors='replace').splitlines()[-80:]
          except Exception:pass
          print(json.dumps(out,sort_keys=True))
          PY
            exit 72
          fi
          cat "$HB"
          REMOTE
      - name: Verify v2 receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          r=json.loads(Path('out/ws_microstructure_v2_receipt.json').read_text())
          assert r['state']=='PASS_BINGX_WS_MICROSTRUCTURE_V2_ACCUMULATING', r
          assert all(r['streams'][s]['messages']>0 for s in ('depth','trade','kline'))
          assert r['history_gate_decision']=='UNSET_BY_COLLECTOR' and r['economic_signal_enabled'] is False
          assert r['selection_authority'] is False and r['promotion_authority'] is False
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          assert r['live_trade_authority']=='BLOCKED' and r['exchange_order_submitted'] is False and r['protected_mutations']==0
          assert int(time.time()*1000)-r['updated_at_ms']<=30000
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-bingx-ws-microstructure-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ws_microstructure_v2_receipt.json
          if-no-files-found: error
          retention-days: 30
