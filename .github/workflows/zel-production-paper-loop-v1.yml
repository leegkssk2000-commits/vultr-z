name: ZEL Production PAPER Loop V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_paper_loop_v1.py'
      - 'backend/production/zel_production_paper_source_adapter_v1.py'
      - 'backend/production/zel_production_paper_runner_v1.sh'
      - 'backend/production/zel_production_auto_cycle_supervisor_v1.py'
      - 'backend/production/zel_production_owner_binding_v1.py'
      - 'backend/production/zel_production_spine_v1.py'
      - 'tests/test_zel_production_paper_loop_v1.py'
      - 'tests/test_zel_production_paper_source_adapter_v1.py'
      - 'tests/test_zel_production_spine_v1.py'
      - 'deploy/systemd/zel-production-paper-loop-v1.service'
      - '.github/workflows/zel-production-paper-loop-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PAPER source and loop chain
        run: |
          python -m py_compile \
            backend/production/zel_production_paper_source_adapter_v1.py \
            backend/production/zel_production_paper_loop_v1.py \
            backend/production/zel_production_auto_cycle_supervisor_v1.py \
            backend/production/zel_production_owner_binding_v1.py \
            backend/production/zel_production_spine_v1.py
          bash -n backend/production/zel_production_paper_runner_v1.sh
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run PAPER source and loop regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_zel_production_paper_source_adapter_v1.py \
            tests/test_zel_production_paper_loop_v1.py \
            tests/test_zel_production_spine_v1.py
      - name: Assert PAPER-only daemon safety contract
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('backend/production/zel_production_paper_source_adapter_v1.py').read_text()
          loop = Path('backend/production/zel_production_paper_loop_v1.py').read_text()
          runner = Path('backend/production/zel_production_paper_runner_v1.sh').read_text()
          unit = Path('deploy/systemd/zel-production-paper-loop-v1.service').read_text()

          for invariant in (
              'PAPER_LOOP_REJECT_NON_PAPER_MODE',
              'exchange_order_submitted',
              'strategy_mutation_applied',
              'self_modification_applied',
              'live_execution',
              'CIRCUIT_OPEN',
              'PAPER_INPUT_UNCHANGED',
          ):
              assert invariant in loop, invariant
          assert 'mode != "PAPER"' in loop

          assert 'NO_VALIDATED_ALPHA' in adapter
          assert 'ACTIVE_ALPHA_DATA_RISK_SIZING_BINDING_REQUIRED' in adapter
          assert 'UNBOUND_FAIL_CLOSED' in adapter
          assert 'backend/engine/market_data_service.py' in adapter
          assert 'backend/engine/risk_engine.py' in adapter

          assert 'zel_production_paper_source_adapter_v1' in runner
          assert 'zel_production_paper_loop_v1' in runner
          assert '--once' in runner
          assert 'exit 2' in runner

          assert 'RestartPreventExitStatus=2' in unit
          assert 'NoNewPrivileges=true' in unit
          assert 'ProtectSystem=strict' in unit
          assert 'ReadWritePaths=/home/zel/apps/zel/ledger' in unit
          assert 'backend/production/zel_production_paper_runner_v1.sh' in unit
          print('PASS_PRODUCTION_PAPER_SOURCE_BINDING_CONTRACT')
          PY
