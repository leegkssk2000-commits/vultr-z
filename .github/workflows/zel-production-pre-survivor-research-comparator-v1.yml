name: ZEL Production Pre-Survivor Research Comparator V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_pre_survivor_research_comparator_v1.py'
      - 'backend/production/zel_production_pre_survivor_research_controller_v1.py'
      - 'backend/production/zel_production_pre_survivor_challenger_queue_v1.py'
      - 'backend/production/zel_production_pre_survivor_ai_value_audit_v1.py'
      - 'config/zel_production_pre_survivor_research_comparator_v1.json'
      - 'config/zel_production_pre_survivor_research_controller_v1.json'
      - 'config/zel_production_pre_survivor_challenger_queue_v1.json'
      - 'config/zel_production_ai_pre_survivor_research_next_hypothesis_v1.json'
      - 'config/zel_production_pre_survivor_ai_value_audit_v1.json'
      - 'tests/test_zel_production_pre_survivor_research_comparator_v1.py'
      - 'tests/test_zel_production_pre_survivor_research_controller_v1.py'
      - 'tests/test_zel_production_pre_survivor_challenger_queue_v1.py'
      - 'tests/test_zel_production_pre_survivor_ai_value_audit_v1.py'
      - '.github/workflows/zel-production-pre-survivor-research-comparator-v1.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-production-pre-survivor-research-comparator-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test research closed loop
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            backend/production/zel_production_pre_survivor_research_comparator_v1.py \
            backend/production/zel_production_pre_survivor_research_controller_v1.py \
            backend/production/zel_production_pre_survivor_challenger_queue_v1.py \
            backend/production/zel_production_pre_survivor_ai_value_audit_v1.py
          PYTHONPATH=. pytest -q \
            tests/test_zel_production_pre_survivor_research_comparator_v1.py \
            tests/test_zel_production_pre_survivor_research_controller_v1.py \
            tests/test_zel_production_pre_survivor_challenger_queue_v1.py \
            tests/test_zel_production_pre_survivor_ai_value_audit_v1.py
      - name: Verify PAPER-only isolated generational boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_pre_survivor_research_comparator_v1.json').read_text())
          c=json.loads(Path('config/zel_production_pre_survivor_research_controller_v1.json').read_text())
          n=json.loads(Path('config/zel_production_ai_pre_survivor_research_next_hypothesis_v1.json').read_text())
          q=json.loads(Path('config/zel_production_pre_survivor_challenger_queue_v1.json').read_text())
          a=json.loads(Path('config/zel_production_pre_survivor_ai_value_audit_v1.json').read_text())
          assert p['mode']=='PAPER' and c['mode']=='PAPER' and n['mode']=='PAPER' and q['mode']=='PAPER' and a['mode']=='PAPER'
          assert p['comparison_role']=='RESEARCH_ONLY_NOT_ROUTE'
          assert a['value_role']=='OBSERVER_ONLY_REALIZED_RESEARCH_VALUE_NOT_ROUTE'
          assert p['reference_feedback_path']==c['research_feedback_path']==q['reference_feedback_path']
          assert n['feedback_path']==c['research_feedback_path']
          assert n['output_path']==q['input_path']==a['next_hypothesis_path']
          assert q['output_path']==p['next_hypothesis_path']
          assert p['output_path']==a['comparison_path']
          assert c['incumbent_path']==a['incumbent_path']
          isolated={
              p['challenger_contract_state_path'],p['challenger_history_path'],p['challenger_economic_path'],
              p['challenger_evidence_path'],p['output_path'],c['research_feedback_path'],c['incumbent_path'],q['output_path'],
              a['history_path'],a['output_path'],
          }
          active={
              '/home/z/z/ledger/production_ai_admission_contracts_v1.json',
              '/home/z/z/ledger/production_ai_admission_observations_v1.ndjson',
              '/home/z/z/ledger/production_ai_admission_economic_v1.json',
          }
          assert len(isolated)==10 and not (isolated & active)
          for row in (p,c,n,q,a):
              assert row['selection_authority'] is False
              assert row['promotion_authority'] is False
              assert row['execution_authority']=='NONE'
              assert row['order_authority']=='BLOCKED'
              assert row['live_trade_authority']=='BLOCKED'
              assert row['exchange_order_submitted'] is False
              assert row['source_code_mutation_allowed'] is False
              assert row['self_modification_allowed'] is False
          comp=Path('backend/production/zel_production_pre_survivor_research_comparator_v1.py').read_text()
          ctrl=Path('backend/production/zel_production_pre_survivor_research_controller_v1.py').read_text()
          queue=Path('backend/production/zel_production_pre_survivor_challenger_queue_v1.py').read_text()
          audit=Path('backend/production/zel_production_pre_survivor_ai_value_audit_v1.py').read_text()
          workflow=Path('.github/workflows/zel-production-pre-survivor-research-comparator-v1.yml').read_text()
          for token in ('trade_count','win_rate_pct','net_expectancy','profit_factor','net_pnl','max_dd_pct'):
              assert token in comp and token in ctrl and token in audit
          assert 'produce_challenger_evidence' in comp
          assert 'materialize_tick' in comp
          assert 'executor_tick' in comp
          assert 'update_incumbent' in ctrl
          assert 'prepare_reference' in ctrl
          assert 'TERMINAL_REJECT' in queue and 'candidate_budget' in queue
          assert 'audit_tick' in workflow
          assert 'production_pre_survivor_ai_value_history_v1.ndjson' in workflow
          assert 'ai_value_state' in workflow
          assert 'workflow_run:' not in workflow
          assert 'submit_order' not in comp and 'submit_order' not in ctrl and 'submit_order' not in queue and 'submit_order' not in audit
          assert 'https://' not in comp and 'https://' not in ctrl and 'https://' not in queue and 'https://' not in audit
          print('PASS_PRE_SURVIVOR_RESEARCH_GENERATIONAL_QUEUE_WITH_AI_VALUE_AUDIT_BOUNDARY')
          PY

  run-on-vps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run one bounded pre-survivor generational research tick
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          test -n "$GEMINI_API_KEY"
          mkdir -p out
          API_KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          RUNTIME_PARITY_B64="$(python3 - <<'PY' | base64 -w0
          import hashlib,json
          from pathlib import Path
          files=[
            'backend/production/zel_production_pre_survivor_research_comparator_v1.py',
            'backend/production/zel_production_pre_survivor_research_controller_v1.py',
            'backend/production/zel_production_pre_survivor_challenger_queue_v1.py',
            'backend/production/zel_production_pre_survivor_ai_value_audit_v1.py',
            'backend/production/zel_production_ai_pre_survivor_next_hypothesis_v1.py',
            'backend/production/zel_production_ai_admission_materializer_v1.py',
            'backend/production/zel_production_ai_admission_executor_v2.py',
            'backend/production/zel_production_ai_admission_executor_v3.py',
            'backend/production/zel_production_pre_survivor_progress_v1.py',
            'config/zel_production_pre_survivor_research_comparator_v1.json',
            'config/zel_production_pre_survivor_research_controller_v1.json',
            'config/zel_production_pre_survivor_challenger_queue_v1.json',
            'config/zel_production_ai_pre_survivor_research_next_hypothesis_v1.json',
            'config/zel_production_pre_survivor_ai_value_audit_v1.json',
            'config/zel_production_ai_proposal_layer_pre_survivor_v1.json',
            'config/zel_production_ai_admission_materializer_v1.json',
            'config/zel_production_ai_admission_executor_v1.json',
            'config/zel_production_ai_admission_template_registry_v1.json',
            'config/zel_production_source_capability_registry_v1.json',
          ]
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},sort_keys=True,separators=(',',':')))
          PY
          )"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "API_KEY_B64='$API_KEY_B64' RUNTIME_PARITY_B64='$RUNTIME_PARITY_B64' bash -se" > out/pre_survivor_research_vps_receipt.json <<'REMOTE'
          set -euo pipefail
          ROOT=/home/z/zel-production-current
          export ROOT RUNTIME_PARITY_B64
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          expected=json.loads(base64.b64decode(os.environ['RUNTIME_PARITY_B64']).decode())
          bad=[]
          for rel,want in expected.items():
              p=root/rel
              got=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              if got!=want:
                  bad.append({'path':rel,'got':got,'want':want})
          if bad:
              raise SystemExit('RUNTIME_PARITY_MISMATCH:'+json.dumps(bad,sort_keys=True))
          PY
          cd "$ROOT"
          export PYTHONPATH="$ROOT"
          export GEMINI_API_KEY="$(printf '%s' "$API_KEY_B64" | base64 -d)"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from backend.production.zel_production_improvement_controller_v1 import atomic_json_write
          from backend.production.zel_production_pre_survivor_ai_value_audit_v1 import audit_tick, validate_policy as validate_audit_policy
          active=[
              Path('/home/z/z/ledger/production_ai_admission_contracts_v1.json'),
              Path('/home/z/z/ledger/production_ai_admission_observations_v1.ndjson'),
              Path('/home/z/z/ledger/production_ai_admission_economic_v1.json'),
          ]
          def digests():
              out={}
              for p in active:
                  out[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              return out
          def run_json(args):
              raw=subprocess.check_output(args,text=True).strip().splitlines()[-1]
              return json.loads(raw)
          def read_object(path, required=True):
              if not path.is_file():
                  if required:
                      raise SystemExit('PRE_SURVIVOR_AI_VALUE_SOURCE_MISSING:'+str(path))
                  return None
              row=json.loads(path.read_text())
              if not isinstance(row,dict):
                  raise SystemExit('PRE_SURVIVOR_AI_VALUE_SOURCE_NOT_OBJECT:'+str(path))
              return row
          def read_history(path):
              rows=[]
              if not path.is_file():
                  return rows
              for lineno,line in enumerate(path.read_text().splitlines(),1):
                  text=line.strip()
                  if not text:
                      continue
                  row=json.loads(text)
                  if not isinstance(row,dict):
                      raise SystemExit(f'PRE_SURVIVOR_AI_VALUE_HISTORY_NOT_OBJECT:{path}:{lineno}')
                  rows.append(row)
              return rows
          before=digests()
          prep=run_json([
              'python3','-m','backend.production.zel_production_pre_survivor_research_controller_v1',
              '--policy','config/zel_production_pre_survivor_research_controller_v1.json','--phase','prepare',
          ])
          nxt=run_json([
              'python3','-m','backend.production.zel_production_ai_pre_survivor_next_hypothesis_v1',
              '--policy','config/zel_production_ai_pre_survivor_research_next_hypothesis_v1.json',
          ])
          queue_cli=run_json([
              'python3','-m','backend.production.zel_production_pre_survivor_challenger_queue_v1',
              '--policy','config/zel_production_pre_survivor_challenger_queue_v1.json',
          ])
          comp_cli=run_json([
              'python3','-m','backend.production.zel_production_pre_survivor_research_comparator_v1',
              '--policy','config/zel_production_pre_survivor_research_comparator_v1.json',
          ])
          upd=run_json([
              'python3','-m','backend.production.zel_production_pre_survivor_research_controller_v1',
              '--policy','config/zel_production_pre_survivor_research_controller_v1.json','--phase','update',
          ])
          audit_cfg=validate_audit_policy(json.loads(Path('config/zel_production_pre_survivor_ai_value_audit_v1.json').read_text()))
          audit_history_path=Path(str(audit_cfg['history_path']))
          audit_output_path=Path(str(audit_cfg['output_path']))
          audit_out,audit_event=audit_tick(
              audit_cfg,
              next_hypothesis=read_object(Path(str(audit_cfg['next_hypothesis_path']))),
              comparison=read_object(Path(str(audit_cfg['comparison_path']))),
              incumbent=read_object(Path(str(audit_cfg['incumbent_path'])),required=False),
              history=read_history(audit_history_path),
          )
          if audit_event is not None:
              audit_history_path.parent.mkdir(parents=True,exist_ok=True)
              with audit_history_path.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(audit_event,sort_keys=True,separators=(',',':'))+'\n')
                  handle.flush()
                  os.fsync(handle.fileno())
          atomic_json_write(audit_output_path,audit_out)
          after=digests()
          if before!=after:
              raise SystemExit('ACTIVE_ADMISSION_LEDGER_MUTATED:'+json.dumps({'before':before,'after':after},sort_keys=True))
          paths={
              'comparison':Path('/home/z/z/ledger/production_pre_survivor_research_comparison_v1.json'),
              'evidence':Path('/home/z/z/ledger/production_pre_survivor_challenger_evidence_v1.json'),
              'next':Path('/home/z/z/ledger/production_ai_pre_survivor_next_hypotheses_v1.json'),
              'queue':Path('/home/z/z/ledger/production_pre_survivor_challenger_queue_v1.json'),
              'reference':Path('/home/z/z/ledger/production_pre_survivor_research_reference_feedback_v1.json'),
              'incumbent':Path('/home/z/z/ledger/production_pre_survivor_research_incumbent_v1.json'),
              'audit':Path('/home/z/z/ledger/production_pre_survivor_ai_value_audit_v1.json'),
              'audit_history':Path('/home/z/z/ledger/production_pre_survivor_ai_value_history_v1.ndjson'),
          }
          for key in ('comparison','evidence','next','queue','reference','audit'):
              if not paths[key].is_file():
                  raise SystemExit('PRE_SURVIVOR_RESEARCH_LEDGER_MISSING:'+key)
          c=json.loads(paths['comparison'].read_text())
          e=json.loads(paths['evidence'].read_text())
          n=json.loads(paths['next'].read_text())
          q=json.loads(paths['queue'].read_text())
          r=json.loads(paths['reference'].read_text())
          inc=json.loads(paths['incumbent'].read_text()) if paths['incumbent'].is_file() else None
          a=json.loads(paths['audit'].read_text())
          for row in (c,e,n,q,r,a):
              assert row['selection_authority'] is False
              assert row['promotion_authority'] is False
              assert row['execution_authority']=='NONE'
              assert row['order_authority']=='BLOCKED'
              assert row['live_trade_authority']=='BLOCKED'
              assert row['exchange_order_submitted'] is False
          if isinstance(inc,dict):
              assert inc['research_incumbent_only'] is True
              assert inc['production_promotion_applied'] is False
              assert inc['selection_authority'] is False
              assert inc['promotion_authority'] is False
              assert inc['execution_authority']=='NONE'
              assert inc['order_authority']=='BLOCKED'
              assert inc['live_trade_authority']=='BLOCKED'
              assert inc['exchange_order_submitted'] is False
          aggregate=a.get('aggregate') if isinstance(a.get('aggregate'),dict) else {}
          print(json.dumps({
              'reference_source':r.get('research_reference_source'),
              'reference_family_id':r.get('family_id'),
              'next_hypothesis_state':n.get('state'),
              'next_hypothesis_proposal_count':int(n.get('proposal_count') or 0),
              'queue_state':q.get('state'),
              'queue_proposal_count':int(q.get('proposal_count') or 0),
              'queue_family_ids':q.get('queue_family_ids') or [],
              'queue_cli':queue_cli,
              'challenger_evidence_state':e.get('state'),
              'challenger_count':int(e.get('challenger_count') or 0),
              'history_appended':int(e.get('history_appended') or 0),
              'comparison_state':c.get('state'),
              'comparison_count':int(c.get('comparison_count') or 0),
              'research_preference':c.get('research_preference'),
              'preferred_challenger_family_ids':c.get('preferred_challenger_family_ids') or [],
              'incumbent_changed':bool(upd.get('changed')),
              'incumbent_family_id':upd.get('family_id'),
              'incumbent_generation':int(upd.get('generation') or 0),
              'ai_value_state':a.get('state'),
              'ai_value_history_append_required':bool(a.get('history_append_required')),
              'ai_value_generation_count':int(aggregate.get('generation_count') or 0),
              'ai_value_preferred_challenger_count':int(aggregate.get('preferred_challenger_count') or 0),
              'ai_value_preferred_epoch_rate_pct':float(aggregate.get('preferred_epoch_rate_pct') or 0.0),
              'active_ledger_unchanged':True,
              'selection_authority':False,
              'promotion_authority':False,
              'execution_authority':'NONE',
              'order_authority':'BLOCKED',
              'live_trade_authority':'BLOCKED',
              'exchange_order_submitted':False,
          },sort_keys=True))
          PY
          REMOTE
      - name: Verify research receipt remains non-authoritative
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('out/pre_survivor_research_vps_receipt.json').read_text())
          assert row['active_ledger_unchanged'] is True
          assert row['selection_authority'] is False
          assert row['promotion_authority'] is False
          assert row['execution_authority']=='NONE'
          assert row['order_authority']=='BLOCKED'
          assert row['live_trade_authority']=='BLOCKED'
          assert row['exchange_order_submitted'] is False
          assert str(row.get('ai_value_state') or '').startswith(('PASS_','HOLD_'))
          assert row['ai_value_generation_count'] >= 0
          assert row['ai_value_preferred_challenger_count'] >= 0
          print(json.dumps(row,sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-pre-survivor-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/pre_survivor_research_vps_receipt.json
          if-no-files-found: warn
          retention-days: 30
