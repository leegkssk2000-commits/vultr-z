name: ZEL Production Runtime E2E V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_runtime_v1.py'
      - 'tests/test_zel_production_runtime_v1.py'
      - '.github/workflows/zel-production-runtime-e2e-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m py_compile backend/production/zel_production_runtime_v1.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check fastapi httpx pytest
      - name: Run runtime E2E tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_zel_production_runtime_v1.py
      - name: Assert canonical server contract
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('backend/production/zel_production_runtime_v1.py').read_text()
          for route in ('/api/production/cycle','/api/production/snapshot','/api/production/health','/api/alimi/production'):
              assert route in t, route
          assert 'exchange_order_submitted' in t
          assert 'app.include_router(alimi_router)' in t
          print('PASS_PRODUCTION_RUNTIME_E2E_CONTRACT')
          PY
