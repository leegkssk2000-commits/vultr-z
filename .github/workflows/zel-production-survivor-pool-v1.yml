name: ZEL Production Survivor Pool V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/production/zel_production_survivor_pool_v1.py'
      - 'config/zel_production_survivor_pool_v1.json'
      - 'tests/test_zel_production_survivor_pool_v1.py'
      - 'backend/production/zel_production_paper_runner_v1.sh'
      - '.github/workflows/zel-production-survivor-pool-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test survivor pool
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile backend/production/zel_production_survivor_pool_v1.py
          PYTHONPATH=. pytest -q tests/test_zel_production_survivor_pool_v1.py
      - name: Verify frozen 3+2 no-authority contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/zel_production_survivor_pool_v1.json').read_text())
          assert p['active_target']==3 and p['reserve_target']==2
          assert p['distinct_family_required'] is True
          assert p['selection_authority'] is False and p['promotion_authority'] is False
          assert p['execution_authority']=='NONE'
          assert p['order_authority']=='BLOCKED' and p['live_trade_authority']=='BLOCKED'
          assert p['source_code_mutation_allowed'] is False and p['self_modification_allowed'] is False
          print('PASS_SURVIVOR_POOL_3_PLUS_2_CONTRACT')
          PY
      - name: Verify pool runs after improvement and before sleep
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('backend/production/zel_production_paper_runner_v1.sh').read_text()
          a=r.index('zel_production_improvement_controller_v1')
          b=r.index('zel_production_survivor_pool_v1')
          c=r.rindex('sleep "${INTERVAL_S}"')
          assert a < b < c
          print('PASS_SURVIVOR_POOL_RUNNER_ORDER')
          PY
