name: ZEL Provision BingX Actions Secrets Exact V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_provision_bingx_actions_secrets_exact_v1.py
      - .github/workflows/zel-provision-bingx-actions-secrets-exact-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  provision:
    if: github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static security validation
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_provision_bingx_actions_secrets_exact_v1.py
          grep -q 'secret_values_logged.*False' backend/tools/zel_provision_bingx_actions_secrets_exact_v1.py
          grep -q 'order_authority.*BLOCKED' backend/tools/zel_provision_bingx_actions_secrets_exact_v1.py
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Validate authoritative pair and provision Actions secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-provision-bingx-exact-${GITHUB_RUN_ID}"
          echo "$remote" > out/remote_path.txt
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes backend/tools/zel_provision_bingx_actions_secrets_exact_v1.py "$VPS_USER@$VPS_HOST:$remote/"
          set +e
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=10 "$VPS_USER@$VPS_HOST" \
            "umask 077; /home/z/z/.venv/bin/python '$remote/zel_provision_bingx_actions_secrets_exact_v1.py' --repo '${GITHUB_REPOSITORY}' --out '$remote/receipt.json'"
          rc=$?
          set -e
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/receipt.json" out/provision_receipt.json
          printf '%s\n' "$rc" > out/provision_rc.txt
      - name: Verify non-secret receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/provision_receipt.json'))
          expected=r['receipt_sha256']
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==expected,(actual,expected)
          assert r['secret_values_logged'] is False and r['secret_values_artifacted'] is False,r
          assert r['protected_mutations']==0,r
          print({k:r.get(k) for k in ('state','verified_secret_names','blocker','receipt_sha256')})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-provision-bingx-actions-secrets-exact-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed unless provisioned
        if: always()
        run: |
          state=$(python -c "import json;print(json.load(open('out/provision_receipt.json'))['state'])")
          test "$state" = PASS_BINGX_ACTIONS_SECRETS_PROVISIONED
      - name: Cleanup
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
