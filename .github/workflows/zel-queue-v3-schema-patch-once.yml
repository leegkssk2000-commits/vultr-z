name: ZEL Queue V3 Schema Patch Once

on:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2]
    paths:
      - .github/workflows/zel-queue-v3-schema-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Normalize selected queue item schema
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/zel-exact25-identity-indicator-queue-v3.yml')
          text=path.read_text()
          old="proposed=designer['response'].get('selection')"
          new="proposed=designer['response'].get('selection') or designer['response'].get('selected_queue_item')"
          assert text.count(old)==1,text.count(old)
          path.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/zel-queue-v3-schema-patch-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/zel-exact25-identity-indicator-queue-v3.yml .github/workflows/zel-queue-v3-schema-patch-once.yml
          git diff --cached --check
          git commit -m 'fix(zel): normalize Gemini selected queue item schema'
          git push origin HEAD:${GITHUB_HEAD_REF}
