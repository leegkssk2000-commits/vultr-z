name: ZEL Runtime Installation Audit V1.1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_runtime_installation_audit_v1.py
      - backend/tools/zel_runtime_topology_audit_v1_1.py
      - .github/workflows/zel-runtime-installation-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zel-runtime-installation-audit-v1-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MASTER_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audits
        run: |
          python -m py_compile backend/tools/zel_runtime_installation_audit_v1.py
          python -m py_compile backend/tools/zel_runtime_topology_audit_v1_1.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Execute read-only installation census on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          test -n "$EXPECTED_MASTER_SHA"
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "EXPECTED_MASTER_SHA='$EXPECTED_MASTER_SHA' python3 -" \
            < backend/tools/zel_runtime_installation_audit_v1.py \
            > out/runtime_audit.json \
            2> out/runtime_ssh_stderr.txt

      - name: Execute read-only service and writer topology census
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "python3 -" \
            < backend/tools/zel_runtime_topology_audit_v1_1.py \
            > out/runtime_topology.json \
            2> out/runtime_topology_stderr.txt

      - name: Assert read-only contracts and summarize
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          installation = json.loads(Path('out/runtime_audit.json').read_text())
          topology = json.loads(Path('out/runtime_topology.json').read_text())
          assert installation['state'] in {'PASS_RUNTIME_CENSUS_WITH_REVIEW_ITEMS', 'HOLD_RUNTIME_REVIEW_REQUIRED'}
          assert topology['state'] in {'PASS_RUNTIME_TOPOLOGY_CENSUS', 'HOLD_RUNTIME_TOPOLOGY_REVIEW_REQUIRED'}
          for row in (installation, topology):
              safety = row['safety']
              assert safety['read_only'] is True
              assert safety['remote_file_created'] is False
              assert safety['service_changed'] is False
              assert safety['process_changed'] is False
              assert safety['database_changed'] is False
              assert safety['deployment_changed'] is False
              assert safety['execution_allowed'] is False
              assert safety['order_authority'] == 'BLOCKED'
          high = [item for item in installation['findings'] if item.get('severity') == 'HIGH']
          high += [item for item in topology['findings'] if item.get('severity') in {'HIGH', 'CRITICAL'}]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('# ZEL runtime installation audit v1.1\n\n')
              out.write(f"- Installation state: **{installation['state']}**\n")
              out.write(f"- Topology state: **{topology['state']}**\n")
              out.write(f"- High/Critical findings: `{len(high)}`\n")
              out.write(f"- Units: `{topology['services']['unit_count']}`\n")
              out.write(f"- Timers: `{topology['services']['timer_count']}`\n")
              out.write(f"- Processes: `{topology['process_count']}`\n")
              out.write(f"- Writer conflicts: `{len(topology['writer_topology']['conflicts'])}`\n")
              out.write(f"- Next: `{topology['next']}`\n")
          PY

      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-runtime-installation-audit-v1-1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out
          if-no-files-found: warn
          retention-days: 30
