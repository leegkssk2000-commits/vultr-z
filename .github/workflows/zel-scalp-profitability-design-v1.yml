name: ZEL Scalp Profitability Design V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/zel_scalp_*'
      - 'backend/research/intraday_pullback_reclaim_v1.py'
      - 'scripts/validate_zel_scalp_design_selection_v1.py'
      - 'scripts/validate_zel_scalp_external_benchmark_v2.py'
      - 'scripts/validate_intraday_pullback_reclaim_v1.py'
      - 'scripts/validate_zel_scalp_data_split_materialization_v1.py'
      - 'scripts/materialize_zel_scalp_intraday_dataset_v1.py'
      - '.github/workflows/zel-scalp-profitability-design-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-scalp-profitability-design-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research candidate
        run: >-
          python -m py_compile
          backend/research/intraday_pullback_reclaim_v1.py
          scripts/validate_intraday_pullback_reclaim_v1.py
          scripts/validate_zel_scalp_design_selection_v1.py
          scripts/validate_zel_scalp_external_benchmark_v2.py
          scripts/validate_zel_scalp_data_split_materialization_v1.py
          scripts/materialize_zel_scalp_intraday_dataset_v1.py
      - name: Validate sealed design receipt
        run: python scripts/validate_zel_scalp_design_selection_v1.py
      - name: Validate external benchmark evidence boundary
        run: python scripts/validate_zel_scalp_external_benchmark_v2.py
      - name: Validate isolated candidate fixtures
        run: python scripts/validate_intraday_pullback_reclaim_v1.py
      - name: Validate sealed data split contract
        run: python scripts/validate_zel_scalp_data_split_materialization_v1.py
      - name: Protected-path assertion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          if grep -E '^(backend/strategies/|backend/registry|backend/runtime|formal_ledger|shadow|paper|live|orders?)' <<<"$changed"; then
            echo 'protected runtime/canonical path changed' >&2
            exit 1
          fi
          printf '%s\n' "$changed"

  materialize-replay-inputs:
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download accepted immutable dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8916685107/zip" \
            -o /tmp/pr575-gap-excluded-dataset.zip
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8950849008/zip" \
            -o /tmp/pr576-gen3-terminal.zip
      - name: Materialize sealed 3m 5m 15m replay inputs
        run: >-
          python scripts/materialize_zel_scalp_intraday_dataset_v1.py
          --dataset-zip /tmp/pr575-gap-excluded-dataset.zip
          --cost-zip /tmp/pr576-gen3-terminal.zip
          --repo-root .
          --output /tmp/zel-scalp-materialized-inputs
      - name: Independent manifest assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/zel-scalp-materialized-inputs/materialized_manifest.json')
          data = json.loads(path.read_text())
          assert data['state'] == 'PASS_MATERIALIZED_REPLAY_INPUTS'
          assert data['file_count'] == 60
          assert data['total_rows'] > 0
          assert data['protected_mutations'] == 0
          assert data['execution_authority'] == 'NONE'
          assert data['order_authority'] == 'BLOCKED'
          assert len({item['sha256'] for item in data['files']}) == 60
          print({
              'state': data['state'],
              'file_count': data['file_count'],
              'total_rows': data['total_rows'],
              'receipt': data['manifest_receipt_sha256'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-scalp-materialized-inputs-${{ github.sha }}
          path: /tmp/zel-scalp-materialized-inputs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
