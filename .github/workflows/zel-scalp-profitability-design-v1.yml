name: ZEL Scalp Profitability Design V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/zel_scalp_*'
      - 'backend/research/zel_strategy_kernel_*'
      - 'backend/research/zel_feature_strategy_ssot_v1.py'
      - 'backend/research/zel_strategy_intent_adapters_v1.py'
      - 'backend/research/zel_momentum_*'
      - 'backend/research/intraday_pullback_reclaim_v1.py'
      - 'backend/research/momentum_breakout_continuation_v1.py'
      - 'scripts/validate_zel_*'
      - 'scripts/validate_intraday_pullback_reclaim_v1.py'
      - 'scripts/validate_momentum_breakout_continuation_v1.py'
      - 'scripts/materialize_zel_scalp_intraday_dataset_v1.py'
      - 'scripts/rebind_zel_scalp_momentum_materialized_inputs_v1.py'
      - 'scripts/run_zel_momentum_feature_contribution_v1.py'
      - 'scripts/run_zel_momentum_early_invalidation_v1.py'
      - '.github/workflows/zel-scalp-profitability-design-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-scalp-profitability-design-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strategy-kernel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile strategy kernel and early-invalidation stage
        run: >-
          python -m py_compile
          backend/research/zel_feature_strategy_ssot_v1.py
          backend/research/zel_strategy_intent_adapters_v1.py
          backend/research/intraday_pullback_reclaim_v1.py
          backend/research/momentum_breakout_continuation_v1.py
          scripts/validate_zel_feature_strategy_ssot_v1.py
          scripts/validate_zel_strategy_kernel_parity_v1.py
          scripts/validate_intraday_pullback_reclaim_v1.py
          scripts/validate_momentum_breakout_continuation_v1.py
          scripts/validate_zel_scalp_design_selection_v1.py
          scripts/validate_zel_scalp_external_benchmark_v2.py
          scripts/validate_zel_scalp_data_split_materialization_v1.py
          scripts/validate_zel_scalp_momentum_replay_control_plan_v1.py
          scripts/materialize_zel_scalp_intraday_dataset_v1.py
          scripts/rebind_zel_scalp_momentum_materialized_inputs_v1.py
          scripts/run_zel_momentum_feature_contribution_v1.py
          scripts/run_zel_momentum_early_invalidation_v1.py
      - name: Validate inherited design receipts
        run: |
          python scripts/validate_zel_scalp_design_selection_v1.py
          python scripts/validate_zel_scalp_external_benchmark_v2.py
          python scripts/validate_zel_scalp_data_split_materialization_v1.py
          python scripts/validate_zel_scalp_momentum_replay_control_plan_v1.py
      - name: Validate strategy kernel and DecisionIntent parity
        run: |
          python scripts/validate_intraday_pullback_reclaim_v1.py
          python scripts/validate_momentum_breakout_continuation_v1.py
          python scripts/validate_zel_feature_strategy_ssot_v1.py
          python scripts/validate_zel_strategy_kernel_parity_v1.py
      - name: Verify frozen-entry early-invalidation route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          boundary = json.loads(Path('backend/research/zel_strategy_kernel_boundary_audit_v1.json').read_text())
          control = json.loads(Path('backend/research/zel_scalp_momentum_replay_control_plan_v1.json').read_text())
          stop = json.loads(Path('backend/research/zel_momentum_stop_geometry_disposition_v1.json').read_text())
          early = json.loads(Path('backend/research/zel_momentum_early_invalidation_plan_v1.json').read_text())

          assert boundary['state'] == 'PASS_BOUNDARY_OWNERSHIP_SEALED'
          assert control['legacy_adapters_disposition'] == 'BLOCKED_NO_SELECTION_OR_ECONOMIC_AUTHORITY'
          assert stop['state'] == 'FAIL_STOP_ONLY_NO_SURVIVOR'
          assert stop['source_run'] == 31109061391
          assert stop['source_artifact_id'] == 8970873434
          assert stop['source_receipt_sha256'] == '0e189a2919f069211df4cb58334de7da7f53ee76f7ba5e675b790067754d8473'
          assert stop['next_gate'] == 'EARLY_INVALIDATION_POLICY_REDESIGN'
          assert early['state'] == 'PASS_EARLY_INVALIDATION_PLAN_SEALED_RESEARCH_ONLY'
          assert early['source_variant_id'] == 'STOP_MULT_1'
          assert early['frozen_entry_count'] == 130
          assert early['single_causal_axis'] == 'ENTRY_REFERENCE_RECLAIM_GRACE_BARS'
          assert early['grace_bars_candidates'] == [1, 2, 3, 4, 6, 8, 12]
          assert stop['execution_authority'] == 'NONE'
          assert stop['order_authority'] == 'BLOCKED'
          assert stop['protected_mutations'] == 0
          print({
              'boundary': boundary['state'],
              'stop': stop['state'],
              'next': stop['next_gate'],
              'frozen_entries': early['frozen_entry_count'],
              'early_candidates': len(early['grace_bars_candidates']),
          })
          PY
      - name: Protected-path assertion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          if grep -E '^(backend/strategies/|backend/registry|backend/runtime|formal_ledger|shadow|paper|live|orders?)' <<<"$changed"; then
            echo 'protected runtime/canonical path changed' >&2
            exit 1
          fi
          printf '%s\n' "$changed"

  materialize-early-inputs:
    needs: strategy-kernel-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable data, cost and stop-geometry artifacts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            '8916685107:/tmp/pr575-gap-excluded-dataset.zip' \
            '8950849008:/tmp/pr576-gen3-terminal.zip' \
            '8970873434:/tmp/stop-geometry-source.zip'; do
            id="${spec%%:*}"
            output="${spec#*:}"
            curl --fail --location --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${output}"
          done
      - name: Materialize and bind early-invalidation inputs
        run: |
          python scripts/materialize_zel_scalp_intraday_dataset_v1.py \
            --dataset-zip /tmp/pr575-gap-excluded-dataset.zip \
            --cost-zip /tmp/pr576-gen3-terminal.zip \
            --repo-root . \
            --output /tmp/zel-momentum-early-inputs
          python scripts/rebind_zel_scalp_momentum_materialized_inputs_v1.py \
            --inputs /tmp/zel-momentum-early-inputs \
            --repo-root .
          cp /tmp/stop-geometry-source.zip /tmp/zel-momentum-early-inputs/source-stop-geometry.zip
      - name: Verify frozen-entry lineage bindings
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/zel-momentum-early-inputs')
          data = json.loads((root / 'materialized_manifest.json').read_text())
          refs = data['references']
          source_sha = hashlib.sha256((root / 'source-stop-geometry.zip').read_bytes()).hexdigest()
          assert data['state'] == 'PASS_MOMENTUM_MATERIALIZED_REPLAY_INPUTS'
          assert data['strategy_id'] == 'momentum_breakout_continuation_v1'
          assert data['file_count'] == 60
          assert data['total_rows'] > 0
          for key in (
              'feature_strategy_ssot_sha256',
              'intent_adapters_sha256',
              'stop_geometry_disposition_sha256',
              'early_invalidation_plan_sha256',
              'cost_receipt_sha256',
              'funding_receipt_sha256',
          ):
              assert refs[key]
          assert source_sha == 'f4d30dde9072edf139c621a0593e17198c4b830a7f8ab5050eb4c6d82200df8d'
          assert data['protected_mutations'] == 0
          assert data['execution_authority'] == 'NONE'
          assert data['order_authority'] == 'BLOCKED'
          print({'state': data['state'], 'files': data['file_count'], 'rows': data['total_rows'], 'bindings': len(refs), 'source_sha': source_sha})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-momentum-early-inputs-${{ github.sha }}
          path: /tmp/zel-momentum-early-inputs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  momentum-early-invalidation:
    needs: materialize-early-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: zel-momentum-early-inputs-${{ github.sha }}
          path: /tmp/zel-momentum-early-inputs
      - name: Run frozen-entry early invalidation counterfactual
        run: |
          python scripts/run_zel_momentum_early_invalidation_v1.py \
            --inputs /tmp/zel-momentum-early-inputs \
            --source-artifact /tmp/zel-momentum-early-inputs/source-stop-geometry.zip \
            --repo-root . \
            --output /tmp/zel-momentum-early-invalidation
      - name: Verify early invalidation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/zel-momentum-early-invalidation/early_invalidation_receipt.json').read_text())
          assert receipt['state'] in {
              'PASS_EARLY_INVALIDATION_COUNTERFACTUAL_SURVIVOR_FOUND_SEQUENCE_REQUIRED',
              'PASS_EARLY_INVALIDATION_COUNTERFACTUAL_NO_SURVIVOR',
          }
          assert len(receipt['results']) == 7
          assert receipt['integrity']['errors'] == 0
          assert receipt['integrity']['duplicates'] == 0
          assert receipt['integrity']['source_entry_rows'] == 130
          assert receipt['integrity']['base_metric_parity'] is True
          assert receipt['integrity']['protected_mutations'] == 0
          assert receipt['integrity']['execution_authority'] == 'NONE'
          assert receipt['integrity']['order_authority'] == 'BLOCKED'
          assert receipt['selection_authority'] is False
          assert receipt['promotion_authority'] is False
          print({
              'state': receipt['state'],
              'survivors': receipt['hard_gate_survivors'],
              'top3': receipt['research_ranking'][:3],
              'next': receipt['next_gate'],
              'receipt': receipt['receipt_sha256'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zel-momentum-early-invalidation-${{ github.sha }}
          path: /tmp/zel-momentum-early-invalidation
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
