name: ZEL Scalp Profitability Design V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/research/zel_strategy_kernel_boundary_audit_v1.json'
      - 'backend/research/zel_strategy_kernel_reset_gate_v1.json'
      - 'backend/research/zel_feature_strategy_ssot_v1.py'
      - 'backend/research/zel_strategy_intent_adapters_v1.py'
      - 'backend/research/zel_session_event_continuation_plan_v1.json'
      - 'backend/research/zel_session_event_external_evidence_registry_v1.json'
      - 'backend/research/zel_session_event_ai_binding_v1.json'
      - 'backend/research/strategy11_ai_review_router_v1.json'
      - 'backend/tools/zel_session_event_gemini_research_gate_v1.py'
      - 'scripts/materialize_zel_scalp_intraday_dataset_v1.py'
      - 'scripts/run_zel_session_event_replay_v1.py'
      - 'scripts/validate_zel_session_event_replay_v1.py'
      - 'scripts/strategy11_ai_review_router.py'
      - 'scripts/strategy11_groq_redteam.py'
      - 'scripts/strategy11_workers_ai_guard.py'
      - 'scripts/strategy11_github_models_review.py'
      - 'scripts/validate_zel_session_event_ai_gate_v1.py'
      - 'scripts/validate_zel_feature_strategy_ssot_v1.py'
      - 'scripts/validate_zel_strategy_kernel_parity_v1.py'
      - '.github/workflows/zel-scalp-profitability-design-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: zel-scalp-profitability-design-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  session-event-ai-research-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify AI prerequisite binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          binding = json.loads(Path('backend/research/zel_session_event_ai_binding_v1.json').read_text())
          assert binding['state'] == 'HOLD_UNTIL_REQUIRED_AI_CHAIN_PASS'
          assert binding['required_pre_replay_state'] == 'PASS_SESSION_EVENT_AI_CHAIN_BOUND'
          assert binding['next_gate_after_pass'] == 'DETERMINISTIC_SESSION_EVENT_EVENT_STUDY'
          assert binding['execution_authority'] == 'NONE'
          assert binding['order_authority'] == 'BLOCKED'
          assert binding['protected_mutations'] == 0
          PY

      - name: Install AI review client
        run: python -m pip install --disable-pip-version-check --no-cache-dir groq

      - name: Compile mandatory AI research chain
        run: >-
          python -m py_compile
          backend/tools/zel_session_event_gemini_research_gate_v1.py
          scripts/strategy11_ai_review_router.py
          scripts/strategy11_groq_redteam.py
          scripts/strategy11_workers_ai_guard.py
          scripts/validate_zel_session_event_ai_gate_v1.py

      - name: Generate Gemini multimodal hypothesis from sealed evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_V3_2_API_KEY: ${{ secrets.GEMINI_V3_2_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf /tmp/zel-session-event-ai
          python backend/tools/zel_session_event_gemini_research_gate_v1.py \
            --plan backend/research/zel_session_event_continuation_plan_v1.json \
            --registry backend/research/zel_session_event_external_evidence_registry_v1.json \
            --output-dir /tmp/zel-session-event-ai

      - name: Execute Gemini, Groq and Workers AI advisory chain
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/strategy11_ai_review_router.py \
            --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS \
            --input /tmp/zel-session-event-ai/router_input.json \
            --policy backend/research/strategy11_ai_review_router_v1.json \
            --output /tmp/zel-session-event-ai/router_result.json \
            --mode execute \
            --gemini-artifact /tmp/zel-session-event-ai/gemini_artifact.json

      - name: Fail closed unless all required providers were actually used
        run: |
          set -euo pipefail
          python scripts/validate_zel_session_event_ai_gate_v1.py \
            --gemini /tmp/zel-session-event-ai/gemini_artifact.json \
            --router /tmp/zel-session-event-ai/router_result.json \
            --policy backend/research/strategy11_ai_review_router_v1.json \
            --output /tmp/zel-session-event-ai/ai_gate_receipt.json

      - name: Upload immutable AI evidence and lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zel-session-event-ai-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zel-session-event-ai
          if-no-files-found: warn
          retention-days: 14

  architecture-reset-gate:
    needs: session-event-ai-research-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile strategy-centered SSOT and thin adapters
        run: >-
          python -m py_compile
          backend/research/zel_feature_strategy_ssot_v1.py
          backend/research/zel_strategy_intent_adapters_v1.py
          scripts/validate_zel_feature_strategy_ssot_v1.py
          scripts/validate_zel_strategy_kernel_parity_v1.py

      - name: Validate boundary, feature correctness and adapter parity
        run: |
          python scripts/validate_zel_feature_strategy_ssot_v1.py
          python scripts/validate_zel_strategy_kernel_parity_v1.py
          python - <<'PY'
          import json
          from pathlib import Path

          boundary = json.loads(Path('backend/research/zel_strategy_kernel_boundary_audit_v1.json').read_text())
          reset = json.loads(Path('backend/research/zel_strategy_kernel_reset_gate_v1.json').read_text())

          assert boundary['state'] == 'PASS_BOUNDARY_OWNERSHIP_SEALED'
          assert boundary['next_gate'] == 'FEATURE_CORRECTNESS_AND_PARITY'
          assert reset['state'] == 'PASS_ARCHITECTURE_GATES_A_B_E_READY_FOR_SINGLE_AXIS_CONTRIBUTION'
          assert reset['gates']['A_boundary_audit']['state'] == 'PASS'
          assert reset['gates']['B_feature_correctness']['state'] == 'PASS_IMMUTABLE_VALIDATION'
          assert reset['gates']['C_feature_economic_contribution']['state'] == 'READY_SINGLE_AXIS_RESEARCH_ONLY'
          assert reset['gates']['E_adapter_parity']['state'] == 'PASS_IMMUTABLE_VALIDATION'
          assert reset['gates']['E_adapter_parity']['observed_intent_parity_pct'] == 100.0
          assert reset['gates']['F_integrated_economics']['state'] == 'BLOCKED_UNTIL_C_AND_D_PASS'
          assert reset['next_gate'] == 'C_SINGLE_AXIS_FEATURE_ECONOMIC_CONTRIBUTION'
          assert reset['authority']['selection_authority'] is False
          assert reset['authority']['promotion_authority'] is False
          assert reset['authority']['execution_authority'] == 'NONE'
          assert reset['authority']['order_authority'] == 'BLOCKED'
          assert reset['authority']['protected_mutations'] == 0
          assert reset['authority']['live_order'] == 'BLOCKED'
          PY

      - name: Assert only the preregistered single-axis replay is enabled
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/zel-scalp-profitability-design-v1.yml'
          prefix='python scripts/run_zel_'
          suffix='(feature_contribution|cost_geometry|stop_geometry|target_geometry|timeout_geometry|breakeven|partial_exit|trailing_runner)'
          if grep -E "${prefix}${suffix}" "$workflow"; then
            echo 'integrated economics or tuning remains forbidden before C and D pass' >&2
            exit 1
          fi
          replay_count="$(grep -E -c '^[[:space:]]+python scripts/run_zel_session_event_replay_v1.py' "$workflow")"
          test "$replay_count" -eq 1

      - name: Protected-path assertion
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'master' }}"
          git fetch --no-tags origin "$base_ref"
          changed="$(git diff --name-only "origin/${base_ref}"...HEAD)"
          if grep -E '^(backend/strategies/|backend/registry|backend/runtime|formal_ledger|shadow|paper|live|orders?)' <<<"$changed"; then
            echo 'protected runtime/canonical path changed' >&2
            exit 1
          fi
          printf '%s\n' "$changed"

  session-event-deterministic-replay:
    needs:
      - session-event-ai-research-gate
      - architecture-reset-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download bound AI gate receipt
        uses: actions/download-artifact@v4
        with:
          name: zel-session-event-ai-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zel-session-event-ai

      - name: Download immutable dataset and cost artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zel-session-event-replay
          for spec in \
            '8916685107:/tmp/zel-dataset.zip' \
            '8950849008:/tmp/zel-cost.zip'
          do
            artifact_id="${spec%%:*}"
            output="${spec#*:}"
            curl --fail-with-body --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$output"
          done
          sha256sum /tmp/zel-dataset.zip /tmp/zel-cost.zip

      - name: Materialize immutable 15m replay inputs
        run: |
          set -euo pipefail
          rm -rf /tmp/zel-session-event-inputs
          python scripts/materialize_zel_scalp_intraday_dataset_v1.py \
            --dataset-zip /tmp/zel-dataset.zip \
            --cost-zip /tmp/zel-cost.zip \
            --repo-root "$GITHUB_WORKSPACE" \
            --output /tmp/zel-session-event-inputs

      - name: Compile deterministic replay and validator
        run: >-
          python -m py_compile
          scripts/run_zel_session_event_replay_v1.py
          scripts/validate_zel_session_event_replay_v1.py

      - name: Run sealed research-window replay
        run: |
          set -euo pipefail
          python scripts/run_zel_session_event_replay_v1.py \
            --inputs /tmp/zel-session-event-inputs \
            --plan backend/research/zel_session_event_continuation_plan_v1.json \
            --ai-receipt /tmp/zel-session-event-ai/ai_gate_receipt.json \
            --window research \
            --output /tmp/zel-session-event-replay

      - name: Validate deterministic edge gate
        run: |
          set -euo pipefail
          python scripts/validate_zel_session_event_replay_v1.py \
            --receipt /tmp/zel-session-event-replay/session_event_replay_receipt.json \
            --ledger /tmp/zel-session-event-replay/session_event_ledger.jsonl.gz \
            --plan backend/research/zel_session_event_continuation_plan_v1.json \
            --ai-receipt /tmp/zel-session-event-ai/ai_gate_receipt.json \
            --inputs /tmp/zel-session-event-inputs \
            --output /tmp/zel-session-event-replay/session_event_validation_receipt.json

      - name: Upload deterministic replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zel-session-event-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zel-session-event-replay
          if-no-files-found: warn
          retention-days: 30
