name: ZEL Squeeze Break 150D Admission V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/squeeze_break_150d_admission_v1.py
      - .github/workflows/zel-squeeze-break-150d-admission-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-squeeze-break-150d-admission-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Freeze exact-source admission contract
        run: |
          set -euo pipefail
          python -m py_compile backend/research/squeeze_break_150d_admission_v1.py backend/tools/zel_historical_oos_exact25_replay_v1.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('backend/research/squeeze_break_150d_admission_v1.py')
          spec=importlib.util.spec_from_file_location('sq150',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.DATASET_SHA=='53676bb379635c6f81908be2c20e1598e00bffa4d0e08d8b492646416b8a46d8'
          assert m.STRATEGY_ID=='squeeze_break'
          assert m.EXPECTED_OWNER_SHA256=='c22b4016601ce37fc28999ca7690804c92d3f04997b4d01f06775aa49837ed38'
          assert m.PRODUCTION_SYMBOLS==('BTC-USDT','ETH-USDT')
          assert sum((b-a)//60000 for _,a,b in m.WINDOWS)==m.EXPECTED_POST_ROWS
          text=p.read_text()
          for token in ('"strategy_parameter_changes": 0','"feature_gate_changes": 0','"side_filter_changes": 0','"risk_request_bound": False','"dd_pct_bound": False','"retention_semantics_bound": False','"order_authority": "BLOCKED"'):
              assert token in text,token
          print('PASS_SQUEEZE150_CONTRACT_EXACT_SOURCE_NO_PROMOTION')
          PY
          mkdir -p /tmp/squeeze150 /tmp/squeeze150_pydeps out ~/.ssh

      - name: Stage ephemeral Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile --target /tmp/squeeze150_pydeps pandas numpy
          tar -C /tmp/squeeze150_pydeps -czf /tmp/squeeze150_pydeps.tgz .

      - name: Download accepted 150d BingX 1m dataset
        uses: actions/download-artifact@v4
        with:
          name: zel-bingx-1m-gap-exclusion-seal-v1-30971232337
          path: /tmp/squeeze150
          github-token: ${{ github.token }}
          run-id: 30971232337
          repository: ${{ github.repository }}

      - name: Verify immutable 150d dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/squeeze150'); m=json.loads((root/'manifest.json').read_text())
          assert m['state']=='PASS_BINGX_1M_GAP_EXCLUDED_DATASET_STAGED'
          assert m['dataset_sha256']=='53676bb379635c6f81908be2c20e1598e00bffa4d0e08d8b492646416b8a46d8'
          assert m['actual_total_rows']==1072800
          rows=[x for x in m['results'] if x['segment_id']=='POST_GAP']
          assert len(rows)==5
          for x in rows:
              p=root/'data'/x['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['file_sha256']
              assert x['row_count']==192030 and x['missing_interval_count']==0 and x['duplicate_timestamp_count']==0
              assert x['start_ms']==1771027200000 and x['end_exclusive_ms']==1782549000000
          print('PASS_SQUEEZE150_DATASET_SHA_CONTIGUOUS')
          PY

      - name: Prepare VPS read-only transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'test -f /home/z/z/tools/q4r3_exact25_dedicated_shadow_producer.py && test -d /opt/zel/historical-oos-v1'
          echo PASS_SQUEEZE150_VPS_INPUTS_PRESENT

      - name: Run canonical squeeze_break over independent 150d windows
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-squeeze150-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$remote" > out/remote_path.txt
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote/data' '$remote/pydeps'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes backend/research/squeeze_break_150d_admission_v1.py backend/tools/zel_historical_oos_exact25_replay_v1.py /tmp/squeeze150/manifest.json /tmp/squeeze150_pydeps.tgz "$VPS_USER@$VPS_HOST:$remote/"
          scp -i ~/.ssh/vps_key -o BatchMode=yes /tmp/squeeze150/data/*_1771027200000_1782549000000.csv.gz "$VPS_USER@$VPS_HOST:$remote/data/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "tar -C '$remote/pydeps' -xzf '$remote/squeeze150_pydeps.tgz'"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=450 "$VPS_USER@$VPS_HOST" \
            "PYTHONPATH='$remote/pydeps' nice -n 10 /usr/bin/python3 '$remote/squeeze_break_150d_admission_v1.py' \
              --engine '$remote/zel_historical_oos_exact25_replay_v1.py' \
              --source-root /home/z/z \
              --market-root '$remote' \
              --market-manifest '$remote/manifest.json' \
              --funding-root /opt/zel/historical-oos-v1 \
              --out '$remote/result.json'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/result.json" out/squeeze_break_150d_admission.json

      - name: Verify fail-closed result and print economics
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/squeeze_break_150d_admission.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==r['receipt_sha256']
          assert r['source_binding']['strategy_parameter_changes']==0
          assert r['source_binding']['feature_gate_changes']==0
          assert r['source_binding']['side_filter_changes']==0
          assert r['source_binding']['source_unchanged'] is True
          assert r['integrity']['integrity_ok'] is True
          assert r['bootstrap_authority_gates']['bootstrap_pass_evidence_emitted'] is False
          assert r['promotion_authority'] is False and r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          print('SQUEEZE150_STATE',r['state'])
          print('SQUEEZE150_NEXT',r['next'])
          print('SQUEEZE150_PROD_3W',r['production_three_window_positive_edge'])
          print('SQUEEZE150_PROD_GATES',r['production_window_gates'])
          print('SQUEEZE150_PROD_AGG',r['aggregate']['production_symbols'])
          print('SQUEEZE150_ALL_AGG',r['aggregate']['all_symbols'])
          for w in ('W1','W2','W3'):
              print('SQUEEZE150',w,'PROD',r['windows'][w]['production_symbols'])
          print('SQUEEZE150_RECEIPT_SHA',r['receipt_sha256'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-squeeze-break-150d-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/squeeze_break_150d_admission.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup VPS temp only
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f ~/.ssh/vps_key
