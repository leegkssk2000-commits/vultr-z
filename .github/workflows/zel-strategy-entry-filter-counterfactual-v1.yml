name: ZEL Strategy Entry Filter Counterfactual V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_strategy_entry_filter_counterfactual_v1.py
      - backend/research/zel_strategy_entry_filter_counterfactual_v1.json
      - .github/workflows/zel-strategy-entry-filter-counterfactual-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zel-strategy-entry-filter-counterfactual-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_strategy_loss_attribution_gemini_v1.py \
            backend/tools/zel_strategy_entry_filter_counterfactual_v1.py
          python -m json.tool backend/research/zel_strategy_entry_filter_counterfactual_v1.json >/dev/null

      - name: Fetch immutable terminal ledger read-only
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh input
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          timeout 180s ssh \
            -i "$GITHUB_WORKSPACE/.ssh/vps_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            'tar -C /var/lib/zel-research/data-b-1m-v2 -czf - terminal_receipt.json trades.jsonl.gz' \
            > input/evidence.tar.gz
          test -s input/evidence.tar.gz
          tar -C input -xzf input/evidence.tar.gz
          python - <<'PY'
          import gzip,json
          terminal=json.load(open('input/terminal_receipt.json'))
          assert terminal['state']=='PASS',terminal
          with gzip.open('input/trades.jsonl.gz','rt',encoding='utf-8') as handle:
              count=sum(1 for line in handle if line.strip())
          assert count==1951,count
          print({'terminal':terminal['state'],'trades':count})
          PY

      - name: Execute exact ledger counterfactuals
        run: |
          set -euo pipefail
          upstream=results/runtime_results/zel/strategy_loss_attribution_gemini_v1/latest
          test -s "$upstream/summary.json"
          test -s "$upstream/improvement_queue.json"
          python backend/tools/zel_strategy_entry_filter_counterfactual_v1.py \
            --trades input/trades.jsonl.gz \
            --summary "$upstream/summary.json" \
            --queue "$upstream/improvement_queue.json" \
            --policy backend/research/zel_strategy_entry_filter_counterfactual_v1.json \
            --out out

      - name: Verify fail-closed result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/latest.json'))
          assert row['state'].startswith('PASS_ENTRY_FILTER_COUNTERFACTUAL_COMPLETE'),row
          assert row['trade_count']==1951 and row['candidate_count']==5,row
          assert row['pass_count']+row['policy_conflict_count']+row['rejected_count']==5,row
          assert row['raw_trade_data_published'] is False,row
          assert row['canonical_mutated'] is False and row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['shadow_started'] is False and row['paper_started'] is False and row['live_enabled'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          for candidate in row['candidates']:
              assert candidate['production_applied'] is False,candidate
              assert candidate['execution_authority']=='NONE' and candidate['order_authority']=='BLOCKED',candidate
          print({
              'state':row['state'],
              'pass':row['pass_count'],
              'policy_conflicts':row['policy_conflict_count'],
              'rejected':row['rejected_count'],
              'portfolio_delta':row['portfolio_counterfactual']['delta'],
          })
          PY

      - name: Publish aggregate replay receipts
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/strategy_entry_filter_counterfactual_v1
          rm -rf "$dest/latest"
          mkdir -p "$dest/latest"
          cp -R out/. "$dest/latest/"
          cp out/latest.json "$dest/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/strategy_entry_filter_counterfactual_v1
          git commit -m "result(zel): entry-filter counterfactual ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Cleanup raw ledger and SSH key
        if: always()
        run: |
          rm -rf input
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-strategy-entry-filter-counterfactual-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
