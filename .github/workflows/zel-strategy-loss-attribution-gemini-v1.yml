name: ZEL Strategy Loss Attribution Gemini V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_strategy_loss_attribution_gemini_v1.py
      - backend/research/zel_strategy_loss_attribution_gemini_v1.json
      - .github/workflows/zel-strategy-loss-attribution-gemini-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-strategy-loss-attribution-gemini-v1
  cancel-in-progress: false

jobs:
  attribution-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_strategy_loss_attribution_gemini_v1.py
          python -m json.tool backend/research/zel_strategy_loss_attribution_gemini_v1.json >/dev/null

      - name: Prepare read-only SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh input
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Fetch immutable terminal evidence read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST")
          "${SSH[@]}" 'cat /var/lib/zel-research/data-b-1m-v2/terminal_receipt.json' > input/terminal_receipt.json
          "${SSH[@]}" 'cat /var/lib/zel-research/data-b-1m-v2/report.json' > input/report.json
          "${SSH[@]}" 'cat /var/lib/zel-research/data-b-1m-v2/trades.jsonl.gz' > input/trades.jsonl.gz
          python - <<'PY'
          import gzip,json
          terminal=json.load(open('input/terminal_receipt.json'))
          report=json.load(open('input/report.json'))
          assert terminal['state']=='PASS',terminal
          assert report['state']=='PASS',report
          replay=report['replay']
          assert replay['strategy_count_completed']==25,replay
          assert replay['strategy_failure_count']==0,replay
          with gzip.open('input/trades.jsonl.gz','rt',encoding='utf-8') as fh:
              count=sum(1 for line in fh if line.strip())
          assert count==1951,count
          print({'terminal':terminal['state'],'strategies':replay['strategy_count_completed'],'trades':count})
          PY

      - name: Run loss attribution and aggressive Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python backend/tools/zel_strategy_loss_attribution_gemini_v1.py \
            --trades input/trades.jsonl.gz \
            --policy backend/research/zel_strategy_loss_attribution_gemini_v1.json \
            --out out

      - name: Verify fail-closed research receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          row=json.load(open('out/summary.json'))
          attribution=json.load(open('out/attribution.json'))
          assert row['state']=='PASS_ATTRIBUTION_AND_GEMINI_IMPROVEMENT_QUEUE_READY',row
          assert row['trade_count']==1951 and row['strategy_count']==25,row
          assert row['gemini_used'] is True and row['gemini_call_count']>=8,row
          assert row['raw_trades_sent_to_gemini'] is False,row
          assert row['private_code_sent_to_gemini'] is False,row
          assert row['account_data_sent_to_gemini'] is False,row
          assert row['credentials_sent_to_gemini'] is False,row
          assert row['raw_trade_data_published'] is False,row
          assert row['canonical_mutated'] is False and row['runtime_mutated'] is False,row
          assert row['formal_ledger_mutated'] is False,row
          assert row['shadow_started'] is False and row['paper_started'] is False and row['live_enabled'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          assert row['action']=='hold',row
          assert attribution['strategy_count']==25 and len(attribution['strategies'])==25,attribution
          print({
              'state':row['state'],
              'gemini_calls':row['gemini_call_count'],
              'approved':row['approved_hypothesis_count'],
              'oos_filters':row['oos_filter_candidate_count'],
          })
          PY
          test -z "$(find out -type f -size +2M -print -quit)"

      - name: Publish redacted aggregate receipts
        run: |
          set -euo pipefail
          git -C results pull --rebase origin zel-data-expansion-results-v1
          dest=results/runtime_results/zel/strategy_loss_attribution_gemini_v1
          rm -rf "$dest/latest"
          mkdir -p "$dest/latest"
          cp -R out/. "$dest/latest/"
          cp out/summary.json "$dest/run_${GITHUB_RUN_ID}.json"
          cd results
          git config user.name 'zel-strategy-research-bot'
          git config user.email 'zel-strategy-research-bot@users.noreply.github.com'
          git add runtime_results/zel/strategy_loss_attribution_gemini_v1
          git commit -m "result(zel): strategy loss attribution Gemini ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('out/summary.json')
          if not path.exists():
              raise SystemExit(0)
          row=json.load(path.open())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('# ZEL Strategy Loss Attribution + Gemini V1\n\n')
              out.write(f"- State: **{row.get('state')}**\n")
              out.write(f"- Trades / strategies: `{row.get('trade_count')}` / `{row.get('strategy_count')}`\n")
              out.write(f"- Gemini calls: `{row.get('gemini_call_count')}`\n")
              out.write(f"- Approved hypotheses: `{row.get('approved_hypothesis_count')}`\n")
              out.write(f"- W1→W2/W3 filter candidates: `{row.get('oos_filter_candidate_count')}`\n")
              out.write(f"- Next: `{row.get('next')}`\n")
          PY

      - name: Cleanup raw evidence and SSH key
        if: always()
        run: |
          rm -rf input
          rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-strategy-loss-attribution-gemini-v1-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
