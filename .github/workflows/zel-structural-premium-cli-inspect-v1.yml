name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect replay metric helpers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          E=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine/replay_v1.py
          R=/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay/report.json
          T=/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay/trades.jsonl.gz
          echo '===METRIC_FUNCS==='; grep -n '^def .*metric\|^def aggregate_strategy\|^def .*drawdown\|^def .*score' "$E" | head -120 || true
          echo '===METRIC_BODY==='; sed -n '640,790p' "$E"
          echo '===AGG_BODY==='; sed -n '790,920p' "$E"
          echo '===REPORT_KEYS==='; python3 -c "import json; r=json.load(open('$R')); print(sorted(r)); print([(k,type(v).__name__,len(v) if hasattr(v,'__len__') else None) for k,v in r.items() if k in ('scorecards','strategies','results','ranking')])"
          echo '===TRADE_SAMPLE==='; python3 -c "import gzip,json; h=gzip.open('$T','rt'); d=json.loads(next(h)); print(sorted(d)); print(json.dumps(d,sort_keys=True)[:5000])"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
