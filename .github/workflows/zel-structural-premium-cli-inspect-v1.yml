name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect saved multi-AI review
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          P=/opt/zel/research-runtime/jobs/structural-premium-vwap-closed-loop-v1/advisory/code_review_gen0.json
          python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("/opt/zel/research-runtime/jobs/structural-premium-vwap-closed-loop-v1/advisory/code_review_gen0.json").read_text()); print("KEYS",sorted(d)); print("ERROR",d.get("error")); print("FINAL_REPR",repr(d.get("final"))); [(print("ROLE",x.get("role"),"MODEL",x.get("model"),"CONTENT_START"),print(x.get("content",x.get("text",x.get("answer",x.get("response",""))))),print("CONTENT_END")) for x in d.get("round1",[])]; print("ROUND2",json.dumps(d.get("round2"),ensure_ascii=False)[:16000]); print("JUDGE",json.dumps(d.get("judge"),ensure_ascii=False)[:16000])'
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
