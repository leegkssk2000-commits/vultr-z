name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Compact AI council contract probe
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          S=/home/z/z/_ai_council/server.js
          echo '===PACKAGE==='; cat /home/z/z/_ai_council/package.json 2>/dev/null || true
          echo '===ROUTES_LISTEN_MODELS==='; grep -nE 'app\.(get|post|put|delete)|router\.|listen\(|PORT|openrouter|OPENROUTER|gemini|GEMINI|grok|GROK|model|provider|fetch\(' "$S" 2>/dev/null | head -180 || true
          echo '===ROLE_REGISTRY_SUMMARY==='; python3 -c "import json,pathlib; p=pathlib.Path('/home/z/z/data/ai_role_registry_latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(json.dumps(d,ensure_ascii=False)[:12000])" 2>/dev/null || true
          echo '===PROCESS==='; pgrep -af '_ai_council|server.js|openrouter|gemini|grok' || true
          echo '===PORTS==='; ss -ltnp 2>/dev/null | grep -E 'node|:3000|:3001|:3002|:8080|:8787' | head -80 || true
          echo '===GEMINI_CONFIG_KEYS==='; python3 -c "import json,pathlib; p=pathlib.Path('/home/z/z/backend/config/gemini_oauth.json'); print(sorted(json.loads(p.read_text()).keys()) if p.exists() else [])" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
