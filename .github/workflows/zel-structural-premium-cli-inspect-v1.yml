name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect targeted replay v2 state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          NEW=/opt/zel/research-runtime/jobs/structural-premium-targeted-fix-v2
          echo '===FILES==='; find "$NEW/result" -maxdepth 1 -type f -printf '%f %s\n' 2>/dev/null | sort || true
          echo '===OVERLAY==='; cat "$NEW/result/candidate_overlay_receipt.json" 2>/dev/null || true
          echo '===REGISTRY_PREFLIGHT==='; cat "$NEW/result/registry_preflight.json" 2>/dev/null || true
          echo '===CENSUS==='; cat "$NEW/result/candidate_census.json" 2>/dev/null || true
          echo '===SEED==='; cat "$NEW/result/seed_receipt.json" 2>/dev/null || true
          echo '===STATUS==='; cat "$NEW/status.json" 2>/dev/null || true
          echo '===RUNNER==='; cat "$NEW/runner.pid" 2>/dev/null || true; pgrep -af 'structural-premium-targeted-fix-v2|lane_checkpoint_v2.py|replay_v2.py' || true
          echo '===LANE_LOG_HEAD==='; head -20 "$NEW/logs/runner.log" 2>/dev/null || true
          echo '===LANE_LOG_TAIL==='; tail -40 "$NEW/logs/runner.log" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key

