name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Probe upgraded AI models individually
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=/home/z/z/_ai_council
          set -a; . "$C/.env"; set +a
          BASE=${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
          for MODEL in openai/gpt-5.6-sol openai/gpt-5.4 google/gemini-2.5-pro google/gemini-2.5-flash xai/grok-4.3 xai/grok-4; do
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"model":sys.argv[1],"messages":[{"role":"user","content":"Reply OK"}],"max_tokens":16,"temperature":0}))' "$MODEL")
            CODE=$(curl -sS -m 60 -o /tmp/model_probe.json -w '%{http_code}' -H "Authorization: Bearer $REQUESTY_API_KEY" -H 'Content-Type: application/json' -d "$BODY" "$BASE/chat/completions" || true)
            MSG=$(python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("/tmp/model_probe.json").read_text()); print((d.get("choices") or [{}])[0].get("message",{}).get("content") or d.get("error",{}).get("message") or "")' 2>/dev/null || true)
            echo "$MODEL|$CODE|${MSG:0:180}"
          done
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
