name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect baseline metrics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          J=/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay
          python3 - <<'PY'
import gzip,json,pathlib
j=pathlib.Path('/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay')
r=json.loads((j/'report.json').read_text())
print('REPORT_KEYS',sorted(r.keys()))
print('STATE',r.get('state'),'COUNT',r.get('strategy_count_completed'))
for k in ('scorecards','strategy_scorecards','strategies'):
    v=r.get(k)
    if isinstance(v,list):
        print('CARD_CONTAINER',k,len(v))
        for c in v:
            if c.get('strategy_id')=='vwap_revert':
                print('VWAP_CARD',json.dumps(c,sort_keys=True)[:16000])
                break
rows=[]
with gzip.open(j/'trades.jsonl.gz','rt',encoding='utf-8') as h:
    for line in h:
        d=json.loads(line)
        if d.get('strategy_id')=='vwap_revert': rows.append(d)
print('VWAP_ROWS',len(rows))
print('TRADE_KEYS',sorted(rows[0].keys()) if rows else [])
print('WINDOW_COUNTS', {w:sum(1 for x in rows if x.get('window_id')==w) for w in sorted(set(x.get('window_id') for x in rows))})
print('TRADE_SAMPLE',json.dumps(rows[0],sort_keys=True)[:4000] if rows else '')
PY
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
