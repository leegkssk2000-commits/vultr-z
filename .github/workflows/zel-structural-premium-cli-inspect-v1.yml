name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect AI council readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===COUNCIL_PACKAGE==='; cat /home/z/z/_ai_council/package.json 2>/dev/null || true
          echo '===COUNCIL_SERVER_1_360==='; sed -n '1,360p' /home/z/z/_ai_council/server.js 2>/dev/null || true
          echo '===AI_ROLE_REGISTRY==='; cat /home/z/z/data/ai_role_registry_latest.json 2>/dev/null || true
          echo '===COUNCIL_PROCESSES==='; pgrep -af '_ai_council|server.js|openrouter|gemini|grok' || true
          echo '===LISTEN_PORTS==='; ss -ltnp 2>/dev/null | grep -E 'node|python|:3000|:3001|:3002|:8080|:8787' | head -120 || true
          echo '===COUNCIL_LOG_TAIL==='; tail -80 /home/z/z/_ai_council/logs/chat.jsonl 2>/dev/null || true
          echo '===GEMINI_CONFIG_KEYS==='; python3 -c "import json,pathlib; p=pathlib.Path('/home/z/z/backend/config/gemini_oauth.json'); print(sorted(json.loads(p.read_text()).keys()) if p.exists() else [])" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
