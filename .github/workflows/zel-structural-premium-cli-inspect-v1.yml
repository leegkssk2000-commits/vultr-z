name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect vwap decomposition
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          R=/opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay/report.json
          python3 -c "import json; r=json.load(open('$R')); c=next(x for x in r['scorecards'] if x['strategy_id']=='vwap_revert'); print('OVERALL',json.dumps(c['closed_metrics_ex_funding'],sort_keys=True)); print('BY_WINDOW',json.dumps(c['by_window'],sort_keys=True)); print('BY_SIDE',json.dumps(c['by_side'],sort_keys=True)); print('BY_REGIME',json.dumps(c['by_regime'],sort_keys=True)); print('COUNTERS',{k:c[k] for k in ('strategy_call_count','signal_count','valid_entry_count','open_count','close_count','error_count')})"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
