name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect owner manifest contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CANON=/opt/zel/forward-expansion-v1/source
          echo '===OWNER_MANIFEST==='
          cat "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json"
          echo '===BINDING_CANDIDATES==='
          find "$CANON/backend/config" -maxdepth 1 -type f -iname '*binding*.json' -print -exec sh -c 'echo ---$1; cat "$1"' _ {} \;
          echo '===LOADER==='
          sed -n '1,230p' "$CANON/backend/engine/q4r3_exact25_shadow_manifest_loader.py"
          echo '===PRODUCER_LOAD_REGISTRY==='
          sed -n '150,230p' "$CANON/tools/q4r3_exact25_dedicated_shadow_producer.py"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
