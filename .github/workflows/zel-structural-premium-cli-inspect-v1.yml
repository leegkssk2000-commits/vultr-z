name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect no-trend cardinality contracts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          OLD=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine
          echo '===REPLAY_V1 CONTRACTS==='
          grep -n -E 'REGISTRY|EXPECTED_STRATEGY|STRUCTURAL_PREMIUM|strategy_count|WORKER_' "$OLD/replay_v1.py" | head -120 || true
          echo '===REPLAY_V1 380-430==='
          sed -n '380,430p' "$OLD/replay_v1.py"
          echo '===LANE CONTRACTS==='
          grep -n -E 'REGISTRY|EXPECTED_STRATEGY|STRUCTURAL_PREMIUM|TOTAL_UNITS|total_units|strategy_count|60|4' "$OLD/lane_checkpoint_v2.py" | head -180 || true
          echo '===REPLAY_V2 CONTRACTS==='
          grep -n -E 'REGISTRY|EXPECTED_STRATEGY|STRUCTURAL_PREMIUM|strategy_count|WORKER_|4' "$OLD/replay_v2.py" | head -180 || true
          echo '===REPLAY_V2 300-350==='
          sed -n '300,350p' "$OLD/replay_v2.py"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
