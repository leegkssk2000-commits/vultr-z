name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Discover live Requesty model IDs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=/home/z/z/_ai_council
          set -a; . "$C/.env"; set +a
          BASE=${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
          curl -fsS -m 30 -H "Authorization: Bearer $REQUESTY_API_KEY" "$BASE/models" > /tmp/requesty_models.json
          python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("/tmp/requesty_models.json").read_text()); rows=d.get("data",d if isinstance(d,list) else []); ids=sorted(str(x.get("id","")) for x in rows if isinstance(x,dict)); print("OPENAI",[x for x in ids if "openai/" in x.lower()][:40]); print("GEMINI",[x for x in ids if "gemini" in x.lower()][:80]); print("GROK",[x for x in ids if "grok" in x.lower()][:80]); print("COUNT",len(ids))'
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
