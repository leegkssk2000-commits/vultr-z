name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect targeted lane reuse contracts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          J=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine
          echo '===LANE_TOP==='; sed -n '1,180p' "$J/lane_checkpoint_v2.py"
          echo '===LANE_MAIN==='; sed -n '180,380p' "$J/lane_checkpoint_v2.py"
          echo '===REPLAYV2_TOP==='; sed -n '1,220p' "$J/replay_v2.py"
          echo '===REPLAYV2_MAIN==='; sed -n '280,430p' "$J/replay_v2.py"
          echo '===SAMPLE_LANE_KEYS==='; python3 -c 'import gzip,json,pathlib; p=next(pathlib.Path("/opt/zel/research-runtime/jobs/structural-premium-targeted-fix-v2/work/replay/lane_checkpoints/vwap_revert").glob("*.json.gz")); d=json.load(gzip.open(p,"rt")); print(p.name); print(sorted(d.keys())); print({k:d.get(k) for k in d if k!="result"}); print("RESULT_KEYS",sorted((d.get("result") or {}).keys()))'
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
