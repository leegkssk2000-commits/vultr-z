name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Diagnose linked AI provider failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=/home/z/z/_ai_council
          cd "$C"
          pkill -f '/home/z/z/_ai_council/server.js' 2>/dev/null || true
          nohup env PORT=18787 node "$C/server.js" >/tmp/zel_ai_council_diag.log 2>&1 & PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS -m 2 http://127.0.0.1:18787/health >/dev/null 2>&1 && break; sleep 1; done
          echo '===HEALTH==='; curl -sS -m 3 http://127.0.0.1:18787/health || true
          BODY='{"question":"연결 상태 테스트. 한 줄로 OK만 답해라."}'
          echo; echo '===ASK_STATUS_BODY==='; curl -sS -m 60 -o /tmp/ask.body -w '%{http_code}\n' -H 'Content-Type: application/json' -d "$BODY" http://127.0.0.1:18787/ask || true; cat /tmp/ask.body 2>/dev/null || true
          echo; echo '===COUNCIL_STATUS_BODY==='; curl -sS -m 120 -o /tmp/council.body -w '%{http_code}\n' -H 'Content-Type: application/json' -d "$BODY" http://127.0.0.1:18787/council || true; cat /tmp/council.body 2>/dev/null || true
          echo; echo '===SERVER_LOG==='; tail -80 /tmp/zel_ai_council_diag.log 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
