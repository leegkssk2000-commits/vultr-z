name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Locate closed-loop runner
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===CANDIDATE_FILES==='
          find /opt/zel/research-runtime -maxdepth 6 -type f \( -iname '*candidate*' -o -iname '*closed*loop*' -o -iname '*six*axis*' -o -iname '*overlay*' \) -printf '%p\n' 2>/dev/null | sort | tail -250
          echo '===CLOSED_LOOP_REFS==='
          grep -RIl --exclude='*.gz' --exclude='*.csv' --exclude='*.log' -E 'closed_loop_axes|COST_EXECUTION|RISK_EXPOSURE|PORTFOLIO|ROBUSTNESS' /opt/zel/research-runtime 2>/dev/null | sort | tail -150
          echo '===JOB_DIRS==='
          find /opt/zel/research-runtime/jobs -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort | tail -100
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
