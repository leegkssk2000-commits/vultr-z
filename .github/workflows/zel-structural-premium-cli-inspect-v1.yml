name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect council request contract safely
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=/home/z/z/_ai_council
          S="$C/server.js"
          echo '===ENV_KEYS_ONLY==='; test -f "$C/.env" && sed -E 's/[[:space:]]*=.*$//' "$C/.env" | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u || true
          echo '===NODE_MODULES==='; test -d "$C/node_modules" && echo PRESENT || echo ABSENT
          echo '===SERVER_HEAD==='; sed -n '1,90p' "$S" 2>/dev/null || true
          echo '===ASK_COUNCIL_CONTRACT==='; sed -n '90,220p' "$S" 2>/dev/null || true
          echo '===DEBATE_CONTRACT==='; sed -n '220,330p' "$S" 2>/dev/null || true
          echo '===SERVICES==='; systemctl list-unit-files --type=service --no-pager | grep -Ei 'council|requesty|openrouter|gemini|grok' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
