name: ZEL Structural Premium CLI Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-cli-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect replay capacity and progress
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          G=/opt/zel/research-runtime/jobs/structural-premium-vwap-closed-loop-v1/gen0
          echo '===CAPACITY==='; echo NPROC=$(nproc); free -h; uptime; vmstat 1 2 | tail -1 || true
          echo '===TOP_CPU==='; ps -eo pid,pcpu,pmem,etime,cmd --sort=-pcpu | head -18
          for cid in A B C; do
            echo "===${cid}_W12_COUNT==="; find "$G/runs/$cid/replay_w12/lane_checkpoints/vwap_revert" -type f -name '*.json.gz' 2>/dev/null | wc -l || true
            echo "===${cid}_W12_LOG_TAIL==="; tail -12 "$G/runs/$cid/logs/w12.log" 2>/dev/null || true
            echo "===${cid}_W12_SCORE==="; cat "$G/runs/$cid/result/w12_score.json" 2>/dev/null || true
          done
          echo '===SELECTION==='; cat "$G/result/w12_selection.json" 2>/dev/null || true
          echo '===TERMINAL==='; cat "$G/result/terminal_receipt.json" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
