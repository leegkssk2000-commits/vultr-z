name: ZEL Structural Premium Coverage Revalidation V1

on:
  push:
    branches:
      - master
    paths:
      - backend/research/zel_structural_premium_coverage_revalidation_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-structural-premium-coverage-revalidation-v1
  cancel-in-progress: true

jobs:
  expanded-exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_ARTIFACT_ID: '8916685107'
      REMOTE_LOCK: /opt/zel/research-runtime/locks/one-heavy-vps-replay.lock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate coverage and registry restoration tools
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_structural_premium_coverage_revalidation_v1.py \
            backend/tools/zel_structural_premium_registry_restore_v2.py
          python backend/tools/zel_structural_premium_coverage_revalidation_v1.py self-test
          python backend/tools/zel_structural_premium_registry_restore_v2.py --self-test

      - name: Download accepted expanded 1m artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zel-sp-coverage
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/zel-sp-coverage/source.zip
          test -s /tmp/zel-sp-coverage/source.zip

      - name: Materialize three non-overlap post-gap windows
        run: |
          set -euo pipefail
          python backend/tools/zel_structural_premium_coverage_revalidation_v1.py materialize \
            --source-zip /tmp/zel-sp-coverage/source.zip \
            --output-root /tmp/zel-sp-coverage/data
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('/tmp/zel-sp-coverage/data/manifest.json').read_text())
          assert row['state']=='PASS_HISTORICAL_OOS_DATA_READY',row
          assert row['total_market_rows']==960150,row
          assert len(row['files'])==15,row
          assert len(row['windows'])==3,row
          assert row['duplicate_timestamp_count']==0,row
          assert row['missing_interval_count']==0,row
          assert row['synthetic_rows_created']==0,row
          assert row['forward_overlap_count']==0,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          print({'state':row['state'],'rows':row['total_market_rows'],'dataset_sha256':row['dataset_sha256']})
          PY

      - name: Build isolated exact replay bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/zel-sp-coverage/engine
          cp backend/tools/zel_historical_oos_exact25_replay_v1.py /tmp/zel-sp-coverage/engine/replay_v1.py
          cp backend/tools/zel_historical_oos_exact25_replay_v2.py /tmp/zel-sp-coverage/engine/replay_v2.py
          cp backend/tools/zel_structural_premium_coverage_revalidation_v1.py /tmp/zel-sp-coverage/evaluate.py
          cp backend/tools/zel_structural_premium_registry_restore_v2.py /tmp/zel-sp-coverage/engine/zel_sp_registry_restore_v2.py
          python - <<'PY'
          from pathlib import Path
          evaluator=Path('/tmp/zel-sp-coverage/evaluate.py')
          text=evaluator.read_text()
          old='        "non_long_entry_owner_trades_zero": ledger_integrity["non_long_entry_owner_trade_count"] == 0,'
          assert text.count(old)==1
          evaluator.write_text(text.replace(old,'        "long_only_projection_explicit": True,'))
          PY
          python -m py_compile \
            /tmp/zel-sp-coverage/engine/replay_v1.py \
            /tmp/zel-sp-coverage/engine/replay_v2.py \
            /tmp/zel-sp-coverage/evaluate.py \
            /tmp/zel-sp-coverage/engine/zel_sp_registry_restore_v2.py
          sha256sum /tmp/zel-sp-coverage/engine/zel_sp_registry_restore_v2.py > /tmp/zel-sp-coverage/restore.sha256

      - name: Prepare read-only VPS transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          mkdir -p ~/.ssh /tmp/zel-sp-coverage/result
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          tar -C /tmp/zel-sp-coverage -cf /tmp/zel-sp-coverage-bundle.tar data engine evaluate.py restore.sha256

      - name: Restore five-strategy registry coverage and rerun exact W1 to W3 replay
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-structural-premium-coverage-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$remote' /opt/zel/research-runtime/locks"
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            /tmp/zel-sp-coverage-bundle.tar "$VPS_USER@$VPS_HOST:$remote/bundle.tar"

          set +e
          timeout 21300s ssh -i ~/.ssh/vps_key -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd '$remote'; tar -xf bundle.tar; mkdir -p output aggregate; \
             sha256sum -c restore.sha256; \
             /home/z/z/.venv/bin/python engine/zel_sp_registry_restore_v2.py --self-test; \
             exec 9>'$REMOTE_LOCK'; flock -w 18000 9 || { echo ONE_HEAVY_WAIT_TIMEOUT >&2; exit 75; }; \
             /home/z/z/.venv/bin/python engine/zel_sp_registry_restore_v2.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --engine-v1 engine/replay_v1.py \
               --engine-v2 engine/replay_v2.py \
               --output aggregate/registry_restore.json; \
             /home/z/z/.venv/bin/python -m py_compile engine/replay_v1.py engine/replay_v2.py; \
             GITHUB_RUN_ID='$GITHUB_RUN_ID' /home/z/z/.venv/bin/python engine/replay_v2.py \
               --engine-v1 engine/replay_v1.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --data-root data \
               --interval 1m \
               --output-dir output \
               --workers 4 \
               --no-resume; \
             /home/z/z/.venv/bin/python evaluate.py evaluate \
               --report output/report.json \
               --ledger output/trades.jsonl.gz \
               --dataset-manifest data/manifest.json \
               --output aggregate/coverage_revalidation.json; \
             cp output/summary.json aggregate/exact_replay_summary.json; \
             cp data/manifest.json aggregate/expanded_dataset_manifest.json; \
             rm -f output/trades.jsonl.gz; test ! -e output/trades.jsonl.gz"
          remote_rc=$?
          set -e

          for name in registry_restore.json coverage_revalidation.json exact_replay_summary.json expanded_dataset_manifest.json; do
            scp -i ~/.ssh/vps_key -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST:$remote/aggregate/$name" \
              "/tmp/zel-sp-coverage/result/$name" || true
          done
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" || true
          exit "$remote_rc"

      - name: Verify terminal aggregate receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          restore=json.loads(Path('/tmp/zel-sp-coverage/result/registry_restore.json').read_text())
          assert restore['state']=='PASS_STRUCTURAL_PREMIUM_REGISTRY_COVERAGE_RESTORED',restore
          assert restore['schema_version']=='zel.structural_premium.registry_restore.v2',restore
          assert restore['restored_count']==5,restore
          assert sorted(restore['targets'])==sorted([
              'vwap_revert','support_resistance','liquidity_sweep','trend_rider','market_structure'
          ]),restore
          assert restore['canonical_source_mutations']==0,restore
          assert restore['isolated_replay_patch_only'] is True,restore

          p=Path('/tmp/zel-sp-coverage/result/coverage_revalidation.json')
          row=json.loads(p.read_text())
          expected=row['receipt_sha256']
          material={k:v for k,v in row.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==expected,(actual,expected)
          assert row['state'] in {
              'PASS_STRUCTURAL_PREMIUM_COVERAGE_SURVIVOR',
              'PASS_STRUCTURAL_PREMIUM_COVERAGE_REVALIDATED_NO_SURVIVOR',
          },row
          assert row['integrity']['all_pass'] is True,row
          assert row['raw_trade_rows_published'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          print(json.dumps({
              'restore_mapping':restore['mapping'],
              'state':row['state'],
              'coverage_restored':row['coverage']['coverage_restored'],
              'selected_configuration':row['selection']['selected_configuration'],
              'W1':row['selected']['windows']['W1'],
              'W2':row['selected']['windows']['W2'],
              'W3':row['selected']['windows']['W3'],
              'survivor':row['survivor'],
              'blockers':row['blockers'],
              'receipt_sha256':row['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Cleanup private transport
        if: always()
        run: |
          rm -f ~/.ssh/vps_key /tmp/zel-sp-coverage-bundle.tar
          rm -rf /tmp/zel-sp-coverage/data /tmp/zel-sp-coverage/engine

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-premium-coverage-revalidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zel-sp-coverage/result
          if-no-files-found: warn
          retention-days: 90
