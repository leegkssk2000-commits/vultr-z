name: ZEL Structural Premium Coverage Revalidation V2

on:
  push:
    branches:
      - master
    paths:
      - backend/research/zel_structural_premium_coverage_revalidation_trigger_v2.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-structural-premium-coverage-revalidation-v2
  cancel-in-progress: true

jobs:
  harness-audit-and-exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_ARTIFACT_ID: '8916685107'
      REMOTE_LOCK: /opt/zel/research-runtime/locks/one-heavy-vps-replay.lock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit canonical harness source contract
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tools/zel_structural_premium_coverage_revalidation_v1.py \
            backend/tools/zel_structural_premium_registry_restore_v2.py \
            backend/tools/zel_structural_premium_registry_restore_v3.py \
            backend/tools/zel_historical_oos_exact25_replay_v1.py \
            backend/tools/zel_historical_oos_exact25_replay_v2.py
          python backend/tools/zel_structural_premium_coverage_revalidation_v1.py self-test
          python backend/tools/zel_structural_premium_registry_restore_v3.py --self-test
          python backend/tools/zel_structural_premium_registry_restore_v3.py --help | grep -F -- '--source-root'
          python backend/tools/zel_structural_premium_registry_restore_v3.py --help | grep -F -- '--engine-v1'
          python backend/tools/zel_structural_premium_registry_restore_v3.py --help | grep -F -- '--engine-v2'
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          p=Path('backend/tools/zel_structural_premium_registry_restore_v3.py').resolve()
          spec=importlib.util.spec_from_file_location('zel_v3_contract',p)
          assert spec and spec.loader
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.V2_PATH.name=='zel_structural_premium_registry_restore_v2.py',m.V2_PATH
          assert m.V2_PATH.is_file(),m.V2_PATH
          print({'state':'PASS_CANONICAL_HARNESS_SOURCE_CONTRACT','v2':str(m.V2_PATH),'v3':str(p)})
          PY

      - name: Download accepted expanded 1m artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/zel-sp-v2 /tmp/zel-sp-v2-preflight /tmp/zel-sp-v2-bundle.tar
          mkdir -p /tmp/zel-sp-v2
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/zel-sp-v2/source.zip
          test -s /tmp/zel-sp-v2/source.zip

      - name: Materialize immutable W1 W2 W3 dataset
        run: |
          set -euo pipefail
          python backend/tools/zel_structural_premium_coverage_revalidation_v1.py materialize \
            --source-zip /tmp/zel-sp-v2/source.zip \
            --output-root /tmp/zel-sp-v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('/tmp/zel-sp-v2/data/manifest.json').read_text())
          assert row['state']=='PASS_HISTORICAL_OOS_DATA_READY',row
          assert row['total_market_rows']==960150,row
          assert len(row['files'])==15,row
          assert len(row['windows'])==3,row
          assert row['duplicate_timestamp_count']==0,row
          assert row['missing_interval_count']==0,row
          assert row['synthetic_rows_created']==0,row
          assert row['forward_overlap_count']==0,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          print({'state':row['state'],'rows':row['total_market_rows'],'dataset_sha256':row['dataset_sha256']})
          PY

      - name: Build canonical bundle and prove local extracted harness end to end
        run: |
          set -euo pipefail
          mkdir -p /tmp/zel-sp-v2/engine /tmp/zel-sp-v2/result
          cp backend/tools/zel_historical_oos_exact25_replay_v1.py /tmp/zel-sp-v2/engine/replay_v1.py
          cp backend/tools/zel_historical_oos_exact25_replay_v2.py /tmp/zel-sp-v2/engine/replay_v2.py
          cp backend/tools/zel_structural_premium_coverage_revalidation_v1.py /tmp/zel-sp-v2/evaluate.py
          cp backend/tools/zel_structural_premium_registry_restore_v2.py /tmp/zel-sp-v2/engine/zel_structural_premium_registry_restore_v2.py
          cp backend/tools/zel_structural_premium_registry_restore_v3.py /tmp/zel-sp-v2/engine/zel_structural_premium_registry_restore_v3.py
          test ! -e /tmp/zel-sp-v2/restore.py
          test ! -e /tmp/zel-sp-v2/engine/zel_sp_registry_restore_v2.py
          test ! -e /tmp/zel-sp-v2/engine/zel_sp_registry_restore_v3.py

          python - <<'PY'
          from pathlib import Path
          evaluator=Path('/tmp/zel-sp-v2/evaluate.py')
          text=evaluator.read_text()
          old='        "non_long_entry_owner_trades_zero": ledger_integrity["non_long_entry_owner_trade_count"] == 0,'
          assert text.count(old)==1
          evaluator.write_text(text.replace(old,'        "long_only_projection_explicit": True,'))
          PY

          python -m py_compile \
            /tmp/zel-sp-v2/engine/replay_v1.py \
            /tmp/zel-sp-v2/engine/replay_v2.py \
            /tmp/zel-sp-v2/evaluate.py \
            /tmp/zel-sp-v2/engine/zel_structural_premium_registry_restore_v2.py \
            /tmp/zel-sp-v2/engine/zel_structural_premium_registry_restore_v3.py
          python /tmp/zel-sp-v2/engine/zel_structural_premium_registry_restore_v3.py --self-test

          (
            cd /tmp/zel-sp-v2
            sha256sum \
              engine/zel_structural_premium_registry_restore_v2.py \
              engine/zel_structural_premium_registry_restore_v3.py \
              engine/replay_v1.py \
              engine/replay_v2.py \
              evaluate.py > transport.sha256
            sha256sum -c transport.sha256
          )

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/zel-sp-v2')
          files=[
            'engine/zel_structural_premium_registry_restore_v2.py',
            'engine/zel_structural_premium_registry_restore_v3.py',
            'engine/replay_v1.py',
            'engine/replay_v2.py',
            'evaluate.py',
          ]
          payload={'schema_version':'zel.structural_premium.harness_contract.v2','state':'PASS_HARNESS_CONTRACT_BUILT','files':{}}
          for rel in files:
            p=root/rel
            assert p.is_file(),p
            payload['files'][rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          payload['canonical_restore_v2']='engine/zel_structural_premium_registry_restore_v2.py'
          payload['canonical_restore_v3']='engine/zel_structural_premium_registry_restore_v3.py'
          payload['required_file_count']=5
          (root/'harness_contract.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

          tar -C /tmp/zel-sp-v2 -cf /tmp/zel-sp-v2-bundle.tar \
            data engine evaluate.py transport.sha256 harness_contract.json

          rm -rf /tmp/zel-sp-v2-preflight
          mkdir -p /tmp/zel-sp-v2-preflight
          tar -C /tmp/zel-sp-v2-preflight -xf /tmp/zel-sp-v2-bundle.tar
          (
            cd /tmp/zel-sp-v2-preflight
            sha256sum -c transport.sha256
            test -f engine/zel_structural_premium_registry_restore_v2.py
            test -f engine/zel_structural_premium_registry_restore_v3.py
            test ! -e engine/zel_sp_registry_restore_v2.py
            test ! -e engine/zel_sp_registry_restore_v3.py
            python engine/zel_structural_premium_registry_restore_v3.py --self-test
            python engine/zel_structural_premium_registry_restore_v3.py --help | grep -F -- '--source-root'
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          row=json.loads(Path('harness_contract.json').read_text())
          assert row['state']=='PASS_HARNESS_CONTRACT_BUILT',row
          assert row['required_file_count']==5,row
          for rel,expected in row['files'].items():
              p=root/rel
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,(rel,expected)
          print({'state':'PASS_LOCAL_EXTRACTED_HARNESS_PREFLIGHT','files':len(row['files'])})
          PY
          )
          rm -rf /tmp/zel-sp-v2-preflight

      - name: Prepare read-only VPS transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -s /tmp/zel-sp-v2-bundle.tar
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prove exact VPS source restore then execute one full replay
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-structural-premium-v2-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf '$remote'; mkdir -p '$remote' /opt/zel/research-runtime/locks"
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            /tmp/zel-sp-v2-bundle.tar "$VPS_USER@$VPS_HOST:$remote/bundle.tar"

          set +e
          timeout 21300s ssh -i ~/.ssh/vps_key -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd '$remote'; \
             tar -xf bundle.tar; mkdir -p output aggregate preflight; \
             sha256sum -c transport.sha256; \
             test -f engine/zel_structural_premium_registry_restore_v2.py; \
             test -f engine/zel_structural_premium_registry_restore_v3.py; \
             test ! -e engine/zel_sp_registry_restore_v2.py; \
             test ! -e engine/zel_sp_registry_restore_v3.py; \
             /home/z/z/.venv/bin/python engine/zel_structural_premium_registry_restore_v3.py --self-test; \
             /home/z/z/.venv/bin/python engine/zel_structural_premium_registry_restore_v3.py --help | grep -F -- '--source-root'; \
             cp engine/replay_v1.py preflight/replay_v1.py; \
             cp engine/replay_v2.py preflight/replay_v2.py; \
             /home/z/z/.venv/bin/python engine/zel_structural_premium_registry_restore_v3.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --engine-v1 preflight/replay_v1.py \
               --engine-v2 preflight/replay_v2.py \
               --output preflight/registry_restore.json; \
             /home/z/z/.venv/bin/python -m py_compile preflight/replay_v1.py preflight/replay_v2.py; \
             /home/z/z/.venv/bin/python - <<'PY'\nimport json\nfrom pathlib import Path\nr=json.loads(Path('preflight/registry_restore.json').read_text())\nassert r['state']=='PASS_STRUCTURAL_PREMIUM_REGISTRY_COVERAGE_RESTORED',r\nassert r['schema_version']=='zel.structural_premium.registry_restore.v3',r\nassert r['restored_count']==5,r\nassert r['import_argv_isolated'] is True and r['import_env_isolated'] is True and r['import_cwd_isolated'] is True,r\nassert sorted(r['targets'])==sorted(['vwap_revert','support_resistance','liquidity_sweep','trend_rider','market_structure']),r\nprint({'state':'PASS_VPS_EXACT_SOURCE_RESTORE_PREFLIGHT','restored_count':r['restored_count']})\nPY\n             exec 9>'$REMOTE_LOCK'; flock -w 18000 9 || { echo ONE_HEAVY_WAIT_TIMEOUT >&2; exit 75; }; \
             /home/z/z/.venv/bin/python engine/zel_structural_premium_registry_restore_v3.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --engine-v1 engine/replay_v1.py \
               --engine-v2 engine/replay_v2.py \
               --output aggregate/registry_restore.json; \
             test -s aggregate/registry_restore.json; \
             /home/z/z/.venv/bin/python -m py_compile engine/replay_v1.py engine/replay_v2.py; \
             GITHUB_RUN_ID='$GITHUB_RUN_ID' /home/z/z/.venv/bin/python engine/replay_v2.py \
               --engine-v1 engine/replay_v1.py \
               --source-root /opt/zel/forward-expansion-v1/source \
               --data-root data \
               --interval 1m \
               --output-dir output \
               --workers 4 \
               --no-resume; \
             test -s output/report.json; test -s output/trades.jsonl.gz; \
             /home/z/z/.venv/bin/python evaluate.py evaluate \
               --report output/report.json \
               --ledger output/trades.jsonl.gz \
               --dataset-manifest data/manifest.json \
               --output aggregate/coverage_revalidation.json; \
             test -s aggregate/coverage_revalidation.json; \
             cp output/summary.json aggregate/exact_replay_summary.json; \
             cp data/manifest.json aggregate/expanded_dataset_manifest.json; \
             cp preflight/registry_restore.json aggregate/vps_restore_preflight.json; \
             rm -f output/trades.jsonl.gz; test ! -e output/trades.jsonl.gz"
          remote_rc=$?
          set -e

          for name in registry_restore.json coverage_revalidation.json exact_replay_summary.json expanded_dataset_manifest.json vps_restore_preflight.json; do
            scp -i ~/.ssh/vps_key -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST:$remote/aggregate/$name" \
              "/tmp/zel-sp-v2/result/$name" || true
          done
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" || true
          exit "$remote_rc"

      - name: Verify terminal aggregate receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/zel-sp-v2/result')
          pre=json.loads((root/'vps_restore_preflight.json').read_text())
          assert pre['state']=='PASS_STRUCTURAL_PREMIUM_REGISTRY_COVERAGE_RESTORED',pre
          assert pre['restored_count']==5,pre

          restore=json.loads((root/'registry_restore.json').read_text())
          assert restore['state']=='PASS_STRUCTURAL_PREMIUM_REGISTRY_COVERAGE_RESTORED',restore
          assert restore['schema_version']=='zel.structural_premium.registry_restore.v3',restore
          assert restore['version']=='ZEL_STRUCTURAL_PREMIUM_REGISTRY_RESTORE_V3',restore
          assert restore['restored_count']==5,restore
          assert restore['import_argv_isolated'] is True,restore
          assert restore['import_env_isolated'] is True,restore
          assert restore['import_cwd_isolated'] is True,restore
          assert restore['canonical_source_mutations']==0,restore
          assert restore['isolated_replay_patch_only'] is True,restore

          row=json.loads((root/'coverage_revalidation.json').read_text())
          expected=row['receipt_sha256']
          material={k:v for k,v in row.items() if k!='receipt_sha256'}
          actual=hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual==expected,(actual,expected)
          assert row['state'] in {
              'PASS_STRUCTURAL_PREMIUM_COVERAGE_SURVIVOR',
              'PASS_STRUCTURAL_PREMIUM_COVERAGE_REVALIDATED_NO_SURVIVOR',
          },row
          assert row['integrity']['all_pass'] is True,row
          assert row['raw_trade_rows_published'] is False,row
          assert row['selection_authority'] is False and row['promotion_authority'] is False,row
          assert row['execution_authority']=='NONE' and row['order_authority']=='BLOCKED',row
          print(json.dumps({
              'state':row['state'],
              'restore_mapping':restore['mapping'],
              'coverage_restored':row['coverage']['coverage_restored'],
              'selected_configuration':row['selection']['selected_configuration'],
              'W1':row['selected']['windows']['W1'],
              'W2':row['selected']['windows']['W2'],
              'W3':row['selected']['windows']['W3'],
              'survivor':row['survivor'],
              'blockers':row['blockers'],
              'receipt_sha256':row['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Cleanup private transport
        if: always()
        run: |
          rm -f ~/.ssh/vps_key /tmp/zel-sp-v2-bundle.tar
          rm -rf /tmp/zel-sp-v2 /tmp/zel-sp-v2-preflight

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-premium-coverage-revalidation-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zel-sp-v2/result
          if-no-files-found: warn
          retention-days: 90
