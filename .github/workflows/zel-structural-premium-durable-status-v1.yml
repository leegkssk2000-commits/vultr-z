name: ZEL Structural Premium Durable Status V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_structural_premium_durable_status_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read durable status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          JOB=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          OUT=/opt/zel/research-runtime/checkpoints/structural-premium-v3/output
          echo '===STATUS_JSON==='
          cat "$JOB/status.json" 2>/dev/null || echo '{}'
          echo '===REPORT_REPLAY_COUNTS==='
          /home/z/z/.venv/bin/python - "$OUT/report.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); r=x.get('replay',{})
          print(json.dumps({k:r.get(k) for k in ('censored_open_at_window_end','error_count','strategy_failure_count','signal_count','valid_entry_count','closed_trade_count')},sort_keys=True))
          PY
          echo '===EVALUATOR_FILES==='
          find "$JOB" -maxdepth 4 -type f \( -name '*.py' -o -name '*.sh' \) -print 2>/dev/null | sort
          echo '===EVALUATOR_FIELD_REFERENCES==='
          grep -RInE 'censored_open_zero|errors_zero|strategy_failures_zero|censored_open_at_window_end|strategy_failure_count|error_count|NO_W1_ADMISSIBLE_CONFIGURATION|sample_gate_min_active_strategies' "$JOB" --include='*.py' --include='*.sh' 2>/dev/null | head -n 300 || true
          echo '===RESUME_SCRIPT==='
          sed -n '1,260p' "$JOB/resume_fingerprint_fix_v1.sh" 2>/dev/null || true
          echo '===COVERAGE_REVALIDATION_SHORT==='
          /home/z/z/.venv/bin/python - "$JOB/result/coverage_revalidation.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); print(json.dumps({'blockers':x.get('blockers'),'report_checks':x.get('integrity',{}).get('report_checks'),'coverage':x.get('coverage'),'selection':x.get('selection')},sort_keys=True))
          PY
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
