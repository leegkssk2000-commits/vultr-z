name: ZEL Structural Premium Durable Status V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_structural_premium_durable_status_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read durable status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          JOB=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          OUT=/opt/zel/research-runtime/checkpoints/structural-premium-v3/output
          echo '===STATUS_JSON==='
          cat "$JOB/status.json" 2>/dev/null || echo '{}'
          echo '===PID==='
          pid="$(cat "$JOB/runner.pid" 2>/dev/null || true)"
          echo "pid=$pid"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then echo 'runner_alive=true'; else echo 'runner_alive=false'; fi
          echo '===STRATEGY_CHECKPOINTS==='
          find "$OUT/checkpoints" -maxdepth 1 -type f -name '*.json.gz' -printf '%f\n' 2>/dev/null | sort || true
          echo '===LANE_COUNTS_BY_STRATEGY==='
          for s in liquidity_sweep support_resistance trend_rider vwap_revert; do
            c="$(find "$OUT/lane_checkpoints/$s" -type f -name '*.json.gz' 2>/dev/null | wc -l | tr -d ' ')"
            echo "$s=$c"
          done
          echo '===REPORT_JSON==='
          cat "$OUT/report.json" 2>/dev/null || echo '{}'
          echo '===SUMMARY_JSON==='
          cat "$OUT/summary.json" 2>/dev/null || echo '{}'
          echo '===SCOREBOARD==='
          cat "$OUT/scoreboard.csv" 2>/dev/null || true
          echo '===CHECKPOINT_SUMMARY==='
          /home/z/z/.venv/bin/python - "$OUT" <<'PY'
          import gzip,json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          for p in sorted((out/'checkpoints').glob('*.json.gz')):
              try:
                  with gzip.open(p,'rt',encoding='utf-8') as f: x=json.load(f)
              except Exception as e:
                  print(p.name, 'READ_ERR', repr(e)); continue
              def scalar_map(d):
                  if not isinstance(d,dict): return {}
                  keys=('strategy_id','state','failure','error_count','errors','strategy_failure_count','strategy_failures','censored_open_count','censored_open','trade_count','signal_count','entry_count','long_trade_count','short_trade_count','bars_processed','rows_processed')
                  return {k:d.get(k) for k in keys if k in d}
              print(json.dumps({'file':p.name,'top':scalar_map(x),'result':scalar_map(x.get('result')),'summary':scalar_map(x.get('summary'))},sort_keys=True,default=str))
          PY
          echo '===COVERAGE_REVALIDATION==='
          cat "$JOB/result/coverage_revalidation.json" 2>/dev/null || echo '{}'
          echo '===EVAL_V2_LOG_TAIL==='
          tail -n 120 "$JOB/evaluate_v2.log" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
