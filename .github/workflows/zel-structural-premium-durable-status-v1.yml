name: ZEL Structural Premium Durable Status V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_structural_premium_durable_status_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read durable status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          JOB=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          OUT=/opt/zel/research-runtime/checkpoints/structural-premium-v3/output
          echo '===STATUS_JSON==='
          cat "$JOB/status.json" 2>/dev/null || echo '{}'
          echo '===PID==='
          pid="$(cat "$JOB/runner.pid" 2>/dev/null || true)"
          echo "pid=$pid"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then echo 'runner_alive=true'; else echo 'runner_alive=false'; fi
          if [ -n "$pid" ] && [ -r "/proc/$pid/status" ]; then
            echo '===PROC_STATUS==='
            grep -E '^(Name|State|Pid|PPid|Threads):' "/proc/$pid/status" || true
            echo '===PROC_CMDLINE==='
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
            echo
          fi
          echo '===REPLAY_WORKERS==='
          ps -eo pid,ppid,stat,etime,pcpu,pmem,args --sort=-pcpu | grep -E 'lane_checkpoint_v2.py|replay_v1.py|replay_v2.py' | grep -v grep || true
          echo '===STRATEGY_CHECKPOINTS==='
          find "$OUT/checkpoints" -maxdepth 1 -type f -name '*.json.gz' -printf '%f\n' 2>/dev/null | sort || true
          echo '===LANE_COUNTS_BY_STRATEGY==='
          for s in liquidity_sweep support_resistance trend_rider vwap_revert; do
            c="$(find "$OUT/lane_checkpoints/$s" -type f -name '*.json.gz' 2>/dev/null | wc -l | tr -d ' ')"
            echo "$s=$c"
          done
          echo '===LATEST_CHECKPOINTS==='
          find "$OUT/checkpoints" "$OUT/lane_checkpoints" -type f -name '*.json.gz' -printf '%T@|%TY-%Tm-%TdT%TH:%TM:%TS|%p\n' 2>/dev/null | sort -nr | head -n 20 || true
          echo '===OUTPUT_FILES==='
          find "$OUT" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort || true
          echo '===RESULT_FILES==='
          find "$JOB/result" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
          echo '===COVERAGE_REVALIDATION==='
          cat "$JOB/result/coverage_revalidation.json" 2>/dev/null || echo '{}'
          echo '===RUNNER_FIX_LOG_TAIL==='
          tail -n 80 "$JOB/runner_fix_v1.log" 2>/dev/null || true
          echo '===RUNNER_FIX_V2_LOG_TAIL==='
          tail -n 80 "$JOB/runner_fix_v2.log" 2>/dev/null || true
          echo '===LANE_V2_LOG_TAIL==='
          tail -n 120 "$JOB/lane_v2.log" 2>/dev/null || true
          echo '===AGG_V2_LOG_TAIL==='
          tail -n 80 "$JOB/aggregate_v2.log" 2>/dev/null || true
          echo '===EVAL_V2_LOG_TAIL==='
          tail -n 120 "$JOB/evaluate_v2.log" 2>/dev/null || true
          echo '===OLD_LANE_LOG_TAIL==='
          tail -n 20 "$JOB/lane.log" 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
