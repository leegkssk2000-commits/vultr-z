name: ZEL Structural Premium Error Sample Diagnostic V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_structural_premium_error_sample_diagnostic_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMOTE_OUTPUT: /opt/zel/research-runtime/checkpoints/structural-premium-v3/output
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh /tmp/zel-sp-error-samples
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Extract first execution error evidence from checkpoints
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "REMOTE_OUTPUT='$REMOTE_OUTPUT' bash -s" <<'REMOTE' > /tmp/zel-sp-error-samples/error_samples.json
          set -euo pipefail
          /home/z/z/.venv/bin/python - <<'PY'
          import gzip, json, os
          from pathlib import Path

          root=Path(os.environ['REMOTE_OUTPUT'])/'checkpoints'
          out={'schema_version':'zel.structural_premium.error_samples.v1','strategies':{},'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}

          def clip(v):
              s=repr(v)
              return s if len(s)<=1200 else s[:1200]+'...<truncated>'

          def walk(obj, path='root', found=None, depth=0):
              if found is None: found=[]
              if len(found)>=12 or depth>8: return found
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      lk=str(k).lower()
                      p=f'{path}.{k}'
                      if any(tok in lk for tok in ('error','exception','traceback','failure')):
                          found.append({'path':p,'value':clip(v)})
                          if len(found)>=12: return found
                      walk(v,p,found,depth+1)
                      if len(found)>=12: return found
              elif isinstance(obj, list):
                  for i,v in enumerate(obj[:8]):
                      walk(v,f'{path}[{i}]',found,depth+1)
                      if len(found)>=12: return found
              return found

          for p in sorted(root.glob('*.json.gz')):
              with gzip.open(p,'rt',encoding='utf-8') as h:
                  payload=json.load(h)
              result=payload.get('result') or {}
              lanes=result.get('lanes')
              lane_shape={}
              if isinstance(lanes,dict):
                  lane_shape={'type':'dict','keys':list(lanes.keys())[:20],'count':len(lanes)}
              elif isinstance(lanes,list):
                  lane_shape={'type':'list','count':len(lanes),'first_type':type(lanes[0]).__name__ if lanes else None}
              else:
                  lane_shape={'type':type(lanes).__name__}
              out['strategies'][result.get('strategy_id') or p.stem]={
                  'result_keys':sorted(result.keys()),
                  'lane_shape':lane_shape,
                  'error_evidence':walk(result),
              }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          REMOTE
          python -m json.tool /tmp/zel-sp-error-samples/error_samples.json >/dev/null
          cat /tmp/zel-sp-error-samples/error_samples.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-premium-error-samples-${{ github.run_id }}
          path: /tmp/zel-sp-error-samples/error_samples.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
