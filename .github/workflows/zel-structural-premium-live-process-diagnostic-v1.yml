name: ZEL Structural Premium Live Process Diagnostic V1

on:
  push:
    branches: [master]
    paths:
      - backend/research/zel_structural_premium_live_process_diagnostic_trigger_v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only process snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===TIME==='; date -Is
          echo '===REPLAY_PROCESSES==='; ps -eo pid,ppid,etime,pcpu,pmem,stat,cmd --sort=-pcpu | grep -E 'replay_v2.py|replay_v1.py|zel-structural-premium-v3' | grep -v grep || true
          echo '===PYTHON_TOP==='; ps -eo pid,ppid,etime,pcpu,pmem,stat,cmd --sort=-pcpu | grep python | head -20 || true
          echo '===LOCK==='; fuser -v /opt/zel/research-runtime/locks/one-heavy-vps-replay.lock 2>&1 || true
          echo '===PROGRESS==='; cat /opt/zel/research-runtime/checkpoints/structural-premium-v3/output/progress.json 2>/dev/null || true
          echo '===CHECKPOINTS==='; find /opt/zel/research-runtime/checkpoints/structural-premium-v3/output/checkpoints -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %f\n' 2>/dev/null | sort || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
