name: ZEL Structural Premium Replay Engine Inspect V1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-replay-engine-inspect-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect engine source interface only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          E=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine
          echo '===REPLAY_V2_HEAD==='
          sed -n '1,220p' "$E/replay_v2.py"
          echo '===LANE_V2_HEAD==='
          sed -n '1,280p' "$E/lane_checkpoint_v2.py"
          echo '===EVALUATE_HEAD==='
          sed -n '1,240p' /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/evaluate.py
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
