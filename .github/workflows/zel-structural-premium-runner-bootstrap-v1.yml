name: ZEL Structural Premium Runner Bootstrap V1

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: zel-structural-premium-runner-bootstrap-v1
  cancel-in-progress: true

jobs:
  runner-recovery-probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 591 && contains(github.event.comment.body, '/structural-premium-recover'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zel-structural-premium-runner-recovery-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate restored structural-premium contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_zel_structural_premium_route_v1.py
          python scripts/validate_zel_structural_premium_route_v1.py
      - name: Seal assigned runner and source-marker evidence
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          excluded = {
              'backend/research/zel_structural_premium_route_v1.json',
              'scripts/validate_zel_structural_premium_route_v1.py',
              '.github/workflows/zel-structural-premium-runner-recovery-v1.yml',
              '.github/workflows/zel-structural-premium-runner-bootstrap-v1.yml',
          }
          markers = ['POST129', 'BEST_ALLOW', 'allow', 'admission']
          strategies = [
              'vwap_revert',
              'support_resistance',
              'liquidity_sweep',
              'trend_rider',
              'market_structure',
          ]
          needles = markers + strategies
          matches = {needle: [] for needle in needles}
          for base in [Path('backend'), Path('scripts'), Path('data'), Path('runtime')]:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or str(path) in excluded or path.stat().st_size > 2_000_000:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  for needle in needles:
                      if needle in text:
                          matches[needle].append(str(path))

          missing_markers = [x for x in markers if not matches[x]]
          missing_strategies = [x for x in strategies if not matches[x]]
          runner = {
              'name': os.environ.get('RUNNER_NAME_VALUE', ''),
              'os': os.environ.get('RUNNER_OS_VALUE', ''),
              'arch': os.environ.get('RUNNER_ARCH_VALUE', ''),
          }
          if not all(runner.values()):
              raise SystemExit('runner assignment metadata missing')

          state = (
              'PASS_RUNNER_AND_THIRD_GENERATION_INHERITANCE_READY'
              if not missing_markers and not missing_strategies
              else 'HOLD_RUNNER_RECOVERED_INHERITANCE_INCOMPLETE'
          )
          row = {
              'schema_version': 'zel.structural_premium.runner_bootstrap_receipt.v1',
              'state': state,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA'],
              'runner': runner,
              'matches': matches,
              'missing_markers': missing_markers,
              'missing_strategies': missing_strategies,
              'main': ['vwap_revert|enter_long', 'support_resistance|enter_long'],
              'reserve': ['liquidity_sweep|enter_long', 'trend_rider|enter_long'],
              'filter_only': ['market_structure|enter_long'],
              'replay_started': False,
              'selection_authority': False,
              'promotion_authority': False,
              'execution_authority': 'NONE',
              'order_authority': 'BLOCKED',
              'protected_mutations': 0,
              'action': 'hold',
          }
          material = json.dumps(row, sort_keys=True, separators=(',', ':')).encode()
          row['receipt_sha256'] = hashlib.sha256(material).hexdigest()
          Path('out/runner_bootstrap_receipt.json').write_text(
              json.dumps(row, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(row, sort_keys=True))
          if missing_markers or missing_strategies:
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-premium-runner-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/runner_bootstrap_receipt.json
          if-no-files-found: error
          retention-days: 30
