name: ZEL Structural Premium Targeted Fix Replay V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-structural-premium-targeted-fix-replay-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build validated research overlay and launch durable replay
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          OLD=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          CANON=/opt/zel/forward-expansion-v1/source
          NEW=/opt/zel/research-runtime/jobs/structural-premium-targeted-fix-v2
          PY=/home/z/z/.venv/bin/python
          EXPECTED_TREND_SHA=0fcb0e42b843cd4cdc388a680b809388acf210482547a1d4790af5f688cff290
          EXPECTED_SR_SHA=81961254c685e735d90df418fb9e75d527199017370237efda8614ef74d680f1

          for p in \
            "$OLD/work/data/manifest.json" \
            "$OLD/work/engine/replay_v1.py" \
            "$OLD/work/engine/replay_v2.py" \
            "$OLD/work/engine/lane_checkpoint_v2.py" \
            "$OLD/work/evaluate.py" \
            "$CANON/backend/strategies/sr_levels.py" \
            "$CANON/backend/strategies/trend_rider.py" \
            "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json" \
            "$CANON/backend/config/q4r3_exact25_shadow_binding_v1.json"; do
            test -s "$p"
          done

          # No second structural replay is allowed to coexist.
          if pgrep -af 'lane_checkpoint_v2.py|replay_v2.py' | grep -vE 'grep|targeted-fix-replay' >/tmp/zel_targeted_existing.$$; then
            echo 'DUPLICATE_REPLAY_PROCESS_FOUND'
            cat /tmp/zel_targeted_existing.$$
            rm -f /tmp/zel_targeted_existing.$$
            exit 31
          fi
          rm -f /tmp/zel_targeted_existing.$$

          TREND_SHA_BEFORE=$(sha256sum "$CANON/backend/strategies/trend_rider.py" | awk '{print $1}')
          SR_SHA_BEFORE=$(sha256sum "$CANON/backend/strategies/sr_levels.py" | awk '{print $1}')
          MANIFEST_SHA_BEFORE=$(sha256sum "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json" | awk '{print $1}')
          BINDING_SHA_BEFORE=$(sha256sum "$CANON/backend/config/q4r3_exact25_shadow_binding_v1.json" | awk '{print $1}')
          test "$TREND_SHA_BEFORE" = "$EXPECTED_TREND_SHA"
          test "$SR_SHA_BEFORE" = "$EXPECTED_SR_SHA"

          if [ -e "$NEW" ]; then
            mv "$NEW" "${NEW}.previous.$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          mkdir -p "$NEW/work" "$NEW/result" "$NEW/logs"
          cp -a "$CANON" "$NEW/work/source"
          CAND="$NEW/work/source"
          OUT="$NEW/work/replay"
          mkdir -p "$OUT"

          # Patch only the isolated research copy AND regenerate its owner integrity metadata.
          "$PY" - "$CAND" "$NEW/result/candidate_overlay_receipt.json" "$TREND_SHA_BEFORE" "$SR_SHA_BEFORE" <<'PY'
          from pathlib import Path
          import hashlib, json, sys

          root=Path(sys.argv[1]); receipt=Path(sys.argv[2]); trend_before=sys.argv[3]; sr_before=sys.argv[4]
          sr=root/'backend/strategies/sr_levels.py'
          tr=root/'backend/strategies/trend_rider.py'
          manifest_path=root/'backend/config/q4r3_canonical_strategy_owner_manifest_v1.json'
          binding_path=root/'backend/config/q4r3_exact25_shadow_binding_v1.json'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()

          sr_text=sr.read_text()
          sr_old='recent = df.iloc[-cfg.lookback:]'
          sr_new='recent = df.iloc[-(cfg.lookback + 1):-1]'
          if sr_text.count(sr_old) != 1:
              raise SystemExit(f'SR_PATCH_ANCHOR_COUNT:{sr_text.count(sr_old)}')
          sr.write_text(sr_text.replace(sr_old, sr_new))

          tr_text=tr.read_text()
          tr_old='''    for i in range(len(df)):\n        if i == 0:\n            direction.iloc[i] = 1.0\n            st.iloc[i] = lowerband.iloc[i]\n            continue\n'''
          tr_new='''    for i in range(len(df)):\n        # ATR warm-up rows are undefined. Do not let their NaNs poison the\n        # recursive Supertrend bands/state. Initialize on the first valid ATR.\n        if pd.isna(atr.iloc[i]):\n            continue\n        if (\n            i == 0\n            or pd.isna(final_upperband.iloc[i - 1])\n            or pd.isna(final_lowerband.iloc[i - 1])\n            or pd.isna(st.iloc[i - 1])\n        ):\n            final_upperband.iloc[i] = upperband.iloc[i]\n            final_lowerband.iloc[i] = lowerband.iloc[i]\n            direction.iloc[i] = 1.0\n            st.iloc[i] = lowerband.iloc[i]\n            continue\n'''
          if tr_text.count(tr_old) != 1:
              raise SystemExit(f'TREND_PATCH_ANCHOR_COUNT:{tr_text.count(tr_old)}')
          tr.write_text(tr_text.replace(tr_old, tr_new))

          cand_sr=sha(sr); cand_tr=sha(tr)
          manifest=json.loads(manifest_path.read_text())
          entries=manifest.get('strategies')
          if not isinstance(entries,list) or len(entries)!=25:
              raise SystemExit('MANIFEST_NOT_EXACT25')
          by_id={str(x.get('strategy_id')):x for x in entries if isinstance(x,dict)}
          if len(by_id)!=25 or set(('sr_levels','trend_rider'))-set(by_id):
              raise SystemExit('MANIFEST_IDENTITY_INVALID')
          if str(by_id['sr_levels'].get('owner_sha256')) != sr_before:
              raise SystemExit('CANONICAL_SR_MANIFEST_SHA_DRIFT')
          if str(by_id['trend_rider'].get('owner_sha256')) != trend_before:
              raise SystemExit('CANONICAL_TREND_MANIFEST_SHA_DRIFT')
          by_id['sr_levels']['owner_sha256']=cand_sr
          by_id['trend_rider']['owner_sha256']=cand_tr
          manifest['research_overlay']={
              'enabled':True,
              'scope':['sr_levels','trend_rider'],
              'authority':'RESEARCH_ONLY_NO_PROMOTION_NO_EXECUTION'
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=False)+'\n')
          candidate_manifest_sha=sha(manifest_path)

          binding=json.loads(binding_path.read_text())
          if binding.get('schema')!='q4r3_exact25_shadow_binding_v1':
              raise SystemExit('BINDING_SCHEMA_MISMATCH')
          for key in ('paper_enabled','live_enabled','order_enabled','write_enabled','canary_enabled'):
              if binding.get(key) is not False:
                  raise SystemExit(f'UNSAFE_BINDING_FLAG:{key}')
          binding['manifest_sha256']=candidate_manifest_sha
          binding['research_overlay']=True
          binding_path.write_text(json.dumps(binding,indent=2,sort_keys=False)+'\n')

          payload={
              'state':'PASS_RESEARCH_OVERLAY_METADATA_REBOUND',
              'canonical_sr_sha256':sr_before,
              'candidate_sr_sha256':cand_sr,
              'canonical_trend_sha256':trend_before,
              'candidate_trend_sha256':cand_tr,
              'candidate_manifest_sha256':candidate_manifest_sha,
              'candidate_binding_sha256':sha(binding_path),
              'canonical_mutations':0,
              'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'
          }
          receipt.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY

          # Exact registry-loader preflight: catches OWNER_SHA/BINDING/import mismatches before any replay.
          "$PY" - "$CAND" "$OLD/work/engine/replay_v1.py" "$NEW/result/registry_preflight.json" <<'PY'
          from pathlib import Path
          import hashlib, importlib.util, json, sys
          src=Path(sys.argv[1]); engine_path=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(src))
          try:
              spec=importlib.util.spec_from_file_location('z_targeted_producer',src/'tools/q4r3_exact25_dedicated_shadow_producer.py')
              producer=importlib.util.module_from_spec(spec); sys.modules[spec.name]=producer; spec.loader.exec_module(producer)
              binding, registry=producer.load_registry(src)
              if len(registry)!=25: raise SystemExit(f'REGISTRY_NOT_25:{len(registry)}')
              espec=importlib.util.spec_from_file_location('z_targeted_engine',engine_path)
              engine=importlib.util.module_from_spec(espec); sys.modules[espec.name]=engine; espec.loader.exec_module(engine)
              restored=engine._restore_structural_premium_registry(src,registry)
              expected={'vwap_revert','support_resistance','liquidity_sweep','trend_rider'}
              if set(restored)!=expected: raise SystemExit(f'RESTORED_REGISTRY_MISMATCH:{sorted(restored)}')
              mp=src/'backend/config/q4r3_canonical_strategy_owner_manifest_v1.json'
              bp=src/'backend/config/q4r3_exact25_shadow_binding_v1.json'
              msha=hashlib.sha256(mp.read_bytes()).hexdigest()
              b=json.loads(bp.read_text())
              if b.get('manifest_sha256')!=msha: raise SystemExit('BINDING_MANIFEST_SHA_MISMATCH')
              payload={'state':'PASS_EXACT_REGISTRY_PREFLIGHT','registry_count':25,'restored_entry_owner_count':4,'restored_entry_owners':sorted(restored),'manifest_binding_match':True,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
              out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print(json.dumps(payload,sort_keys=True))
          finally:
              if sys.path and sys.path[0]==str(src): sys.path.pop(0)
          PY

          # Fast all-data strategy proof before expensive lane replay.
          "$PY" - "$CAND" "$OLD/work/data" "$NEW/result/candidate_census.json" <<'PY'
          from pathlib import Path
          from collections import Counter
          import importlib.util,json,sys
          import numpy as np
          import pandas as pd
          src=Path(sys.argv[1]); data=Path(sys.argv[2]); outp=Path(sys.argv[3])
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m
          sr=load(src/'backend/strategies/sr_levels.py','z_sr_targeted_v2')
          tr=load(src/'backend/strategies/trend_rider.py','z_tr_targeted_v2')
          sc=sr.SrLevelsConfig(); tc=tr.TrendRiderConfig()
          manifest=json.loads((data/'manifest.json').read_text())
          files=[x for x in manifest.get('files',[]) if isinstance(x,dict) and x.get('kind')=='market' and x.get('interval')=='1m']
          if len(files)!=15: raise SystemExit(f'MARKET_FILE_COUNT:{len(files)}')
          sr_count=Counter(); tr_count=Counter(); sr_enter=0; tr_enter=0; errors=[]
          for meta in sorted(files,key=lambda x:(str(x['window_id']),str(x['symbol']))):
              df=pd.read_csv(data/str(meta['path'])); df=df.rename(columns={c:c.lower() for c in df.columns}).reset_index(drop=True)
              for c in ('open','high','low','close','volume'): df[c]=pd.to_numeric(df[c],errors='coerce')
              close,high,low,op,vol=(df['close'],df['high'],df['low'],df['open'],df['volume'])
              prev_close=close.shift(1)
              atr=pd.concat([high-low,(high-prev_close).abs(),(low-prev_close).abs()],axis=1).max(axis=1).rolling(sc.atr_len,min_periods=sc.atr_len).mean()
              ema=close.ewm(span=sc.ema_len,adjust=False,min_periods=sc.ema_len).mean()
              sh=high.shift(1).rolling(sc.lookback,min_periods=sc.lookback).max(); sl=low.shift(1).rolling(sc.lookback,min_periods=sc.lookback).min()
              buf=atr*sc.breakout_buffer_atr; rbuf=atr*sc.retest_reclaim_atr
              br_l=close>sh+buf; br_s=close<sl-buf
              rc_l=(prev_close<=sh)&(close>sh+rbuf); rc_s=(prev_close>=sl)&(close<sl-rbuf)
              trend_l=(close>ema)&(ema>ema.shift(1)); trend_s=(close<ema)&(ema<ema.shift(1))
              atr_pct=atr/close.replace(0,np.nan)*100.0; vol_ok=(atr_pct>=sc.min_atr_pct)&(atr_pct<=sc.max_atr_pct)
              chase=((close-ema).abs()/atr.replace(0,np.nan))>sc.max_chase_dist_atr
              base_l=(br_l|rc_l)&trend_l&vol_ok&(~chase); base_s=(br_s|rc_s)&trend_s&vol_ok&(~chase)
              sr_count['break_long']+=int(br_l.fillna(False).sum()); sr_count['break_short']+=int(br_s.fillna(False).sum())
              sr_count['base_long']+=int(base_l.fillna(False).sum()); sr_count['base_short']+=int(base_s.fillna(False).sum())
              for i in np.flatnonzero((base_l|base_s).fillna(False).to_numpy()):
                  if i<419: continue
                  try:
                      r=sr.strategy(df.iloc[max(0,i-419):i+1].copy(),state={},risk_action='hold')
                      if str(r.get('action'))=='enter': sr_enter+=1
                  except Exception as e: errors.append(f'sr:{meta["window_id"]}:{meta["symbol"]}:{type(e).__name__}:{e}')
              st=tr._supertrend(df,tc.st_len,tc.st_mult); tema=close.ewm(span=tc.ema_len,adjust=False,min_periods=tc.ema_len).mean()
              tat=st['atr']; sv=st['supertrend']; direction=st['direction']; rise=sv>sv.shift(1); fall=sv<sv.shift(1)
              tl=(direction==1)&(close>sv)&(close>tema)&(tema>tema.shift(1))&rise; ts=(direction==-1)&(close<sv)&(close<tema)&(tema<tema.shift(1))&fall
              gap=(close-sv).abs()/tat.replace(0,np.nan); lc=(close.shift(1)>=op.shift(1))&tl&(gap>=tc.st_gap_atr_min); shc=(close.shift(1)<=op.shift(1))&ts&(gap>=tc.st_gap_atr_min)
              tpct=tat/close.replace(0,np.nan)*100.0; tvo=(tpct>=tc.min_atr_pct)&(tpct<=tc.max_atr_pct); tch=((close-tema).abs()/tat.replace(0,np.nan))>tc.max_chase_dist_atr
              el=lc&tvo&(~tch); es=shc&tvo&(~tch)
              tr_count['dir_long']+=int((direction==1).fillna(False).sum()); tr_count['dir_short']+=int((direction==-1).fillna(False).sum())
              tr_count['st_rising']+=int(rise.fillna(False).sum()); tr_count['st_falling']+=int(fall.fillna(False).sum())
              tr_count['trend_long']+=int(tl.fillna(False).sum()); tr_count['trend_short']+=int(ts.fillna(False).sum())
              tr_count['eligible_long']+=int(el.fillna(False).sum()); tr_count['eligible_short']+=int(es.fillna(False).sum())
              for i in np.flatnonzero((el|es).fillna(False).to_numpy())[:60]:
                  if i<419: continue
                  try:
                      r=tr.strategy(df.iloc[max(0,i-419):i+1].copy(),state={},risk_action='hold')
                      if str(r.get('action'))=='enter': tr_enter+=1
                  except Exception as e: errors.append(f'trend:{meta["window_id"]}:{meta["symbol"]}:{type(e).__name__}:{e}')
          ok=(sr_enter>0 and tr_count['st_rising']>0 and tr_count['st_falling']>0 and tr_count['eligible_long']+tr_count['eligible_short']>0 and tr_enter>0 and not errors)
          payload={'state':'PASS_TARGETED_CANDIDATE_CENSUS' if ok else 'HOLD_TARGETED_CANDIDATE_CENSUS','files':len(files),'rows_total':sum(int(x.get('rows') or 0) for x in files),'sr_counts':dict(sr_count),'sr_direct_enter':sr_enter,'trend_counts':dict(tr_count),'trend_direct_enter':tr_enter,'error_count':len(errors),'errors':errors[:20],'canonical_mutations':0,'execution_authority':'NONE','order_authority':'BLOCKED','action':'hold'}
          outp.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print(json.dumps(payload,sort_keys=True))
          if not ok: raise SystemExit(41)
          PY

          # Canonical source must still be byte-identical before replay launch.
          test "$(sha256sum "$CANON/backend/strategies/trend_rider.py" | awk '{print $1}')" = "$TREND_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/strategies/sr_levels.py" | awk '{print $1}')" = "$SR_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json" | awk '{print $1}')" = "$MANIFEST_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/config/q4r3_exact25_shadow_binding_v1.json" | awk '{print $1}')" = "$BINDING_SHA_BEFORE"

          # Reuse exactly 30 lanes from unchanged strategies; never reuse changed sr/trend lanes.
          "$PY" - "$OLD/work/data/manifest.json" "$OUT" "$NEW/result/seed_receipt.json" "$NEW" <<'PY'
          from pathlib import Path
          import gzip,json,shutil,sys
          manifest=Path(sys.argv[1]); out=Path(sys.argv[2]); receipt=Path(sys.argv[3]); new=Path(sys.argv[4])
          m=json.loads(manifest.read_text()); market={(str(x['window_id']),str(x['symbol']),str(x['interval'])):str(x['sha256']) for x in m.get('files',[]) if isinstance(x,dict) and x.get('kind')=='market'}
          wanted={'liquidity_sweep','vwap_revert'}; candidates=[]
          for root in Path('/opt/zel/research-runtime').rglob('lane_checkpoints'):
              try:
                  if new in root.parents or root==new: continue
              except Exception: pass
              valid=[]; keys=set()
              for strategy in wanted:
                  d=root/strategy
                  if not d.is_dir(): continue
                  for f in d.glob('*.json.gz'):
                      try:
                          with gzip.open(f,'rt',encoding='utf-8') as h: p=json.load(h)
                      except Exception: continue
                      key=(str(p.get('window_id')),str(p.get('symbol')),str(p.get('interval')))
                      if p.get('strategy_id')!=strategy or key not in market or p.get('source_sha256')!=market[key]: continue
                      r=p.get('result'); u=(strategy,)+key
                      if not isinstance(r,dict) or r.get('strategy_id')!=strategy or u in keys: continue
                      keys.add(u); valid.append((f,strategy,u))
              candidates.append((len(valid),str(root),valid))
          candidates.sort(key=lambda x:(x[0],x[1]),reverse=True); best=candidates[0] if candidates else (0,'',[])
          if best[0]!=30:
              payload={'state':'HOLD_SEED_NOT_30','compatible_unchanged_lane_count':best[0],'best_root':best[1],'candidate_root_count':len(candidates),'action':'hold'}
              receipt.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print(json.dumps(payload,sort_keys=True)); raise SystemExit(42)
          lane_root=out/'lane_checkpoints'; lane_root.mkdir(parents=True,exist_ok=True)
          for f,strategy,_ in best[2]:
              dest=lane_root/strategy/f.name; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(f,dest)
          payload={'state':'PASS_SEED_30_UNCHANGED_LANES','reused_lane_count':30,'expected_pending_lane_count':30,'source_lane_root':best[1],'reused_strategies':sorted(wanted),'recomputed_strategies':['support_resistance','trend_rider'],'action':'hold'}
          receipt.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print(json.dumps(payload,sort_keys=True))
          PY

          cat > "$NEW/work/runner.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          OLD=/opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2
          NEW=/opt/zel/research-runtime/jobs/structural-premium-targeted-fix-v2
          CAND="$NEW/work/source"; OUT="$NEW/work/replay"; PY=/home/z/z/.venv/bin/python
          LOCK=/opt/zel/research-runtime/structural-premium-targeted-fix-v2.lock; STATUS="$NEW/status.json"
          mkdir -p "$NEW/logs" "$NEW/result"; exec 9>"$LOCK"
          if ! flock -n 9; then printf '{"state":"HOLD_DUPLICATE_LOCK","action":"hold"}\n' > "$STATUS.tmp"; mv "$STATUS.tmp" "$STATUS"; exit 51; fi
          status(){ local s="$1"; printf '{"state":"%s","pid":%s,"updated_at":"%s","execution_authority":"NONE","order_authority":"BLOCKED","action":"hold"}\n' "$s" "$$" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$STATUS.tmp"; mv "$STATUS.tmp" "$STATUS"; }
          status RUNNING_LANES
          if ! "$PY" "$OLD/work/engine/lane_checkpoint_v2.py" --engine-v1 "$OLD/work/engine/replay_v1.py" --engine-v2 "$OLD/work/engine/replay_v2.py" --source-root "$CAND" --data-root "$OLD/work/data" --interval 1m --output-dir "$OUT" --workers 4 2>&1 | tee "$NEW/logs/lanes.log"; then status HOLD_LANES; exit 52; fi
          status AGGREGATING
          if ! "$PY" "$OLD/work/engine/replay_v2.py" --engine-v1 "$OLD/work/engine/replay_v1.py" --source-root "$CAND" --data-root "$OLD/work/data" --interval 1m --output-dir "$OUT" --workers 4 2>&1 | tee "$NEW/logs/aggregate.log"; then status HOLD_AGGREGATE; exit 53; fi
          status EVALUATING
          if ! "$PY" "$OLD/work/evaluate.py" evaluate --report "$OUT/report.json" --ledger "$OUT/trades.jsonl.gz" --dataset-manifest "$OLD/work/data/manifest.json" --output "$NEW/result/coverage_revalidation.json" 2>&1 | tee "$NEW/logs/evaluate.log"; then status HOLD_EVALUATE; exit 54; fi
          status DONE_TARGETED_REPLAY_EVALUATED
          RUNNER
          chmod 700 "$NEW/work/runner.sh"

          printf '{"state":"VALIDATED_CANDIDATE","reused_lane_count":30,"expected_pending_lane_count":30,"execution_authority":"NONE","order_authority":"BLOCKED","action":"hold"}\n' > "$NEW/status.json"
          nohup "$NEW/work/runner.sh" > "$NEW/logs/runner.log" 2>&1 < /dev/null &
          PID=$!; echo "$PID" > "$NEW/runner.pid"; sleep 18

          echo '===TARGETED_FIX_V2_STATUS==='; cat "$NEW/status.json"
          echo '===LANE_START==='; grep -m1 'LANE_RESUME_START' "$NEW/logs/runner.log" || true
          echo '===RUNNER_PID==='; echo "$PID"; ps -p "$PID" -o pid=,stat=,etime=,cmd= || true
          echo '===CANONICAL_IMMUTABILITY==='; echo "sr=$SR_SHA_BEFORE trend=$TREND_SHA_BEFORE manifest=$MANIFEST_SHA_BEFORE binding=$BINDING_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/strategies/trend_rider.py" | awk '{print $1}')" = "$TREND_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/strategies/sr_levels.py" | awk '{print $1}')" = "$SR_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json" | awk '{print $1}')" = "$MANIFEST_SHA_BEFORE"
          test "$(sha256sum "$CANON/backend/config/q4r3_exact25_shadow_binding_v1.json" | awk '{print $1}')" = "$BINDING_SHA_BEFORE"

          STATE=$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state",""))' "$NEW/status.json")
          case "$STATE" in
            RUNNING_LANES|AGGREGATING|EVALUATING|DONE_TARGETED_REPLAY_EVALUATED) : ;;
            *) echo "BAD_RUNNER_STATE:$STATE"; tail -160 "$NEW/logs/runner.log"; exit 55 ;;
          esac
          if [ "$STATE" = RUNNING_LANES ]; then
            grep -q '"completed_units": 30' "$NEW/logs/runner.log"
            grep -q '"pending_units": 30' "$NEW/logs/runner.log"
            kill -0 "$PID"
          fi
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
