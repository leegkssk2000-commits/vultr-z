name: ZEL Structural Premium V2 Audit

on:
  push:
    branches: [master]
    paths:
      - backend/tools/zel_structural_premium_v2_contract.py
      - ops/zel-structural-premium-v2-audit.sh
      - .github/workflows/zel-structural-premium-v2-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-structural-premium-v2-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage V2 audit inputs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            backend/tools/zel_structural_premium_v2_contract.py \
            "$VPS_USER@$VPS_HOST:/tmp/zel_structural_premium_v2_contract.py"
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            backend/tools/zel_structural_premium_auto_improvement_v1.py \
            "$VPS_USER@$VPS_HOST:/tmp/zel_structural_premium_auto_improvement_v1.py"
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            backend/tools/zel_structural_premium_overlay_patch_v1.py \
            "$VPS_USER@$VPS_HOST:/tmp/zel_structural_premium_overlay_patch_v1.py"
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            ops/zel-structural-premium-v2-audit.sh \
            "$VPS_USER@$VPS_HOST:/tmp/zel-structural-premium-v2-audit.sh"
      - name: Run read-only V2 audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'bash /tmp/zel-structural-premium-v2-audit.sh'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
