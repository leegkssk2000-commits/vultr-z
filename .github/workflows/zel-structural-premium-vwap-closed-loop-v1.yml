name: ZEL Structural Premium VWAP Closed Loop V1

on:
  push:
    branches: [master]
    paths:
      - ops/zel-structural-premium-vwap-closed-loop-v1.sh
      - ops/zel-structural-premium-vwap-closed-loop-v1_1.sh
      - .github/workflows/zel-structural-premium-vwap-closed-loop-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-structural-premium-vwap-closed-loop-v1
  cancel-in-progress: false

jobs:
  gen0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run VWAP targeted closed loop Gen0
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            ops/zel-structural-premium-vwap-closed-loop-v1.sh \
            ops/zel-structural-premium-vwap-closed-loop-v1_1.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd /tmp && bash zel-structural-premium-vwap-closed-loop-v1_1.sh'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
