name: ZEL Trade Methods Risk Adapter V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py
      - .github/workflows/zel-trade-methods-risk-adapter-v1.yml
  push:
    branches: [master]
    paths:
      - backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py
      - .github/workflows/zel-trade-methods-risk-adapter-v1.yml
  workflow_run:
    workflows:
      - ZEL Trade Methods Risk Kwarg V3
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-trade-methods-risk-adapter-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated adapter
        run: |
          set -euo pipefail
          python -m py_compile backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py
          python backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py --self-test

  verify:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload isolated adapter only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Verify against active trade-method resolver
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/home/z/z/.venv/bin/python /tmp/zel_trade_method_risk_mode_adapter_v1.py \
               --root /home/z/z \
               --out /tmp/zel_trade_method_risk_adapter_validation_latest.json"

      - name: Fetch verification
        run: |
          set -euo pipefail
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_trade_method_risk_adapter_validation_latest.json" \
            out/latest.json

      - name: Assert adapter boundary and behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state']=='PASS_ISOLATED_RISK_ADAPTER_BEHAVIOR',d
          assert d['case_count']==7,d
          assert d['canonical_strategy_files_mutated'] is False,d
          assert d['canonical_trade_methods_mutated'] is False,d
          assert d['canonical_registry_mutated'] is False,d
          assert d['adapter_scope']=='RESEARCH_ISOLATED_ONLY',d
          assert d['bundle_replay_binding_allowed'] is True,d
          assert d['runtime_binding_allowed'] is False,d
          assert d['shadow_start_allowed'] is False,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          cases={row['case']:row['result'] for row in d['cases']}
          assert cases['normal']['risk_mode']=='normal',d
          assert cases['warning_20']['action']=='reduce25' and cases['warning_20']['size_multiplier']==0.75,d
          for name in ('block_30','block_rolling20','block_rolling50','high_risk_short_beam'):
              assert cases[name]['action']=='block' and cases[name]['size_multiplier']==0.0,d
          assert cases['cost_then_warning_order']['size_multiplier'] <= 0.375,d
          PY

      - name: Checkout result authority
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish adapter verification SSOT
        run: |
          set -euo pipefail
          cd results
          git config user.name 'zel-risk-adapter-bot'
          git config user.email 'zel-risk-adapter-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          cd ..
          root=results/runtime_results/zel/trade_methods_risk_adapter_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git add runtime_results/zel/trade_methods_risk_adapter_v1
          git commit -m "result(zel): isolated risk adapter verification ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('out/latest.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as h:
              h.write('# ZEL Trade Methods Risk Adapter V1\n\n')
              if not p.exists():
                  h.write('- State: **HOLD_NO_RESULT**\n')
              else:
                  d=json.loads(p.read_text())
                  h.write(f"- State: **{d['state']}**\n")
                  h.write(f"- Cases: {d['case_count']}\n")
                  h.write(f"- Scope: **{d['adapter_scope']}**\n")
                  h.write(f"- Bundle replay binding: **{d['bundle_replay_binding_allowed']}**\n")
                  h.write(f"- Runtime binding: **{d['runtime_binding_allowed']}**\n")
                  h.write('- Canonical mutation: **0**\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-trade-methods-risk-adapter-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
