name: ZEL Trade Methods Risk Sequence Replay V1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - backend/tools/zel_trade_method_risk_sequence_replay_v1.py
      - .github/workflows/zel-trade-methods-risk-sequence-replay-v1.yml
  push:
    branches: [master]
    paths:
      - backend/tools/zel_trade_method_risk_sequence_replay_v1.py
      - .github/workflows/zel-trade-methods-risk-sequence-replay-v1.yml
  workflow_run:
    workflows:
      - ZEL Trade Methods Risk Adapter V1
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: zel-trade-methods-risk-sequence-replay-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sequence fixture
        run: |
          set -euo pipefail
          python -m py_compile backend/tools/zel_trade_method_risk_sequence_replay_v1.py
          python backend/tools/zel_trade_method_risk_sequence_replay_v1.py --self-test

  replay:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload sequence fixture and isolated adapter
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key \
            backend/tools/zel_trade_method_risk_sequence_replay_v1.py \
            backend/research/adapters/zel_trade_method_risk_mode_adapter_v1.py \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Run no-lookahead sequence replay
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/home/z/z/.venv/bin/python /tmp/zel_trade_method_risk_sequence_replay_v1.py \
               --root /home/z/z \
               --adapter /tmp/zel_trade_method_risk_mode_adapter_v1.py \
               --out /tmp/zel_trade_method_risk_sequence_replay_latest.json"

      - name: Fetch sequence result
        run: |
          set -euo pipefail
          mkdir -p out
          scp -i ~/.ssh/vps_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/zel_trade_method_risk_sequence_replay_latest.json" \
            out/latest.json

      - name: Assert temporal and safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/latest.json').read_text())
          assert d['state']=='PASS_NO_LOOKAHEAD_RISK_SEQUENCE_REPLAY',d
          assert d['trade_count_attempted']==31,d
          assert d['trade_count_executed']==30,d
          assert d['first_warning_trade_index']==21,d
          assert d['first_block_trade_index']==31,d
          assert d['no_lookahead_proved'] is True,d
          assert d['cost_then_risk_order_proved'] is True,d
          assert d['economic_improvement_claim_allowed'] is False,d
          assert d['data_b_binding_allowed'] is True,d
          assert d['runtime_binding_allowed'] is False,d
          assert d['shadow_start_allowed'] is False,d
          assert d['promotion_authority'] is False,d
          assert d['execution_authority']=='NONE' and d['order_authority']=='BLOCKED',d
          assert d['canonical_strategy_files_mutated'] is False,d
          assert d['canonical_trade_methods_mutated'] is False,d
          assert d['canonical_registry_mutated'] is False,d
          PY

      - name: Checkout result authority
        uses: actions/checkout@v4
        with:
          ref: zel-data-expansion-results-v1
          path: results
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish sequence replay SSOT
        run: |
          set -euo pipefail
          cd results
          git config user.name 'zel-risk-sequence-bot'
          git config user.email 'zel-risk-sequence-bot@users.noreply.github.com'
          git pull --rebase origin zel-data-expansion-results-v1
          cd ..
          root=results/runtime_results/zel/trade_methods_risk_sequence_replay_v1
          mkdir -p "$root"
          cp out/latest.json "$root/latest.json"
          cp out/latest.json "$root/run_${GITHUB_RUN_ID}.json"
          cd results
          git add runtime_results/zel/trade_methods_risk_sequence_replay_v1
          git commit -m "result(zel): risk sequence replay ${GITHUB_RUN_ID}" || true
          git push origin HEAD:zel-data-expansion-results-v1

      - name: Write summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('out/latest.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as h:
              h.write('# ZEL Risk Sequence Replay V1\n\n')
              if not p.exists():
                  h.write('- State: **HOLD_NO_RESULT**\n')
              else:
                  d=json.loads(p.read_text())
                  h.write(f"- State: **{d['state']}**\n")
                  h.write(f"- First warning: trade {d['first_warning_trade_index']}\n")
                  h.write(f"- First block: trade {d['first_block_trade_index']}\n")
                  h.write(f"- No lookahead: **{d['no_lookahead_proved']}**\n")
                  h.write(f"- Next: **{d['next']}**\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-trade-methods-risk-sequence-replay-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
