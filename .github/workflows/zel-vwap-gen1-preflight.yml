name: ZEL VWAP Gen1 Preflight
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-vwap-gen1-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live Gen1 progress
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          G=/opt/zel/research-runtime/jobs/structural-premium-vwap-closed-loop-v1/gen1
          echo '===ACTIVE_WORKERS==='
          ps -eo pid,pcpu,pmem,etime,cmd | grep "$G/runs/.*/engine/lane_" | grep -v grep || true
          for cid in B60 B75 C120; do
            echo "===${cid}==="
            for phase in w1 w2 w3; do
              d="$G/runs/$cid/replay_${phase}/lane_checkpoints/vwap_revert"
              printf '%s_COUNT=' "$phase"
              find "$d" -type f -name '*.json.gz' 2>/dev/null | wc -l || true
              echo "${phase}_CHECKPOINTS="
              find "$d" -type f -name '*.json.gz' -printf '%TY-%Tm-%Td %TH:%TM:%TS %f\n' 2>/dev/null | sort || true
              s="$G/runs/$cid/result/${phase}_score.json"
              if [ -s "$s" ]; then echo "${phase}_SCORE="; cat "$s"; fi
              l="$G/runs/$cid/logs/${phase}.log"
              if [ -s "$l" ]; then echo "${phase}_LOG_TAIL="; tail -25 "$l"; fi
            done
            echo "CONTRACT="; cat "$G/runs/$cid/contract.sha256" 2>/dev/null || true
          done
          echo '===W1_SELECTION==='; cat "$G/result/w1_selection.json" 2>/dev/null || true
          echo '===W12_SELECTION==='; cat "$G/result/w12_selection.json" 2>/dev/null || true
          echo '===TERMINAL==='; cat "$G/result/terminal_receipt.json" 2>/dev/null || true
          echo '===FILES==='; find "$G/result" -maxdepth 1 -type f -printf '%f %s\n' 2>/dev/null | sort || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
