name: ZEL VWAP Gen1 Preflight
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/zel-vwap-gen1-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          paths=(
            /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine/replay_v1.py
            /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine/replay_v2.py
            /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/engine/lane_checkpoint_v2.py
            /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/replay/trades.jsonl.gz
            /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source/backend/strategies/vwap_reversion.py
            /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source/backend/config/q4r3_canonical_strategy_owner_manifest_v1.json
            /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source/backend/config/q4r3_exact25_shadow_binding_v1.json
            /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/data/manifest.json
          )
          for p in "${paths[@]}"; do if [ -s "$p" ]; then echo "OK $p"; else echo "MISSING $p"; fi; done
          echo '===VWAP_FILES===' 
          find /opt/zel/research-runtime/jobs/structural-premium-no-trend-v1/work/source/backend/strategies -maxdepth 1 -type f -iname '*vwap*' -printf '%p\n' 2>/dev/null || true
          echo '===DATA_ROOT===' 
          find /opt/zel/research-runtime/jobs/structural-premium-durable-lane-v2/work/data -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -80 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
