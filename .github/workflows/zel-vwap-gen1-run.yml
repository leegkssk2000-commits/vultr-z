name: ZEL VWAP Gen1 Run

on:
  push:
    branches: [master]
    paths:
      - ops/zel-structural-premium-vwap-closed-loop-gen1.sh
      - .github/workflows/zel-vwap-gen1-run.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-vwap-gen1-run
  cancel-in-progress: false

jobs:
  gen1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Local syntax preflight
        run: |
          set -euo pipefail
          bash -n ops/zel-structural-premium-vwap-closed-loop-gen1.sh
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Execute Gen1 research loop
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes \
            ops/zel-structural-premium-vwap-closed-loop-gen1.sh \
            "$VPS_USER@$VPS_HOST:/tmp/zel-structural-premium-vwap-closed-loop-gen1.sh"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'bash /tmp/zel-structural-premium-vwap-closed-loop-gen1.sh'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
