name: ZEL VWAP Gen2 AI Contract Retry

on:
  push:
    branches: [master]
    paths:
      - ops/zel-vwap-gen2-ai-contract-retry.sh
      - .github/workflows/zel-vwap-gen2-ai-contract-retry.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-vwap-gen2-ai-contract-retry
  cancel-in-progress: true

jobs:
  ai_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Local syntax preflight
        run: bash -n ops/zel-vwap-gen2-ai-contract-retry.sh
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Generate validated Gen2 AI contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes ops/zel-vwap-gen2-ai-contract-retry.sh "$VPS_USER@$VPS_HOST:/tmp/zel-vwap-gen2-ai-contract-retry.sh"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/zel-vwap-gen2-ai-contract-retry.sh'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
