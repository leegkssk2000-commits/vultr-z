name: ZEL VWAP Gen3 Neutral Entry Only V2

on:
  push:
    branches: [master]
    paths:
      - ops/zel-vwap-gen3-neutral-entry-only-v2.sh
      - .github/workflows/zel-vwap-gen3-neutral-entry-only-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-vwap-gen3-neutral-entry-only-v2
  cancel-in-progress: true

jobs:
  neutral_entry_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run corrected neutral-entry-only Gen3 V2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -o BatchMode=yes ops/zel-vwap-gen3-neutral-entry-only-v2.sh "$VPS_USER@$VPS_HOST:/tmp/zel-vwap-gen3-neutral-entry-only-v2.sh"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/zel-vwap-gen3-neutral-entry-only-v2.sh'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
