name: ZEL VWAP Revert 150D Durability V1

on:
  pull_request:
    branches: [master]
    paths:
      - backend/research/vwap_revert_150d_durability.py
      - backend/research/vwap_revert_150d_durability_v2.py
      - .github/workflows/zel-vwap-revert-150d-durability-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zel-vwap-revert-150d-durability-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Freeze replay contract and bugfix scope
        run: |
          set -euo pipefail
          python -m py_compile backend/research/vwap_revert_150d_durability.py backend/research/vwap_revert_150d_durability_v2.py backend/tools/zel_historical_oos_exact25_replay_v1.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('backend/research/vwap_revert_150d_durability.py')
          spec=importlib.util.spec_from_file_location('vwap150',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.DATASET_SHA=='53676bb379635c6f81908be2c20e1598e00bffa4d0e08d8b492646416b8a46d8'
          assert m.STRATEGY_ID=='vwap_revert'
          assert m.SYMBOLS==('BTC-USDT','ETH-USDT','LINK-USDT','SOL-USDT','XRP-USDT')
          assert sum((b-a)//60000 for _,a,b in m.WINDOWS)==m.EXPECTED_POST_ROWS
          text=p.read_text()
          for token in ('strategy_parameter_changes": 0','feature_gate_changes": 0','survivor_declared": False','execution_authority": "NONE"','order_authority": "BLOCKED"'):
              assert token in text
          q=Path('backend/research/vwap_revert_150d_durability_v2.py')
          qs=q.read_text()
          assert 'VWAP150_ZERO_SENTINEL_MANIFEST_ADAPTER_ONLY' in qs
          assert 'STRATEGY_PARAMETER_CHANGES = 0' in qs
          assert 'FEATURE_GATE_CHANGES = 0' in qs
          assert 'MARKET_DATA_CHANGES = 0' in qs
          assert 'WINDOW_CHANGES = 0' in qs
          print('PASS_VWAP150_CONTRACT_FROZEN_BUGFIX_ONLY')
          PY
          mkdir -p /tmp/vwap150 /tmp/vwap150_pydeps out ~/.ssh

      - name: Stage ephemeral Python 3.10 data dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile --target /tmp/vwap150_pydeps pandas numpy
          python - <<'PY'
          import sys
          sys.path.insert(0,'/tmp/vwap150_pydeps')
          import pandas,numpy
          print('PASS_EPHEMERAL_PYDEPS',pandas.__version__,numpy.__version__)
          PY
          tar -C /tmp/vwap150_pydeps -czf /tmp/vwap150_pydeps.tgz .

      - name: Download accepted 150d BingX 1m dataset
        uses: actions/download-artifact@v4
        with:
          name: zel-bingx-1m-gap-exclusion-seal-v1-30971232337
          path: /tmp/vwap150
          github-token: ${{ github.token }}
          run-id: 30971232337
          repository: ${{ github.repository }}

      - name: Verify immutable 150d dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/vwap150'); m=json.loads((root/'manifest.json').read_text())
          assert m['state']=='PASS_BINGX_1M_GAP_EXCLUDED_DATASET_STAGED'
          assert m['dataset_sha256']=='53676bb379635c6f81908be2c20e1598e00bffa4d0e08d8b492646416b8a46d8'
          assert m['actual_total_rows']==1072800
          rows=[x for x in m['results'] if x['segment_id']=='POST_GAP']
          assert len(rows)==5
          for x in rows:
              p=root/'data'/x['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['file_sha256']
              assert x['row_count']==192030 and x['missing_interval_count']==0 and x['duplicate_timestamp_count']==0
              assert x['start_ms']==1771027200000 and x['end_exclusive_ms']==1782549000000
          print('PASS_VWAP150_DATASET_SHA_CONTIGUOUS')
          PY

      - name: Prepare VPS read-only transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"; test -n "$VPS_HOST"; test -n "$VPS_USER"
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          remote_ver=$(ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" '/usr/bin/python3 -c "import sys; print(str(sys.version_info.major)+\".\"+str(sys.version_info.minor))"')
          test "$remote_ver" = '3.10'
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'test -f /home/z/z/tools/q4r3_exact25_dedicated_shadow_producer.py && test -d /opt/zel/historical-oos-v1'
          echo PASS_VWAP150_VPS_PYTHON_310_INPUTS_PRESENT

      - name: Run canonical vwap_revert over three expanded windows
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-vwap150-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$remote" > out/remote_path.txt
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote/data' '$remote/pydeps'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes backend/research/vwap_revert_150d_durability.py backend/research/vwap_revert_150d_durability_v2.py backend/tools/zel_historical_oos_exact25_replay_v1.py /tmp/vwap150/manifest.json /tmp/vwap150_pydeps.tgz "$VPS_USER@$VPS_HOST:$remote/"
          scp -i ~/.ssh/vps_key -o BatchMode=yes /tmp/vwap150/data/*_1771027200000_1782549000000.csv.gz "$VPS_USER@$VPS_HOST:$remote/data/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "tar -C '$remote/pydeps' -xzf '$remote/vwap150_pydeps.tgz'"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=450 "$VPS_USER@$VPS_HOST" \
            "PYTHONPATH='$remote/pydeps' nice -n 10 /usr/bin/python3 '$remote/vwap_revert_150d_durability_v2.py' \
              --engine '$remote/zel_historical_oos_exact25_replay_v1.py' \
              --source-root /home/z/z \
              --market-root '$remote' \
              --market-manifest '$remote/manifest.json' \
              --funding-root /opt/zel/historical-oos-v1 \
              --out '$remote/result.json'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST:$remote/result.json" out/vwap_revert_150d_durability.json

      - name: Verify and print economic result
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('out/vwap_revert_150d_durability.json'))
          material={k:v for k,v in r.items() if k!='receipt_sha256'}
          assert hashlib.sha256(json.dumps(material,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==r['receipt_sha256']
          assert r['source_binding']['strategy_parameter_changes']==0 and r['source_binding']['feature_gate_changes']==0
          assert r['source_binding']['source_unchanged'] is True and r['integrity']['integrity_ok'] is True
          assert r['survivor_declared'] is False and r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED'
          print('VWAP150_STATE',r['state'])
          print('VWAP150_FUNDING_COMPLETE',r['funding']['complete_for_scoring'])
          key='including_funding_estimate' if r['funding']['complete_for_scoring'] else 'fee_slippage_net'
          for w in ('W1','W2','W3'):
              x=r['windows'][w]; m=x[key]
              print('VWAP150',w,'trades=',m['trade_count'],'net_R=',m['net_R'],'exp_R=',m['expectancy_R'],'PF=',m['profit_factor'],'WR=',m['win_rate_pct'],'DD_R=',m['max_drawdown_R'],'vnext=',x['vnext_positive_edge_gate'])
          print('VWAP150_THREE_WINDOW_EDGE',r['vnext_three_window_positive_edge'])
          print('VWAP150_RECEIPT_SHA',r['receipt_sha256'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-vwap-revert-150d-durability-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/vwap_revert_150d_durability.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup VPS temp only
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote=$(cat out/remote_path.txt 2>/dev/null || true)
          test -z "$remote" || ssh -i ~/.ssh/vps_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'" 2>/dev/null || true
          rm -f ~/.ssh/vps_key
