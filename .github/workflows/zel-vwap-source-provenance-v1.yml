name: ZEL VWAP Source Provenance V1

on:
  workflow_dispatch:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2, master]
    paths:
      - backend/tools/zel_vwap_source_provenance_v1.py
      - .github/workflows/zel-vwap-source-provenance-v1.yml

permissions:
  contents: read

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inventory provenance read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-vwap-source-provenance-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            control/backend/tools/zel_vwap_source_provenance_v1.py \
            "$VPS_USER@$VPS_HOST:$remote/"
          timeout 1200s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "/home/z/z/.venv/bin/python '$remote/zel_vwap_source_provenance_v1.py' \
              --root /home/z/z \
              --expected-sha 52d2a4454311a604edcb9d74596dc65d092c84267e5fc439b794becd5432e338 \
              --active-sha 7f48c77c82d266165eb5c790557c9b6497d3ddd3d8ccb84c719a39be5d84ac67 \
              --stdout" > out/result.json
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'"
          python -m json.tool out/result.json >/dev/null
      - name: Verify no mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/result.json').read_text())
          assert r['state']=='PASS_VWAP_SOURCE_PROVENANCE_INVENTORY',r
          assert r['canonical_mutated'] is False and r['registry_mutated'] is False,r
          assert r['runtime_mutated'] is False and r['formal_ledger_mutated'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED',r
          print({'cause':r['cause'],'copies':r['copy_count'],'expected_matches':r['expected_match_count'],'git_head_sha':r['git'].get('head_content_sha256')})
          PY
      - name: Cleanup key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-vwap-source-provenance-v1-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
