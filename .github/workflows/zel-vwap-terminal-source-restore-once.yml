name: ZEL VWAP Terminal Source Restore Once

on:
  pull_request:
    branches: [zel-alpha-unattended-champion-v2]
    paths:
      - backend/tools/zel_vwap_terminal_source_restore_v1.py
      - .github/workflows/zel-vwap-terminal-source-restore-once.yml

permissions:
  contents: read

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: python -m py_compile control/backend/tools/zel_vwap_terminal_source_restore_v1.py
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ssh" ~/.ssh out
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.ssh/vps_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Atomic restore and registry validation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/zel-vwap-terminal-source-restore-${GITHUB_RUN_ID}"
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$remote'"
          scp -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes control/backend/tools/zel_vwap_terminal_source_restore_v1.py "$VPS_USER@$VPS_HOST:$remote/"
          set +e
          timeout 1200s ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "engine=/opt/zel/research-runtime/data-b-v2/zel_historical_oos_exact25_replay_v1.py; \
             test -f \"\$engine\"; \
             /home/z/z/.venv/bin/python '$remote/zel_vwap_terminal_source_restore_v1.py' \
               --active /home/z/z/backend/strategies/vwap_revert.py \
               --expected /home/z/z/runtime/r7a4d2_vwap_revert_geometry_closure/backup_20260721T122922Z/vwap_revert.py \
               --backup-root /home/z/z/runtime/zel_vwap_terminal_source_restore_v1 \
               --engine \"\$engine\" \
               --source-root /home/z/z \
               --data-root /opt/zel/historical-oos-v1 \
               --out '$remote/result.json'" > out/stdout.log 2>out/stderr.log
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "cat '$remote/result.json'" > out/result.json
          fi
          ssh -i "$GITHUB_WORKSPACE/.ssh/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -rf '$remote'"
          if [ "$rc" -ne 0 ]; then cat out/stdout.log; cat out/stderr.log; exit "$rc"; fi
          rm -f out/stdout.log out/stderr.log
          python -m json.tool out/result.json >/dev/null
      - name: Verify restoration receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/result.json').read_text())
          assert r['state']=='PASS_VWAP_TERMINAL_SOURCE_RESTORED',r
          assert r['before_sha256']=='7f48c77c82d266165eb5c790557c9b6497d3ddd3d8ccb84c719a39be5d84ac67',r
          assert r['after_sha256']=='52d2a4454311a604edcb9d74596dc65d092c84267e5fc439b794becd5432e338',r
          assert r['registry_count']==25,r
          assert r['registry_owner_sha256']==r['after_sha256'],r
          assert r['rollback_ready'] is True and r['rolled_back'] is False,r
          assert r['execution_authority']=='NONE' and r['order_authority']=='BLOCKED',r
          print({'state':r['state'],'before':r['before_sha256'],'after':r['after_sha256'],'registry_count':r['registry_count'],'rollback_path':r['rollback_path']})
          PY
      - name: Cleanup key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ssh/vps_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-vwap-terminal-source-restore-once-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 90
