name: ZEL ZBot AI Envelope V1

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/tools/zel_zbot_ai_envelope_v1.py'
      - 'backend/research/zel_zbot_review_request_v1.json'
      - 'tests/test_zel_zbot_ai_envelope_v1.py'
      - '.github/workflows/zel-zbot-ai-envelope-v1.yml'
  push:
    branches: [master]
    paths:
      - 'backend/research/zel_zbot_review_request_v1.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: zel-zbot-ai-envelope-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas pytest
      - run: |
          python -m py_compile backend/tools/zel_zbot_ai_envelope_v1.py tests/test_zel_zbot_ai_envelope_v1.py
          python -m pytest -q tests/test_zel_zbot_ai_envelope_v1.py tests/test_zel_manual_video_improvement_v1.py

  review:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check groq
      - name: Read source request
        id: request
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads(Path('backend/research/zel_zbot_review_request_v1.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"run_id={row['source_run_id']}\n")
              h.write(f"artifact={row['source_artifact']}\n")
              h.write(f"request_id={row['request_id']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact }}
          path: input/source
          github-token: ${{ github.token }}
          run-id: ${{ steps.request.outputs.run_id }}
      - name: Normalize ZBot advisor review envelope
        run: |
          source=$(find input/source -path '*manual/hypotheses/*ZBOT_PROFILE*.json' -print -quit)
          gemini=$(find input/source -path '*manual/gemini_artifact.json' -print -quit)
          test -n "$source" -a -n "$gemini"
          mkdir -p out/review
          cp "$gemini" out/gemini_artifact.json
          python backend/tools/zel_zbot_ai_envelope_v1.py --input "$source" --output out/zbot_review_input.json
      - name: Run Groq and Workers review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          test -n "${GROQ_API_KEY:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_WORKERS_AI_TOKEN:-}"
          set +e
          python scripts/strategy11_ai_review_router.py \
            --stage PRE_REPLAY_EXTERNAL_HYPOTHESIS --mode execute \
            --input out/zbot_review_input.json \
            --gemini-artifact out/gemini_artifact.json \
            --output out/review/router.json
          rc=$?
          set -e
          test -s out/review/router.json
          echo "$rc" > out/review/router_rc.txt
      - name: Build targeted receipt
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          row=json.loads(Path('out/review/router.json').read_text())
          providers=row.get('provider_results') or {}
          def decision(name):
              return (((providers.get(name) or {}).get('artifact') or {}).get('review') or {}).get('decision')
          def reason(name):
              return (((providers.get(name) or {}).get('artifact') or {}).get('review') or {}).get('reason')
          groq=decision('groq'); workers=decision('workers_ai')
          receipt={
            'schema_version':'zel.zbot_ai_envelope.receipt.v1',
            'state':'PASS_ZBOT_AI_AXIS_NORMALIZED',
            'request_id':os.environ['REQUEST_ID'],
            'source_run_id':30663323052,
            'changed_axis':'ADVISOR_PROFILE',
            'component_axis':'ZBOT_PROFILE',
            'groq_decision':groq,
            'groq_reason':reason('groq'),
            'workers_decision':workers,
            'workers_reason':reason('workers_ai'),
            'joint_ai_approval':groq=='PASS_TO_REPLAY' and workers=='PASS_TO_REPLAY',
            'deterministic_replay_delta_net_pct_points':0.0,
            'source_file_mutated':False,
            'performance_claim_allowed':False,
            'promotion_authority':False,
            'execution_allowed':False,
            'execution_authority':'NONE',
            'order_authority':'BLOCKED',
            'runtime_bound':False,
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('out/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish targeted result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('out/receipt.json').read_text())
          text='\n'.join([
            '<!-- zbot-axis:'+r['request_id']+' -->',
            '### ZBot AI Axis Receipt',
            f"- run: [{os.environ['GITHUB_RUN_ID']}]({os.environ['RUN_URL']})",
            f"- state: `{r['state']}`",
            f"- axis: `{r['changed_axis']}` → component `{r['component_axis']}`",
            f"- Groq: `{r['groq_decision']}` — {r['groq_reason']}",
            f"- Workers: `{r['workers_decision']}` — {r['workers_reason']}",
            f"- joint approval: `{r['joint_ai_approval']}`",
            f"- deterministic delta: `{r['deterministic_replay_delta_net_pct_points']}%p`",
            f"- authority: execution=`{r['execution_authority']}` order=`{r['order_authority']}` promotion=`{r['promotion_authority']}`",
            f"- receipt: `{r['receipt_sha256']}`",
          ])+'\n'
          Path('comment.md').write_text(text)
          PY
          gh issue comment 433 --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zel-zbot-ai-envelope-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
