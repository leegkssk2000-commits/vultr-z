repos:
- repo: https://github.com/psf/black
  rev: 24.8.0
  hooks: [{id: black, exclude: ^backend/research/rebuild/a1_exact25_generic_evaluator_v1\.py$}]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.6.9
  hooks: [{id: ruff, exclude: ^backend/research/rebuild/a1_exact25_generic_evaluator_v1\.py$}]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.10.0
  hooks: [{id: mypy, exclude: ^backend/research/rebuild/a1_exact25_generic_evaluator_v1\.py$, args: ["--ignore-missing-imports", "--scripts-are-modules", "--explicit-package-bases"], additional_dependencies: ["types-requests"]}]
# The exact saved evaluator bytes are a historical source contract.
# Its complete .pyi retains normal formatting, lint, and type checks.
- repo: local
  hooks:
  - id: frozen-exact25-source
    name: Verify immutable Exact25 source and complete type stub
    entry: python3 scripts/verify_frozen_exact25_source_v1.py
    language: system
    always_run: true
    pass_filenames: false
