(function(){
  var HIDE_IDS = new Set(["zops-ledger-runtime-root","zops-replay-runtime-root"]);
  var HIDE_TEXTS = new Set(["ledger offline","replay offline","__legacy_web_audit_replay_body_mount_removed__"]);

  function isEl(n){ return n && n.nodeType === 1; }
  function norm(t){ return (t || "").replace(/\s+/g, " ").trim().toLowerCase(); }
  function stylePos(el){ try { return window.getComputedStyle(el).position; } catch(e){ return ""; } }

  function hideNode(node){
    if (!isEl(node)) return;
    if (node.id && HIDE_IDS.has(node.id)) {
      node.style.setProperty('display','none','important');
      return;
    }
    var text = norm(node.textContent || "");
    if (HIDE_TEXTS.has(text)) {
      var target = node;
      for (var i = 0; i < 5 && target && target.parentElement; i++) {
        if (HIDE_IDS.has(target.id) || stylePos(target) === 'fixed') break;
        target = target.parentElement;
      }
      if (target) target.style.setProperty('display','none','important');
    }
  }

  function scan(root){
    if (!root) return;
    if (isEl(root)) hideNode(root);
    var nodes = [];
    try { nodes = root.querySelectorAll ? root.querySelectorAll('*') : []; } catch(e) { nodes = []; }
    for (var i = 0; i < nodes.length; i++) hideNode(nodes[i]);
  }

  function boot(){
    scan(document);
    var mo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){ if (isEl(n)) scan(n); });
      });
    });
    mo.observe(document.documentElement || document.body, { childList:true, subtree:true });
    window.setTimeout(function(){ scan(document); }, 300);
    window.setTimeout(function(){ scan(document); }, 1200);
    window.setTimeout(function(){ scan(document); }, 3000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once:true });
  else boot();
})();
